<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>EXPRESS MONITOR - Control Total</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { background: #0f172a; font-family: system-ui, -apple-system, sans-serif; padding: 16px; }
        .table-wrapper { overflow-x: auto; background: #1e293b; border-radius: 20px; border: 1px solid #334155; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 900px; }
        th { background: #334155; padding: 12px; text-align: left; color: white; font-weight: 600; position: sticky; top: 0; }
        td { padding: 10px 12px; border-bottom: 1px solid #334155; color: #e2e8f0; }
        tr:hover { background: #334155; cursor: pointer; }
        .estado-recibido { color: #22d3ee; font-weight: bold; }
        .estado-proceso { color: #fbbf24; font-weight: bold; }
        .estado-listo { color: #4ade80; font-weight: bold; }
        .critico { background: rgba(239, 68, 68, 0.25) !important; border-left: 3px solid #ef4444; }
        .alerta { background: rgba(245, 158, 11, 0.15) !important; border-left: 3px solid #f59e0b; }
        .sonando { animation: sonidoPulse 1.5s infinite; background: rgba(239, 68, 68, 0.4) !important; }
        @keyframes sonidoPulse { 0% { background: rgba(239, 68, 68, 0.3); } 50% { background: rgba(239, 68, 68, 0.7); } 100% { background: rgba(239, 68, 68, 0.3); } }
        .btn-ok { background: #22c55e; color: white; border: none; padding: 5px 14px; border-radius: 30px; cursor: pointer; font-size: 11px; font-weight: bold; transition: all 0.2s; }
        .btn-ok:hover { background: #16a34a; transform: scale(1.02); }
        .btn-ok.atendido { background: #16a34a; opacity: 0.6; cursor: default; }
        .btn-danger { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 30px; cursor: pointer; font-weight: bold; }
        .btn-danger:hover { background: #dc2626; }
        .btn-secondary { background: #64748b; color: white; border: none; padding: 8px 16px; border-radius: 30px; cursor: pointer; font-weight: bold; }
        .btn-secondary:hover { background: #475569; }
        .btn-success { background: #22c55e; color: white; border: none; padding: 8px 16px; border-radius: 30px; cursor: pointer; font-weight: bold; }
        .stats-card { background: #1e293b; border-radius: 16px; padding: 12px; text-align: center; border: 1px solid #334155; }
        audio { display: none; }
        .filtro-btn { background: #334155; padding: 6px 14px; border-radius: 30px; font-size: 12px; cursor: pointer; transition: all 0.2s; }
        .filtro-btn.activo { background: #06b6d4; color: #0f172a; font-weight: bold; }
        .filtro-btn:hover { background: #475569; }
        .badge-sonido { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
        .badge-sonido.on { background: #22c55e; box-shadow: 0 0 5px #22c55e; animation: pulse 1s infinite; }
        .badge-sonido.off { background: #64748b; }
    </style>
</head>
<body>

<div class="max-w-full mx-auto">
    
    <!-- HEADER -->
    <div class="flex flex-wrap justify-between items-center gap-3 mb-5">
        <div>
            <h1 class="text-2xl font-bold text-white">📊 EXPRESS MONITOR</h1>
            <p class="text-white/40 text-sm">Central de pedidos en tiempo real</p>
        </div>
        <div class="flex gap-2">
            <button id="btnSilenciar" class="px-4 py-2 rounded-full text-sm font-bold bg-red-600 text-white">
                <span class="badge-sonido on" id="sonidoBadge"></span> 🔇 SILENCIAR TODO
            </button>
            <button id="btnLimpiarTodo" class="btn-danger">🗑️ ATENDER TODOS</button>
            <button id="btnReset" class="btn-secondary">🔄 RESET VISTA</button>
        </div>
    </div>

    <!-- ESTADÍSTICAS -->
    <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-5">
        <div class="stats-card"><div class="text-2xl font-bold text-cyan-400" id="totalPedidos">0</div><div class="text-[10px] text-white/40">EN PANTALLA</div></div>
        <div class="stats-card"><div class="text-2xl font-bold text-red-400" id="criticosCount">0</div><div class="text-[10px] text-white/40">CRÍTICOS (10+ min)</div></div>
        <div class="stats-card"><div class="text-2xl font-bold text-yellow-400" id="alertaCount">0</div><div class="text-[10px] text-white/40">ALERTA (5-9 min)</div></div>
        <div class="stats-card"><div class="text-2xl font-bold text-green-400" id="atendidosHoy">0</div><div class="text-[10px] text-white/40">ATENDIDOS HOY</div></div>
        <div class="stats-card"><div class="text-2xl font-bold text-blue-400" id="sonandoCount">0</div><div class="text-[10px] text-white/40">SONANDO AHORA</div></div>
    </div>

    <!-- FILTROS POR RESTAURANTE -->
    <div class="mb-4">
        <div class="text-xs text-white/40 mb-2">🏪 FILTRAR POR RESTAURANTE</div>
        <div id="filtrosContainer" class="flex flex-wrap gap-2"></div>
    </div>

    <!-- TABLA DE PEDIDOS -->
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>✅ OK</th>
                    <th>ID</th>
                    <th>CLIENTE</th>
                    <th>DIRECCIÓN</th>
                    <th>TOTAL</th>
                    <th>ESTADO</th>
                    <th>RESTAURANTE</th>
                    <th>TIEMPO</th>
                    <th>🔊</th>
                </tr>
            </thead>
            <tbody id="tablaBody">
                <tr><td colspan="9" class="text-center py-10 text-white/40">Cargando pedidos...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<audio id="audioAlerta" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
</audio>

<script>
    // ============================================
    // CONFIGURACIÓN
    // ============================================
    const STORAGE_KEY = 'express_monitor_atendidos';
    const firebaseConfig = { databaseURL: "https://aguadulce-notificaciones-default-rtdb.firebaseio.com/" };
    
    // Estado global
    let audioGlobal = null;
    let sonidoActivado = true;
    let pedidosAtendidos = new Set();      // IDs atendidos (OK)
    let pedidosSonando = new Set();         // IDs que tienen sonido activo
    let intervalosActivos = new Map();      // id -> intervalId
    let todosPedidos = [];                  // Todos los pedidos desde Firebase
    let filtroRestauranteActual = "TODOS";
    let restaurantesLista = [];
    
    // ============================================
    // UTILITARIOS
    // ============================================
    function formatearFechaParaComparar(fechaRaw) {
        if (!fechaRaw) return "";
        if (fechaRaw.includes('T')) {
            return new Date(fechaRaw).toLocaleDateString('es-ES');
        }
        if (fechaRaw.includes('/')) {
            return fechaRaw.split(' ')[0];
        }
        return "";
    }
    
    function calcularMinutos(fechaRaw) {
        if (!fechaRaw) return 999;
        let fechaDate;
        try {
            if (fechaRaw.includes('T')) {
                fechaDate = new Date(fechaRaw);
            } else if (fechaRaw.includes('/')) {
                const partes = fechaRaw.split(' ');
                const fechaParte = partes[0];
                const horaParte = partes[1] || '00:00:00';
                const [dia, mes, anio] = fechaParte.split('/');
                const [hora, min, seg] = horaParte.split(':');
                fechaDate = new Date(anio, mes-1, dia, hora, min, seg);
            } else {
                fechaDate = new Date(fechaRaw);
            }
        } catch(e) {
            return 999;
        }
        if (!fechaDate || isNaN(fechaDate)) return 999;
        return Math.floor((new Date() - fechaDate) / 60000);
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
    }
    
    // ============================================
    // GESTIÓN DE ATENDIDOS (localStorage)
    // ============================================
    function cargarAtendidos() {
        const guardados = localStorage.getItem(STORAGE_KEY);
        if (guardados) {
            pedidosAtendidos = new Set(JSON.parse(guardados));
            console.log("📦 Atendidos cargados:", pedidosAtendidos.size);
        }
    }
    
    function guardarAtendidos() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify([...pedidosAtendidos]));
        actualizarStatsAtendidos();
    }
    
    function actualizarStatsAtendidos() {
        const hoy = new Date().toLocaleDateString('es-ES');
        let atendidosHoy = 0;
        
        for (const id of pedidosAtendidos) {
            const pedido = todosPedidos.find(p => p.id === id);
            if (pedido) {
                const fechaStr = formatearFechaParaComparar(pedido.fecha);
                if (fechaStr === hoy) atendidosHoy++;
            }
        }
        document.getElementById('atendidosHoy').textContent = atendidosHoy;
    }
    
    // ============================================
    // GESTIÓN DE SONIDO
    // ============================================
    function playSound() {
        if (!sonidoActivado) return;
        if (!audioGlobal) return;
        audioGlobal.currentTime = 0;
        audioGlobal.play().catch(e => console.log("Click en pantalla para activar sonido"));
    }
    
    function iniciarSonidoPedido(idPedido) {
        if (!sonidoActivado) return;
        if (pedidosAtendidos.has(idPedido)) return;
        if (pedidosSonando.has(idPedido)) return;
        
        console.log("🔔 INICIANDO SONIDO para:", idPedido);
        pedidosSonando.add(idPedido);
        
        // Sonido inmediato
        playSound();
        
        // Intervalo cada 5 segundos
        const intervalo = setInterval(() => {
            if (pedidosAtendidos.has(idPedido)) {
                detenerSonidoPedido(idPedido);
                return;
            }
            if (sonidoActivado) {
                console.log("🔔 PITIDO cada 5s - Pedido:", idPedido);
                playSound();
            }
        }, 5000);
        
        intervalosActivos.set(idPedido, intervalo);
        document.getElementById('sonandoCount').textContent = pedidosSonando.size;
        renderizarTabla();
    }
    
    function detenerSonidoPedido(idPedido) {
        if (intervalosActivos.has(idPedido)) {
            clearInterval(intervalosActivos.get(idPedido));
            intervalosActivos.delete(idPedido);
        }
        pedidosSonando.delete(idPedido);
        document.getElementById('sonandoCount').textContent = pedidosSonando.size;
    }
    
    function detenerTodosLosSonidos() {
        for (const [id, intervalo] of intervalosActivos) {
            clearInterval(intervalo);
        }
        intervalosActivos.clear();
        pedidosSonando.clear();
        document.getElementById('sonandoCount').textContent = 0;
        if (audioGlobal) {
            audioGlobal.pause();
            audioGlobal.currentTime = 0;
        }
    }
    
    function silenciarTodo() {
        sonidoActivado = false;
        detenerTodosLosSonidos();
        const btn = document.getElementById('btnSilenciar');
        btn.innerHTML = '<span class="badge-sonido off"></span> 🔊 ACTIVAR SONIDO';
        btn.classList.remove('bg-red-600');
        btn.classList.add('bg-green-600');
        document.getElementById('sonidoBadge').className = 'badge-sonido off';
    }
    
    function activarSonido() {
        sonidoActivado = true;
        // Reiniciar sonidos para pedidos no atendidos
        todosPedidos.forEach(p => {
            const estado = (p.estado || '').toUpperCase();
            if (!pedidosAtendidos.has(p.id) && estado !== 'ENTREGADO' && estado !== 'FINALIZADO' && estado !== 'RECHAZADO') {
                iniciarSonidoPedido(p.id);
            }
        });
        const btn = document.getElementById('btnSilenciar');
        btn.innerHTML = '<span class="badge-sonido on"></span> 🔇 SILENCIAR TODO';
        btn.classList.remove('bg-green-600');
        btn.classList.add('bg-red-600');
        document.getElementById('sonidoBadge').className = 'badge-sonido on';
    }
    
    // ============================================
    // ACCIONES DE USUARIO
    // ============================================
    function atenderPedido(idPedido) {
        if (pedidosAtendidos.has(idPedido)) return;
        
        console.log("✅ ATENDIENDO pedido:", idPedido);
        
        // Detener sonido inmediatamente
        detenerSonidoPedido(idPedido);
        
        // Marcar como atendido
        pedidosAtendidos.add(idPedido);
        guardarAtendidos();
        
        // Renderizar
        renderizarTabla();
        
        // Feedback visual
        const msg = document.createElement('div');
        msg.className = 'fixed top-20 right-4 bg-green-600 text-white px-4 py-2 rounded-lg shadow-lg z-50 text-sm';
        msg.textContent = `✅ Pedido ${idPedido} atendido`;
        document.body.appendChild(msg);
        setTimeout(() => msg.remove(), 2000);
    }
    
    function atenderTodosVisibles() {
        const pedidosVisibles = todosPedidos.filter(p => {
            const estado = (p.estado || '').toUpperCase();
            return !pedidosAtendidos.has(p.id) && 
                   estado !== 'ENTREGADO' && 
                   estado !== 'FINALIZADO' && 
                   estado !== 'RECHAZADO';
        });
        
        console.log("✅ ATENDIENDO TODOS:", pedidosVisibles.length, "pedidos");
        
        for (const p of pedidosVisibles) {
            detenerSonidoPedido(p.id);
            pedidosAtendidos.add(p.id);
        }
        
        guardarAtendidos();
        renderizarTabla();
        
        const msg = document.createElement('div');
        msg.className = 'fixed top-20 right-4 bg-green-600 text-white px-4 py-2 rounded-lg shadow-lg z-50 text-sm';
        msg.textContent = `✅ ${pedidosVisibles.length} pedido(s) atendidos`;
        document.body.appendChild(msg);
        setTimeout(() => msg.remove(), 2000);
    }
    
    function resetVista() {
        console.log("🔄 RESET VISTA - Mostrando todos los pedidos nuevamente");
        
        // Limpiar atendidos
        pedidosAtendidos.clear();
        guardarAtendidos();
        
        // Detener sonidos actuales
        detenerTodosLosSonidos();
        
        // Reiniciar sonidos para pedidos activos
        todosPedidos.forEach(p => {
            const estado = (p.estado || '').toUpperCase();
            if (estado !== 'ENTREGADO' && estado !== 'FINALIZADO' && estado !== 'RECHAZADO') {
                iniciarSonidoPedido(p.id);
            }
        });
        
        renderizarTabla();
        
        const msg = document.createElement('div');
        msg.className = 'fixed top-20 right-4 bg-blue-600 text-white px-4 py-2 rounded-lg shadow-lg z-50 text-sm';
        msg.textContent = `🔄 Vista reseteada - Todos los pedidos visibles`;
        document.body.appendChild(msg);
        setTimeout(() => msg.remove(), 2000);
    }
    
    // ============================================
    // RENDERIZADO DE TABLA
    // ============================================
    function renderizarTabla() {
        // Filtrar por estado (solo activos: no entregados, no finalizados, no rechazados)
        let pedidosActivos = todosPedidos.filter(p => {
            const estado = (p.estado || '').toUpperCase();
            return estado !== 'ENTREGADO' && 
                   estado !== 'FINALIZADO' && 
                   estado !== 'RECHAZADO' && 
                   estado !== 'CANCELADO';
        });
        
        // Aplicar filtro de restaurante
        if (filtroRestauranteActual !== "TODOS") {
            pedidosActivos = pedidosActivos.filter(p => p.restaurante_nombre === filtroRestauranteActual);
        }
        
        // Excluir atendidos
        const pedidosVisibles = pedidosActivos.filter(p => !pedidosAtendidos.has(p.id));
        
        // Ordenar por fecha (más reciente primero)
        pedidosVisibles.sort((a, b) => {
            const fechaA = a.fecha ? new Date(a.fecha) : 0;
            const fechaB = b.fecha ? new Date(b.fecha) : 0;
            return fechaB - fechaA;
        });
        
        // Estadísticas
        const criticos = pedidosVisibles.filter(p => {
            const minutos = calcularMinutos(p.fecha);
            const estado = (p.estado || '').toUpperCase();
            return minutos >= 10 && (estado === 'RECIBIDO' || estado === 'NUEVO' || estado === 'EN PROCESO');
        }).length;
        
        const alerta = pedidosVisibles.filter(p => {
            const minutos = calcularMinutos(p.fecha);
            const estado = (p.estado || '').toUpperCase();
            return minutos >= 5 && minutos < 10 && (estado === 'RECIBIDO' || estado === 'NUEVO');
        }).length;
        
        document.getElementById('totalPedidos').textContent = pedidosVisibles.length;
        document.getElementById('criticosCount').textContent = criticos;
        document.getElementById('alertaCount').textContent = alerta;
        document.getElementById('sonandoCount').textContent = pedidosSonando.size;
        
        const tbody = document.getElementById('tablaBody');
        
        if (pedidosVisibles.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" class="text-center py-10 text-white/40">✅ No hay pedidos pendientes</td></tr>';
            return;
        }
        
        let html = '';
        for (const p of pedidosVisibles) {
            const minutos = calcularMinutos(p.fecha);
            const estado = (p.estado || 'RECIBIDO').toUpperCase();
            const estaSonando = pedidosSonando.has(p.id);
            
            // Clase de fila
            let rowClass = '';
            let tiempoTexto = minutos < 1 ? '🆕 Ahora' : `${minutos} min`;
            
            if (minutos >= 10 && (estado === 'RECIBIDO' || estado === 'NUEVO' || estado === 'EN PROCESO')) {
                rowClass = 'critico';
                tiempoTexto = `🔴 ${minutos} min`;
            } else if (minutos >= 5 && (estado === 'RECIBIDO' || estado === 'NUEVO')) {
                rowClass = 'alerta';
                tiempoTexto = `🟡 ${minutos} min`;
            }
            
            if (estaSonando) rowClass += ' sonando';
            
            // Estado con color
            let estadoClass = '';
            if (estado === 'RECIBIDO' || estado === 'NUEVO') estadoClass = 'estado-recibido';
            else if (estado === 'EN PROCESO') estadoClass = 'estado-proceso';
            else if (estado === 'LISTO') estadoClass = 'estado-listo';
            
            html += `
                <tr class="${rowClass}">
                    <td><button class="btn-ok" onclick="window.atenderPedido('${p.id}')">✓ OK</button></td>
                    <td class="font-mono text-cyan-400 text-xs font-bold">${escapeHtml(p.id)}</td>
                    <td class="max-w-[150px] truncate font-medium">${escapeHtml(p.cliente || 'Sin nombre')}</td>
                    <td class="max-w-[200px] truncate text-white/70" title="${escapeHtml(p.direccion || '')}">${escapeHtml((p.direccion || '').substring(0, 45))}</td>
                    <td class="font-bold text-emerald-400">${parseFloat(p.total || 0).toFixed(2)}€</td>
                    <td class="${estadoClass}">${estado}</td>
                    <td class="max-w-[130px] truncate">🏪 ${escapeHtml(p.restaurante_nombre || 'Restaurante')}</td>
                    <td class="text-white/60 text-sm whitespace-nowrap">${tiempoTexto}</td>
                    <td class="text-center">${estaSonando ? '🔔 SONANDO' : '🔇'}</td>
                </tr>
            `;
        }
        tbody.innerHTML = html;
        actualizarStatsAtendidos();
    }
    
    // ============================================
    // FILTROS DE RESTAURANTE
    // ============================================
    function actualizarFiltrosRestaurante() {
        const restaurantes = [...new Set(todosPedidos.map(p => p.restaurante_nombre).filter(r => r))].sort();
        restaurantesLista = restaurantes;
        
        const container = document.getElementById('filtrosContainer');
        let html = `<div class="filtro-btn ${filtroRestauranteActual === 'TODOS' ? 'activo' : ''}" data-restaurante="TODOS">📋 TODOS</div>`;
        
        for (const r of restaurantes) {
            const count = todosPedidos.filter(p => p.restaurante_nombre === r && 
                (p.estado || '').toUpperCase() !== 'ENTREGADO').length;
            html += `<div class="filtro-btn ${filtroRestauranteActual === r ? 'activo' : ''}" data-restaurante="${escapeHtml(r)}">🏪 ${escapeHtml(r)} (${count})</div>`;
        }
        
        container.innerHTML = html;
        
        // Event listeners
        document.querySelectorAll('.filtro-btn').forEach(btn => {
            btn.onclick = () => {
                filtroRestauranteActual = btn.getAttribute('data-restaurante');
                renderizarTabla();
                // Actualizar estilos
                document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('activo'));
                btn.classList.add('activo');
            };
        });
    }
    
    // ============================================
    // CARGA DESDE FIREBASE
    // ============================================
    let primerCarga = true;
    
    function cargarDesdeFirebase() {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const pedidosRef = db.ref('pedidos');
        
        pedidosRef.once('value', (snap) => {
            const nuevosPedidos = [];
            snap.forEach((child) => {
                const pedido = child.val();
                pedido.id = child.key;  // Asegurar que el id existe
                nuevosPedidos.push(pedido);
            });
            
            console.log("📦 Pedidos desde Firebase:", nuevosPedidos.length);
            todosPedidos = nuevosPedidos;
            
            // Actualizar filtros
            actualizarFiltrosRestaurante();
            
            // Iniciar sonidos para pedidos no atendidos
            if (sonidoActivado) {
                todosPedidos.forEach(p => {
                    const estado = (p.estado || '').toUpperCase();
                    if (!pedidosAtendidos.has(p.id) && 
                        estado !== 'ENTREGADO' && 
                        estado !== 'FINALIZADO' && 
                        estado !== 'RECHAZADO') {
                        iniciarSonidoPedido(p.id);
                    }
                });
            }
            
            renderizarTabla();
            primerCarga = false;
        });
        
        // Escuchar NUEVOS pedidos en tiempo real
        pedidosRef.on('child_added', (snap) => {
            const nuevoPedido = snap.val();
            nuevoPedido.id = snap.key;
            
            const existe = todosPedidos.some(p => p.id === nuevoPedido.id);
            if (!existe) {
                console.log("🆕 NUEVO PEDIDO DETECTADO:", nuevoPedido.id);
                todosPedidos.unshift(nuevoPedido);
                
                // Actualizar filtros si es un restaurante nuevo
                actualizarFiltrosRestaurante();
                
                // Iniciar sonido si es necesario
                const estado = (nuevoPedido.estado || '').toUpperCase();
                if (!pedidosAtendidos.has(nuevoPedido.id) && 
                    estado !== 'ENTREGADO' && 
                    estado !== 'FINALIZADO' && 
                    estado !== 'RECHAZADO') {
                    iniciarSonidoPedido(nuevoPedido.id);
                    
                    // Notificación de escritorio
                    if (Notification.permission === 'granted' && !primerCarga) {
                        new Notification('🆕 NUEVO PEDIDO', {
                            body: `${nuevoPedido.cliente || 'Cliente'} - ${nuevoPedido.restaurante_nombre || 'Restaurante'} - ${parseFloat(nuevoPedido.total || 0).toFixed(2)}€`,
                            icon: 'https://i.postimg.cc/mZwjLXxw/Logo-Aguadulce-Express.jpg'
                        });
                    }
                }
                
                renderizarTabla();
            }
        });
        
        // Escuchar CAMBIOS en pedidos
        pedidosRef.on('child_changed', (snap) => {
            const pedidoActualizado = snap.val();
            pedidoActualizado.id = snap.key;
            
            const index = todosPedidos.findIndex(p => p.id === pedidoActualizado.id);
            if (index !== -1) {
                todosPedidos[index] = pedidoActualizado;
                renderizarTabla();
            }
        });
    }
    
    // ============================================
    // INICIALIZACIÓN
    // ============================================
    function init() {
        audioGlobal = document.getElementById('audioAlerta');
        if (audioGlobal) audioGlobal.volume = 0.8;
        
        // Activar audio con un click del usuario (requisito del navegador)
        document.body.addEventListener('click', () => {
            if (audioGlobal && sonidoActivado && pedidosSonando.size > 0) {
                audioGlobal.play().catch(e => console.log("Audio listo"));
            }
        }, { once: true });
        
        cargarAtendidos();
        
        // Event listeners de botones
        document.getElementById('btnSilenciar').onclick = () => {
            if (sonidoActivado) silenciarTodo();
            else activarSonido();
        };
        document.getElementById('btnLimpiarTodo').onclick = () => atenderTodosVisibles();
        document.getElementById('btnReset').onclick = () => resetVista();
        
        cargarDesdeFirebase();
        
        // Refresco cada 15 segundos para sincronizar
        setInterval(() => {
            cargarDesdeFirebase();
        }, 15000);
        
        // Solicitar permisos de notificación
        if ('Notification' in window && Notification.permission !== 'granted' && Notification.permission !== 'denied') {
            Notification.requestPermission();
        }
        
        console.log("🚀 Monitor inicializado correctamente");
    }
    
    // Exponer funciones globales
    window.atenderPedido = atenderPedido;
    
    init();
</script>
</body>
</html>
