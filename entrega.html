<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reparto Express - Aguadulce</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        :root { --cyan: #06b6d4; --dark: #020617; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--dark); color: white; margin: 0; }
        .card-reparto { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 2rem; padding: 20px; margin-bottom: 15px; }
        #loader { position: fixed; inset: 0; background: var(--dark); z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(6,182,212,0.1); border-top-color: var(--cyan); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .badge-tiempo { background: rgba(6, 182, 212, 0.1); border: 1px solid rgba(6, 182, 212, 0.3); color: var(--cyan); padding: 4px 10px; border-radius: 10px; font-size: 11px; font-weight: 800; }
        .blink { animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
        .timer-espera { background: #eab308; color: black; padding: 12px; border-radius: 16px; text-align: center; font-weight: 900; font-size: 14px; margin: 10px 0; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner mb-4"></div>
        <p class="text-cyan-400 text-[10px] font-black uppercase tracking-widest">Iniciando Terminal de Reparto...</p>
    </div>

    <header class="p-6 bg-gradient-to-b from-cyan-900/20 to-transparent">
        <div class="flex justify-between items-center mb-6">
            <div class="flex items-center gap-4">
                <button onclick="cerrarSesion()" class="p-3 bg-white/5 border border-white/10 rounded-2xl">
                    <span class="text-lg">🚪</span>
                </button>
                <div>
                    <h1 id="nombre-repartidor" class="text-xl font-black italic uppercase leading-tight">REPARTIDOR</h1>
                    <p id="codigo-ui" class="text-cyan-400 text-[10px] font-bold uppercase tracking-tighter">ID: ---</p>
                </div>
            </div>
            <div class="text-right">
                <p class="text-[8px] font-black text-white/40 uppercase">Billetera Hoy</p>
                <p id="saldo-billetera" class="text-xl font-black text-white">0.00€</p>
            </div>
        </div>
        
        <div id="status-bar" class="bg-white/5 p-4 rounded-2xl border border-white/10 flex justify-between items-center">
            <span class="text-[10px] font-black uppercase">Estado: <span id="txt-estado" class="text-green-400">Disponible</span></span>
            <div id="indicador-pedidos" class="text-[10px] font-black bg-cyan-400 text-black px-3 py-1 rounded-full">0/2 ACTIVOS</div>
        </div>
    </header>

    <main id="lista-pedidos" class="px-6 pb-32"></main>

    <script>
        // Configuración Firebase (misma que el cliente)
        const firebaseConfig = {
            apiKey: "AIzaSyCJcLQ0ikUwZSV7L_8mLLax8B5qnhP0Roc",
            authDomain: "aguadulce-notificaciones.firebaseapp.com",
            databaseURL: "https://aguadulce-notificaciones-default-rtdb.firebaseio.com",
            projectId: "aguadulce-notificaciones",
            storageBucket: "aguadulce-notificaciones.appspot.com",
            messagingSenderId: "940283725281",
            appId: "1:940283725281:web:3b388d2e7f362a99d2bea0"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzYFDShcrP7I4FKhiH3q5UcEInpSKJstrumJ9ddI4Tj9S31ZUgwiuie81fGFmCJ6ob2/exec';
        
        let miCodigo = localStorage.getItem('ae_cod_reparto');
        let pedidosActivos = [];
        let temporizadores = {};

        function mostrarMensaje(titulo, texto, icono) {
            Swal.fire({ title: titulo, text: texto, icon: icono, background: '#020617', color: 'white', confirmButtonColor: '#06b6d4' });
        }

        async function initReparto() {
            if(!miCodigo) {
                const { value: inputCodigo } = await Swal.fire({
                    title: '🔐 Código de Repartidor',
                    input: 'text',
                    inputPlaceholder: 'Ej: R001',
                    background: '#020617',
                    color: 'white',
                    confirmButtonColor: '#06b6d4',
                    showCancelButton: false
                });
                if(!inputCodigo) return location.reload();
                miCodigo = inputCodigo.trim().toUpperCase(); 
                localStorage.setItem('ae_cod_reparto', miCodigo);
            }
            document.getElementById('codigo-ui').innerText = `ID: ${miCodigo}`;
            
            database.ref('pedidosActivos').on('value', () => refrescarDatos());
            await refrescarDatos();
            document.getElementById('loader').style.display = 'none';
        }

        async function refrescarDatos() {
            try {
                const res = await fetch(`${scriptURL}?action=getPedidosReparto&idRepartidor=${miCodigo}&t=${Date.now()}`);
                const data = await res.json();
                
                if(data.error) {
                    mostrarMensaje('Error', data.error, 'error');
                    cerrarSesion();
                    return;
                }

                document.getElementById('saldo-billetera').innerText = (parseFloat(data.saldo) || 0).toFixed(2) + "€";
                document.getElementById('indicador-pedidos').innerText = `${data.pedidos.length}/2 ACTIVOS`;
                document.getElementById('nombre-repartidor').innerText = data.nombre || "REPARTIDOR";

                const snapshot = await database.ref('pedidos').once('value');
                const fbData = snapshot.val() || {};

                pedidosActivos = data.pedidos.map(p => {
                    const fbPedido = fbData[p.ID_PEDIDO];
                    return {
                        ...p,
                        timestampListo: fbPedido ? fbPedido.timestampListo : null,
                        notas: p.notas || "Sin instrucciones",
                        telefono: p.telf || p.WHATSAPP || ""
                    };
                });
                
                renderPedidos();
                document.getElementById('txt-estado').innerText = "Disponible";
                document.getElementById('txt-estado').className = "text-green-400";
            } catch (e) { 
                console.error(e);
                document.getElementById('txt-estado').innerText = "Offline";
                document.getElementById('txt-estado').className = "text-red-400";
            }
        }

        function renderPedidos() {
            const contenedor = document.getElementById('lista-pedidos');
            if(pedidosActivos.length === 0) {
                contenedor.innerHTML = `<div class="py-20 text-center opacity-30 font-black italic uppercase text-xs">Sin pedidos asignados...</div>`;
                return;
            }

            contenedor.innerHTML = pedidosActivos.map(p => {
                const estado = (p.ESTADO || "").toUpperCase();
                const telefonoLimpio = String(p.telefono || '').replace(/\D/g, '');
                const tieneTimer = temporizadores[p.ID_PEDIDO];
                
                let botones = '';
                if (estado === 'EN CAMINO') {
                    botones = `<button onclick="marcarLlegada('${p.ID_PEDIDO}')" class="w-full bg-yellow-500 text-black py-4 rounded-xl font-black uppercase text-[10px] italic">📍 HE LLEGADO</button>`;
                } else if (estado === 'LLEGÓ') {
                    botones = `
                        ${tieneTimer ? `<div class="timer-espera" id="timer-${p.ID_PEDIDO}">⏰ Esperando al cliente...</div>` : ''}
                        <div class="flex gap-3">
                            <button onclick="confirmarEntrega('${p.ID_PEDIDO}', ${p.TOTAL})" class="flex-1 bg-green-500 text-white py-4 rounded-xl font-black uppercase text-[10px] italic">💰 ENTREGAR</button>
                            ${!tieneTimer ? `<button onclick="iniciarTimerCancelacion('${p.ID_PEDIDO}', ${p.TOTAL})" class="flex-1 bg-red-500 text-white py-4 rounded-xl font-black uppercase text-[10px] italic">⏰ CLIENTE NO RESPONDE</button>` : ''}
                        </div>
                    `;
                } else {
                    botones = `<button onclick="marcarEnCamino('${p.ID_PEDIDO}')" class="w-full bg-white text-black py-4 rounded-xl font-black uppercase text-[10px] italic">🛵 RECOGER PEDIDO</button>`;
                }
                
                return `
                    <div class="card-reparto">
                        <div class="flex justify-between items-start mb-4">
                            <span class="bg-cyan-400 text-black px-3 py-1 rounded-lg text-[10px] font-black italic uppercase">${p.ESTADO || 'PREPARANDO'}</span>
                            <span class="text-white/40 text-[10px] font-bold">Ref: ${p.ID_PEDIDO}</span>
                        </div>
                        
                        <h3 class="font-black text-lg italic uppercase leading-tight mb-1">📍 ${p.DIRECCION}</h3>
                        
                        <div class="bg-white/5 rounded-xl p-3 my-3 text-left">
                            <p class="text-cyan-400 text-[8px] font-black uppercase">👤 CLIENTE</p>
                            <p class="text-sm font-bold">${p.CLIENTE}</p>
                            <div class="flex justify-between items-center mt-2">
                                <span>📞 ${p.telefono || 'No disponible'}</span>
                                ${telefonoLimpio ? `
                                    <div class="flex gap-2">
                                        <a href="tel:${telefonoLimpio}" class="bg-green-500 text-black px-3 py-1 rounded-lg text-[10px] font-bold">LLAMAR</a>
                                        <a href="https://wa.me/${telefonoLimpio}" target="_blank" class="bg-green-600 text-black px-3 py-1 rounded-lg text-[10px] font-bold">WHATSAPP</a>
                                    </div>
                                ` : ''}
                            </div>
                        </div>

                        <div class="mb-4 text-left">
                            <span class="timer-cocina badge-tiempo" data-time="${p.timestampListo || ''}">
                                ${p.timestampListo ? 'Calculando...' : '⏳ ESPERANDO COCINA'}
                            </span>
                        </div>
                        
                        <p class="text-white/60 text-xs mb-4">💳 Pago: ${p.PAGO || 'Efectivo'}</p>
                        
                        <div class="grid grid-cols-2 gap-3 mb-6">
                            <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.DIRECCION)}" target="_blank" class="bg-white/5 border border-white/10 p-4 rounded-xl text-center">
                                <span class="block text-[18px]">📍</span>
                                <span class="text-[8px] font-black uppercase text-cyan-400">Ver Mapa</span>
                            </a>
                            <a href="https://wa.me/${telefonoLimpio}" target="_blank" class="bg-white/5 border border-white/10 p-4 rounded-xl text-center">
                                <span class="block text-[18px]">💬</span>
                                <span class="text-[8px] font-black uppercase text-green-400">WhatsApp</span>
                            </a>
                        </div>

                        <div class="flex items-center justify-between gap-4">
                            <div class="text-left">
                                <p class="text-[8px] font-bold text-white/40 uppercase">Total:</p>
                                <p class="text-xl font-black text-cyan-400">${p.TOTAL}€</p>
                            </div>
                            ${botones}
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function marcarEnCamino(id) {
            document.getElementById('loader').style.display = 'flex';
            try {
                await fetch(`${scriptURL}?action=actualizarEstado&idPedido=${id}&nuevoEstado=EN CAMINO`);
                await database.ref('pedidos/' + id).update({ estado: 'en camino', timestampListo: null });
                await refrescarDatos();
                mostrarMensaje('✅ Éxito', 'Pedido recogido. ¡Buena ruta!', 'success');
            } catch (e) { mostrarMensaje('Error', 'Error de conexión', 'error'); }
            finally { document.getElementById('loader').style.display = 'none'; }
        }

        async function marcarLlegada(id) {
            document.getElementById('loader').style.display = 'flex';
            try {
                await fetch(`${scriptURL}?action=actualizarEstado&idPedido=${id}&nuevoEstado=LLEGÓ`);
                await database.ref('pedidos/' + id).update({ estado: 'llegó' });
                await refrescarDatos();
                mostrarMensaje('📍 Llegaste', 'Has llegado a la dirección del cliente', 'success');
            } catch (e) { mostrarMensaje('Error', 'Error de conexión', 'error'); }
            finally { document.getElementById('loader').style.display = 'none'; }
        }

        function iniciarTimerCancelacion(idPedido, total) {
            if (temporizadores[idPedido]) {
                mostrarMensaje('Aviso', 'Ya hay un temporizador activo', 'warning');
                return;
            }
            
            mostrarMensaje('⏰ Temporizador Activado', 'El cliente tiene 5 minutos para responder', 'info');
            
            let tiempo = 300;
            temporizadores[idPedido] = setInterval(async () => {
                tiempo--;
                const timerDiv = document.getElementById(`timer-${idPedido}`);
                if (timerDiv) {
                    const min = Math.floor(tiempo / 60);
                    const seg = tiempo % 60;
                    timerDiv.innerHTML = `⏰ Esperando al cliente: ${min}:${seg.toString().padStart(2, '0')} - Intenta contactarlo 📞`;
                }
                
                if (tiempo <= 0) {
                    clearInterval(temporizadores[idPedido]);
                    delete temporizadores[idPedido];
                    await cancelarPedido(idPedido, total);
                }
            }, 1000);
            
            refrescarDatos();
        }

        async function cancelarPedido(idPedido, total) {
            const confirm = await Swal.fire({
                title: '❌ Cancelar Pedido',
                html: `Se acumulará una deuda de <strong>${total.toFixed(2)}€</strong> al cliente`,
                icon: 'warning',
                background: '#020617',
                color: 'white',
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'Sí, cancelar',
                showCancelButton: true
            });
            
            if (!confirm.isConfirmed) return;
            
            document.getElementById('loader').style.display = 'flex';
            try {
                await fetch(`${scriptURL}?action=actualizarEstado&idPedido=${idPedido}&nuevoEstado=CANCELADO&tiempo=cliente_no_recogio`);
                await database.ref('pedidos/' + idPedido).update({ estado: 'cancelado', deuda_acumulada: total });
                await refrescarDatos();
                mostrarMensaje('Pedido Cancelado', `Deuda acumulada: ${total.toFixed(2)}€`, 'error');
            } catch (e) { mostrarMensaje('Error', 'Error al cancelar', 'error'); }
            finally { document.getElementById('loader').style.display = 'none'; }
        }

        function confirmarEntrega(id, total) {
            Swal.fire({
                title: '💰 Confirmar Entrega',
                html: `Cobrarás <strong>${parseFloat(total).toFixed(2)}€</strong><br>¿Confirmas que el cliente pagó?`,
                icon: 'question',
                background: '#020617',
                color: 'white',
                confirmButtonColor: '#22c55e',
                confirmButtonText: '✅ Sí, cobrar y entregar',
                showCancelButton: true
            }).then(async (res) => {
                if (res.isConfirmed) {
                    await finalizarEntrega(id, total);
                }
            });
        }

        async function finalizarEntrega(id, total) {
            document.getElementById('loader').style.display = 'flex';
            try {
                await fetch(`${scriptURL}?action=finalizarEntrega&idPedido=${id}&total=${total}&idRepartidor=${miCodigo}`);
                await database.ref('pedidos/' + id).update({ estado: 'entregado' });
                await refrescarDatos();
                mostrarMensaje('🎉 Entrega Completada', `+${parseFloat(total).toFixed(2)}€ en tu billetera`, 'success');
            } catch (e) { mostrarMensaje('Error', 'Error al finalizar pedido', 'error'); }
            finally { document.getElementById('loader').style.display = 'none'; }
        }

        function cerrarSesion() {
            Swal.fire({
                title: '¿Cerrar sesión?',
                icon: 'question',
                background: '#020617',
                color: 'white',
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'Sí, salir',
                showCancelButton: true
            }).then(res => {
                if (res.isConfirmed) {
                    localStorage.removeItem('ae_cod_reparto');
                    location.reload();
                }
            });
        }

        function actualizarContadores() {
            document.querySelectorAll('.timer-cocina').forEach(el => {
                const target = parseInt(el.getAttribute('data-time'));
                if (!target) return;
                const ahora = Date.now();
                const diff = target - ahora;
                if (diff <= 0) {
                    el.innerHTML = "🔔 ¡PEDIDO LISTO!";
                    el.className = "timer-cocina text-green-400 font-black blink";
                } else {
                    const min = Math.floor(diff / 60000);
                    const seg = Math.floor((diff % 60000) / 1000);
                    el.innerHTML = `⏳ COCINA: ${min}m ${seg}s`;
                }
            });
        }

        setInterval(actualizarContadores, 1000);
        initReparto();
    </script>
</body>
</html>
