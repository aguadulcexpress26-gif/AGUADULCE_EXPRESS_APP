<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONITOR TOTAL - Aguadulce Express</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #020617; font-family: system-ui; color: white; padding: 16px; }
        .pedido { background: #0f172a; border-radius: 16px; padding: 16px; margin-bottom: 12px; border-left: 4px solid #ef4444; }
        .critico { border-left-color: #ef4444; background: rgba(239,68,68,0.1); }
        .alerta { border-left-color: #f59e0b; }
        .normal { border-left-color: #06b6d4; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; }
        .bg-recibido { background: #06b6d4; color: black; }
        .bg-proceso { background: #f59e0b; color: black; }
        .bg-listo { background: #22c55e; color: black; }
        select, input { background: #1e293b; border: 1px solid #334155; border-radius: 30px; padding: 8px 12px; color: white; }
    </style>
</head>
<body>

<div class="mb-4">
    <h1 class="text-2xl font-bold">🎮 MONITOR DE CONTROL</h1>
    <p class="text-white/40 text-sm">Todos los pedidos activos (sin filtro de fecha)</p>
</div>

<!-- FILTROS -->
<div class="flex gap-3 mb-4 flex-wrap">
    <select id="filtroRestaurante" class="text-sm">
        <option value="TODOS">📋 TODOS LOS RESTAURANTES</option>
    </select>
    <input type="date" id="filtroFecha" class="text-sm">
    <button id="btnLimpiarFecha" class="bg-gray-700 px-3 py-2 rounded-full text-sm">🗑️ Limpiar fecha</button>
</div>

<!-- ESTADÍSTICAS -->
<div class="grid grid-cols-3 gap-3 mb-4">
    <div class="bg-cyan-500/20 p-3 rounded-xl text-center">
        <div class="text-2xl font-bold" id="total">0</div>
        <div class="text-xs">Pendientes</div>
    </div>
    <div class="bg-yellow-500/20 p-3 rounded-xl text-center">
        <div class="text-2xl font-bold" id="alerta">0</div>
        <div class="text-xs">Alerta (5-9min)</div>
    </div>
    <div class="bg-red-500/20 p-3 rounded-xl text-center">
        <div class="text-2xl font-bold" id="critico">0</div>
        <div class="text-xs">Crítico (10+min)</div>
    </div>
</div>

<div id="lista" class="space-y-3"></div>

<script>
    const URL_GS = "https://script.google.com/macros/s/AKfycbzYFDShcrP7I4FKhiH3q5UcEInpSKJstrumJ9ddI4Tj9S31ZUgwiuie81fGFmCJ6ob2/exec";
    
    let todosLosPedidos = [];
    let restaurantesLista = [];
    
    function formatearFecha(fechaRaw) {
        if (!fechaRaw) return null;
        
        // Si es formato ISO: 2026-05-29T13:53:06.349Z
        if (fechaRaw.includes('T')) {
            const fecha = new Date(fechaRaw);
            return fecha.toLocaleDateString('es-ES');
        }
        // Si ya tiene formato: 29/05/2026
        if (fechaRaw.includes('/')) {
            return fechaRaw.split(' ')[0];
        }
        return null;
    }
    
    function calcularMinutos(fechaRaw) {
        if (!fechaRaw) return 999;
        
        let fechaDate;
        if (fechaRaw.includes('T')) {
            fechaDate = new Date(fechaRaw);
        } else if (fechaRaw.includes('/')) {
            const partes = fechaRaw.split(' ');
            const fechaParte = partes[0];
            const horaParte = partes[1] || '00:00:00';
            const [dia, mes, anio] = fechaParte.split('/');
            const [hora, min, seg] = horaParte.split(':');
            fechaDate = new Date(anio, mes-1, dia, hora, min, seg);
        }
        
        if (!fechaDate || isNaN(fechaDate)) return 999;
        
        const ahora = new Date();
        return Math.floor((ahora - fechaDate) / 60000);
    }
    
    async function cargar() {
        try {
            const response = await fetch(`${URL_GS}?action=cargarTodo&t=${Date.now()}`);
            const data = await response.json();
            
            const restaurantes = data.RESTAURANTES || [];
            const pedidos = data.PEDIDOS || [];
            const configPedidos = data.CONFIGURACION || [];
            
            const todosRaw = [...pedidos, ...configPedidos];
            console.log("📦 Pedidos RAW:", todosRaw.length);
            
            // Filtrar SOLO activos (no entregados/finalizados)
            const activos = todosRaw.filter(p => {
                const estado = (p.ESTADO || p.estado || '').toUpperCase();
                return estado !== 'ENTREGADO' && 
                       estado !== 'FINALIZADO' && 
                       estado !== 'RECHAZADO' && 
                       estado !== 'CANCELADO';
            });
            
            console.log("📦 Pedidos ACTIVOS:", activos.length);
            
            // Construir lista de pedidos
            todosLosPedidos = activos.map(p => {
                const restaurante = restaurantes.find(r => String(r.ID_RESTAURANTE).trim() === String(p.ID_RESTAURANTE).trim());
                const fechaRaw = p.FECHA || p.fecha;
                const minutos = calcularMinutos(fechaRaw);
                
                let nivel = 'normal';
                if (minutos >= 10) nivel = 'critico';
                else if (minutos >= 5) nivel = 'alerta';
                
                return {
                    id: p.ID_PEDIDO || p.id,
                    cliente: p.CLIENTE || p.cliente || 'Cliente',
                    direccion: p.DIRECCION || p.direccion || '',
                    total: parseFloat(p.TOTAL || p.total || 0),
                    estado: (p.ESTADO || p.estado || 'RECIBIDO').toUpperCase(),
                    restaurante_nombre: restaurante ? (restaurante.NOMBRE_RESTAURANTE || restaurante.NOMBRE || 'Restaurante') : 'Restaurante',
                    telefono: restaurante ? (restaurante.TELEFONO || restaurante.CELULAR || '') : '',
                    fechaRaw: fechaRaw,
                    fechaStr: formatearFecha(fechaRaw),
                    minutos: minutos,
                    nivel: nivel
                };
            });
            
            // Ordenar por más crítico
            todosLosPedidos.sort((a, b) => b.minutos - a.minutos);
            
            // Cargar restaurantes para el filtro
            const restaurantesUnicos = [...new Set(todosLosPedidos.map(p => p.restaurante_nombre))].sort();
            const selectRest = document.getElementById('filtroRestaurante');
            const valorActual = selectRest.value;
            selectRest.innerHTML = '<option value="TODOS">📋 TODOS LOS RESTAURANTES</option>';
            restaurantesUnicos.forEach(r => {
                selectRest.innerHTML += `<option value="${r}">🏪 ${r}</option>`;
            });
            if (valorActual) selectRest.value = valorActual;
            
            // Aplicar filtros y mostrar
            aplicarFiltros();
            
        } catch (e) {
            console.error("Error:", e);
            document.getElementById('lista').innerHTML = '<div class="text-red-400">Error: ' + e.message + '</div>';
        }
    }
    
    function aplicarFiltros() {
        const restauranteFiltro = document.getElementById('filtroRestaurante').value;
        const fechaFiltro = document.getElementById('filtroFecha').value;
        
        let filtrados = [...todosLosPedidos];
        
        // Filtrar por restaurante
        if (restauranteFiltro !== 'TODOS') {
            filtrados = filtrados.filter(p => p.restaurante_nombre === restauranteFiltro);
        }
        
        // Filtrar por fecha (si hay fecha seleccionada)
        if (fechaFiltro) {
            filtrados = filtrados.filter(p => p.fechaStr === fechaFiltro);
        }
        
        // Actualizar estadísticas
        const total = filtrados.length;
        const alerta = filtrados.filter(p => p.nivel === 'alerta').length;
        const critico = filtrados.filter(p => p.nivel === 'critico').length;
        
        document.getElementById('total').textContent = total;
        document.getElementById('alerta').textContent = alerta;
        document.getElementById('critico').textContent = critico;
        
        // Renderizar
        const contenedor = document.getElementById('lista');
        if (filtrados.length === 0) {
            contenedor.innerHTML = '<div class="text-center py-10 text-white/40">✅ No hay pedidos pendientes</div>';
            return;
        }
        
        let html = '';
        for (const p of filtrados) {
            const tiempoTexto = p.minutos < 1 ? 'Ahora mismo' : `${p.minutos} min`;
            
            html += `
                <div class="pedido ${p.nivel}">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="font-mono text-cyan-400">#${p.id}</span>
                            <span class="badge bg-recibido ml-2">${p.estado}</span>
                            ${p.nivel === 'critico' ? '<span class="ml-2 text-red-400 text-xs font-bold">🔴 URGENTE - LLAMAR</span>' : ''}
                        </div>
                        <div class="text-emerald-400 font-bold">${p.total.toFixed(2)}€</div>
                    </div>
                    <div class="mt-2">
                        <div class="font-bold">${p.cliente}</div>
                        <div class="text-white/40 text-sm">📍 ${p.direccion.substring(0, 60)}</div>
                    </div>
                    <div class="mt-2 flex justify-between items-center flex-wrap gap-2">
                        <div>
                            <span class="text-cyan-400">🏪 ${p.restaurante_nombre}</span>
                            <span class="text-white/40 text-sm ml-2">⏱️ ${tiempoTexto}</span>
                            ${p.fechaStr ? `<span class="text-white/30 text-xs ml-2">📅 ${p.fechaStr}</span>` : ''}
                        </div>
                        ${p.telefono ? `<button onclick="window.location.href='tel:${p.telefono}'" class="bg-red-600 px-3 py-1 rounded-full text-sm">📞 LLAMAR</button>` : ''}
                    </div>
                </div>
            `;
        }
        contenedor.innerHTML = html;
    }
    
    // Event listeners
    document.getElementById('filtroRestaurante').addEventListener('change', aplicarFiltros);
    document.getElementById('filtroFecha').addEventListener('change', aplicarFiltros);
    document.getElementById('btnLimpiarFecha').onclick = () => {
        document.getElementById('filtroFecha').value = '';
        aplicarFiltros();
    };
    
    // Cargar y auto-actualizar
    cargar();
    setInterval(cargar, 10000);
</script>
</body>
</html>
