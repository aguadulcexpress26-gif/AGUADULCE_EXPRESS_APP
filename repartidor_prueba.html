<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aguadulce Express - Repartidores</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }
        /* LOADER CORREGIDO: z-index bajado a 500 para que SweetAlert (z-index ~1060) se muestre POR ENCIMA */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #020617;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 500;
            flex-direction: column;
            gap: 15px;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #1e293b;
            border-top: 5px solid #06b6d4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .flex { display: flex; }
        .justify-between { justify-content: space-between; }
        .items-center { align-items: center; }
        .btn-recoger { background: #06b6d4; color: #020617; font-weight: bold; width: 100%; padding: 12px; border-radius: 12px; cursor: pointer; margin-top: 10px; }
        .btn-llegada { background: #f59e0b; color: #020617; font-weight: bold; width: 100%; padding: 12px; border-radius: 12px; cursor: pointer; margin-top: 10px; }
        .btn-entregar { background: #22c55e; color: #020617; font-weight: bold; width: 100%; padding: 12px; border-radius: 12px; cursor: pointer; margin-top: 10px; }
        .sin-pedidos { text-align: center; padding: 40px; color: #64748b; font-size: 16px; }
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(2,6,23,0.8); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .modal-content { background: #0f172a; border: 1px solid #1e293b; border-radius: 20px; padding: 20px; width: 100%; max-width: 500px; max-height: 80vh; overflow-y: auto; }
        .historial-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #1e293b; }
        .historial-total { color: #22c55e; font-weight: bold; }
    </style>
</head>
<body>

    <div id="loader" class="loader">
        <div class="spinner"></div>
        <h2 style="font-size: 20px; font-weight: bold; color: #06b6d4;">SINCRONIZANDO AGUADULCE EXPRESS...</h2>
    </div>

    <div id="app" style="display: none; padding: 12px; max-width: 600px; margin: 0 auto;">
        
        <div class="flex justify-between items-center" style="margin-bottom: 20px; background: #0f172a; padding: 12px; border-radius: 14px; border: 1px solid #1e293b;">
            <div>
                <h1 id="nombreRep" style="font-size: 20px; font-weight: bold; color: #fff;">Cargando...</h1>
                <span id="codigoRep" style="font-size: 12px; color: #64748b; font-weight: 500;">🔑 ---</span>
            </div>
            <div style="text-align: right;">
                <span style="font-size: 11px; color: #64748b; display: block;">💰 Billetera</span>
                <span id="saldo" style="font-size: 18px; font-weight: bold; color: #22c55e;">0.00€</span>
            </div>
        </div>

        <div class="flex justify-between items-center" style="margin-bottom: 16px;">
            <div class="flex items-center" style="gap: 8px;">
                <span style="display: inline-block; width: 10px; height: 10px; background: #22c55e; border-radius: 50%;"></span>
                <span id="estadoConexion" style="font-size: 14px; color: #22c55e; font-weight: 500;">Conectado</span>
            </div>
            <div class="flex" style="gap: 8px;">
                <button id="btnHistorial" style="background: #1e293b; color: #f8fafc; font-size: 13px; padding: 8px 14px; border-radius: 10px; cursor: pointer;">📋 Historial</button>
                <button id="btnSalir" style="background: #334155; color: #f8fafc; font-size: 13px; padding: 8px 14px; border-radius: 10px; cursor: pointer;">🚪 Salir</button>
            </div>
        </div>

        <div style="margin-bottom: 14px; font-size: 14px; color: #94a3b8;">
            Tienes <span id="contadorPedidos" style="color: #06b6d4; font-weight: bold;">0 pedidos</span> activos
        </div>

        <div id="listaPedidos"></div>
    </div>

    <div id="modalHistorial" class="modal">
        <div class="modal-content">
            <div class="flex justify-between items-center" style="margin-bottom: 16px; border-bottom: 1px solid #1e293b; padding-bottom: 10px;">
                <h3 style="font-size: 18px; font-weight: bold;">✅ Mis Entregas de Hoy</h3>
                <button id="btnCerrarHistorial" style="background: transparent; color: #64748b; font-size: 20px; cursor: pointer;">✕</button>
            </div>
            <div id="historialLista"></div>
        </div>
    </div>

    <script>
        console.log("🚀 Script detectado e iniciando ejecución...");

        // URL de tu implementación de Google Apps Script
        const URL = 'https://script.google.com/macros/s/AKfycbzYFDShcrP7I4FKhiH3q5UcEInpSKJstrumJ9ddI4Tj9S31ZUgwiuie81fGFmCJ6ob2/exec';
        
        let codigoActual = null;
        let intervalo = null;
        let audioNotif = null;
        let ultimosIds = [];
        
        function initAudio() {
            audioNotif = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
            audioNotif.volume = 0.8;
        }
        
        function playSound() {
            if (audioNotif) {
                audioNotif.currentTime = 0;
                audioNotif.play().catch(e => console.log('Audio en espera de interacción del usuario.'));
            }
        }
        
        async function fetchConTimeout(url, timeout = 10000) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(url, { signal: controller.signal });
                clearTimeout(timeoutId);
                return response;
            } catch (error) {
                clearTimeout(timeoutId);
                throw error;
            }
        }
        
        async function cargarPedidos() {
            if (!codigoActual) return;
            try {
                const res = await fetchConTimeout(URL + '?action=getPedidosReparto&idRepartidor=' + encodeURIComponent(codigoActual) + '&t=' + Date.now());
                const data = await res.json();
                
                if (data.error) {
                    document.getElementById('estadoConexion').innerHTML = 'Error de Permisos';
                    document.getElementById('estadoConexion').style.color = '#ef4444';
                    return;
                }
                
                document.getElementById('estadoConexion').innerHTML = 'Conectado';
                document.getElementById('estadoConexion').style.color = '#22c55e';
                document.getElementById('nombreRep').innerHTML = data.nombre || codigoActual;
                document.getElementById('saldo').innerHTML = (parseFloat(data.saldo) || 0).toFixed(2) + '€';
                
                const nuevosIds = (data.pedidos || []).map(p => p.ID_PEDIDO);
                const realmenteNuevos = nuevosIds.filter(id => !ultimosIds.includes(id));
                if (realmenteNuevos.length > 0) {
                    playSound();
                }
                
                ultimosIds = nuevosIds;
                const pedidosActivos = data.pedidos || [];
                document.getElementById('contadorPedidos').innerHTML = pedidosActivos.length + ' pedido' + (pedidosActivos.length !== 1 ? 's' : '');
                
                renderizarPedidos(pedidosActivos);
            } catch(e) {
                console.error("Error en conexión o parseo de cargarPedidos:", e);
                document.getElementById('estadoConexion').innerHTML = 'Offline';
                document.getElementById('estadoConexion').style.color = '#ef4444';
            }
        }
        
        function renderizarPedidos(pedidos) {
            const contenedor = document.getElementById('listaPedidos');
            const pedidosFiltrados = pedidos.filter(p => {
                const estado = (p.ESTADO || '').toUpperCase();
                return estado !== 'CANCELADO' && estado !== 'RECHAZADO' && estado !== 'ENTREGADO';
            });
            
            if (pedidosFiltrados.length === 0) {
                contenedor.innerHTML = '<div class="sin-pedidos">📭 Sin pedidos asignados en este momento</div>';
                return;
            }
            
            let html = '';
            for (let p of pedidosFiltrados) {
                const estado = (p.ESTADO || '').toUpperCase();
                const total = parseFloat(p.TOTAL) || 0;
                let telefono = p.telf || '';
                let telefonoLimpio = String(telefono).replace(/\D/g, '');
                if (telefonoLimpio.length === 9 && (telefonoLimpio.startsWith('6') || telefonoLimpio.startsWith('7'))) {
                    telefonoLimpio = '34' + telefonoLimpio;
                }
                
                let botones = '';
                if (estado === 'LISTO') {
                    botones = `<button class="btn-recoger" onclick="recogerPedido(this, '${p.ID_PEDIDO}')">🛵 RECOGER PEDIDO</button>`;
                } else if (estado === 'EN CAMINO') {
                    botones = `<button class="btn-llegada" onclick="marcarLlegada(this, '${p.ID_PEDIDO}')">📍 HE LLEGADO AL CLIENTE</button>`;
                } else if (estado === 'LLEGÓ') {
                    botones = `<button class="btn-entregar" onclick="confirmarEntrega('${p.ID_PEDIDO}', ${total})">💰 CONFIRMAR COBRO Y ENTREGA</button>`;
                } else {
                    botones = '<div style="background: rgba(6,182,212,0.1); color: #06b6d4; padding: 14px; border-radius: 14px; text-align: center; font-weight: 500;">⏳ ESTADO: ' + (estado || 'PREPARANDO') + '</div>';
                }
                
                html += '<div class="card">';
                html += '<div class="flex justify-between items-center" style="margin-bottom: 10px;"><span style="font-weight: bold; color: #06b6d4;">📋 REF: ' + p.ID_PEDIDO + '</span><span style="background:rgba(6,182,212,0.2);color:#06b6d4;padding:3px 10px;border-radius:20px;font-size:11px;font-weight: bold;">' + (estado || 'PREPARANDO') + '</span></div>';
                html += '<div style="font-size: 15px; font-weight: 600; margin-bottom: 8px; color: #f1f5f9;">📍 ' + (p.DIRECCION || 'Sin dirección registrada') + '</div>';
                
                html += '<div style="background: #1e293b; padding: 10px; border-radius: 12px; margin-bottom: 12px; font-size: 13px;">';
                html += '<div style="margin-bottom: 4px; color: #e2e8f0;">👤 <strong>' + (p.CLIENTE || 'Cliente Desconocido') + '</strong></div>';
                html += '<div class="flex justify-between items-center">';
                html += '<span style="color: #94a3b8;">📞 ' + (telefono || 'No disponible') + '</span>';
                if (telefonoLimpio) {
                    html += '<div style="display: flex; gap: 8px;">';
                    html += '<a href="tel:' + telefonoLimpio + '" style="background:#22c55e;color:#020617;padding:6px 12px;border-radius:8px;text-decoration:none;font-weight:bold;font-size:12px;">Llamar</a>';
                    html += '<a href="https://wa.me/' + telefonoLimpio + '" target="_blank" style="background:#25D366;color:#ffffff;padding:6px 12px;border-radius:8px;text-decoration:none;font-weight:bold;font-size:12px;">WhatsApp</a>';
                    html += '</div>';
                }
                html += '</div>';
                html += '<div style="margin-top: 6px; color: #94a3b8;">💳 Método: <span style="color:#f1f5f9; font-weight:500;">' + (p.PAGO || 'Efectivo') + '</span></div>';
                html += '</div>';
                
                html += '<div class="flex justify-between items-center" style="margin: 12px 0; padding-top: 4px;">';
                html += '<span style="color:#94a3b8;">Total a recibir:</span>';
                html += '<span style="color:#22c55e; font-size: 18px; font-weight: bold;">' + total.toFixed(2) + '€</span>';
                html += '</div>';
                html += botones;
                html += '</div>';
            }
            contenedor.innerHTML = html;
        }
        
        window.recogerPedido = async function(btn, id) {
            btn.disabled = true; const textoOriginal = btn.innerHTML; btn.innerHTML = '⏳ Guardando cambio...';
            try {
                await fetchConTimeout(URL + '?action=actualizarEstado&idPedido=' + id + '&nuevoEstado=EN CAMINO');
                if(typeof Swal !== 'undefined') await Swal.fire({ title: '✅ Pedido en Camino', icon: 'success', background: '#0f172a', color: 'white', timer: 1500, showConfirmButton: false });
                await cargarPedidos();
            } catch(e) { console.error(e); } finally { btn.disabled = false; btn.innerHTML = textoOriginal; }
        };
        
        window.marcarLlegada = async function(btn, id) {
            btn.disabled = true; const textoOriginal = btn.innerHTML; btn.innerHTML = '⏳ Guardando ubicación...';
            try {
                await fetchConTimeout(URL + '?action=actualizarEstado&idPedido=' + id + '&nuevoEstado=LLEGÓ');
                if(typeof Swal !== 'undefined') await Swal.fire({ title: '📍 Llegaste al Destino', icon: 'success', background: '#0f172a', color: 'white', timer: 1500, showConfirmButton: false });
                await cargarPedidos();
            } catch(e) { console.error(e); } finally { btn.disabled = false; btn.innerHTML = textoOriginal; }
        };
        
        window.confirmarEntrega = function(id, total) {
            if(typeof Swal !== 'undefined') {
                Swal.fire({
                    title: '💰 Confirmar Cobro',
                    html: `¿Confirmas que has cobrado los <strong>${total.toFixed(2)}€</strong> correspondientes al pedido?`,
                    icon: 'question',
                    background: '#0f172a', color: 'white',
                    confirmButtonColor: '#22c55e', confirmButtonText: '✅ Sí, cobrar',
                    showCancelButton: true, cancelButtonText: 'Cancelar', cancelButtonColor: '#334155'
                }).then(async (result) => {
                    if (result.isConfirmed) await finalizarEntrega(id, total);
                });
            } else {
                if(confirm(`¿Confirmar entrega y cobro de ${total.toFixed(2)}€?`)) finalizarEntrega(id, total);
            }
        };
        
        window.finalizarEntrega = async function(id, total) {
            try {
                await fetchConTimeout(URL + '?action=finalizarEntrega&idPedido=' + id + '&total=' + total);
                if(typeof Swal !== 'undefined') await Swal.fire({ title: '🎉 ¡Pedido Entregado!', text: `+${total.toFixed(2)}€ añadidos a tu billetera`, icon: 'success', background: '#0f172a', color: 'white', timer: 2000, showConfirmButton: false });
                await cargarPedidos();
            } catch(e) { console.error(e); }
        };
        
        async function mostrarHistorial() {
            document.getElementById('modalHistorial').style.display = 'flex';
            document.getElementById('historialLista').innerHTML = '<div class="text-center" style="padding: 20px; color:#64748b;">⏳ Cargando historial...</div>';
            try {
                const res = await fetchConTimeout(URL + '?action=getHistorialRepartidor&nombre=' + encodeURIComponent(codigoActual));
                const data = await res.json();
                const pedidos = data.historial || [];
                let html = '';
                for (let p of pedidos.slice().reverse()) {
                    if (p.ESTADO === 'ENTREGADO') {
                        html += `<div class="historial-item"><div><strong>Pedido #${p.ID_PEDIDO}</strong><br><span style="font-size: 11px; color:#94a3b8;">👤 ${p.CLIENTE || 'Cliente'}</span></div><div class="historial-total">+${(parseFloat(p.TOTAL) || 0).toFixed(2)}€</div></div>`;
                    }
                }
                document.getElementById('historialLista').innerHTML = html || '<div class="text-center" style="padding: 40px; color:#64748b;">📭 Sin entregas registradas hoy</div>';
            } catch(e) {
                document.getElementById('historialLista').innerHTML = '<div class="text-center" style="padding: 40px; color:#ef4444;">❌ Error al conectar con la base de datos</div>';
            }
        }
        
        function cerrarHistorial() { document.getElementById('modalHistorial').style.display = 'none'; }
        
        async function cerrarSesion() {
            if (confirm("¿Seguro que deseas cerrar sesión en este dispositivo?")) {
                if (intervalo) clearInterval(intervalo);
                localStorage.removeItem('rep_code');
                location.reload();
            }
        }
        
        // ============ SISTEMA DE ARRANQUE PROTEGIDO ============
        async function iniciarApp() {
            console.log("⚙️ Ejecutando iniciarApp()...");
            initAudio();
            
            document.getElementById('btnSalir').onclick = cerrarSesion;
            document.getElementById('btnHistorial').onclick = mostrarHistorial;
            document.getElementById('btnCerrarHistorial').onclick = cerrarHistorial;
            
            let codigo = null;
            try {
                codigo = localStorage.getItem('rep_code');
                console.log("🔑 Código en almacenamiento:", codigo);
            } catch (error) {
                console.warn("⚠️ LocalStorage inaccesible, usando memoria volátil.");
            }
            
            // Si no hay sesión iniciada, solicitamos código al repartidor
            if (!codigo) {
                if (typeof Swal === 'undefined') {
                    console.log("⚠️ SweetAlert no cargó a tiempo. Usando prompt del sistema.");
                    let promptCodigo = prompt("🔐 Introduce tu Código de Repartidor (Ej: R001, R002):");
                    if (promptCodigo && promptCodigo.trim()) {
                        codigo = promptCodigo.trim().toUpperCase();
                        localStorage.setItem('rep_code', codigo);
                    }
                } else {
                    console.log("🎨 Solicitando código mediante SweetAlert2...");
                    try {
                        const result = await Swal.fire({
                            title: '🔐 Identificación',
                            text: 'Introduce tu código asignado para acceder al reparto:',
                            input: 'text',
                            inputPlaceholder: 'Ej: R001, R003',
                            background: '#0f172a',
                            color: 'white',
                            confirmButtonColor: '#06b6d4',
                            confirmButtonText: 'Ingresar',
                            allowOutsideClick: false
                        });
                        
                        if (result && result.value && result.value.trim()) {
                            codigo = result.value.trim().toUpperCase();
                            localStorage.setItem('rep_code', codigo);
                        }
                    } catch (swalError) {
                        console.error("Fallo estructural en el modal. Activando prompt nativo:", swalError);
                        let promptCodigo = prompt("🔐 Introduce tu Código de Repartidor (Ej: R001):");
                        if (promptCodigo && promptCodigo.trim()) {
                            codigo = promptCodigo.trim().toUpperCase();
                            localStorage.setItem('rep_code', codigo);
                        }
                    }
                }
            }
            
            if (!codigo) {
                document.getElementById('loader').innerHTML = '<h2 style="color:#ef4444; font-weight:bold; padding:20px; text-align:center;">❌ Acceso denegado. Se necesita un código de repartidor para continuar.</h2>';
                return;
            }

            codigoActual = codigo;
            document.getElementById('codigoRep').innerHTML = '🔑 Código de Acceso: ' + codigoActual;
            
            console.log("📦 Solicitando primeros pedidos de la API para el repartidor:", codigoActual);
            try {
                await cargarPedidos();
            } catch (err) {
                console.error("Aviso: No se pudieron descargar los datos iniciales, reintentando en segundo plano.", err);
            }
            
            // Desactivar el loader y mostrar la pantalla limpia
            document.getElementById('loader').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            console.log("✅ ¡App lista y visible en pantalla!");
            
            if (intervalo) clearInterval(intervalo);
            intervalo = setInterval(cargarPedidos, 5000);
        }
        
        // Lanzamiento directo sin atascamiento de ciclo de vida
        iniciarApp().catch(err => {
            console.error("💥 Error crítico fatal en el arranque:", err);
            document.getElementById('loader').style.display = 'none';
            document.getElementById('app').style.display = 'block';
        });
    </script>
</body>
</html>
