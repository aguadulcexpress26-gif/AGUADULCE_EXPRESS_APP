<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Aguadulce Express - Cocina</title>
    
    <link rel="manifest" href="/AGUADULCE_EXPRESS_APP/cocina/manifest-cocina.json">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/cCv7qsHf/IMAGEN-PNG-512.jpg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-functions-compat.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        /* ============================================
           RESET Y VARIABLES
           ============================================ */
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: #1a2234;
            --bg-card-hover: #243049;
            --border-color: #2a3a5a;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-gold: #f59e0b;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-purple: #8b5cf6;
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        
        /* ============================================
           SCROLLBAR PERSONALIZADA
           ============================================ */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--accent-gold); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #d97706; }
        
        /* ============================================
           LOGIN
           ============================================ */
        #login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-primary);
            padding: 1rem;
            position: fixed;
            inset: 0;
            z-index: 100;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #login-container.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        
        .login-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            animation: fadeInUp 0.6s ease-out;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .login-card .logo { text-align: center; margin-bottom: 1.5rem; }
        .login-card .logo h1 { font-size: 2rem; font-weight: 900; color: var(--accent-gold); letter-spacing: -0.5px; }
        .login-card .logo p { color: var(--text-secondary); font-size: 0.85rem; }
        
        .login-card input {
            width: 100%;
            padding: 0.85rem 1rem;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 1rem;
            color: var(--text-primary);
            transition: var(--transition);
            outline: none;
        }
        .login-card input:focus { border-color: var(--accent-gold); box-shadow: 0 0 0 3px rgba(245,158,11,0.15); }
        .login-card input::placeholder { color: var(--text-muted); }
        
        .login-card .btn-login {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, var(--accent-gold), #d97706);
            color: #0f172a;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }
        .login-card .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(245,158,11,0.3); }
        .login-card .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        /* ============================================
           APP LAYOUT
           ============================================ */
        #app {
            display: none;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: var(--bg-primary);
            position: fixed;
            inset: 0;
            z-index: 10;
        }
        #app:not(.hidden) { display: flex; }
        
        /* ============================================
           HEADER MODERNO
           ============================================ */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 2rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            min-height: 64px;
            z-index: 5;
        }
        
        .app-header .left { display: flex; align-items: center; gap: 1rem; }
        .app-header .left .brand { display: flex; align-items: center; gap: 0.5rem; }
        .app-header .left .brand h1 { font-size: 1.2rem; font-weight: 800; color: var(--accent-gold); letter-spacing: -0.5px; }
        .app-header .left .brand span { font-size: 0.7rem; color: var(--text-muted); font-weight: 500; }
        
        .app-header .right { display: flex; align-items: center; gap: 1.5rem; }
        .app-header .right .restaurant-info { text-align: right; }
        .app-header .right .restaurant-info .name { font-weight: 600; font-size: 0.9rem; }
        .app-header .right .restaurant-info .email { font-size: 0.7rem; color: var(--text-muted); }
        
        .header-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.3rem 1rem;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border: none;
        }
        .header-status.active { background: rgba(16,185,129,0.15); color: var(--accent-green); }
        .header-status.active:hover { background: rgba(16,185,129,0.25); }
        .header-status.paused { background: rgba(239,68,68,0.15); color: var(--accent-red); }
        .header-status.paused:hover { background: rgba(239,68,68,0.25); }
        .header-status .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .header-status.active .dot { background: var(--accent-green); }
        .header-status.paused .dot { background: var(--accent-red); animation: pulse-dot 1s ease-in-out infinite; }
        
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }
        
        /* ============================================
           MENÚ HAMBURGUESA MODERNO
           ============================================ */
        .menu-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            font-size: 1.2rem;
        }
        .menu-btn:hover { background: var(--bg-card-hover); }
        .menu-btn.active { background: var(--accent-red); border-color: var(--accent-red); }
        
        /* ============================================
           MENÚ DESPLEGABLE MODERNO
           ============================================ */
        #menu-desplegable {
            position: fixed;
            top: 0;
            left: 0;
            width: 300px;
            height: 100vh;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 50;
            padding: 1.5rem;
            overflow-y: auto;
        }
        #menu-desplegable.open { transform: translateX(0); }
        
        #menu-desplegable .menu-user {
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 1.5rem;
        }
        #menu-desplegable .menu-user .name { font-weight: 700; font-size: 1.1rem; }
        #menu-desplegable .menu-user .email { font-size: 0.8rem; color: var(--text-muted); }
        #menu-desplegable .menu-user .status { font-size: 0.7rem; margin-top: 0.3rem; }
        
        #menu-desplegable .menu-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
            border: none;
            background: transparent;
            font-size: 0.9rem;
            font-weight: 500;
        }
        #menu-desplegable .menu-item:hover { background: var(--bg-card); color: var(--text-primary); }
        #menu-desplegable .menu-item.active { background: var(--accent-gold); color: #0f172a; }
        #menu-desplegable .menu-item .badge {
            margin-left: auto;
            background: var(--accent-blue);
            color: white;
            padding: 0.1rem 0.6rem;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 700;
        }
        #menu-desplegable .menu-item.danger { color: var(--accent-red); }
        #menu-desplegable .menu-item.danger:hover { background: rgba(239,68,68,0.15); color: var(--accent-red); }
        
        #menu-desplegable .menu-divider {
            height: 1px;
            background: var(--border-color);
            margin: 0.75rem 0;
        }
        
        /* ============================================
           CONTADORES MODERNOS
           ============================================ */
        .stats-bar {
            display: flex;
            gap: 1rem;
            padding: 0.75rem 2rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.3rem 1rem;
            background: var(--bg-card);
            border-radius: 50px;
            border: 1px solid var(--border-color);
        }
        .stat-item .icon { font-size: 1rem; }
        .stat-item .label { font-size: 0.7rem; color: var(--text-muted); font-weight: 500; }
        .stat-item .value {
            font-size: 0.9rem;
            font-weight: 700;
            min-width: 20px;
            text-align: center;
        }
        .stat-item .value.gold { color: var(--accent-gold); }
        .stat-item .value.blue { color: var(--accent-blue); }
        .stat-item .value.green { color: var(--accent-green); }
        .stat-item .value.purple { color: var(--accent-purple); }
        .stat-item .value.red { color: var(--accent-red); }
        
        /* ============================================
           COLUMNAS - KANBAN MODERNO
           ============================================ */
        .kanban-container {
            flex: 1;
            display: flex;
            gap: 1rem;
            padding: 1rem 1.5rem;
            overflow-x: auto;
            overflow-y: hidden;
            background: var(--bg-primary);
            min-height: 0;
        }
        
        .kanban-column {
            flex: 1;
            min-width: 280px;
            max-width: 400px;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }
        .kanban-column:hover { border-color: var(--accent-gold); }
        
        .kanban-column .column-header {
            padding: 0.75rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            flex-shrink: 0;
            background: var(--bg-secondary);
        }
        .kanban-column .column-header .title {
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .kanban-column .column-header .count {
            background: var(--bg-card);
            padding: 0.1rem 0.7rem;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 700;
        }
        
        .kanban-column.pending .column-header { border-bottom-color: var(--accent-gold); }
        .kanban-column.pending .column-header .title { color: var(--accent-gold); }
        
        .kanban-column.cooking .column-header { border-bottom-color: var(--accent-blue); }
        .kanban-column.cooking .column-header .title { color: var(--accent-blue); }
        
        .kanban-column.ready .column-header { border-bottom-color: var(--accent-green); }
        .kanban-column.ready .column-header .title { color: var(--accent-green); }
        
        .kanban-column .column-content {
            flex: 1;
            overflow-y: auto;
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        
        /* ============================================
           TARJETAS DE PEDIDOS MODERNAS
           ============================================ */
        .order-card {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 1rem;
            border: 1px solid var(--border-color);
            transition: var(--transition);
            flex-shrink: 0;
            position: relative;
        }
        .order-card:hover {
            border-color: var(--accent-gold);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .order-card.delayed {
            border-left: 4px solid var(--accent-red);
            background: rgba(239,68,68,0.05);
        }
        .order-card.delayed:hover { border-color: var(--accent-red); }
        
        .order-card .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.3rem;
        }
        .order-card .top .id {
            font-size: 0.65rem;
            font-family: monospace;
            color: var(--text-muted);
        }
        .order-card .top .time {
            font-size: 0.6rem;
            color: var(--text-muted);
        }
        
        .order-card .cliente {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-primary);
        }
        .order-card .direccion {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.1rem;
        }
        .order-card .telefono {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 0.1rem;
        }
        
        .order-card .timer {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.3rem 0.6rem;
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            margin: 0.5rem 0;
            font-size: 0.7rem;
            border: 1px solid var(--border-color);
        }
        .order-card .timer .label { color: var(--text-muted); }
        .order-card .timer .value { font-weight: 700; color: var(--accent-gold); }
        .order-card .timer .value.delayed { color: var(--accent-red); }
        
        .order-card .productos {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
            margin: 0.5rem 0;
        }
        .order-card .productos span {
            background: var(--bg-secondary);
            padding: 0.1rem 0.5rem;
            border-radius: 50px;
            font-size: 0.6rem;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        
        .order-card .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.5rem;
            padding-top: 0.5rem;
            border-top: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 0.3rem;
        }
        .order-card .footer .precio {
            font-weight: 700;
            color: var(--accent-gold);
            font-size: 0.9rem;
        }
        .order-card .footer .badge-estado {
            font-size: 0.6rem;
            padding: 0.15rem 0.6rem;
            border-radius: 50px;
            font-weight: 600;
        }
        .order-card .footer .badge-estado.pending { background: rgba(245,158,11,0.15); color: var(--accent-gold); }
        .order-card .footer .badge-estado.cooking { background: rgba(59,130,246,0.15); color: var(--accent-blue); }
        .order-card .footer .badge-estado.ready { background: rgba(16,185,129,0.15); color: var(--accent-green); }
        
        .order-card .actions {
            display: flex;
            gap: 0.3rem;
            margin-top: 0.5rem;
            flex-wrap: wrap;
            width: 100%;
        }
        .order-card .actions .btn {
            padding: 0.25rem 0.75rem;
            border-radius: 50px;
            font-size: 0.65rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            flex: 1;
            min-width: 60px;
            text-align: center;
        }
        .order-card .actions .btn:hover { transform: scale(1.05); }
        .order-card .actions .btn-primary { background: var(--accent-gold); color: #0f172a; }
        .order-card .actions .btn-primary:hover { background: #d97706; }
        .order-card .actions .btn-success { background: var(--accent-green); color: white; }
        .order-card .actions .btn-success:hover { background: #059669; }
        .order-card .actions .btn-danger { background: var(--accent-red); color: white; }
        .order-card .actions .btn-danger:hover { background: #dc2626; }
        .order-card .actions .btn-purple { background: var(--accent-purple); color: white; }
        .order-card .actions .btn-purple:hover { background: #7c3aed; }
        .order-card .actions .btn-secondary { background: var(--bg-secondary); color: var(--text-secondary); border: 1px solid var(--border-color); }
        .order-card .actions .btn-secondary:hover { background: var(--bg-card-hover); }
        
        /* ============================================
           VISTA HISTORIAL / DEMORAS
           ============================================ */
        .view-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            overflow: hidden;
            margin: 0.5rem 1.5rem;
        }
        .view-container .view-header {
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .view-container .view-header .title {
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .view-container .view-header .filters {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .view-container .view-header .filters select {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 0.3rem 0.8rem;
            color: var(--text-primary);
            font-size: 0.75rem;
            outline: none;
            cursor: pointer;
        }
        .view-container .view-header .filters select:focus { border-color: var(--accent-gold); }
        
        .view-container .view-content {
            flex: 1;
            overflow-y: auto;
            padding: 0.75rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .view-container .view-content .empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            color: var(--text-muted);
            text-align: center;
        }
        .view-container .view-content .empty .icon { font-size: 3rem; margin-bottom: 0.5rem; }
        
        /* ============================================
           TOAST
           ============================================ */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-sm);
            color: white;
            font-weight: 500;
            font-size: 0.85rem;
            box-shadow: var(--shadow);
            z-index: 999;
            animation: slideInToast 0.3s ease-out;
            max-width: 400px;
        }
        @keyframes slideInToast {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .toast-success { background: var(--accent-green); }
        .toast-error { background: var(--accent-red); }
        .toast-info { background: var(--accent-blue); }
        .toast-warning { background: var(--accent-gold); color: #0f172a; }
        
        /* ============================================
           OVERLAY ORIENTACIÓN
           ============================================ */
        #orientacion-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        #orientacion-overlay:not(.hidden) { display: flex !important; }
        
        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 1024px) {
            .kanban-container {
                flex-direction: column;
                overflow-y: auto;
                overflow-x: hidden;
                padding: 0.75rem;
            }
            .kanban-column { min-width: unset; max-width: unset; max-height: 300px; }
            .view-container { margin: 0.5rem 0.75rem; }
        }
        
        @media (max-width: 768px) {
            .app-header { padding: 0.5rem 1rem; flex-wrap: wrap; gap: 0.3rem; }
            .app-header .left .brand h1 { font-size: 1rem; }
            .app-header .right .restaurant-info .name { font-size: 0.8rem; }
            .app-header .right .restaurant-info .email { display: none; }
            .stats-bar { padding: 0.5rem 1rem; gap: 0.5rem; }
            .stat-item { padding: 0.2rem 0.7rem; }
            .stat-item .label { font-size: 0.6rem; }
            .stat-item .value { font-size: 0.8rem; }
            .kanban-column { max-height: 200px; }
            .order-card { padding: 0.7rem; }
            .order-card .cliente { font-size: 0.85rem; }
            #menu-desplegable { width: 260px; }
        }
    </style>
</head>
<body>

    <!-- ============================================
    LOGIN
    ============================================ -->
    <div id="login-container">
        <div class="login-card">
            <div class="logo">
                <h1>🍳 Aguadulce Express</h1>
                <p>Panel de Cocina</p>
            </div>
            <form id="login-form" style="display:flex;flex-direction:column;gap:1rem;">
                <input type="email" id="login-email" placeholder="Email del restaurante" required>
                <input type="password" id="login-password" placeholder="Contraseña" required>
                <button type="submit" class="btn-login" id="login-btn">
                    <span id="login-text">Iniciar Sesión</span>
                    <span id="login-loading" style="display:none;">Cargando...</span>
                </button>
                <div id="login-error" style="color:var(--accent-red);font-size:0.8rem;text-align:center;display:none;"></div>
            </form>
        </div>
    </div>

    <!-- ============================================
    APP PRINCIPAL
    ============================================ -->
    <div id="app" class="hidden">
        
        <!-- HEADER -->
        <header class="app-header">
            <div class="left">
                <button class="menu-btn" id="menu-toggle" aria-label="Menú">☰</button>
                <div class="brand">
                    <h1>🍳 Aguadulce</h1>
                    <span>COCINA</span>
                </div>
            </div>
            <div class="right">
                <button class="header-status active" id="btn-pausa-header" onclick="togglePausa()">
                    <span class="dot"></span>
                    <span id="estado-texto-header">Activo</span>
                </button>
                <div class="restaurant-info">
                    <div class="name" id="header-restaurante">Cargando...</div>
                    <div class="email" id="header-email"></div>
                </div>
            </div>
        </header>

        <!-- MENÚ DESPLEGABLE -->
        <div id="menu-desplegable">
            <div class="menu-user">
                <div class="name" id="restaurante-nombre">Cargando...</div>
                <div class="email" id="restaurante-email"></div>
                <div class="status" id="estado-pausa-menu">● Activo</div>
            </div>
            
            <button class="menu-item active" data-view="activos">
                📋 Pedidos Activos
                <span class="badge" id="contador-activos">0</span>
            </button>
            <button class="menu-item" data-view="historial">
                📊 Historial
            </button>
            <button class="menu-item" data-view="demoras">
                ⏱️ Demoras
            </button>
            
            <div class="menu-divider"></div>
            
            <button class="menu-item" onclick="abrirFormularioReparto()">🚚 Nuevo Reparto</button>
            <button class="menu-item" onclick="configurarImpresora()">
                🖨️ Configurar Impresora
                <span style="font-size:0.6rem;margin-left:auto;color:var(--text-muted);" id="estado-impresora">⭕</span>
            </button>
            
            <div class="menu-divider"></div>
            
            <button class="menu-item danger" id="btn-cerrar-sesion">🚪 Cerrar Sesión</button>
        </div>

        <!-- BANNER DE PAUSA -->
        <div class="pausa-banner" id="pausa-banner" style="display:none;background:var(--accent-red);color:white;text-align:center;padding:6px;font-weight:700;font-size:0.85rem;flex-shrink:0;">
            ⏸️ RESTAURANTE EN PAUSA - NO SE RECIBEN NUEVOS PEDIDOS
        </div>

        <!-- STATS BAR -->
        <div class="stats-bar" id="stats-bar">
            <div class="stat-item">
                <span class="icon">📥</span>
                <span class="label">Entrada</span>
                <span class="value gold" id="count-pendiente">0</span>
            </div>
            <div class="stat-item">
                <span class="icon">👨‍🍳</span>
                <span class="label">En Proceso</span>
                <span class="value blue" id="count-coccion">0</span>
            </div>
            <div class="stat-item">
                <span class="icon">✅</span>
                <span class="label">Listos</span>
                <span class="value green" id="count-listo">0</span>
            </div>
        </div>

        <!-- KANBAN COLUMNAS -->
        <div class="kanban-container" id="kanban-container">
            
            <!-- COLUMNA: ENTRADA -->
            <div class="kanban-column pending" id="columna-pendiente">
                <div class="column-header">
                    <span class="title">📥 Entrada</span>
                    <span class="count" id="col-count-pendiente">0</span>
                </div>
                <div class="column-content" id="col-pendiente"></div>
            </div>
            
            <!-- COLUMNA: EN PROCESO -->
            <div class="kanban-column cooking" id="columna-coccion">
                <div class="column-header">
                    <span class="title">👨‍🍳 En Proceso</span>
                    <span class="count" id="col-count-coccion">0</span>
                </div>
                <div class="column-content" id="col-coccion"></div>
            </div>
            
            <!-- COLUMNA: LISTO -->
            <div class="kanban-column ready" id="columna-listo">
                <div class="column-header">
                    <span class="title">✅ Listos</span>
                    <span class="count" id="col-count-listo">0</span>
                </div>
                <div class="column-content" id="col-listo"></div>
            </div>
            
        </div>
    </div>

    <!-- ============================================
    OVERLAY ORIENTACIÓN
    ============================================ -->
    <div id="orientacion-overlay" class="hidden">
        <div style="text-align:center;color:white;padding:2rem;">
            <div style="font-size:4rem;margin-bottom:1rem;">🔄</div>
            <h2 style="font-size:1.5rem;font-weight:700;">¡Gira tu tableta!</h2>
            <p style="color:var(--text-secondary);margin-top:0.5rem;">Posición horizontal para mejor experiencia</p>
            <button onclick="document.getElementById('orientacion-overlay').classList.add('hidden')" style="margin-top:1.5rem;padding:0.6rem 2rem;background:white;color:black;border:none;border-radius:var(--radius-sm);font-weight:600;cursor:pointer;">Continuar</button>
        </div>
    </div>

    <!-- ============================================
    JAVASCRIPT PRINCIPAL
    ============================================ -->
    <script>
        // ============================================
        // 1. CONFIGURACIÓN DE FIREBASE
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyBEapmpody3y_vFyPF0ngUnCn5ZFOtxPjs",
            authDomain: "aguadulce-express-v2.firebaseapp.com",
            databaseURL: "https://aguadulce-express-v2-default-rtdb.firebaseio.com",
            projectId: "aguadulce-express-v2",
            storageBucket: "aguadulce-express-v2.appspot.com",
            messagingSenderId: "103953800507",
            appId: "1:103953800507:web:tu_app_id"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        const functions = firebase.functions();

        // ============================================
        // 2. VARIABLES GLOBALES
        // ============================================
        let currentUser = null;
        let currentView = 'activos';
        let restauranteId = null;
        let estaPausado = false;
        let sonidoActivo = false;
        let intervaloSonido = null;
        let pedidoSonando = null;
        let pedidosListeners = [];
        let enviosListeners = [];
        const TIEMPO_ELABORACION_DEFAULT = 20;
        let tiempoElaboracionRestaurante = TIEMPO_ELABORACION_DEFAULT;
        let impresoraConfigurada = false;
        let nombreImpresora = '';
        let pedidosAnteriores = {};

        // ============================================
        // 3. FUNCIONES UTILITARIAS
        // ============================================
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateY(20px)'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function escapeHTML(str) { if (!str) return ''; return str.replace(/[&<>"]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; if (m === '"') return '&quot;'; return m; }); }

        function delay(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

        // ============================================
        // 4. ORIENTACIÓN
        // ============================================
        function detectarOrientacion() {
            const esTableta = window.innerWidth >= 768 && window.innerWidth <= 1024;
            const esVertical = window.innerHeight > window.innerWidth;
            const overlay = document.getElementById('orientacion-overlay');
            if (esTableta && esVertical) overlay.classList.remove('hidden');
            else overlay.classList.add('hidden');
        }
        window.addEventListener('resize', detectarOrientacion);
        window.addEventListener('orientationchange', () => setTimeout(detectarOrientacion, 300));
        document.addEventListener('DOMContentLoaded', detectarOrientacion);

        // ============================================
        // 5. MENÚ
        // ============================================
        const menuToggle = document.getElementById('menu-toggle');
        const menuDesplegable = document.getElementById('menu-desplegable');
        if (menuToggle) {
            menuToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                menuDesplegable.classList.toggle('open');
                menuToggle.classList.toggle('active');
                menuToggle.textContent = menuDesplegable.classList.contains('open') ? '✕' : '☰';
            });
            document.addEventListener('click', (e) => {
                if (!menuDesplegable.contains(e.target) && e.target !== menuToggle) {
                    menuDesplegable.classList.remove('open');
                    menuToggle.classList.remove('active');
                    menuToggle.textContent = '☰';
                }
            });
        }

        // ============================================
        // 6. MENÚ - CAMBIO DE VISTA
        // ============================================
        document.querySelectorAll('.menu-item[data-view]').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.menu-item[data-view]').forEach(el => el.classList.remove('active'));
                item.classList.add('active');
                currentView = item.dataset.view;
                renderizarVista();
                menuDesplegable.classList.remove('open');
                menuToggle.classList.remove('active');
                menuToggle.textContent = '☰';
            });
        });

        // ============================================
        // 7. AUTENTICACIÓN
        // ============================================
        const loginForm = document.getElementById('login-form');
        const loginEmail = document.getElementById('login-email');
        const loginPassword = document.getElementById('login-password');
        const loginBtn = document.getElementById('login-btn');
        const loginText = document.getElementById('login-text');
        const loginLoading = document.getElementById('login-loading');
        const loginError = document.getElementById('login-error');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = loginEmail.value.trim();
            const password = loginPassword.value;
            if (!email || !password) { loginError.textContent = 'Completa todos los campos'; loginError.style.display = 'block'; return; }
            loginBtn.disabled = true;
            loginText.style.display = 'none';
            loginLoading.style.display = 'inline';
            loginError.style.display = 'none';
            try {
                const credenciales = await auth.signInWithEmailAndPassword(email, password);
                const user = credenciales.user;
                const snapshot = await db.ref(`restaurantes/${user.uid}`).once('value');
                if (!snapshot.exists()) { await auth.signOut(); throw new Error('Esta cuenta no es un restaurante válido'); }
                showToast('✅ Bienvenido al panel de cocina', 'success');
            } catch (error) {
                console.error('Error de login:', error);
                loginError.textContent = error.message;
                loginError.style.display = 'block';
                loginBtn.disabled = false;
                loginText.style.display = 'inline';
                loginLoading.style.display = 'none';
            }
        });

        // ============================================
        // 8. ESTADO DE AUTENTICACIÓN
        // ============================================
        auth.onAuthStateChanged(async (user) => {
            const app = document.getElementById('app');
            const loginContainer = document.getElementById('login-container');
            if (user) {
                console.log('✅ Usuario autenticado:', user.uid);
                currentUser = user;
                restauranteId = user.uid;
                loginContainer.classList.add('hidden');
                app.classList.remove('hidden');
                await cargarDatosRestaurante();
                await cargarEstadoPausa();
                await cargarTiempoElaboracion();
                await cargarConfiguracionImpresora();
                escucharPedidos();
                escucharEnvios();
                setTimeout(() => renderizarVista(), 500);
                setTimeout(solicitarPermisoNotificaciones, 3000);
            } else {
                console.log('❌ Sin usuario autenticado');
                app.classList.add('hidden');
                loginContainer.classList.remove('hidden');
                pedidosListeners.forEach(ref => { try { ref.off(); } catch(e) {} });
                pedidosListeners = [];
                enviosListeners.forEach(ref => { try { ref.off(); } catch(e) {} });
                enviosListeners = [];
            }
        });

        // ============================================
        // 9. CERRAR SESIÓN
        // ============================================
        document.getElementById('btn-cerrar-sesion').addEventListener('click', async () => {
            if (confirm('¿Seguro que quieres cerrar sesión?')) {
                await auth.signOut();
                showToast('👋 Sesión cerrada', 'info');
            }
        });

        // ============================================
        // 10. CARGAR DATOS DEL RESTAURANTE
        // ============================================
        async function cargarDatosRestaurante() {
            try {
                const snapshot = await db.ref(`restaurantes/${restauranteId}`).once('value');
                const data = snapshot.val();
                if (data) {
                    const nombre = data.NOMBRE_RESTAURANTE || data.nombre || 'Restaurante';
                    const email = data.email || '';
                    document.getElementById('restaurante-nombre').textContent = nombre;
                    document.getElementById('restaurante-email').textContent = email;
                    document.getElementById('header-restaurante').textContent = nombre;
                    document.getElementById('header-email').textContent = email;
                }
            } catch (error) { console.error('Error al cargar restaurante:', error); }
        }

        // ============================================
        // 11. CARGAR TIEMPO DE ELABORACIÓN
        // ============================================
        async function cargarTiempoElaboracion() {
            try {
                const snapshot = await db.ref(`restaurantes/${restauranteId}/tiempo_elaboracion`).once('value');
                const valor = snapshot.val();
                tiempoElaboracionRestaurante = valor || TIEMPO_ELABORACION_DEFAULT;
                console.log(`⏱️ Tiempo de elaboración: ${tiempoElaboracionRestaurante} minutos`);
            } catch (error) {
                console.error('Error al cargar tiempo de elaboración:', error);
                tiempoElaboracionRestaurante = TIEMPO_ELABORACION_DEFAULT;
            }
        }

        // ============================================
        // 12. ESTADO DE PAUSA
        // ============================================
        async function cargarEstadoPausa() {
            try {
                const snapshot = await db.ref(`restaurantes/${restauranteId}/pausado`).once('value');
                estaPausado = snapshot.val() === true;
                actualizarUIEstadoPausa();
            } catch (error) { console.error('Error al cargar estado de pausa:', error); }
        }

        function actualizarUIEstadoPausa() {
            const banner = document.getElementById('pausa-banner');
            const btnHeader = document.getElementById('btn-pausa-header');
            const estadoTexto = document.getElementById('estado-texto-header');
            const estadoMenu = document.getElementById('estado-pausa-menu');
            const iconoPausa = document.getElementById('icono-pausa');
            const textoPausa = document.getElementById('texto-pausa');
            
            if (estaPausado) {
                banner.style.display = 'block';
                btnHeader.className = 'header-status paused';
                estadoTexto.textContent = 'Pausado';
                if (estadoMenu) estadoMenu.textContent = '⏸️ PAUSADO';
                if (iconoPausa) iconoPausa.textContent = '▶️';
                if (textoPausa) textoPausa.textContent = 'Reanudar';
                btnHeader.innerHTML = `<span class="dot"></span><span id="estado-texto-header">Pausado</span>`;
            } else {
                banner.style.display = 'none';
                btnHeader.className = 'header-status active';
                estadoTexto.textContent = 'Activo';
                if (estadoMenu) estadoMenu.textContent = '● Activo';
                if (iconoPausa) iconoPausa.textContent = '⏸️';
                if (textoPausa) textoPausa.textContent = 'Pausar';
                btnHeader.innerHTML = `<span class="dot"></span><span id="estado-texto-header">Activo</span>`;
            }
        }

        window.togglePausa = async function() {
            try {
                const nuevoEstado = !estaPausado;
                await db.ref(`restaurantes/${restauranteId}/pausado`).set(nuevoEstado);
                estaPausado = nuevoEstado;
                actualizarUIEstadoPausa();
                showToast(estaPausado ? '⏸️ Restaurante en PAUSA' : '▶️ Restaurante ACTIVO', estaPausado ? 'warning' : 'success');
            } catch (error) {
                console.error('Error al cambiar estado de pausa:', error);
                showToast('❌ Error al cambiar estado de pausa', 'error');
            }
        };

        // ============================================
        // 13. ESCUCHAR PEDIDOS
        // ============================================
        function escucharPedidos() {
            pedidosListeners.forEach(ref => { try { ref.off(); } catch(e) {} });
            pedidosListeners = [];
            const pedidosRef = db.ref('pedidos');
            pedidosRef.on('value', (snapshot) => {
                const pedidos = snapshot.val() || {};
                const pedidosActuales = {};
                for (const [id, data] of Object.entries(pedidos)) pedidosActuales[id] = data;
                const nuevosPedidos = [];
                for (const [id, data] of Object.entries(pedidosActuales)) {
                    if (!pedidosAnteriores[id]) {
                        const restId = data.restauranteId || data.restaurante_id || data.uid_restaurante;
                        if (restId === restauranteId) nuevosPedidos.push({ id, ...data });
                    }
                }
                if (nuevosPedidos.length > 0) {
                    console.log(`🔔 ${nuevosPedidos.length} nuevo(s) pedido(s)`);
                    for (const pedido of nuevosPedidos) {
                        const cliente = pedido.cliente_nombre || pedido.clienteNombre || 'Cliente';
                        showToast(`📦 Nuevo pedido de ${cliente}`, 'info');
                        const estado = pedido.estado ? pedido.estado.toLowerCase() : '';
                        if (estado === 'recibido' || estado === 'pendiente') {
                            if (!sonidoActivo) iniciarSonidoRepetido(pedido.id);
                        }
                    }
                }
                pedidosAnteriores = pedidosActuales;
                renderizarVista();
            });
            pedidosListeners.push(pedidosRef);
            console.log('✅ Listener de pedidos activado');
        }

        // ============================================
        // 14. ESCUCHAR ENVÍOS
        // ============================================
        function escucharEnvios() {
            enviosListeners.forEach(ref => { try { ref.off(); } catch(e) {} });
            enviosListeners = [];
            const enviosRef = db.ref('envios');
            enviosRef.on('value', (snapshot) => {
                const envios = snapshot.val() || {};
                let countEnvios = 0;
                for (const [id, data] of Object.entries(envios)) {
                    if (data.uid_restaurante === restauranteId && data.estado !== 'entregado') countEnvios++;
                }
                renderizarVista();
            });
            enviosListeners.push(enviosRef);
        }

        // ============================================
        // 15. SONIDO REPETIDO
        // ============================================
        function reproducirSonidoLlegada() {
            try {
                const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
                audio.volume = 0.9;
                audio.play().catch(e => console.log('⚠️ Sonido bloqueado'));
                if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            } catch (error) { console.log('⚠️ Error al reproducir sonido:', error); }
        }

        function iniciarSonidoRepetido(pedidoId) {
            if (pedidoSonando === pedidoId || sonidoActivo) return;
            sonidoActivo = true;
            pedidoSonando = pedidoId;
            let repeticiones = 0;
            if (intervaloSonido) clearInterval(intervaloSonido);
            reproducirSonidoLlegada();
            intervaloSonido = setInterval(() => {
                repeticiones++;
                db.ref(`pedidos/${pedidoId}/estado`).once('value').then((snap) => {
                    const estado = snap.val() ? snap.val().toLowerCase() : '';
                    if (estado !== 'recibido' && estado !== 'pendiente') { detenerSonidoRepetido(); return; }
                }).catch(() => {});
                if (repeticiones >= 30) detenerSonidoRepetido();
                else reproducirSonidoLlegada();
            }, 3000);
        }

        function detenerSonidoRepetido() {
            if (intervaloSonido) { clearInterval(intervaloSonido); intervaloSonido = null; }
            sonidoActivo = false;
            pedidoSonando = null;
        }

        // ============================================
        // 16. RENDERIZAR VISTA PRINCIPAL
        // ============================================
        function renderizarVista() {
            if (currentView === 'historial') {
                mostrarVistaHistorial();
                return;
            }
            if (currentView === 'demoras') {
                mostrarVistaDemoras();
                return;
            }
            cargarPedidosActivos();
        }

        // ============================================
        // 17. CARGAR PEDIDOS ACTIVOS
        // ============================================
        function cargarPedidosActivos() {
            const colPendiente = document.getElementById('col-pendiente');
            const colCoccion = document.getElementById('col-coccion');
            const colListo = document.getElementById('col-listo');
            if (colPendiente) colPendiente.innerHTML = '';
            if (colCoccion) colCoccion.innerHTML = '';
            if (colListo) colListo.innerHTML = '';

            db.ref('pedidos').once('value').then((snapshot) => {
                const pedidos = snapshot.val();
                let countPendiente = 0, countCoccion = 0, countListo = 0;
                if (!pedidos) {
                    mostrarMensajeVacio('col-pendiente', '📥', 'No hay pedidos en entrada');
                    mostrarMensajeVacio('col-coccion', '👨‍🍳', 'No hay pedidos en proceso');
                    mostrarMensajeVacio('col-listo', '✅', 'No hay pedidos listos');
                    actualizarContadores(0, 0, 0);
                    return;
                }
                const pedidosArray = Object.entries(pedidos);
                for (const [id, data] of pedidosArray) {
                    const restId = data.restauranteId || data.restaurante_id || data.uid_restaurante;
                    if (restId !== restauranteId) continue;
                    let estado = data.estado ? data.estado.toLowerCase() : '';
                    if (estado === 'recibido') estado = 'pendiente';
                    if (estado === 'pendiente') { countPendiente++; agregarPedidoAColumna(id, { ...data, estado }); }
                    else if (estado === 'coccion') { countCoccion++; agregarPedidoAColumna(id, { ...data, estado }); }
                    else if (estado === 'listo' || estado === 'en_reparto') { countListo++; agregarPedidoAColumna(id, { ...data, estado }); }
                }
                if (countPendiente === 0) mostrarMensajeVacio('col-pendiente', '📥', 'No hay pedidos en entrada');
                if (countCoccion === 0) mostrarMensajeVacio('col-coccion', '👨‍🍳', 'No hay pedidos en proceso');
                if (countListo === 0) mostrarMensajeVacio('col-listo', '✅', 'No hay pedidos listos');
                actualizarContadores(countPendiente, countCoccion, countListo);
            }).catch((error) => { console.error('Error al cargar pedidos:', error); });
        }

        // ============================================
        // 18. AGREGAR PEDIDO A COLUMNA
        // ============================================
        function agregarPedidoAColumna(id, data) {
            let estado = data.estado || 'pendiente';
            if (estado === 'recibido') estado = 'pendiente';
            
            let columnaId = '', contadorRef = '';
            switch(estado) {
                case 'pendiente': columnaId = 'col-pendiente'; contadorRef = 'count-pendiente'; break;
                case 'coccion': columnaId = 'col-coccion'; contadorRef = 'count-coccion'; break;
                case 'listo': case 'en_reparto': columnaId = 'col-listo'; contadorRef = 'count-listo'; break;
                default: columnaId = 'col-pendiente'; contadorRef = 'count-pendiente';
            }
            
            const container = document.getElementById(columnaId);
            if (!container) return;
            
            const contador = document.getElementById(contadorRef);
            if (contador) contador.textContent = parseInt(contador.textContent) + 1;

            const clienteNombre = data.cliente_nombre || data.clienteNombre || 'Cliente';
            const telefono = data.cliente_telefono || data.telefono || 'Sin teléfono';
            const direccion = data.direccion || 'Sin dirección';
            const idPedido = data.id_pedido || data.id || id.substring(0, 8);
            const total = data.total || 0;
            const timestamp = data.timestamp ? new Date(data.timestamp).toLocaleTimeString() : '';

            const tiempoInicio = data.timestamp_inicio || data.timestamp || Date.now();
            const tiempoActual = Date.now();
            const tiempoTranscurrido = Math.floor((tiempoActual - tiempoInicio) / 60000);
            const tiempoLimite = data.tiempo_limite || tiempoElaboracionRestaurante || TIEMPO_ELABORACION_DEFAULT;
            const tiempoRestante = Math.max(0, tiempoLimite - tiempoTranscurrido);
            const enDemora = tiempoTranscurrido > tiempoLimite;

            let tiempoDisplay = '', badgeDemora = '';
            if (estado === 'pendiente') {
                tiempoDisplay = '⏳ Esperando';
            } else if (estado === 'coccion') {
                if (enDemora) {
                    tiempoDisplay = `⏱️ ${tiempoTranscurrido} min (DEMORA)`;

                    tiempoDisplay = `⏱️ ${tiempoTranscurrido} min (${tiempoRestante} min restante)`;

            } else if (estado === 'listo' || estado === 'en_reparto') {
                const tiempoListo = data.timestamp_listo || Date.now();
                const tiempoEspera = Math.floor((tiempoActual - tiempoListo) / 60000);
                tiempoDisplay = `✅ Listo (${tiempoEspera} min espera)`;
            }

            let productosHtml = '';
            if (data.items && data.items.length > 0) {
                productosHtml = data.items.map(item => `<span>${item.cantidad || 1}x ${item.nombre}</span>`).join('');
            } else if (data.productos) {
                productosHtml = Object.entries(data.productos).map(([pid, prod]) => `<span>${prod.cantidad || 1}x ${prod.nombre}</span>`).join('');
            } else {
                productosHtml = '<span>Sin productos</span>';
            }

            let botones = '';
            if (estado === 'pendiente') {
                botones = `
                    <button class="btn btn-success" onclick="aceptarPedido('${id}')">✅ Aceptar</button>
                    <button class="btn btn-danger" onclick="rechazarPedido('${id}')">❌ Rechazar</button>
                `;
            } else if (estado === 'coccion') {
                botones = `
                    <button class="btn btn-success" onclick="marcarListo('${id}')">✅ Marcar Listo</button>
                    <button class="btn btn-secondary" onclick="verDetallePedido('${id}')">📋 Detalle</button>
                    <button class="btn btn-primary" onclick="imprimirComandaConImpresora('${id}')">🖨️</button>
                `;
            } else if (estado === 'listo' || estado === 'en_reparto') {
                const repartidor = data.repartidor_nombre || data.uid_repartidor || 'Asignado';
                botones = `
                    <span style="font-size:10px;color:var(--accent-purple);padding:2px 8px;background:rgba(139,92,246,0.1);border-radius:50px;">🛵 ${repartidor}</span>
                    <button class="btn btn-success" onclick="marcarRecogido('${id}')">🛵 Recogido</button>
                    <button class="btn btn-secondary" onclick="verDetallePedido('${id}')">📋 Detalle</button>
                    <button class="btn btn-primary" onclick="imprimirComandaConImpresora('${id}')">🖨️</button>
                `;
            }

            const card = document.createElement('div');
            card.className = `order-card${enDemora && estado === 'coccion' ? ' delayed' : ''}`;
            card.innerHTML = `
                <div class="top">
                    <span class="id">#${idPedido}</span>
                    <span class="time">${timestamp}</span>
                </div>
                <div class="cliente">${escapeHTML(clienteNombre)}</div>
                <div class="direccion">${escapeHTML(direccion)}</div>
                <div class="telefono">📞 ${escapeHTML(telefono)}</div>
                <div class="timer">
                    <span class="label">${estado === 'coccion' ? '⏱️ Elaboración' : '📌 Estado'}</span>
                    <span class="value${enDemora && estado === 'coccion' ? ' delayed' : ''}">${tiempoDisplay}</span>
                    ${badgeDemora}
                </div>
                <div class="productos">${productosHtml}</div>
                <div class="footer">
                    <span class="precio">$${total.toFixed(2)}</span>
                    <span class="badge-estado ${estado}">${estado === 'pendiente' ? 'Pendiente' : estado === 'coccion' ? 'En Cocción' : 'Listo'}</span>
                </div>
                <div class="actions">${botones}</div>

        }

        window.aceptarPedido = async function(pedidoId) {
            if (estaPausado) { showToast('⏸️ Restaurante en pausa', 'warning'); return; }
            try {
                await db.ref(`pedidos/${pedidoId}/estado`).set('coccion');
                await db.ref(`pedidos/${pedidoId}/timestamp_inicio`).set(Date.now());
                await db.ref(`pedidos/${pedidoId}/historial`).push({ estado: 'coccion', timestamp: Date.now(), usuario: currentUser.uid, accion: 'aceptado' });
                showToast('✅ Pedido aceptado', 'success');
                renderizarVista();
                await notificarRepartidor(pedidoId);
                detenerSonidoRepetido();
            } catch (error) { console.error('Error al aceptar pedido:', error); showToast('❌ Error al aceptar pedido', 'error'); }
        };

        window.rechazarPedido = async function(pedidoId) {
            const confirm = await Swal.fire({ title: '❌ ¿Rechazar pedido?', text: 'El cliente recibirá una notificación', icon: 'warning', showCancelButton: true, confirmButtonText: 'Sí, rechazar', cancelButtonText: 'Cancelar', background: '#0f172a', color: 'white' });
            if (!confirm.isConfirmed) return;
            try {
                await db.ref(`pedidos/${pedidoId}/estado`).set('rechazado');
                await db.ref(`pedidos/${pedidoId}/motivo_rechazo`).set('Rechazado por el restaurante');
                await db.ref(`pedidos/${pedidoId}/historial`).push({ estado: 'rechazado', timestamp: Date.now(), usuario: currentUser.uid, accion: 'rechazado' });
                showToast('❌ Pedido rechazado', 'error');
                renderizarVista();
                detenerSonidoRepetido();
            } catch (error) { console.error('Error al rechazar pedido:', error); showToast('❌ Error al rechazar pedido', 'error'); }
        };

        window.marcarListo = async function(pedidoId) {
            try {
                const snapshot = await db.ref(`pedidos/${pedidoId}`).once('value');
                const data = snapshot.val();
                if (!data) { showToast('❌ Pedido no encontrado', 'error'); return; }
                const tiempoInicio = data.timestamp_inicio || data.timestamp || Date.now();
                const tiempoPreparacion = Math.floor((Date.now() - tiempoInicio) / 60000);
                const tiempoLimite = data.tiempo_limite || tiempoElaboracionRestaurante || TIEMPO_ELABORACION_DEFAULT;
                const demora = Math.max(0, tiempoPreparacion - tiempoLimite);
                await db.ref(`pedidos/${pedidoId}/estado`).set('LISTO');
                await db.ref(`pedidos/${pedidoId}/tiempo_preparacion`).set(tiempoPreparacion);
                await db.ref(`pedidos/${pedidoId}/timestamp_listo`).set(Date.now());
                await db.ref(`pedidos/${pedidoId}/historial`).push({ estado: 'LISTO', timestamp: Date.now(), usuario: currentUser.uid, accion: 'marcado_listo', tiempo_preparacion: tiempoPreparacion });
                if (demora > 0) {
                    await db.ref(`pedidos/${pedidoId}/demora`).set(demora);
                    await db.ref(`pedidos/${pedidoId}/tiempo_demora`).set(demora);
                    await db.ref(`pedidos/${pedidoId}/historial`).push({ estado: 'demora_registrada', timestamp: Date.now(), usuario: currentUser.uid, demora, tiempo_limite: tiempoLimite, accion: 'registrar_demora_automatica' });
                    showToast(`⏱️ Demora registrada: ${demora} minutos`, 'warning');
                }
                showToast(`✅ Pedido listo (${tiempoPreparacion} min)`, 'success');
                renderizarVista();
            } catch (error) { console.error('Error al marcar listo:', error); showToast('❌ Error al marcar listo', 'error'); }
        };

        window.marcarRecogido = async function(pedidoId) {
            const confirm = await Swal.fire({ title: '🛵 ¿Pedido recogido?', text: 'Confirmar que el repartidor ya recogió el pedido', icon: 'question', showCancelButton: true, confirmButtonText: 'Sí, recogido', cancelButtonText: 'Cancelar', background: '#0f172a', color: 'white' });
            if (!confirm.isConfirmed) return;
            try {
                await db.ref(`pedidos/${pedidoId}/estado`).set('entregado');
                await db.ref(`pedidos/${pedidoId}/timestamp_entregado`).set(Date.now());
                await db.ref(`pedidos/${pedidoId}/historial`).push({ estado: 'entregado', timestamp: Date.now(), usuario: currentUser.uid, accion: 'recogido' });
                showToast('✅ Pedido entregado al repartidor', 'success');
                renderizarVista();
            } catch (error) { console.error('Error al marcar recogido:', error); showToast('❌ Error al marcar recogido', 'error'); }
        };

        // ============================================
        // 21. NOTIFICACIONES PUSH
        // ============================================
        async function enviarNotificacionConCloudFunction(uidRepartidor, pedidoId, tipo = 'pedido') {
            try {
                const tokenSnap = await db.ref(`repartidores/${uidRepartidor}/token`).once('value');
                const token = tokenSnap.val();
                if (!token) { console.warn('⚠️ Repartidor sin token FCM:', uidRepartidor); return; }
                let datos = null, titulo = '', mensaje = '';
                if (tipo === 'pedido') {
                    const pedidoSnap = await db.ref(`pedidos/${pedidoId}`).once('value');
                    datos = pedidoSnap.val();
                    titulo = '🛵 Nuevo pedido disponible';
                    mensaje = `Recoge el pedido de ${datos?.cliente_nombre || 'cliente'} en ${datos?.restaurante_nombre || 'el restaurante'}`;
                } else {
                    const envioSnap = await db.ref(`envios/${pedidoId}`).once('value');
                    datos = envioSnap.val();
                    titulo = '📦 Nuevo reparto disponible';
                    mensaje = `Recoge el reparto de ${datos?.cliente_nombre || 'cliente'}${datos?.debe_cobrar ? ' - 💵 Cobrar en sitio' : ''}`;
                }
                if (!datos) { console.warn('⚠️ Datos no encontrados:', pedidoId); return; }
                const enviarNotificacion = functions.httpsCallable('enviarNotificationPedido');
                const result = await enviarNotificacion({ token, titulo, mensaje, data: { tipo, uid: uidRepartidor, pedidoId } });
                console.log('✅ Notificación push enviada:', result.data);
                return result.data;
            } catch (error) { console.error('❌ Error al enviar notificación:', error); throw error; }
        }

        window.notificarRepartidor = async function(pedidoId) {
            try {
                const pedidoSnap = await db.ref(`pedidos/${pedidoId}`).once('value');
                const pedido = pedidoSnap.val();
                if (!pedido) { console.error('❌ Pedido no encontrado'); return; }
                const repartidoresSnap = await db.ref('repartidores').orderByChild('activo').equalTo(true).once('value');
                const repartidores = repartidoresSnap.val();
                if (!repartidores) { showToast('⚠️ No hay repartidores disponibles', 'warning'); return; }
                let repartidorId = null, repartidorData = null;
                for (const [uid, data] of Object.entries(repartidores)) {
                    const pedidosActivosSnap = await db.ref('pedidos').orderByChild('uid_repartidor').equalTo(uid).once('value');
                    const pedidosActivos = pedidosActivosSnap.val();
                    let tienePedidosActivos = false;
                    if (pedidosActivos) {
                        for (const [pid, pData] of Object.entries(pedidosActivos)) {
                            const estado = pData.estado ? pData.estado.toLowerCase() : '';
                            if (estado === 'en_reparto' || estado === 'listo' || estado === 'reparto') { tienePedidosActivos = true; break; }
                        }
                    }
                    if (!tienePedidosActivos) { repartidorId = uid; repartidorData = data; break; }
                }
                if (!repartidorId) {
                    const keys = Object.keys(repartidores);
                    if (keys.length > 0) { repartidorId = keys[0]; repartidorData = repartidores[keys[0]]; console.log('⚠️ Todos los repartidores ocupados, asignando al primero:', repartidorId); }
                    else { showToast('⚠️ No hay repartidores disponibles', 'warning'); return; }
                }
                await db.ref(`pedidos/${pedidoId}/uid_repartidor`).set(repartidorId);
                await db.ref(`pedidos/${pedidoId}/repartidor_nombre`).set(repartidorData.nombre || 'Repartidor');
                await db.ref(`pedidos/${pedidoId}/timestamp_asignacion`).set(Date.now());
                await db.ref(`pedidos/${pedidoId}/historial`).push({ estado: 'coccion', timestamp: Date.now(), usuario: currentUser.uid, accion: 'asignar_repartidor', repartidor: repartidorId, repartidor_nombre: repartidorData.nombre || 'Repartidor' });
                await enviarNotificacionConCloudFunction(repartidorId, pedidoId, 'pedido');
                showToast(`✅ Repartidor asignado: ${repartidorData.nombre || 'Repartidor'}`, 'success');
                renderizarVista();
            } catch (error) { console.error('❌ Error en notificarRepartidor:', error); showToast('❌ Error al asignar repartidor', 'error'); }
        };

        function cargarHistorialFiltrado() {
            const content = document.getElementById('historial-contenido');
            const contador = document.getElementById('col-count-historial');
            const filtro = document.getElementById('filtro-historial');
            if (!content) return;
            const filtroSeleccionado = filtro ? filtro.value : 'todos';
            content.innerHTML = '';
            db.ref('pedidos').once('value').then(snap => {
                const pedidos = snap.val();
                let count = 0;
                if (!pedidos) {
                    content.innerHTML = `<div class="empty"><div class="icon">📜</div><div>No hay pedidos en el historial</div></div>`;
                    if (contador) contador.textContent = '0';
                    return;
                }
                const pedidosArray = Object.entries(pedidos);
                for (const [id, data] of pedidosArray) {
                    const restId = data.restauranteId || data.restaurante_id || data.uid_restaurante;
                    if (restId !== restauranteId) continue;
                    const estado = data.estado ? data.estado.toLowerCase() : '';
                    const tipo = data.tipo || 'normal';
                    if (filtroSeleccionado === 'ventas' && tipo === 'reparto_personal') continue;
                    if (filtroSeleccionado === 'repartos' && tipo !== 'reparto_personal') continue;
                    if (estado === 'entregado' || estado === 'cancelado' || estado === 'rechazado') {
                        count++;
                        const esReparto = tipo === 'reparto_personal';
                        const card = document.createElement('div');
                        card.className = 'order-card';
                        card.style.borderLeft = `4px solid ${esReparto ? 'var(--accent-purple)' : '#64748b'}`;
                        const fecha = data.timestamp ? new Date(data.timestamp).toLocaleString() : 'Sin fecha';
                        let productosHtml = '';
                        if (data.items && data.items.length > 0) {
                            productosHtml = data.items.map(item => `<span>${item.cantidad || 1}x ${item.nombre}</span>`).join('');
                        } else {
                            productosHtml = '<span>Sin productos</span>';
                        }
                        let montoHtml = `<div style="display:flex;justify-content:space-between;font-size:0.8rem;margin-top:0.3rem;border-top:1px solid var(--border-color);padding-top:0.3rem;"><span style="color:var(--text-muted);font-weight:700;">💰 Total</span><span style="color:var(--accent-gold);font-weight:700;">$${(data.total || 0).toFixed(2)}</span></div>`;
                        if (esReparto && data.envio) {
                            montoHtml = `<div style="display:flex;justify-content:space-between;font-size:0.8rem;margin-top:0.3rem;border-top:1px solid var(--border-color);padding-top:0.3rem;"><span style="color:var(--text-muted);font-weight:700;">🚚 Envío</span><span style="color:var(--accent-purple);font-weight:700;">$${data.envio.toFixed(2)}</span></div>`;
                        }
                        card.innerHTML = `
                            <div class="top"><span class="id">#${data.id_pedido || id.substring(0,8)}</span><span class="time">${fecha}</span></div>
                            <div class="cliente">${escapeHTML(data.cliente_nombre || 'Cliente')}</div>
                            <div class="direccion">${escapeHTML(data.direccion || 'Sin dirección')}</div>
                            <div style="display:flex;gap:0.3rem;margin-top:0.3rem;flex-wrap:wrap;">
                                <span style="font-size:0.6rem;padding:0.1rem 0.5rem;border-radius:50px;background:${esReparto ? 'rgba(139,92,246,0.15)' : 'rgba(245,158,11,0.15)'};color:${esReparto ? 'var(--accent-purple)' : 'var(--accent-gold)'};">${esReparto ? '📦 Reparto' : '🛒 Venta'}</span>
                                <span style="font-size:0.6rem;padding:0.1rem 0.5rem;border-radius:50px;background:rgba(16,185,129,0.15);color:var(--accent-green);">${estado === 'entregado' ? '✅ Entregado' : '❌ Cancelado'}</span>
                            </div>
                            <div class="productos">${productosHtml}</div>
                            ${montoHtml}
                            <div class="actions"><button class="btn btn-secondary" onclick="verDetallePedido('${id}')">📋 Detalle</button></div>
                        `;
                        content.appendChild(card);
                    }
                }
                if (contador) contador.textContent = count;
                if (count === 0) {
                    const mensaje = filtroSeleccionado === 'ventas' ? 'No hay pedidos de ventas' : filtroSeleccionado === 'repartos' ? 'No hay repartos personales' : 'No hay pedidos en el historial';
                    content.innerHTML = `<div class="empty"><div class="icon">📜</div><div>${mensaje}</div></div>`;
                }
            }).catch(error => { console.error('❌ Error al cargar historial:', error); });
        }

        function mostrarVistaDemoras() {

                <div class="view-content" id="demoras-contenido"></div>
            `;

            db.ref('pedidos').once('value').then((snapshot) => {
                const pedidos = snapshot.val();
                const content = document.getElementById('demoras-contenido');
                const contador = document.getElementById('col-count-demoras');
                if (!pedidos) { content.innerHTML = `<div class="empty"><div class="icon">⏱️</div><div>No hay registros de demoras</div></div>`; if (contador) contador.textContent = '0'; return; }
                let demoras = [], totalDemora = 0, maxDemora = 0, countDemora = 0;
                for (const [id, data] of Object.entries(pedidos)) {
                    const restId = data.restauranteId || data.restaurante_id || data.uid_restaurante;
                    if (restId !== restauranteId) continue;
                    const demora = data.demora || data.tiempo_demora || 0;

                        demoras.push({
                            id, id_pedido: data.id_pedido || id.substring(0, 8),
                            cliente: data.cliente_nombre || 'Cliente',
                            telefono: data.cliente_telefono || 'Sin teléfono',
                            total: data.total || 0, estado: data.estado || 'Finalizado',
                            demora, tiempo_preparacion: data.tiempo_preparacion || 0,
                            fecha: data.timestamp ? new Date(data.timestamp) : null,
                            items: data.items || data.productos || []
                        });
                        totalDemora += demora; maxDemora = Math.max(maxDemora, demora); countDemora++;
                    }
                }
                demoras.sort((a, b) => b.demora - a.demora);
                if (demoras.length === 0) { content.innerHTML = `<div class="empty"><div class="icon">⏱️</div><div>No hay registros de demoras</div></div>`; if (contador) contador.textContent = '0'; return; }

        async function crearEnvio(data) {
            try {
                const repartidoresSnap = await db.ref('repartidores').orderByChild('activo').equalTo(true).once('value');
                const repartidores = repartidoresSnap.val();
                if (!repartidores) { showToast('⚠️ No hay repartidores disponibles', 'warning'); return; }
                let repartidorId = null, repartidorData = null;
                for (const [uid, rData] of Object.entries(repartidores)) {
                    const pedidosActivosSnap = await db.ref('pedidos').orderByChild('uid_repartidor').equalTo(uid).once('value');
                    const pedidosActivos = pedidosActivosSnap.val();
                    let tienePedidosActivos = false;
                    if (pedidosActivos) {
                        for (const [pid, pData] of Object.entries(pedidosActivos)) {
                            const estado = pData.estado ? pData.estado.toUpperCase() : '';
                            if (estado === 'EN_REPARTO' || estado === 'LISTO' || estado === 'REPARTO') { tienePedidosActivos = true; break; }
                        }
                    }
                    if (!tienePedidosActivos) { repartidorId = uid; repartidorData = rData; break; }
                }
                if (!repartidorId) {
                    const keys = Object.keys(repartidores);
                    if (keys.length > 0) { repartidorId = keys[0]; repartidorData = repartidores[keys[0]]; }
                    else { showToast('⚠️ No hay repartidores disponibles', 'warning'); return; }
                }
                const pedidoId = db.ref('pedidos').push().key;
                const pedido = {
                    uid_restaurante: restauranteId, restaurante_id: restauranteId,
                    restaurante_nombre: document.getElementById('header-restaurante').textContent || 'Restaurante',
                    uid_repartidor: repartidorId, repartidor_nombre: repartidorData.nombre || 'Repartidor',
                    uid_cliente: 'reparto_personal', cliente_nombre: data.cliente, cliente_telefono: data.telefono,
                    direccion: data.direccion, items: [{ nombre: '📦 Reparto Personal', cantidad: 1, precio_unitario: 0, total: 0 }],
                    total: 0, subtotal: 0, envio: data.costoEnvio || 5.00, estado: 'LISTO',
                    tipo: 'reparto_personal', metodo_pago: data.pago === 'pagado' ? 'Pagado' : 'Contra entrega',
                    nota: data.nota || '', debe_cobrar: data.pago === 'cobrar',
                    timestamp: Date.now(), timestamp_inicio: Date.now(), timestamp_listo: Date.now(),
                    tiempo_preparacion: 0, historial: [{ estado: 'LISTO', timestamp: Date.now(), accion: 'creado_por_restaurante', tipo: 'reparto_personal' }]
                };
                await db.ref(`pedidos/${pedidoId}`).set(pedido);
                showToast(`✅ Pedido #${pedidoId.substring(0,8)} listo - Envío: $${pedido.envio.toFixed(2)}`, 'success');
                renderizarVista();
                reproducirSonidoLlegada();
            } catch (error) { console.error('❌ Error al crear envío:', error); showToast('❌ Error al crear envío', 'error'); }
        }
