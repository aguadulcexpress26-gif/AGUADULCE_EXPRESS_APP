<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aguadulce Express - Cocina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #020617; font-family: 'Plus Jakarta Sans', sans-serif; }
        .card-pedido { background: #0f172a; border: 1px solid #1e293b; border-radius: 20px; padding: 16px; margin-bottom: 12px; transition: all 0.2s; }
        .btn-accion { transition: transform 0.1s; cursor: pointer; }
        .btn-accion:active { transform: scale(0.96); }
        .badge { background: rgba(6,182,212,0.2); color: #06b6d4; padding: 4px 12px; border-radius: 30px; font-size: 11px; font-weight: bold; display: inline-block; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        .tiempo-btn.verde { background-color: #22c55e !important; color: white !important; }
        .opacity-50 { opacity: 0.5; }
        .historial-item { cursor: pointer; transition: all 0.2s; }
        .historial-item:hover { background: #1e293b; transform: scale(0.98); }
        /* Estilo para la imagen del banner brillante y clara */
        .banner-img {
            filter: brightness(1.05) contrast(1.05) saturate(1.1);
            transition: all 0.3s ease;
        }
        .overlay-gradient {
            background: linear-gradient(to top, #020617 0%, transparent 40%, transparent 100%);
        }
    </style>
</head>
<body>

<div id="loginScreen" class="min-h-screen flex flex-col items-center justify-center p-5">
    <h1 class="text-4xl font-black italic uppercase text-cyan-400 mb-8 text-center">Aguadulce</h1>
    <p class="text-white/50 text-xs mb-4 text-center">🔐 PIN DEL RESTAURANTE</p>
    <input type="password" id="pinInput" maxlength="6" class="w-full max-w-[250px] p-4 rounded-2xl bg-white/5 border border-white/10 text-center text-2xl tracking-widest text-white">
    <button onclick="verificarPIN()" class="mt-6 bg-cyan-400 text-black px-8 py-3 rounded-2xl font-black uppercase block mx-auto">Ingresar</button>
</div>

<div id="appContent" class="hidden min-h-screen">
    <div class="relative h-56 overflow-hidden shadow-lg">
        <img id="restauranteFoto" class="absolute w-full h-full object-cover banner-img" src="">
        <div class="absolute inset-0 overlay-gradient"></div>
        <div class="absolute bottom-0 left-0 right-0 p-5 flex justify-between items-end">
            <div>
                <span class="text-cyan-400 text-xs font-bold uppercase tracking-wider backdrop-blur-sm bg-black/30 px-2 py-1 rounded-lg">📍 COCINA</span>
                <h1 id="restauranteNombre" class="text-2xl font-black text-white drop-shadow-lg">CARGANDO...</h1>
            </div>
            
            <div class="flex items-center gap-3">
                <div id="contenedorBotonTienda"></div>
                <button onclick="preguntarSalir()" class="bg-white/10 p-2 rounded-xl hover:bg-white/20 transition-all backdrop-blur-sm">🚪 SALIR</button>
            </div>
        </div>
    </div>

    <div class="p-4 flex flex-wrap justify-between items-center gap-3 border-b border-white/10">
        <div class="flex gap-3">
            <div class="badge">📥 PENDIENTES: <span id="totalPendientes">0</span></div>
            <div class="badge">🍳 EN COCINA: <span id="totalCocina">0</span></div>
            <div class="badge">✅ HISTORIAL: <span id="totalHistorial">0</span></div>
        </div>
        <div class="flex gap-4 items-center">
            <div class="text-right">
                <div class="text-[9px] text-white/40 uppercase">HOY / SEMANA</div>
                <div class="text-sm font-bold text-white"><span id="statHoy" class="text-white">0.00</span>€ / <span id="statSemana" class="text-white">0.00</span>€</div>
            </div>
            <button id="btnActivarSonido" class="bg-yellow-500/20 text-yellow-400 text-xs px-3 py-1 rounded-full hover:bg-yellow-500/30 transition-all">🔊 ACTIVAR SONIDO</button>
        </div>
    </div>

    <div class="p-4 grid grid-cols-1 md:grid-cols-3 gap-5">
        <div class="bg-black/30 rounded-2xl p-4 border border-white/5 min-h-[500px]">
            <h3 class="text-cyan-400 font-bold text-sm uppercase mb-3">📥 PEDIDOS ENTRANTES</h3>
            <div id="listaEntrantes" class="space-y-3 max-h-[65vh] overflow-y-auto"></div>
        </div>
        <div class="bg-black/30 rounded-2xl p-4 border border-white/5 min-h-[500px]">
            <h3 class="text-amber-400 font-bold text-sm uppercase mb-3">🍳 EN COCINA</h3>
            <div id="listaCocina" class="space-y-3 max-h-[65vh] overflow-y-auto"></div>
        </div>
        <div class="bg-black/30 rounded-2xl p-4 border border-white/5 min-h-[500px]">
            <h3 class="text-emerald-400 font-bold text-sm uppercase mb-3">✅ HISTORIAL</h3>
            <div id="listaHistorial" class="space-y-3 max-h-[65vh] overflow-y-auto"></div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCJcLQ0ikUwZSV7L_8mLLax8B5qnhP0Roc",
        authDomain: "aguadulce-notificaciones.firebaseapp.com",
        databaseURL: "https://aguadulce-notificaciones-default-rtdb.firebaseio.com",
        projectId: "aguadulce-notificaciones",
        storageBucket: "aguadulce-notificaciones.firebasestorage.app",
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const ACCESS_DB = { "DELI10":"6G4L1V", "CHUN20":"RT33M5", "HARO30":"8N3Z7K", "SUCU40":"TR92X5", "PERU50":"9V1L8K", "LIMA60":"FL44K8", "PECA70":"CV11Q9" };
    const scriptURL = "https://script.google.com/macros/s/AKfycbzYFDShcrP7I4FKhiH3q5UcEInpSKJstrumJ9ddI4Tj9S31ZUgwiuie81fGFmCJ6ob2/exec";

    let miRestauranteId = localStorage.getItem('AE_REST_ID') || "";
    let pedidos = [];
    let sonidosActivados = false;
    let audioNotif = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
    audioNotif.volume = 0.8;

    function activarSonidoGlobal() {
        if (!sonidosActivados) {
            sonidosActivados = true;
            audioNotif.play().then(() => audioNotif.pause()).catch(e => console.log);
            Swal.fire({ title: '🔊 Sonido activado', icon: 'success', timer: 1500, showConfirmButton: false, background: '#020617', color: 'white' });
        }
    }
    document.getElementById('btnActivarSonido')?.addEventListener('click', activarSonidoGlobal);

    function verificarPIN() {
        let pin = document.getElementById('pinInput').value.trim().toUpperCase();
        if (ACCESS_DB[pin]) {
            miRestauranteId = ACCESS_DB[pin];
            localStorage.setItem('AE_REST_ID', miRestauranteId);
            iniciarApp();
        } else {
            Swal.fire({ title: 'PIN incorrecto', icon: 'error', background: '#020617', color: 'white' });
        }
    }

    async function alternarEstadoTienda(estadoActual) {
        const nuevoEstado = estadoActual === "ABIERTO" ? "CERRADO" : "ABIERTO";
        const textoAlerta = nuevoEstado === "ABIERTO" 
            ? "¿Quieres ABRIR el restaurante al público para recibir pedidos?" 
            : "¿Quieres CERRAR el restaurante? Los clientes verán el local cerrado en la App.";
        
        const confirmar = await Swal.fire({
            title: `${nuevoEstado === "ABIERTO" ? "🟢" : "🔴"} ¿Cambiar estado?`,
            text: textoAlerta,
            showCancelButton: true,
            confirmButtonColor: nuevoEstado === "ABIERTO" ? "#10B981" : "#EF4444",
            cancelButtonColor: "#334155",
            confirmButtonText: nuevoEstado === "ABIERTO" ? "Sí, Abrir" : "Sí, Cerrar",
            cancelButtonText: "Cancelar",
            background: "#1e293b",
            color: "#fff"
        });

        if (!confirmar.isConfirmed) return;

        try {
            Swal.showLoading();
            let res = await fetch(`${scriptURL}?action=cambiarEstadoTienda&idRest=${miRestauranteId}&nuevoEstado=${nuevoEstado}&t=${Date.now()}`);
            let rData = await res.json();
            
            if (rData.status === "OK") {
                Swal.fire({
                    icon: 'success',
                    title: `Tienda configurada como: ${nuevoEstado}`,
                    timer: 1500,
                    showConfirmButton: false,
                    background: "#1e293b",
                    color: "#fff"
                });
                cargarPedidos(); 
            } else {
                throw new Error(rData.error || "Error al actualizar");
            }
        } catch (err) {
            Swal.fire({ icon: 'error', title: 'Error en el servidor', text: err.message, background: "#1e293b", color: "#fff" });
        }
    }

    async function cargarPedidos() {
        try {
            let res = await fetch(`${scriptURL}?action=leerPanelCompleto&idRest=${miRestauranteId}&t=${Date.now()}`);
            let data = await res.json();
            
            // Actualizar nombre y foto del restaurante con brillo
            if (data.tienda) {
                document.getElementById('restauranteNombre').innerText = data.tienda.nombre || "Restaurante";
                const fotoElement = document.getElementById('restauranteFoto');
                // Si hay foto nueva o no se ha cargado antes, la actualizamos
                if (data.tienda.foto && (!fotoElement.src || fotoElement.src !== data.tienda.foto)) {
                    fotoElement.src = data.tienda.foto;
                    // Aseguramos que se vea nítida y brillante añadiendo clase extra
                    fotoElement.classList.add('banner-img');
                } else if (!data.tienda.foto && !fotoElement.src) {
                    // Imagen de respaldo elegante si no hay foto
                    fotoElement.src = 'https://images.pexels.com/photos/260922/pexels-photo-260922.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1';
                }
            }

            let pedidosActivos = data.pedidos || [];
            let pedidosHistorial = data.historial || [];
            let stats = data.stats || {};
            
            if(document.getElementById('statHoy')) document.getElementById('statHoy').innerHTML = (parseFloat(stats.diaria) || 0).toFixed(2);
            if(document.getElementById('statSemana')) document.getElementById('statSemana').innerHTML = (parseFloat(stats.semanal) || 0).toFixed(2);

            let tiendaEst = (data.tienda && data.tienda.estado || "CERRADO").toUpperCase();
            let btnClase = tiendaEst === "ABIERTO" 
                ? "bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-500/40" 
                : "bg-rose-500/20 text-rose-400 border border-rose-500/30 hover:bg-rose-500/40";

            if(document.getElementById('contenedorBotonTienda')) {
                document.getElementById('contenedorBotonTienda').innerHTML = `
                    <button onclick="alternarEstadoTienda('${tiendaEst}')" class="px-4 py-2 rounded-xl font-bold text-xs transition-all duration-200 ${btnClase}">
                        ${tiendaEst === "ABIERTO" ? "🟢 ABIERTO (PULSA PARA CERRAR)" : "🔴 CERRADO (PULSA PARA ABRIR)"}
                    </button>
                `;
            }

            const snapshot = await database.ref('pedidos').once('value');
            const fbData = snapshot.val() || {};

            let listaCombinada = [...pedidosActivos, ...pedidosHistorial];
            
            pedidos = listaCombinada.map(p => {
                if (fbData[p.ID_PEDIDO]) {
                    p.tiempo_seleccionado = fbData[p.ID_PEDIDO].tiempo_seleccionado || 0;
                }
                return p;
            });

            renderizarTodo();

            if (sonidosActivados && pedidos.filter(p => (p.ESTADO || '').toUpperCase() === 'RECIBIDO').length > 0) {
                audioNotif.play().catch(e => console.log);
            }
        } catch (error) {
            console.error("Error cargando pedidos:", error);
        }
    }

    function renderizarTodo() {
        let entrantes = pedidos.filter(p => {
            const est = (p.ESTADO || '').toUpperCase().trim();
            return est === 'RECIBIDO' || est === 'NUEVO' || est === '';
        });

        let cocina = pedidos.filter(p => {
            const est = (p.ESTADO || '').toUpperCase().trim();
            return est === 'EN PROCESO' || est === 'LISTO';
        });

        let historial = pedidos.filter(p => {
            const est = (p.ESTADO || '').toUpperCase().trim();
            return est === 'RECOGIDO' || est === 'EN CAMINO' || est === 'LLEGÓ' || est === 'ENTREGADO' || est === 'FINALIZADO';
        });

        document.getElementById('totalPendientes').innerText = entrantes.length;
        document.getElementById('totalCocina').innerText = cocina.length;
        document.getElementById('totalHistorial').innerText = historial.length;

        document.getElementById('listaEntrantes').innerHTML = entrantes.map(p => renderCardEntrante(p)).join('');
        document.getElementById('listaCocina').innerHTML = cocina.map(p => renderCardCocina(p)).join('');
        document.getElementById('listaHistorial').innerHTML = historial.map(p => renderCardHistorial(p)).join('');
    }

    function renderCardEntrante(p) {
        return `<div class="card-pedido">
            <div class="flex justify-between items-start"><div><span class="text-cyan-400 font-bold text-sm">#${p.ID_PEDIDO}</span><p class="text-white text-sm font-bold mt-1">${p.CLIENTE}</p><p class="text-white/60 text-xs mt-1">${(p.PEDIDO_DETALLE || '').substring(0, 60)}...</p></div><span class="text-white/40 text-xs">${calcularTiempo(p.FECHA)}</span></div>
            <div class="flex gap-2 mt-3"><button onclick="aceptarPedido('${p.ID_PEDIDO}')" class="btn-aceptar bg-cyan-500 text-black font-bold px-4 py-2 rounded-xl text-xs flex-1">✅ ACEPTAR</button><button onclick="rechazarPedido('${p.ID_PEDIDO}')" class="btn-rechazar bg-red-600 text-white font-bold px-4 py-2 rounded-xl text-xs flex-1">❌ RECHAZAR</button></div>
        </div>`;
    }

    function renderCardCocina(p) {
        const est = (p.ESTADO || '').toUpperCase().trim();
        let estaListo = est === 'LISTO';
        let tiempoActivo = p.tiempo_seleccionado || 0; 

        return `<div class="card-pedido ${estaListo ? 'opacity-40 border-dashed border-white/20' : ''}">
            <div class="flex justify-between">
                <span class="text-amber-400 font-bold text-sm">#${p.ID_PEDIDO}</span>
                <span class="text-white/40 text-xs">${estaListo ? '🟢 LISTO - ESPERANDO REPARTIDOR' : '🍳 EN COCINA'}</span>
            </div>
            <p class="text-white text-sm font-bold mt-1">${p.CLIENTE}</p>
            <p class="text-white/60 text-xs">📦 ${(p.PEDIDO_DETALLE || '').substring(0, 50)}...</p>
            <div class="flex justify-between items-center mt-2">
                <span class="text-white font-bold">${parseFloat(p.TOTAL).toFixed(2)}€</span>
            </div>
            <div class="flex gap-2 mt-3">
                <button onclick="verDetallePedido('${p.ID_PEDIDO}')" class="bg-white/10 text-white px-3 py-2 rounded-xl text-xs">📋 DETALLE</button>
                <button onclick="asignarTiempo('${p.ID_PEDIDO}', 15, this)" class="tiempo-btn ${tiempoActivo === 15 ? 'verde' : 'bg-cyan-500/20 text-cyan-400'} px-3 py-2 rounded-xl text-xs" ${estaListo ? 'disabled' : ''}>15'</button>
                <button onclick="asignarTiempo('${p.ID_PEDIDO}', 30, this)" class="tiempo-btn ${tiempoActivo === 30 ? 'verde' : 'bg-cyan-500/20 text-cyan-400'} px-3 py-2 rounded-xl text-xs" ${estaListo ? 'disabled' : ''}>30'</button>
                <button onclick="asignarTiempo('${p.ID_PEDIDO}', 45, this)" class="tiempo-btn ${tiempoActivo === 45 ? 'verde' : 'bg-cyan-500/20 text-cyan-400'} px-3 py-2 rounded-xl text-xs" ${estaListo ? 'disabled' : ''}>45'</button>
                <button onclick="marcarListo('${p.ID_PEDIDO}')" class="bg-emerald-600 text-white px-3 py-2 rounded-xl text-xs" ${estaListo ? 'disabled' : ''}>✅ LISTO</button>
            </div>
        </div>`;
    }

    function renderCardHistorial(p) {
        const est = (p.ESTADO || '').toUpperCase().trim();
        let tagEstado = '🛵 EN REPARTO';
        let colorTag = 'bg-cyan-500/20 text-cyan-400 border border-cyan-500/30';
        
        if (est === 'ENTREGADO' || est === 'FINALIZADO') {
            tagEstado = '🏁 ENTREGADO';
            colorTag = 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
        } else if (est === 'LLEGÓ' || est === 'LLEGÓ CONTROLLER') {
            tagEstado = '📍 EN EL CLIENTE';
            colorTag = 'bg-amber-500/20 text-amber-400 border border-amber-500/30';
        }

        return `<div class="card-pedido historial-item p-3 rounded-xl bg-slate-900/40 border border-white/5 dynamic-card shadow-sm">
            <div class="flex justify-between items-center mb-2">
                <span class="text-emerald-400 font-bold text-sm">#${p.ID_PEDIDO}</span>
                <span class="text-white font-bold text-sm">${parseFloat(p.TOTAL || 0).toFixed(2)}€</span>
            </div>
            <div class="flex justify-between items-start gap-2">
                <p class="text-white/70 text-xs font-medium truncate max-w-[140px]">${p.CLIENTE || 'Cliente'}</p>
                <span class="px-2 py-0.5 rounded-md text-[10px] font-bold tracking-wide uppercase ${colorTag}">
                    ${tagEstado}
                </span>
            </div>
            <p class="text-white/40 text-[11px] mt-1 truncate">🛵 Repartidor: ${p.REPARTIDOR || 'Sin asignar'}</p>
            
            <div class="mt-3 pt-2 border-t border-white/5">
                <button onclick="verDetallePedido('${p.ID_PEDIDO}')" class="w-full bg-white/5 hover:bg-cyan-500/20 text-white hover:text-cyan-400 py-1.5 rounded-lg text-[11px] font-medium tracking-wide transition-all duration-200">
                    📋 VER DETALLE / REPRINTER
                </button>
            </div>
        </div>`;
    }

    function calcularTiempo(fechaStr) {
        if (!fechaStr) return "---";
        let diff = Math.floor((new Date() - new Date(fechaStr)) / 60000);
        if (diff < 1) return "Ahora";
        if (diff < 60) return `Hace ${diff} min`;
        return `Hace ${Math.floor(diff/60)}h`;
    }

    async function aceptarPedido(id) {
        if (window.event && window.event.target) {
            let btn = window.event.target;
            btn.disabled = true;
            btn.style.opacity = '0.5';
        }
        await fetch(`${scriptURL}?action=actualizarEstado&idPedido=${id}&nuevoEstado=EN PROCESO`);
        await cargarPedidos();
    }

    async function rechazarPedido(id) {
        if (window.event && window.event.target) {
            let btn = window.event.target;
            btn.disabled = true;
            btn.style.opacity = '0.5';
        }
        await fetch(`${scriptURL}?action=actualizarEstado&idPedido=${id}&nuevoEstado=CANCELADO_RESTAURANTE`);
        await cargarPedidos();
    }

    async function asignarTiempo(id, minutos, btn) {
        btn.disabled = true;
        btn.classList.remove('bg-cyan-500/20', 'text-cyan-400');
        btn.classList.add('bg-green-600', 'text-white');
        await database.ref('pedidos/'+id).update({ tiempo_seleccionado: minutos });
        await fetch(`${scriptURL}?action=actualizarEstado&idPedido=${id}&nuevoEstado=EN PROCESO&tiempo=${minutos}`);
    }

    async function marcarListo(id) {
        let card = document.querySelector(`.card-pedido:has(button[onclick="marcarListo('${id}')"])`);
        if (card) card.classList.add('opacity-50');
        let botones = card.querySelectorAll('button');
        botones.forEach(btn => btn.disabled = true);
        await database.ref('pedidos/'+id).update({ estado: 'listo', timestamp_listo: Date.now() });
        await fetch(`${scriptURL}?action=actualizarEstado&idPedido=${id}&nuevoEstado=LISTO`);
        await cargarPedidos();
    }

    function imprimirTicket(pedido) {
        const ventana = window.open('', '_blank', 'width=400,height=600');
        ventana.document.write(`
            <html>
            <head>
                <title>Pedido #${pedido.ID_PEDIDO}</title>
                <style>
                    @page { size: 80mm auto; margin: 0; }
                    body { font-family: 'Courier New', Courier, monospace; width: 76mm; margin: 0; padding: 10px; font-size: 14px; color: #000; background: #fff; }
                    .text-center { text-align: center; }
                    .bold { font-weight: bold; }
                    .separator { border-top: 1px dashed #000; margin: 10px 0; }
                    .total { font-size: 18px; font-weight: bold; }
                </style>
            </head>
            <body>
                <div class="text-center">
                    <h3 style="margin: 0; font-size: 18px;">AGUADULCE EXPRESS</h3>
                    <p style="margin: 4px 0; font-size: 11px;">${new Date().toLocaleString()}</p>
                </div>
                <div class="separator"></div>
                <p class="bold">TICKET PEDIDO: #${pedido.ID_PEDIDO}</p>
                <p><span class="bold">Cliente:</span> ${pedido.CLIENTE}</p>
                <p><span class="bold">Entrega:</span> ${pedido.DIRECCION || 'Para Recoger'}</p>
                <p><span class="bold">Pago:</span> ${pedido.PAGO || 'No especificado'}</p>
                <div class="separator"></div>
                <p class="bold">DETALLE DEL PEDIDO:</p>
                <p style="white-space: pre-wrap; margin: 5px 0;">${pedido.PEDIDO_DETALLE || ''}</p>
                <div class="separator"></div>
                <div class="text-center total">TOTAL: ${parseFloat(pedido.TOTAL).toFixed(2)}€</div>
                <div class="separator"></div>
                <p class="text-center" style="font-size: 11px; margin-top: 15px;">¡Buen provecho!</p>
                <script>
                    window.onload = function() { window.print(); setTimeout(() => window.close(), 500); };
                <\/script>
            </body>
            </html>
        `);
        ventana.document.close();
    }

    function verDetallePedido(id) {
        let p = pedidos.find(x => x.ID_PEDIDO == id);
        if (p) {
            Swal.fire({
                title: `Pedido #${p.ID_PEDIDO}`,
                html: `
                    <div class="text-left" style="font-size: 14px; line-height: 1.5;">
                        <p style="margin-bottom: 6px;"><strong>👤 Cliente:</strong> ${p.CLIENTE || 'Sin nombre'}</p>
                        <p style="margin-bottom: 6px;"><strong>📍 Dirección:</strong> ${p.DIRECCION || 'Para Recoger'}</p>
                        <p style="margin-bottom: 6px;"><strong>💳 Pago:</strong> ${p.PAGO || 'No especificado'}</p>
                        <p style="margin-bottom: 6px;"><strong>💰 Total:</strong> <span style="color:#22c55e; font-weight:bold;">${parseFloat(p.TOTAL || 0).toFixed(2)}€</span></p>
                        <div style="border-top: 1px dashed rgba(255,255,255,0.1); margin-top: 10px; padding-top: 10px;">
                            <p><strong>📦 Detalle:</strong></p>
                            <p style="color:#94a3b8; white-space: pre-wrap; font-size: 13px; margin-top: 4px;">${p.PEDIDO_DETALLE || ''}</p>
                        </div>
                    </div>`,
                background: '#020617', 
                color: 'white', 
                confirmButtonColor: '#06b6d4',
                showCancelButton: true, 
                confirmButtonText: '🖨️ Imprimir Recibo', 
                cancelButtonText: 'Cerrar'
            }).then(result => { 
                if (result.isConfirmed) { imprimirTicket(p); }
            });
        }
    }

    // Función de salir corregida (cambia la sesión completamente)
    function preguntarSalir() {
        Swal.fire({
            title: '¿Cerrar sesión?',
            text: 'Volverás a la pantalla de inicio para cambiar de restaurante.',
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonColor: '#3085d6',
            confirmButtonText: 'Sí, salir',
            cancelButtonText: 'Cancelar',
            background: '#1e293b',
            color: 'white'
        }).then((result) => {
            if (result.isConfirmed) {
                localStorage.removeItem('AE_REST_ID');
                miRestauranteId = "";
                document.getElementById('loginScreen').style.display = 'flex';
                document.getElementById('appContent').style.display = 'none';
                document.getElementById('pinInput').value = '';
                Swal.fire({
                    title: 'Sesión cerrada',
                    text: 'Puedes ingresar con otro PIN',
                    icon: 'success',
                    timer: 1500,
                    showConfirmButton: false,
                    background: '#020617',
                    color: 'white'
                });
            }
        });
    }

    async function iniciarApp() {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('appContent').style.display = 'block';
        await cargarPedidos();
        setInterval(cargarPedidos, 8000);
    }

    window.onload = () => { 
        if (miRestauranteId) {
            iniciarApp();
        } else {
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('appContent').style.display = 'none';
        }
    };
</script>
</body>
</html>
