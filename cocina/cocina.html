<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aguadulce Express - Cocina</title>
    
    <!-- PWA manifest específico para cocina -->
    <link rel="manifest" href="/AGUADULCE_EXPRESS_APP/cocina/manifest-cocina.json">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/cCv7qsHf/IMAGEN-PNG-512.jpg">
    <meta name="theme-color" content="#f59e0b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cocina AE">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #020617; font-family: 'Plus Jakarta Sans', sans-serif; }
        .card-pedido { background: #0f172a; border: 1px solid #1e293b; border-radius: 20px; padding: 16px; margin-bottom: 12px; transition: all 0.2s; }
        .card-pedido:hover { transform: translateY(-2px); border-color: #f59e0b40; }
        .badge { background: rgba(6,182,212,0.2); color: #06b6d4; padding: 4px 12px; border-radius: 30px; font-size: 11px; font-weight: bold; display: inline-block; }
        .badge-warning { background: rgba(245,158,11,0.2); color: #f59e0b; }
        .badge-success { background: rgba(34,197,94,0.2); color: #22c55e; }
        .badge-danger { background: rgba(239,68,68,0.2); color: #ef4444; }
        .banner-img { width: 100%; height: 100%; object-fit: cover; object-position: center; }
        .banner-container { position: relative; height: 220px; overflow: hidden; }
        .overlay-gradient { background: linear-gradient(to top, rgba(2,6,23,0.5) 0%, transparent 35%, transparent 100%); }
        @media (min-width: 768px) { .banner-container { height: 260px; } }
        .stats-card { background: linear-gradient(135deg, #0f172a 0%, #0a0f1a 100%); border: 1px solid #1e293b; border-radius: 20px; padding: 12px 16px; }
        .stats-number { font-size: 28px; font-weight: 800; letter-spacing: -1px; }
        .tiempo-btn { transition: all 0.1s; cursor: pointer; }
        .tiempo-btn:active { transform: scale(0.95); }
        .tiempo-btn.verde { background-color: #22c55e !important; color: white !important; }
        .opacity-50 { opacity: 0.5; }
        .historial-item { cursor: pointer; transition: all 0.2s; }
        .historial-item:hover { background: #1e293b; transform: scale(0.98); }
        /* Animación para nuevo pedido */
        @keyframes pulse-red {
            0%, 100% { background-color: rgba(239,68,68,0.1); border-left-color: rgba(239,68,68,0.3); }
            50% { background-color: rgba(239,68,68,0.3); border-left-color: #ef4444; }
        }
        .nuevo-pedido-anim {
            animation: pulse-red 1s ease-in-out 3;
            border-left: 3px solid #ef4444;
        }
        /* Mejora de velocidad */
        .pedido-card {
            will-change: transform;
        }
    </style>
</head>
<body>

<div id="loginScreen" class="min-h-screen flex flex-col items-center justify-center p-5">
    <h1 class="text-4xl font-black italic uppercase text-cyan-400 mb-8 text-center">Aguadulce</h1>
    <p class="text-white/50 text-xs mb-4 text-center">🔐 PIN DEL RESTAURANTE</p>
    <input type="password" id="pinInput" maxlength="10" class="w-full max-w-[250px] p-4 rounded-2xl bg-white/5 border border-white/10 text-center text-2xl tracking-widest text-white">
    <button onclick="verificarPIN()" class="mt-6 bg-cyan-400 text-black px-8 py-3 rounded-2xl font-black uppercase block mx-auto">Ingresar</button>
</div>

<div id="appContent" class="hidden min-h-screen">
    <div class="banner-container">
        <img id="restauranteFoto" class="banner-img" src="">
        <div class="absolute inset-0 overlay-gradient"></div>
        <div class="absolute bottom-0 left-0 right-0 p-5 flex justify-between items-end">
            <div>
                <span class="text-cyan-400 text-xs font-bold uppercase tracking-wider backdrop-blur-sm bg-black/30 px-2 py-1 rounded-lg">📍 COCINA</span>
                <h1 id="restauranteNombre" class="text-2xl font-black text-white drop-shadow-lg mt-1">CARGANDO...</h1>
            </div>
            <div class="flex items-center gap-3">
                <div id="contenedorBotonTienda"></div>
                <button onclick="preguntarSalir()" class="bg-white/10 backdrop-blur-sm p-2 rounded-xl hover:bg-white/20 transition-all">🚪 SALIR</button>
            </div>
        </div>
    </div>

    <div class="p-4 flex flex-wrap justify-between items-center gap-3 border-b border-white/10">
        <div class="flex gap-3 flex-wrap">
            <div class="badge">📥 PENDIENTES: <span id="totalPendientes">0</span></div>
            <div class="badge badge-warning">🍳 EN COCINA: <span id="totalCocina">0</span></div>
            <div class="badge badge-success">✅ HISTORIAL: <span id="totalHistorial">0</span></div>
        </div>
        <div class="flex gap-4 items-center">
            <div class="text-right stats-card">
                <div class="text-[9px] text-white/40 uppercase tracking-wider">📊 RESUMEN DE HOY</div>
                <div class="stats-number text-white"><span id="statHoy">0.00</span>€</div>
                <div class="text-[10px] text-white/40 mt-1">💰 Total productos</div>
            </div>
            <div class="text-right stats-card">
                <div class="text-[9px] text-white/40 uppercase tracking-wider">📅 TOTAL ACUMULADO</div>
                <div class="stats-number text-white"><span id="statSemana">0.00</span>€</div>
                <div class="text-[10px] text-white/40 mt-1">💰 Total productos</div>
            </div>
            <button id="btnActivarSonido" class="bg-yellow-500/20 text-yellow-400 text-xs px-3 py-1 rounded-full hover:bg-yellow-500/30 transition-all">🔊 ACTIVAR SONIDO</button>
        </div>
    </div>

    <div class="p-4 grid grid-cols-1 md:grid-cols-3 gap-5">
        <div class="bg-black/30 rounded-2xl p-4 border border-white/5 min-h-[500px]">
            <h3 class="text-cyan-400 font-bold text-sm uppercase mb-3">📥 PEDIDOS ENTRANTES</h3>
            <div id="listaEntrantes" class="space-y-3 max-h-[65vh] overflow-y-auto"></div>
        </div>
        <div class="bg-black/30 rounded-2xl p-4 border border-white/5 min-h-[500px]">
            <h3 class="text-amber-400 font-bold text-sm uppercase mb-3">🍳 EN COCINA</h3>
            <div id="listaCocina" class="space-y-3 max-h-[65vh] overflow-y-auto"></div>
        </div>
        <div class="bg-black/30 rounded-2xl p-4 border border-white/5 min-h-[500px]">
            <h3 class="text-emerald-400 font-bold text-sm uppercase mb-3">✅ HISTORIAL</h3>
            <div id="listaHistorial" class="space-y-3 max-h-[65vh] overflow-y-auto"></div>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // CONFIGURACIÓN FIREBASE
    // ==========================================
    const firebaseConfig = {
        apiKey: "AIzaSyCJcLQ0ikUwZSV7L_8mLLax8B5qnhP0Roc",
        authDomain: "aguadulce-notificaciones.firebaseapp.com",
        databaseURL: "https://aguadulce-notificaciones-default-rtdb.firebaseio.com",
        projectId: "aguadulce-notificaciones",
        storageBucket: "aguadulce-notificaciones.firebasestorage.app",
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const scriptURL = "https://script.google.com/macros/s/AKfycbzYFDShcrP7I4FKhiH3q5UcEInpSKJstrumJ9ddI4Tj9S31ZUgwiuie81fGFmCJ6ob2/exec";

    // ==========================================
    // VARIABLES GLOBALES
    // ==========================================
    let miRestauranteId = localStorage.getItem('AE_REST_ID') || "";
    let pedidos = [];
    let sonidosActivados = false;
    let audioNotif = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
    audioNotif.volume = 0.8;
    
    // Variables para notificaciones visuales (tipo WhatsApp)
    let pendingBadgeCount = 0;
    let originalTitle = document.title;
    let ultimosIdsNotificados = new Set();
    let ultimaCantidadPendientes = 0;
    
    // Cache de restaurante para evitar múltiples fetch
    let miRestauranteData = null;

    // ==========================================
    // NOTIFICACIONES VISUALES (TIPO WHATSAPP)
    // ==========================================
    
    async function solicitarPermisoNotificaciones() {
        if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
            const permiso = await Notification.requestPermission();
            if (permiso === "granted") {
                console.log("✅ Notificaciones permitidas");
                return true;
            }
        }
        return Notification.permission === "granted";
    }

    function actualizarBadgeContador(cantidad) {
        pendingBadgeCount = cantidad;
        
        // Cambiar título de la ventana (visible en barra de tareas de Windows)
        if (cantidad > 0) {
            document.title = `🔴 (${cantidad}) AGUADULCE - Cocina`;
        } else {
            document.title = originalTitle;
        }
        
        // Badge nativo (si el navegador lo soporta)
        if (navigator.setAppBadge) {
            if (cantidad > 0) {
                navigator.setAppBadge(cantidad);
            } else {
                navigator.clearAppBadge();
            }
        }
    }

    function notificarNuevoPedidoVisual(pedido, cantidadPendientes) {
        // 1. Actualizar badge en título
        actualizarBadgeContador(cantidadPendientes);
        
        // 2. Notificación nativa de Windows (estilo WhatsApp)
        if (Notification.permission === "granted") {
            const total = parseFloat(pedido.TOTAL) || 0;
            new Notification("🍽️ NUEVO PEDIDO EN COCINA", {
                body: `Pedido #${pedido.ID_PEDIDO}\nCliente: ${pedido.CLIENTE || 'Cliente'}\nTotal: ${total.toFixed(2)}€\nPendientes: ${cantidadPendientes}`,
                icon: "https://i.postimg.cc/cCv7qsHf/IMAGEN-PNG-512.jpg",
                tag: `pedido-${pedido.ID_PEDIDO}`,
                renotify: true,
                requireInteraction: true,
                silent: false,
                vibrate: [200, 100, 200]
            });
        }
        
        // 3. Animación visual en la ventana (parpadeo)
        if (document.hidden) {
            let parpadeando = false;
            let contador = 0;
            const interval = setInterval(() => {
                if (contador >= 6 || !document.hidden || cantidadPendientes === 0) {
                    document.title = cantidadPendientes > 0 ? `🔴 (${cantidadPendientes}) AGUADULCE - Cocina` : originalTitle;
                    clearInterval(interval);
                    return;
                }
                document.title = contador % 2 === 0 ? "🔴🔴🔴 NUEVO PEDIDO 🔴🔴🔴" : `🔴 (${cantidadPendientes}) AGUADULCE - Cocina`;
                contador++;
            }, 500);
        }
    }

    // ==========================================
    // AUTENTICACIÓN DINÁMICA DESDE USUARIOS
    // ==========================================
    
    async function cargarPinesDesdeServidor() {
        try {
            const response = await fetch(scriptURL + '?action=obtenerRestaurantesConPIN&t=' + Date.now());
            const data = await response.json();
            return data.restaurantes || [];
        } catch(e) {
            console.error("Error cargando pines:", e);
            return [];
        }
    }
    
    async function validarPINConServidor(pin) {
        try {
            const response = await fetch(scriptURL + '?action=validarPIN&pin=' + encodeURIComponent(pin) + '&t=' + Date.now());
            const data = await response.json();
            return data;
        } catch(e) {
            console.error("Error validando PIN:", e);
            return { valido: false, error: e.message };
        }
    }

    async function verificarPIN() {
        let pin = document.getElementById('pinInput').value.trim().toUpperCase();
        
        if (!pin) {
            Swal.fire({ title: 'ERROR', text: 'Ingresa el PIN del restaurante', icon: 'error', background: '#020617', color: 'white' });
            return;
        }
        
        Swal.fire({ title: 'Verificando...', text: 'Por favor espera', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
        
        const resultado = await validarPINConServidor(pin);
        Swal.close();
        
        if (resultado.valido) {
            miRestauranteId = resultado.idRestaurante;
            miRestauranteData = resultado;
            localStorage.setItem('AE_REST_ID', miRestauranteId);
            localStorage.setItem('AE_REST_NOMBRE', resultado.nombre);
            iniciarApp();
        } else {
            Swal.fire({ 
                title: 'CLAVE INCORRECTA', 
                text: 'La clave ingresada no es válida', 
                icon: 'error', 
                background: '#020617', 
                color: 'white' 
            });
        }
    }

    // ==========================================
    // TICKET PROFESIONAL FORMATEADO
    // ==========================================
    
    function formatearDetalleProductos(detalleTexto) {
        if (!detalleTexto) return '<div>No se pudo cargar el detalle</div>';
        
        const lineas = detalleTexto.split('\n');
        let html = '';
        
        for (let linea of lineas) {
            linea = linea.trim();
            if (linea === '') continue;
            
            if (linea.match(/^\d+x\s/i)) {
                html += `<div style="margin: 5px 0 2px 0; font-weight: bold; font-size: 11px;">${escapeHTML(linea)}</div>`;
            } 
            else if (linea.startsWith('+') || linea.startsWith('-') || linea.startsWith('  +')) {
                html += `<div style="margin: 2px 0 2px 15px; font-size: 9px; color: #555;">📌 ${escapeHTML(linea.replace(/^[\+\-\s]+/, ''))}</div>`;
            }
            else if (linea.toLowerCase().includes('nota') || linea.toLowerCase().includes('sin ') || linea.toLowerCase().includes('con ')) {
                html += `<div style="margin: 2px 0 2px 10px; font-size: 9px; color: #888;">📝 ${escapeHTML(linea)}</div>`;
            }
            else {
                html += `<div style="margin: 3px 0; font-size: 10px;">${escapeHTML(linea)}</div>`;
            }
        }
        
        return html;
    }

    function generarTicketProfesional(pedido) {
        const total = parseFloat(pedido.TOTAL) || 0;
        const subtotal = parseFloat(pedido.SUBTOTAL) || (total * 0.9);
        const envio = parseFloat(pedido.ENVIO) || 2.50;
        const usoApp = parseFloat(pedido.USO_APP) || 0.99;
        const metodoPago = pedido.PAGO || 'Efectivo';
        const fechaPedido = pedido.FECHA ? new Date(pedido.FECHA) : new Date();
        const nombreRestaurante = pedido.restaurante_nombre || '';
        
        const pagaCon = parseFloat(pedido.PAGA_CON) || 0;
        let cambioHtml = '';
        if (metodoPago.toUpperCase().includes('EFECTIVO') && pagaCon > total) {
            const cambio = pagaCon - total;
            cambioHtml = `
                <div style="margin: 10px 0; padding: 8px; background: #f5f5f5; text-align: center; border-radius: 4px;">
                    <div style="font-size: 10px;">💵 Paga con: ${pagaCon.toFixed(2)}€</div>
                    <div style="font-size: 10px; font-weight: bold;">💰 Cambio: ${cambio.toFixed(2)}€</div>
                </div>
            `;
        }
        
        const detalleFormateado = formatearDetalleProductos(pedido.PEDIDO_DETALLE);
        
        return `
            <!DOCTYPE html>
            <html>
            <head>
                <meta charset="UTF-8">
                <title>Ticket #${pedido.ID_PEDIDO}</title>
                <style>
                    * { margin: 0; padding: 0; box-sizing: border-box; }
                    body { 
                        font-family: 'Courier New', Courier, monospace;
                        width: 100%;
                        max-width: 80mm;
                        margin: 0 auto;
                        background: white;
                        color: #000;
                        padding: 8mm 3mm 6mm 3mm;
                        font-size: 10px;
                        line-height: 1.4;
                    }
                    .text-center { text-align: center; }
                    .separator-dashed { border-top: 1px dashed #aaa; margin: 8px 0; }
                    .separator-dotted { border-top: 1px dotted #ccc; margin: 6px 0; }
                    .separator-double { border-top: 2px solid #000; margin: 8px 0; }
                    .logo { font-size: 16px; font-weight: bold; text-align: center; letter-spacing: 3px; }
                    .slogan { font-size: 8px; color: #666; text-align: center; margin-top: 3px; }
                    .restaurante { font-size: 10px; font-weight: bold; text-align: center; margin-top: 5px; }
                    .fecha { font-size: 8px; color: #888; text-align: center; margin-top: 5px; }
                    .info-line { display: flex; justify-content: space-between; margin: 4px 0; font-size: 9px; }
                    .label { font-weight: bold; }
                    .section-title { font-weight: bold; margin: 8px 0 5px 0; font-size: 10px; }
                    .total-box { text-align: center; margin: 10px 0; padding: 8px; background: #f9f9f9; }
                    .total-number { font-size: 18px; font-weight: bold; margin-top: 3px; }
                    .footer { text-align: center; margin-top: 10px; padding-top: 8px; border-top: 1px solid #ddd; font-size: 7px; color: #888; }
                    .thanks { font-weight: bold; margin-bottom: 5px; font-size: 10px; color: #000; }
                    .space-for-staple { margin-top: 15px; padding-top: 10px; text-align: center; font-size: 7px; color: #ccc; border-top: 1px dotted #ccc; }
                    .desglose-line { display: flex; justify-content: space-between; margin: 3px 0; font-size: 9px; }
                </style>
            </head>
            <body>
                <div class="logo">AGUADULCE EXPRESS</div>
                <div class="slogan">Pedidos a domicilio</div>
                <div class="separator-dashed"></div>
                
                <div class="fecha">${fechaPedido.toLocaleString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })}</div>
                ${nombreRestaurante ? `<div class="restaurante">${escapeHTML(nombreRestaurante)}</div>` : ''}
                
                <div class="separator-dashed"></div>
                
                <div class="info-line">
                    <span class="label">PEDIDO:</span>
                    <span>#${pedido.ID_PEDIDO}</span>
                </div>
                <div class="info-line">
                    <span class="label">CLIENTE:</span>
                    <span>${escapeHTML((pedido.CLIENTE || 'Cliente').substring(0, 35))}</span>
                </div>
                <div class="info-line">
                    <span class="label">DIRECCIÓN:</span>
                    <span>${escapeHTML((pedido.DIRECCION || 'Para Recoger').substring(0, 35))}</span>
                </div>
                <div class="info-line">
                    <span class="label">TELÉFONO:</span>
                    <span>${escapeHTML(pedido.TELEFONO || '---')}</span>
                </div>
                <div class="info-line">
                    <span class="label">PAGO:</span>
                    <span>${escapeHTML(metodoPago)}</span>
                </div>
                
                <div class="separator-dashed"></div>
                
                <div class="section-title">📦 PRODUCTOS</div>
                ${detalleFormateado}
                
                <div class="separator-dotted"></div>
                
                <div class="section-title">💰 DESGLOSE</div>
                <div class="desglose-line">
                    <span>SUBTOTAL</span>
                    <span>${subtotal.toFixed(2)}€</span>
                </div>
                <div class="desglose-line">
                    <span>ENVÍO</span>
                    <span>${envio.toFixed(2)}€</span>
                </div>
                ${usoApp > 0 ? `<div class="desglose-line">
                    <span>USO DE APP</span>
                    <span>${usoApp.toFixed(2)}€</span>
                </div>` : ''}
                
                <div class="separator-double"></div>
                
                <div class="total-box">
                    <div style="font-size: 10px;">TOTAL</div>
                    <div class="total-number">${total.toFixed(2)}€</div>
                </div>
                
                ${cambioHtml}
                
                <div class="separator-dashed"></div>
                
                <div class="footer">
                    <div class="thanks">🎉 ¡GRACIAS POR SU PEDIDO! 🎉</div>
                    <div>Comprobante generado por Aguadulce Express</div>
                    <div>${new Date().toLocaleDateString()}</div>
                </div>
                
                <div class="space-for-staple">
                    ────────────────────────────────
                    (Espacio para grapar al pedido)
                    ────────────────────────────────
                </div>
                
                <script>
                    window.onload = function() {
                        setTimeout(function() {
                            window.print();
                            setTimeout(function() { window.close(); }, 1000);
                        }, 200);
                    };
                <\/script>
            </body>
            </html>
        `;
    }

    function imprimirTicketProfesional(pedido) {
        const contenidoTicket = generarTicketProfesional(pedido);
        const ventana = window.open('', '_blank', 'width=450,height=700');
        ventana.document.write(contenidoTicket);
        ventana.document.close();
    }

    // ==========================================
    // FUNCIONES DE ESCAPE
    // ==========================================
    function escapeHTML(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function euros(n) { return parseFloat(n || 0).toFixed(2) + "€"; }

    // ==========================================
    // FUNCIONES EXISTENTES (MANTENIDAS)
    // ==========================================
    
    function activarSonidoGlobal() {
        if (!sonidosActivados) {
            sonidosActivados = true;
            audioNotif.play().then(() => audioNotif.pause()).catch(e => console.log);
            Swal.fire({ title: '🔊 Sonido activado', icon: 'success', timer: 1500, showConfirmButton: false, background: '#020617', color: 'white' });
        }
    }

    async function alternarEstadoTienda(estadoActual) {
        const nuevoEstado = estadoActual === "ABIERTO" ? "CERRADO" : "ABIERTO";
        const confirmar = await Swal.fire({
            title: `${nuevoEstado === "ABIERTO" ? "🟢" : "🔴"} ¿Cambiar estado?`,
            text: nuevoEstado === "ABIERTO" ? "¿Quieres ABRIR el restaurante?" : "¿Quieres CERRAR el restaurante?",
            showCancelButton: true,
            confirmButtonColor: nuevoEstado === "ABIERTO" ? "#10B981" : "#EF4444",
            confirmButtonText: nuevoEstado === "ABIERTO" ? "Sí, Abrir" : "Sí, Cerrar",
            background: "#1e293b", color: "#fff"
        });
        if (!confirmar.isConfirmed) return;
        try {
            await fetch(`${scriptURL}?action=cambiarEstadoTienda&idRest=${miRestauranteId}&nuevoEstado=${nuevoEstado}&t=${Date.now()}`);
            cargarPedidos();
        } catch (err) {
            Swal.fire({ icon: 'error', title: 'Error', text: err.message, background: "#1e293b", color: "#fff" });
        }
    }

    async function cargarPedidos() {
        if (!miRestauranteId) return;
        try {
            let res = await fetch(`${scriptURL}?action=leerPanelCompleto&idRest=${miRestauranteId}&t=${Date.now()}`);
            let data = await res.json();
            
            if (data.tienda) {
                document.getElementById('restauranteNombre').innerText = data.tienda.nombre || "Restaurante";
                const fotoElement = document.getElementById('restauranteFoto');
                if (data.tienda.foto && fotoElement.src !== data.tienda.foto) {
                    fotoElement.src = data.tienda.foto;
                } else if (!data.tienda.foto && !fotoElement.src) {
                    fotoElement.src = 'https://images.pexels.com/photos/260922/pexels-photo-260922.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1';
                }
            }

            let pedidosActivos = data.pedidos || [];
            let pedidosHistorial = data.historial || [];
            let stats = data.stats || {};
            
            document.getElementById('statHoy').innerHTML = (parseFloat(stats.diaria) || 0).toFixed(2);
            document.getElementById('statSemana').innerHTML = (parseFloat(stats.semanal) || 0).toFixed(2);

            let tiendaEst = (data.tienda && data.tienda.estado || "CERRADO").toUpperCase();
            let btnClase = tiendaEst === "ABIERTO" ? "bg-emerald-500/20 text-emerald-400" : "bg-rose-500/20 text-rose-400";
            document.getElementById('contenedorBotonTienda').innerHTML = `
                <button onclick="alternarEstadoTienda('${tiendaEst}')" class="px-4 py-2 rounded-xl font-bold text-xs transition-all duration-200 ${btnClase}">
                    ${tiendaEst === "ABIERTO" ? "🟢 ABIERTO" : "🔴 CERRADO"}
                </button>
            `;

            // Detectar nuevos pedidos para notificaciones
            const nuevosIds = new Set(pedidosActivos.filter(p => (p.ESTADO || '').toUpperCase() === 'RECIBIDO').map(p => p.ID_PEDIDO));
            const cantidadPendientes = nuevosIds.size;
            
            // Verificar si hay nuevos pedidos que no estaban antes
            for (let id of nuevosIds) {
                if (!ultimosIdsNotificados.has(id)) {
                    const pedidoNuevo = pedidosActivos.find(p => p.ID_PEDIDO === id);
                    if (pedidoNuevo) {
                        notificarNuevoPedidoVisual(pedidoNuevo, cantidadPendientes);
                        // Sonido también
                        if (sonidosActivados) {
                            audioNotif.play().catch(e => console.log);
                        }
                    }
                }
            }
            
            ultimosIdsNotificados = nuevosIds;
            
            // Actualizar badge si cambió la cantidad
            if (ultimaCantidadPendientes !== cantidadPendientes) {
                actualizarBadgeContador(cantidadPendientes);
                ultimaCantidadPendientes = cantidadPendientes;
            }

            pedidos = [...pedidosActivos, ...pedidosHistorial];
            renderizarTodo();

        } catch (error) {
            console.error("Error cargando pedidos:", error);
        }
    }

    function renderizarTodo() {
        let entrantes = pedidos.filter(p => {
            const est = (p.ESTADO || '').toUpperCase().trim();
            return est === 'RECIBIDO' || est === 'NUEVO' || est === '';
        });

        let cocina = pedidos.filter(p => {
            const est = (p.ESTADO || '').toUpperCase().trim();
            return est === 'EN PROCESO' || est === 'LISTO';
        });

        let historial = pedidos.filter(p => {
            const est = (p.ESTADO || '').toUpperCase().trim();
            return est === 'RECOGIDO' || est === 'EN CAMINO' || est === 'LLEGÓ' || est === 'ENTREGADO' || est === 'FINALIZADO' || est === 'CANCELADO' || est === 'RECHAZADO';
        });

        document.getElementById('totalPendientes').innerText = entrantes.length;
        document.getElementById('totalCocina').innerText = cocina.length;
        document.getElementById('totalHistorial').innerText = historial.length;

        document.getElementById('listaEntrantes').innerHTML = entrantes.map(p => renderCardEntrante(p)).join('');
        document.getElementById('listaCocina').innerHTML = cocina.map(p => renderCardCocina(p)).join('');
        document.getElementById('listaHistorial').innerHTML = historial.map(p => renderCardHistorial(p)).join('');
    }

    function calcularTiempo(fechaStr) {
        if (!fechaStr) return "---";
        let diff = Math.floor((new Date() - new Date(fechaStr)) / 60000);
        if (diff < 1) return "Ahora";
        if (diff < 60) return `Hace ${diff} min`;
        return `Hace ${Math.floor(diff/60)}h`;
    }

    function renderCardEntrante(p) {
        return `<div class="card-pedido" data-id="${p.ID_PEDIDO}">
            <div class="flex justify-between items-start">
                <div>
                    <span class="text-cyan-400 font-bold text-sm">#${p.ID_PEDIDO}</span>
                    <p class="text-white text-sm font-bold mt-1">${escapeHTML(p.CLIENTE || 'Cliente')}</p>
                    <p class="text-white/60 text-xs mt-1">${escapeHTML((p.PEDIDO_DETALLE || '').substring(0, 60))}...</p>
                </div>
                <div class="text-right">
                    <span class="text-white/40 text-xs">${calcularTiempo(p.FECHA)}</span>
                    <p class="text-emerald-400 font-bold text-sm mt-1">${(parseFloat(p.TOTAL) || 0).toFixed(2)}€</p>
                </div>
            </div>
            <div class="flex gap-2 mt-3">
                <button onclick="aceptarPedido('${p.ID_PEDIDO}')" class="bg-cyan-500 text-black font-bold px-4 py-2 rounded-xl text-xs flex-1">✅ ACEPTAR</button>
                <button onclick="rechazarPedido('${p.ID_PEDIDO}')" class="bg-red-600 text-white font-bold px-4 py-2 rounded-xl text-xs flex-1">❌ RECHAZAR</button>
            </div>
        </div>`;
    }

    function renderCardCocina(p) {
        const estaListo = (p.ESTADO || '').toUpperCase() === 'LISTO';
        return `<div class="card-pedido ${estaListo ? 'opacity-50' : ''}">
            <div class="flex justify-between">
                <span class="text-amber-400 font-bold text-sm">#${p.ID_PEDIDO}</span>
                <span class="text-white/40 text-xs">${estaListo ? '🟢 LISTO' : '🍳 EN COCINA'}</span>
            </div>
            <p class="text-white text-sm font-bold mt-1">${escapeHTML(p.CLIENTE || 'Cliente')}</p>
            <p class="text-white/60 text-xs">📦 ${escapeHTML((p.PEDIDO_DETALLE || '').substring(0, 50))}...</p>
            <div class="flex gap-2 mt-3 flex-wrap">
                <button onclick="verDetallePedido('${p.ID_PEDIDO}')" class="bg-white/10 text-white px-3 py-2 rounded-xl text-xs">📋 DETALLE</button>
                <button onclick="asignarTiempo('${p.ID_PEDIDO}', 15, this)" class="tiempo-btn bg-cyan-500/20 text-cyan-400 px-3 py-2 rounded-xl text-xs">15'</button>
                <button onclick="asignarTiempo('${p.ID_PEDIDO}', 30, this)" class="tiempo-btn bg-cyan-500/20 text-cyan-400 px-3 py-2 rounded-xl text-xs">30'</button>
                <button onclick="asignarTiempo('${p.ID_PEDIDO}', 45, this)" class="tiempo-btn bg-cyan-500/20 text-cyan-400 px-3 py-2 rounded-xl text-xs">45'</button>
                <button onclick="marcarListo('${p.ID_PEDIDO}')" class="bg-emerald-600 text-white px-3 py-2 rounded-xl text-xs" ${estaListo ? 'disabled' : ''}>✅ LISTO</button>
            </div>
        </div>`;
    }

    function renderCardHistorial(p) {
        const total = parseFloat(p.TOTAL) || 0;
        const estado = (p.ESTADO || '').toUpperCase();
        let estadoTexto = '';
        let colorClass = '';
        
        if (estado === 'ENTREGADO' || estado === 'FINALIZADO') {
            estadoTexto = '🏁 ENTREGADO';
            colorClass = 'badge-success';
        } else if (estado === 'EN CAMINO') {
            estadoTexto = '🛵 EN REPARTO';
            colorClass = 'badge';
        } else if (estado === 'LLEGÓ') {
            estadoTexto = '📍 EN EL CLIENTE';
            colorClass = 'badge-warning';
        } else if (estado === 'RECHAZADO') {
            estadoTexto = '❌ RECHAZADO';
            colorClass = 'badge-danger';
        } else if (estado === 'CANCELADO') {
            estadoTexto = '⚠️ CANCELADO';
            colorClass = 'badge-danger';
        } else {
            estadoTexto = estado;
            colorClass = 'badge';
        }
        
        return `<div class="card-pedido historial-item">
            <div class="flex justify-between items-center mb-2">
                <span class="text-emerald-400 font-bold text-sm">#${p.ID_PEDIDO}</span>
                <span class="text-white font-bold text-sm">${total.toFixed(2)}€</span>
            </div>
            <div class="flex justify-between items-start gap-2">
                <p class="text-white/70 text-xs">${escapeHTML(p.CLIENTE || 'Cliente')}</p>
                <span class="px-2 py-0.5 rounded-md text-[10px] font-bold ${colorClass}">${estadoTexto}</span>
            </div>
            <p class="text-white/40 text-[11px] mt-1">🛵 ${escapeHTML(p.REPARTIDOR || 'Sin repartidor')}</p>
            <div class="mt-3 pt-2 border-t border-white/5">
                <button onclick="verDetallePedido('${p.ID_PEDIDO}')" class="w-full bg-white/5 hover:bg-cyan-500/20 text-white py-1.5 rounded-lg text-[11px]">📋 VER DETALLE</button>
            </div>
        </div>`;
    }

    function verDetallePedido(id) {
        let p = pedidos.find(x => x.ID_PEDIDO == id);
        if (p) {
            Swal.fire({
                title: `Pedido #${p.ID_PEDIDO}`,
                html: `<div class="text-left">
                    <p><strong>👤 Cliente:</strong> ${escapeHTML(p.CLIENTE || 'Sin nombre')}</p>
                    <p><strong>📍 Dirección:</strong> ${escapeHTML(p.DIRECCION || 'No especificada')}</p>
                    <p><strong>📞 Teléfono:</strong> ${escapeHTML(p.TELEFONO || 'No especificado')}</p>
                    <p><strong>💳 Pago:</strong> ${escapeHTML(p.PAGO || 'No especificado')}</p>
                    <p><strong>💰 Total:</strong> ${(parseFloat(p.TOTAL) || 0).toFixed(2)}€</p>
                    <hr class="my-2 border-white/10">
                    <p><strong>📦 Detalle:</strong></p>
                    <p style="white-space: pre-wrap; font-size: 12px;">${escapeHTML(p.PEDIDO_DETALLE || '')}</p>
                </div>`,
                background: '#020617', color: 'white', confirmButtonColor: '#f59e0b',
                showCancelButton: true, confirmButtonText: '🖨️ Imprimir Ticket', cancelButtonText: 'Cerrar'
            }).then(result => { 
                if (result.isConfirmed) imprimirTicketProfesional(p); 
            });
        }
    }

    async function aceptarPedido(id) {
        await fetch(`${scriptURL}?action=actualizarEstado&idPedido=${id}&nuevoEstado=EN PROCESO`);
        await cargarPedidos();
    }

    async function rechazarPedido(id) {
        const confirmar = await Swal.fire({
            title: '¿Rechazar pedido?',
            text: 'El cliente NO pagará por este pedido.',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#ef4444',
            confirmButtonText: 'Sí, rechazar',
            background: '#1e293b',
            color: 'white'
        });
        if (!confirmar.isConfirmed) return;
        await fetch(`${scriptURL}?action=actualizarEstado&idPedido=${id}&nuevoEstado=RECHAZADO&tiempo=Rechazado por el restaurante`);
        await cargarPedidos();
    }

    async function asignarTiempo(id, minutos, btn) {
        btn.disabled = true;
        btn.classList.add('bg-green-600', 'text-white');
        await database.ref('pedidos/'+id).update({ tiempo_seleccionado: minutos });
        await fetch(`${scriptURL}?action=actualizarEstado&idPedido=${id}&nuevoEstado=EN PROCESO&tiempo=${minutos}`);
        await cargarPedidos();
    }

    async function marcarListo(id) {
        await database.ref('pedidos/'+id).update({ estado: 'listo', timestamp_listo: Date.now() });
        await fetch(`${scriptURL}?action=actualizarEstado&idPedido=${id}&nuevoEstado=LISTO`);
        await cargarPedidos();
    }

    function preguntarSalir() {
        Swal.fire({
            title: '¿Cerrar sesión?',
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            confirmButtonText: 'Sí, salir',
            background: '#1e293b',
            color: 'white'
        }).then(result => {
            if (result.isConfirmed) {
                localStorage.removeItem('AE_REST_ID');
                localStorage.removeItem('AE_REST_NOMBRE');
                location.reload();
            }
        });
    }

    // ==========================================
    // INICIALIZACIÓN (OPTIMIZADA PARA VELOCIDAD)
    // ==========================================
    
    async function iniciarApp() {
        originalTitle = document.title;
        
        // Solicitar permiso de notificaciones al inicio
        await solicitarPermisoNotificaciones();
        
        // Mostrar interfaz
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('appContent').classList.remove('hidden');
        
        // Cargar pedidos inmediatamente
        await cargarPedidos();
        
        // Intervalo más rápido para mejor respuesta (4 segundos)
        setInterval(cargarPedidos, 4000);
    }

    // Verificar si ya hay sesión guardada
    (async function() {
        const nombreGuardado = localStorage.getItem('AE_REST_NOMBRE');
        if (miRestauranteId && nombreGuardado) {
            miRestauranteData = { idRestaurante: miRestauranteId, nombre: nombreGuardado };
            iniciarApp();
        } else {
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('appContent').classList.add('hidden');
        }
    })();

    // Event listeners
    document.getElementById('btnActivarSonido')?.addEventListener('click', activarSonidoGlobal);
    
    // Service Worker
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/AGUADULCE_EXPRESS_APP/cocina/sw-cocina.js')
            .then(reg => console.log('✅ Service Worker Cocina registrado', reg))
            .catch(err => console.error('❌ Error al registrar SW Cocina:', err));
    }
</script>
