<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cocina - Aguadulce Express</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/cCv7qsHf/IMAGEN-PNG-512.jpg">
    <meta name="theme-color" content="#06b6d4">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <style>
        /* Estilos base */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #020617; color: white; min-height: 100vh; }
        
        /* Header y Menú Desplegable */
        .header-bar { background: #0f172a; border-bottom: 1px solid #1e293b; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; }
        
        .dropdown-menu { position: relative; display: inline-block; }
        .dropdown-content { display: none; position: absolute; right: 0; top: 50px; background: #1e293b; min-width: 180px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); border: 1px solid #334155; overflow: hidden; z-index: 100; }
        .dropdown-content.show { display: block; }
        .dropdown-content button { display: block; width: 100%; text-align: left; padding: 14px 20px; background: transparent; border: none; color: #e2e8f0; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .dropdown-content button:hover { background: #334155; color: #06b6d4; }
        .dropdown-content hr { border: 0; border-top: 1px solid #334155; margin: 4px 0; }

        /* Cajones de pedidos */
        .pedido-card { background: #1e293b; border-radius: 16px; padding: 16px; margin-bottom: 12px; border-left: 4px solid #334155; }
        .pedido-card.pendiente { border-left-color: #f59e0b; }
        .pedido-card.coccion { border-left-color: #06b6d4; }
        .pedido-card.listo { border-left-color: #10b981; }
        
        .estado-badge { display: inline-block; padding: 2px 12px; border-radius: 999px; font-size: 11px; font-weight: 800; }
        
        /* Scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>

<!-- HEADER CON MENÚ DESPLEGABLE -->
<header class="header-bar">
    <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-cyan-400 flex items-center justify-center text-black font-black text-xl">🍔</div>
        <div>
            <h1 class="text-xl font-black italic uppercase text-white leading-tight">Cocina</h1>
            <p id="nombre-restaurante-header" class="text-[10px] text-cyan-400 font-bold uppercase tracking-widest">Cargando...</p>
        </div>
    </div>
    
    <!-- ÍCONO DE 3 RAYITAS (HAMBURGUESA) -->
    <div class="dropdown-menu">
        <button onclick="toggleMenu()" class="w-12 h-12 rounded-xl bg-white/5 hover:bg-white/10 text-white text-2xl flex items-center justify-center transition-all">
            ☰
        </button>
        <div id="dropdownContent" class="dropdown-content">
            <button onclick="cambiarVista('activos')" class="flex items-center gap-2">📦 Pedidos Activos</button>
            <button onclick="cambiarVista('historial')" class="flex items-center gap-2">📜 Historial</button>
            <hr>
            <!-- BOTÓN PARA FUTURO REGISTRO DE DEMORAS -->
            <button onclick="abrirRegistroDemoras()" class="flex items-center gap-2 text-yellow-400">⏱️ Registro de Demoras</button>
            <hr>
            <button onclick="cerrarSesionCocina()" class="flex items-center gap-2 text-red-400">🚪 Cerrar Sesión</button>
        </div>
    </div>
</header>

<!-- CONTENEDOR PRINCIPAL -->
<main id="app-container" class="px-5 py-6 max-w-4xl mx-auto">
    <!-- BANNER DE ESTADÍSTICAS -->
    <div id="stats-banner" class="bg-slate-800/80 rounded-2xl p-6 mb-8 border border-white/10 flex justify-between items-center text-center">
        <div class="flex-1">
            <p class="text-white/40 text-xs font-bold uppercase">💰 Ventas Hoy</p>
            <p id="ventas-hoy" class="text-cyan-400 text-2xl font-black">0.00€</p>
        </div>
        <div class="w-px h-12 bg-white/10"></div>
        <div class="flex-1">
            <p class="text-white/40 text-xs font-bold uppercase">📊 Semana</p>
            <p id="ventas-semana" class="text-cyan-400 text-2xl font-black">0.00€</p>
        </div>
    </div>

    <!-- TÍTULO DE LA VISTA -->
    <h2 id="titulo-vista" class="text-lg font-bold uppercase tracking-wider mb-4 text-white/80">📦 Pedidos Activos</h2>

    <!-- CONTENEDOR DE PEDIDOS -->
    <div id="lista-pedidos" class="space-y-2"></div>
</main>

<script>
// ============================================================
// 🔥 CONFIGURACIÓN DE FIREBASE
// ============================================================
const firebaseConfig = {
    apiKey: "AIzaSyDw-EdjMC5S2nQTR3ownQBlHx2AcHZBy0A",
    authDomain: "aguadulce-express-v2.firebaseapp.com",
    databaseURL: "https://aguadulce-express-v2-default-rtdb.firebaseio.com",
    projectId: "aguadulce-express-v2",
    storageBucket: "aguadulce-express-v2.firebasestorage.app",
    messagingSenderId: "897110914130",
    appId: "1:897110914130:web:9289bbc7a1a1b34205b8b"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const database = firebase.database();
const auth = firebase.auth();

// ============================================================
// 📌 VARIABLES GLOBALES
// ============================================================
let restauranteActual = null;
let pedidosListener = null;
let pedidosCompletados = [];
let vistaActual = 'activos';

// ============================================================
// 🔐 LOGIN Y AUTENTICACIÓN
// ============================================================
async function loginCocina() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    if (!email || !password) { Swal.fire('Error', 'Completa los campos', 'error'); return; }
    try {
        const user = await auth.signInWithEmailAndPassword(email, password);
        const uid = user.user.uid;
        // Buscar datos del restaurante
        const snapshot = await database.ref('restaurantes').orderByChild('uid_restaurante').equalTo(uid).once('value');
        const data = snapshot.val();
        if (!data) { Swal.fire('Error', 'No tienes un restaurante asociado.', 'error'); return; }
        
        // Tomar el primer restaurante encontrado
        const key = Object.keys(data)[0];
        restauranteActual = { uid: key, ...data[key] };
        document.getElementById('nombre-restaurante-header').innerText = restauranteActual.NOMBRE_RESTAURANTE;
        
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-container').style.display = 'block';
        iniciarEscuchaPedidos();
        calcularVentas();
    } catch (error) {
        Swal.fire('Error de Login', error.message, 'error');
    }
}

function cerrarSesionCocina() {
    if (pedidosListener) pedidosListener.off();
    auth.signOut();
    location.reload();
}

// ============================================================
// 🛒 ESCUCHA DE PEDIDOS Y RENDERIZADO
// ============================================================
function iniciarEscuchaPedidos() {
    if (pedidosListener) pedidosListener.off();
    
    pedidosListener = database.ref('pedidos')
        .orderByChild('restaurante_id')
        .equalTo(restauranteActual.uid)
        .on('value', (snap) => {
            const pedidos = snap.val() || {};
            renderizarPedidos(pedidos);
            calcularVentas();
        });
}

function renderizarPedidos(pedidos) {
    const container = document.getElementById('lista-pedidos');
    container.innerHTML = '';
    pedidosCompletados = [];
    
    // Filtrar según la vista actual
    let pedidosFiltrados = Object.entries(pedidos).filter(([id, p]) => {
        if (vistaActual === 'activos') return p.estado !== 'ENTREGADO' && p.estado !== 'CANCELADO_POR_AUSENCIA';
        if (vistaActual === 'historial') return p.estado === 'ENTREGADO' || p.estado === 'CANCELADO_POR_AUSENCIA';
        return true;
    });

    if (pedidosFiltrados.length === 0) {
        container.innerHTML = `<div class="text-center text-white/50 py-10">${vistaActual === 'activos' ? '📭 No hay pedidos activos' : '📭 Historial vacío'}</div>`;
        return;
    }

    // Ordenar por fecha (más nuevo primero)
    pedidosFiltrados.sort((a, b) => (b[1].fecha || 0) - (a[1].fecha || 0));

    pedidosFiltrados.forEach(([id, p]) => {
        const items = p.items || [];
        const estadoClase = { 'RECIBIDO': 'pendiente', 'COCCIÓN': 'coccion', 'LISTO': 'listo' }[p.estado] || 'pendiente';
        const estadoTexto = { 'RECIBIDO': '⏰ Pendiente', 'COCCIÓN': '🍳 Cociendo', 'LISTO': '✅ Listo' }[p.estado] || p.estado;

        let html = `<div class="pedido-card ${estadoClase}">`;
        html += `<div class="flex justify-between items-start"><h3 class="font-bold text-lg">#${p.id_pedido || id.slice(0,8)}</h3><span class="estado-badge ${estadoClase}">${estadoTexto}</span></div>`;
        html += `<p class="text-white/70 text-sm mt-1">👤 ${p.cliente_nombre || 'Anónimo'}</p>`;
        html += `<p class="text-white/50 text-xs mt-1">📍 ${p.direccion || 'Sin dirección'}</p>`;
        html += `<div class="mt-3 space-y-1">`;
        items.forEach(item => {
            html += `<p class="text-sm flex justify-between"><span>${item.cantidad}x ${item.nombre}</span><span class="text-cyan-400">${(item.total || 0).toFixed(2)}€</span></p>`;
        });
        html += `</div>`;
        html += `<p class="text-right font-bold text-lg mt-3 text-white">Total: ${(p.total || 0).toFixed(2)}€</p>`;
        
        // Botones de acción
        html += `<div class="flex gap-3 mt-4">`;
        if (p.estado === 'RECIBIDO') {
            html += `<button onclick="cambiarEstado('${id}', 'COCCIÓN')" class="bg-cyan-500 hover:bg-cyan-400 text-black px-4 py-2 rounded-xl font-bold flex-1">🍳 Iniciar Cocción</button>`;
        }
        if (p.estado === 'COCCIÓN') {
            html += `<button onclick="cambiarEstado('${id}', 'LISTO')" class="bg-green-500 hover:bg-green-400 text-black px-4 py-2 rounded-xl font-bold flex-1">✅ Listo para Reparto</button>`;
        }
        if (p.estado === 'LISTO') {
            html += `<span class="bg-green-600/20 text-green-400 px-4 py-2 rounded-xl font-bold flex-1 text-center">🚚 Esperando Repartidor</span>`;
        }
        html += `</div></div>`;
        container.innerHTML += html;
    });
}

async function cambiarEstado(id, nuevoEstado) {
    try {
        await database.ref(`pedidos/${id}/estado`).set(nuevoEstado);
        // Opcional: Registrar el timestamp para calcular demoras
        if (nuevoEstado === 'LISTO') {
            await database.ref(`pedidos/${id}/timestamp_listo`).set(Date.now());
        }
        Swal.fire({ title: '✅ Estado actualizado', timer: 1500, icon: 'success', showConfirmButton: false });
    } catch (error) {
        Swal.fire('Error', error.message, 'error');
    }
}

// ============================================================
// 📊 CÁLCULO DE VENTAS (Banner superior)
// ============================================================
async function calcularVentas() {
    const snapshot = await database.ref('pedidos').once('value');
    const pedidos = snapshot.val() || {};
    const hoy = new Date().setHours(0,0,0,0);
    const inicioSemana = new Date(); inicioSemana.setDate(inicioSemana.getDate() - inicioSemana.getDay() + 1); inicioSemana.setHours(0,0,0,0);
    
    let ventasHoy = 0, ventasSemana = 0;
    Object.values(pedidos).forEach(p => {
        if (p.restaurante_id === restauranteActual.uid && p.estado === 'ENTREGADO') {
            if (p.fecha >= hoy) ventasHoy += p.total || 0;
            if (p.fecha >= inicioSemana.getTime()) ventasSemana += p.total || 0;
        }
    });
    document.getElementById('ventas-hoy').innerText = ventasHoy.toFixed(2) + '€';
    document.getElementById('ventas-semana').innerText = ventasSemana.toFixed(2) + '€';
}

// ============================================================
// 🧭 CAMBIO DE VISTA Y MENÚ
// ============================================================
function cambiarVista(vista) {
    vistaActual = vista;
    document.getElementById('titulo-vista').innerText = vista === 'activos' ? '📦 Pedidos Activos' : '📜 Historial';
    toggleMenu(); // Cerrar el menú al cambiar
    // El listener de pedidos se encargará de renderizar
}

function toggleMenu() {
    document.getElementById('dropdownContent').classList.toggle('show');
}

// Cerrar menú al hacer clic fuera
document.addEventListener('click', (e) => {
    if (!e.target.closest('.dropdown-menu')) {
        document.getElementById('dropdownContent').classList.remove('show');
    }
});

// ============================================================
// ⏱️ FUTURO: REGISTRO DE DEMORAS
// ============================================================
function abrirRegistroDemoras() {
    toggleMenu(); // Cerramos el menú
    Swal.fire({
        title: '⏱️ Registro de Demoras',
        text: 'Esta funcionalidad se activará en la próxima actualización. Aquí podrás ver el tiempo de demora de cada pedido y las penalizaciones asociadas.',
        icon: 'info',
        background: '#0f172a',
        color: 'white',
        confirmButtonColor: '#06b6d4'
    });
}

// ============================================================
// 🚀 INICIO
// ============================================================
auth.onAuthStateChanged(user => {
    if (user) {
        // Si ya está logueado, intentar cargar el restaurante
        database.ref('restaurantes').orderByChild('uid_restaurante').equalTo(user.uid).once('value').then(snap => {
            const data = snap.val();
            if (data) {
                const key = Object.keys(data)[0];
                restauranteActual = { uid: key, ...data[key] };
                document.getElementById('nombre-restaurante-header').innerText = restauranteActual.NOMBRE_RESTAURANTE;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-container').style.display = 'block';
                iniciarEscuchaPedidos();
                calcularVentas();
            }
        });
    }
});

// Login HTML (para pegar en el cuerpo si no lo tienes)
document.body.innerHTML = `
    <div id="login-screen" class="min-h-screen flex items-center justify-center p-5">
        <div class="bg-slate-800 rounded-2xl p-8 w-full max-w-md">
            <h1 class="text-3xl font-bold text-center text-cyan-400 mb-6">🍔 Cocina</h1>
            <input type="email" id="login-email" placeholder="Email" class="w-full p-3 rounded-xl bg-slate-700 border border-slate-600 mb-3">
            <input type="password" id="login-password" placeholder="Contraseña" class="w-full p-3 rounded-xl bg-slate-700 border border-slate-600 mb-4">
            <button onclick="loginCocina()" class="w-full bg-cyan-400 text-black font-bold py-3 rounded-xl">INGRESAR</button>
        </div>
    </div>
` + document.body.innerHTML;
</script>
</body>
</html>
