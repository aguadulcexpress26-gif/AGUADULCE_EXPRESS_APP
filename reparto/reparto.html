<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aguadulce Express - Repartidor</title>

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest-reparto.json">
    <meta name="theme-color" content="#22c55e">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/JzmCWWG3/MOTO-LOGO.webp">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AE Reparto">

    <!-- FIREBASE SCRIPTS -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        /* ============================================
           RESET Y VARIABLES
           ============================================ */
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: #1a2234;
            --bg-card-hover: #243049;
            --border-color: #2a3a5a;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-gold: #f59e0b;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-purple: #8b5cf6;
            --accent-orange: #f97316;
            --accent-amber: #f59e0b;
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--accent-gold); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #d97706; }
        
        /* ============================================
           LOGIN
           ============================================ */
        #login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-primary);
            padding: 1rem;
            position: fixed;
            inset: 0;
            z-index: 100;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #login-container.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        
        .login-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            animation: fadeInUp 0.6s ease-out;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .login-card .logo { text-align: center; margin-bottom: 1.5rem; }
        .login-card .logo h1 { font-size: 2rem; font-weight: 900; color: var(--accent-green); letter-spacing: -0.5px; }
        .login-card .logo p { color: var(--text-secondary); font-size: 0.85rem; }
        
        .login-card input {
            width: 100%;
            padding: 0.85rem 1rem;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 1rem;
            color: var(--text-primary);
            transition: var(--transition);
            outline: none;
        }
        .login-card input:focus { border-color: var(--accent-green); box-shadow: 0 0 0 3px rgba(16,185,129,0.15); }
        .login-card input::placeholder { color: var(--text-muted); }
        
        .login-card .btn-login {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, var(--accent-green), #059669);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }
        .login-card .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(16,185,129,0.3); }
        .login-card .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        /* ============================================
           APP LAYOUT - SIDEBAR + CONTENIDO
           ============================================ */
        #app {
            display: none;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: var(--bg-primary);
            position: fixed;
            inset: 0;
            z-index: 10;
        }
        #app:not(.hidden) { display: flex; }
        
        /* ============================================
           SIDEBAR - SIEMPRE VISIBLE
           ============================================ */
        .sidebar {
            width: 200px;
            min-width: 200px;
            height: 100%;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 1rem 0.75rem;
            overflow-y: auto;
            flex-shrink: 0;
            z-index: 10;
        }
        
        .sidebar .brand {
            padding: 0 0.75rem 1rem 0.75rem;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 1rem;
        }
        .sidebar .brand h1 {
            font-size: 1.1rem;
            font-weight: 900;
            color: var(--accent-green);
            letter-spacing: -0.5px;
        }
        .sidebar .brand span {
            font-size: 0.65rem;
            color: var(--text-muted);
            display: block;
        }
        
        .sidebar .user-info {
            padding: 0.5rem 0.75rem;
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            margin-bottom: 1rem;
            border: 1px solid var(--border-color);
        }
        .sidebar .user-info .name {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sidebar .user-info .status {
            font-size: 0.6rem;
            margin-top: 0.2rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .sidebar .user-info .status .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            background: var(--accent-green);
        }
        
        .sidebar .menu-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.6rem 0.75rem;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
            border: none;
            background: transparent;
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: 0.15rem;
        }
        .sidebar .menu-item:hover {
            background: var(--bg-card);
            color: var(--text-primary);
        }
        .sidebar .menu-item.active {
            background: var(--accent-green);
            color: white;
        }
        .sidebar .menu-item .badge {
            margin-left: auto;
            background: var(--accent-blue);
            color: white;
            padding: 0.05rem 0.5rem;
            border-radius: 50px;
            font-size: 0.6rem;
            font-weight: 700;
            min-width: 20px;
            text-align: center;
        }
        .sidebar .menu-item .badge.gold { background: var(--accent-gold); color: #0f172a; }
        
        .sidebar .menu-divider {
            height: 1px;
            background: var(--border-color);
            margin: 0.5rem 0.75rem;
        }
        
        .sidebar .menu-item.danger { color: var(--accent-red); }
        .sidebar .menu-item.danger:hover { background: rgba(239,68,68,0.15); color: var(--accent-red); }
        
        /* ============================================
           CONTENIDO PRINCIPAL
           ============================================ */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-primary);
        }
        
        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 1.5rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            min-height: 50px;
        }
        .main-header .page-title {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-primary);
        }
        .main-header .page-title .highlight { color: var(--accent-green); }
        
        .stats-bar {
            display: flex;
            gap: 0.75rem;
            padding: 0.4rem 1.5rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            flex-wrap: wrap;
            align-items: center;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.15rem 0.7rem;
            background: var(--bg-card);
            border-radius: 50px;
            border: 1px solid var(--border-color);
        }
        .stat-item .icon { font-size: 0.8rem; }
        .stat-item .label { font-size: 0.6rem; color: var(--text-muted); font-weight: 500; }
        .stat-item .value { font-size: 0.8rem; font-weight: 700; min-width: 16px; text-align: center; }
        .stat-item .value.blue { color: var(--accent-blue); }
        .stat-item .value.purple { color: var(--accent-purple); }
        .stat-item .value.orange { color: var(--accent-orange); }
        .stat-item .value.green { color: var(--accent-green); }
        
        .kanban-container {
            flex: 1;
            display: flex;
            gap: 1rem;
            padding: 0.75rem 1.5rem;
            overflow-x: auto;
            overflow-y: hidden;
            background: var(--bg-primary);
            min-height: 0;
        }
        
        .kanban-column {
            flex: 1;
            min-width: 280px;
            max-width: 33%;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }
        .kanban-column:hover { border-color: var(--accent-green); }
        
        .kanban-column .column-header {
            padding: 0.5rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            flex-shrink: 0;
            background: var(--bg-secondary);
        }
        .kanban-column .column-header .title {
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .kanban-column .column-header .count {
            background: var(--bg-card);
            padding: 0.05rem 0.6rem;
            border-radius: 50px;
            font-size: 0.65rem;
            font-weight: 700;
        }
        
        .kanban-column.pending .column-header { border-bottom-color: var(--accent-blue); }
        .kanban-column.pending .column-header .title { color: var(--accent-blue); }
        .kanban-column.in-progress .column-header { border-bottom-color: var(--accent-purple); }
        .kanban-column.in-progress .column-header .title { color: var(--accent-purple); }
        .kanban-column.delivered .column-header { border-bottom-color: var(--accent-green); }
        .kanban-column.delivered .column-header .title { color: var(--accent-green); }
        
        .kanban-column .column-content {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        /* ============================================
           TARJETAS DE PEDIDOS
           ============================================ */
        .order-card {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            transition: var(--transition);
            flex-shrink: 0;
        }
        .order-card:hover {
            border-color: var(--accent-gold);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        .order-card .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.2rem;
        }
        .order-card .top .id {
            font-size: 0.6rem;
            font-family: monospace;
            color: var(--text-muted);
        }
        .order-card .top .time {
            font-size: 0.55rem;
            color: var(--text-muted);
        }
        
        .order-card .cliente {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-primary);
        }
        .order-card .direccion {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 0.1rem;
        }
        
        .order-card .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.5rem;
            padding-top: 0.5rem;
            border-top: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 0.3rem;
        }
        .order-card .footer .precio {
            font-weight: 700;
            color: var(--accent-gold);
            font-size: 0.85rem;
        }
        .order-card .footer .badge-estado {
            font-size: 0.55rem;
            padding: 0.1rem 0.5rem;
            border-radius: 50px;
            font-weight: 600;
        }
        .order-card .footer .badge-estado.pending { background: rgba(59,130,246,0.15); color: var(--accent-blue); }
        .order-card .footer .badge-estado.progress { background: rgba(139,92,246,0.15); color: var(--accent-purple); }
        .order-card .footer .badge-estado.delivered { background: rgba(16,185,129,0.15); color: var(--accent-green); }
        
        .order-card .actions {
            display: flex;
            gap: 0.3rem;
            margin-top: 0.3rem;
            flex-wrap: wrap;
            width: 100%;
        }
        .order-card .actions .btn {
            padding: 0.2rem 0.6rem;
            border-radius: 50px;
            font-size: 0.6rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            flex: 1;
            min-width: 50px;
            text-align: center;
        }
        .order-card .actions .btn:hover { transform: scale(1.05); }
        .order-card .actions .btn-primary { background: var(--accent-blue); color: white; }
        .order-card .actions .btn-primary:hover { background: #2563eb; }
        .order-card .actions .btn-success { background: var(--accent-green); color: white; }
        .order-card .actions .btn-success:hover { background: #059669; }
        .order-card .actions .btn-purple { background: var(--accent-purple); color: white; }
        .order-card .actions .btn-purple:hover { background: #7c3aed; }
        .order-card .actions .btn-orange { background: var(--accent-orange); color: white; }
        .order-card .actions .btn-orange:hover { background: #ea580c; }
        .order-card .actions .btn-danger { background: var(--accent-red); color: white; }
        .order-card .actions .btn-danger:hover { background: #dc2626; }
        
        /* ============================================
           TOAST PROFESIONAL
           ============================================ */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 380px;
            width: 100%;
        }
        .toast {
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            color: white;
            font-weight: 500;
            font-size: 0.85rem;
            box-shadow: var(--shadow);
            animation: slideInRight 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 4px solid rgba(255,255,255,0.3);
            backdrop-filter: blur(10px);
        }
        .toast .icon { font-size: 1.3rem; flex-shrink: 0; }
        .toast .content { flex: 1; }
        .toast .content .title { font-weight: 700; font-size: 0.8rem; }
        .toast .content .message { font-size: 0.75rem; opacity: 0.9; }
        .toast .close {
            background: none;
            border: none;
            color: rgba(255,255,255,0.6);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0 4px;
            transition: var(--transition);
        }
        .toast .close:hover { color: white; }
        .toast-success { background: linear-gradient(135deg, #10b981, #059669); }
        .toast-error { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .toast-info { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .toast-warning { background: linear-gradient(135deg, #f59e0b, #d97706); color: #0f172a; }
        .toast-purple { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
        .toast-orange { background: linear-gradient(135deg, #f97316, #ea580c); }
        .toast-red { background: linear-gradient(135deg, #dc2626, #b91c1c); }
        .toast-dark { background: linear-gradient(135deg, #1e293b, #0f172a); border-left-color: var(--accent-gold); }
        
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideOutRight {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(100px); }
        }
        
        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 1024px) {
            .sidebar { width: 160px; min-width: 160px; padding: 0.5rem; }
            .sidebar .brand h1 { font-size: 0.9rem; }
            .sidebar .menu-item { font-size: 0.7rem; padding: 0.4rem 0.5rem; }
            .kanban-container { padding: 0.5rem; }
            .kanban-column { min-width: 200px; max-width: 50%; }
            .stats-bar { padding: 0.3rem 1rem; }
        }
        
        @media (max-width: 768px) {
            .sidebar { width: 55px; min-width: 55px; padding: 0.3rem; }
            .sidebar .brand { display: none; }
            .sidebar .user-info { display: none; }
            .sidebar .menu-item { font-size: 0.55rem; padding: 0.4rem 0.2rem; justify-content: center; }
            .sidebar .menu-item span:not(.icon) { display: none; }
            .sidebar .menu-item .badge { display: none; }
            .sidebar .menu-divider { margin: 0.2rem 0; }
            
            .kanban-container { flex-direction: column; overflow-y: auto; overflow-x: hidden; padding: 0.3rem; }
            .kanban-column { min-width: unset; max-width: unset; max-height: 40vh; }
            
            .main-header { padding: 0.3rem 0.5rem; }
            .main-header .page-title { font-size: 0.7rem; }
            .stats-bar { padding: 0.2rem 0.5rem; gap: 0.3rem; }
            .stat-item { padding: 0.1rem 0.4rem; }
            .stat-item .label { font-size: 0.5rem; }
            .stat-item .value { font-size: 0.65rem; }
            .order-card { padding: 0.5rem; }
            
            .toast-container { top: 10px; right: 10px; max-width: calc(100% - 20px); }
            .toast { padding: 10px 14px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <!-- ============================================
    LOGIN
    ============================================ -->
    <div id="login-container">
        <div class="login-card">
            <div class="logo">
                <h1>🛵 Aguadulce Express</h1>
                <p>Área de Repartidores</p>
            </div>
            <form id="login-form" style="display:flex;flex-direction:column;gap:1rem;">
                <input type="text" id="login-nombre" placeholder="Nombre del repartidor" required>
                <input type="password" id="login-password" placeholder="Contraseña" required>
                <button type="submit" class="btn-login" id="login-btn">
                    <span id="login-text">Ingresar</span>
                    <span id="login-loading" style="display:none;">Cargando...</span>
                </button>
                <div id="login-error" style="color:var(--accent-red);font-size:0.8rem;text-align:center;display:none;"></div>
            </form>
        </div>
    </div>

    <!-- ============================================
    APP PRINCIPAL
    ============================================ -->
    <div id="app" class="hidden">
        
        <!-- ============================================
        SIDEBAR
        ============================================ -->
        <aside class="sidebar">
            <div class="brand">
                <h1>🛵 Aguadulce</h1>
                <span>Repartidor</span>
            </div>
            
            <div class="user-info">
                <div class="name" id="sidebar-nombre">Cargando...</div>
                <div class="status">
                    <span class="dot"></span>
                    <span id="sidebar-status">Conectado</span>
                </div>
            </div>
            
            <button class="menu-item active" data-view="activos">
                <span class="icon">📋</span>
                <span>Activos</span>
                <span class="badge" id="sidebar-badge">0</span>
            </button>
            
            <button class="menu-item" data-view="historial">
                <span class="icon">📜</span>
                <span>Historial</span>
            </button>
            
            <button class="menu-item" data-view="ganancias">
                <span class="icon">💰</span>
                <span>Ganancias</span>
            </button>
            
            <div class="menu-divider"></div>
            
            <button class="menu-item" onclick="testSonido()">
                <span class="icon">🔊</span>
                <span>Probar Sonido</span>
            </button>
            
            <button class="menu-item" onclick="abrirAsistencia()">
                <span class="icon">🆘</span>
                <span>Asistencia</span>
            </button>
            
            <div class="menu-divider"></div>
            
            <button class="menu-item danger" id="btn-cerrar-sesion">
                <span class="icon">🚪</span>
                <span>Salir</span>
            </button>
        </aside>
        
        <!-- ============================================
        CONTENIDO PRINCIPAL
        ============================================ -->
        <div class="main-content">
            
            <header class="main-header">
                <span class="page-title">📋 <span class="highlight">Pedidos</span> Activos</span>
            </header>
            
            <div class="stats-bar">
                <div class="stat-item">
                    <span class="icon">📦</span>
                    <span class="label">Por Recoger</span>
                    <span class="value blue" id="count-por-recoger">0</span>
                </div>
                <div class="stat-item">
                    <span class="icon">🛵</span>
                    <span class="label">En Camino</span>
                    <span class="value purple" id="count-en-camino">0</span>
                </div>
                <div class="stat-item">
                    <span class="icon">🔔</span>
                    <span class="label">En Puerta</span>
                    <span class="value orange" id="count-en-puerta">0</span>
                </div>
                <div class="stat-item">
                    <span class="icon">💰</span>
                    <span class="label">Hoy</span>
                    <span class="value green" id="count-ganancias-hoy">0€</span>

            <div class="kanban-container" id="kanban-container">
                
                <!-- COLUMNA: POR RECOGER -->
                <div class="kanban-column pending" id="columna-pendiente">
                    <div class="column-header">
                        <span class="title">📦 Por Recoger</span>
                        <span class="count" id="col-count-pendiente">0</span>
                    </div>
                    <div class="column-content" id="col-pendiente"></div>
                </div>
                
                <!-- COLUMNA: EN CAMINO -->
                <div class="kanban-column in-progress" id="columna-progreso">
                    <div class="column-header">
                        <span class="title">🛵 En Camino</span>
                        <span class="count" id="col-count-progreso">0</span>
                    </div>
                    <div class="column-content" id="col-progreso"></div>
                </div>
                
                <!-- COLUMNA: ENTREGADOS -->
                <div class="kanban-column delivered" id="columna-entregados">
                    <div class="column-header">
                        <span class="title">✅ Entregados</span>
                        <span class="count" id="col-count-entregados">0</span>

            </div>

    </div>

    <!-- ============================================
    TOAST CONTAINER
    ============================================ -->
    <div class="toast-container" id="toast-container"></div>

    <!-- ============================================
    MODAL OPCIONES
    ============================================ -->
    <div id="modal-opciones" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:500;justify-content:center;align-items:center;backdrop-filter:blur(5px);">
        <div style="background:var(--bg-card);border-radius:var(--radius);padding:24px;width:90%;max-width:400px;max-height:80vh;overflow-y:auto;border:1px solid var(--border-color);">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                <h3 style="font-weight:700;font-size:1rem;color:var(--text-primary);">🔧 Opciones</h3>
                <button onclick="cerrarModalOpciones()" style="background:none;border:none;color:var(--text-muted);font-size:1.5rem;cursor:pointer;">✕</button>
            </div>
            <div id="modal-opciones-contenido"></div>
        </div>
    </div>

    <!-- ============================================
    JAVASCRIPT PRINCIPAL
    ============================================ -->
    <script>
        // ============================================================
        // 🔥 CONFIGURACIÓN DE FIREBASE
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBEapmpody3y_vFyPF0ngUnCn5ZFOtxPjs",
            authDomain: "aguadulce-express-v2.firebaseapp.com",
            databaseURL: "https://aguadulce-express-v2-default-rtdb.firebaseio.com",
            projectId: "aguadulce-express-v2",
            storageBucket: "aguadulce-express-v2.appspot.com",
            messagingSenderId: "103953800507",
            appId: "1:103953800507:web:tu_app_id"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();

        // ============================================================
        // 📌 VARIABLES GLOBALES
        // ============================================================
        let repartidorActual = null;
        let pedidosListener = null;
        let currentView = 'activos';
        let pedidosAnteriores = {};

        // ============================================================
        // 🛠️ SISTEMA DE TOASTS PROFESIONALES
        // ============================================================
        function showToast(title, message, type = 'info', duration = 4000) {
            const container = document.getElementById('toast-container');
            if (!container) return;
            
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            
            const icons = {
                success: '✅',
                error: '❌',
                info: '📌',
                warning: '⚠️',
                purple: '🛵',
                orange: '📍',
                red: '⏰',
                dark: '📦'
            };
            
            toast.innerHTML = `
                <span class="icon">${icons[type] || '📌'}</span>
                <div class="content">
                    <div class="title">${title}</div>
                    <div class="message">${message}</div>
                </div>
                <button class="close" onclick="this.parentElement.remove()">✕</button>
            `;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideOutRight 0.3s ease forwards';
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        // ============================================================
        // 📌 FUNCIONES DE UI
        // ============================================================
        function cerrarModalOpciones() {
            document.getElementById('modal-opciones').style.display = 'none';
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
        }

        function setText(id, value) {
            const el = document.getElementById(id);
            if (el) el.textContent = value;
        }

        // ============================================================
        // 🔐 AUTENTICACIÓN
        // ============================================================
        const loginForm = document.getElementById('login-form');
        const loginNombre = document.getElementById('login-nombre');
        const loginPassword = document.getElementById('login-password');
        const loginBtn = document.getElementById('login-btn');
        const loginText = document.getElementById('login-text');
        const loginLoading = document.getElementById('login-loading');
        const loginError = document.getElementById('login-error');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nombre = loginNombre.value.trim();
            const password = loginPassword.value;
            
            if (!nombre || !password) {
                loginError.textContent = 'Completa todos los campos';
                loginError.style.display = 'block';
                return;
            }
            
            loginBtn.disabled = true;
            loginText.style.display = 'none';
            loginLoading.style.display = 'inline';
            loginError.style.display = 'none';
            
            try {
                const snapshot = await database.ref('repartidores').once('value');
                const repartidores = snapshot.val() || {};
                let encontrado = null;
                
                for (const [id, data] of Object.entries(repartidores)) {
                    if (data.nombre === nombre && data.password === password && data.activo !== false) {
                        encontrado = { id, ...data };
                        break;
                    }
                }
                
                if (!encontrado) {
                    throw new Error('Credenciales incorrectas');
                }
                
                repartidorActual = encontrado;
                localStorage.setItem('repartidor_actual', JSON.stringify(repartidorActual));
                
                document.getElementById('login-container').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                
                document.getElementById('sidebar-nombre').textContent = repartidorActual.nombre;
                
                // ✅ TOAST DE BIENVENIDA
                showToast('✅ Bienvenido', `${repartidorActual.nombre}`, 'success', 3000);
                
                await auth.signInAnonymously();
                
                // ✅ REGISTRAR TOKEN DE NOTIFICACIONES
                await registrarTokenNotificaciones(repartidorActual.id);
                
                iniciarEscuchaPedidos();
                renderizarVista();
                
            } catch (error) {
                console.error('Error de login:', error);
                loginError.textContent = error.message || 'Error al iniciar sesión';
                loginError.style.display = 'block';
                loginBtn.disabled = false;
                loginText.style.display = 'inline';
                loginLoading.style.display = 'none';
                showToast('❌ Error', error.message, 'error', 3000);
            }
        });

        // ============================================================
        // 📱 REGISTRO DE TOKEN
        // ============================================================
        async function registrarTokenNotificaciones(repartidorId) {
            console.log('📱 Registrando token para:', repartidorId);
            
            try {
                // Verificar si estamos en entorno nativo (APK)
                const isNative = window.Capacitor && Capacitor.getPlatform() === 'android';
                
                if (isNative) {
                    // 📱 NOTIFICACIONES NATIVAS (Capacitor)
                    console.log('📱 Entorno nativo (APK) detectado');
                    const { PushNotifications } = Capacitor.Plugins;
                    
                    const permStatus = await PushNotifications.requestPermissions();
                    console.log('📱 Permisos:', permStatus);
                    
                    if (permStatus.receive === 'granted') {
                        await PushNotifications.register();
                        
                        PushNotifications.addListener('registration', async (token) => {
                            if (token && token.value) {
                                await database.ref(`repartidores/${repartidorId}/token`).set(token.value);
                                console.log('✅ Token guardado');
                                showToast('✅ Notificaciones activadas', 'Recibirás alertas de nuevos pedidos', 'success', 3000);
                            }
                        });
                        
                        PushNotifications.addListener('pushNotificationReceived', (notification) => {
                            console.log('📨 Notificación:', notification);
                            showToast(
                                notification.title || '📦 Nuevo pedido',
                                notification.body || 'Tienes un nuevo pedido disponible',
                                'dark',
                                6000
                            );
                            reproducirSonido();
                        });
                    }
                } else {
                    // 🌐 NOTIFICACIONES WEB
                    console.log('🌐 Entorno web detectado');
                    
                    if (typeof firebase.messaging === 'undefined') {
                        console.warn('⚠️ Firebase Messaging no disponible');
                        return;
                    }
                    
                    const messaging = firebase.messaging();
                    const permission = await Notification.requestPermission();
                    
                    if (permission === 'granted') {
                        try {
                            const token = await messaging.getToken({
                                vapidKey: 'BH4IAMeS7LHkDjOt84N-7mG985aTyHpYXx845HqKCnT8oGyxbaJ9pT98IgfslMsrFTJW3jHpvik0mrY263nlFRY'
                            });
                            
                            if (token) {
                                await database.ref(`repartidores/${repartidorId}/token`).set(token);
                                console.log('✅ Token FCM guardado');
                                showToast('✅ Notificaciones activadas', 'Recibirás alertas de nuevos pedidos', 'success', 3000);
                            }
                        } catch (error) {
                            console.error('❌ Error FCM:', error);
                        }
                    }
                }
            } catch (error) {
                console.error('❌ Error registrando token:', error);
            }
        }

        // ============================================================
        // 🔊 SONIDO
        // ============================================================
        function reproducirSonido() {
            try {
                const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
                audio.volume = 1.0;
                audio.play().catch(() => {});
                if (navigator.vibrate) navigator.vibrate(300);
            } catch (error) {
                console.log('⚠️ Sonido no disponible');
            }
        }

        function testSonido() {
            reproducirSonido();
            showToast('🔊 Sonido probado', 'Si escuchaste el sonido, todo funciona correctamente', 'info', 3000);
        }

        // ============================================================
        // 📡 ESCUCHA DE PEDIDOS
        // ============================================================
        function iniciarEscuchaPedidos() {
            if (pedidosListener) {
                try { pedidosListener.off(); } catch(e) {}
                pedidosListener = null;
            }

            const uid = repartidorActual.id;

            pedidosListener = database.ref('pedidos').on('value', (snapshot) => {
                const todosPedidos = snapshot.val() || {};
                const pedidosPorRecoger = [];
                const pedidosEnCamino = [];
                const pedidosEntregados = [];
                
                let nuevosPedidos = [];

                for (const [id, data] of Object.entries(todosPedidos)) {
                    if (data.uid_repartidor !== uid) continue;
                    
                    const estado = data.estado || '';
                    
                    if (estado === 'ENTREGADO' || estado === 'CANCELADO_POR_AUSENCIA') {
                        pedidosEntregados.push({ id, ...data });
                    } else if (estado === 'EN_REPARTO') {
                        pedidosEnCamino.push({ id, ...data });
                    } else if (estado === 'LISTO' || estado === 'PENDIENTE') {
                        pedidosPorRecoger.push({ id, ...data });
                        if (!pedidosAnteriores[id]) {
                            nuevosPedidos.push({ id, ...data });
                        }
                    }
                }

                // ✅ NOTIFICAR NUEVOS PEDIDOS
                for (const pedido of nuevosPedidos) {
                    showToast(
                        '📦 Nuevo pedido asignado',
                        `Cliente: ${pedido.cliente_nombre} - Total: ${(pedido.total||0).toFixed(2)}€`,
                        'dark',
                        6000
                    );
                    reproducirSonido();
                }

                pedidosAnteriores = todosPedidos;

                renderizarColumnas(pedidosPorRecoger, pedidosEnCamino, pedidosEntregados);
                actualizarContadores(pedidosPorRecoger.length, pedidosEnCamino.length, pedidosEntregados.length);
                actualizarGanancias(pedidosEntregados);
            });
        }

        // ============================================================
        // 📊 ACTUALIZAR CONTADORES
        // ============================================================
        function actualizarContadores(porRecoger, enCamino, entregados) {
            setText('count-por-recoger', porRecoger);
            setText('count-en-camino', enCamino);
            setText('count-en-puerta', entregados);
            setText('col-count-pendiente', porRecoger);
            setText('col-count-progreso', enCamino);
            setText('col-count-entregados', entregados);
            setText('sidebar-badge', porRecoger + enCamino);
        }

        function actualizarGanancias(pedidos) {
            const hoyInicio = new Date();
            hoyInicio.setHours(0, 0, 0, 0);
            let totalHoy = 0;
            
            for (const p of pedidos) {
                if (p.estado === 'ENTREGADO') {
                    const fecha = new Date(p.timestamp_entregado || p.fecha || 0);
                    if (fecha >= hoyInicio) {
                        totalHoy += p.total || 0;
                    }
                }
            }
            
            setText('count-ganancias-hoy', totalHoy.toFixed(2) + '€');
        }

        // ============================================================
        // 🎨 RENDERIZAR COLUMNAS
        // ============================================================
        function renderizarColumnas(porRecoger, enCamino, entregados) {
            renderizarPedidos('col-pendiente', porRecoger, 'pendiente');
            renderizarPedidos('col-progreso', enCamino, 'progreso');
            renderizarPedidos('col-entregados', entregados, 'entregado');
        }

        function renderizarPedidos(containerId, pedidos, tipo) {
            const container = document.getElementById(containerId);
            if (!container) return;
            
            if (pedidos.length === 0) {
                const mensajes = {
                    'pendiente': '📭 No hay pedidos para recoger',
                    'progreso': '🛵 No hay pedidos en camino',
                    'entregado': '✅ No hay pedidos entregados hoy'
                };
                container.innerHTML = `
                    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem;color:var(--text-muted);text-align:center;height:100%;min-height:60px;font-size:0.75rem;">
                        <div style="font-size:1.5rem;margin-bottom:0.3rem;">${mensajes[tipo] || '📭 Sin pedidos'}</div>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = '';
            
            for (const p of pedidos) {
                const card = document.createElement('div');
                card.className = 'order-card';
                
                let botonesHtml = '';
                let badgeClass = '';
                let badgeText = '';
                
                if (tipo === 'pendiente') {
                    badgeClass = 'pending';
                    badgeText = '📦 Por recoger';
                    botonesHtml = `
                        <div class="actions">
                            <button class="btn btn-primary" onclick="verDetalle('${p.id}')">📋 Detalle</button>
                            <button class="btn btn-purple" onclick="recogerPedido('${p.id}')">🛵 Recoger</button>
                        </div>
                    `;
                } else if (tipo === 'progreso') {
                    badgeClass = 'progress';
                    badgeText = '🛵 En camino';
                    botonesHtml = `
                        <div class="actions">
                            <button class="btn btn-primary" onclick="verDetalle('${p.id}')">📋 Detalle</button>
                            <button class="btn btn-orange" onclick="llegarDestino('${p.id}')">📍 Llegué</button>
                        </div>
                    `;
                } else {
                    badgeClass = 'delivered';
                    badgeText = '✅ Entregado';
                    botonesHtml = `
                        <div class="actions">
                            <button class="btn btn-primary" onclick="verDetalle('${p.id}')">📋 Detalle</button>
                            <button class="btn btn-success" onclick="entregarPedido('${p.id}')">💰 Cobrar</button>
                        </div>
                    `;
                }
                
                const fecha = p.timestamp ? new Date(p.timestamp).toLocaleTimeString() : '';
                
                card.innerHTML = `
                    <div class="top">
                        <span class="id">#${p.id_pedido || p.id.substring(0,8)}</span>
                        <span class="time">${fecha}</span>
                    </div>
                    <div class="cliente">${escapeHTML(p.cliente_nombre)}</div>
                    <div class="direccion">${escapeHTML(p.direccion || 'Sin dirección')}</div>
                    <div class="footer">
                        <span class="precio">${(p.total||0).toFixed(2)}€</span>
                        <span class="badge-estado ${badgeClass}">${badgeText}</span>
                    </div>
                    ${botonesHtml}
                `;
                
                container.appendChild(card);
            }
        }

        // ============================================================
        // 🎯 ACCIONES DE PEDIDOS (CON TOASTS)
        // ============================================================
        
        // 1. RECOGER PEDIDO
        window.recogerPedido = async function(pedidoId) {
            try {
                await database.ref(`pedidos/${pedidoId}`).update({
                    estado: 'EN_REPARTO',
                    timestamp_recogido: Date.now()
                });
                
                showToast('🛵 Pedido recogido', '¡En camino al cliente!', 'purple', 3000);
                renderizarVista();
            } catch (error) {
                showToast('❌ Error', 'No se pudo recoger el pedido', 'error', 3000);
            }
        };

        // 2. LLEGAR AL DESTINO
        window.llegarDestino = async function(pedidoId) {
            try {
                await database.ref(`pedidos/${pedidoId}`).update({
                    estado: 'EN_PUERTA',
                    timestamp_llegada: Date.now()
                });
                
                showToast('📍 Has llegado', 'Estás en la puerta del cliente', 'orange', 3000);
                renderizarVista();
            } catch (error) {
                showToast('❌ Error', 'No se pudo actualizar el estado', 'error', 3000);
            }
        };

        // 3. ENTREGAR PEDIDO
        window.entregarPedido = async function(pedidoId) {
            try {
                const snap = await database.ref(`pedidos/${pedidoId}`).once('value');
                const pedido = snap.val();
                const total = pedido?.total || 0;
                
                const { value: monto } = await Swal.fire({
                    title: '💰 Cobro',
                    html: `
                        <p style="margin-bottom:12px;">Total a cobrar: <strong style="font-size:24px;">${total.toFixed(2)}€</strong></p>
                        <input type="number" id="montoRecibido" step="0.01" class="w-full p-3 rounded-xl border" placeholder="¿Con cuánto paga?" value="${total}">
                    `,
                    confirmButtonText: '✅ Confirmar entrega',
                    showCancelButton: true,
                    cancelButtonText: 'Cancelar',
                    background: '#fff',
                    preConfirm: () => {
                        const recibido = parseFloat(document.getElementById('montoRecibido').value);
                        if (isNaN(recibido)) {
                            Swal.showValidationMessage('Ingresa un monto válido');
                            return false;
                        }
                        return { recibido };
                    }
                });
                
                if (monto) {
                    const cambio = monto.recibido - total;
                    await database.ref(`pedidos/${pedidoId}`).update({
                        estado: 'ENTREGADO',
                        monto_recibido: monto.recibido,
                        cambio_entregado: cambio >= 0 ? cambio : 0,
                        timestamp_entregado: Date.now()
                    });
                    
                    showToast(
                        '✅ Pedido entregado',
                        `Total: ${total.toFixed(2)}€ - Cambio: ${cambio >= 0 ? cambio.toFixed(2) : '0'}€`,
                        'success',
                        4000
                    );
                    renderizarVista();
                }
            } catch (error) {
                showToast('❌ Error', 'No se pudo entregar el pedido', 'error', 3000);
            }
        };

        // 4. VER DETALLE
        window.verDetalle = async function(pedidoId) {
            const snap = await database.ref(`pedidos/${pedidoId}`).once('value');
            const p = snap.val();
            
            if (!p) {
                showToast('❌ Error', 'Pedido no encontrado', 'error', 3000);
                return;
            }
            
            Swal.fire({
                title: `📋 Pedido #${p.id_pedido || pedidoId.substring(0,8)}`,
                html: `
                    <div style="text-align:left;color:#f1f5f9;">
                        <div style="background:#1a2234;padding:12px;border-radius:8px;margin-bottom:12px;">
                            <p><strong>👤 Cliente:</strong> ${escapeHTML(p.cliente_nombre)}</p>
                            <p><strong>📍 Dirección:</strong> ${escapeHTML(p.direccion)}</p>
                            <p><strong>💰 Total:</strong> ${(p.total||0).toFixed(2)}€</p>
                            <p><strong>📦 Estado:</strong> ${p.estado || 'Pendiente'}</p>
                        </div>
                        <div style="background:#1a2234;padding:12px;border-radius:8px;">
                            <p><strong>📦 Productos:</strong></p>
                            <p>${p.items?.map(i => `${i.cantidad}x ${i.nombre}`).join('<br>') || p.detalle || 'Sin productos'}</p>
                        </div>
                    </div>
                `,
                confirmButtonText: '✅ Cerrar',
                background: '#0f172a',
                color: '#f1f5f9',
                confirmButtonColor: '#10b981'
            });
        };

        // ============================================================
        // 📌 NAVEGACIÓN DEL MENÚ
        // ============================================================
        function renderizarVista() {
            // Las columnas se actualizan solas con el listener
            // Esta función solo fuerza la recarga
            if (pedidosListener) {
                pedidosListener.off();
                iniciarEscuchaPedidos();
            }
        }

        document.querySelectorAll('.menu-item[data-view]').forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                
                document.querySelectorAll('.menu-item[data-view]').forEach(el => {
                    el.classList.remove('active');
                });
                this.classList.add('active');
                
                const view = this.dataset.view;
                currentView = view;
                
                if (view === 'activos') {
                    renderizarVista();
                } else if (view === 'historial') {
                    // Mostrar historial (mantener funcionalidad)
                    showToast('📜 Historial', 'Cargando historial de pedidos...', 'info', 2000);
                } else if (view === 'ganancias') {
                    showToast('💰 Ganancias', 'Cargando resumen de ganancias...', 'info', 2000);
                }
            });
        });

        // ============================================================
        // 🆘 ASISTENCIA
        // ============================================================
        function abrirAsistencia() {
            Swal.fire({
                title: '🆘 Asistencia Repartidor',
                html: `
                    <div style="text-align:left;color:#f1f5f9;">
                        <p style="color:#94a3b8;">¿Tienes algún problema con tu entrega?</p>
                        <hr style="border-color:#334155;margin:10px 0;">
                        <p style="font-weight:700;">📞 Contacta con soporte:</p>
                        <p style="color:#10b981;">📞 643 261 881 (solo llamadas)</p>
                        <p style="color:#10b981;">✉️ soporteaguadulcexpress26@gmail.com</p>
                    </div>
                `,
                confirmButtonText: '📞 Llamar',
                showCancelButton: true,
                cancelButtonText: 'Cerrar',
                background: '#0f172a',
                color: 'white',
                confirmButtonColor: '#10b981',
                cancelButtonColor: '#334155'
            }).then(result => {
                if (result.isConfirmed) window.location.href = 'tel:643261881';
            });
        }

        // ============================================================
        // 🚪 CERRAR SESIÓN
        // ============================================================
        document.getElementById('btn-cerrar-sesion').addEventListener('click', async () => {
            const confirm = await Swal.fire({
                title: '¿Cerrar sesión?',
                text: '¿Seguro que quieres salir?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Sí, salir',
                cancelButtonText: 'Cancelar',
                background: '#0f172a',
                color: 'white',
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#334155'
            });
            
            if (confirm.isConfirmed) {
                if (pedidosListener) {
                    try { pedidosListener.off(); } catch(e) {}
                    pedidosListener = null;
                }
                localStorage.removeItem('repartidor_actual');
                showToast('👋 Sesión cerrada', 'Hasta pronto', 'info', 2000);
                setTimeout(() => location.reload(), 500);
            }
        });

        // ============================================================
        // 🚀 INICIO DE LA APP
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('repartidor_actual')) {
                try {
                    repartidorActual = JSON.parse(localStorage.getItem('repartidor_actual'));
                    document.getElementById('login-container').classList.add('hidden');
                    document.getElementById('app').classList.remove('hidden');
                    document.getElementById('sidebar-nombre').textContent = repartidorActual.nombre;
                    
                    auth.signInAnonymously()
                        .then(() => {
                            console.log('✅ Auto-login exitoso');
                            registrarTokenNotificaciones(repartidorActual.id);
                            iniciarEscuchaPedidos();
                            showToast('👋 Bienvenido', `${repartidorActual.nombre}`, 'success', 3000);
                        })
                        .catch(error => {
                            console.error('❌ Auto-login falló:', error);
                            localStorage.removeItem('repartidor_actual');
                            location.reload();
                        });
                } catch (error) {
                    console.error('❌ Error restaurando sesión:', error);
                    localStorage.removeItem('repartidor_actual');
                }
            }
        });

        console.log('🛵 Aguadulce Express - App Repartidor V2');
        console.log('📱 Sistema de notificaciones profesional activado');
    </script>

</body>
</html>
