<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Aguadulce Express - Cocina Móvil</title>
    
    <!-- ============================================ -->
    <!-- TODOS LOS SCRIPTS CON URLS ABSOLUTAS (CDN)   -->
    <!-- ============================================ -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-functions-compat.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        /* ============================================
           RESET Y VARIABLES
           ============================================ */
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: #1a2234;
            --bg-card-hover: #243049;
            --border-color: #2a3a5a;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-gold: #f59e0b;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-purple: #8b5cf6;
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font-size-base: 14px;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: var(--font-size-base);
        }
        
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--accent-gold); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #d97706; }
        
        /* ============================================
           LOGIN
           ============================================ */
        #login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-primary);
            padding: 1rem;
            position: fixed;
            inset: 0;
            z-index: 100;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #login-container.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        
        .login-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            animation: fadeInUp 0.6s ease-out;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .login-card .logo { text-align: center; margin-bottom: 1.5rem; }
        .login-card .logo h1 { font-size: 2rem; font-weight: 900; color: var(--accent-gold); letter-spacing: -0.5px; }
        .login-card .logo p { color: var(--text-secondary); font-size: 0.85rem; }
        
        .login-card input {
            width: 100%;
            padding: 0.85rem 1rem;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 1rem;
            color: var(--text-primary);
            transition: var(--transition);
            outline: none;
        }
        .login-card input:focus { border-color: var(--accent-gold); box-shadow: 0 0 0 3px rgba(245,158,11,0.15); }
        .login-card input::placeholder { color: var(--text-muted); }
        
        .login-card .btn-login {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, var(--accent-gold), #d97706);
            color: #0f172a;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }
        .login-card .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(245,158,11,0.3); }
        .login-card .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        /* ============================================
           APP LAYOUT
           ============================================ */
        #app {
            display: none;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: var(--bg-primary);
            position: fixed;
            inset: 0;
            z-index: 10;
        }
        #app:not(.hidden) { display: flex; }
        
        /* ============================================
           SIDEBAR (VERSIÓN MÓVIL SIMPLIFICADA)
           ============================================ */
        .sidebar {
            width: 60px;
            min-width: 60px;
            height: 100%;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 0.5rem 0.3rem;
            overflow-y: auto;
            flex-shrink: 0;
            z-index: 10;
        }
        
        .sidebar .brand { display: none; }
        .sidebar .restaurant-info { display: none; }
        
        .sidebar .menu-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
            padding: 0.5rem 0.3rem;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
            border: none;
            background: transparent;
            font-size: 0.6rem;
            font-weight: 500;
            flex-direction: column;
            margin-bottom: 0.15rem;
        }
        .sidebar .menu-item:hover {
            background: var(--bg-card);
            color: var(--text-primary);
        }
        .sidebar .menu-item.active {
            background: var(--accent-gold);
            color: #0f172a;
        }
        .sidebar .menu-item .icon { font-size: 1.2rem; }
        .sidebar .menu-item span:not(.icon) { display: none; }
        .sidebar .menu-item .badge { display: none; }
        .sidebar .menu-divider { 
            height: 1px; 
            background: var(--border-color); 
            margin: 0.3rem 0; 
        }
        .sidebar .menu-item.danger { color: var(--accent-red); }
        .sidebar .menu-item.danger:hover { background: rgba(239,68,68,0.15); }
        .font-controls { display: none !important; }
        
        /* ============================================
           CONTENIDO PRINCIPAL
           ============================================ */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-primary);
        }
        
        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.3rem 0.5rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            min-height: 40px;
        }
        
        .main-header .title-section .page-title {
            font-weight: 700;
            font-size: 0.7rem;
            color: var(--text-primary);
        }
        .main-header .title-section .page-title .highlight {
            color: var(--accent-gold);
        }
        
        .main-header .header-actions {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        
        #estado-restaurante {
            font-size: 0.5rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 50px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
        }
        
        .main-header .header-actions .btn-pausa {
            padding: 0.1rem 0.5rem;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            font-size: 0.6rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .main-header .header-actions .btn-pausa.active {
            background: var(--accent-red);
            color: white;
        }
        .main-header .header-actions .btn-pausa.inactive {
            background: var(--accent-green);
            color: white;
        }
        
        #estado-banner {
            display: none;
        }
        #estado-banner.active { display: block; }
        #estado-banner .banner-content {
            background: var(--accent-red);
            color: white;
            text-align: center;
            padding: 4px 8px;
            font-weight: 700;
            font-size: 0.6rem;
        }
        
        #pausa-banner {
            display: none;
            background: var(--accent-red);
            color: white;
            text-align: center;
            padding: 3px;
            font-weight: 600;
            font-size: 0.6rem;
            flex-shrink: 0;
        }
        
        /* ============================================
           STATS BAR
           ============================================ */
        .stats-bar {
            display: flex;
            gap: 0.3rem;
            padding: 0.2rem 0.5rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.2rem;
            padding: 0.1rem 0.4rem;
            background: var(--bg-card);
            border-radius: 50px;
            border: 1px solid var(--border-color);
        }
        .stat-item .icon { font-size: 0.6rem; }
        .stat-item .label { font-size: 0.5rem; color: var(--text-muted); }
        .stat-item .value { font-size: 0.65rem; font-weight: 700; min-width: 14px; text-align: center; }
        .stat-item .value.gold { color: var(--accent-gold); }
        .stat-item .value.blue { color: var(--accent-blue); }
        
        /* ============================================
           KANBAN - VERSIÓN MÓVIL
           ============================================ */
        .kanban-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding: 0.3rem;
            overflow-y: auto;
            background: var(--bg-primary);
            min-height: 0;
        }
        
        .kanban-column {
            flex: 1;
            min-height: 40vh;
            max-height: 45vh;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        
        .kanban-column .column-header {
            padding: 0.3rem 0.6rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            flex-shrink: 0;
            background: var(--bg-secondary);
        }
        .kanban-column .column-header .title {
            font-weight: 700;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .kanban-column .column-header .count {
            background: var(--bg-card);
            padding: 0.05rem 0.4rem;
            border-radius: 50px;
            font-size: 0.55rem;
            font-weight: 700;
        }
        
        .kanban-column.pending .column-header { border-bottom-color: var(--accent-gold); }
        .kanban-column.pending .column-header .title { color: var(--accent-gold); }
        
        .kanban-column.cooking .column-header { border-bottom-color: var(--accent-blue); }
        .kanban-column.cooking .column-header .title { color: var(--accent-blue); }
        
        .kanban-column .column-content {
            flex: 1;
            overflow-y: auto;
            padding: 0.3rem;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        
        /* ============================================
           TARJETAS DE PEDIDOS (VERSIÓN MÓVIL)
           ============================================ */
        .order-card {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 0.5rem;
            border: 1px solid var(--border-color);
            transition: var(--transition);
            flex-shrink: 0;
        }
        .order-card.delayed {
            border-left: 4px solid var(--accent-red);
            background: rgba(239,68,68,0.05);
        }
        
        .order-card .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.2rem;
        }
        
        .order-card .top .id {
            font-size: 0.8rem;
            font-weight: 900;
            font-family: 'Courier New', monospace;
            color: #0f172a;
            background: var(--accent-gold);
            padding: 0.05rem 0.5rem;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }
        .order-card .top .id.pendiente { background: #f59e0b; color: #0f172a; }
        .order-card .top .id.coccion { background: #3b82f6; color: white; }
        
        .order-card .top .time {
            font-size: 0.45rem;
            color: var(--text-muted);
        }
        
        .order-card .cliente {
            font-weight: 600;
            font-size: 0.7rem;
            color: var(--text-primary);
        }
        .order-card .direccion {
            font-size: 0.55rem;
            color: var(--text-secondary);
        }
        .order-card .telefono {
            font-size: 0.5rem;
            color: var(--text-muted);
        }
        
        .order-card .timer {
            display: flex;
            align-items: center;
            gap: 0.2rem;
            padding: 0.1rem 0.3rem;
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            margin: 0.2rem 0;
            font-size: 0.5rem;
            border: 1px solid var(--border-color);
        }
        .order-card .timer .label { color: var(--text-muted); }
        .order-card .timer .value { font-weight: 700; color: var(--accent-gold); }
        .order-card .timer .value.delayed { color: var(--accent-red); }
        
        .order-card .productos {
            display: flex;
            flex-wrap: wrap;
            gap: 0.2rem;
            margin: 0.2rem 0;
        }
        .order-card .productos span {
            background: var(--bg-secondary);
            padding: 0.05rem 0.3rem;
            border-radius: 50px;
            font-size: 0.45rem;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        
        .order-card .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.2rem;
            padding-top: 0.2rem;
            border-top: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 0.2rem;
        }
        .order-card .footer .precio {
            font-weight: 700;
            color: var(--accent-gold);
            font-size: 0.65rem;
        }
        .order-card .footer .badge-estado {
            font-size: 0.45rem;
            padding: 0.05rem 0.3rem;
            border-radius: 50px;
            font-weight: 600;
        }
        .order-card .footer .badge-estado.pending { background: rgba(245,158,11,0.15); color: var(--accent-gold); }
        .order-card .footer .badge-estado.cooking { background: rgba(59,130,246,0.15); color: var(--accent-blue); }
        
        .order-card .actions {
            display: flex;
            gap: 0.2rem;
            margin-top: 0.2rem;
            flex-wrap: wrap;
            width: 100%;
        }
        .order-card .actions .btn {
            padding: 0.15rem 0.4rem;
            border-radius: 50px;
            font-size: 0.5rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            flex: 1;
            min-width: 40px;
            text-align: center;
        }
        .order-card .actions .btn:hover { transform: scale(1.05); }
        .order-card .actions .btn-primary { background: var(--accent-gold); color: #0f172a; }
        .order-card .actions .btn-success { background: var(--accent-green); color: white; }
        .order-card .actions .btn-danger { background: var(--accent-red); color: white; }
        .order-card .actions .btn-secondary { background: var(--bg-secondary); color: var(--text-secondary); border: 1px solid var(--border-color); }
        
        /* ============================================
           VISTAS (Historial, Demoras, Ganancias)
           ============================================ */
        .view-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            overflow: hidden;
            margin: 0.3rem 0;
        }
        .view-container .view-header {
            padding: 0.3rem 0.6rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 0.3rem;
            background: var(--bg-secondary);
        }
        .view-container .view-header .title {
            font-weight: 700;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .view-container .view-header .filters {
            display: flex;
            gap: 0.3rem;
            flex-wrap: wrap;
            align-items: center;
        }
        .view-container .view-header .filters select,
        .view-container .view-header .filters button {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 0.1rem 0.4rem;
            color: var(--text-primary);
            font-size: 0.5rem;
            outline: none;
            cursor: pointer;
        }
        
        .view-container .view-content {
            flex: 1;
            overflow-y: auto;
            padding: 0.3rem 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        
        .view-container .view-content .empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            color: var(--text-muted);
            text-align: center;
        }
        .view-container .view-content .empty .icon { font-size: 1.5rem; margin-bottom: 0.3rem; }
        
        .ganancias-resumen {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.3rem;
            margin-bottom: 0.3rem;
        }
        .ganancias-resumen .resumen-card {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 0.3rem;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .ganancias-resumen .resumen-card .label {
            font-size: 0.45rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }
        .ganancias-resumen .resumen-card .value {
            font-size: 0.9rem;
            font-weight: 900;
        }
        .ganancias-resumen .resumen-card .value.gold { color: var(--accent-gold); }
        .ganancias-resumen .resumen-card .value.green { color: var(--accent-green); }
        .ganancias-resumen .resumen-card .value.blue { color: var(--accent-blue); }
        .ganancias-resumen .resumen-card .value.purple { color: var(--accent-purple); }
        .ganancias-resumen .resumen-card .value.red { color: var(--accent-red); }
        
        .ganancias-detalle .detalle-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.2rem 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.55rem;
        }
        .ganancias-detalle .detalle-item .cliente-nombre {
            font-weight: 600;
            color: var(--text-primary);
        }
        .ganancias-detalle .detalle-item .pedido-total {
            font-weight: 700;
            color: var(--accent-gold);
        }
        .ganancias-detalle .detalle-item .pedido-fecha {
            font-size: 0.45rem;
            color: var(--text-muted);
        }
        
        /* ============================================
           TOAST
           ============================================ */
        .toast {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            padding: 0.4rem 0.8rem;
            border-radius: var(--radius-sm);
            color: white;
            font-weight: 500;
            font-size: 0.65rem;
            box-shadow: var(--shadow);
            z-index: 999;
            animation: slideInToast 0.3s ease-out;
            max-width: 280px;
        }
        @keyframes slideInToast {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .toast-success { background: var(--accent-green); }
        .toast-error { background: var(--accent-red); }
        .toast-info { background: var(--accent-blue); }
        .toast-warning { background: var(--accent-gold); color: #0f172a; }
    </style>
</head>
<body>

    <!-- ============================================
    LOGIN
    ============================================ -->
    <div id="login-container">
        <div class="login-card">
            <div class="logo">
                <h1>🍳 Aguadulce Express</h1>
                <p>Panel de Cocina Móvil</p>
            </div>
            <form id="login-form" style="display:flex;flex-direction:column;gap:1rem;">
                <input type="email" id="login-email" placeholder="Email del restaurante" required>
                <input type="password" id="login-password" placeholder="Contraseña" required>
                <button type="submit" class="btn-login" id="login-btn">
                    <span id="login-text">Iniciar Sesión</span>
                    <span id="login-loading" style="display:none;">Cargando...</span>
                </button>
                <div id="login-error" style="color:var(--accent-red);font-size:0.7rem;text-align:center;display:none;"></div>
            </form>
        </div>
    </div>

    <!-- ============================================
    APP PRINCIPAL
    ============================================ -->
    <div id="app" class="hidden">
        
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            
            <button class="menu-item active" data-view="activos">
                <span class="icon">📋</span>
                <span>Pedidos</span>
                <span class="badge gold" id="sidebar-contador">0</span>
            </button>
            
            <button class="menu-item" data-view="historial">
                <span class="icon">📊</span>
                <span>Historial</span>
            </button>
            
            <button class="menu-item" data-view="demoras">
                <span class="icon">⏱️</span>
                <span>Demoras</span>
                <span class="badge red" id="sidebar-demoras">0</span>
            </button>
            
            <button class="menu-item" data-view="ganancias">

        <div class="main-content">

                        <span class="count" id="col-count-pendiente">0</span>
                    </div>
                    <div class="column-content" id="col-pendiente"></div>
                </div>
                
                <div class="kanban-column cooking" id="columna-coccion">
                    <div class="column-header">
                        <span class="title">👨‍🍳 Cocción</span>
                        <span class="count" id="col-count-coccion">0</span>

    <!-- ============================================
    JAVASCRIPT PRINCIPAL
    ============================================ -->
    <script>
        // ============================================
        // 1. CONFIGURACIÓN DE FIREBASE
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyBEapmpody3y_vFyPF0ngUnCn5ZFOtxPjs",
            authDomain: "aguadulce-express-v2.firebaseapp.com",
            databaseURL: "https://aguadulce-express-v2-default-rtdb.firebaseio.com",
            projectId: "aguadulce-express-v2",
            storageBucket: "aguadulce-express-v2.appspot.com",
            messagingSenderId: "103953800507",
            appId: "1:103953800507:web:tu_app_id"
        };

        // Esperar a que Firebase esté cargado
        function esperarFirebase() {
            return new Promise((resolve) => {
                if (typeof firebase !== 'undefined' && firebase.initializeApp) {
                    resolve();
                } else {
                    const checkInterval = setInterval(() => {
                        if (typeof firebase !== 'undefined' && firebase.initializeApp) {
                            clearInterval(checkInterval);
                            resolve();
                        }
                    }, 100);
                }
            });
        }

        // ============================================
        // 2. INICIALIZACIÓN PRINCIPAL
        // ============================================
        async function iniciarApp() {
            console.log('🚀 Iniciando app móvil...');
            
            // Esperar a que Firebase esté disponible
            await esperarFirebase();
            
            // Inicializar Firebase
            firebase.initializeApp(firebaseConfig);
            console.log('✅ Firebase inicializado');
            
            const auth = firebase.auth();
            const db = firebase.database();
            
            // ============================================
            // 3. VARIABLES GLOBALES
            // ============================================
            let currentUser = null;
            let currentView = 'activos';
            let restauranteId = null;
            let estaPausado = false;
            let pedidosListeners = [];
            const TIEMPO_ELABORACION_DEFAULT = 20;
            let tiempoElaboracionRestaurante = TIEMPO_ELABORACION_DEFAULT;
            let pedidosAnteriores = {};
            let sonidoActivo = false;
            let intervaloSonido = null;
            let pedidoSonando = null;
            
            // ============================================
            // 4. FUNCIONES UTILITARIAS
            // ============================================
            function showToast(message, type = 'info') {
                const toast = document.createElement('div');
                toast.className = `toast toast-${type}`;
                toast.textContent = message;
                document.body.appendChild(toast);
                setTimeout(() => { 
                    toast.style.opacity = '0'; 
                    toast.style.transform = 'translateY(20px)'; 
                    setTimeout(() => toast.remove(), 300); 
                }, 3000);
            }

            function escapeHTML(str) { 
                if (!str) return ''; 
                return str.replace(/[&<>"]/g, function(m) { 
                    if (m === '&') return '&amp;'; 
                    if (m === '<') return '&lt;'; 
                    if (m === '>') return '&gt;'; 
                    if (m === '"') return '&quot;'; 
                    return m; 
                }); 
            }

            function setText(id, value) {
                const el = document.getElementById(id);
                if (el) { el.textContent = value; }
            }
            
            // ============================================
            // 5. AUTENTICACIÓN
            // ============================================
            const loginForm = document.getElementById('login-form');
            const loginEmail = document.getElementById('login-email');
            const loginPassword = document.getElementById('login-password');
            const loginBtn = document.getElementById('login-btn');
            const loginText = document.getElementById('login-text');
            const loginLoading = document.getElementById('login-loading');
            const loginError = document.getElementById('login-error');

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = loginEmail.value.trim();
                const password = loginPassword.value;
                if (!email || !password) { 
                    loginError.textContent = 'Completa todos los campos'; 
                    loginError.style.display = 'block'; 
                    return; 
                }
                loginBtn.disabled = true;
                loginText.style.display = 'none';
                loginLoading.style.display = 'inline';
                loginError.style.display = 'none';
                try {
                    const credenciales = await auth.signInWithEmailAndPassword(email, password);
                    const user = credenciales.user;
                    const snapshot = await db.ref(`restaurantes/${user.uid}`).once('value');
                    if (!snapshot.exists()) { 
                        await auth.signOut(); 
                        throw new Error('Esta cuenta no es un restaurante válido'); 
                    }
                    showToast('✅ Bienvenido al panel de cocina móvil', 'success');
                } catch (error) {
                    console.error('Error de login:', error);
                    loginError.textContent = error.message;
                    loginError.style.display = 'block';
                    loginBtn.disabled = false;
                    loginText.style.display = 'inline';
                    loginLoading.style.display = 'none';
                }
            });

            // ============================================
            // 6. ESTADO DE AUTENTICACIÓN
            // ============================================
            auth.onAuthStateChanged(async (user) => {
                const app = document.getElementById('app');
                const loginContainer = document.getElementById('login-container');
                if (user) {
                    console.log('✅ Usuario autenticado:', user.uid);
                    currentUser = user;
                    restauranteId = user.uid;
                    loginContainer.classList.add('hidden');
                    app.classList.remove('hidden');
                    
                    await cargarDatosRestaurante();
                    await cargarEstadoPausa();
                    await cargarTiempoElaboracion();
                    
                    await mostrarEstadoRestaurante();
                    
                    db.ref(`restaurantes/${restauranteId}/pausado`).on('value', () => {
                        mostrarEstadoRestaurante();
                    });
                    db.ref(`restaurantes/${restauranteId}/horarios_dias`).on('value', () => {
                        mostrarEstadoRestaurante();
                    });
                    
                    escucharPedidos();
                    setTimeout(() => renderizarVista(), 500);
                } else {
                    console.log('❌ Sin usuario autenticado');
                    app.classList.add('hidden');
                    loginContainer.classList.remove('hidden');
                    pedidosListeners.forEach(ref => { try { ref.off(); } catch(e) {} });
                    pedidosListeners = [];
                }
            });

            // ============================================
            // 7. CERRAR SESIÓN
            // ============================================
            document.getElementById('btn-cerrar-sesion').addEventListener('click', async () => {
                if (confirm('¿Seguro que quieres cerrar sesión?')) {
                    await auth.signOut();
                    showToast('👋 Sesión cerrada', 'info');
                }
            });

            // ============================================
            // 8. FUNCIONES DE CARGA
            // ============================================
            async function cargarDatosRestaurante() {
                try {
                    const snapshot = await db.ref(`restaurantes/${restauranteId}`).once('value');
                    const data = snapshot.val();
                    if (data) {
                        const nombre = data.NOMBRE_RESTAURANTE || data.nombre || 'Restaurante';
                        document.getElementById('sidebar-restaurante').textContent = nombre;
                    }
                } catch (error) { console.error('Error al cargar restaurante:', error); }
            }

            async function cargarTiempoElaboracion() {
                try {
                    const snapshot = await db.ref(`restaurantes/${restauranteId}/tiempo_elaboracion`).once('value');
                    tiempoElaboracionRestaurante = snapshot.val() || TIEMPO_ELABORACION_DEFAULT;
                    console.log(`⏱️ Tiempo de elaboración: ${tiempoElaboracionRestaurante} minutos`);
                } catch (error) {
                    tiempoElaboracionRestaurante = TIEMPO_ELABORACION_DEFAULT;
                }
            }

            async function cargarEstadoPausa() {
                try {
                    const snapshot = await db.ref(`restaurantes/${restauranteId}/pausado`).once('value');
                    estaPausado = snapshot.val() === true;
                    actualizarUIEstadoPausa();
                } catch (error) { console.error('Error al cargar estado de pausa:', error); }
            }

            function actualizarUIEstadoPausa() {
                const banner = document.getElementById('pausa-banner');
                const btnHeader = document.getElementById('btn-pausa-header');
                const btnSidebar = document.getElementById('btn-pausa-sidebar');
                const iconoPausa = document.getElementById('icono-pausa');
                const textoPausa = document.getElementById('texto-pausa');

                if (estaPausado) {
                    if (banner) banner.style.display = 'block';
                    if (btnHeader) { btnHeader.className = 'btn-pausa active'; btnHeader.textContent = '▶️'; }
                    if (iconoPausa) iconoPausa.textContent = '▶️';
                    if (textoPausa) textoPausa.textContent = 'Reanudar';
                } else {
                    if (banner) banner.style.display = 'none';
                    if (btnHeader) { btnHeader.className = 'btn-pausa inactive'; btnHeader.textContent = '⏸️'; }
                    if (iconoPausa) iconoPausa.textContent = '⏸️';
                    if (textoPausa) textoPausa.textContent = 'Pausar';
                }
            }

            window.togglePausa = async function() {
                try {
                    const nuevoEstado = !estaPausado;
                    await db.ref(`restaurantes/${restauranteId}/pausado`).set(nuevoEstado);
                    estaPausado = nuevoEstado;
                    actualizarUIEstadoPausa();
                    showToast(estaPausado ? '⏸️ Restaurante en PAUSA' : '▶️ Restaurante ACTIVO', estaPausado ? 'warning' : 'success');
                } catch (error) {
                    console.error('Error al cambiar estado de pausa:', error);
                    showToast('❌ Error al cambiar estado de pausa', 'error');
                }
            };

            // ============================================
            // 9. ESCUCHAR PEDIDOS
            // ============================================
            function escucharPedidos() {
                pedidosListeners.forEach(ref => { try { ref.off(); } catch(e) {} });
                pedidosListeners = [];
                const pedidosRef = db.ref('pedidos');
                
                let idsProcesados = new Set();
                
                pedidosRef.on('value', async (snapshot) => {
                    const estado = await verificarEstadoRestaurante();
                    
                    if (!estado.abierto && currentView === 'activos') {
                        mostrarMensajeCerrado();
                        actualizarContadores(0, 0);
                        return;
                    }
                    
                    const pedidos = snapshot.val() || {};
                    const pedidosActuales = {};
                    
                    idsProcesados = new Set();
                    
                    for (const [id, data] of Object.entries(pedidos)) {
                        pedidosActuales[id] = data;
                    }
                    
                    const nuevosPedidos = [];
                    for (const [id, data] of Object.entries(pedidosActuales)) {
                        if (!pedidosAnteriores[id]) {
                            const restId = data.restauranteId || data.restaurante_id || data.uid_restaurante;
                            if (restId === restauranteId) nuevosPedidos.push({ id, ...data });
                        }
                    }
                    if (nuevosPedidos.length > 0) {
                        console.log(`🔔 ${nuevosPedidos.length} nuevo(s) pedido(s)`);
                        for (const pedido of nuevosPedidos) {
                            const cliente = pedido.cliente_nombre || pedido.clienteNombre || 'Cliente';
                            showToast(`📦 Nuevo pedido de ${cliente}`, 'info');
                            const estadoPedido = pedido.estado ? pedido.estado.toLowerCase() : '';
                            if (estadoPedido === 'recibido' || estadoPedido === 'pendiente') {
                                if (!sonidoActivo) iniciarSonidoRepetido(pedido.id);
                            }
                        }
                    }
                    pedidosAnteriores = pedidosActuales;
                    if (currentView === 'activos') renderizarVista();
                    else actualizarContadoresDesdePedidos(pedidosActuales);
                });
                pedidosListeners.push(pedidosRef);
                console.log('✅ Listener de pedidos activado');
            }

            // ============================================
            // 10. SONIDO
            // ============================================
            function reproducirSonidoLlegada() {
                try {
                    const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
                    audio.volume = 0.9;
                    audio.play().catch(e => console.log('⚠️ Sonido bloqueado'));
                    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                } catch (error) { console.log('⚠️ Error al reproducir sonido:', error); }
            }

            function iniciarSonidoRepetido(pedidoId) {
                if (pedidoSonando === pedidoId || sonidoActivo) return;
                sonidoActivo = true;
                pedidoSonando = pedidoId;
                let repeticiones = 0;
                if (intervaloSonido) clearInterval(intervaloSonido);
                reproducirSonidoLlegada();
                intervaloSonido = setInterval(() => {
                    repeticiones++;
                    db.ref(`pedidos/${pedidoId}/estado`).once('value').then((snap) => {
                        const estado = snap.val() ? snap.val().toLowerCase() : '';
                        if (estado !== 'recibido' && estado !== 'pendiente') { detenerSonidoRepetido(); return; }
                    }).catch(() => {});
                    if (repeticiones >= 30) detenerSonidoRepetido();
                    else reproducirSonidoLlegada();
                }, 3000);
            }

            function detenerSonidoRepetido() {
                if (intervaloSonido) { clearInterval(intervaloSonido); intervaloSonido = null; }
                sonidoActivo = false;
                pedidoSonando = null;
            }

            // ============================================
            // 11. CONTADORES
            // ============================================
            function actualizarContadoresDesdePedidos(pedidos) {
                let pendiente = 0, coccion = 0;
                for (const [id, data] of Object.entries(pedidos)) {
                    const restId = data.restauranteId || data.restaurante_id || data.uid_restaurante;
                    if (restId !== restauranteId) continue;
                    let estado = data.estado ? data.estado.toLowerCase() : '';
                    if (estado === 'recibido') estado = 'pendiente';
                    if (estado === 'pendiente') pendiente++;
                    else if (estado === 'coccion') coccion++;
                }
                actualizarContadores(pendiente, coccion);
            }

            function actualizarContadores(pendiente, coccion) {
                setText('count-pendiente', pendiente);
                setText('count-coccion', coccion);
                setText('col-count-pendiente', pendiente);
                setText('col-count-coccion', coccion);
                setText('sidebar-contador', pendiente + coccion);
            }

            // ============================================
            // 12. RENDERIZAR VISTA
            // ============================================
            function renderizarVista() {
                console.log('🔄 Renderizando vista:', currentView);
                const title = document.getElementById('page-title');
                
                if (currentView === 'historial') {
                    if (title) title.innerHTML = '📊 <span class="highlight">Historial</span>';
                    mostrarVistaHistorial();
                    return;
                }
                if (currentView === 'demoras') {
                    if (title) title.innerHTML = '⏱️ <span class="highlight">Demoras</span>';
                    mostrarVistaDemoras();
                    return;
                }
                if (currentView === 'ganancias') {
                    if (title) title.innerHTML = '💰 <span class="highlight">Ganancias</span>';
                    mostrarVistaGanancias();
                    return;
                }
                if (title) title.innerHTML = '📋 <span class="highlight">Pedidos</span>';
                restaurarVistaColumnas();
            }

            // ============================================
            // 13. COLUMNAS
            // ============================================
            function restaurarVistaColumnas() {
                const container = document.getElementById('kanban-container');
                if (!container) return;
                
                container.innerHTML = `
                    <div class="kanban-column pending" id="columna-pendiente">
                        <div class="column-header">
                            <span class="title">📥 Entrada</span>
                            <span class="count" id="col-count-pendiente">0</span>
                        </div>
                        <div class="column-content" id="col-pendiente"></div>
                    </div>
                    <div class="kanban-column cooking" id="columna-coccion">
                        <div class="column-header">
                            <span class="title">👨‍🍳 Cocción</span>
                            <span class="count" id="col-count-coccion">0</span>
                        </div>
                        <div class="column-content" id="col-coccion"></div>
                    </div>
                `;
                
                actualizarContadores(0, 0);
                cargarPedidosActivos();
            }

            function cargarPedidosActivos() {
                const colPendiente = document.getElementById('col-pendiente');
                const colCoccion = document.getElementById('col-coccion');
                
                if (!colPendiente || !colCoccion) {
                    restaurarVistaColumnas();
                    return;
                }
                
                colPendiente.innerHTML = '';
                colCoccion.innerHTML = '';
                
                db.ref('pedidos').once('value').then((snapshot) => {
                    const pedidos = snapshot.val();
                    let pendiente = 0, coccion = 0;
                    
                    if (!pedidos) {
                        mostrarMensajeVacio('col-pendiente', '📥', 'No hay pedidos');
                        mostrarMensajeVacio('col-coccion', '👨‍🍳', 'No hay pedidos');
                        actualizarContadores(0, 0);
                        return;
                    }
                    
                    const idsProcesados = new Set();
                    
                    for (const [id, data] of Object.entries(pedidos)) {
                        const restId = data.restauranteId || data.restaurante_id || data.uid_restaurante;
                        if (restId !== restauranteId) continue;
                        
                        if (idsProcesados.has(id)) continue;
                        idsProcesados.add(id);
                        
                        let estado = data.estado ? data.estado.toLowerCase() : '';
                        if (estado === 'recibido') estado = 'pendiente';
                        
                        if (estado === 'pendiente') {
                            pendiente++;
                            agregarPedidoAColumna(id, { ...data, estado });
                        } else if (estado === 'coccion') {
                            coccion++;
                            agregarPedidoAColumna(id, { ...data, estado });
                        }
                    }
                    
                    if (pendiente === 0) mostrarMensajeVacio('col-pendiente', '📥', 'No hay pedidos');
                    if (coccion === 0) mostrarMensajeVacio('col-coccion', '👨‍🍳', 'No hay pedidos');
                    
                    actualizarContadores(pendiente, coccion);
                    console.log(`✅ Pedidos: ${pendiente} entrada, ${coccion} cocción`);
                }).catch((error) => {
                    console.error('Error al cargar pedidos:', error);
                });
            }

            // ============================================
            // 14. AGREGAR PEDIDO A COLUMNA
            // ============================================
            function agregarPedidoAColumna(id, data) {
                let estado = data.estado || 'pendiente';
                if (estado === 'recibido') estado = 'pendiente';
                
                let columnaId = estado === 'pendiente' ? 'col-pendiente' : 'col-coccion';
                const container = document.getElementById(columnaId);
                if (!container) return;

                const clienteNombre = data.cliente_nombre || data.clienteNombre || 'Cliente';
                const telefono = data.cliente_telefono || data.telefono || 'Sin teléfono';
                const direccion = data.direccion || 'Sin dirección';
                const idPedido = data.id_pedido || data.id || id.substring(0, 8);
                const total = data.total || 0;
                const timestamp = data.timestamp ? new Date(data.timestamp).toLocaleTimeString() : '';

                const tiempoInicio = data.timestamp_inicio || data.timestamp || Date.now();
                const tiempoActual = Date.now();
                const tiempoTranscurrido = Math.floor((tiempoActual - tiempoInicio) / 60000);
                const tiempoLimite = data.tiempo_limite || tiempoElaboracionRestaurante || TIEMPO_ELABORACION_DEFAULT;
                const tiempoRestante = Math.max(0, tiempoLimite - tiempoTranscurrido);
                const enDemora = tiempoTranscurrido > tiempoLimite;

                let tiempoDisplay = '', badgeDemora = '';
                let idClass = estado === 'pendiente' ? 'pendiente' : 'coccion';
                
                if (estado === 'pendiente') {
                    tiempoDisplay = '⏳ Esperando';
                } else if (estado === 'coccion') {
                    if (enDemora) {
                        tiempoDisplay = `⏱️ ${tiempoTranscurrido} min DEMORA`;
                        badgeDemora = `<span style="background:var(--accent-red);color:white;padding:1px 4px;border-radius:9999px;font-size:7px;font-weight:700;">🔴</span>`;
                    } else {
                        tiempoDisplay = `⏱️ ${tiempoTranscurrido} min (${tiempoRestante})`;
                    }
                }

                let productosHtml = '';
                if (data.items && data.items.length > 0) {
                    productosHtml = data.items.slice(0, 3).map(item => 
                        `<span>${item.cantidad || 1}x ${item.nombre}</span>`
                    ).join('');
                    if (data.items.length > 3) {
                        productosHtml += `<span style="font-size:0.4rem;color:var(--text-muted);">+${data.items.length-3}</span>`;
                    }
                } else {
                    productosHtml = '<span>Sin productos</span>';
                }

                let botones = '';
                if (estado === 'pendiente') {
                    botones = `
                        <button class="btn btn-success" onclick="aceptarPedido('${id}')">✅</button>
                        <button class="btn btn-danger" onclick="rechazarPedido('${id}')">❌</button>
                    `;
                } else if (estado === 'coccion') {
                    botones = `
                        <button class="btn btn-success" onclick="marcarListo('${id}')">✅</button>
                        <button class="btn btn-secondary" onclick="verDetallePedido('${id}')">📋</button>
                    `;
                }

                const card = document.createElement('div');
                card.className = `order-card${enDemora && estado === 'coccion' ? ' delayed' : ''}`;
                card.innerHTML = `
                    <div class="top">
                        <span class="id ${idClass}">#${idPedido}</span>
                        <span class="time">${timestamp}</span>
                    </div>
                    <div class="cliente">${escapeHTML(clienteNombre)}</div>
                    <div class="direccion">${escapeHTML(direccion)}</div>
                    <div class="telefono">📞 ${escapeHTML(telefono)}</div>
                    <div class="timer">
                        <span class="label">${estado === 'coccion' ? '⏱️' : '📌'}</span>

            // ============================================
            // 15. VERIFICAR ESTADO DEL RESTAURANTE
            // ============================================
            async function verificarEstadoRestaurante() {
                try {
                    const snapshot = await db.ref(`restaurantes/${restauranteId}`).once('value');
                    const data = snapshot.val();
                    
                    if (!data) {
                        return { abierto: false, motivo: 'Restaurante no encontrado', horario: '' };
                    }
                    
                    if (data.activo === false) {
                        return { abierto: false, motivo: '🚫 Desactivado', horario: '' };
                    }
                    
                    if (data.pausado === true) {
                        return { abierto: false, motivo: '⏸️ En pausa', horario: '' };
                    }
                    
                    const horarios = data.horarios_dias;
                    if (!horarios) {
                        return { abierto: false, motivo: '📅 Sin horarios', horario: '' };
                    }
                    
                    const ahora = new Date();
                    const diasSemana = ['DOMINGO', 'LUNES', 'MARTES', 'MIERCOLES', 'JUEVES', 'VIERNES', 'SABADO'];
                    const hoy = diasSemana[ahora.getDay()];
                    const horarioHoy = horarios[hoy];
                    
                    if (!horarioHoy || horarioHoy.dia_libre === true || horarioHoy.activo === false) {
                        return { abierto: false, motivo: '📅 Cerrado hoy', horario: '' };
                    }
                    
                    const horaActual = ahora.getHours() + ahora.getMinutes() / 60;
                    
                    function conv(h) {
                        if (!h || h === 'CERRADO') return null;
                        const [hh, mm] = h.split(':');
                        return parseInt(hh) + parseInt(mm) / 60;
                    }
                    
                    const a1 = conv(horarioHoy.apertura1);
                    const c1 = conv(horarioHoy.cierre1);
                    const a2 = conv(horarioHoy.apertura2);
                    const c2 = conv(horarioHoy.cierre2);
                    
                    let abierto = false;
                    let horarioTexto = '';
                    
                    if (a1 !== null && c1 !== null) {
                        if (horaActual >= a1 && horaActual < c1) abierto = true;
                        horarioTexto = `${horarioHoy.apertura1}-${horarioHoy.cierre1}`;
                    }
                    
                    if (a2 !== null && c2 !== null) {
                        if (horaActual >= a2 && horaActual < c2) abierto = true;
                        if (horarioTexto) horarioTexto += ` / `;
                        horarioTexto += `${horarioHoy.apertura2}-${horarioHoy.cierre2}`;
                    }
                    
                    if (!horarioTexto) {
                        return { abierto: false, motivo: '📅 Sin horario', horario: '' };
                    }
                    
                    return {
                        abierto: abierto,
                        motivo: abierto ? `✅ Abierto` : `🔴 Cerrado`,
                        horario: horarioTexto
                    };
                    
                } catch (error) {
                    console.error('❌ Error verificando estado:', error);
                    return { abierto: false, motivo: '❌ Error', horario: '' };
                }
            }

                    fechaInicio.setHours(0, 0, 0, 0);
                    
                    let totalPedidos = 0;
                    let totalVentas = 0;
                    
                    for (const [id, data] of Object.entries(pedidos)) {
                        const restId = data.restauranteId || data.restaurante_id || data.uid_restaurante;
                        if (restId !== restauranteId) continue;
                        
                        const fecha = new Date(data.fecha || data.timestamp || 0);
                        if (fecha < fechaInicio) continue;
                        
                        if (data.estado === 'ENTREGADO' || data.estado === 'LISTO') {
                            totalPedidos++;
                            totalVentas += data.total || 0;
                        }
                    }
                    
                    content.innerHTML = `
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
                            <div style="background:var(--bg-card);border-radius:8px;padding:8px;text-align:center;border:1px solid var(--border-color);">
                                <div style="font-size:9px;color:var(--text-muted);">📦 Pedidos</div>
                                <div style="font-size:18px;font-weight:900;color:var(--accent-gold);">${totalPedidos}</div>
                            </div>
                            <div style="background:var(--bg-card);border-radius:8px;padding:8px;text-align:center;border:1px solid var(--border-color);">
                                <div style="font-size:9px;color:var(--text-muted);">💰 Ventas</div>
                                <div style="font-size:18px;font-weight:900;color:var(--accent-green);">${totalVentas.toFixed(2)}€</div>
                            </div>
                        </div>
                        <div style="font-size:9px;color:var(--text-muted);text-align:center;">Últimos 7 días</div>
                    `;
                });
            }

            // ============================================
            // 22. MENÚ NAVEGACIÓN
            // ============================================
            document.querySelectorAll('.menu-item[data-view]').forEach(item => {
                item.addEventListener('click', function(e) {
                    e.preventDefault();
                    const view = this.dataset.view;
                    console.log('📌 Menú click:', view);
                    
                    document.querySelectorAll('.menu-item[data-view]').forEach(el => {
                        el.classList.remove('active');
                    });
                    this.classList.add('active');
                    
                    currentView = view;
                    renderizarVista();
                });
            });

            // ============================================
            // 23. INICIO
            // ============================================
            console.log('✅ App móvil lista');
            console.log('📱 Versión para tableta');
        }

        // ============================================
        // INICIAR LA APP
        // ============================================
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', iniciarApp);
        } else {
            iniciarApp();
        }
    </script>

</body>
</html>
