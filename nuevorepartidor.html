<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aguadulce Express - Repartidor</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #020617; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        .card-pedido { 
            background: #0f172a; 
            border: 1px solid #1e293b; 
            border-radius: 20px; 
            padding: 16px; 
            margin-bottom: 12px; 
            transition: all 0.2s; 
        }
        .card-pedido:hover { transform: translateY(-2px); border-color: #06b6d4; }
        
        .badge-pendiente { background: rgba(245,158,11,0.2); color: #f59e0b; }
        .badge-asignado { background: rgba(6,182,212,0.2); color: #06b6d4; }
        .badge-camino { background: rgba(139,92,246,0.2); color: #8b5cf6; }
        .badge-entregado { background: rgba(34,197,94,0.2); color: #22c55e; }
        
        .stats-card { 
            background: linear-gradient(135deg, #0f172a 0%, #0a0f1a 100%); 
            border: 1px solid #1e293b; 
            border-radius: 20px; 
            padding: 12px 16px; 
        }
        .stats-number { font-size: 28px; font-weight: 800; }
        
        .btn-accion { transition: all 0.1s; cursor: pointer; }
        .btn-accion:active { transform: scale(0.95); }
        
        .tab-btn.active { background: #06b6d4; color: black; }
        
        .menu-icono { 
            position: fixed; 
            bottom: 20px; 
            right: 20px; 
            background: #06b6d4; 
            width: 55px; 
            height: 55px; 
            border-radius: 30px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            box-shadow: 0 0 20px rgba(6,182,212,0.5);
            z-index: 100;
        }
        
        .menu-flotante { 
            position: fixed; 
            bottom: 85px; 
            right: 20px; 
            background: #0f172a; 
            border-radius: 20px; 
            padding: 10px; 
            display: none; 
            flex-direction: column; 
            gap: 8px; 
            z-index: 99;
            border: 1px solid #1e293b;
        }
        .menu-flotante button { 
            background: #1e293b; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 15px; 
            color: white; 
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
        }
        .menu-flotante button:hover { background: #06b6d4; color: black; }
    </style>
</head>
<body>

<!-- Pantalla de Login -->
<div id="loginScreen" class="min-h-screen flex flex-col items-center justify-center p-5">
    <div class="text-center mb-8">
        <div class="text-6xl mb-4">🛵</div>
        <h1 class="text-3xl font-black italic uppercase text-cyan-400">Aguadulce</h1>
        <p class="text-white/50 text-xs mt-2">Área de Repartidores</p>
    </div>
    <div class="bg-slate-800/50 backdrop-blur rounded-2xl p-6 w-full max-w-sm">
        <p class="text-white/50 text-xs mb-4 text-center">🔐 INGRESA TUS CREDENCIALES</p>
        <input type="text" id="repartidorNombre" placeholder="Nombre del repartidor" class="w-full p-3 rounded-xl bg-slate-700 border border-slate-600 mb-3">
        <input type="password" id="repartidorPass" placeholder="Contraseña" class="w-full p-3 rounded-xl bg-slate-700 border border-slate-600 mb-4">
        <button onclick="loginRepartidor()" class="w-full bg-cyan-400 text-black font-black py-3 rounded-xl uppercase italic">Ingresar</button>
        <p class="text-center text-white/30 text-xs mt-4">Usa el nombre y contraseña que te dio el administrador</p>
    </div>
</div>

<!-- Dashboard Principal -->
<div id="dashboardPanel" class="hidden min-h-screen pb-24">
    <!-- Header -->
    <div class="bg-gradient-to-r from-cyan-500/20 to-transparent p-5">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black uppercase italic text-white">🛵 Repartidor</h1>
                <p id="repartidorNombreDisplay" class="text-cyan-400 text-xs font-bold mt-1">CARGANDO...</p>
            </div>
            <button onclick="logoutRepartidor()" class="bg-red-600/20 text-red-400 px-4 py-2 rounded-xl text-sm font-bold">🚪 Salir</button>
        </div>
    </div>

    <!-- Estadísticas -->
    <div class="p-4">
        <div class="grid grid-cols-3 gap-3 mb-6">
            <div class="stats-card text-center">
                <div class="text-[10px] text-white/40 uppercase">📦 Por Recoger</div>
                <div class="stats-number text-cyan-400" id="totalPorRecoger">0</div>
            </div>
            <div class="stats-card text-center">
                <div class="text-[10px] text-white/40 uppercase">🛵 En Camino</div>
                <div class="stats-number text-purple-400" id="totalEnCamino">0</div>
            </div>
            <div class="stats-card text-center">
                <div class="text-[10px] text-white/40 uppercase">💰 Ganancias Hoy</div>
                <div class="stats-number text-emerald-400" id="totalGanadoHoy">0</div>
            </div>
        </div>

        <!-- Filtros -->
        <div class="flex gap-2 mb-4 border-b border-white/10 pb-3 overflow-x-auto">
            <button onclick="filtrarPedidos('todos')" id="filtro-todos" class="tab-btn active bg-cyan-400 text-black px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap">📋 Todos</button>
            <button onclick="filtrarPedidos('porrecoger')" id="filtro-porrecoger" class="tab-btn bg-white/5 text-white/70 px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap">📦 Por Recoger</button>
            <button onclick="filtrarPedidos('encamino')" id="filtro-encamino" class="tab-btn bg-white/5 text-white/70 px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap">🛵 En Camino</button>
            <button onclick="filtrarPedidos('entregado')" id="filtro-entregado" class="tab-btn bg-white/5 text-white/70 px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap">✅ Entregados</button>
        </div>

        <!-- Lista de Pedidos -->
        <div id="listaPedidos" class="space-y-3"></div>
        
        <!-- Mensaje cuando no hay pedidos -->
        <div id="noPedidosMsg" class="text-center text-white/50 p-10 hidden">
            <div class="text-5xl mb-3">📭</div>
            <p>No hay pedidos en esta categoría</p>
        </div>
    </div>
</div>

<!-- Menú Flotante -->
<div class="menu-icono" onclick="toggleMenuFlotante()">
    <span class="text-2xl">☰</span>
</div>
<div id="menuFlotante" class="menu-flotante">
    <button onclick="verMiHistorial()">📜 Mi Historial</button>
    <button onclick="verEstadisticas()">📊 Mis Estadísticas</button>
    <button onclick="reportarProblema()">⚠️ Reportar Problema</button>
    <button onclick="contactarSoporte()">📞 Contactar Soporte</button>
</div>

<script>
    // ==================== CONFIGURACIÓN FIREBASE ====================
    const firebaseConfig = {
        apiKey: "AIzaSyCJcLQ0ikUwZSV7L_8mLLax8B5qnhP0Roc",
        authDomain: "aguadulce-notificaciones.firebaseapp.com",
        databaseURL: "https://aguadulce-notificaciones-default-rtdb.firebaseio.com",
        projectId: "aguadulce-notificaciones",
        storageBucket: "aguadulce-notificaciones.firebasestorage.app",
    };
    
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    
    // ==================== VARIABLES ====================
    let repartidorActual = null;
    let pedidosListener = null;
    let filtroActual = 'todos';
    let audioNotif = null;
    
    // ==================== FUNCIONES DE SONIDO ====================
    function initAudio() {
        audioNotif = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
        audioNotif.volume = 0.8;
    }
    
    function playSound() {
        if (audioNotif) {
            audioNotif.play().catch(e => console.log("Sonido no disponible"));
        }
    }
    
    // ==================== AUTENTICACIÓN ====================
    async function loginRepartidor() {
        const nombre = document.getElementById('repartidorNombre').value.trim();
        const password = document.getElementById('repartidorPass').value;
        
        if (!nombre || !password) {
            Swal.fire({ title: 'Error', text: 'Ingresa nombre y contraseña', icon: 'error', background: '#0f172a', color: 'white' });
            return;
        }
        
        const snapshot = await database.ref('repartidores').once('value');
        const repartidores = snapshot.val() || {};
        
        let encontrado = null;
        for (const [id, data] of Object.entries(repartidores)) {
            if (data.nombre === nombre && data.password === password && data.activo !== false) {
                encontrado = { id, ...data };
                break;
            }
        }
        
        if (encontrado) {
            repartidorActual = encontrado;
            localStorage.setItem('repartidor_actual', JSON.stringify(repartidorActual));
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboardPanel').classList.remove('hidden');
            document.getElementById('repartidorNombreDisplay').innerText = repartidorActual.nombre;
            initAudio();
            iniciarEscuchaPedidos();
            cargarReporteDiario();
        } else {
            Swal.fire({ title: 'Error', text: 'Credenciales incorrectas', icon: 'error', background: '#0f172a', color: 'white' });
        }
    }
    
    function logoutRepartidor() {
        if (pedidosListener) pedidosListener.off();
        repartidorActual = null;
        localStorage.removeItem('repartidor_actual');
        document.getElementById('dashboardPanel').classList.add('hidden');
        document.getElementById('loginScreen').classList.remove('hidden');
        document.getElementById('repartidorNombre').value = '';
        document.getElementById('repartidorPass').value = '';
    }
    
    // Verificar sesión guardada
    const saved = localStorage.getItem('repartidor_actual');
    if (saved) {
        repartidorActual = JSON.parse(saved);
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('dashboardPanel').classList.remove('hidden');
        document.getElementById('repartidorNombreDisplay').innerText = repartidorActual.nombre;
        initAudio();
        iniciarEscuchaPedidos();
        cargarReporteDiario();
    }
    
    // ==================== ESCUCHAR PEDIDOS ====================
    function iniciarEscuchaPedidos() {
        if (pedidosListener) pedidosListener.off();
        
        pedidosListener = database.ref('pedidos').on('value', (snapshot) => {
            const todosPedidos = snapshot.val() || {};
            const misPedidos = [];
            let nuevosPedidos = false;
            
            for (const [id, data] of Object.entries(todosPedidos)) {
                if (data.repartidor_asignado === repartidorActual.nombre) {
                    misPedidos.push({ id, ...data });
                    if (data.estado === 'LISTO' && data.recien_asignado) nuevosPedidos = true;
                }
            }
            
            misPedidos.sort((a, b) => (b.fecha || 0) - (a.fecha || 0));
            renderizarPedidos(misPedidos);
            actualizarContadores(misPedidos);
            
            if (nuevosPedidos) {
                playSound();
                Swal.fire({ title: '📦 Nuevo pedido', text: 'Tienes un nuevo pedido para recoger', icon: 'info', timer: 3000, showConfirmButton: false, background: '#0f172a', color: 'white' });
            }
        });
    }
    
    function actualizarContadores(pedidos) {
        const porRecoger = pedidos.filter(p => p.estado === 'LISTO' || p.estado === 'listo').length;
        const enCamino = pedidos.filter(p => p.estado === 'EN CAMINO' || p.estado === 'encamino').length;
        
        document.getElementById('totalPorRecoger').innerText = porRecoger;
        document.getElementById('totalEnCamino').innerText = enCamino;
    }
    
    async function cargarReporteDiario() {
        const hoy = new Date().toDateString();
        const snapshot = await database.ref(`repartidores_reportes/${repartidorActual.nombre.replace(/ /g, '_')}/${hoy}`).once('value');
        const reporte = snapshot.val();
        
        if (reporte) {
            document.getElementById('totalGanadoHoy').innerHTML = (reporte.total_ganado || 0).toFixed(2);
        } else {
            document.getElementById('totalGanadoHoy').innerHTML = '0.00';
        }
    }
    
    function filtrarPedidos(filtro) {
        filtroActual = filtro;
        
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('active', 'bg-cyan-400', 'text-black');
            btn.classList.add('bg-white/5', 'text-white/70');
        });
        
        const btnId = `filtro-${filtro}`;
        const btnActivo = document.getElementById(btnId);
        if (btnActivo) {
            btnActivo.classList.remove('bg-white/5', 'text-white/70');
            btnActivo.classList.add('active', 'bg-cyan-400', 'text-black');
        }
        
        if (pedidosListener) {
            pedidosListener.off();
            iniciarEscuchaPedidos();
        }
    }
    
    function renderizarPedidos(pedidos) {
        let pedidosFiltrados = pedidos;
        
        if (filtroActual === 'porrecoger') {
            pedidosFiltrados = pedidos.filter(p => p.estado === 'LISTO' || p.estado === 'listo');
        } else if (filtroActual === 'encamino') {
            pedidosFiltrados = pedidos.filter(p => p.estado === 'EN CAMINO' || p.estado === 'encamino');
        } else if (filtroActual === 'entregado') {
            pedidosFiltrados = pedidos.filter(p => p.estado === 'ENTREGADO' || p.estado === 'entregado');
        }
        
        const container = document.getElementById('listaPedidos');
        const noPedidosMsg = document.getElementById('noPedidosMsg');
        
        if (pedidosFiltrados.length === 0) {
            container.innerHTML = '';
            noPedidosMsg.classList.remove('hidden');
            return;
        }
        
        noPedidosMsg.classList.add('hidden');
        container.innerHTML = '';
        
        for (const pedido of pedidosFiltrados) {
            const estado = (pedido.estado || 'LISTO').toUpperCase();
            let badgeClass = 'badge-asignado';
            let badgeText = '📦 Listo para recoger';
            let acciones = '';
            let colorBorde = '#06b6d4';
            
            if (estado === 'LISTO') {
                badgeClass = 'badge-asignado';
                badgeText = '📦 Listo para recoger';
                colorBorde = '#06b6d4';
                acciones = `
                    <div class="flex gap-2 mt-3">
                        <button onclick="marcarEnCamino('${pedido.id}')" class="flex-1 bg-purple-600 text-white py-3 rounded-xl text-sm font-bold">🛵 Marcar en camino</button>
                        <button onclick="verDetallePedido('${pedido.id}')" class="flex-1 bg-white/10 text-white py-3 rounded-xl text-sm font-bold">📋 Detalle</button>
                    </div>
                `;
            } else if (estado === 'EN CAMINO') {
                badgeClass = 'badge-camino';
                badgeText = '🛵 En camino';
                colorBorde = '#8b5cf6';
                acciones = `
                    <div class="flex gap-2 mt-3">
                        <button onclick="marcarEntregado('${pedido.id}')" class="flex-1 bg-emerald-600 text-white py-3 rounded-xl text-sm font-bold">✅ Marcar entregado</button>
                        <button onclick="verDetallePedido('${pedido.id}')" class="flex-1 bg-white/10 text-white py-3 rounded-xl text-sm font-bold">📋 Detalle</button>
                    </div>
                `;
            } else if (estado === 'ENTREGADO') {
                badgeClass = 'badge-entregado';
                badgeText = '✅ Entregado';
                colorBorde = '#22c55e';
                acciones = `
                    <div class="mt-3">
                        <button onclick="verDetallePedido('${pedido.id}')" class="w-full bg-white/10 text-white py-2 rounded-xl text-sm font-bold">📋 Ver detalle</button>
                    </div>
                `;
            }
            
            const fechaPedido = pedido.fecha ? new Date(pedido.fecha).toLocaleTimeString() : 'Hoy';
            
            container.innerHTML += `
                <div class="card-pedido" style="border-left: 4px solid ${colorBorde};">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <span class="text-cyan-400 font-bold text-sm">#${pedido.id_pedido || pedido.id.substring(0, 8)}</span>
                            <p class="text-white font-bold text-sm mt-1">${pedido.cliente_nombre || 'Cliente'}</p>
                            <p class="text-white/50 text-xs">📍 ${pedido.direccion || 'Sin dirección'}</p>
                            <p class="text-white/40 text-[10px] mt-1">🕐 ${fechaPedido}</p>
                        </div>
                        <div class="text-right">
                            <span class="text-emerald-400 font-bold text-lg">${(pedido.total || 0).toFixed(2)}€</span>
                            <div class="badge ${badgeClass} px-2 py-1 rounded text-xs mt-1">${badgeText}</div>
                        </div>
                    </div>
                    <div class="bg-slate-800/50 rounded-xl p-3 mb-2">
                        <p class="text-white/60 text-xs">🏪 ${pedido.restaurante_nombre || pedido.restaurante_id}</p>
                        <p class="text-white text-xs mt-1 line-clamp-2">📦 ${(pedido.detalle || '').substring(0, 80)}${(pedido.detalle || '').length > 80 ? '...' : ''}</p>
                    </div>
                    ${acciones}
                </div>
            `;
        }
    }
    
    // ==================== ACCIONES DEL REPARTIDOR ====================
    async function marcarEnCamino(pedidoId) {
        const confirm = await Swal.fire({
            title: '🛵 ¿Iniciar entrega?',
            text: 'Confirma que estás en camino con el pedido',
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: '✅ Sí, en camino',
            background: '#0f172a', color: 'white'
        });
        
        if (confirm.isConfirmed) {
            await database.ref(`pedidos/${pedidoId}`).update({
                estado: 'EN CAMINO',
                timestamp_camino: Date.now()
            });
            Swal.fire({ title: '🛵 En camino', text: 'El pedido está en camino', icon: 'success', timer: 1500, showConfirmButton: false, background: '#0f172a', color: 'white' });
        }
    }
    
    async function marcarEntregado(pedidoId) {
        const confirm = await Swal.fire({
            title: '✅ ¿Entregar pedido?',
            text: 'Confirma que el cliente recibió el pedido correctamente',
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: '✅ Sí, entregado',
            background: '#0f172a', color: 'white'
        });
        
        if (confirm.isConfirmed) {
            const snapshot = await database.ref(`pedidos/${pedidoId}`).once('value');
            const pedido = snapshot.val();
            
            await database.ref(`pedidos/${pedidoId}`).update({
                estado: 'ENTREGADO',
                timestamp_entregado: Date.now()
            });
            
            // Actualizar reporte del repartidor
            const hoy = new Date().toDateString();
            const repId = repartidorActual.nombre.replace(/ /g, '_');
            const repRef = database.ref(`repartidores_reportes/${repId}/${hoy}`);
            const reporteSnap = await repRef.once('value');
            const reporte = reporteSnap.val() || { total_pedidos: 0, total_ganado: 0, pedidos: [] };
            
            reporte.total_pedidos++;
            reporte.total_ganado += pedido.total || 0;
            reporte.pedidos.push({
                id: pedidoId,
                total: pedido.total,
                cliente: pedido.cliente_nombre,
                restaurante: pedido.restaurante_nombre,
                timestamp: Date.now()
            });
            
            await repRef.set(reporte);
            
            Swal.fire({ title: '✅ Entregado', text: 'Pedido entregado correctamente', icon: 'success', timer: 2000, showConfirmButton: false, background: '#0f172a', color: 'white' });
            cargarReporteDiario();
        }
    }
    
    function verDetallePedido(pedidoId) {
        database.ref(`pedidos/${pedidoId}`).once('value', snapshot => {
            const p = snapshot.val();
            const itemsHtml = (p.items || []).map(item => 
                `<div class="flex justify-between text-sm py-1"><span>${item.cantidad}x ${item.nombre}</span><span>${(item.total || item.precio * item.cantidad).toFixed(2)}€</span></div>`
            ).join('');
            
            Swal.fire({
                title: `Pedido #${p.id_pedido || pedidoId.substring(0, 8)}`,
                html: `<div class="text-left max-h-96 overflow-y-auto">
                    <div class="mb-3 p-3 bg-slate-700/50 rounded-xl">
                        <p class="text-cyan-400 text-xs font-bold">INFORMACIÓN DEL CLIENTE</p>
                        <p><strong>👤 Nombre:</strong> ${p.cliente_nombre || 'Sin nombre'}</p>
                        <p><strong>📍 Dirección:</strong> ${p.direccion || 'No especificada'}</p>
                        <p><strong>📞 Teléfono:</strong> ${p.telefono || 'No disponible'}</p>
                    </div>
                    <div class="mb-3 p-3 bg-slate-700/50 rounded-xl">
                        <p class="text-cyan-400 text-xs font-bold">INFORMACIÓN DEL PEDIDO</p>
                        <p><strong>🏪 Restaurante:</strong> ${p.restaurante_nombre || p.restaurante_id}</p>
                        <p><strong>💳 Pago:</strong> ${p.metodo_pago || 'Efectivo'}</p>
                        ${p.monto_paga ? `<p><strong>💵 Paga con:</strong> ${p.monto_paga.toFixed(2)}€</p>` : ''}
                    </div>
                    <div class="p-3 bg-slate-700/50 rounded-xl">
                        <p class="text-cyan-400 text-xs font-bold mb-2">PRODUCTOS</p>
                        ${itemsHtml || '<p class="text-sm">' + (p.detalle || '') + '</p>'}
                        <div class="border-t border-white/20 mt-2 pt-2 flex justify-between font-bold">
                            <span>TOTAL</span>
                            <span>${(p.total || 0).toFixed(2)}€</span>
                        </div>
                    </div>
                </div>`,
                background: '#0f172a', color: 'white', confirmButtonColor: '#06b6d4',
                width: '95%', maxWidth: '500px'
            });
        });
    }
    
    // ==================== MENÚ FLOTANTE ====================
    function toggleMenuFlotante() {
        const menu = document.getElementById('menuFlotante');
        menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
    }
    
    async function verMiHistorial() {
        const repId = repartidorActual.nombre.replace(/ /g, '_');
        const snapshot = await database.ref(`repartidores_reportes/${repId}`).once('value');
        const historial = snapshot.val() || {};
        
        let html = '<div class="max-h-96 overflow-y-auto">';
        let totalGeneral = 0;
        let pedidosGeneral = 0;
        
        for (const [fecha, data] of Object.entries(historial)) {
            html += `<div class="mb-3 p-3 bg-slate-700/50 rounded-xl">
                        <p class="text-cyan-400 font-bold text-sm">📅 ${fecha}</p>
                        <div class="flex justify-between mt-1">
                            <span>📦 ${data.total_pedidos || 0} pedidos</span>
                            <span class="text-emerald-400">💰 ${(data.total_ganado || 0).toFixed(2)}€</span>
                        </div>
                    </div>`;
            totalGeneral += data.total_ganado || 0;
            pedidosGeneral += data.total_pedidos || 0;
        }
        
        html += `<div class="mt-3 p-3 bg-cyan-500/20 rounded-xl">
                    <div class="flex justify-between font-bold">
                        <span>TOTAL GENERAL</span>
                        <span>💰 ${totalGeneral.toFixed(2)}€</span>
                    </div>
                    <div class="flex justify-between text-sm mt-1">
                        <span>📦 TOTAL PEDIDOS</span>
                        <span>${pedidosGeneral}</span>
                    </div>
                </div></div>`;
        
        Swal.fire({
            title: '📜 Mi Historial',
            html: html,
            background: '#0f172a', color: 'white', confirmButtonColor: '#06b6d4',
            width: '95%', maxWidth: '450px'
        });
        toggleMenuFlotante();
    }
    
    async function verEstadisticas() {
        const repId = repartidorActual.nombre.replace(/ /g, '_');
        const hoy = new Date().toDateString();
        const semana = [];
        for (let i = 6; i >= 0; i--) {
            const fecha = new Date();
            fecha.setDate(fecha.getDate() - i);
            semana.push(fecha.toDateString());
        }
        
        let html = '<div class="space-y-3">';
        for (const fecha of semana) {
            const snapshot = await database.ref(`repartidores_reportes/${repId}/${fecha}`).once('value');
            const data = snapshot.val() || { total_pedidos: 0, total_ganado: 0 };
            html += `<div class="flex justify-between p-2 bg-slate-700/30 rounded-lg">
                        <span class="text-sm">${fecha.substring(0, 10)}</span>
                        <span class="text-cyan-400">📦 ${data.total_pedidos}</span>
                        <span class="text-emerald-400">💰 ${data.total_ganado.toFixed(2)}€</span>
                    </div>`;
        }
        html += '</div>';
        
        Swal.fire({
            title: '📊 Mis Estadísticas (Última semana)',
            html: html,
            background: '#0f172a', color: 'white', confirmButtonColor: '#06b6d4'
        });
        toggleMenuFlotante();
    }
    
    function reportarProblema() {
        Swal.fire({
            title: '⚠️ Reportar Problema',
            html: `<textarea id="reporteTexto" class="w-full p-3 rounded-xl bg-slate-700 border border-slate-600 text-white" rows="4" placeholder="Describe el problema..."></textarea>`,
            showCancelButton: true,
            confirmButtonText: 'Enviar Reporte',
            background: '#0f172a', color: 'white',
            preConfirm: () => {
                const texto = document.getElementById('reporteTexto').value;
                if (!texto) { Swal.showValidationMessage('Escribe una descripción'); return false; }
                return texto;
            }
        }).then(async (result) => {
            if (result.isConfirmed) {
                const reporte = {
                    repartidor: repartidorActual.nombre,
                    fecha: new Date().toISOString(),
                    mensaje: result.value
                };
                await database.ref('reportes_repartidores').push(reporte);
                Swal.fire({ title: '✅ Reporte enviado', text: 'Gracias por reportar', icon: 'success', timer: 2000, showConfirmButton: false, background: '#0f172a', color: 'white' });
            }
        });
        toggleMenuFlotante();
    }
    
    function contactarSoporte() {
        Swal.fire({
            title: '📞 Contactar Soporte',
            html: `<div class="text-left">
                <p class="mb-2">📧 <strong>Email:</strong> soporte@aguadulceexpress.com</p>
                <p>📱 <strong>Teléfono:</strong> +34 123 456 789</p>
                <hr class="my-3 border-white/10">
                <p class="text-sm text-white/60">Horario de atención: Lunes a Viernes de 9:00 a 18:00</p>
            </div>`,
            background: '#0f172a', color: 'white', confirmButtonColor: '#06b6d4'
        });
        toggleMenuFlotante();
    }
</script>
