<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AE COCINA</title>
    <style>
        /* ESTILOS DUROS - SIN TAILWIND */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Inter', sans-serif;
            background: #020617;
            color: white;
            padding-bottom: 80px;
        }
        /* Navbar */
        .nav {
            position: sticky;
            top: 0;
            background: #0f172a;
            border-bottom: 1px solid #1e293b;
            padding: 16px;
            z-index: 10;
        }
        .nav-inner {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo h1 {
            color: #06b6d4;
            font-size: 20px;
            font-weight: 900;
            font-style: italic;
        }
        .logo p {
            color: white;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .estado-badge {
            font-size: 10px;
            font-weight: bold;
            text-align: right;
        }
        .abierto { color: #4ade80; }
        .cerrado { color: #ef4444; }
        /* Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #334155;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px; width: 18px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #06b6d4; }
        input:checked + .slider:before { transform: translateX(22px); }
        /* Stats */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: rgba(30,41,59,0.5);
            border: 1px solid #1e293b;
            border-radius: 24px;
            padding: 16px;
            text-align: center;
        }
        .stat-label {
            font-size: 10px;
            font-weight: bold;
            color: #94a3b8;
            text-transform: uppercase;
        }
        .stat-value {
            font-size: 24px;
            font-weight: 900;
            color: white;
        }
        .stat-value-cyan { color: #06b6d4; }
        /* Cards de pedidos */
        .pedido-card {
            background: #1e293b;
            border-radius: 32px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .pedido-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }
        .pedido-id {
            color: #06b6d4;
            font-size: 24px;
            font-weight: 900;
            font-style: italic;
        }
        .pedido-cliente {
            font-size: 11px;
            opacity: 0.7;
            text-transform: uppercase;
            font-weight: bold;
        }
        .pedido-total {
            font-size: 24px;
            font-weight: 900;
        }
        .tiempo {
            font-size: 10px;
            color: #06b6d4;
            margin-top: 4px;
        }
        /* Botones de tiempo */
        .tiempos {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .btn-tiempo {
            flex: 1;
            padding: 12px;
            border-radius: 16px;
            font-weight: 900;
            font-size: 12px;
            text-align: center;
            cursor: pointer;
        }
        .t-15 { background: #14532d; color: #4ade80; border: 1px solid #22c55e; }
        .t-30 { background: #451a03; color: #fbbf24; border: 1px solid #f59e0b; }
        .t-45 { background: #7f1d1d; color: #f87171; border: 1px solid #ef4444; }
        /* Botones acción */
        .acciones {
            display: flex;
            gap: 8px;
        }
        button {
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.97); }
        .btn-aceptar {
            flex: 1;
            background: white;
            color: black;
            padding: 14px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 11px;
            border: none;
        }
        .btn-aceptar.aceptado {
            background: #334155;
            color: #94a3b8;
        }
        .btn-detalles {
            flex: 1;
            background: #0f172a;
            color: #06b6d4;
            padding: 14px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 11px;
            border: 1px solid #06b6d4;
        }
        .btn-listo {
            flex: 1;
            background: #06b6d4;
            color: black;
            padding: 14px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 11px;
            border: none;
        }
        /* Contador */
        .relative { position: relative; }
        .contador {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ef4444;
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 20px;
        }
        .btn-logout {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(239,68,68,0.2);
            border: 1px solid #ef4444;
            width: 48px;
            height: 48px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .hidden { display: none; }
        .text-center { text-align: center; }
        .py-20 { padding: 80px 0; }
        .opacity-20 { opacity: 0.2; }
        /* Login */
        .login-screen {
            position: fixed;
            inset: 0;
            background: #020617;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: #1e293b;
            border-radius: 40px;
            padding: 32px;
            width: 100%;
            max-width: 300px;
            text-align: center;
        }
        .login-card h1 {
            color: #06b6d4;
            font-size: 32px;
            font-style: italic;
        }
        .login-card h2 {
            color: white;
            margin-bottom: 24px;
        }
        .login-card input {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            padding: 16px;
            border-radius: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #06b6d4;
            margin-bottom: 16px;
        }
        .login-card button {
            width: 100%;
            background: #06b6d4;
            color: black;
            padding: 16px;
            border-radius: 20px;
            font-weight: bold;
            border: none;
        }
        /* Historial */
        .historial {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 85%;
            max-width: 320px;
            background: #0f172a;
            z-index: 200;
            padding: 24px;
            transform: translateX(100%);
            transition: transform 0.3s;
            overflow-y: auto;
        }
        .historial.open {
            transform: translateX(0);
        }
        .historial-card {
            background: #1e293b;
            padding: 16px;
            border-radius: 20px;
            margin-bottom: 12px;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .mb-4 { margin-bottom: 16px; }
        .mb-2 { margin-bottom: 8px; }
        .text-cyan { color: #06b6d4; }
        .text-white { color: white; }
        .text-sm { font-size: 12px; }
        .text-xs { font-size: 10px; }
        .font-bold { font-weight: bold; }
        .cursor-pointer { cursor: pointer; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>

<div id="loginScreen" class="login-screen">
    <div class="login-card">
        <h1>AE</h1>
        <h2>COCINA</h2>
        <input type="text" id="pinInput" placeholder="PIN" autocomplete="off">
        <button onclick="verificarPIN()">ENTRAR</button>
    </div>
</div>

<div id="appContent" class="hidden">
    <div class="nav">
        <div class="nav-inner">
            <div class="logo">
                <h1>AGUADULCE EXPRESS</h1>
                <p id="resNombreDisplay">Cargando...</p>
            </div>
            <div class="status">
                <div class="relative">
                    <button onclick="abrirHistorial()" style="background:#0f172a; border:1px solid #334155; padding:8px 12px; border-radius:16px;">📋</button>
                    <span id="contadorPendientes" class="contador">0</span>
                </div>
                <div>
                    <div id="txtEstado" class="estado-badge abierto">---</div>
                    <label class="switch">
                        <input type="checkbox" id="tiendaToggle" onchange="confirmarToggleTienda()">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">HOY</div>
                <div id="statHoy" class="stat-value">0.00€</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">SEMANA</div>
                <div id="statSemana" class="stat-value stat-value-cyan">0.00€</div>
            </div>
        </div>
        <div id="lista"></div>
    </div>

    <button onclick="preguntarSalir()" class="btn-logout">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
    </button>
</div>

<div id="sideHistorial" class="historial">
    <div class="flex-between mb-4">
        <h2 class="text-cyan text-xl font-bold">Historial Hoy</h2>
        <button onclick="cerrarHistorial()" class="text-white" style="background:none; border:none; font-size:24px;">✕</button>
    </div>
    <div id="listaHistorial"></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCJcLQ0ikUwZSV7L_8mLLax8B5qnhP0Roc",
        authDomain: "aguadulce-notificaciones.firebaseapp.com",
        databaseURL: "https://aguadulce-notificaciones-default-rtdb.firebaseio.com",
        projectId: "aguadulce-notificaciones",
        storageBucket: "aguadulce-notificaciones.firebasestorage.app",
        messagingSenderId: "940283725281",
        appId: "1:940283725281:web:3b388d2e7f362a99d2bea0"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const ACCESS_DB = { "DELI10":"6G4L1V", "CHUN20":"RT33M5", "HARO30":"8N3Z7K", "SUCU40":"TR92X5", "PERU50":"9V1L8K", "LIMA60":"FL44K8", "PECA70":"CV11Q9" };
    const scriptURL = "https://script.google.com/macros/s/AKfycbzYFDShcrP7I4FKhiH3q5UcEInpSKJstrumJ9ddI4Tj9S31ZUgwiuie81fGFmCJ6ob2/exec";

    let MI_ID_REST = localStorage.getItem('AE_REST_ID') || "";
    let pedidosActivos = [], historialHoy = [], aceptados = new Set(), tiendaAbierta = false, ultimoConteo = 0;

    window.onload = () => { if(MI_ID_REST) iniciarApp(); };

    function verificarPIN() {
        let pin = document.getElementById('pinInput').value.trim().toUpperCase();
        if (ACCESS_DB[pin]) {
            MI_ID_REST = ACCESS_DB[pin];
            localStorage.setItem('AE_REST_ID', MI_ID_REST);
            iniciarApp();
        } else { alert("PIN INCORRECTO"); }
    }

    function iniciarApp() {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('appContent').classList.remove('hidden');
        database.ref('pedidosActivos').on('value', () => cargar());
        setInterval(cargar, 30000);
        cargar();
    }

    async function cargar() {
        try {
            const r = await fetch(`${scriptURL}?action=leerPanelCompleto&idRest=${MI_ID_REST}&t=${Date.now()}`);
            const data = await r.json();
            if(data.tienda) {
                document.getElementById('resNombreDisplay').innerText = data.tienda.nombre || "Establecimiento";
                tiendaAbierta = (data.tienda.estado || "").toLowerCase() === "abierto";
                document.getElementById('tiendaToggle').checked = tiendaAbierta;
                let txtE = document.getElementById('txtEstado');
                txtE.innerText = tiendaAbierta ? "ABIERTO" : "CERRADO";
                txtE.className = tiendaAbierta ? "estado-badge abierto" : "estado-badge cerrado";
            }
            let stats = data.stats || {};
            document.getElementById('statHoy').innerText = (stats.diaria || "0.00") + "€";
            document.getElementById('statSemana').innerText = (stats.semanal || "0.00") + "€";
            pedidosActivos = (data.pedidos || []).sort((a,b)=>new Date(a.FECHA)-new Date(b.FECHA));
            historialHoy = data.historial || [];
            let nuevos = pedidosActivos.filter(p=>!aceptados.has(p.ID_PEDIDO)).length;
            if(nuevos > ultimoConteo && nuevos > 0 && navigator.vibrate) navigator.vibrate(500);
            ultimoConteo = nuevos;
            document.getElementById('contadorPendientes').innerText = nuevos;
            render();
        } catch(e) { console.error(e); }
    }

    function render() {
        let cont = document.getElementById('lista');
        if(pedidosActivos.length === 0) { cont.innerHTML = '<div class="text-center py-20 opacity-20">SIN PEDIDOS</div>'; return; }
        cont.innerHTML = pedidosActivos.map(p => `
            <div class="pedido-card">
                <div class="pedido-header">
                    <div>
                        <div class="pedido-id">#${p.ID_PEDIDO}</div>
                        <div class="pedido-cliente">${p.CLIENTE}</div>
                        <div class="tiempo">⏱️ ${calcularTiempo(p.FECHA)}</div>
                    </div>
                    <div class="pedido-total">${parseFloat(p.TOTAL).toFixed(2)}€</div>
                </div>
                <div class="tiempos">
                    <div onclick="asignarTiempo('${p.ID_PEDIDO}',15)" class="btn-tiempo t-15">15 MIN</div>
                    <div onclick="asignarTiempo('${p.ID_PEDIDO}',30)" class="btn-tiempo t-30">30 MIN</div>
                    <div onclick="asignarTiempo('${p.ID_PEDIDO}',45)" class="btn-tiempo t-45">45 MIN</div>
                </div>
                <div class="acciones">
                    <button onclick="aceptarPedido('${p.ID_PEDIDO}')" class="btn-aceptar ${aceptados.has(p.ID_PEDIDO) ? 'aceptado' : ''}">${aceptados.has(p.ID_PEDIDO) ? 'ACEPTADO' : 'ACEPTAR'}</button>
                    <button onclick="verDetalles('${p.ID_PEDIDO}')" class="btn-detalles">DETALLES</button>
                    <button onclick="confirmarListo('${p.ID_PEDIDO}')" class="btn-listo">LISTO</button>
                </div>
            </div>
        `).join('');
    }

    function calcularTiempo(fechaStr) {
        if(!fechaStr) return "---";
        let diff = Math.floor((new Date() - new Date(fechaStr)) / 60000);
        if(diff < 1) return "Ahora mismo";
        if(diff < 60) return `Hace ${diff} min`;
        return `Hace ${Math.floor(diff/60)}h ${diff%60}min`;
    }

    async function aceptarPedido(id) { aceptados.add(id); render(); await fetch(`${scriptURL}?action=actualizarEstado&idPedido=${id}&nuevoEstado=EN PROCESO`); cargar(); }
    function verDetalles(id) { let p = [...pedidosActivos, ...historialHoy].find(x=>x.ID_PEDIDO==id); if(p) alert(`PEDIDO #${p.ID_PEDIDO}\nCLIENTE: ${p.CLIENTE}\nDIR: ${p.DIRECCION}\n\n${p.PEDIDO_DETALLE || ''}\n\nTOTAL: ${p.TOTAL}€`); }
    function confirmarListo(id) { if(confirm(`¿Pedido #${id} listo?`)) ejecutarListo(id); }
    async function ejecutarListo(id) { await fetch(`${scriptURL}?action=actualizarEstado&idPedido=${id}&nuevoEstado=LISTO`); cargar(); }
    function confirmarToggleTienda() { let nuevo = !tiendaAbierta ? "Abierto" : "Cerrado"; if(confirm(`¿Cambiar a ${nuevo.toUpperCase()}?`)) ejecutarToggle(nuevo); else document.getElementById('tiendaToggle').checked = tiendaAbierta; }
    async function ejecutarToggle(estado) { await fetch(`${scriptURL}?action=toggleTienda&idRest=${MI_ID_REST}&sheet=configuracion&nuevoEstado=${estado}`); setTimeout(cargar,1000); }
    function preguntarSalir() { if(confirm("¿Cerrar sesión?")) { localStorage.removeItem('AE_REST_ID'); location.reload(); } }
    function abrirHistorial() {
        let lista = document.getElementById('listaHistorial');
        if(historialHoy.length === 0) lista.innerHTML = '<div class="text-center opacity-50">Vacío</div>';
        else lista.innerHTML = historialHoy.map(p => `<div class="historial-card cursor-pointer" onclick="cerrarHistorial(); verDetalles('${p.ID_PEDIDO}')"><div class="flex-between"><span class="text-cyan font-bold">#${p.ID_PEDIDO}</span><span class="font-bold">${parseFloat(p.TOTAL).toFixed(2)}€</span></div><div class="text-xs mt-1">${p.CLIENTE}</div></div>`).join('');
        document.getElementById('sideHistorial').classList.add('open');
    }
    function cerrarHistorial() { document.getElementById('sideHistorial').classList.remove('open'); }
    async function asignarTiempo(id, min) {
        let hora = new Date(Date.now() + min*60000);
        let horaStr = hora.getHours().toString().padStart(2,'0')+":"+hora.getMinutes().toString().padStart(2,'0');
        await database.ref('pedidos/'+id).update({ tiempoEstimado: min, horaSalida: horaStr, timestampListo: hora.getTime() });
        alert(`⏳ Pedido #${id} listo a las ${horaStr}`);
    }
</script>
</body>
</html>
