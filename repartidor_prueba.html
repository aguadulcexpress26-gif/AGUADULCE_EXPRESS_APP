<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Reparto</title>
    <style>
        body { background: #020617; color: white; font-family: Arial; padding: 15px; }
        .card { background: #1e293b; padding: 15px; border-radius: 15px; margin-bottom: 15px; }
        button { background: #06b6d4; border: none; padding: 10px; border-radius: 10px; font-weight: bold; width: 100%; margin-top: 10px; cursor: pointer; }
        .verde { background: #22c55e; }
        .amarillo { background: #eab308; }
        .rojo { background: #ef4444; }
    </style>
</head>
<body>
<h2>🚚 Reparto</h2>
<div id="info"></div>
<div id="lista"></div>

<script>
(async function() {
    const URL = 'https://script.google.com/macros/s/AKfycbzYFDShcrP7I4FKhiH3q5UcEInpSKJstrumJ9ddI4Tj9S31ZUgwiuie81fGFmCJ6ob2/exec';
    
    let codigo = localStorage.getItem('rep_code');
    if (!codigo) {
        codigo = prompt('Codigo (R001, R002, R003, R004):');
        if (codigo) localStorage.setItem('rep_code', codigo.toUpperCase());
        else return;
    }
    
    async function cargar() {
        const res = await fetch(URL + '?action=getPedidosReparto&idRepartidor=' + codigo);
        const data = await res.json();
        
        document.getElementById('info').innerHTML = data.nombre + ' | Saldo: ' + (data.saldo || 0) + '€';
        
        const pedidos = data.pedidos || [];
        let html = '';
        
        for (let p of pedidos) {
            let estado = (p.ESTADO || '').toUpperCase();
            let boton = '';
            
            if (estado === 'LISTO') boton = '<button onclick="recoger(\'' + p.ID_PEDIDO + '\')">RECOGER</button>';
            else if (estado === 'EN CAMINO') boton = '<button class="amarillo" onclick="llegar(\'' + p.ID_PEDIDO + '\')">HE LLEGADO</button>';
            else if (estado === 'LLEGÓ') boton = '<button class="verde" onclick="entregar(\'' + p.ID_PEDIDO + '\', ' + p.TOTAL + ')">ENTREGAR</button>';
            else boton = '<div>Estado: ' + estado + '</div>';
            
            html += '<div class="card">';
            html += '<div><strong>' + p.ID_PEDIDO + '</strong></div>';
            html += '<div>' + p.DIRECCION + '</div>';
            html += '<div>' + p.CLIENTE + '</div>';
            html += '<div>' + p.TOTAL + '€</div>';
            html += boton;
            html += '</div>';
        }
        
        document.getElementById('lista').innerHTML = html || 'Sin pedidos';
    }
    
    window.recoger = async function(id) {
        await fetch(URL + '?action=actualizarEstado&idPedido=' + id + '&nuevoEstado=EN CAMINO');
        cargar();
    };
    
    window.llegar = async function(id) {
        await fetch(URL + '?action=actualizarEstado&idPedido=' + id + '&nuevoEstado=LLEGÓ');
        cargar();
    };
    
    window.entregar = async function(id, total) {
        await fetch(URL + '?action=finalizarEntrega&idPedido=' + id + '&total=' + total + '&idRepartidor=' + codigo);
        cargar();
    };
    
    cargar();
    setInterval(cargar, 5000);
})();
</script>
</body>
</html>
