<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Panel de Diseño - Tabla Interactiva Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #121214;
            color: #f0f0f5;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #1e1e24;
            border-bottom: 1px solid #2e2e38;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 20;
        }

        .brand {
            font-weight: 700;
            font-size: 0.9rem;
            color: #d4af37;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .top-actions {
            display: flex;
            gap: 8px;
        }

        .btn-hdr {
            background: #2a2a35;
            color: #fff;
            border: 1px solid #2e2e38;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-hdr:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .workspace {
            display: flex;
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        /* Sidebar Lateral */
        .sidebar {
            width: 280px;
            background: #1e1e24;
            border-right: 1px solid #2e2e38;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .panel-tabs {
            display: flex;
            background: #17171c;
            border-bottom: 1px solid #2e2e38;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 4px;
            background: transparent;
            border: none;
            color: #8e8e9e;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active {
            color: #d4af37;
            border-bottom-color: #d4af37;
            background: #1e1e24;
        }

        .tab-content {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .section-title {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #8e8e9e;
            margin-bottom: 10px;
        }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .card-opt {
            background: #262630;
            border: 1px solid #2e2e38;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .card-opt:active {
            border-color: #d4af37;
        }

        .fabric-prev {
            width: 100%;
            height: 45px;
            border-radius: 4px;
            border: 1px solid #333;
        }

        /* Área de Lienzo / Tabla */
        .viewport-container {
            flex: 1;
            background: #101014;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .canvas-card {
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border-radius: 4px;
            transform-origin: center center;
        }

        /* Herramientas Flotantes de Zoom */
        .zoom-floating-bar {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(30, 30, 36, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid #2e2e38;
            border-radius: 20px;
            padding: 4px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 15;
        }

        .zoom-btn {
            background: none;
            border: none;
            color: #fff;
            padding: 6px;
            cursor: pointer;
        }

        .zoom-val {
            font-size: 0.75rem;
            font-weight: bold;
            color: #d4af37;
            min-width: 40px;
            text-align: center;
        }

        .touch-hint {
            position: absolute;
            top: 15px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.68rem;
            color: #aaa;
            pointer-events: none;
            z-index: 15;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span>Tabla de Diseño Pro</span>
        </div>
        <div class="top-actions">
            <button class="btn-hdr" id="btn-undo" onclick="undoAction()" disabled>
                <i class="fa-solid fa-rotate-left"></i> Retroceder
            </button>
            <button class="btn-hdr" onclick="clearCanvas()">
                <i class="fa-solid fa-trash-can"></i> Limpiar
            </button>
        </div>
    </header>

    <div class="workspace">
        <!-- Sidebar Panel -->
        <div class="sidebar">
            <div class="panel-tabs">
                <button class="tab-btn active" onclick="switchTab('fabrics')">Telas</button>
                <button class="tab-btn" onclick="switchTab('accessories')">Accesorios</button>
            </div>

            <!-- Tab Telas -->
            <div id="tab-fabrics" class="tab-content active">
                <div class="section-title">Selección de Telas</div>
                <div class="grid-cards">
                    <div class="card-opt" onclick="applyFabricPattern('stripes')">
                        <div class="fabric-prev" style="background: repeating-linear-gradient(45deg, #000 0, #000 5px, #fff 5px, #fff 10px);"></div>
                        <span style="font-size:0.75rem;">Rayas</span>
                    </div>
                    <div class="card-opt" onclick="applyFabricPattern('dots')">
                        <div class="fabric-prev" style="background-color: #e63946; background-image: radial-gradient(#fff 20%, transparent 20%); background-size: 10px 10px;"></div>
                        <span style="font-size:0.75rem;">Lunares</span>
                    </div>
                    <div class="card-opt" onclick="applyFabricPattern('tartan')">
                        <div class="fabric-prev" style="background: repeating-linear-gradient(0deg, #d4af37, #d4af37 4px, #1e1e24 4px, #1e1e24 8px);"></div>
                        <span style="font-size:0.75rem;">Escocés</span>
                    </div>
                </div>
            </div>

            <!-- Tab Accesorios -->
            <div id="tab-accessories" class="tab-content">
                <div class="section-title">Agregar Accesorios</div>
                <div class="grid-cards">
                    <div class="card-opt" onclick="addAccessory('hat')">
                        <i class="fa-solid fa-hat-wizard" style="font-size:1.8rem; color:#d4af37;"></i>
                        <span style="font-size:0.75rem;">Sombrero</span>
                    </div>
                    <div class="card-opt" onclick="addAccessory('glasses')">
                        <i class="fa-solid fa-glasses" style="font-size:1.8rem; color:#d4af37;"></i>
                        <span style="font-size:0.75rem;">Gafas</span>
                    </div>
                    <div class="card-opt" onclick="addAccessory('bag')">
                        <i class="fa-solid fa-bag-shopping" style="font-size:1.8rem; color:#d4af37;"></i>
                        <span style="font-size:0.75rem;">Bolso</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Lienzo de Trabajo con Panning y Pinch-to-Zoom -->
        <div class="viewport-container" id="viewport">
            <div class="touch-hint"><i class="fa-solid fa-hand-pointer"></i> Usa 2 dedos para Zoom / Mover tabla</div>
            
            <div class="canvas-card" id="canvas-wrapper">
                <canvas id="mainCanvas" width="450" height="650"></canvas>
            </div>

            <div class="zoom-floating-bar">
                <button class="zoom-btn" onclick="applyZoom(-0.15)"><i class="fa-solid fa-minus"></i></button>
                <div class="zoom-val" id="zoom-text">100%</div>
                <button class="zoom-btn" onclick="applyZoom(0.15)"><i class="fa-solid fa-plus"></i></button>
                <button class="zoom-btn" onclick="resetZoom()"><i class="fa-solid fa-arrows-to-dot"></i></button>
            </div>
        </div>
    </div>

    <script>
        const canvas = new fabric.Canvas('mainCanvas', {
            backgroundColor: '#ffffff'
        });

        let historyStack = [];
        let isUndoState = false;

        // --- SISTEMA DE RETROCESO (UNDO) ---
        function saveCanvasState() {
            if (isUndoState) return;
            if (historyStack.length >= 15) historyStack.shift();
            historyStack.push(JSON.stringify(canvas.toJSON(['layerId'])));
            document.getElementById('btn-undo').disabled = false;
        }

        function undoAction() {
            if (historyStack.length <= 1) {
                document.getElementById('btn-undo').disabled = true;
                return;
            }
            isUndoState = true;
            historyStack.pop(); // Elimina el estado actual
            const previousState = historyStack[historyStack.length - 1];
            
            canvas.loadFromJSON(previousState, function() {
                canvas.renderAll();
                isUndoState = false;
                if (historyStack.length <= 1) {
                    document.getElementById('btn-undo').disabled = true;
                }
            });
        }

        canvas.on('object:added', saveCanvasState);
        canvas.on('object:modified', saveCanvasState);

        // --- TELAS Y PATRONES ---
        function applyFabricPattern(type) {
            const patternCanvas = document.createElement('canvas');
            patternCanvas.width = 40;
            patternCanvas.height = 40;
            const pctx = patternCanvas.getContext('2d');

            if (type === 'stripes') {
                pctx.fillStyle = '#000000';
                pctx.fillRect(0, 0, 40, 40);
                pctx.strokeStyle = '#ffffff';
                pctx.lineWidth = 6;
                pctx.beginPath(); pctx.moveTo(0, 0); pctx.lineTo(40, 40); pctx.stroke();
            } else if (type === 'dots') {
                pctx.fillStyle = '#e63946';
                pctx.fillRect(0, 0, 40, 40);
                pctx.fillStyle = '#ffffff';
                pctx.beginPath(); pctx.arc(20, 20, 8, 0, Math.PI * 2); pctx.fill();
            } else if (type === 'tartan') {
                pctx.fillStyle = '#d4af37';
                pctx.fillRect(0, 0, 40, 40);
                pctx.fillStyle = 'rgba(0,0,0,0.5)';
                pctx.fillRect(0, 0, 40, 10); pctx.fillRect(0, 0, 10, 40);
            }

            const activeObj = canvas.getActiveObject();
            if (activeObj) {
                const pattern = new fabric.Pattern({ source: patternCanvas, repeat: 'repeat' });
                activeObj.set('fill', pattern);
                canvas.renderAll();
                saveCanvasState();
            } else {
                alert("Selecciona la figura o vestido en la tabla para aplicarle la tela.");
            }
        }

        // --- ACCESORIOS ---
        function addAccessory(type) {
            let shape;
            if (type === 'hat') {
                shape = new fabric.Triangle({ width: 80, height: 40, fill: '#d4af37', left: 185, top: 40 });
            } else if (type === 'glasses') {
                shape = new fabric.Rect({ width: 70, height: 20, fill: '#111', left: 190, top: 90, rx: 5 });
            } else {
                shape = new fabric.Circle({ radius: 25, fill: '#e63946', left: 200, top: 250 });
            }
            canvas.add(shape);
            canvas.setActiveObject(shape);
            canvas.renderAll();
        }

        // --- GESTO DE DOS DEDOS (PINCH TO ZOOM & PAN) ---
        const viewport = document.getElementById('viewport');
        const wrapper = document.getElementById('canvas-wrapper');
        const zoomText = document.getElementById('zoom-text');

        let scale = 1;
        let pointX = 0, pointY = 0;
        let initialDistance = null;
        let startScale = 1;
        let isPanning = false;
        let startX = 0, startY = 0;

        function updateTransform() {
            wrapper.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
            zoomText.innerText = `${Math.round(scale * 100)}%`;
        }

        function applyZoom(delta) {
            scale = Math.min(Math.max(0.5, scale + delta), 3.5);
            updateTransform();
        }

        function resetZoom() {
            scale = 1; pointX = 0; pointY = 0;
            updateTransform();
        }

        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                initialDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                startScale = scale;
            } else if (e.touches.length === 1 && !canvas.getActiveObject()) {
                isPanning = true;
                startX = e.touches[0].clientX - pointX;
                startY = e.touches[0].clientY - pointY;
            }
        });

        viewport.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && initialDistance) {
                e.preventDefault();
                const dist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                scale = Math.min(Math.max(0.5, startScale * (dist / initialDistance)), 3.5);
                updateTransform();
            } else if (e.touches.length === 1 && isPanning) {
                e.preventDefault();
                pointX = e.touches[0].clientX - startX;
                pointY = e.touches[0].clientY - startY;
                updateTransform();
            }
        });

        viewport.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) initialDistance = null;
            if (e.touches.length === 0) isPanning = false;
        });

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + tabId).classList.add('active');
        }

        function clearCanvas() {
            canvas.clear();
            canvas.backgroundColor = '#ffffff';
            saveCanvasState();
        }

        // Carga Inicial
        window.onload = function() {
            const bodyBase = new fabric.Rect({ width: 120, height: 260, fill: '#3b82f6', left: 165, top: 150, rx: 10 });
            canvas.add(bodyBase);
            saveCanvasState();
        };
    </script>
</body>
</html>
