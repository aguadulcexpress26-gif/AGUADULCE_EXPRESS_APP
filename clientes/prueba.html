<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Prueba de Pedido</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <h1>Prueba de Envío a Google Apps Script</h1>
    <button id="btnProbar">Probar Pedido</button>
    <pre id="resultado"></pre>

    <script>
        // ⭐ La URL con la NUEVA implementación (con CORS)
        const scriptURL = "https://script.google.com/macros/s/AKfycbwXgDzSK-IhusA8D-549Bn16SsUiiLr2ziVpYnf3oVO85UapF1RRvi0NfFIB7ColDio/exec";

        document.getElementById('btnProbar').onclick = async () => {
            document.getElementById('resultado').innerText = "Enviando...";
            
            const datosPedido = {
                telf_info: "600000000",
                cliente_info: "Cliente Prueba",
                id_res_info: "R001",
                restaurante_nombre: "Restaurante Prueba",
                dir_info: "Calle Prueba 123, 04720",
                pedido_info: "1x Producto de Prueba",
                total_info: "10.00",
                pago_info: "Efectivo",
                items: [{ nombre: "Producto de Prueba", cantidad: 1, precio_unitario: 10, total: 10 }]
            };

            const formData = new URLSearchParams();
            formData.append('data', JSON.stringify(datosPedido));

            try {
                const response = await fetch(scriptURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData.toString()
                });
                const result = await response.json();
                document.getElementById('resultado').innerText = JSON.stringify(result, null, 2);
                if (result.status === "OK") {
                    Swal.fire("✅ Éxito", `Pedido #${result.idPedido} creado`, "success");
                } else {
                    Swal.fire("❌ Error", result.message, "error");
                }
            } catch (error) {
                document.getElementById('resultado').innerText = "Error: " + error.message;
                Swal.fire("❌ Error de conexión", error.message, "error");
            }
        };
    </script>
</body>
</html>
