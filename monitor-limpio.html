<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 MONITOR - Sonido por Pedido (CORREGIDO)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { background: #0f172a; font-family: system-ui; padding: 20px; }
        .table-container { overflow-x: auto; background: #1e293b; border-radius: 16px; max-height: 70vh; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #334155; padding: 12px; text-align: left; color: white; position: sticky; top: 0; z-index: 10; }
        td { padding: 10px 12px; border-bottom: 1px solid #334155; color: #e2e8f0; }
        tr:hover { background: #334155; }
        .estado-recibido { color: #06b6d4; font-weight: bold; }
        .critico { background: rgba(239,68,68,0.2); border-left: 3px solid #ef4444; }
        .alerta { background: rgba(245,158,11,0.1); border-left: 3px solid #f59e0b; }
        .sonando-activo { background: rgba(239,68,68,0.4) !important; animation: pulseRed 1s infinite; }
        @keyframes pulseRed { 0% { background: rgba(239,68,68,0.3); } 50% { background: rgba(239,68,68,0.7); } 100% { background: rgba(239,68,68,0.3); } }
        audio { display: none; }
        .btn-ok { background: #22c55e; color: white; border: none; padding: 4px 12px; border-radius: 20px; cursor: pointer; font-size: 11px; font-weight: bold; transition: all 0.2s; }
        .btn-ok:hover { background: #16a34a; transform: scale(1.05); }
        .btn-ok.atendido { background: #16a34a; opacity: 0.6; cursor: default; }
        .btn-limpiar-todo { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 30px; cursor: pointer; font-weight: bold; }
        .btn-reset { background: #64748b; color: white; border: none; padding: 8px 16px; border-radius: 30px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="max-w-full">
    <div class="flex justify-between items-center mb-4 flex-wrap gap-3">
        <div>
            <h1 class="text-2xl font-bold text-white">📊 MONITOR DE CONTROL</h1>
            <p class="text-white/40 text-sm">🔔 Cada pedido nuevo suena cada 5 segundos hasta que marques <span class="text-green-400">✓ OK</span></p>
        </div>
        <div class="flex gap-2">
            <button id="btnSilenciar" class="px-4 py-2 rounded-full text-sm font-bold bg-red-600 text-white">🔇 SILENCIAR TODO</button>
            <button id="btnLimpiarTodo" class="btn-limpiar-todo">🗑️ ATENDER TODOS</button>
            <button id="btnReset" class="btn-reset">🔄 RESET VISTA</button>
        </div>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-5 gap-3 mb-4">
        <div class="bg-cyan-500/20 p-3 rounded-xl text-center"><div class="text-2xl font-bold text-cyan-400" id="total">0</div><div class="text-xs">EN PANTALLA</div></div>
        <div class="bg-green-500/20 p-3 rounded-xl text-center"><div class="text-2xl font-bold text-green-400" id="atendidosHoy">0</div><div class="text-xs">ATENDIDOS HOY</div></div>
        <div class="bg-red-500/20 p-3 rounded-xl text-center"><div class="text-2xl font-bold text-red-400" id="sonandoAhora">0</div><div class="text-xs">SONANDO AHORA</div></div>
        <div class="bg-yellow-500/20 p-3 rounded-xl text-center"><div class="text-2xl font-bold text-yellow-400" id="criticos">0</div><div class="text-xs">CRÍTICOS (10+ min)</div></div>
        <div class="bg-blue-500/20 p-3 rounded-xl text-center"><div class="text-2xl font-bold text-blue-400" id="atendidosTotal">0</div><div class="text-xs">ATENDIDOS TOTAL</div></div>
    </div>

    <!-- Tabla -->
    <div class="table-container">
        <table class="min-w-full">
            <thead>
                <tr><th>ATENDER</th><th>ID</th><th>CLIENTE</th><th>DIRECCIÓN</th><th>TOTAL</th><th>ESTADO</th><th>RESTAURANTE</th><th>TIEMPO</th><th>🔊</th></tr>
            </thead>
            <tbody id="tablaBody"><tr><td colspan="9" class="text-center py-10">Cargando...</tbody>
        </table>
    </div>
</div>

<audio id="audioPedido" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
</audio>

<script>
    const STORAGE_KEY = 'monitor_pedidos_atendidos_v4';
    const firebaseConfig = { databaseURL: "https://aguadulce-notificaciones-default-rtdb.firebaseio.com/" };
    
    // Estado global
    let audioGlobal = null;
    let sonidoGlobalActivado = true;
    let pedidosAtendidos = new Set();  // IDs de pedidos ya atendidos (OK)
    let pedidosSonando = new Set();     // IDs que están actualmente sonando
    let intervalosPorPedido = new Map(); // Mapa de id -> intervalo
    let todosPedidos = [];
    let timeoutReproduccion = null;
    
    // Cargar atendidos de localStorage
    function cargarAtendidos() {
        const guardados = localStorage.getItem(STORAGE_KEY);
        if (guardados) {
            pedidosAtendidos = new Set(JSON.parse(guardados));
            console.log("📦 Pedidos atendidos cargados:", pedidosAtendidos.size);
        }
        actualizarContadorAtendidos();
    }
    
    function guardarAtendidos() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify([...pedidosAtendidos]));
        actualizarContadorAtendidos();
        document.getElementById('atendidosTotal').textContent = pedidosAtendidos.size;
    }
    
    function actualizarContadorAtendidos() {
        const hoy = new Date().toLocaleDateString('es-ES');
        let atendidosHoy = 0;
        
        [...pedidosAtendidos].forEach(id => {
            const pedido = todosPedidos.find(p => (p.ID_PEDIDO || p.id) === id);
            if (pedido) {
                const fecha = pedido.FECHA || pedido.fecha;
                if (fecha) {
                    let fechaStr = '';
                    if (typeof fecha === 'string') {
                        if (fecha.includes('T')) fechaStr = new Date(fecha).toLocaleDateString('es-ES');
                        else if (fecha.includes('/')) fechaStr = fecha.split(' ')[0];
                    }
                    if (fechaStr === hoy) atendidosHoy++;
                }
            }
        });
        
        document.getElementById('atendidosHoy').textContent = atendidosHoy;
        document.getElementById('atendidosTotal').textContent = pedidosAtendidos.size;
    }
    
    // Reproducir sonido UNA VEZ
    function playSound() {
        if (!sonidoGlobalActivado) return;
        if (!audioGlobal) return;
        
        audioGlobal.currentTime = 0;
        audioGlobal.play().catch(e => {
            console.log("Error reproduciendo audio:", e);
            // Intentar recargar el audio
            audioGlobal.load();
        });
    }
    
    // Iniciar sonido para un pedido específico (cada 5 segundos)
    function iniciarSonidoPedido(idPedido) {
        // No iniciar si el sonido global está apagado
        if (!sonidoGlobalActivado) return;
        // No iniciar si ya fue atendido
        if (pedidosAtendidos.has(idPedido)) return;
        // No iniciar si ya está sonando
        if (pedidosSonando.has(idPedido)) return;
        
        console.log("🔔 INICIANDO SONIDO para pedido:", idPedido);
        pedidosSonando.add(idPedido);
        
        // Reproducir inmediatamente
        playSound();
        
        // Configurar intervalo cada 5 segundos
        const intervalo = setInterval(() => {
            // Verificar si el pedido ya fue atendido
            if (pedidosAtendidos.has(idPedido)) {
                console.log("🔇 Pedido atendido, deteniendo sonido:", idPedido);
                detenerSonidoPedido(idPedido);
                return;
            }
            
            // Verificar si el sonido sigue activado globalmente
            if (sonidoGlobalActivado) {
                console.log("🔔 PITIDO cada 5 seg - Pedido:", idPedido);
                playSound();
            }
        }, 5000);
        
        intervalosPorPedido.set(idPedido, intervalo);
        renderizarTabla();
    }
    
    // Detener sonido de un pedido específico (FORZADO)
    function detenerSonidoPedido(idPedido) {
        console.log("🔇 DETENIENDO sonido para pedido:", idPedido);
        
        // Limpiar el intervalo
        if (intervalosPorPedido.has(idPedido)) {
            clearInterval(intervalosPorPedido.get(idPedido));
            intervalosPorPedido.delete(idPedido);
        }
        
        // Remover del set de sonando
        pedidosSonando.delete(idPedido);
        
        // Asegurar que el audio no siga sonando
        if (audioGlobal) {
            audioGlobal.pause();
            audioGlobal.currentTime = 0;
        }
        
        renderizarTabla();
    }
    
    function detenerTodosLosSonidos() {
        console.log("🔇 DETENIENDO TODOS los sonidos");
        
        for (const [id, intervalo] of intervalosPorPedido) {
            clearInterval(intervalo);
        }
        intervalosPorPedido.clear();
        pedidosSonando.clear();
        
        if (audioGlobal) {
            audioGlobal.pause();
            audioGlobal.currentTime = 0;
        }
        
        renderizarTabla();
    }
    
    // Marcar pedido como atendido (OK)
    function atenderPedido(idPedido) {
        if (pedidosAtendidos.has(idPedido)) {
            console.log("⚠️ Pedido ya estaba atendido:", idPedido);
            return;
        }
        
        console.log("✅ ATENDIENDO pedido:", idPedido);
        
        // PRIMERO: Detener el sonido completamente
        detenerSonidoPedido(idPedido);
        
        // SEGUNDO: Marcar como atendido
        pedidosAtendidos.add(idPedido);
        guardarAtendidos();
        
        // TERCERO: Renderizar la tabla
        renderizarTabla();
        
        // Mostrar mensaje de confirmación
        const msg = document.createElement('div');
        msg.className = 'fixed top-20 right-4 bg-green-600 text-white px-4 py-2 rounded-lg shadow-lg z-50';
        msg.textContent = `✅ Pedido ${idPedido} atendido - Deja de sonar`;
        document.body.appendChild(msg);
        setTimeout(() => msg.remove(), 2000);
    }
    
    // Atender todos los pedidos visibles
    function atenderTodosVisibles() {
        const pedidosVisibles = todosPedidos.filter(p => {
            const id = p.ID_PEDIDO || p.id;
            return !pedidosAtendidos.has(id);
        });
        
        console.log("✅ ATENDIENDO TODOS:", pedidosVisibles.length, "pedidos");
        
        pedidosVisibles.forEach(p => {
            const id = p.ID_PEDIDO || p.id;
            detenerSonidoPedido(id);
            pedidosAtendidos.add(id);
        });
        
        guardarAtendidos();
        renderizarTabla();
        
        const msg = document.createElement('div');
        msg.className = 'fixed top-20 right-4 bg-green-600 text-white px-4 py-2 rounded-lg shadow-lg z-50';
        msg.textContent = `✅ ${pedidosVisibles.length} pedido(s) atendidos - Todos dejaron de sonar`;
        document.body.appendChild(msg);
        setTimeout(() => msg.remove(), 2000);
    }
    
    // Reset: mostrar todos los pedidos nuevamente
    function resetVista() {
        console.log("🔄 RESET VISTA - Todos los pedidos vuelven a sonar");
        
        pedidosAtendidos.clear();
        guardarAtendidos();
        
        // Detener todos los sonidos actuales
        detenerTodosLosSonidos();
        
        // Reiniciar sonidos para pedidos que existen y no están entregados
        todosPedidos.forEach(p => {
            const id = p.ID_PEDIDO || p.id;
            const estado = (p.ESTADO || p.estado || "RECIBIDO").toUpperCase();
            if (estado !== "ENTREGADO" && estado !== "FINALIZADO" && estado !== "RECHAZADO") {
                iniciarSonidoPedido(id);
            }
        });
        
        renderizarTabla();
        
        const msg = document.createElement('div');
        msg.className = 'fixed top-20 right-4 bg-blue-600 text-white px-4 py-2 rounded-lg shadow-lg z-50';
        msg.textContent = `🔄 Vista reseteada - Todos los pedidos volvieron a sonar`;
        document.body.appendChild(msg);
        setTimeout(() => msg.remove(), 2000);
    }
    
    // Silenciar todo temporalmente
    function silenciarTodo() {
        console.log("🔇 SILENCIANDO TODO temporalmente");
        sonidoGlobalActivado = false;
        detenerTodosLosSonidos();
        
        const btn = document.getElementById('btnSilenciar');
        btn.textContent = '🔊 ACTIVAR SONIDO';
        btn.classList.remove('bg-red-600');
        btn.classList.add('bg-green-600');
        
        const msg = document.createElement('div');
        msg.className = 'fixed top-20 right-4 bg-yellow-600 text-white px-4 py-2 rounded-lg shadow-lg z-50';
        msg.textContent = `🔇 Sonido silenciado temporalmente`;
        document.body.appendChild(msg);
        setTimeout(() => msg.remove(), 2000);
    }
    
    function activarSonido() {
        console.log("🔊 ACTIVANDO SONIDO - Reiniciando para pedidos no atendidos");
        sonidoGlobalActivado = true;
        
        // Reiniciar sonidos para pedidos no atendidos
        todosPedidos.forEach(p => {
            const id = p.ID_PEDIDO || p.id;
            const estado = (p.ESTADO || p.estado || "RECIBIDO").toUpperCase();
            if (!pedidosAtendidos.has(id) && estado !== "ENTREGADO" && estado !== "FINALIZADO" && estado !== "RECHAZADO") {
                iniciarSonidoPedido(id);
            }
        });
        
        const btn = document.getElementById('btnSilenciar');
        btn.textContent = '🔇 SILENCIAR TODO';
        btn.classList.remove('bg-green-600');
        btn.classList.add('bg-red-600');
        
        const msg = document.createElement('div');
        msg.className = 'fixed top-20 right-4 bg-green-600 text-white px-4 py-2 rounded-lg shadow-lg z-50';
        msg.textContent = `🔊 Sonido reactivado`;
        document.body.appendChild(msg);
        setTimeout(() => msg.remove(), 2000);
    }
    
    function toggleSilenciar() {
        if (sonidoGlobalActivado) {
            silenciarTodo();
        } else {
            activarSonido();
        }
    }
    
    // Calcular minutos
    function calcularMinutos(fechaRaw) {
        if (!fechaRaw) return 999;
        let fechaDate;
        if (typeof fechaRaw === 'number') {
            fechaDate = new Date(fechaRaw);
        } else if (typeof fechaRaw === 'string') {
            if (fechaRaw.includes('T')) {
                fechaDate = new Date(fechaRaw);
            } else if (fechaRaw.includes('/')) {
                const partes = fechaRaw.split(' ');
                const fechaParte = partes[0];
                const horaParte = partes[1] || '00:00:00';
                const [dia, mes, anio] = fechaParte.split('/');
                const [hora, min, seg] = horaParte.split(':');
                fechaDate = new Date(anio, mes-1, dia, hora, min, seg);
            } else {
                fechaDate = new Date(fechaRaw);
            }
        }
        if (!fechaDate || isNaN(fechaDate)) return 999;
        return Math.floor((new Date() - fechaDate) / 60000);
    }
    
    function getRestauranteNombre(pedido) {
        const restaurantesPorId = {
            "CHUHAN": "CHUHAN PIZZERIA KEBAB", "DELI10": "DELICIOUS FOOD",
            "HARO30": "HARO RESTAURANTE", "SUCU40": "LA SUCURSAL", "PECA70": "PECADOS"
        };
        const idRest = pedido.ID_RESTAURANTE || pedido.restaurante_id || "";
        if (restaurantesPorId[idRest]) return restaurantesPorId[idRest];
        return pedido.restaurante_nombre || "Restaurante";
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
    }
    
    function renderizarTabla() {
        // Filtrar pedidos atendidos
        const pedidosVisibles = todosPedidos.filter(p => {
            const id = p.ID_PEDIDO || p.id;
            return !pedidosAtendidos.has(id);
        });
        
        // Estadísticas
        const pendientes = pedidosVisibles.length;
        const sonandoAhora = pedidosSonando.size;
        const criticos = pedidosVisibles.filter(p => {
            const minutos = calcularMinutos(p.FECHA || p.fecha || p.timestamp);
            const estado = (p.ESTADO || p.estado || "RECIBIDO").toUpperCase();
            return minutos >= 10 && (estado === "RECIBIDO" || estado === "NUEVO");
        }).length;
        
        document.getElementById('total').textContent = pendientes;
        document.getElementById('sonandoAhora').textContent = sonandoAhora;
        document.getElementById('criticos').textContent = criticos;
        
        // Ordenar por fecha (más nuevo primero)
        const ordenados = [...pedidosVisibles].sort((a, b) => {
            const fechaA = a.FECHA || a.fecha || a.timestamp || 0;
            const fechaB = b.FECHA || b.fecha || b.timestamp || 0;
            return new Date(fechaB) - new Date(fechaA);
        });
        
        const tbody = document.getElementById('tablaBody');
        if (ordenados.length === 0) {
            tbody.innerHTML = '<td><td colspan="9" class="text-center py-10 text-white/40">✅ Todos los pedidos han sido atendidos</td></tr>';
            return;
        }
        
        let html = '';
        for (const p of ordenados) {
            const id = p.ID_PEDIDO || p.id;
            const minutos = calcularMinutos(p.FECHA || p.fecha || p.timestamp);
            const estado = (p.ESTADO || p.estado || "RECIBIDO").toUpperCase();
            const estaSonando = pedidosSonando.has(id);
            
            let rowClass = '';
            let tiempoText = minutos < 1 ? '🆕 Ahora' : `${minutos} min`;
            if (minutos >= 10 && (estado === 'RECIBIDO' || estado === 'NUEVO')) {
                rowClass = 'critico';
                tiempoText = `🔴 ${minutos} min`;
            } else if (minutos >= 5 && (estado === 'RECIBIDO' || estado === 'NUEVO')) {
                rowClass = 'alerta';
                tiempoText = `🟡 ${minutos} min`;
            }
            
            if (estaSonando) rowClass += ' sonando-activo';
            
            html += `<tr class="${rowClass}" id="fila-${id}">
                <td><button class="btn-ok" data-id="${id}" onclick="window.atenderPedido('${id}')">✓ OK</button></td>
                <td class="font-mono text-cyan-400 text-xs">${id || 'N/A'}</td>
                <td class="max-w-[150px] truncate">${escapeHtml(p.CLIENTE || p.cliente || 'Sin nombre')}</td>
                <td class="max-w-[200px] truncate" title="${escapeHtml(p.DIRECCION || p.direccion || '')}">${escapeHtml((p.DIRECCION || p.direccion || '').substring(0, 40))}</td>
                <td class="font-bold text-emerald-400">${parseFloat(p.TOTAL || p.total || 0).toFixed(2)}€</td>
                <td class="${estado === 'RECIBIDO' || estado === 'NUEVO' ? 'estado-recibido' : ''}">${estado}</td>
                <td class="max-w-[120px] truncate">🏪 ${escapeHtml(getRestauranteNombre(p))}</td>
                <td class="text-white/60 text-sm">${tiempoText}</td>
                <td class="text-center">${estaSonando ? '🔔 SONANDO (c/5s)' : '🔇 SILENCIADO'}</td>
              </tr>`;
        }
        tbody.innerHTML = html;
        actualizarContadorAtendidos();
    }
    
    // Cargar desde Firebase
    function cargarDesdeFirebase() {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const pedidosRef = db.ref('pedidos');
        
        pedidosRef.once('value', (snap) => {
            const nuevosPedidos = [];
            snap.forEach((child) => {
                const pedido = child.val();
                pedido.id = child.key;
                nuevosPedidos.push(pedido);
            });
            
            console.log("📦 Pedidos en Firebase:", nuevosPedidos.length);
            todosPedidos = nuevosPedidos;
            
            // Iniciar sonidos para pedidos no atendidos
            todosPedidos.forEach(p => {
                const id = p.ID_PEDIDO || p.id;
                const estado = (p.ESTADO || p.estado || "RECIBIDO").toUpperCase();
                if (!pedidosAtendidos.has(id) && estado !== "ENTREGADO" && estado !== "FINALIZADO" && estado !== "RECHAZADO") {
                    iniciarSonidoPedido(id);
                }
            });
            
            renderizarTabla();
        });
        
        // Escuchar NUEVOS pedidos
        pedidosRef.on('child_added', (snap) => {
            const nuevoPedido = snap.val();
            nuevoPedido.id = snap.key;
            
            const existe = todosPedidos.some(p => p.id === nuevoPedido.id);
            if (!existe) {
                todosPedidos.unshift(nuevoPedido);
                renderizarTabla();
                
                const id = nuevoPedido.ID_PEDIDO || nuevoPedido.id;
                const estado = (nuevoPedido.ESTADO || nuevoPedido.estado || "RECIBIDO").toUpperCase();
                
                // Si el pedido NO está atendido y NO está entregado, iniciar sonido
                if (!pedidosAtendidos.has(id) && estado !== "ENTREGADO" && estado !== "FINALIZADO" && estado !== "RECHAZADO") {
                    console.log("🆕 NUEVO PEDIDO - INICIANDO SONIDO:", id);
                    iniciarSonidoPedido(id);
                    
                    // Notificación
                    if (Notification.permission === 'granted') {
                        new Notification('📦 NUEVO PEDIDO', {
                            body: `${nuevoPedido.CLIENTE || 'Cliente'} - ${getRestauranteNombre(nuevoPedido)}`,
                            icon: 'https://i.postimg.cc/mZwjLXxw/Logo-Aguadulce-Express.jpg'
                        });
                    }
                }
            }
        });
    }
    
    function init() {
        audioGlobal = document.getElementById('audioPedido');
        if (audioGlobal) {
            audioGlobal.volume = 0.8;
            audioGlobal.load();
        }
        
        // Necesario para que el audio funcione en navegadores modernos
        document.body.addEventListener('click', () => {
            if (audioGlobal && sonidoGlobalActivado && pedidosSonando.size > 0) {
                audioGlobal.play().catch(e => console.log("Audio listo"));
            }
        }, { once: true });
        
        cargarAtendidos();
        
        document.getElementById('btnSilenciar').onclick = toggleSilenciar;
        document.getElementById('btnLimpiarTodo').onclick = () => atenderTodosVisibles();
        document.getElementById('btnReset').onclick = () => resetVista();
        
        cargarDesdeFirebase();
        
        // Refresco cada 10 segundos
        setInterval(() => {
            cargarDesdeFirebase();
        }, 10000);
        
        if ('Notification' in window && Notification.permission !== 'granted' && Notification.permission !== 'denied') {
            Notification.requestPermission();
        }
    }
    
    window.atenderPedido = atenderPedido;
    init();
</script>
</body>
</html>
