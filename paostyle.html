<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Fashion Studio - Diseñador de Moda Pro</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #121214;
      --panel-bg: #1e1e24;
      --panel-border: #2e2e38;
      --accent-gold: #d4af37;
      --text-main: #f0f0f5;
      --text-muted: #8e8e9e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--panel-border);
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 1px;
    }

    .brand span {
      color: var(--accent-gold);
      font-weight: 300;
      font-size: 0.8rem;
    }

    .top-actions {
      display: flex;
      gap: 10px;
    }

    .btn-pro {
      background: linear-gradient(135deg, var(--accent-gold), #aa820a);
      color: #000;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .btn-icon {
      background: transparent;
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      width: 34px;
      height: 34px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .workspace {
      display: flex;
      flex: 1;
      height: calc(100vh - 50px);
    }

    .left-panel {
      width: 340px;
      background: var(--panel-bg);
      border-right: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
    }

    .panel-tabs {
      display: flex;
      border-bottom: 1px solid var(--panel-border);
      background: #17171c;
      overflow-x: auto;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 6px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.68rem;
      font-weight: 700;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
    }

    .tab-btn.active {
      color: var(--accent-gold);
      border-bottom-color: var(--accent-gold);
      background: var(--panel-bg);
    }

    .tab-content {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .figurine-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .figurine-card {
      background: #262630;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      cursor: pointer;
    }

    .figurine-card:hover {
      border-color: var(--accent-gold);
    }

    .figurine-card img, .figurine-card .svg-preview {
      width: 100%;
      height: 120px;
      object-fit: contain;
      background: #ffffff;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .figurine-card span {
      display: block;
      font-size: 0.7rem;
      margin-top: 6px;
      color: var(--text-main);
    }

    .upload-box {
      border: 2px dashed var(--accent-gold);
      background: rgba(212, 175, 55, 0.05);
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .upload-box p {
      font-size: 0.72rem;
      color: var(--text-main);
    }

    /* Lista de Capas Avanzada */
    .layer-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .layer-item {
      background: #262630;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .layer-item.active {
      border-color: var(--accent-gold);
      background: #2d2d3a;
    }

    .layer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .layer-row span {
      font-size: 0.78rem;
      font-weight: 600;
      flex: 1;
    }

    .layer-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .layer-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
    }

    .layer-btn.active {
      color: var(--accent-gold);
    }

    .layer-slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    .layer-slider-row input {
      flex: 1;
      accent-color: var(--accent-gold);
    }

    .canvas-viewport {
      flex: 1;
      background: #101014;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .canvas-card {
      background: #ffffff;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      border-radius: 4px;
    }

    .floating-tools {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30, 30, 36, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid var(--panel-border);
      padding: 6px 16px;
      border-radius: 30px;
      display: flex;
      gap: 16px;
      z-index: 10;
    }

    .tool-btn-float {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1rem;
      cursor: pointer;
    }

    .tool-btn-float.active {
      color: var(--accent-gold);
    }

    .right-panel {
      width: 280px;
      background: var(--panel-bg);
      border-left: 1px solid var(--panel-border);
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      overflow-y: auto;
    }

    /* Módulo Teoría del Color */
    .color-wheel-box {
      background: #262630;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }

    .color-harmony-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 8px;
    }

    .harmony-btn {
      background: #17171c;
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      font-size: 0.65rem;
      padding: 6px 2px;
      border-radius: 4px;
      cursor: pointer;
    }

    .harmony-btn.active {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }

    .color-swatches {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
    }

    .swatch.active {
      border-color: #fff;
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .slider-group label {
      font-size: 0.72rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    .slider-group input {
      width: 100%;
      accent-color: var(--accent-gold);
    }

    /* Telas y Estampados */
    .fabric-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .fabric-item {
      height: 50px;
      border-radius: 4px;
      border: 1px solid var(--panel-border);
      cursor: pointer;
      background-size: cover;
    }

    .fabric-item:hover {
      border-color: var(--accent-gold);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <i class="fa-solid fa-wand-magic-sparkles" style="color: var(--accent-gold);"></i>
      Fashion Illustrator Pro <span>Studio</span>
    </div>
    <div class="top-actions">
      <button class="btn-icon" title="Limpiar Lienzo" onclick="clearCanvas()"><i class="fa-solid fa-trash-can"></i></button>
      <button class="btn-pro" onclick="saveProject(true)"><i class="fa-solid fa-check"></i> Finalizar</button>
      <button class="btn-pro" onclick="saveProject(false)" style="background:#2a2a35; color:#fff;"><i class="fa-solid fa-floppy-disk"></i> Guardar Borrador</button>
    </div>
  </header>

  <div class="workspace">
    
    <!-- Panel Izquierdo -->
    <div class="left-panel">
      <div class="panel-tabs">
        <button class="tab-btn active" onclick="switchTab('figurines')">Figurines</button>
        <button class="tab-btn" onclick="switchTab('layers')">Capas</button>
        <button class="tab-btn" onclick="switchTab('fabrics')">Telas/Estampados</button>
        <button class="tab-btn" onclick="switchTab('projects')">Proyectos</button>
      </div>

      <!-- Tab Figurines -->
      <div id="tab-figurines" class="tab-content active">
        <div class="section-title">Cargar desde Galería</div>
        <div class="upload-box" onclick="document.getElementById('custom-figurine-input').click()">
          <i class="fa-solid fa-cloud-arrow-up" style="color:var(--accent-gold); font-size:1.2rem;"></i>
          <p>Seleccionar modelo de tu dispositivo</p>
          <input type="file" id="custom-figurine-input" accept="image/*" style="display:none" onchange="uploadCustomFigurine(event)">
        </div>

        <div class="section-title">Modelos Base</div>
        <div class="figurine-grid" id="figurine-list">
          <div class="figurine-card" onclick="loadBaseFemale()">
            <div class="svg-preview"><i class="fa-solid fa-person-dress" style="font-size: 2.5rem; color: #555;"></i></div>
            <span>Femenino Base</span>
          </div>
          <div class="figurine-card" onclick="loadBaseMale()">
            <div class="svg-preview"><i class="fa-solid fa-person" style="font-size: 2.5rem; color: #555;"></i></div>
            <span>Masculino Base</span>
          </div>
        </div>
      </div>

      <!-- Tab Capas -->
      <div id="tab-layers" class="tab-content">
        <div class="section-title">
          <span>Gestión de Capas</span>
          <button class="btn-pro" style="padding:2px 8px;" onclick="addLayer()">+ Nueva Prenda</button>
        </div>
        <div class="layer-list" id="layer-container"></div>
      </div>

      <!-- Tab Telas y Estampados -->
      <div id="tab-fabrics" class="tab-content">
        <div class="section-title">Catálogo de Telas</div>
        <div class="fabric-grid">
          <div class="fabric-item" style="background-image: repeating-linear-gradient(45deg, #000 0, #000 10px, #fff 10px, #fff 20px);" onclick="applyFabricPattern('stripes')" title="Rayas"></div>
          <div class="fabric-item" style="background-color: #e63946; background-image: radial-gradient(#fff 15%, transparent 16%); background-size: 12px 12px;" onclick="applyFabricPattern('dots')" title="Lunares"></div>
          <div class="fabric-item" style="background: repeating-linear-gradient(0deg, #d4af37, #d4af37 5px, #1e1e24 5px, #1e1e24 10px);" onclick="applyFabricPattern('tartan')" title="Escocés"></div>
        </div>
      </div>

      <!-- Tab Proyectos (Ejecución y Terminados) -->
      <div id="tab-projects" class="tab-content">
        <div class="section-title">En Ejecución (Borradores)</div>
        <div class="figurine-grid" id="draft-projects-list"></div>

        <div class="section-title" style="margin-top:15px;">Proyectos Terminados</div>
        <div class="figurine-grid" id="finished-projects-list"></div>
      </div>
    </div>

    <!-- Area del Lienzo -->
    <div class="canvas-viewport">
      <div class="floating-tools">
        <button class="tool-btn-float" id="btn-select" onclick="setMode('select')" title="Seleccionar"><i class="fa-solid fa-hand"></i></button>
        <button class="tool-btn-float active" id="btn-draw" onclick="setMode('draw')" title="Dibujar"><i class="fa-solid fa-pen"></i></button>
        <button class="tool-btn-float" onclick="deleteActive()" title="Borrar Trazo"><i class="fa-solid fa-eraser"></i></button>
      </div>

      <div class="canvas-card">
        <canvas id="mainCanvas" width="450" height="650"></canvas>
      </div>
    </div>

    <!-- Panel Derecho (Teoría del Color y Pincel) -->
    <div class="right-panel">
      <div class="section-title">Teoría y Armonía del Color</div>
      <div class="color-wheel-box">
        <input type="color" id="native-color-picker" value="#000000" onchange="setColor(this.value)" style="width:100%; height:40px; border:none; cursor:pointer; background:transparent;">
        <div class="color-harmony-grid">
          <button class="harmony-btn" onclick="generateHarmony('analogous')">Análogos</button>
          <button class="harmony-btn" onclick="generateHarmony('complementary')">Complem.</button>
          <button class="harmony-btn" onclick="generateHarmony('warm')">Cálidos</button>
          <button class="harmony-btn" onclick="generateHarmony('cool')">Fríos</button>
        </div>
      </div>

      <div class="section-title">Paleta Seleccionada</div>
      <div class="color-swatches" id="swatch-container">
        <div class="swatch active" style="background: #000000;" onclick="setColor('#000000')"></div>
        <div class="swatch" style="background: #e63946;" onclick="setColor('#e63946')"></div>
        <div class="swatch" style="background: #d4af37;" onclick="setColor('#d4af37')"></div>
        <div class="swatch" style="background: #2a9d8f;" onclick="setColor('#2a9d8f')"></div>
        <div class="swatch" style="background: #ffffff;" onclick="setColor('#ffffff')"></div>
      </div>

      <div class="slider-group">
        <label>Grosor de Trazo <span id="brush-size-val">3px</span></label>
        <input type="range" id="brush-size" min="1" max="40" value="3" oninput="updateBrushSize(this.value)">
      </div>
    </div>

  </div>

  <script>
    const canvas = new fabric.Canvas('mainCanvas', {
      isDrawingMode: true,
      backgroundColor: '#ffffff'
    });

    let activeLayerId = 1;
    let layers = [
      { id: 0, name: 'Base: Figurín', opacity: 0.5, visible: true },
      { id: 1, name: 'Capa 1: Brasier / Lencería', opacity: 1.0, visible: true },
      { id: 2, name: 'Capa 2: Blusa / Traje', opacity: 1.0, visible: true }
    ];

    // Cargar Modelos
    function loadBaseFemale() {
      clearBaseModel();
      const head = new fabric.Circle({ radius: 18, fill: '#888899', left: 210, top: 40 });
      const neck = new fabric.Rect({ width: 8, height: 25, fill: '#888899', left: 221, top: 74 });
      const shoulders = new fabric.Triangle({ width: 90, height: 60, fill: '#888899', left: 180, top: 95, angle: 180 });
      const torso = new fabric.Rect({ width: 44, height: 90, fill: '#888899', left: 203, top: 95 });
      const hips = new fabric.Triangle({ width: 75, height: 70, fill: '#888899', left: 188, top: 185 });
      const leftLeg = new fabric.Rect({ width: 14, height: 320, fill: '#888899', left: 202, top: 250 });
      const rightLeg = new fabric.Rect({ width: 14, height: 320, fill: '#888899', left: 234, top: 250 });

      const modelGroup = new fabric.Group([head, neck, shoulders, torso, hips, leftLeg, rightLeg], {
        selectable: false, evented: false, opacity: layers[0].opacity, layerId: 0
      });

      canvas.add(modelGroup);
      canvas.sendToBack(modelGroup);
      canvas.renderAll();
    }

    function loadBaseMale() {
      clearBaseModel();
      const head = new fabric.Circle({ radius: 22, fill: '#888899', left: 203, top: 35 });
      const torso = new fabric.Rect({ width: 90, height: 160, fill: '#888899', left: 180, top: 80, rx: 10, ry: 10 });
      const leftLeg = new fabric.Rect({ width: 22, height: 330, fill: '#888899', left: 195, top: 240 });
      const rightLeg = new fabric.Rect({ width: 22, height: 330, fill: '#888899', left: 233, top: 240 });

      const modelGroup = new fabric.Group([head, torso, leftLeg, rightLeg], {
        selectable: false, evented: false, opacity: layers[0].opacity, layerId: 0
      });

      canvas.add(modelGroup);
      canvas.sendToBack(modelGroup);
      canvas.renderAll();
    }

    function clearBaseModel() {
      canvas.getObjects().forEach(obj => { if (obj.layerId === 0) canvas.remove(obj); });
    }

    function uploadCustomFigurine(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(f) { loadCustomDataUrl(f.target.result); };
      reader.readAsDataURL(file);
    }

    function loadCustomDataUrl(url) {
      fabric.Image.fromURL(url, function(img) {
        clearBaseModel();
        const scale = Math.min((canvas.width - 40) / img.width, (canvas.height - 40) / img.height);
        img.set({
          scaleX: scale, scaleY: scale,
          left: (canvas.width - (img.width * scale)) / 2,
          top: (canvas.height - (img.height * scale)) / 2,
          selectable: false, evented: false, opacity: layers[0].opacity, layerId: 0
        });
        canvas.add(img);
        canvas.sendToBack(img);
        canvas.renderAll();
      });
    }

    // GESTIÓN AVANZADA DE CAPAS (Encendido/Apagado y Opacidad Individual)
    function renderLayers() {
      const container = document.getElementById('layer-container');
      container.innerHTML = '';
      layers.slice().reverse().forEach(l => {
        const item = document.createElement('div');
        item.className = `layer-item ${l.id === activeLayerId ? 'active' : ''}`;
        item.innerHTML = `
          <div class="layer-row">
            <span onclick="selectLayer(${l.id})">${l.name}</span>
            <div class="layer-controls">
              <button class="layer-btn ${l.visible ? 'active' : ''}" onclick="toggleLayerVis(${l.id})">
                <i class="fa-solid ${l.visible ? 'fa-eye' : 'fa-eye-slash'}"></i>
              </button>
            </div>
          </div>
          <div class="layer-slider-row">
            <span>Opacidad</span>
            <input type="range" min="0" max="100" value="${l.opacity * 100}" oninput="changeLayerOpacity(${l.id}, this.value)">
            <span>${Math.round(l.opacity * 100)}%</span>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function selectLayer(id) {
      activeLayerId = id;
      renderLayers();
    }

    function toggleLayerVis(id) {
      const layer = layers.find(l => l.id === id);
      layer.visible = !layer.visible;
      canvas.getObjects().forEach(obj => {
        if (obj.layerId === id) obj.set('visible', layer.visible);
      });
      canvas.renderAll();
      renderLayers();
    }

    function changeLayerOpacity(id, val) {
      const layer = layers.find(l => l.id === id);
      layer.opacity = val / 100;
      canvas.getObjects().forEach(obj => {
        if (obj.layerId === id) obj.set('opacity', layer.opacity);
      });
      canvas.renderAll();
      renderLayers();
    }

    function addLayer() {
      const newId = layers.length;
      const name = prompt("Nombre de la nueva prenda/capa:", `Capa ${newId}: Prenda`);
      if (!name) return;
      layers.push({ id: newId, name: name, opacity: 1.0, visible: true });
      activeLayerId = newId;
      renderLayers();
    }

    // MODULO DE TEORÍA Y ARMONÍA DEL COLOR
    function generateHarmony(type) {
      let swatches = [];
      if (type === 'warm') swatches = ['#e63946', '#f4a261', '#e76f51', '#d4af37', '#ffb703'];
      if (type === 'cool') swatches = ['#1d3557', '#457b9d', '#2a9d8f', '#a8dadc', '#6c5ce7'];
      if (type === 'complementary') swatches = ['#e63946', '#2a9d8f', '#1d3557', '#f4a261', '#ffffff'];
      if (type === 'analogous') swatches = ['#d4af37', '#f4a261', '#e76f51', '#2a9d8f', '#000000'];

      const container = document.getElementById('swatch-container');
      container.innerHTML = swatches.map((c, i) => `
        <div class="swatch ${i===0?'active':''}" style="background: ${c};" onclick="setColor('${c}')"></div>
      `).join('');
      setColor(swatches[0]);
    }

    // HERRAMIENTAS Y MODO DE DIBUJO
    function setMode(mode) {
      canvas.isDrawingMode = (mode === 'draw');
      document.getElementById('btn-draw').classList.toggle('active', mode === 'draw');
      document.getElementById('btn-select').classList.toggle('active', mode === 'select');
      if (mode === 'draw') setupBrush();
    }

    function setupBrush() {
      canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
      canvas.freeDrawingBrush.width = parseInt(document.getElementById('brush-size').value);
      canvas.freeDrawingBrush.color = currentColor;
    }

    let currentColor = '#000000';
    function setColor(color) {
      currentColor = color;
      if (canvas.freeDrawingBrush) canvas.freeDrawingBrush.color = color;
    }

    function updateBrushSize(val) {
      document.getElementById('brush-size-val').innerText = val + 'px';
      if (canvas.freeDrawingBrush) canvas.freeDrawingBrush.width = parseInt(val);
    }

    canvas.on('path:created', function(e) {
      e.path.layerId = activeLayerId;
      e.path.set('opacity', layers.find(l => l.id === activeLayerId).opacity);
    });

    // PROYECTOS (EN EJECUCIÓN Y TERMINADOS)
    function saveProject(isFinished) {
      const name = prompt("Nombre de la colección/diseño:", "Diseño " + new Date().toLocaleDateString());
      if (!name) return;

      const dataUrl = canvas.toDataURL({ format: 'png', quality: 0.8 });
      const key = isFinished ? 'finished_projects' : 'draft_projects';
      let projects = JSON.parse(localStorage.getItem(key) || '[]');
      projects.push({ name: name, image: dataUrl, date: new Date().toLocaleDateString() });
      localStorage.setItem(key, JSON.stringify(projects));
      alert(isFinished ? "¡Proyecto finalizado y guardado en la Galería!" : "Borrador guardado para continuar luego.");
      renderProjects();
    }

    function renderProjects() {
      const drafts = JSON.parse(localStorage.getItem('draft_projects') || '[]');
      const finished = JSON.parse(localStorage.getItem('finished_projects') || '[]');

      document.getElementById('draft-projects-list').innerHTML = drafts.map(p => `
        <div class="figurine-card">
          <img src="${p.image}">
          <span>${p.name}</span>
        </div>
      `).join('');

      document.getElementById('finished-projects-list').innerHTML = finished.map(p => `
        <div class="figurine-card">
          <img src="${p.image}">
          <span>${p.name}</span>
        </div>
      `).join('');
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('tab-' + tabId).classList.add('active');
    }

    function deleteActive() {
      const active = canvas.getActiveObject();
      if (active) canvas.remove(active);
    }

    function clearCanvas() {
      canvas.clear();
      canvas.backgroundColor = '#ffffff';
      loadBaseFemale();
    }

    setupBrush();
    renderLayers();
    renderProjects();
    loadBaseFemale();
  </script>
</body>
</html>
