<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Repartidor - Aguadulce Express</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #020617; color: white; padding: 16px; padding-bottom: 80px; }
        .header { background: linear-gradient(135deg, #06b6d4, #020617); margin: -16px -16px 16px -16px; padding: 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .flex { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .btn-salir, .btn-historial { background: rgba(255,255,255,0.1); border: none; padding: 8px 16px; border-radius: 12px; color: white; cursor: pointer; font-weight: bold; font-size: 13px; }
        .repartidor-nombre { font-size: 18px; font-weight: bold; }
        .repartidor-id { font-size: 11px; color: #eab308; opacity: 0.8; margin-top: 2px; }
        .billetera-monto { font-size: 20px; font-weight: bold; color: #22c55e; }
        .status-bar { background: rgba(255,255,255,0.02); border-radius: 16px; padding: 12px; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.05); }
        .contador { background: rgba(6,182,212,0.2); color: #06b6d4; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .card { background: rgba(15,23,42,0.6); border-radius: 20px; padding: 16px; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.05); }
        .ref { background: rgba(6,182,212,0.1); padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; color: #06b6d4; }
        .status-badge { background: rgba(6,182,212,0.2); color: #06b6d4; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; }
        .direccion { font-size: 15px; font-weight: bold; margin: 14px 0; line-height: 1.4; }
        .cliente-box { background: rgba(2,6,23,0.6); border-radius: 16px; padding: 14px; margin: 12px 0; border: 1px solid rgba(255,255,255,0.02); position: relative; }
        button { width: 100%; padding: 16px; border-radius: 16px; font-weight: bold; border: none; margin-top: 12px; cursor: pointer; font-size: 14px; display: flex; justify-content: center; align-items: center; gap: 8px; transition: all 0.2s; }
        button:active { transform: scale(0.98); }
        .btn-blue { background: #06b6d4; color: black; }
        .btn-yellow { background: #eab308; color: black; }
        .btn-green { background: #22c55e; color: black; font-size: 15px; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn-red { background: #ef4444; color: white; }
        .sin-pedidos { text-align: center; padding: 60px 20px; opacity: 0.5; font-size: 15px; }
        .loader { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #020617; display: flex; align-items: center; justify-content: center; flex-direction: column; z-index: 9999; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(6,182,212,0.1); border-top-color: #06b6d4; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn-accion-tel { background: #22c55e; color: black; padding: 8px 14px; border-radius: 10px; font-size: 12px; font-weight: bold; width: auto; margin: 0; text-decoration: none; display: inline-block; }
        .btn-accion-wa { background: #25D366; color: black; padding: 8px 14px; border-radius: 10px; font-size: 12px; font-weight: bold; width: auto; margin: 0; text-decoration: none; display: inline-block; }
        .cronometro-box { margin: 12px 0; padding: 12px; border-radius: 14px; text-align: center; font-weight: bold; font-size: 13px; letter-spacing: 0.5px; }
        .text-center { text-align: center; }
        .mt-2 { margin-top: 8px; }
    </style>
</head>
<body>

<div id="loader" class="loader">
    <div class="spinner"></div>
    <p style="color:#06b6d4; margin-top: 15px; font-weight: bold; font-size: 14px;">Iniciando Panel de Reparto...</p>
</div>

<div id="app" style="display: none;">
    <div class="header">
        <div class="flex">
            <div style="display: flex; gap: 8px;">
                <button class="btn-historial" id="btnHistorial">📋 Historial</button>
                <button class="btn-salir" id="btnSalir">🚪 Salir</button>
            </div>
            <div>
                <div class="repartidor-nombre" id="nombreRep">Cargando...</div>
                <div class="repartidor-id" id="codigoRep"></div>
            </div>
            <div style="text-align: center; background: rgba(255,255,255,0.03); padding: 6px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);">
                <div style="font-size: 9px; opacity: 0.6; text-transform: uppercase;">Billetera</div>
                <div class="billetera-monto" id="saldo">0.00€</div>
            </div>
        </div>
    </div>

    <div class="status-bar flex">
        <span style="font-size: 13px;">🟢 <span id="estadoConexion" style="font-weight: bold; color: #22c55e;">Conectado</span></span>
        <span class="contador" id="contadorPedidos">0 pedidos activos</span>
    </div>

    <div id="listaPedidos"></div>
</div>

<!-- Modal de historial -->
<div id="modalHistorial" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(2,6,23,0.95); z-index: 10000; padding: 20px; overflow-y: auto;">
    <div style="max-width: 500px; margin: 0 auto; background: #0f172a; border-radius: 24px; padding: 20px; border: 1px solid rgba(255,255,255,0.1);">
        <div class="flex" style="margin-bottom: 20px;">
            <h3 style="font-size: 18px; font-weight: bold; color: #06b6d4;">📋 Historial de Hoy</h3>
            <button id="btnCerrarHistorial" style="background: rgba(255,255,255,0.1); border: none; padding: 8px 16px; border-radius: 12px; color: white; cursor: pointer;">Cerrar</button>
        </div>
        <div id="historialLista" style="max-height: 400px; overflow-y: auto;"></div>
    </div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzYFDShcrP7I4FKhiH3q5UcEInpSKJstrumJ9ddI4Tj9S31ZUgwiuie81fGFmCJ6ob2/exec';
    
    let codigoActual = null;
    let pedidosActivos = [];
    let intervalo = null;
    let intervalosCronometro = {};
    let audioNotif = null;
    let ultimosIds = [];
    
    function initAudio() {
        audioNotif = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
        audioNotif.volume = 0.8;
    }
    
    function playSound() {
        if (audioNotif) {
            audioNotif.currentTime = 0;
            audioNotif.play().catch(e => console.log('Audio no disponible'));
        }
    }
    
    async function fetchConTimeout(url, timeout = 15000) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), timeout);
        try {
            const response = await fetch(url, { signal: controller.signal });
            clearTimeout(timeoutId);
            return response;
        } catch (error) {
            clearTimeout(timeoutId);
            throw error;
        }
    }
    
    async function cargarPedidos() {
        if (!codigoActual) return;
        
        try {
            const url = `${SCRIPT_URL}?action=getPedidosReparto&idRepartidor=${encodeURIComponent(codigoActual)}&t=${Date.now()}`;
            const resp = await fetchConTimeout(url);
            const data = await resp.json();
            
            if (data.error) {
                document.getElementById('estadoConexion').innerHTML = 'Error';
                document.getElementById('estadoConexion').style.color = '#ef4444';
                return;
            }
            
            document.getElementById('estadoConexion').innerHTML = 'Conectado';
            document.getElementById('estadoConexion').style.color = '#22c55e';
            document.getElementById('nombreRep').innerHTML = data.nombre || codigoActual;
            document.getElementById('saldo').innerHTML = (parseFloat(data.saldo) || 0).toFixed(2) + '€';
            
            const nuevosPedidos = data.pedidos || [];
            const nuevosIds = nuevosPedidos.map(p => p.ID_PEDIDO);
            const realmenteNuevos = nuevosIds.filter(id => !ultimosIds.includes(id));
            
            if (realmenteNuevos.length > 0) {
                playSound();
                if ('Notification' in window && Notification.permission === 'granted' && document.hidden) {
                    new Notification('Nuevo pedido asignado', { body: `Tienes ${realmenteNuevos.length} pedido(s) nuevo(s)` });
                }
            }
            
            ultimosIds = nuevosIds;
            pedidosActivos = nuevosPedidos.filter(p => {
                const estado = (p.ESTADO || '').toUpperCase();
                return estado !== 'CANCELADO' && estado !== 'RECHAZADO' && estado !== 'ENTREGADO';
            });
            
            document.getElementById('contadorPedidos').innerHTML = `${pedidosActivos.length} pedido${pedidosActivos.length !== 1 ? 's' : ''} activos`;
            
            renderizarPedidos();
            
        } catch(e) {
            console.error("Error en cargarPedidos:", e);
            document.getElementById('estadoConexion').innerHTML = 'Offline';
            document.getElementById('estadoConexion').style.color = '#ef4444';
        }
    }
    
    function iniciarTemporizadorReparto(id, estado) {
        if (intervalosCronometro[id]) clearInterval(intervalosCronometro[id]);
        
        let tiempoLimiteSegundos = (estado === 'LLEGÓ' || estado === 'LLEGO') ? 5 * 60 : 45 * 60;
        let tiempoRestante = tiempoLimiteSegundos;
        
        intervalosCronometro[id] = setInterval(() => {
            const elemento = document.getElementById('cronometro-' + id);
            const contenedorBotonFalta = document.getElementById('bloque-cancelar-emergencia-' + id);
            
            if (!elemento) {
                if (intervalosCronometro[id]) clearInterval(intervalosCronometro[id]);
                return;
            }
            
            if (tiempoRestante <= 0) {
                clearInterval(intervalosCronometro[id]);
                
                if (estado === 'LLEGÓ' || estado === 'LLEGO') {
                    elemento.style.background = 'rgba(239, 68, 68, 0.15)';
                    elemento.style.border = '1px solid #ef4444';
                    elemento.style.color = '#ef4444';
                    elemento.innerHTML = '🚨 TIEMPO DE ESPERA AGOTADO (CLIENTE AUSENTE)';
                    
                    if (contenedorBotonFalta) {
                        contenedorBotonFalta.innerHTML = `
                            <button class="btn-red" style="background: #991b1b; border: 2px solid #ef4444; color: white; margin-top: 12px;" onclick="cancelarPorAusencia('${id}')">
                                ❌ REGISTRAR AUSENCIA Y PENALIZAR CLIENTE
                            </button>
                        `;
                    }
                } else {
                    elemento.style.background = 'rgba(239, 68, 68, 0.15)';
                    elemento.style.border = '1px solid #ef4444';
                    elemento.style.color = '#ef4444';
                    elemento.innerHTML = '🚨 PEDIDO RETRASADO';
                }
                return;
            }
            
            tiempoRestante--;
            const minutos = Math.floor(tiempoRestante / 60);
            const segundos = tiempoRestante % 60;
            const textoSegundos = segundos < 10 ? "0" + segundos : segundos;
            
            if (estado === 'LLEGÓ' || estado === 'LLEGO') {
                elemento.style.background = 'rgba(234, 179, 8, 0.1)';
                elemento.style.border = '1px solid rgba(234, 179, 8, 0.3)';
                elemento.style.color = '#eab308';
                elemento.innerHTML = '📦 TIEMPO DE ESPERA AL CLIENTE: ' + minutos + ':' + textoSegundos;
            } else {
                elemento.style.background = 'rgba(6, 182, 212, 0.1)';
                elemento.style.border = '1px solid rgba(6, 182, 212, 0.3)';
                elemento.style.color = '#06b6d4';
                elemento.innerHTML = '🛵 TIEMPO ESTIMADO DE ENTREGA: ' + minutos + ':' + textoSegundos;
            }
        }, 1000);
    }
    
    function renderizarPedidos() {
        const container = document.getElementById('listaPedidos');
        
        if (pedidosActivos.length === 0) {
            for (let k in intervalosCronometro) {
                clearInterval(intervalosCronometro[k]);
            }
            intervalosCronometro = {};
            container.innerHTML = '<div class="sin-pedidos">📭 Sin pedidos asignados en este momento</div>';
            return;
        }
        
        let html = '';
        for (let p of pedidosActivos) {
            const estado = (p.ESTADO || '').toUpperCase();
            const total = parseFloat(p.TOTAL) || 0;
            const metodoPago = p.PAGO || 'Efectivo';
            const telefono = p.telf || p.WHATSAPP || '';
            const telefonoLimpio = telefono.replace(/\D/g, '');
            
            let infoCambioHTML = '';
            if (metodoPago.toLowerCase() === 'efectivo') {
                infoCambioHTML = `
                    <div style="margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.05); font-size: 11px;">
                        <span style="opacity: 0.6;">💵 Pago en efectivo - Prepara cambio</span>
                    </div>
                `;
            }
            
            let cronometroHTML = '';
            if (estado === 'EN CAMINO' || estado === 'LLEGÓ' || estado === 'LLEGO') {
                cronometroHTML = `
                    <div id="cronometro-${p.ID_PEDIDO}" class="cronometro-box">
                        ⏳ CALCULANDO RUTA LOGÍSTICA...
                    </div>
                `;
                setTimeout(() => iniciarTemporizadorReparto(p.ID_PEDIDO, estado), 100);
            }
            
            let botones = '';
            if (estado === 'LISTO') {
                botones = '<button class="btn-blue" onclick="recogerPedido(\'' + p.ID_PEDIDO + '\')">🏍️ RECOGER PEDIDO</button>';
            } else if (estado === 'EN CAMINO') {
                botones = '<button class="btn-yellow" onclick="marcarLlegada(\'' + p.ID_PEDIDO + '\')">📍 HE LLEGADO AL DOMICILIO</button>';
            } else if (estado === 'LLEGÓ' || estado === 'LLEGO') {
                botones = '<button class="btn-green" onclick="confirmarEntrega(\'' + p.ID_PEDIDO + '\', ' + total + ')">💰 CONFIRMAR COBRO Y ENTREGA</button>';
            } else {
                botones = '<div style="background: rgba(6,182,212,0.1); padding: 14px; border-radius: 14px; text-align: center; font-size: 12px;">⏳ Estado: ' + estado + '</div>';
            }
            
            html += '<div class="card">';
            html += '<div class="flex">';
            html += '<span class="ref">📋 REF: ' + p.ID_PEDIDO + '</span>';
            html += '<span class="status-badge">' + estado + '</span>';
            html += '</div>';
            html += '<div class="direccion">📍 ' + (p.DIRECCION || 'Sin dirección') + '</div>';
            
            html += '<div class="cliente-box">';
            html += '<div style="color: #a855f7; font-weight: bold; font-size: 14px;">👤 ' + (p.CLIENTE || 'Cliente') + '</div>';
            html += '<div class="flex" style="margin-top: 10px; justify-content: flex-start; gap: 10px;">';
            html += '<span style="font-size: 13px; opacity: 0.8;">📞 ' + (telefono || 'No disponible') + '</span>';
            if (telefonoLimpio) {
                html += '<a href="tel:+34' + telefonoLimpio + '" class="btn-accion-tel">Llamar</a>';
                html += '<a href="https://wa.me/34' + telefonoLimpio + '" target="_blank" class="btn-accion-wa">WhatsApp</a>';
            }
            html += '</div>';
            html += '<div style="font-size:12px; opacity:0.7; margin-top: 12px;">💳 Método: <strong>' + metodoPago + '</strong></div>';
            html += infoCambioHTML;
            html += '</div>';
            
            html += cronometroHTML;
            
            html += '<div class="flex" style="margin: 14px 0; border-top: 1px solid rgba(255,255,255,0.02); padding-top: 12px;">';
            html += '<div><span style="font-size:12px; opacity:0.5;">Total a recibir:</span></div>';
            html += '<div><span style="color:#22c55e; font-size:20px; font-weight:bold;">' + total.toFixed(2) + '€</span></div>';
            html += '</div>';
            
            html += '<a href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.DIRECCION || '') + '" target="_blank" style="display:block; text-align:center; background: rgba(255,255,255,0.05); color: #06b6d4; padding: 10px; border-radius: 12px; font-size: 12px; font-weight: bold; margin-bottom: 4px; border: 1px solid rgba(6,182,212,0.1); text-decoration: none;">🗺️ Abrir Mapa de Ruta</a>';
            
            html += botones;
            html += `<div id="bloque-cancelar-emergencia-${p.ID_PEDIDO}"></div>`;
            html += '</div>';
        }
        container.innerHTML = html;
    }
    
    window.recogerPedido = async function(id) {
        const btn = event?.target;
        if (btn) btn.disabled = true;
        
        try {
            await fetchConTimeout(SCRIPT_URL + '?action=actualizarEstado&idPedido=' + id + '&nuevoEstado=EN CAMINO');
            await Swal.fire({ title: '✅ Pedido en camino', icon: 'success', background: '#020617', color: 'white', timer: 1500, showConfirmButton: false });
            await cargarPedidos();
        } catch(e) {
            console.error(e);
            await Swal.fire({ title: 'Error', text: 'No se pudo actualizar el estado', icon: 'error', background: '#020617', color: 'white' });
        } finally {
            if (btn) btn.disabled = false;
        }
    };
    
    window.marcarLlegada = async function(id) {
        const btn = event?.target;
        if (btn) btn.disabled = true;
        
        try {
            await fetchConTimeout(SCRIPT_URL + '?action=actualizarEstado&idPedido=' + id + '&nuevoEstado=LLEGÓ');
            await Swal.fire({ title: '📍 Llegaste al destino', icon: 'success', background: '#020617', color: 'white', timer: 1500, showConfirmButton: false });
            await cargarPedidos();
        } catch(e) {
            console.error(e);
            await Swal.fire({ title: 'Error', text: 'No se pudo actualizar el estado', icon: 'error', background: '#020617', color: 'white' });
        } finally {
            if (btn) btn.disabled = false;
        }
    };
    
    window.confirmarEntrega = function(id, total) {
        Swal.fire({
            title: '💰 Cobrar ' + total.toFixed(2) + '€',
            text: '¿Confirmas la entrega física y el cobro correcto?',
            icon: 'question',
            background: '#020617',
            color: 'white',
            confirmButtonColor: '#22c55e',
            confirmButtonText: '✅ Confirmar',
            showCancelButton: true,
            cancelButtonText: 'Cancelar'
        }).then(async (res) => {
            if (res.isConfirmed) {
                try {
                    await fetchConTimeout(SCRIPT_URL + '?action=finalizarEntrega&idPedido=' + id + '&total=' + total);
                    await Swal.fire({ title: '🎉 ¡Entrega finalizada!', text: `+${total.toFixed(2)}€ en tu billetera`, icon: 'success', background: '#020617', color: 'white', timer: 2000, showConfirmButton: false });
                    await cargarPedidos();
                } catch(e) {
                    console.error(e);
                    await Swal.fire({ title: 'Error', text: 'No se pudo finalizar la entrega', icon: 'error', background: '#020617', color: 'white' });
                }
            }
        });
    };
    
    window.cancelarPorAusencia = async function(id) {
        const result = await Swal.fire({
            title: '⚠️ ¿REGISTRAR AUSENCIA?',
            html: 'Se cancelará el pedido, se enviará notificación al cliente y <strong>se le cargará el monto total como deuda</strong> en su cuenta.',
            icon: 'warning',
            background: '#020617',
            color: 'white',
            confirmButtonColor: '#ef4444',
            confirmButtonText: '❌ Sí, Penalizar Cliente',
            showCancelButton: true,
            cancelButtonText: 'Esperar un poco más'
        });
        
        if (result.isConfirmed) {
            try {
                await fetchConTimeout(SCRIPT_URL + '?action=actualizarEstado&idPedido=' + encodeURIComponent(id) + '&nuevoEstado=CANCELADO&tiempo=' + encodeURIComponent('Cliente no recogió el pedido - Ausencia'));
                await Swal.fire({ title: '❌ Ausencia registrada', text: 'Cliente penalizado correctamente', icon: 'error', background: '#020617', color: 'white', timer: 2000, showConfirmButton: false });
                await cargarPedidos();
            } catch(e) {
                console.error(e);
                await Swal.fire({ title: 'Error', text: 'No se pudo registrar la ausencia', icon: 'error', background: '#020617', color: 'white' });
            }
        }
    };
    
    async function mostrarHistorial() {
        if (!codigoActual) return;
        
        const modal = document.getElementById('modalHistorial');
        modal.style.display = 'flex';
        
        try {
            const resp = await fetchConTimeout(SCRIPT_URL + '?action=getHistorialRepartidor&nombre=' + encodeURIComponent(codigoActual));
            const data = await resp.json();
            const pedidos = data.historial || [];
            
            const hoy = new Date().toLocaleDateString('es-ES');
            const entregasHoy = pedidos.filter(p => {
                const fecha = p.FECHA ? p.FECHA.substring(0, 10) : '';
                return p.ESTADO === 'ENTREGADO' && fecha === hoy;
            });
            
            const totalHoy = entregasHoy.reduce((sum, p) => sum + (parseFloat(p.TOTAL) || 0), 0);
            
            let html = '';
            for (let p of entregasHoy.slice().reverse()) {
                html += `
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1);">
                        <div>
                            <strong>${p.ID_PEDIDO}</strong>
                            <div style="font-size: 11px; opacity: 0.7;">${p.CLIENTE || 'Cliente'}</div>
                        </div>
                        <div style="color: #22c55e; font-weight: bold;">${(parseFloat(p.TOTAL) || 0).toFixed(2)}€</div>
                    </div>
                `;
            }
            
            if (entregasHoy.length === 0) {
                html = '<div class="text-center" style="padding: 40px;">📭 No hay entregas registradas hoy</div>';
            }
            
            html += `
                <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between;">
                    <span>📊 Total entregas hoy:</span>
                    <span style="color: #22c55e; font-weight: bold;">${totalHoy.toFixed(2)}€</span>
                </div>
            `;
            
            document.getElementById('historialLista').innerHTML = html;
        } catch(e) {
            document.getElementById('historialLista').innerHTML = '<div class="text-center" style="padding: 40px;">❌ Error al cargar historial</div>';
        }
    }
    
    function cerrarHistorial() {
        document.getElementById('modalHistorial').style.display = 'none';
    }
    
    async function cerrarSesion() {
        const result = await Swal.fire({
            title: '¿Cerrar sesión?',
            icon: 'question',
            background: '#020617',
            color: 'white',
            confirmButtonColor: '#ef4444',
            confirmButtonText: 'Sí, salir',
            showCancelButton: true,
            cancelButtonText: 'No'
        });
        
        if (result.isConfirmed) {
            if (intervalo) clearInterval(intervalo);
            for (let k in intervalosCronometro) clearInterval(intervalosCronometro[k]);
            localStorage.removeItem('repartidor_codigo');
            location.reload();
        }
    }
    
    async function iniciarApp() {
        console.log("⚙️ Ejecutando iniciarApp()...");
        initAudio();
        
        // Configurar event listeners
        document.getElementById('btnSalir').onclick = cerrarSesion;
        document.getElementById('btnHistorial').onclick = mostrarHistorial;
        document.getElementById('btnCerrarHistorial').onclick = cerrarHistorial;
        
        let codigo = localStorage.getItem('repartidor_codigo');
        
        if (!codigo) {
            const result = await Swal.fire({
                title: '🔐 Código de Repartidor',
                input: 'text',
                inputPlaceholder: 'Ej: R001, R003',
                background: '#020617',
                color: 'white',
                confirmButtonColor: '#06b6d4',
                allowOutsideClick: false
            });
            
            if (result.value && result.value.trim()) {
                codigo = result.value.trim().toUpperCase();
                localStorage.setItem('repartidor_codigo', codigo);
            } else {
                document.getElementById('loader').innerHTML = '<p style="color:#ef4444;">❌ No se ingresó código. Recarga la página.</p>';
                return;
            }
        }
        
        codigoActual = codigo;
        document.getElementById('codigoRep').innerHTML = '🔑 ' + codigoActual;
        console.log("🔑 Código configurado:", codigoActual);
        
        // Cargar pedidos por primera vez
        await cargarPedidos();
        
        // Ocultar loader y mostrar app
        document.getElementById('loader').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        console.log("✅ App visible en pantalla!");
        
        // Iniciar intervalo de actualización
        if (intervalo) clearInterval(intervalo);
        intervalo = setInterval(cargarPedidos, 8000);
        
        // Solicitar permisos de notificación
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }
    }
    
    // Iniciar la app cuando el DOM esté listo
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', iniciarApp);
    } else {
        iniciarApp();
    }
</script>
</body>
</html>
