<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocina Express - Aguadulce</title>
    
    <!-- Firebase SDK (versión simplificada para web) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .logo {
            text-align: center;
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 15px;
            font-size: 20px;
            border: 2px solid #ddd;
            border-radius: 12px;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 3px;
            font-family: monospace;
        }

        input:focus {
            outline: none;
            border-color: #2a5298;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .info {
            margin-top: 20px;
            text-align: center;
            color: #888;
            font-size: 12px;
        }

        .dashboard {
            display: none;
        }

        .resto-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .resto-name {
            font-size: 24px;
            font-weight: bold;
            color: #1e3c72;
        }

        .badge-pin {
            background: #f0f0f0;
            padding: 5px 12px;
            border-radius: 20px;
            font-family: monospace;
            font-size: 14px;
        }

        .pedido-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 5px solid #ff9800;
        }

        .pedido-card.preparando {
            border-left-color: #2196f3;
        }

        .pedido-card.listo {
            border-left-color: #4caf50;
        }

        .pedido-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .cliente {
            font-weight: bold;
            font-size: 16px;
        }

        .hora {
            color: #888;
            font-size: 12px;
        }

        .productos {
            margin: 15px 0;
            padding-left: 20px;
        }

        .producto-item {
            margin: 5px 0;
            color: #555;
        }

        .total {
            font-weight: bold;
            font-size: 18px;
            color: #1e3c72;
            margin: 10px 0;
        }

        .btn-estado {
            background: #2a5298;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            width: auto;
            margin-top: 10px;
        }

        .logout-btn {
            background: #dc3545;
            margin-top: 20px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            z-index: 9999;
            animation: fadeInUp 0.3s ease;
        }

        .toast.success {
            background: #28a745;
        }

        .toast.error {
            background: #dc3545;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .empty-pedidos {
            text-align: center;
            padding: 40px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Pantalla de Login -->
        <div id="loginPanel" class="card">
            <div class="logo">🍳</div>
            <h1>Cocina Express</h1>
            <div class="input-group">
                <label>🔐 PIN del Restaurante</label>
                <input type="text" id="pinInput" placeholder="Ej: AB10DE" maxlength="6" autocomplete="off" style="text-transform: uppercase;">
            </div>
            <button id="btnValidar">Ingresar</button>
            <div class="info">
                Ingrese el PIN que le proporcionó la administración
            </div>
        </div>

        <!-- Dashboard de Pedidos -->
        <div id="dashboardPanel" class="card dashboard">
            <div class="resto-header">
                <span class="resto-name" id="restoNombre">Cargando...</span>
                <span class="badge-pin" id="restoPin">---</span>
            </div>
            <hr>
            <h3>📋 Pedidos Activos</h3>
            <div id="pedidosLista">
                <div class="empty-pedidos">Cargando pedidos...</div>
            </div>
            <button id="logoutBtn" class="logout-btn">🚪 Cerrar Sesión</button>
        </div>
    </div>

    <script>
        // ==================== TU CONFIGURACIÓN DE FIREBASE ====================
        const firebaseConfig = {
            apiKey: "AIzaSyCJcLQ0ikUwZSV7L_8mLLax8B5qnhP0Roc",
            authDomain: "aguadulce-notificaciones.firebaseapp.com",
            databaseURL: "https://aguadulce-notificaciones-default-rtdb.firebaseio.com",
            projectId: "aguadulce-notificaciones",
            storageBucket: "aguadulce-notificaciones.firebasestorage.app",
            messagingSenderId: "940283725281",
            appId: "1:940283725281:web:5b22472184b0f4e2d2bea0"
        };
        
        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        // ==================== VARIABLES ====================
        let restauranteActual = null;
        
        // ==================== FUNCIONES ====================
        
        function mostrarMensaje(mensaje, tipo = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${tipo}`;
            toast.textContent = mensaje;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        // Validar PIN en Realtime Database
        async function validarPIN(pin) {
            try {
                const snapshot = await database.ref(`restaurantes/${pin}`).once('value');
                const restaurante = snapshot.val();
                
                if (restaurante && restaurante.activo === true) {
                    return {
                        valido: true,
                        restaurante: {
                            pin: pin,
                            nombre: restaurante.nombre,
                            id_restaurante: restaurante.id_restaurante
                        }
                    };
                } else {
                    return { valido: false, error: 'PIN inválido o restaurante inactivo' };
                }
            } catch (error) {
                console.error('Error validando PIN:', error);
                return { valido: false, error: 'Error de conexión' };
            }
        }
        
        // Verificar PIN desde el input
        async function verificarPIN() {
            const input = document.getElementById('pinInput');
            const pin = input.value.toUpperCase().trim();
            
            if (!pin) {
                mostrarMensaje('❌ Ingrese un PIN', 'error');
                return;
            }
            
            const btn = document.getElementById('btnValidar');
            btn.textContent = '🔄 Validando...';
            btn.disabled = true;
            
            const resultado = await validarPIN(pin);
            
            if (resultado.valido) {
                restauranteActual = resultado.restaurante;
                
                // Guardar sesión
                localStorage.setItem('restaurante_cocina', JSON.stringify(restauranteActual));
                
                mostrarMensaje(`✅ Bienvenido ${restauranteActual.nombre}`, 'success');
                
                // Cambiar a dashboard
                document.getElementById('loginPanel').style.display = 'none';
                document.getElementById('dashboardPanel').style.display = 'block';
                document.getElementById('restoNombre').textContent = restauranteActual.nombre;
                document.getElementById('restoPin').textContent = restauranteActual.pin;
                
                // Escuchar pedidos en tiempo real
                iniciarEscuchaPedidos();
            } else {
                mostrarMensaje(`❌ ${resultado.error || 'PIN incorrecto'}`, 'error');
                input.value = '';
                input.focus();
            }
            
            btn.textContent = 'Ingresar';
            btn.disabled = false;
        }
        
        // Escuchar pedidos en tiempo real
        function iniciarEscuchaPedidos() {
            const pedidosRef = database.ref('pedidos');
            
            pedidosRef.on('value', (snapshot) => {
                const todosPedidos = snapshot.val() || {};
                
                // Filtrar pedidos del restaurante actual y estados activos
                const pedidosFiltrados = [];
                
                Object.keys(todosPedidos).forEach(key => {
                    const pedido = todosPedidos[key];
                    if (pedido.restaurante_id === restauranteActual.pin && 
                        (pedido.estado === 'pendiente' || pedido.estado === 'preparando')) {
                        pedidosFiltrados.push({
                            id: key,
                            ...pedido
                        });
                    }
                });
                
                renderizarPedidos(pedidosFiltrados);
            });
        }
        
        // Cambiar estado de un pedido
        async function cambiarEstado(pedidoId, nuevoEstado) {
            try {
                await database.ref(`pedidos/${pedidoId}`).update({
                    estado: nuevoEstado,
                    actualizado_en: Date.now()
                });
                
                const mensaje = nuevoEstado === 'preparando' 
                    ? '🔪 Pedido en preparación' 
                    : '✅ Pedido listo para entregar';
                
                mostrarMensaje(mensaje, 'success');
            } catch (error) {
                console.error('Error cambiando estado:', error);
                mostrarMensaje('❌ Error al actualizar el pedido', 'error');
            }
        }
        
        // Renderizar lista de pedidos
        function renderizarPedidos(pedidos) {
            const container = document.getElementById('pedidosLista');
            
            if (!pedidos || pedidos.length === 0) {
                container.innerHTML = '<div class="empty-pedidos">📭 No hay pedidos activos</div>';
                return;
            }
            
            let html = '';
            pedidos.forEach(pedido => {
                let estadoClass = '';
                let estadoTexto = '';
                let botonTexto = '';
                let botonAccion = '';
                
                if (pedido.estado === 'pendiente') {
                    estadoClass = 'pendiente';
                    estadoTexto = '⏰ Pendiente';
                    botonTexto = '🔪 Marcar como preparando';
                    botonAccion = `cambiarEstado('${pedido.id}', 'preparando')`;
                } else if (pedido.estado === 'preparando') {
                    estadoClass = 'preparando';
                    estadoTexto = '🔪 En preparación';
                    botonTexto = '✅ Marcar como listo';
                    botonAccion = `cambiarEstado('${pedido.id}', 'listo')`;
                }
                
                // Calcular total si no viene
                let total = pedido.total || 0;
                if (!total && pedido.productos) {
                    total = pedido.productos.reduce((sum, p) => sum + (p.precio * p.cantidad), 0);
                }
                
                html += `
                    <div class="pedido-card ${estadoClass}">
                        <div class="pedido-header">
                            <span class="cliente">👤 ${pedido.cliente_nombre || 'Cliente'}</span>
                            <span class="hora">🕐 ${pedido.hora || new Date(pedido.fecha).toLocaleTimeString() || 'Ahora'}</span>
                        </div>
                        <div class="productos">
                            ${pedido.productos ? pedido.productos.map(p => `
                                <div class="producto-item">• ${p.cantidad}x ${p.nombre} - ${(p.precio * p.cantidad).toFixed(2)}€</div>
                            `).join('') : '<div>Productos no disponibles</div>'}
                        </div>
                        <div class="total">💰 Total: ${total.toFixed(2)}€</div>
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <span>${estadoTexto}</span>
                            ${botonTexto ? `<button class="btn-estado" onclick="${botonAccion}">${botonTexto}</button>` : ''}
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        // Cerrar sesión
        function cerrarSesion() {
            database.ref('pedidos').off();
            restauranteActual = null;
            localStorage.removeItem('restaurante_cocina');
            document.getElementById('dashboardPanel').style.display = 'none';
            document.getElementById('loginPanel').style.display = 'block';
            document.getElementById('pinInput').value = '';
            mostrarMensaje('👋 Sesión cerrada', 'success');
        }
        
        // Verificar sesión guardada
        function verificarSesionGuardada() {
            const guardado = localStorage.getItem('restaurante_cocina');
            if (guardado) {
                try {
                    restauranteActual = JSON.parse(guardado);
                    document.getElementById('loginPanel').style.display = 'none';
                    document.getElementById('dashboardPanel').style.display = 'block';
                    document.getElementById('restoNombre').textContent = restauranteActual.nombre;
                    document.getElementById('restoPin').textContent = restauranteActual.pin;
                    iniciarEscuchaPedidos();
                } catch(e) {
                    localStorage.removeItem('restaurante_cocina');
                }
            }
        }
        
        // ==================== EVENTOS ====================
        document.getElementById('btnValidar').addEventListener('click', verificarPIN);
        document.getElementById('logoutBtn').addEventListener('click', cerrarSesion);
        document.getElementById('pinInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') verificarPIN();
        });
        
        // ==================== INICIALIZAR ====================
        verificarSesionGuardada();
    </script>
</body>
</html>
