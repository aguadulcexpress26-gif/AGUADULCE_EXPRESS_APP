<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Fashion Studio - Diseñador de Moda</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #121214;
      --panel-bg: #1e1e24;
      --panel-border: #2e2e38;
      --accent-gold: #d4af37;
      --text-main: #f0f0f5;
      --text-muted: #8e8e9e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--panel-border);
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 1px;
    }

    .brand span {
      color: var(--accent-gold);
      font-weight: 300;
      font-size: 0.8rem;
    }

    .top-actions {
      display: flex;
      gap: 10px;
    }

    .btn-pro {
      background: linear-gradient(135deg, var(--accent-gold), #aa820a);
      color: #000;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .btn-icon {
      background: transparent;
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      width: 34px;
      height: 34px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .workspace {
      display: flex;
      flex: 1;
      height: calc(100vh - 50px);
    }

    .left-panel {
      width: 320px;
      background: var(--panel-bg);
      border-right: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
    }

    .panel-tabs {
      display: flex;
      border-bottom: 1px solid var(--panel-border);
      background: #17171c;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 4px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }

    .tab-btn.active {
      color: var(--accent-gold);
      border-bottom-color: var(--accent-gold);
      background: var(--panel-bg);
    }

    .tab-content {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Galería de Figurines */
    .figurine-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .figurine-card {
      background: #262630;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .figurine-card:hover {
      border-color: var(--accent-gold);
      transform: translateY(-2px);
    }

    .figurine-card img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      background: #ffffff;
      border-radius: 4px;
    }

    .figurine-card span {
      display: block;
      font-size: 0.75rem;
      margin-top: 6px;
      color: var(--text-main);
    }

    /* Botón Cargar Personalizado */
    .upload-btn-wrapper {
      margin-bottom: 15px;
    }

    .upload-btn-wrapper input[type=file] {
      display: none;
    }

    .btn-upload {
      width: 100%;
      padding: 10px;
      background: #2a2a35;
      border: 1px dashed var(--accent-gold);
      color: var(--accent-gold);
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* Lista de Capas */
    .layer-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .layer-item {
      background: #262630;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .layer-item.active {
      border-color: var(--accent-gold);
      background: #2d2d3a;
    }

    .layer-item span {
      flex: 1;
      font-size: 0.8rem;
    }

    /* Canvas Area */
    .canvas-viewport {
      flex: 1;
      background: #101014;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .canvas-card {
      background: #ffffff;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      border-radius: 4px;
    }

    .floating-tools {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30, 30, 36, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid var(--panel-border);
      padding: 6px 16px;
      border-radius: 30px;
      display: flex;
      gap: 16px;
      z-index: 10;
    }

    .tool-btn-float {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1rem;
      cursor: pointer;
    }

    .tool-btn-float.active {
      color: var(--accent-gold);
    }

    /* Right Panel */
    .right-panel {
      width: 250px;
      background: var(--panel-bg);
      border-left: 1px solid var(--panel-border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .color-swatches {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .swatch {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
    }

    .swatch.active {
      border-color: #fff;
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .slider-group label {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    .slider-group input {
      width: 100%;
      accent-color: var(--accent-gold);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <i class="fa-solid fa-wand-magic-sparkles" style="color: var(--accent-gold);"></i>
      Fashion Illustrator Pro <span>Studio</span>
    </div>
    <div class="top-actions">
      <button class="btn-icon" title="Limpiar Lienzo" onclick="clearCanvas()"><i class="fa-solid fa-trash-can"></i></button>
      <button class="btn-pro" onclick="exportDesign()"><i class="fa-solid fa-download"></i> Exportar</button>
    </div>
  </header>

  <div class="workspace">
    
    <!-- Panel Izquierdo -->
    <div class="left-panel">
      <div class="panel-tabs">
        <button class="tab-btn active" onclick="switchTab('figurines')">Figurines</button>
        <button class="tab-btn" onclick="switchTab('layers')">Capas</button>
        <button class="tab-btn" onclick="switchTab('brushes')">Pinceles</button>
      </div>

      <!-- Tab Figurines -->
      <div id="tab-figurines" class="tab-content active">
        <div class="section-title">Cargar Nuevos Figurines</div>
        <div class="upload-btn-wrapper">
          <label for="custom-figurine-input" class="btn-upload">
            <i class="fa-solid fa-file-arrow-up"></i> Subir Imagen desde el Móvil
          </label>
          <input type="file" id="custom-figurine-input" accept="image/*" onchange="uploadCustomFigurine(event)">
        </div>

        <div class="section-title">Modelos Guardados</div>
        <div class="figurine-grid">
          <!-- Modelo Femenino (Tus imágenes) -->
          <div class="figurine-card" onclick="loadFigurine('image_baa3c8.jpg')">
            <img src="image_baa3c8.jpg" alt="Modelo Femenino Frente y Espalda">
            <span>Modelo Femenina (Frente / Espalda)</span>
          </div>

          <!-- Modelo Masculino (Tus imágenes) -->
          <div class="figurine-card" onclick="loadFigurine('image_baa067.png')">
            <img src="image_baa067.png" alt="Modelo Masculino Anime">
            <span>Modelo Masculino</span>
          </div>
        </div>
      </div>

      <!-- Tab Capas -->
      <div id="tab-layers" class="tab-content">
        <div class="section-title">
          <span>Capas</span>
          <i class="fa-solid fa-plus" style="cursor:pointer;" onclick="addLayer()"></i>
        </div>
        <div class="layer-list" id="layer-container"></div>
        <div class="slider-group" style="margin-top: 15px;">
          <label>Visibilidad del Modelo Base <span id="base-opacity-val">60%</span></label>
          <input type="range" id="base-opacity" min="10" max="100" value="60" oninput="changeBaseOpacity(this.value)">
        </div>
      </div>

      <!-- Tab Pinceles -->
      <div id="tab-brushes" class="tab-content">
        <div class="section-title">Modo de Herramienta</div>
        <div style="display:flex; flex-direction:column; gap:8px;">
          <button class="btn-upload" onclick="setMode('draw')" style="border-style:solid;">
            <i class="fa-solid fa-pen"></i> Lápiz / Pincel Libre
          </button>
          <button class="btn-upload" onclick="setMode('select')" style="border-style:solid; background:transparent;">
            <i class="fa-solid fa-hand"></i> Mover / Seleccionar Trazo
          </button>
        </div>
      </div>
    </div>

    <!-- Area del Lienzo -->
    <div class="canvas-viewport">
      <div class="floating-tools">
        <button class="tool-btn-float" id="btn-select" onclick="setMode('select')" title="Seleccionar"><i class="fa-solid fa-hand"></i></button>
        <button class="tool-btn-float active" id="btn-draw" onclick="setMode('draw')" title="Dibujar"><i class="fa-solid fa-pen"></i></button>
        <button class="tool-btn-float" onclick="deleteActive()" title="Borrar Trazo"><i class="fa-solid fa-eraser"></i></button>
      </div>

      <div class="canvas-card">
        <canvas id="mainCanvas" width="450" height="650"></canvas>
      </div>
    </div>

    <!-- Panel Derecho (Colores y Tamaños) -->
    <div class="right-panel">
      <div class="section-title">Color de Tela / Trazo</div>
      <div class="color-swatches">
        <div class="swatch active" style="background: #000000;" onclick="setColor('#000000')"></div>
        <div class="swatch" style="background: #e63946;" onclick="setColor('#e63946')"></div>
        <div class="swatch" style="background: #d4af37;" onclick="setColor('#d4af37')"></div>
        <div class="swatch" style="background: #2a9d8f;" onclick="setColor('#2a9d8f')"></div>
        <div class="swatch" style="background: #1d3557;" onclick="setColor('#1d3557')"></div>
        <div class="swatch" style="background: #f4a261;" onclick="setColor('#f4a261')"></div>
        <div class="swatch" style="background: #ffffff;" onclick="setColor('#ffffff')"></div>
      </div>

      <div class="slider-group">
        <label>Grosor del Lápiz <span id="brush-size-val">3px</span></label>
        <input type="range" id="brush-size" min="1" max="40" value="3" oninput="updateBrushSize(this.value)">
      </div>
    </div>

  </div>

  <script>
    const canvas = new fabric.Canvas('mainCanvas', {
      isDrawingMode: true,
      backgroundColor: '#ffffff'
    });

    let activeLayerId = 2;
    let layers = [
      { id: 1, name: 'Base: Figurín', opacity: 0.6 },
      { id: 2, name: 'Capa 1: Trazo / Vestido', opacity: 1.0 }
    ];

    // Cargar Figurín en el Lienzo
    function loadFigurine(url) {
      fabric.Image.fromURL(url, function(img) {
        // Eliminar figurín anterior
        canvas.getObjects().forEach(obj => {
          if (obj.layerId === 1) canvas.remove(obj);
        });

        img.scaleToHeight(600);
        img.set({
          left: (canvas.width - img.scaledWidth) / 2,
          top: 25,
          selectable: false,
          evented: false,
          opacity: parseFloat(document.getElementById('base-opacity').value) / 100,
          layerId: 1
        });

        canvas.add(img);
        canvas.sendToBack(img);
        canvas.renderAll();
      });
    }

    // Subir Figurín Personalizado
    function uploadCustomFigurine(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(f) {
        loadFigurine(f.target.result);
      };
      reader.readAsDataURL(file);
    }

    // Cambiar opacidad de la figura de fondo
    function changeBaseOpacity(val) {
      document.getElementById('base-opacity-val').innerText = val + '%';
      canvas.getObjects().forEach(obj => {
        if (obj.layerId === 1) {
          obj.set('opacity', val / 100);
        }
      });
      canvas.renderAll();
    }

    // Herramientas de Dibujo
    function setMode(mode) {
      canvas.isDrawingMode = (mode === 'draw');
      document.getElementById('btn-draw').classList.toggle('active', mode === 'draw');
      document.getElementById('btn-select').classList.toggle('active', mode === 'select');
      if (mode === 'draw') setupBrush();
    }

    function setupBrush() {
      canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
      canvas.freeDrawingBrush.width = parseInt(document.getElementById('brush-size').value);
      canvas.freeDrawingBrush.color = currentColor;
    }

    let currentColor = '#000000';
    function setColor(color) {
      currentColor = color;
      if (canvas.freeDrawingBrush) canvas.freeDrawingBrush.color = color;
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
      event.target.classList.add('active');
    }

    function updateBrushSize(val) {
      document.getElementById('brush-size-val').innerText = val + 'px';
      if (canvas.freeDrawingBrush) canvas.freeDrawingBrush.width = parseInt(val);
    }

    canvas.on('path:created', function(e) {
      e.path.layerId = activeLayerId;
    });

    // Gestión de Capas UI
    function renderLayers() {
      const container = document.getElementById('layer-container');
      container.innerHTML = '';
      layers.slice().reverse().forEach(l => {
        const item = document.createElement('div');
        item.className = `layer-item ${l.id === activeLayerId ? 'active' : ''}`;
        item.onclick = () => { activeLayerId = l.id; renderLayers(); };
        item.innerHTML = `<span>${l.name}</span>`;
        container.appendChild(item);
      });
    }

    function addLayer() {
      const newId = layers.length + 1;
      layers.push({ id: newId, name: `Capa ${newId}: Trazo`, opacity: 1.0 });
      activeLayerId = newId;
      renderLayers();
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('tab-' + tabId).classList.add('active');
    }

    function deleteActive() {
      const active = canvas.getActiveObject();
      if (active) canvas.remove(active);
    }

    function clearCanvas() {
      canvas.clear();
      canvas.backgroundColor = '#ffffff';
    }

    function exportDesign() {
      const link = document.createElement('a');
      link.download = 'diseno-moda.png';
      link.href = canvas.toDataURL({ format: 'png', quality: 1.0 });
      link.click();
    }

    // Inicializar con la modelo femenina por defecto
    setupBrush();
    renderLayers();
    loadFigurine('image_baa3c8.jpg');
  </script>
</body>
</html>
