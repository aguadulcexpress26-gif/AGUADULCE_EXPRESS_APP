<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Aguadulce Express - Cocina Móvil</title>
    
    <!-- PWA manifest específico para cocina móvil -->
    <link rel="manifest" href="/AGUADULCE_EXPRESS_APP/cocina/manifest-cocina.json">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/cCv7qsHf/IMAGEN-PNG-512.jpg">
    <meta name="theme-color" content="#f59e0b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cocina AE">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #020617; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        .card-pedido { 
            background: #0f172a; 
            border: 1px solid #1e293b; 
            border-radius: 16px; 
            padding: 14px; 
            margin-bottom: 10px; 
        }
        
        .badge { 
            background: rgba(6,182,212,0.2); 
            color: #06b6d4; 
            padding: 4px 10px; 
            border-radius: 30px; 
            font-size: 10px; 
            font-weight: bold; 
            display: inline-block; 
        }
        .badge-warning { background: rgba(245,158,11,0.2); color: #f59e0b; }
        .badge-success { background: rgba(34,197,94,0.2); color: #22c55e; }
        .badge-danger { background: rgba(239,68,68,0.2); color: #ef4444; }
        
        .banner-container { position: relative; height: 160px; overflow: hidden; }
        .banner-img { width: 100%; height: 100%; object-fit: cover; object-position: center; }
        .overlay-gradient { background: linear-gradient(to top, rgba(2,6,23,0.5) 0%, transparent 35%, transparent 100%); }
        
        .stats-card { 
            background: linear-gradient(135deg, #0f172a 0%, #0a0f1a 100%); 
            border: 1px solid #1e293b; 
            border-radius: 16px; 
            padding: 8px 12px; 
        }
        .stats-number { font-size: 20px; font-weight: 800; }
        
        .tiempo-btn { transition: all 0.1s; cursor: pointer; }
        .tiempo-btn:active { transform: scale(0.95); }
        
        .tabs-container {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            background: #0f172a;
            padding: 6px;
            border-radius: 50px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .tab-btn {
            flex: 1;
            text-align: center;
            padding: 10px 8px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: bold;
            background: transparent;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.activo {
            background: #f59e0b;
            color: #020617;
        }
        .tab-contenido {
            display: none;
        }
        .tab-contenido.activo {
            display: block;
        }
        
        .lista-scroll {
            max-height: 55vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-right: 4px;
        }
        
        .contador-badge {
            background: #f59e0b;
            color: #020617;
            border-radius: 20px;
            padding: 2px 8px;
            font-size: 10px;
            font-weight: bold;
            margin-left: 6px;
        }
        
        @media (max-width: 480px) {
            .banner-container { height: 130px; }
            .stats-number { font-size: 16px; }
            .card-pedido { padding: 10px; }
            .tab-btn { font-size: 11px; padding: 8px 4px; }
        }
    </style>
</head>
<body>

<div id="loginScreen" class="min-h-screen flex flex-col items-center justify-center p-5">
    <h1 class="text-4xl font-black italic uppercase text-cyan-400 mb-8 text-center">Aguadulce</h1>
    <p class="text-white/50 text-xs mb-4 text-center">🔐 PIN DEL RESTAURANTE</p>
    <input type="password" id="pinInput" maxlength="10" class="w-full max-w-[250px] p-4 rounded-2xl bg-white/5 border border-white/10 text-center text-2xl tracking-widest text-white">
    <button onclick="verificarPIN()" class="mt-6 bg-cyan-400 text-black px-8 py-3 rounded-2xl font-black uppercase block mx-auto">Ingresar</button>
</div>

<div id="appContent" class="hidden min-h-screen pb-5">
    
    <div class="banner-container relative">
        <img id="restauranteFoto" class="banner-img" src="">
        <div class="absolute inset-0 overlay-gradient"></div>
        <div class="absolute bottom-0 left-0 right-0 p-3 flex justify-between items-end">
            <div>
                <span class="text-cyan-400 text-[9px] font-bold uppercase backdrop-blur-sm bg-black/30 px-2 py-1 rounded-lg">📍 COCINA MÓVIL</span>
                <h1 id="restauranteNombre" class="text-lg font-black text-white drop-shadow-lg mt-1">CARGANDO...</h1>
            </div>
            <div class="flex items-center gap-2">
                <div id="contenedorBotonTienda"></div>
                <button onclick="preguntarSalir()" class="bg-white/10 backdrop-blur-sm px-2 py-1 rounded-xl text-xs">🚪 SALIR</button>
            </div>
        </div>
    </div>

    <div class="p-3 flex flex-wrap justify-between items-center gap-2 border-b border-white/10">
        <div class="flex gap-2 flex-wrap">
            <div class="badge">📥 <span id="totalPendientes">0</span></div>
            <div class="badge badge-warning">🍳 <span id="totalCocina">0</span></div>
            <div class="badge badge-success">✅ <span id="totalHistorial">0</span></div>
        </div>
        <div class="flex gap-2">
            <div class="stats-card text-center">
                <div class="text-[8px] text-white/40">💰 HOY</div>
                <div class="stats-number text-white"><span id="statHoy">0</span>€</div>
            </div>
            <div class="stats-card text-center">
                <div class="text-[8px] text-white/40">📅 SEMANA</div>
                <div class="stats-number text-white"><span id="statSemana">0</span>€</div>
            </div>
            <button id="btnActivarSonido" class="bg-yellow-500/20 text-yellow-400 text-[10px] px-2 py-1 rounded-full">🔊</button>
        </div>
    </div>

    <div class="p-3">
        <div class="tabs-container">
            <div class="tab-btn activo" data-tab="entrantes">
                📥 ENTRANTES <span id="badgeEntrantes" class="contador-badge">0</span>
            </div>
            <div class="tab-btn" data-tab="cocina">
                🍳 COCINA <span id="badgeCocina" class="contador-badge">0</span>
            </div>
            <div class="tab-btn" data-tab="historial">
                ✅ HISTORIAL
            </div>
        </div>

        <div id="tabEntrantes" class="tab-contenido activo">
            <div id="listaEntrantes" class="lista-scroll"></div>
        </div>

        <div id="tabCocina" class="tab-contenido">
            <div id="listaCocina" class="lista-scroll"></div>
        </div>

        <div id="tabHistorial" class="tab-contenido">
            <div id="listaHistorial" class="lista-scroll"></div>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // CONFIGURACIÓN FIREBASE
    // ==========================================
    const firebaseConfig = {
        apiKey: "AIzaSyCJcLQ0ikUwZSV7L_8mLLax8B5qnhP0Roc",
        authDomain: "aguadulce-notificaciones.firebaseapp.com",
        databaseURL: "https://aguadulce-notificaciones-default-rtdb.firebaseio.com",
        projectId: "aguadulce-notificaciones",
        storageBucket: "aguadulce-notificaciones.firebasestorage.app",
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // URL del script solo para validar PIN
    const scriptURL = "https://script.google.com/macros/s/AKfycbzYFDShcrP7I4FKhiH3q5UcEInpSKJstrumJ9ddI4Tj9S31ZUgwiuie81fGFmCJ6ob2/exec";

    let miRestauranteId = localStorage.getItem('AE_REST_ID') || "";
    let pedidos = [];
    let sonidosActivados = false;
    let audioNotif = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
    audioNotif.volume = 0.8;
    
    let ultimosIdsNotificados = new Set();
    let miRestauranteData = null;

    // ==========================================
    // FUNCIONES
    // ==========================================
    
    async function solicitarPermisoNotificaciones() {
        if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
            await Notification.requestPermission();
        }
    }

    function escapeHTML(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

       async function validarPINConServidor(pin) {
        try {
            const formData = new URLSearchParams();
            formData.append('action', 'validarPIN');
            formData.append('pin', pin);

            const response = await fetch(scriptURL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData.toString()
            });
            const data = await response.json();
            return data;
        } catch(e) {
            console.error("Error validando PIN:", e);
            return { valido: false, error: e.message };
        }
    }
    function activarSonidoGlobal() {
        if (!sonidosActivados) {
            sonidosActivados = true;
            audioNotif.play().then(() => audioNotif.pause()).catch(e => console.log);
            Swal.fire({ title: '🔊 Sonido activado', icon: 'success', timer: 1500, showConfirmButton: false });
        }
    }

    async function alternarEstadoTienda(estadoActual) {
        const nuevoEstado = estadoActual === "ABIERTO" ? "CERRADO" : "ABIERTO";
        const confirmar = await Swal.fire({
            title: `${nuevoEstado === "ABIERTO" ? "🟢" : "🔴"} ¿Cambiar estado?`,
            showCancelButton: true,
            background: "#1e293b", color: "#fff"
        });
        if (!confirmar.isConfirmed) return;
        await database.ref('restaurantes_estado/' + miRestauranteId).set({ estado: nuevoEstado, timestamp: Date.now() });
        cargarPedidos();
    }

    function calcularTiempo(fechaStr) {
        if (!fechaStr) return "---";
        let diff = Math.floor((new Date() - new Date(fechaStr)) / 60000);
        if (diff < 1) return "Ahora";
        if (diff < 60) return `Hace ${diff} min`;
        return `Hace ${Math.floor(diff/60)}h`;
    }

    async function cargarPedidos() {
        if (!miRestauranteId) return;
        try {
            // Leer desde Firebase
            const snapshot = await database.ref('pedidos').once('value');
            const todosPedidos = snapshot.val() || {};
            
            const pedidosRestaurante = [];
            for (const id in todosPedidos) {
                const p = todosPedidos[id];
                if (p.restaurante_id === miRestauranteId || p.ID_RESTAURANTE === miRestauranteId) {
                    p.id = id;
                    p.ID_PEDIDO = id;
                    pedidosRestaurante.push(p);
                }
            }
            
            // Calcular stats
            const hoy = new Date().toLocaleDateString('es-ES');
            const ahora = new Date();
            const diaSemana = ahora.getDay();
            const inicioSemana = new Date(ahora);
            inicioSemana.setDate(ahora.getDate() - (diaSemana === 0 ? 6 : diaSemana - 1));
            const fechaInicioSemana = inicioSemana.toLocaleDateString('es-ES');
            
            let diaria = 0, semanal = 0;
            const entrantes = [];
            const cocina = [];
            const historial = [];
            
            for (const p of pedidosRestaurante) {
                const fecha = p.fecha ? new Date(p.fecha).toLocaleDateString('es-ES') : '';
                const total = parseFloat(p.total || p.TOTAL || 0);
                const estado = (p.estado || p.ESTADO || 'RECIBIDO').toUpperCase();
                
                if (estado !== 'RECHAZADO' && estado !== 'CANCELADO') {
                    if (fecha === hoy) diaria += total;
                    if (fecha >= fechaInicioSemana) semanal += total;
                }
                
                if (estado === 'RECIBIDO' || estado === 'NUEVO' || estado === '') {
                    entrantes.push(p);
                } else if (estado === 'EN PROCESO' || estado === 'LISTO') {
                    cocina.push(p);
                } else {
                    historial.push(p);
                }
            }
            
            document.getElementById('statHoy').innerHTML = diaria.toFixed(2);
            document.getElementById('statSemana').innerHTML = semanal.toFixed(2);
            document.getElementById('totalPendientes').innerText = entrantes.length;
            document.getElementById('totalCocina').innerText = cocina.length;
            document.getElementById('totalHistorial').innerText = historial.length;
            document.getElementById('badgeEntrantes').innerText = entrantes.length;
            document.getElementById('badgeCocina').innerText = cocina.length;
            
            // Notificaciones de nuevos pedidos
            const nuevosIds = new Set(entrantes.map(p => p.id));
            for (const id of nuevosIds) {
                if (!ultimosIdsNotificados.has(id)) {
                    const pedidoNuevo = entrantes.find(p => p.id === id);
                    if (pedidoNuevo && Notification.permission === "granted") {
                        new Notification("🍽️ NUEVO PEDIDO", {
                            body: `Pedido #${id}`,
                            icon: "https://i.postimg.cc/cCv7qsHf/IMAGEN-PNG-512.jpg"
                        });
                    }
                    if (sonidosActivados) {
                        audioNotif.play().catch(e => console.log);
                    }
                }
            }
            ultimosIdsNotificados = nuevosIds;
            
            // Renderizar
            document.getElementById('listaEntrantes').innerHTML = entrantes.map(p => renderCardEntrante(p)).join('');
            document.getElementById('listaCocina').innerHTML = cocina.map(p => renderCardCocina(p)).join('');
            document.getElementById('listaHistorial').innerHTML = historial.map(p => renderCardHistorial(p)).join('');
            
            // Cargar datos del restaurante
            const restoSnap = await database.ref('restaurantes').once('value');
            const restaurantes = restoSnap.val();
            let restauranteInfo = null;
            if (restaurantes && Array.isArray(restaurantes)) {
                restauranteInfo = restaurantes.find(r => r.ID_RESTAURANTE === miRestauranteId);
            } else if (restaurantes && typeof restaurantes === 'object') {
                for (const key in restaurantes) {
                    if (restaurantes[key].ID_RESTAURANTE === miRestauranteId) {
                        restauranteInfo = restaurantes[key];
                        break;
                    }
                }
            }
            
            if (restauranteInfo) {
                document.getElementById('restauranteNombre').innerText = restauranteInfo.NOMBRE_RESTAURANTE || restauranteInfo.NOMBRE || "Restaurante";
                const fotoElement = document.getElementById('restauranteFoto');
                if (restauranteInfo.FOTO && fotoElement.src !== restauranteInfo.FOTO) {
                    fotoElement.src = restauranteInfo.FOTO;
                }
                
                const estadoTienda = restauranteInfo.ESTADO || "CERRADO";
                const btnClase = estadoTienda === "ABIERTO" ? "bg-emerald-500/20 text-emerald-400" : "bg-rose-500/20 text-rose-400";
                document.getElementById('contenedorBotonTienda').innerHTML = `
                    <button onclick="alternarEstadoTienda('${estadoTienda}')" class="px-2 py-1 rounded-lg font-bold text-[10px] ${btnClase}">
                        ${estadoTienda === "ABIERTO" ? "🟢 ABIERTO" : "🔴 CERRADO"}
                    </button>
                `;
            }
            
        } catch (error) {
            console.error("Error:", error);
        }
    }

    function renderCardEntrante(p) {
        const total = parseFloat(p.total || p.TOTAL || 0);
        const fecha = p.fecha;
        return `<div class="card-pedido">
            <div class="flex justify-between items-start">
                <div>
                    <span class="text-cyan-400 font-bold text-sm">#${p.id}</span>
                    <p class="text-white text-sm font-bold mt-1">${escapeHTML(p.cliente || p.CLIENTE || 'Cliente')}</p>
                    <p class="text-white/60 text-[11px] mt-1">${escapeHTML((p.PEDIDO_DETALLE || p.pedido_detalle || '').substring(0, 50))}...</p>
                </div>
                <div class="text-right">
                    <span class="text-white/40 text-[10px]">${calcularTiempo(fecha)}</span>
                    <p class="text-emerald-400 font-bold text-sm">${total.toFixed(2)}€</p>
                </div>
            </div>
            <div class="flex gap-2 mt-3">
                <button onclick="aceptarPedido('${p.id}')" class="bg-cyan-500 text-black font-bold px-3 py-2 rounded-xl text-xs flex-1">✅ ACEPTAR</button>
                <button onclick="rechazarPedido('${p.id}')" class="bg-red-600 text-white font-bold px-3 py-2 rounded-xl text-xs flex-1">❌ RECHAZAR</button>
            </div>
        </div>`;
    }

    function renderCardCocina(p) {
        const estaListo = (p.estado || p.ESTADO || '').toUpperCase() === 'LISTO';
        const total = parseFloat(p.total || p.TOTAL || 0);
        return `<div class="card-pedido ${estaListo ? 'opacity-50' : ''}">
            <div class="flex justify-between">
                <span class="text-amber-400 font-bold text-sm">#${p.id}</span>
                <span class="text-emerald-400 font-bold text-sm">${total.toFixed(2)}€</span>
            </div>
            <p class="text-white text-sm font-bold mt-1">${escapeHTML(p.cliente || p.CLIENTE || 'Cliente')}</p>
            <p class="text-white/60 text-[11px]">📦 ${escapeHTML((p.PEDIDO_DETALLE || p.pedido_detalle || '').substring(0, 50))}...</p>
            <div class="flex gap-2 mt-3 flex-wrap">
                <button onclick="verDetallePedido('${p.id}')" class="bg-white/10 text-white px-2 py-1.5 rounded-xl text-[10px]">📋 DETALLE</button>
                <button onclick="asignarTiempo('${p.id}', 15, this)" class="tiempo-btn bg-cyan-500/20 text-cyan-400 px-2 py-1.5 rounded-xl text-[10px]">15'</button>
                <button onclick="asignarTiempo('${p.id}', 30, this)" class="tiempo-btn bg-cyan-500/20 text-cyan-400 px-2 py-1.5 rounded-xl text-[10px]">30'</button>
                <button onclick="asignarTiempo('${p.id}', 45, this)" class="tiempo-btn bg-cyan-500/20 text-cyan-400 px-2 py-1.5 rounded-xl text-[10px]">45'</button>
                <button onclick="marcarListo('${p.id}')" class="bg-emerald-600 text-white px-2 py-1.5 rounded-xl text-[10px]">✅ LISTO</button>
            </div>
        </div>`;
    }

    function renderCardHistorial(p) {
        const total = parseFloat(p.total || p.TOTAL || 0);
        let estadoTexto = p.estado || p.ESTADO || 'ENTREGADO';
        return `<div class="card-pedido">
            <div class="flex justify-between items-center mb-2">
                <span class="text-emerald-400 font-bold text-sm">#${p.id}</span>
                <span class="text-white font-bold text-sm">${total.toFixed(2)}€</span>
            </div>
            <p class="text-white/70 text-xs">${escapeHTML(p.cliente || p.CLIENTE || 'Cliente')}</p>
            <p class="text-white/40 text-[10px] mt-1">🛵 ${escapeHTML(p.repartidor || p.REPARTIDOR || 'Sin repartidor')} - ${estadoTexto}</p>
            <div class="mt-2 pt-2 border-t border-white/5">
                <button onclick="verDetallePedido('${p.id}')" class="w-full bg-white/5 text-white py-1 rounded-lg text-[10px]">📋 VER DETALLE</button>
            </div>
        </div>`;
    }

    async function verDetallePedido(id) {
        const snap = await database.ref('pedidos/' + id).once('value');
        const p = snap.val();
        if (p) {
            Swal.fire({
                title: `Pedido #${id}`,
                html: `<div class="text-left">
                    <p><strong>👤 Cliente:</strong> ${escapeHTML(p.cliente || 'Sin nombre')}</p>
                    <p><strong>📍 Dirección:</strong> ${escapeHTML(p.direccion || 'No especificada')}</p>
                    <p><strong>📞 Teléfono:</strong> ${escapeHTML(p.telefono || 'No especificado')}</p>
                    <p><strong>💳 Pago:</strong> ${escapeHTML(p.metodo_pago || 'Efectivo')}</p>
                    <p><strong>💰 Total:</strong> ${(parseFloat(p.total || 0)).toFixed(2)}€</p>
                    <hr class="my-2 border-white/10">
                    <p><strong>📦 Detalle:</strong></p>
                    <p style="white-space: pre-wrap; font-size: 12px;">${escapeHTML(p.PEDIDO_DETALLE || p.pedido_detalle || '')}</p>
                </div>`,
                background: '#020617', color: 'white', confirmButtonColor: '#f59e0b',
                confirmButtonText: 'Cerrar'
            });
        }
    }

    async function aceptarPedido(id) {
        await database.ref('pedidos/' + id).update({ estado: 'EN PROCESO', ESTADO: 'EN PROCESO', timestamp_inicio: Date.now() });
        cargarPedidos();
    }

    async function rechazarPedido(id) {
        const confirmar = await Swal.fire({
            title: '¿Rechazar pedido?',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#ef4444',
            background: '#1e293b', color: 'white'
        });
        if (!confirmar.isConfirmed) return;
        await database.ref('pedidos/' + id).update({ estado: 'RECHAZADO', ESTADO: 'RECHAZADO' });
        cargarPedidos();
    }

    async function asignarTiempo(id, minutos, btn) {
        btn.disabled = true;
        btn.classList.add('bg-green-600', 'text-white');
        await database.ref('pedidos/' + id).update({ tiempo_seleccionado: minutos, estado: 'EN PROCESO', ESTADO: 'EN PROCESO' });
        cargarPedidos();
    }

    async function marcarListo(id) {
        await database.ref('pedidos/' + id).update({ estado: 'LISTO', ESTADO: 'LISTO', timestamp_listo: Date.now() });
        cargarPedidos();
    }

    function preguntarSalir() {
        Swal.fire({
            title: '¿Cerrar sesión?',
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            confirmButtonText: 'Sí, salir',
            background: '#1e293b', color: 'white'
        }).then(result => {
            if (result.isConfirmed) {
                localStorage.removeItem('AE_REST_ID');
                localStorage.removeItem('AE_REST_NOMBRE');
                location.reload();
            }
        });
    }

    function initTabs() {
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.getAttribute('data-tab');
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('activo'));
                document.querySelectorAll('.tab-contenido').forEach(c => c.classList.remove('activo'));
                btn.classList.add('activo');
                if (tab === 'entrantes') document.getElementById('tabEntrantes').classList.add('activo');
                if (tab === 'cocina') document.getElementById('tabCocina').classList.add('activo');
                if (tab === 'historial') document.getElementById('tabHistorial').classList.add('activo');
            });
        });
    }

    function iniciarEscuchaTiempoReal() {
        const pedidosRef = database.ref('pedidos');
        pedidosRef.on('value', () => {
            cargarPedidos();
        });
    }

    async function iniciarApp() {
        await solicitarPermisoNotificaciones();
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('appContent').classList.remove('hidden');
        initTabs();
        await cargarPedidos();
        iniciarEscuchaTiempoReal();
        setInterval(cargarPedidos, 5000);
    }

    (async function() {
        const nombreGuardado = localStorage.getItem('AE_REST_NOMBRE');
        if (miRestauranteId && nombreGuardado) {
            iniciarApp();
        } else {
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('appContent').classList.add('hidden');
        }
    })();

    document.getElementById('btnActivarSonido')?.addEventListener('click', activarSonidoGlobal);
    
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/AGUADULCE_EXPRESS_APP/cocina/sw-cocina.js').catch(e => console.log);
    }
</script>
</body>
</html>
