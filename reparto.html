<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AE COCINA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* ESTILOS PROPIOS - SIN TAILWIND */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: #020617; 
            color: white; 
            min-height: 100vh;
        }
        
        /* NAVBAR */
        .navbar {
            position: sticky;
            top: 0;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 16px;
            z-index: 40;
        }
        .navbar-inner {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .logo {
            color: #06b6d4;
            font-weight: 900;
            font-style: italic;
            font-size: 20px;
        }
        .restaurante-nombre {
            color: white;
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            margin-top: 4px;
        }
        .status-area {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .estado-texto {
            font-size: 8px;
            font-weight: 900;
            text-transform: uppercase;
            text-align: right;
        }
        .abierto { color: #4ade80; }
        .cerrado { color: #ef4444; }
        
        /* SWITCH */
        .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #06b6d4; }
        input:checked + .slider:before { transform: translateX(22px); }
        
        /* CARDS */
        .card-stats {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 24px;
            padding: 16px;
            text-align: center;
        }
        .stats-label {
            font-size: 8px;
            font-weight: 900;
            color: #64748b;
            text-transform: uppercase;
        }
        .stats-value {
            font-size: 20px;
            font-weight: 900;
            color: white;
        }
        .stats-value-cyan { color: #06b6d4; }
        
        /* PEDIDOS */
        .pedido-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 32px;
            padding: 24px;
            margin-bottom: 16px;
        }
        .pedido-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }
        .pedido-id {
            color: #06b6d4;
            font-weight: 900;
            font-size: 24px;
            font-style: italic;
        }
        .pedido-cliente {
            color: white;
            font-weight: 900;
            font-size: 10px;
            text-transform: uppercase;
            opacity: 0.6;
            margin-top: 4px;
        }
        .pedido-total {
            font-size: 20px;
            font-weight: 900;
            color: white;
        }
        .tiempo-transcurrido {
            font-size: 8px;
            color: #06b6d4;
            margin-top: 4px;
        }
        
        /* BOTONES TIEMPO */
        .tiempos {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .btn-tiempo {
            flex: 1;
            padding: 12px;
            border-radius: 16px;
            font-size: 9px;
            font-weight: 900;
            font-style: italic;
            border: none;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-tiempo:active { transform: scale(0.95); }
        .t-15 { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
        .t-30 { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); }
        .t-45 { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
        
        /* BOTONES ACCIÓN */
        .acciones {
            display: flex;
            gap: 8px;
        }
        .btn-aceptar {
            flex: 1;
            padding: 16px;
            border-radius: 20px;
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            background: white;
            color: black;
        }
        .btn-aceptar.aceptado {
            background: #1e293b;
            color: #64748b;
        }
        .btn-detalles {
            flex: 1;
            padding: 16px;
            border-radius: 20px;
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            background: #1e293b;
            color: #06b6d4;
            border: 1px solid rgba(6,182,212,0.2);
        }
        .btn-listo {
            flex: 1;
            padding: 16px;
            border-radius: 20px;
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            background: #06b6d4;
            color: black;
        }
        
        /* CONTADOR */
        .contador {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ef4444;
            color: white;
            font-size: 10px;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 999px;
        }
        
        /* LAYOUT */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }
        .hidden { display: none; }
        
        /* LOGIN */
        .login-screen {
            position: fixed;
            inset: 0;
            background: #020617;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 32px;
            width: 100%;
            max-width: 320px;
            text-align: center;
        }
        .login-input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 16px;
            text-align: center;
            font-size: 24px;
            font-weight: 900;
            color: #06b6d4;
            margin-bottom: 16px;
        }
        .login-btn {
            width: 100%;
            background: #06b6d4;
            color: black;
            padding: 16px;
            border-radius: 20px;
            font-weight: 900;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
        }
        
        /* BOTÓN SALIR */
        .btn-logout {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .text-center { text-align: center; }
        .py-20 { padding-top: 80px; padding-bottom: 80px; }
        .opacity-20 { opacity: 0.2; }
        .relative { position: relative; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>

    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <div style="color:#06b6d4; font-weight:900; font-style:italic; font-size:30px;">AE</div>
            <h2 style="color:white; font-weight:900; font-style:italic; margin-bottom:24px;">Cocina</h2>
            <input type="text" id="pinInput" class="login-input" placeholder="PIN" autocomplete="off">
            <button onclick="verificarPIN()" class="login-btn">Entrar</button>
        </div>
    </div>

    <div id="appContent" class="hidden">
        <div class="navbar">
            <div class="navbar-inner">
                <div>
                    <div class="logo">AGUADULCE EXPRESS</div>
                    <div id="resNombreDisplay" class="restaurante-nombre">Cargando...</div>
                </div>
                <div class="status-area">
                    <div class="relative">
                        <button onclick="abrirHistorial()" style="background:rgba(255,255,255,0.05); padding:8px; border-radius:16px; border:1px solid rgba(255,255,255,0.1);">
                            📋
                        </button>
                        <span id="contadorPendientes" class="contador">0</span>
                    </div>
                    <div>
                        <div id="txtEstado" class="estado-texto abierto">---</div>
                        <label class="switch">
                            <input type="checkbox" id="tiendaToggle" onchange="confirmarToggleTienda()">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div class="container">
            <div class="grid-2">
                <div class="card-stats">
                    <div class="stats-label">HOY</div>
                    <div id="statHoy" class="stats-value">0.00€</div>
                </div>
                <div class="card-stats">
                    <div class="stats-label">SEMANA</div>
                    <div id="statSemana" class="stats-value stats-value-cyan">0.00€</div>
                </div>
            </div>
            <div id="lista"></div>
        </div>

        <button onclick="preguntarSalir()" class="btn-logout">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        </button>
    </div>

    <!-- MODALES (simplificados) -->
    <div id="customModal" class="hidden" style="position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(0,0,0,0.85); backdrop-filter:blur(12px);">
        <div style="background:rgba(30,41,59,0.9); width:100%; max-width:320px; border-radius:40px; padding:24px; border:1px solid rgba(255,255,255,0.1);">
            <h3 id="modalTitle" style="text-align:center; color:#06b6d4; font-weight:900; font-style:italic; margin-bottom:16px;"></h3>
            <div id="modalBody" style="background:rgba(0,0,0,0.5); padding:20px; border-radius:20px; font-size:10px; color:white; margin-bottom:24px;"></div>
            <div id="modalFooter" class="acciones"></div>
        </div>
    </div>

    <div id="sideHistorial" class="hidden" style="position:fixed; top:0; right:0; bottom:0; width:100%; max-width:320px; background:rgba(30,41,59,0.95); backdrop-filter:blur(12px); z-index:50; padding:24px; overflow-y:auto; transform:translateX(100%); transition:transform 0.3s;">
        <div style="display:flex; justify-content:space-between; margin-bottom:24px;">
            <h2 style="color:#06b6d4; font-weight:900; font-style:italic;">Historial Hoy</h2>
            <button onclick="cerrarHistorial()" style="color:white;">Cerrar</button>
        </div>
        <div id="listaHistorial"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCJcLQ0ikUwZSV7L_8mLLax8B5qnhP0Roc",
            authDomain: "aguadulce-notificaciones.firebaseapp.com",
            databaseURL: "https://aguadulce-notificaciones-default-rtdb.firebaseio.com",
            projectId: "aguadulce-notificaciones",
            storageBucket: "aguadulce-notificaciones.firebasestorage.app",
            messagingSenderId: "940283725281",
            appId: "1:940283725281:web:3b388d2e7f362a99d2bea0"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const ACCESS_DB = { "DELI10":"6G4L1V", "CHUN20":"RT33M5", "HARO30":"8N3Z7K", "SUCU40":"TR92X5", "PERU50":"9V1L8K", "LIMA60":"FL44K8", "PECA70":"CV11Q9" };
        const scriptURL = "https://script.google.com/macros/s/AKfycbzYFDShcrP7I4FKhiH3q5UcEInpSKJstrumJ9ddI4Tj9S31ZUgwiuie81fGFmCJ6ob2/exec";
        
        let MI_ID_REST = localStorage.getItem('AE_REST_ID') || "";
        let pedidosActivos = [], historialHoy = [], aceptados = new Set(), tiendaAbierta = false;
        let ultimoConteo = 0;

        window.onload = () => { if(MI_ID_REST) iniciarApp(); };

        function verificarPIN() {
            const pin = document.getElementById('pinInput').value.trim().toUpperCase();
            if (ACCESS_DB[pin]) {
                MI_ID_REST = ACCESS_DB[pin];
                localStorage.setItem('AE_REST_ID', MI_ID_REST);
                iniciarApp();
            } else { alert("PIN INCORRECTO"); }
        }

        function iniciarApp() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('appContent').classList.remove('hidden');
            database.ref('pedidosActivos').on('value', () => cargar());
            setInterval(cargar, 30000);
            cargar();
        }

        async function cargar() {
            try {
                const r = await fetch(`${scriptURL}?action=leerPanelCompleto&idRest=${MI_ID_REST}&t=${Date.now()}`);
                const data = await r.json();
                
                if(data.tienda) {
                    document.getElementById('resNombreDisplay').innerText = data.tienda.nombre || "Establecimiento";
                    const est = (data.tienda.estado || "").trim().toLowerCase();
                    tiendaAbierta = (est === "abierto");
                    document.getElementById('tiendaToggle').checked = tiendaAbierta;
                    const txtE = document.getElementById('txtEstado');
                    txtE.innerText = tiendaAbierta ? "ABIERTO" : "CERRADO";
                    txtE.className = tiendaAbierta ? "estado-texto abierto" : "estado-texto cerrado";
                }

                const stats = data.stats || {};
                document.getElementById('statHoy').innerText = (stats.diaria || "0.00") + "€";
                document.getElementById('statSemana').innerText = (stats.semanal || "0.00") + "€";
                
                pedidosActivos = (data.pedidos || []).sort((a,b) => new Date(a.FECHA) - new Date(b.FECHA));
                historialHoy = data.historial || [];
                
                const nuevosPedidos = pedidosActivos.filter(p => !aceptados.has(p.ID_PEDIDO)).length;
                if(nuevosPedidos > ultimoConteo && nuevosPedidos > 0) {
                    if(navigator.vibrate) navigator.vibrate(500);
                }
                ultimoConteo = nuevosPedidos;
                document.getElementById('contadorPendientes').innerText = nuevosPedidos;
                
                render();
            } catch (e) { console.error(e); }
        }

        function calcularTiempoTranscurrido(fechaStr) {
            if(!fechaStr) return "---";
            const fechaPedido = new Date(fechaStr);
            const ahora = new Date();
            const diffMin = Math.floor((ahora - fechaPedido) / 60000);
            if(diffMin < 1) return "Ahora mismo";
            if(diffMin < 60) return `Hace ${diffMin} min`;
            return `Hace ${Math.floor(diffMin/60)}h ${diffMin%60}min`;
        }

        function render() {
            const cont = document.getElementById('lista');
            if(pedidosActivos.length === 0) {
                cont.innerHTML = `<div class="text-center py-20 opacity-20" style="color:white;">SIN PEDIDOS</div>`;
                return;
            }
            cont.innerHTML = pedidosActivos.map(p => `
                <div class="pedido-card">
                    <div class="pedido-header">
                        <div>
                            <div class="pedido-id">#${p.ID_PEDIDO}</div>
                            <div class="pedido-cliente">${p.CLIENTE}</div>
                            <div class="tiempo-transcurrido">⏱️ ${calcularTiempoTranscurrido(p.FECHA)}</div>
                        </div>
                        <div class="pedido-total">${parseFloat(p.TOTAL).toFixed(2)}€</div>
                    </div>
                    <div class="tiempos">
                        <button onclick="asignarTiempo('${p.ID_PEDIDO}', 15)" class="btn-tiempo t-15">15 MIN</button>
                        <button onclick="asignarTiempo('${p.ID_PEDIDO}', 30)" class="btn-tiempo t-30">30 MIN</button>
                        <button onclick="asignarTiempo('${p.ID_PEDIDO}', 45)" class="btn-tiempo t-45">45 MIN</button>
                    </div>
                    <div class="acciones">
                        <button onclick="aceptarPedido('${p.ID_PEDIDO}')" class="${aceptados.has(p.ID_PEDIDO) ? 'btn-aceptar aceptado' : 'btn-aceptar'}">${aceptados.has(p.ID_PEDIDO) ? 'ACEPTADO' : 'ACEPTAR'}</button>
                        <button onclick="verDetalles('${p.ID_PEDIDO}')" class="btn-detalles">DETALLES</button>
                        <button onclick="confirmarListo('${p.ID_PEDIDO}')" class="btn-listo">LISTO</button>
                    </div>
                </div>
            `).join('');
        }

        async function aceptarPedido(id) { 
            aceptados.add(id); 
            render(); 
            await fetch(`${scriptURL}?action=actualizarEstado&idPedido=${id}&nuevoEstado=EN PROCESO`);
            cargar(); 
        }

        function verDetalles(id) {
            const p = pedidosActivos.find(x => x.ID_PEDIDO == id) || historialHoy.find(x => x.ID_PEDIDO == id);
            if(!p) return;
            const detalles = `PEDIDO #${p.ID_PEDIDO}\nCLIENTE: ${p.CLIENTE}\nDIR: ${p.DIRECCION}\n\n${p.PEDIDO_DETALLE || ''}\n\nTOTAL: ${p.TOTAL}€`;
            alert(detalles);
        }

        function confirmarListo(id) {
            if(confirm(`¿Pedido #${id} listo para reparto?`)) {
                ejecutarListo(id);
            }
        }

        async function ejecutarListo(id) { 
            await fetch(`${scriptURL}?action=actualizarEstado&idPedido=${id}&nuevoEstado=LISTO`); 
            cargar(); 
        }

        function confirmarToggleTienda() {
            const nuevo = !tiendaAbierta ? "Abierto" : "Cerrado";
            if(confirm(`¿Cambiar estado a ${nuevo.toUpperCase()}?`)) {
                ejecutarToggle(nuevo);
            } else {
                document.getElementById('tiendaToggle').checked = tiendaAbierta;
            }
        }

        async function ejecutarToggle(estado) { 
            await fetch(`${scriptURL}?action=toggleTienda&idRest=${MI_ID_REST}&sheet=configuracion&nuevoEstado=${estado}`); 
            setTimeout(cargar, 1000); 
        }

        function preguntarSalir() {
            if(confirm("¿Cerrar sesión?")) {
                localStorage.removeItem('AE_REST_ID');
                location.reload();
            }
        }

        function abrirHistorial() {
            const listaH = document.getElementById('listaHistorial');
            if (historialHoy.length === 0) {
                listaH.innerHTML = '<div style="text-align:center; opacity:0.5;">Vacío</div>';
            } else {
                listaH.innerHTML = historialHoy.map(p => `
                    <div style="background:rgba(255,255,255,0.05); padding:16px; border-radius:20px; margin-bottom:8px; cursor:pointer;" onclick="cerrarHistorial(); verDetalles('${p.ID_PEDIDO}')">
                        <div style="display:flex; justify-content:space-between; color:#06b6d4; font-weight:900;">#${p.ID_PEDIDO} ${parseFloat(p.TOTAL).toFixed(2)}€</div>
                        <div style="font-size:10px;">${p.CLIENTE}</div>
                    </div>
                `).join('');
            }
            document.getElementById('sideHistorial').style.transform = 'translateX(0)';
            document.getElementById('sideHistorial').classList.remove('hidden');
        }

        function cerrarHistorial() {
            document.getElementById('sideHistorial').style.transform = 'translateX(100%)';
            setTimeout(() => document.getElementById('sideHistorial').classList.add('hidden'), 300);
        }

        async function asignarTiempo(idPedido, minutos) {
            const ahora = new Date();
            const horaListo = new Date(ahora.getTime() + minutos * 60000);
            const horaFormateada = horaListo.getHours().toString().padStart(2, '0') + ":" + horaListo.getMinutes().toString().padStart(2, '0');
            try {
                await database.ref('pedidos/' + idPedido).update({
                    tiempoEstimado: minutos,
                    horaSalida: horaFormateada,
                    timestampListo: horaListo.getTime()
                });
                alert(`⏳ Pedido #${idPedido} listo a las ${horaFormateada}`);
            } catch (error) { console.error(error); }
        }
    </script>
</body>
</html>
