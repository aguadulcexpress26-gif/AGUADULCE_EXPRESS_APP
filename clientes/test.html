<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Firebase - Aguadulce Express</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #020617; color: white; font-family: monospace; padding: 20px; }
        .card { background: #0f172a; border-radius: 16px; padding: 16px; margin-bottom: 12px; border-left: 4px solid #06b6d4; }
        .verde { color: #22c55e; }
        .rojo { color: #ef4444; }
    </style>
</head>
<body>
    <h1 class="text-2xl font-bold mb-4">🧪 PRUEBA DE CONEXIÓN A FIREBASE</h1>
    <div id="resultados"></div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyCJcLQ0ikUwZSV7L_8mLLax8B5qnhP0Roc",
    authDomain: "aguadulce-notificaciones.firebaseapp.com",
    databaseURL: "https://aguadulce-notificaciones-default-rtdb.firebaseio.com/",
    projectId: "aguadulce-notificaciones",
    storageBucket: "aguadulce-notificaciones.appspot.com",
    messagingSenderId: "940283725281",
    appId: "1:940283725281:web:3b388d2e7f362a99d2bea0"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const database = firebase.database();

const resultados = document.getElementById('resultados');

async function probar() {
    resultados.innerHTML = '<div class="card">🔄 Conectando a Firebase...</div>';
    
    try {
        // Prueba 1: Restaurantes
        const restaurantesSnap = await database.ref('restaurantes').once('value');
        const restaurantes = restaurantesSnap.val();
        const numRest = restaurantes ? Object.keys(restaurantes).length : 0;
        
        // Prueba 2: Menú
        const menuSnap = await database.ref('menu_general').once('value');
        const menu = menuSnap.val();
        const numMenu = menu ? Object.keys(menu).length : 0;
        
        // Prueba 3: Horarios
        const horariosSnap = await database.ref('horarios_restaurantes').once('value');
        const horarios = horariosSnap.val();
        const numHorarios = horarios ? (Array.isArray(horarios) ? horarios.length : Object.keys(horarios).length) : 0;
        
        resultados.innerHTML = `
            <div class="card">
                <h2 class="font-bold text-cyan-400 mb-2">✅ CONEXIÓN EXITOSA</h2>
                <p>📦 Restaurantes: <span class="verde font-bold">${numRest}</span></p>
                <p>🍽️ Platos en menú: <span class="verde font-bold">${numMenu}</span></p>
                <p>🕒 Horarios cargados: <span class="verde font-bold">${numHorarios}</span></p>
            </div>
            <div class="card">
                <p class="text-sm text-white/60">🔍 Firebase está funcionando correctamente.</p>
                <p class="text-sm text-white/60 mt-2">Si ves estos números, el problema está en <span class="text-cyan-400">index.html</span>, no en Firebase.</p>
            </div>
        `;
        
    } catch (error) {
        resultados.innerHTML = `<div class="card"><h2 class="font-bold text-red-400 mb-2">❌ ERROR</h2><p class="text-red-400">${error.message}</p></div>`;
    }
}

probar();
</script>
</body>
</html>
