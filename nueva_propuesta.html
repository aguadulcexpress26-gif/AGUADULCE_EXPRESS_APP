<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Aguadulce 2.0 · Asistente IA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #020617;
            font-family: 'Inter', sans-serif;
            color: white;
            overflow-x: hidden;
        }

        /* ========== FONDO DE PARTÍCULAS (NEÓN) ========== */
        .particle-field {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            background: radial-gradient(circle, rgba(6,182,212,0.5) 0%, rgba(6,182,212,0) 80%);
            border-radius: 50%;
            animation: float linear infinite;
        }
        @keyframes float {
            0% { transform: translateY(100vh) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% { transform: translateY(-20vh) translateX(calc(100px * var(--dir))) rotate(360deg); opacity: 0; }
        }

        /* ========== HEADER HOLOGRAMA ========== */
        .hero {
            position: relative;
            background: linear-gradient(135deg, rgba(6,182,212,0.15) 0%, rgba(6,182,212,0) 100%);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(6,182,212,0.3);
            padding: 1.5rem 1.5rem 2.5rem;
            z-index: 2;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: -50%;
            width: 200%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(6,182,212,0.2), transparent);
            animation: sweep 6s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes sweep {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .logo {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fff, #06b6d4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 10px rgba(6,182,212,0.3);
        }
        .tagline {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            color: #06b6d4;
            letter-spacing: 2px;
        }

        /* ========== TARJETAS NEÓN ========== */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 1.5rem;
            position: relative;
            z-index: 2;
        }
        .restaurant-card {
            background: linear-gradient(135deg, rgba(15,23,42,0.9), rgba(15,23,42,0.7));
            backdrop-filter: blur(12px);
            border: 1px solid rgba(6,182,212,0.3);
            border-radius: 2rem;
            margin-bottom: 1.25rem;
            overflow: hidden;
            transition: all 0.25s ease;
            cursor: pointer;
            animation: fadeUp 0.5s cubic-bezier(0.2,0.9,0.4,1.1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        .restaurant-card:nth-child(1) { animation-delay: 0.05s; }
        .restaurant-card:nth-child(2) { animation-delay: 0.12s; }
        .restaurant-card:nth-child(3) { animation-delay: 0.19s; }
        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }
        .restaurant-card:hover {
            border-color: #06b6d4;
            box-shadow: 0 0 25px rgba(6,182,212,0.3);
            transform: translateY(-2px);
        }
        .card-img {
            height: 140px;
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .card-img::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(to top, #0f172a, transparent);
        }
        .badge-neon {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(6,182,212,0.2);
            backdrop-filter: blur(4px);
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 800;
            color: #06b6d4;
            border: 1px solid rgba(6,182,212,0.4);
        }
        .card-content {
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .rest-name {
            font-weight: 800;
            font-size: 1.2rem;
        }
        .rest-cat {
            font-size: 0.7rem;
            color: #06b6d4;
            font-weight: 700;
            margin-top: 4px;
        }
        .arrow-neon {
            width: 2.2rem;
            height: 2.2rem;
            background: rgba(6,182,212,0.1);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #06b6d4;
            font-size: 1.2rem;
            transition: 0.2s;
        }
        .restaurant-card:hover .arrow-neon {
            background: #06b6d4;
            color: #020617;
            transform: translateX(4px);
        }

        /* ========== BOTÓN PAO ========== */
        .pao-btn {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #06b6d4, #0891b2);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(6,182,212,0.6);
            cursor: pointer;
            z-index: 100;
            transition: transform 0.2s;
        }
        .pao-btn:active { transform: scale(0.92); }
        .pao-pulse {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #06b6d4;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
            z-index: -1;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.4); opacity: 0; }
        }
        .pao-emoji { font-size: 1.8rem; }

        /* CHAT PAO */
        .pao-chat {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 320px;
            background: #0f172a;
            border-radius: 28px;
            border-top: 2px solid #06b6d4;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5);
            z-index: 200;
            transform: scale(0);
            opacity: 0;
            transition: all 0.2s ease;
            transform-origin: bottom right;
            backdrop-filter: blur(12px);
        }
        .pao-chat.open {
            transform: scale(1);
            opacity: 1;
        }
        .chat-header {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(6,182,212,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 800;
        }
        .chat-messages {
            max-height: 350px;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            display: flex;
            gap: 8px;
        }
        .message.bot .bubble {
            background: #1e293b;
            border-radius: 20px 20px 20px 4px;
            padding: 10px 14px;
            max-width: 85%;
            font-size: 0.85rem;
        }
        .message.user { justify-content: flex-end; }
        .message.user .bubble {
            background: #06b6d4;
            color: #020617;
            font-weight: 600;
            border-radius: 20px 20px 4px 20px;
            padding: 10px 14px;
            max-width: 85%;
        }
        .chat-input {
            padding: 12px;
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            gap: 8px;
        }
        .chat-input input {
            flex: 1;
            background: #1e293b;
            border: none;
            border-radius: 30px;
            padding: 10px 16px;
            color: white;
            font-size: 0.8rem;
        }
        .chat-input button {
            background: rgba(6,182,212,0.2);
            border: none;
            border-radius: 30px;
            width: 40px;
            font-size: 1.2rem;
            cursor: pointer;
        }
        .suggest-chip {
            background: #1e293b;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #06b6d4;
            display: inline-block;
            margin: 4px 4px 0 0;
            cursor: pointer;
            transition: 0.1s;
        }
        .suggest-chip:active { background: #06b6d4; color: black; }

        /* tarjetas de recomendación dentro del chat */
        .rec-card {
            background: #1e293b;
            border-radius: 16px;
            margin-top: 8px;
            display: flex;
            gap: 12px;
            padding: 8px;
            cursor: pointer;
            border: 1px solid rgba(6,182,212,0.2);
        }
        .rec-card img {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            object-fit: cover;
        }
    </style>
</head>
<body>

<div class="particle-field" id="particleField"></div>

<div class="hero">
    <div class="logo">AGUADULCE</div>
    <div class="tagline">✦ NEON EXPERIENCE ✦</div>
</div>

<div class="container" id="homeContainer"></div>

<!-- Botón PAO -->
<div class="pao-btn" id="paoBtn">
    <div class="pao-pulse"></div>
    <div class="pao-emoji">🤖</div>
</div>

<!-- Chat PAO -->
<div class="pao-chat" id="paoChat">
    <div class="chat-header">
        <span>🤖 PAO · asistente</span>
        <span style="cursor:pointer" id="closeChat">✕</span>
    </div>
    <div class="chat-messages" id="chatMessages">
        <div class="message bot">
            <div class="bubble">✨ ¡Hola! Soy PAO. ¿Qué te apetece comer hoy?<br>Prueba: "quiero pizza", "hamburguesas", "algo sano"</div>
        </div>
    </div>
    <div class="chat-input">
        <input type="text" id="chatInput" placeholder="Escribe o usa el micrófono...">
        <button id="micBtn">🎤</button>
        <button id="sendBtn">📤</button>
    </div>
    <div style="padding: 8px 12px 12px; display: flex; flex-wrap: wrap; gap: 6px;">
        <span class="suggest-chip" data-text="pizza">🍕 Pizza</span>
        <span class="suggest-chip" data-text="hamburguesas">🍔 Hamburguesas</span>
        <span class="suggest-chip" data-text="peruana">🇵🇪 Peruana</span>
        <span class="suggest-chip" data-text="mas vendido">🔥 Más vendido</span>
        <span class="suggest-chip" data-text="sano">🥗 Sano</span>
    </div>
</div>

<script>
    // ========== DATOS DE EJEMPLO (RESTAURANTES Y PLATOS) ==========
    const restaurantes = [
        { id: "RT33M5", nombre: "CHUHAN PIZZERIA", categoria: "Pizza", imagen: "https://images.pexels.com/photos/1653877/pexels-photo-1653877.jpeg" },
        { id: "6G4L1V", nombre: "DELICIOUS FOOD", categoria: "Hamburguesa", imagen: "https://images.pexels.com/photos/958545/pexels-photo-958545.jpeg" },
        { id: "9V1L8K", nombre: "RINCONCITO PERUANO", categoria: "Peruana", imagen: "https://images.pexels.com/photos/1640777/pexels-photo-1640777.jpeg" }
    ];

    const menuGeneral = [
        { id: "p1", nombre: "Pizza Carbonara", precio: 12.90, categoria: "pizza", foto: "https://images.pexels.com/photos/1653877/pexels-photo-1653877.jpeg", restaurante_id: "RT33M5" },
        { id: "p2", nombre: "Pizza Pepperoni", precio: 11.90, categoria: "pizza", foto: "https://images.pexels.com/photos/1653877/pexels-photo-1653877.jpeg", restaurante_id: "RT33M5" },
        { id: "h1", nombre: "Hamburguesa Doble", precio: 13.50, categoria: "hamburguesa", foto: "https://images.pexels.com/photos/958545/pexels-photo-958545.jpeg", restaurante_id: "6G4L1V" },
        { id: "h2", nombre: "Hamburguesa Clásica", precio: 10.90, categoria: "hamburguesa", foto: "https://images.pexels.com/photos/958545/pexels-photo-958545.jpeg", restaurante_id: "6G4L1V" },
        { id: "c1", nombre: "Ceviche Mixto", precio: 15.90, categoria: "peruana", foto: "https://images.pexels.com/photos/1640777/pexels-photo-1640777.jpeg", restaurante_id: "9V1L8K" }
    ];

    function renderHome() {
        const container = document.getElementById('homeContainer');
        let html = `<div style="margin-bottom: 1rem; font-size:0.8rem; font-weight:800; color: #06b6d4;">🔥 RESTAURANTES DESTACADOS</div>`;
        restaurantes.forEach(r => {
            html += `
                <div class="restaurant-card" onclick="alert('Abrir menú de ${r.nombre} (demo)')">
                    <div class="card-img" style="background-image: url('${r.imagen}')">
                        <div class="badge-neon">🟢 ABIERTO</div>
                    </div>
                    <div class="card-content">
                        <div>
                            <div class="rest-name">${r.nombre}</div>
                            <div class="rest-cat">${r.categoria}</div>
                        </div>
                        <div class="arrow-neon">→</div>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    // ========== PAO : CHAT + RECONOCIMIENTO DE VOZ ==========
    let recognition = null;
    let paoOpen = false;

    function addMessage(text, isUser = false, recs = null) {
        const container = document.getElementById('chatMessages');
        const div = document.createElement('div');
        div.className = `message ${isUser ? 'user' : 'bot'}`;
        div.innerHTML = `<div class="bubble">${text}</div>`;
        container.appendChild(div);
        if (recs && recs.length) {
            const recDiv = document.createElement('div');
            recDiv.className = 'message bot';
            let recHtml = `<div class="bubble" style="padding: 8px;">✨ Te sugiero:`;
            recs.forEach(p => {
                recHtml += `<div class="rec-card" onclick="alert('Añadir ${p.nombre} al carrito (demo)')">
                                <img src="${p.foto}">
                                <div><strong>${p.nombre}</strong><br>${p.precio.toFixed(2)}€</div>
                            </div>`;
            });
            recHtml += `</div>`;
            recDiv.innerHTML = recHtml;
            container.appendChild(recDiv);
        }
        container.scrollTop = container.scrollHeight;
    }

    function procesarComando(texto) {
        const lower = texto.toLowerCase();
        if (lower.includes('pizza')) {
            const recs = menuGeneral.filter(p => p.categoria === 'pizza');
            addMessage(`🍕 ¡Pizza! Excelente elección. Te recomiendo:`, false, recs);
        } 
        else if (lower.includes('hamburguesa')) {
            const recs = menuGeneral.filter(p => p.categoria === 'hamburguesa');
            addMessage(`🍔 Hamburguesas, qué rico. Prueba estas:`, false, recs);
        }
        else if (lower.includes('peruana') || lower.includes('ceviche')) {
            const recs = menuGeneral.filter(p => p.categoria === 'peruana');
            addMessage(`🇵🇪 Comida peruana, ¡excelente! Te recomiendo:`, false, recs);
        }
        else if (lower.includes('mas vendido')) {
            const recs = menuGeneral.slice(0, 3);
            addMessage(`🔥 Los platos más pedidos hoy son:`, false, recs);
        }
        else if (lower.includes('sano')) {
            const recs = menuGeneral.filter(p => p.nombre.toLowerCase().includes('ensalada') || p.categoria === 'saludable');
            if(recs.length) addMessage(`🥗 Opciones saludables para ti:`, false, recs);
            else addMessage(`🥗 Te recomiendo una ensalada o algo ligero. ¿Pruebas el Ceviche?`, false);
        }
        else {
            addMessage(`🔍 No entendí bien. Dime: "pizza", "hamburguesas", "comida peruana", "más vendido" o "sano".`, false);
        }
    }

    function enviarMensaje() {
        const input = document.getElementById('chatInput');
        const txt = input.value.trim();
        if (!txt) return;
        addMessage(txt, true);
        input.value = '';
        procesarComando(txt);
    }

    function activarMicrofono() {
        if (!('webkitSpeechRecognition' in window)) {
            addMessage("⚠️ Tu navegador no soporta voz. Prueba escribiendo.", false);
            return;
        }
        recognition = new webkitSpeechRecognition();
        recognition.lang = 'es-ES';
        recognition.onstart = () => document.getElementById('micBtn').style.background = '#ef4444';
        recognition.onresult = (e) => {
            const texto = e.results[0][0].transcript;
            addMessage(texto, true);
            procesarComando(texto);
        };
        recognition.onend = () => document.getElementById('micBtn').style.background = '';
        recognition.start();
    }

    // UI del chat
    const paoBtn = document.getElementById('paoBtn');
    const paoChat = document.getElementById('paoChat');
    paoBtn.onclick = () => {
        paoOpen = !paoOpen;
        paoChat.classList.toggle('open', paoOpen);
    };
    document.getElementById('closeChat').onclick = () => {
        paoOpen = false;
        paoChat.classList.remove('open');
    };
    document.getElementById('sendBtn').onclick = enviarMensaje;
    document.getElementById('micBtn').onclick = activarMicrofono;
    document.getElementById('chatInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') enviarMensaje(); });
    document.querySelectorAll('.suggest-chip').forEach(chip => {
        chip.onclick = () => {
            const txt = chip.getAttribute('data-text');
            addMessage(txt, true);
            procesarComando(txt);
        };
    });

    // partículas
    function crearParticulas() {
        const cont = document.getElementById('particleField');
        for(let i=0;i<40;i++) {
            const p = document.createElement('div');
            p.classList.add('particle');
            const size = Math.random() * 5 + 2;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            p.style.left = Math.random() * 100 + '%';
            p.style.setProperty('--dir', Math.random() > 0.5 ? 1 : -1);
            p.style.animationDuration = Math.random() * 8 + 5 + 's';
            p.style.animationDelay = Math.random() * 10 + 's';
            cont.appendChild(p);
        }
    }
    crearParticulas();
    renderHome();
</script>
</body>
</html>
