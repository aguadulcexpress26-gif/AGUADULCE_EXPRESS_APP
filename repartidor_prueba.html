<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aguadulce Express - Panel de Reparto v6.2</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .loader { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #020617; display: flex; align-items: center; justify-content: center; z-index: 500; flex-direction: column; gap: 15px; }
        .spinner { width: 50px; height: 50px; border: 5px solid #1e293b; border-top: 5px solid #06b6d4; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 16px; margin-bottom: 16px; position: relative; }
        .btn-recoger { background: #06b6d4; color: #020617; font-weight: bold; width: 100%; padding: 12px; border-radius: 12px; cursor: pointer; margin-top: 10px; }
        .btn-llegada { background: #f59e0b; color: #020617; font-weight: bold; width: 100%; padding: 12px; border-radius: 12px; cursor: pointer; margin-top: 10px; }
        .btn-espera { background: #334155; color: #cbd5e1; font-weight: bold; width: 100%; padding: 12px; border-radius: 12px; margin-top: 10px; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-deuda { background: #ef4444; color: #ffffff; font-weight: bold; width: 100%; padding: 12px; border-radius: 12px; cursor: pointer; margin-top: 10px; }
        .btn-entregar { background: #22c55e; color: #020617; font-weight: bold; width: 100%; padding: 12px; border-radius: 12px; cursor: pointer; margin-top: 10px; }
        .sin-pedidos { text-align: center; padding: 40px; color: #64748b; font-size: 16px; }
        .badge-contador { background: rgba(234, 179, 8, 0.15); color: #eab308; padding: 6px 12px; border-radius: 10px; font-size: 13px; font-weight: bold; border: 1px solid rgba(234, 179, 8, 0.3); }
    </style>
</head>
<body>

    <div id="loader" class="loader">
        <div class="spinner"></div>
        <h2 style="font-size: 16px; font-weight: bold; color: #06b6d4;">CONECTANDO CON EXCEL...</h2>
    </div>

    <div id="app" style="display: none; padding: 12px; max-width: 600px; margin: 0 auto;">
        
        <div class="flex justify-between items-center" style="margin-bottom: 20px; background: #0f172a; padding: 12px; border-radius: 14px; border: 1px solid #1e293b;">
            <div>
                <h1 id="nombreRep" style="font-size: 18px; font-weight: bold; color: #fff;">-</h1>
                <span id="codigoRep" style="font-size: 12px; color: #64748b; font-weight: 500;">🔑 R000</span>
            </div>
            <div style="text-align: right;">
                <span style="font-size: 11px; color: #64748b; display: block;">💰 Billetera</span>
                <span id="saldo" style="font-size: 18px; font-weight: bold; color: #22c55e;">0.00€</span>
            </div>
        </div>

        <div class="flex justify-between items-center" style="margin-bottom: 16px;">
            <div class="flex items-center" style="gap: 8px;">
                <span style="display: inline-block; width: 10px; height: 10px; background: #22c55e; border-radius: 50%;"></span>
                <span id="estadoConexion" style="font-size: 14px; color: #22c55e; font-weight: 500;">Conectado a Base de Datos</span>
            </div>
            <button id="btnSalir" style="background: #334155; color: #f8fafc; font-size: 12px; padding: 6px 12px; border-radius: 8px; cursor: pointer;">🚪 Salir</button>
        </div>

        <div style="margin-bottom: 14px; font-size: 14px; color: #94a3b8;">
            Pedidos activos detectados en cuenta: <span id="contadorPedidos" style="color: #06b6d4; font-weight: bold;">0</span>
        </div>

        <div id="listaPedidos"></div>
    </div>

    <script>
        const URL = 'https://script.google.com/macros/s/AKfycbzYFDShcrP7I4FKhiH3q5UcEInpSKJstrumJ9ddI4Tj9S31ZUgwiuie81fGFmCJ6ob2/exec';
        let codigoActual = null;
        let intervalo = null;

        async function cargarPedidos() {
            if (!codigoActual) return;
            try {
                const res = await fetch(URL + '?action=getPedidosReparto&idRepartidor=' + encodeURIComponent(codigoActual) + '&t=' + Date.now());
                const data = await res.json();
                
                if (data.error) {
                    document.getElementById('estadoConexion').innerHTML = 'Error de código';
                    return;
                }
                
                document.getElementById('nombreRep').innerHTML = data.nombre;
                document.getElementById('saldo').innerHTML = (parseFloat(data.saldo) || 0).toFixed(2) + '€';
                
                const activos = data.pedidos || [];
                document.getElementById('contadorPedidos').innerHTML = activos.length;
                renderizarPedidos(activos);
            } catch(e) {
                console.error("🚨 Error cargando pedidos:", e);
            }
        }
        
        function renderizarPedidos(pedidos) {
            const contenedor = document.getElementById('listaPedidos');
            if (pedidos.length === 0) {
                contenedor.innerHTML = '<div class="sin-pedidos">📭 Sin pedidos asignados en este momento</div>';
                return;
            }
            
            let html = '';
            for (let p of pedidos) {
                const estado = (p.ESTADO || '').toUpperCase().trim();
                const total = parseFloat(p.TOTAL) || 0;
                let telefono = p.telf || '';
                
                let botones = '';
                if (estado === 'RECIBIDO' || estado === 'LISTO') {
                    botones = `<button class="btn-recoger" onclick="recogerPedido('${p.ID_PEDIDO}')">🛵 RECOGER PEDIDO</button>`;
                } else if (estado === 'EN CAMINO') {
                    botones = `<button class="btn-llegada" onclick="validarLlegadaGPS(this, '${p.ID_PEDIDO}')">📍 HE LLEGADO AL CLIENTE</button>`;
                } else if (estado === 'LLEGÓ' || estado === 'LLEGO') {
                    const tEspera = localStorage.getItem('espera_' + p.ID_PEDIDO);
                    if (tEspera) {
                        const restantes = Math.ceil((parseInt(tEspera) - Date.now()) / 1000);
                        if (restantes > 0) {
                            const mins = Math.floor(restantes / 60);
                            const segundos = restantes % 60;
                            botones = `<div class="btn-espera" id="reloj-${p.ID_PEDIDO}">⏳ ESPERANDO AL CLIENTE (${mins}:${segundos < 10 ? '0' : ''}${segundos})</div>`;
                        } else {
                            botones = `<button class="btn-deuda" onclick="aplicarDeudaAusencia('${p.ID_PEDIDO}', ${total})">❌ CLIENTE AUSENTE / CARGAR DEUDA</button>`;
                        }
                    } else {
                        // CORRECCIÓN: Aquí se reemplazó 'id' por 'p.ID_PEDIDO' para evitar el ReferenceError
                        const tiempoExpiracion = Date.now() + (6 * 60 * 1000);
                        localStorage.setItem('espera_' + p.ID_PEDIDO, tiempoExpiracion);
                        botones = `<div class="btn-espera" id="reloj-${p.ID_PEDIDO}">⏳ ESPERANDO AL CLIENTE (6:00)</div>`;
                    }
                    botones += `<button class="btn-entregar" style="margin-top:8px;" onclick="confirmarEntrega('${p.ID_PEDIDO}', ${total})">💰 CONFIRMAR COBRO Y ENTREGA</button>`;
                }

                let bloqueContadorCocina = '';
                if (estado === 'RECIBIDO' && p.TIMESTAMP_FIN_ELABORACION) {
                    bloqueContadorCocina = `<div class="badge-contador" data-target="${p.TIMESTAMP_FIN_ELABORACION}">⏳ Calculando...</div>`;
                }

                let bloqueEfectivo = '';
                let pagaCon = parseFloat(p.PAGA_CON) || 0;
                if (pagaCon > total && (p.PAGO || '').toUpperCase().includes('EFECTIVO')) {
                    bloqueEfectivo = `
                        <div style="margin-top: 8px; padding: 8px; background: rgba(34, 197, 94, 0.1); border-radius: 8px; border: 1px dashed rgba(34, 197, 94, 0.3); font-size: 12px; color: #22c55e;">
                            💵 Paga con: <strong>${pagaCon.toFixed(2)}€</strong> | Llevar Cambio de: <strong>${(pagaCon - total).toFixed(2)}€</strong>
                        </div>`;
                }

                let linkMaps = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.DIRECCION || '');
                
                html += `
                <div class="card">
                    <div class="flex justify-between items-center" style="margin-bottom: 10px;">
                        <span style="font-weight: bold; color: #06b6d4;">📋 PEDIDO: ${p.ID_PEDIDO}</span>
                        ${bloqueContadorCocina}
                    </div>
                    <div style="margin-bottom: 12px;">
                        <div style="font-size: 14px; font-weight: 600; color: #f1f5f9;">📍 Domicilio: ${p.DIRECCION}</div>
                        <a href="${linkMaps}" target="_blank" style="display: inline-flex; align-items: center; margin-top: 6px; background: rgba(6, 182, 212, 0.15); color: #06b6d4; border: 1px solid rgba(6, 182, 212, 0.3); font-size: 11px; font-weight: bold; padding: 5px 12px; border-radius: 8px; text-decoration: none;">🗺️ REVISAR EN GOOGLE MAPS</a>
                    </div>
                    <div style="background: #1e293b; padding: 10px; border-radius: 12px; font-size: 13px;">
                        <div style="color: #fff; font-weight: bold; margin-bottom: 4px;">👤 Cliente: ${p.CLIENTE}</div>
                        <div style="color: #94a3b8; font-size:12px; margin-bottom: 4px;">🗒️ Detalles: ${p.detalle || 'Ninguno'}</div>
                        <div style="color: #e2e8f0; font-size:12px; margin-bottom: 6px;">💡 Instrucciones: ${p.notas}</div>
                        <div class="flex justify-between items-center" style="margin-top: 8px; border-top: 1px solid #334155; padding-top: 6px;">
                            <span style="color: #94a3b8;">📱 Tel: ${telefono}</span>
                            <div>
                                <a href="tel:${telefono}" style="background:#22c55e; color:#020617; padding:4px 8px; border-radius:6px; font-size:11px; font-weight:bold; text-decoration:none; margin-right:4px;">Llamar</a>
                                <a href="https://wa.me/${telefono}" target="_blank" style="background:#25D366; color:#fff; padding:4px 8px; border-radius:6px; font-size:11px; font-weight:bold; text-decoration:none;">WhatsApp</a>
                            </div>
                        </div>
                        ${bloqueEfectivo}
                    </div>
                    <div class="flex justify-between items-center" style="margin: 10px 0;">
                        <span style="color:#94a3b8; font-size:13px;">Total Neto a pagar:</span>
                        <span style="color:#22c55e; font-size: 18px; font-weight: bold;">${total.toFixed(2)}€</span>
                    </div>
                    ${botones}
                </div>`;
            }
            contenedor.innerHTML = html;
        }

        window.validarLlegadaGPS = function(btn, id) {
            btn.disabled = true;
            btn.innerHTML = '🛰️ UBICANDO GPS...';
            if (!navigator.geolocation) {
                localStorage.setItem('espera_' + id, Date.now() + (6 * 60 * 1000));
                ejecutarLlegada(id);
                return;
            }
            navigator.geolocation.getCurrentPosition(async (position) => {
                localStorage.setItem('espera_' + id, Date.now() + (6 * 60 * 1000));
                ejecutarLlegada(id);
            }, () => {
                localStorage.setItem('espera_' + id, Date.now() + (6 * 60 * 1000));
                ejecutarLlegada(id);
            }, { enableHighAccuracy: true, timeout: 5000 });
        };

        async function ejecutarLlegada(id) {
            await fetch(URL + '?action=actualizarEstado&idPedido=' + id + '&nuevoEstado=LLEGÓ');
            await cargarPedidos();
        }

        window.recogerPedido = async function(id) {
            await fetch(URL + '?action=actualizarEstado&idPedido=' + id + '&nuevoEstado=EN CAMINO');
            await cargarPedidos();
        };

        window.aplicarDeudaAusencia = async function(id, total) {
            Swal.fire({
                title: '🚨 ¿Registrar Sanción?',
                text: `Se aplicarán ${total.toFixed(2)}€ de deuda al perfil de este cliente por no responder al llamado.`,
                icon: 'error',
                background: '#0f172a', color: 'white',
                showCancelButton: true, confirmButtonColor: '#ef4444', confirmButtonText: 'Sí, aplicar deuda',
                cancelButtonText: 'Volver a intentar'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    await fetch(URL + '?action=actualizarEstado&idPedido=' + id + '&nuevoEstado=RECHAZADO&tiempo=' + encodeURIComponent('cliente: Ausencia tras 6 min de espera en puerta'));
                    localStorage.removeItem('espera_' + id);
                    await cargarPedidos();
                }
            });
        };

        window.confirmarEntrega = function(id, total) {
            Swal.fire({
                title: '💰 Confirmación de Caja',
                html: `¿Das por recibido el cobro en efectivo de <strong>${total.toFixed(2)}€</strong>?`,
                icon: 'success',
                background: '#0f172a', color: 'white',
                showCancelButton: true, confirmButtonColor: '#22c55e', confirmButtonText: 'Sí, cobrado',
                cancelButtonText: 'Cancelar'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    await fetch(URL + '?action=finalizarEntrega&idPedido=' + id);
                    localStorage.removeItem('espera_' + id);
                    await cargarPedidos();
                }
            });
        };

        async function iniciarApp() {
            document.getElementById('btnSalir').onclick = () => { localStorage.clear(); location.reload(); };
            let codigo = localStorage.getItem('rep_code');
            if (!codigo) {
                const result = await Swal.fire({
                    title: '🔑 Código de Acceso',
                    input: 'text',
                    background: '#0f172a', color: 'white',
                    confirmButtonColor: '#06b6d4', confirmButtonText: 'Ingresar',
                    allowOutsideClick: false
                });
                if (result.value) {
                    codigo = result.value.trim().toUpperCase();
                    localStorage.setItem('rep_code', codigo);
                }
            }
            if (codigo) {
                codigoActual = codigo;
                document.getElementById('codigoRep').innerHTML = '🔑 Código de Acceso: ' + codigoActual;
                await cargarPedidos();
                document.getElementById('loader').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                
                // Intervalo de red principal (cada 5 segundos recarga desde Google Sheets)
                intervalo = setInterval(cargarPedidos, 5000);
                
                // MÓDULO CRONÓMETRO INTERNO: Corre cada 1 segundo refrescando el contador visual en local
                setInterval(() => {
                    document.querySelectorAll('[id^="reloj-"]').forEach(elemento => {
                        const idPedido = elemento.id.replace('reloj-', '');
                        const tEspera = localStorage.getItem('espera_' + idPedido);
                        if (tEspera) {
                            const restantes = Math.ceil((parseInt(tEspera) - Date.now()) / 1000);
                            if (restantes > 0) {
                                const mins = Math.floor(restantes / 60);
                                const segs = restantes % 60;
                                elemento.innerHTML = `⏳ ESPERANDO AL CLIENTE (${mins}:${segs < 10 ? '0' : ''}${segs})`;
                            } else {
                                // Cuando el tiempo llega a cero, refrescamos para mutar el div a botón de penalización
                                cargarPedidos();
                            }
                        }
                    });
                }, 1000);
            }
        }
        iniciarApp().catch(e => console.error(e));
    </script>
</body>
</html>
