<script>
// ============================================================
// 🔥 CONFIGURACIÓN DE FIREBASE
// ============================================================
const firebaseConfig = {
    apiKey: "AIzaSyBEapmpody3y_vFyPF0ngUnCn5ZFOtxPjs",
    authDomain: "aguadulce-express-v2.firebaseapp.com",
    databaseURL: "https://aguadulce-express-v2-default-rtdb.firebaseio.com",
    projectId: "aguadulce-express-v2",
    storageBucket: "aguadulce-express-v2.appspot.com",
    messagingSenderId: "103953800507",
    appId: "1:103953800507:web:tu_app_id"
};

const vapidKey = "BH4IAMeS7LHkDjOt84N-7mG985aTyHpYXx845HqKCnT8oGyxbaJ9pT98IgfslMsrFTJW3jHpvik0mrY263nlFRY";

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const database = firebase.database();
const auth = firebase.auth();
// ============================================================
// 📌 VARIABLES GLOBALES
// ============================================================
let repartidorActual = null;
let pedidosListener = null;
let intervalosContador = {};
let temporizadorAusencia = null;
let avisoEnviado = false;
let pedidoActual = null;

const mensajesPredefinidos = {
    'ya_llegue': '📍 ¡Hola! Ya llegué a tu dirección, estoy en la puerta.',
    'esperando': '⏰ ¡Hola! Estoy esperando en la puerta. ¿Puedes salir?',
    'timbre': '🔔 ¡Hola! He llamado al timbre. Por favor, sal a recibir tu pedido.'
};

// ============================================================
// 📱 CREAR CANAL DE NOTIFICACIONES CON SONIDO CORRECTO
// ============================================================
async function crearCanalNotificaciones() {
    try {
        if (window.Capacitor && Capacitor.getPlatform() === 'android') {
            const { PushNotifications } = Capacitor.Plugins;
            
            // Eliminar canal antiguo (si existe)
            try {
                await PushNotifications.deleteChannel('canal-aguadulce');
                console.log('🗑️ Canal antiguo eliminado');
            } catch (e) {
                console.log('📌 Canal no existía, continuando...');
            }
            
            // Crear canal nuevo con el sonido correcto
            await PushNotifications.createChannel({
                id: 'canal-aguadulce',
                name: 'Notificaciones de Pedidos',
                description: 'Notificaciones de nuevos pedidos',
                sound: 'notificacion.mp3',  // ← USAR notificacion.mp3
                importance: 5,
                visibility: 1,
                vibration: true,
                lights: true
            });
            
            console.log('✅ Canal con sonido notificacion.mp3 creado');
        }
    } catch (error) {
        console.error('❌ Error creando canal:', error);
    }
}

// ============================================================
// 🛠️ FUNCIONES DE UI
// ============================================================
function toggleMenu() {
    const menu = document.getElementById('menuPanel');
    if (menu) {
        menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    }
}

document.addEventListener('click', function(event) {
    const menu = document.getElementById('menuPanel');
    const menuIcon = document.querySelector('.menu-icon');
    if (menu && menuIcon && !menuIcon.contains(event.target) && !menu.contains(event.target)) {
        menu.style.display = 'none';
    }
});

// ============================================================
// 🔐 LOGIN CON EMAIL (CON REGISTRO DE TOKEN)
// ============================================================
async function loginRepartidor() {
    const email = document.getElementById('repartidorEmail').value.trim();
    const password = document.getElementById('repartidorPass').value;

    if (!email || !password) {
        Swal.fire({ title: 'Error', text: 'Completa email y contraseña', icon: 'error' });
        return;
    }

    try {
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        const uid = userCredential.user.uid;

        const snapshot = await database.ref(`repartidores/${uid}`).once('value');
        const encontrado = snapshot.val();

        if (!encontrado || encontrado.activo === false) {
            Swal.fire({ 
                title: 'Error', 
                text: 'Repartidor no encontrado o inactivo. Contacta con el administrador.',
                icon: 'error' 
            });
            return;
        }

        repartidorActual = { id: uid, ...encontrado };
        localStorage.setItem('repartidor_actual', JSON.stringify(repartidorActual));

        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('dashboardPanel').classList.remove('hidden');
        document.getElementById('repartidorNombreDisplay').innerText = repartidorActual.nombre;

        const headerBg = document.getElementById('repartoHeaderBg');
        if (headerBg) {
            headerBg.style.backgroundImage = "url('https://i.postimg.cc/Jh8cGWf9/Copilot-20260407-120738.png')";
        }

        // 📱 CREAR CANAL DE NOTIFICACIONES (NUEVO - SONIDO CORRECTO)
        await crearCanalNotificaciones();

        // 🔥 REGISTRAR TOKEN
        await registrarTokenNotificaciones(uid);
        console.log('✅ Token registrado para repartidor:', uid);

        iniciarEscuchaPedidos();

        Swal.fire({
            title: '✅ Bienvenido',
            text: `Has iniciado sesión como ${repartidorActual.nombre}`,
            icon: 'success',
            timer: 1500,
            showConfirmButton: false
        });

    } catch (error) {
        console.error('❌ Error en login:', error);
        Swal.fire({ 
            title: '❌ Error de autenticación', 
            text: error.message || 'Credenciales incorrectas',
            icon: 'error' 
        });
    }
}

function logoutRepartidor() {
    if (pedidosListener) {
        try {
            if (typeof pedidosListener.off === 'function') {
                pedidosListener.off();
            }
        } catch (e) { console.warn(e); }
        pedidosListener = null;
    }

    for (const key in intervalosContador) {
        clearInterval(intervalosContador[key]);
        delete intervalosContador[key];
    }

    auth.signOut().then(() => {
        localStorage.removeItem('repartidor_actual');
        location.reload();
    }).catch(() => {
        localStorage.removeItem('repartidor_actual');
        location.reload();
    });
}

// ============================================================
// 📱 REGISTRO DE TOKEN DE NOTIFICACIONES
// ============================================================
async function registrarTokenNotificaciones(repartidorId) {
    console.log('📌 registrarTokenNotificaciones - Iniciando para:', repartidorId);
    
    try {
        // Verificar si estamos en entorno nativo (Capacitor)
        const isNative = window.Capacitor && Capacitor.getPlatform() !== 'web';
        
        if (isNative) {
            // 📱 NOTIFICACIONES NATIVAS (Capacitor)
            console.log('📱 Entorno nativo detectado');
            const { PushNotifications } = Capacitor.Plugins;
            
            // Solicitar permisos
            const permStatus = await PushNotifications.requestPermissions();
            console.log('📱 Permisos:', permStatus);
            
            if (permStatus.receive === 'granted') {
                await PushNotifications.register();
                console.log('📱 Registro Capacitor completado');
                
                // ✅ LISTENER DE REGISTRO
                PushNotifications.addListener('registration', async (token) => {
                    console.log('📱 Token nativo recibido:', token.value);
                    if (token && token.value) {
                        try {
                            await database.ref(`repartidores/${repartidorId}/token`).set(token.value);
                            console.log('✅ Token nativo guardado en Firebase');
                            
                            // Mostrar confirmación visual
                            Swal.fire({
                                title: '✅ Notificaciones activadas',
                                text: 'Recibirás alertas de nuevos pedidos',
                                icon: 'success',
                                timer: 2000,
                                showConfirmButton: false,
                                background: '#0f172a',
                                color: 'white'
                            });
                        } catch (error) {
                            console.error('❌ Error guardando token nativo:', error);
                        }
                    }
                });
                
                // ✅ LISTENER DE NOTIFICACIONES RECIBIDAS (SOLO UNA VEZ)
                PushNotifications.addListener('pushNotificationReceived', (notification) => {
                    console.log('📱 Notificación recibida en primer plano:', notification);
                    
                    // 🔥 REPRODUCIR SONIDO UNA SOLA VEZ
                    const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
                    audio.volume = 0.9;
                    audio.play().catch(e => console.log('Sonido no disponible'));
                    if (navigator.vibrate) navigator.vibrate(300);
                    
                    // Mostrar notificación en la app
                    Swal.fire({
                        title: notification.title || '📦 Nuevo Pedido',
                        text: notification.body || '',
                        icon: 'info',
                        timer: 8000,
                        showConfirmButton: true,
                        background: '#0f172a',
                        color: 'white'
                    });
                });
            } else {
                console.warn('⚠️ Permisos de notificaciones denegados');
                Swal.fire({
                    title: '⚠️ Permisos denegados',
                    text: 'Activa las notificaciones para recibir alertas de nuevos pedidos',
                    icon: 'warning',
                    background: '#0f172a',
                    color: 'white'
                });
            }
        } else {
            // 🌐 NOTIFICACIONES WEB (FCM)
            console.log('🌐 Entorno web detectado');
            
            if (typeof firebase.messaging === 'undefined') {
                console.warn('⚠️ Firebase Messaging no está disponible');
                return;
            }
            
            const messaging = firebase.messaging();
            console.log('📱 Firebase Messaging inicializado');
            
            const permission = await Notification.requestPermission();
            console.log('📱 Permiso de notificaciones:', permission);
            
            if (permission === 'granted') {
                try {

                        vapidKey: 'BH4IAMeS7LHkDjOt84N-7mG985aTyHpYXx845HqKCnT8oGyxbaJ9pT98IgfslMsrFTJW3jHpvik0mrY263nlFRY'

// ============================================================
// 📡 ESCUCHA DE PEDIDOS (SIN SONIDO AUTOMÁTICO)
// ============================================================
function iniciarEscuchaPedidos() {
    if (pedidosListener) {
        try { pedidosListener.off(); } catch(e) {}
        pedidosListener = null;
    }

    const uid = repartidorActual.id;

    pedidosListener = database.ref('pedidos').on('value', (snapshot) => {
        const todosPedidos = snapshot.val() || {};
        const activos = [];
        const historial = [];

        for (const [id, data] of Object.entries(todosPedidos)) {
            if (data.uid_repartidor !== uid) continue;

            if (data.estado === 'ENTREGADO' || data.estado === 'CANCELADO_POR_AUSENCIA') {
                historial.push({ id, ...data });
            } else {
                activos.push({ id, ...data });
            }
        }

        activos.sort((a, b) => (b.fecha || 0) - (a.fecha || 0));
        historial.sort((a, b) => (b.fecha || 0) - (a.fecha || 0));

        renderizarActivos(activos);
        renderizarHistorial(historial);
        actualizarContadores(activos);
        actualizarMenuStats(activos);

        // ✅ NO reproducir sonido aquí - Solo actualizar contadores
        if (activos.length > 0) {
            console.log('📦 Hay ' + activos.length + ' pedidos activos');
        }
    });
}

function renderizarHistorial(pedidos) {
    const container = document.getElementById('listaHistorial');

        container.innerHTML = '<div class="text-center text-slate-400 p-10">📭 No hay pedidos en el historial</div>';
        return;
    }

    const agrupados = {};
    for (const p of pedidos) {
        const fecha = new Date(p.timestamp_entregado || p.timestamp_cancelacion || p.fecha || 0);
        const fechaKey = fecha.toISOString().split('T')[0];
        const fechaDisplay = fecha.toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        if (!agrupados[fechaKey]) agrupados[fechaKey] = { display: fechaDisplay, pedidos: [] };
        agrupados[fechaKey].pedidos.push(p);
    }

    const fechasOrdenadas = Object.keys(agrupados).sort().reverse();
    container.innerHTML = '';

    for (const fechaKey of fechasOrdenadas) {
        const grupo = agrupados[fechaKey];
        container.innerHTML += `
            <div class="sticky top-0 bg-white/90 backdrop-blur-sm rounded-xl p-2 mb-2 z-10">

            const estado = p.estado === 'ENTREGADO' ? '✅ Entregado' : '❌ Cancelado';

// ============================================================
// ⏱️ CONTADOR REGRESIVO
// ============================================================
function iniciarContadorRegresivo(pedidoId, tiempoRestante) {
    if (intervalosContador[pedidoId]) {
        clearInterval(intervalosContador[pedidoId]);
        delete intervalosContador[pedidoId];
    }

    const timerElement = document.getElementById(`timer-coccion-${pedidoId}`);
    if (!timerElement) return;

    let tiempo = tiempoRestante > 0 ? tiempoRestante : 0;

    const intervalo = setInterval(async () => {
        const pedidoSnap = await database.ref(`pedidos/${pedidoId}/estado`).once('value');
        const estadoActual = pedidoSnap.val();

        if (estadoActual !== 'COCCIÓN') {
            clearInterval(intervalo);
            delete intervalosContador[pedidoId];
            return;
        }

        tiempo = tiempo - (1/60);
        await database.ref(`pedidos/${pedidoId}/tiempo_restante`).set(tiempo);

        if (tiempo > 0) {
            const minutos = Math.ceil(tiempo);
            timerElement.innerHTML = `⏱️ Faltan ${minutos} min para que esté listo`;
            timerElement.className = 'text-sm font-bold text-blue-600';
        } else {
            const retraso = Math.abs(Math.floor(tiempo)) + 1;
            timerElement.innerHTML = `⏰ ${retraso} min de retraso`;
            timerElement.className = 'text-sm font-bold text-red-600';
            const parent = timerElement.parentElement;
            if (parent && !parent.querySelector('.retraso-msg')) {
                const msg = document.createElement('p');
                msg.className = 'text-xs text-red-500 font-semibold mt-1 retraso-msg';
                msg.textContent = '⚠️ Pedido retrasado';
                parent.appendChild(msg);
            }
        }
    }, 1000);

    intervalosContador[pedidoId] = intervalo;
}

function abrirGPSCliente(pedidoId) {
    database.ref(`pedidos/${pedidoId}`).once('value', snap => {
        const p = snap.val();
        if (!p || !p.direccion) {
            Swal.fire({ title: 'Error', text: 'No hay dirección disponible', icon: 'error' });
            return;
        }
        const direccion = encodeURIComponent(p.direccion);
        const url = `https://www.google.com/maps/search/?api=1&query=${direccion}`;
        window.open(url, '_blank');
    });
}

function abrirGPSRestaurante(pedidoId) {
    database.ref(`pedidos/${pedidoId}`).once('value', snap => {
        const p = snap.val();
        if (!p || !p.restaurante_nombre) {

            return;

        const query = encodeURIComponent(p.restaurante_nombre + ' Aguadulce');

function iniciarContadorAusencia(pedidoId) {
    if (temporizadorAusencia) clearInterval(temporizadorAusencia);
    let tiempo = 360;
    const timerElement = document.getElementById('contadorTiempo');
    const btnCancelar = document.getElementById('btnCancelarAusencia');
    temporizadorAusencia = setInterval(() => {
        if (document.getElementById('modalOpciones').style.display !== 'flex') {
            clearInterval(temporizadorAusencia);
            return;
        }
        tiempo--;
        if (timerElement) {
            const m = Math.floor(tiempo/60), s = tiempo%60;
            timerElement.innerHTML = `${m}:${s.toString().padStart(2,'0')}`;
        }
        if (tiempo <= 0) {
            clearInterval(temporizadorAusencia);
            if(btnCancelar) btnCancelar.classList.remove('hidden');
        }
    }, 1000);
}

async function iniciarAusencia(pedidoId) {
    const confirm = await Swal.fire({
        title: '⚠️ Cliente ausente',
        text: '¿El cliente no responde? Podrás cancelar el pedido después de 6 minutos.',
        icon: 'warning',
        confirmButtonText: 'Iniciar espera',
        background: '#fff'
    });
    if (confirm.isConfirmed) {
        await database.ref(`pedidos/${pedidoId}`).update({ aviso_enviado: true, timestamp_aviso: Date.now() });
        avisoEnviado = true;
        Swal.fire({ title: '⏰ Espera iniciada', text: 'Tienes 6 minutos. Si el cliente no aparece, podrás cancelar.', icon: 'info', timer: 2000 });
        abrirOpcionesEntrega(pedidoId);
    }
}

async function enviarMensajeCliente(pedidoId, tipo) {
    await database.ref(`mensajes/${pedidoId}`).push({
        emisor: 'repartidor',
        texto: mensajesPredefinidos[tipo],
        timestamp: Date.now()
    });
    await database.ref(`pedidos/${pedidoId}`).update({ aviso_enviado: true, timestamp_aviso: Date.now() });

async function entregarPedido(pedidoId) {
    const snapshot = await database.ref(`pedidos/${pedidoId}`).once('value');
    const pedido = snapshot.val();
    if (!pedido) {
        Swal.fire({ title: 'Error', text: 'No se encontró el pedido', icon: 'error' });
        return;
    }
    const total = pedido.total || 0;

    const montoPagaCliente = pedido.monto_paga;
    let mensajeMontoPaga = '';
    if (montoPagaCliente && montoPagaCliente > 0) {
        const cambioCalculado = montoPagaCliente - total;
        mensajeMontoPaga = `
            <div style="background: #e0f2fe; border: 2px solid #0284c7; border-radius: 16px; padding: 12px; margin: 15px 0; text-align: center;">
                <p style="font-size: 14px; font-weight: bold; color: #0369a1;">💵 CLIENTE INDICÓ PAGO EN EFECTIVO</p>
                <p style="font-size: 20px; font-weight: 900; color: #0284c7;">Paga con: ${montoPagaCliente.toFixed(2)}€</p>
                <p style="font-size: 16px; font-weight: bold; color: ${cambioCalculado >= 0 ? '#16a34a' : '#dc2626}'}">
                    ${cambioCalculado >= 0 ? `Cambio a devolver: ${cambioCalculado.toFixed(2)}€` : `Faltan: ${Math.abs(cambioCalculado).toFixed(2)}€`}
                </p>
            </div>
        `;
    }

    if (!avisoEnviado && pedido.estado === 'EN_PUERTA') {
        const confirm = await Swal.fire({
            title: '⚠️ Aviso no enviado',
            text: '¿Quieres enviar aviso al cliente antes de cobrar?',
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'Sí, enviar aviso',
            cancelButtonText: 'Cobrar sin aviso'
        });
        if (confirm.isConfirmed) { abrirOpcionesEntrega(pedidoId); return; }
    }

    const { value: monto } = await Swal.fire({
        title: '💰 Cobro',
        html: `${mensajeMontoPaga}<p>Total a cobrar: <strong style="font-size:24px;">${total.toFixed(2)}€</strong></p>
               <input type="number" id="montoRecibido" step="0.01" class="w-full p-3 rounded-xl border mt-3" placeholder="¿Con cuánto paga?" value="${montoPagaCliente || total}">`,
        confirmButtonText: 'Confirmar entrega',
        showCancelButton: true,
        cancelButtonText: 'Cancelar',
        preConfirm: () => {
            const recibido = parseFloat(document.getElementById('montoRecibido').value);
            if (isNaN(recibido)) {
                Swal.showValidationMessage('Ingresa un monto válido');
                return false;
            }
            return { recibido: recibido };
        }
    });

    if (monto) {
        const cambio = monto.recibido - total;
        await database.ref(`pedidos/${pedidoId}`).update({
            estado: 'ENTREGADO',
            monto_recibido: monto.recibido,
            cambio_entregado: cambio >= 0 ? cambio : 0,
            timestamp_entregado: Date.now()
        });
        cerrarModalOpciones();
        Swal.fire({
            title: '✅ Pedido Entregado',
            html: `<p>Total: ${total.toFixed(2)}€</p>
                   ${montoPagaCliente ? `<p>Cliente pagó con: ${montoPagaCliente.toFixed(2)}€</p>` : ''}
                   ${cambio >= 0 ? `<p>Cambio: ${cambio.toFixed(2)}€</p>` : '<p>Pago exacto</p>'}`,
            icon: 'success',
            timer: 2500,
            showConfirmButton: false
        });
    }
}

async function cancelarPorAusencia(pedidoId) {
    const confirm = await Swal.fire({
        title: '¿Cancelar?',
        text: 'El cliente no se presentó. Se generará una deuda.',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Sí, cancelar'
    });

    if (confirm.isConfirmed) {
        const pedidoSnap = await database.ref(`pedidos/${pedidoId}`).once('value');
        const pedido = pedidoSnap.val();
        const deuda = pedido?.total || 0;
        const emailSanitizado = sanitizarEmail(pedido?.cliente_email);

        const mensajeCancelacion = `❌ PEDIDO CANCELADO POR AUSENCIA\n\nHola ${pedido?.cliente_nombre},\n\n⚠️ No te presentaste a recibir tu pedido después de que el repartidor te avisó.\n\n💰 Deuda generada: ${deuda.toFixed(2)}€\n\n🚫 Tu cuenta ha sido BLOQUEADA temporalmente.\n\n📞 Para regularizar tu situación, contacta con soporte:\n   ✉️ soporteaguadulcexpress26@gmail.com\n   📞 643 261 881\n\nGracias por tu comprensión.`;

        await database.ref(`mensajes/${pedidoId}`).push({
            emisor: 'sistema',
            texto: mensajeCancelacion,
            tipo: 'cancelacion',
            timestamp: Date.now(),
            leido: false
        });

        await database.ref(`clientes_morosos/${emailSanitizado}`).set({
            email_original: pedido?.cliente_email,
            nombre: pedido?.cliente_nombre,
            motivo: 'No se presentó a recibir el pedido',
            deuda: deuda,
            fecha: Date.now(),
            activo: true
        });

        await database.ref(`pedidos/${pedidoId}`).update({
            estado: 'CANCELADO_POR_AUSENCIA',
            deuda_generada: deuda,
            mensaje_cancelacion_enviado: true,
            timestamp_cancelacion: Date.now()
        });

        cerrarModalOpciones();
        Swal.fire({
            title: '❌ Cancelado',
            text: `Deuda registrada: ${deuda.toFixed(2)}€`,
            icon: 'error'
        });

}

// ============================================================
// 📌 FUNCIONES UTILITARIAS
// ============================================================
function escapeHTML(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
}

function sanitizarEmail(email) {
    if (!email) return '';
    return email.replace(/\./g, '_').replace(/[#$\[\]]/g, '_');
}

async function abrirMiBilletera() {
    if (!repartidorActual || !repartidorActual.id) {

// ============================================================
// 📡 LISTENERS EN TIEMPO REAL
// ============================================================
function activarListenersBilletera() {
    const uid = repartidorActual.id;
    const bilRef = database.ref(`repartidores/${uid}/billetera/datos`);
    const movRef = database.ref(`repartidores/${uid}/billetera/movimientos`);

    // Listener del saldo (se actualiza en vivo)
    billeteraListener = bilRef.on('value', (snap) => {
        const bil = snap.val() || {};
        actualizarVistaBilletera(bil);
    });

    // Listener de movimientos (se actualizan en vivo)
    movimientosListener = movRef.limitToLast(30).on('value', (snap) => {
        const movs = snap.val() || {};
        actualizarMovimientosBilletera(movs);
    });
}

// ============================================================
// 💰 CARGAR DATOS (primera vez)
// ============================================================
async function cargarBilletera() {
    const uid = repartidorActual.id;

    try {
        // Cargar saldo
        const bilSnap = await database.ref(`repartidores/${uid}/billetera/datos`).once('value');
        const bil = bilSnap.val() || {};
        actualizarVistaBilletera(bil);

        // Cargar movimientos
        const movSnap = await database.ref(`repartidores/${uid}/billetera/movimientos`)
            .limitToLast(30).once('value');
        const movs = movSnap.val() || {};
        actualizarMovimientosBilletera(movs);

    } catch (error) {
        console.error('❌ Error cargando billetera:', error);
        document.getElementById('billeteraContenido').innerHTML = `
            <div class="text-center p-6">

                <button onclick="cargarBilletera()" class="btn-primary mt-4">🔄 Reintentar</button>

    }
}

// 🎨 ACTUALIZAR LISTA DE MOVIMIENTOS
// ============================================================
function actualizarMovimientosBilletera(movs) {
    const container = document.getElementById('listaMovimientos');
    if (!container) return;

    const arr = Object.entries(movs)
        .map(([id, m]) => ({ id, ...m }))
        .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0))
        .slice(0, 30);

    if (arr.length === 0) {
        container.innerHTML = '<div style="text-align:center;color:#94a3b8;padding:20px;">📭 Sin movimientos aún</div>';
        return;
    }

    let html = '';
    for (const m of arr) {
        const fecha = new Date(m.timestamp || 0);
        const fechaStr = fecha.toLocaleString('es-ES', {
            day: '2-digit', month: '2-digit',
            hour: '2-digit', minute: '2-digit'
        });

        const esCobro = m.tipo === 'cobro';
        const esCaja = m.tipo === 'entrega_caja';
        const icono = esCobro ? '✅' : (esCaja ? '💵' : '📝');
        const color = esCobro ? '#10b981' : (esCaja ? '#06b6d4' : '#f59e0b');
        const signo = esCobro ? '+' : '-';
        const metodoIcono = m.metodo_pago === 'Tarjeta' ? '💳' : '💵';

        const titulo = esCobro
            ? `#${escapeHTML(m.pedido_id || m.id.substring(0,10))} ${metodoIcono}`
            : (esCaja ? '💵 Entrega a caja' : m.tipo);

        const subtitulo = esCobro
            ? `${escapeHTML(m.cliente_nombre || '')} ${m.restaurante_nombre ? '· ' + escapeHTML(m.restaurante_nombre) : ''}`
            : (m.nota || m.registrado_por || '');

        html += `
            <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f1f5f9;">
                <div style="flex:1;min-width:0;">
                    <div style="font-weight:600;color:#1e293b;font-size:13px;">
                        ${icono} ${titulo}
                    </div>
                    <div style="color:#94a3b8;font-size:11px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                        ${subtitulo}
                    </div>
                </div>
                <div style="text-align:right;margin-left:10px;">
                    <div style="color:${color};font-weight:800;font-size:15px;">${signo}${(m.monto||0).toFixed(2)}€</div>
                    <div style="color:#cbd5e1;font-size:10px;">${fechaStr}</div>
                </div>
            </div>
        `;
    }
    container.innerHTML = html;
}

// ============================================================
document.addEventListener('DOMContentLoaded', () => {
    // 📱 Crear canal de notificaciones al iniciar la app
    crearCanalNotificaciones();

    if (localStorage.getItem('repartidor_actual')) {
        try {
            repartidorActual = JSON.parse(localStorage.getItem('repartidor_actual'));
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboardPanel').classList.remove('hidden');
            document.getElementById('repartidorNombreDisplay').innerText = repartidorActual.nombre;
            
            const headerBg = document.getElementById('repartoHeaderBg');
            if (headerBg) {
                headerBg.style.backgroundImage = "url('https://i.postimg.cc/Jh8cGWf9/Copilot-20260407-120738.png')";
            }
            
            // ✅ YA NO USAMOS signInAnonymously (ITEM #7)
            // El repartidor debe tener sesión REAL de Firebase Auth.
            // Si no hay usuario autenticado, se fuerza el login.
            const user = auth.currentUser;
            if (user && user.uid === repartidorActual.id) {
                console.log('✅ Sesión válida encontrada:', user.uid);
                iniciarEscuchaPedidos();
            } else {
                console.log('⚠️ Sin sesión válida. Mostrando login.');
                document.getElementById('loginScreen').classList.remove('hidden');
                document.getElementById('dashboardPanel').classList.add('hidden');
                localStorage.removeItem('repartidor_actual');
            }
        } catch (error) {
            console.error('❌ Error restaurando sesión:', error);
            localStorage.removeItem('repartidor_actual');
        }
    }
});
