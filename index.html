<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aguadulce Express v106 Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/mZwjLXxw/Logo-Aguadulce-Express.jpg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root { --cyan: #06b6d4; --dark: #020617; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--dark); color: white; margin: 0; -webkit-tap-highlight-color: transparent; }
        #loader { position: fixed; inset: 0; background: var(--dark); z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(6,182,212,0.1); border-top-color: var(--cyan); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .brand-header { position: relative; height: 180px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; }
        #header-bg { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 1; filter: brightness(1.1); }
        .brand-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(2,6,23,0.8) 0%, transparent 50%); }
        .plato-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 1.5rem; padding: 15px; display: flex; align-items: center; gap: 15px; margin-bottom: 12px; }
        #modal-plato, #panel-checkout, #modal-legal, #modal-alerta-pro, #modal-exito, #panel-revision { position: fixed; inset: 0; background: var(--dark); z-index: 1000; display: none; flex-direction: column; overflow-y: auto; }
        .step-tag { font-weight: 800; font-size: 10px; text-transform: uppercase; color: var(--cyan); letter-spacing: 1px; margin-bottom: 10px; display: block; }
        .grid-option { border: 1px solid rgba(255,255,255,0.1); padding: 12px; text-align: center; font-size: 11px; font-weight: 600; border-radius: 12px; cursor: pointer; }
        .grid-option.selected { border-color: var(--cyan); background: rgba(6,182,212,0.1); color: var(--cyan); }
        input, select { background: rgba(255,255,255,0.05)!important; border: 1px solid rgba(255,255,255,0.1)!important; padding: 14px!important; border-radius: 12px!important; color: white!important; width: 100%; }
        .cat-chip { padding: 10px 20px; background: rgba(255,255,255,0.05); border-radius: 15px; font-size: 11px; font-weight: 800; white-space: nowrap; border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); }
        .cat-chip.active { background: var(--cyan); color: var(--dark); border-color: var(--cyan); }
        .track-node { position: relative; display: flex; flex-direction: column; align-items: center; flex: 1; }
        .track-line { position: absolute; top: 15px; left: 50%; width: 100%; height: 2px; background: rgba(255,255,255,0.1); z-index: 1; }
        .track-dot { width: 30px; height: 30px; border-radius: 50%; background: #1e293b; z-index: 2; display: flex; align-items: center; justify-content: center; font-size: 12px; border: 2px solid rgba(255,255,255,0.1); }
        .track-node.active .track-dot { background: var(--cyan); border-color: var(--cyan); color: var(--dark); box-shadow: 0 0 15px var(--cyan); }
        .marquee { overflow: hidden; white-space: nowrap; background: rgba(6,182,212,0.1); padding: 8px 0; border-bottom: 1px solid rgba(6,182,212,0.2); }
        .marquee p { display: inline-block; padding-left: 100%; animation: marquee 25s linear infinite; font-size: 10px; font-weight: 800; color: var(--cyan); text-transform: uppercase; }
        @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }
        .img-zoom { position: fixed; inset: 0; z-index: 9999; object-fit: contain !important; background: rgba(0,0,0,0.95); height: 100vh !important; cursor: zoom-out; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9); display: none; justify-content: center; align-items: center; z-index: 10000; backdrop-filter: blur(5px); }
        .registration-card { background: #1a1a2e; padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; border: 1px solid #333; }
        .hidden { display: none !important; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body class="bg-black text-white font-sans selection:bg-cyan-500/30">

    <div id="loader">
        <div class="spinner mb-4"></div>
        <p class="text-cyan-400 text-[10px] font-black uppercase">Sincronizando Aguadulce Express...</p>
    </div>

    <header class="brand-header">
        <div id="header-bg"></div>
        <div class="brand-overlay"></div>
        <div class="relative z-10 flex items-center gap-4">
            <img id="app-logo" src="" class="w-12 h-12 rounded-full border-2 border-cyan-400 bg-white">
            <div>
                <h1 class="text-xl font-black italic uppercase leading-none">Aguadulce</h1>
                <p class="text-cyan-400 text-[8px] font-black uppercase tracking-widest">Express</p>
            </div>
        </div>
    </header>

    <div id="cintillo-mensajes" class="marquee"><p id="texto-anuncio">¡Bienvenidos a Aguadulce Express! Los mejores restaurantes...</p></div>

    <main id="app-container" class="px-5 py-6 pb-32"></main>

    <div id="cesta-flotante" class="fixed bottom-6 left-4 right-4 bg-white text-black p-0 rounded-[2rem] hidden flex-col z-[100] shadow-2xl overflow-hidden border-2 border-cyan-400">
        <div class="p-5 flex items-center gap-4" onclick="abrirRevision()">
            <div class="bg-cyan-400 w-12 h-12 rounded-2xl flex items-center justify-center text-2xl">🛒</div>
            <div class="flex-1 text-left">
                <span id="cesta-info" class="font-black text-sm italic uppercase block text-black">0 PRODUCTOS</span>
                <span id="cesta-total" class="font-bold text-cyan-600 text-xs uppercase tracking-tighter">0.00€ TOTAL</span>
            </div>
            <button onclick="abrirRevision(true); event.stopPropagation();" class="bg-red-100 text-red-600 p-3 rounded-xl font-black flex items-center justify-center mr-2">
                <span class="text-xs uppercase italic">Vaciar</span>
            </button>
        </div>
    </div>

    <div id="modal-plato">
        <button onclick="cerrarModal()" class="absolute top-5 left-5 z-[1001] bg-black/60 w-10 h-10 rounded-full text-white">✕</button>
        <img id="modal-img" src="" class="w-full h-[220px] object-cover">
        <div class="p-6 pb-40 text-left">
            <div class="flex justify-between items-start mb-6">
                <div class="flex-1 pr-4">
                    <h2 id="modal-titulo" class="text-2xl font-black italic uppercase leading-tight"></h2>
                    <p id="modal-desc" class="text-white/50 text-xs mt-2"></p>
                </div>
                <div id="modal-precio-base" class="bg-cyan-400 text-black px-4 py-2 rounded-xl font-black text-lg">0€</div>
            </div>
            <div id="contenedor-pasos" class="space-y-8"></div>
        </div>
        <div class="fixed bottom-0 left-0 right-0 p-5 bg-dark">
            <div class="flex items-center justify-center gap-6 mb-4 bg-white/5 py-3 rounded-2xl">
                <button onclick="cambiarCantPlato(-1)" class="w-10 h-10 rounded-xl bg-white/10 text-white">-</button>
                <span id="cant-plato-modal" class="text-xl font-black italic">1</span>
                <button onclick="cambiarCantPlato(1)" class="w-10 h-10 rounded-xl bg-cyan-400 text-black">+</button>
            </div>
            <button id="btn-anadir-modal" onclick="confirmarAnadir()" class="w-full bg-cyan-400 text-black font-black py-5 rounded-2xl flex justify-between px-8">
                <span>Añadir al Carrito</span>
                <span id="total-modal-btn">0.00€</span>
            </button>
        </div>
    </div>

    <div id="modal-registro" class="modal-overlay">
        <div class="registration-card">
            <h2 class="text-2xl font-black uppercase italic text-cyan-400">¡Bienvenido!</h2>
            <p class="text-gray-400 text-sm mb-6">Regístrate para pedir.</p>
            <div class="space-y-4">
                <input type="text" id="reg-nombre" placeholder="Nombre Completo">
                <input type="tel" id="reg-telf" placeholder="600000000">
                <input type="text" id="reg-dir" placeholder="Calle, número, portal...">
                <div class="flex items-start gap-2 text-left">
                    <input type="checkbox" id="reg-legal" class="mt-1">
                    <label for="reg-legal" class="text-[10px] text-gray-400">Acepto los términos y la Ley de Protección de Datos.</label>
                </div>
                <button class="w-full bg-cyan-400 text-black font-black py-4 rounded-xl" onclick="guardarRegistro()">GUARDAR Y EMPEZAR</button>
            </div>
        </div>
    </div>

    <div id="panel-checkout" class="fixed inset-0 z-[5000] bg-dark p-6 hidden overflow-y-auto">
        <div class="flex items-center gap-4 mb-8">
            <button onclick="cerrarCheckout()" class="w-10 h-10 rounded-xl bg-white/5 text-cyan-400 flex items-center justify-center">←</button>
            <h2 class="text-xl font-black italic uppercase">Caja de Pago</h2>
        </div>
        <div id="cliente-identificado" class="bg-white/5 p-4 rounded-2xl mb-6">
            <p class="text-cyan-400 text-xs font-black uppercase mb-1">Entregar a:</p>
            <p id="info-cliente-logueado" class="text-sm italic"></p>
        </div>
        <div id="desglose-pago"></div>
        <select id="metodo-pago" class="mt-6">
            <option value="Efectivo">Efectivo (Pagar al recibir)</option>
            <option value="Tarjeta">Tarjeta Datáfono (Pagar al recibir)</option>
        </select>
        <button id="btn-final" onclick="enviarPedidoFinal()" class="w-full bg-cyan-400 text-black font-black py-5 rounded-2xl mt-8">PROCESAR ORDEN</button>
    </div>

    <div id="modal-exito" class="fixed inset-0 z-[6000] hidden items-center justify-center p-6 bg-black/95">
        <div id="card-seguimiento" class="bg-dark border border-cyan-400/30 p-8 rounded-[2.5rem] w-full max-w-sm text-center"></div>
    </div>

    <script>
        // CONFIGURACIÓN FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyCJcLQ0ikUwZSV7L_8mLLax8B5qnhP0Roc",
            authDomain: "aguadulce-notificaciones.firebaseapp.com",
            databaseURL: "https://aguadulce-notificaciones-default-rtdb.firebaseio.com/",
            projectId: "aguadulce-notificaciones",
            storageBucket: "aguadulce-notificaciones.firebasestorage.app",
            messagingSenderId: "940283725281",
            appId: "1:940283725281:web:3b388d2e7f362a99d2bea0"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzYFDShcrP7I4FKhiH3q5UcEInpSKJstrumJ9ddI4Tj9S31ZUgwiuie81fGFmCJ6ob2/exec';

        // VARIABLES GLOBALES
        let db = { menu: [], restaurantes: [], config: {}, anuncios: [], legal: "" };
        let cesta = [];
        let rActivo = { id: null, nombre: "", foto: "" };
        let itemActual = { pBase: 0, pOpciones: 0, pExtras: 0, cantidad: 1, obligatorioOk: false, data: null };
        let fondoOriginal = "";

        // INICIO
        async function init() {
            try {
                const res = await fetch(scriptURL);
                const data = await res.json();
                db.restaurantes = data.RESTAURANTES.filter(r => r.NOMBRE_RESTAURANTE && r.NOMBRE_RESTAURANTE !== "ADMIN");
                db.menu = data.MENU_GENERAL;
                db.anuncios = data.ANUNCIOS || [];
                
                if (data.CONFIG && data.CONFIG[0]) {
                    const c = data.CONFIG[0];
                    document.getElementById('app-logo').src = c.LOGO_URL;
                    document.getElementById('header-bg').style.backgroundImage = `url('${c.FONDO_URL}')`;
                    fondoOriginal = c.FONDO_URL;
                }
                
                if(db.anuncios.length > 0) {
                    document.getElementById('texto-anuncio').innerText = db.anuncios.map(a => a.TEXTO).join(" • ");
                }

                document.getElementById('loader').style.display = 'none';
                renderHome();
                escucharPedidoActivo();
            } catch (e) { console.error(e); }
        }

        // RENDER TIENDAS
        function renderHome() {
            document.getElementById('header-bg').style.backgroundImage = `url('${fondoOriginal}')`;
            let html = `<p class="step-tag mb-6 ml-2 italic text-left text-white/50">Selecciona un restaurante</p>`;
            db.restaurantes.forEach(r => {
                const cerrado = String(r.ESTADO).toLowerCase() === "cerrado";
                html += `
                <div class="relative rounded-[2.5rem] overflow-hidden h-[160px] mb-5 border border-white/5 shadow-xl ${cerrado ? 'grayscale opacity-50 pointer-events-none' : 'active:scale-95 cursor-pointer'}" 
                     onclick="abrirTienda('${r.NOMBRE_RESTAURANTE}', '${r.ID_RESTAURANTE}', '${r.FOTO}', '${r.ESTADO}')">
                    <img src="${r.FOTO}" class="absolute inset-0 w-full h-full object-cover opacity-70">
                    <div class="absolute inset-0 bg-gradient-to-t from-dark"></div>
                    <div class="absolute bottom-6 left-8 text-2xl font-black italic uppercase">${r.NOMBRE_RESTAURANTE}</div>
                    <div class="absolute bottom-6 right-6 bg-black/80 px-3 py-1 rounded-xl">
                        <p class="text-[10px] font-black italic uppercase ${cerrado ? 'text-red-500' : 'text-cyan-400'}">${cerrado ? 'Cerrado' : (r.HORARIO_INFO || 'Abierto')}</p>
                    </div>
                </div>`;
            });
            document.getElementById('app-container').innerHTML = html;
        }

        function abrirTienda(nombre, id, foto, estado) {
            if (cesta.length > 0 && String(rActivo.id) !== String(id)) {
                if(confirm(`Tienes productos de ${rActivo.nombre}. ¿Vaciar cesta?`)) { cesta = []; actualizarCestaBar(); } else return;
            }
            rActivo = { id, nombre, foto };
            document.getElementById('header-bg').style.backgroundImage = `url('${foto}')`;
            verMenu();
        }

        function verMenu() {
            const platos = db.menu.filter(p => String(p.ID_RESTAURANTE) === String(rActivo.id));
            let html = `<div class="flex items-center gap-4 mb-6"><button onclick="renderHome()" class="w-10 h-10 rounded-xl bg-white/5 text-cyan-400">←</button><h2 class="text-lg font-black uppercase italic">${rActivo.nombre}</h2></div><div id="lista-platos" class="space-y-3">`;
            platos.forEach(p => {
                html += `<div class="plato-card" onclick='abrirDetalle(${JSON.stringify(p)})'>
                    <div class="flex-1 text-left"><h4 class="font-black text-sm uppercase">${p.PLATO}</h4><p class="text-cyan-400 font-bold">${parseFloat(p.PRECIO).toFixed(2)}€</p></div>
                    <img src="${p.FOTO_PLATO}" class="w-16 h-16 rounded-xl object-cover">
                </div>`;
            });
            document.getElementById('app-container').innerHTML = html;
        }

        // DETALLE PLATO
        function abrirDetalle(p) {
            itemActual = { pBase: parseFloat(p.PRECIO), pOpciones: 0, pExtras: 0, cantidad: 1, obligatorioOk: !p.SELECCION_OBLIGATORIA, data: p };
            document.getElementById('modal-titulo').innerText = p.PLATO;
            document.getElementById('modal-desc').innerText = p.DESCRIPCION || "";
            document.getElementById('modal-img').src = p.FOTO_PLATO;
            document.getElementById('modal-precio-base').innerText = itemActual.pBase.toFixed(2) + "€";
            
            let html = "";
            const renderGrid = (titulo, datos, tipo) => {
                if (!datos) return "";
                let res = `<div class="mb-6"><span class="step-tag">${titulo}</span><div class="grid grid-cols-2 gap-2">`;
                datos.split(',').forEach(d => {
                    const partes = d.split(':');
                    res += `<div class="grid-option" onclick="toggleSel(this, ${parseFloat(partes[1]) || 0}, '${tipo}')">${partes[0].trim()}</div>`;
                });
                return res + `</div></div>`;
            };

            html += renderGrid("Selección Obligatoria", p.SELECCION_OBLIGATORIA, 'oblig');
            html += renderGrid("Opciones", p.SELECCION_UNICA, 'unica');

            if (p.EXTRAS) {
                html += `<div class="pb-40"><span class="step-tag">Extras</span><div class="space-y-2">`;
                p.EXTRAS.split(',').forEach(d => {
                    const partes = d.split(':');
                    const n = partes[0].trim(); const pr = parseFloat(partes[1]) || 0;
                    html += `<div class="flex justify-between items-center py-3 border-b border-white/5"><span class="text-[11px] font-bold uppercase">${n}</span><div class="flex items-center gap-4"><span class="text-cyan-400 text-[10px]">+${pr.toFixed(2)}€</span><div class="flex items-center gap-3 bg-white/5 p-1 rounded-xl"><button onclick="updEx(this, -1, ${pr})" class="w-8 h-8 rounded-lg bg-white/5">-</button><span class="qty text-xs font-black" data-nombre="${n}">0</span><button onclick="updEx(this, 1, ${pr})" class="w-8 h-8 rounded-lg bg-cyan-400 text-black">+</button></div></div></div>`;
                });
                html += `</div></div>`;
            }
            document.getElementById('contenedor-pasos').innerHTML = html;
            document.getElementById('modal-plato').style.display = 'flex';
            actualizarBarraModal();
        }

        function toggleSel(el, pr, tipo) {
            if (tipo === 'oblig') {
                el.parentElement.querySelectorAll('.grid-option').forEach(o => o.classList.remove('selected'));
                el.classList.add('selected');
            } else { el.classList.toggle('selected'); }
            let opt = 0; document.querySelectorAll('.grid-option.selected').forEach(s => { if(s.innerText.includes('+')) opt += parseFloat(s.innerText.split('+')[1]) || 0; });
            itemActual.pOpciones = opt;
            itemActual.obligatorioOk = !itemActual.data.SELECCION_OBLIGATORIA || document.querySelectorAll('.grid-option.selected').length > 0;
            actualizarBarraModal();
        }

        function updEx(btn, mod, pr) {
            const s = btn.parentElement.querySelector('.qty');
            let v = parseInt(s.innerText) + mod;
            if(v >= 0) { s.innerText = v; itemActual.pExtras += (mod * pr); actualizarBarraModal(); }
        }

        function actualizarBarraModal() {
            const total = (itemActual.pBase + itemActual.pOpciones + itemActual.pExtras) * itemActual.cantidad;
            document.getElementById('total-modal-btn').innerText = total.toFixed(2) + "€";
            document.getElementById('btn-anadir-modal').disabled = !itemActual.obligatorioOk;
            document.getElementById('btn-anadir-modal').style.opacity = itemActual.obligatorioOk ? "1" : "0.3";
        }

        function cerrarModal() { document.getElementById('modal-plato').style.display = 'none'; }
        function cambiarCantPlato(mod) { itemActual.cantidad = Math.max(1, itemActual.cantidad + mod); document.getElementById('cant-plato-modal').innerText = itemActual.cantidad; actualizarBarraModal(); }

        // CESTA
        function confirmarAnadir() {
            if (!localStorage.getItem('ae_cliente')) { cerrarModal(); document.getElementById('modal-registro').style.display = 'flex'; return; }
            let sel = []; document.querySelectorAll('.grid-option.selected').forEach(el => sel.push(el.innerText));
            document.querySelectorAll('.qty').forEach(el => { if(parseInt(el.innerText) > 0) sel.push(`${el.innerText}x ${el.dataset.nombre}`); });
            cesta.push({ nombre: `${itemActual.cantidad}x ${itemActual.data.PLATO} [${sel.join(', ')}]`, total: (itemActual.pBase + itemActual.pOpciones + itemActual.pExtras) * itemActual.cantidad });
            actualizarCestaBar(); cerrarModal();
        }

        function actualizarCestaBar() {
            const t = cesta.reduce((acc, i) => acc + i.total, 0);
            document.getElementById('cesta-flotante').classList.toggle('hidden', cesta.length === 0);
            document.getElementById('cesta-info').innerText = `${cesta.length} PRODUCTOS`;
            document.getElementById('cesta-total').innerText = `${t.toFixed(2)}€ TOTAL`;
        }

        function abrirRevision(vaciar = false) {
            if(vaciar) { if(confirm("¿Vaciar cesta?")) { cesta = []; actualizarCestaBar(); } return; }
            let html = "";
            cesta.forEach((item, index) => {
                html += `<div class="bg-white/5 p-4 rounded-2xl flex justify-between items-center mb-2"><div><p class="text-xs uppercase font-black">${item.nombre}</p><p class="text-cyan-400 font-bold">${item.total.toFixed(2)}€</p></div><button onclick="eliminarItem(${index})" class="text-red-500 font-black">✕</button></div>`;
            });
            document.getElementById('items-revision').innerHTML = html;
            document.getElementById('panel-revision').style.display = 'flex';
        }
        function eliminarItem(i) { cesta.splice(i, 1); if(cesta.length === 0) document.getElementById('panel-revision').style.display='none'; else abrirRevision(); actualizarCestaBar(); }

        // CHECKOUT
        function abrirCheckout() {
            const sub = cesta.reduce((a, b) => a + b.total, 0);
            const totalF = sub + 2.50 + 0.99;
            document.getElementById('desglose-pago').innerHTML = `
                <div class="bg-white/5 p-5 rounded-3xl space-y-2 border border-white/5">
                    <div class="flex justify-between text-gray-400 italic"><span>Subtotal</span><span>${sub.toFixed(2)}€</span></div>
                    <div class="flex justify-between text-gray-400 italic"><span>Envío y Gestión</span><span>3.49€</span></div>
                    <div class="flex justify-between text-cyan-400 font-black text-xl border-t border-white/10 pt-3 mt-2 italic"><span>TOTAL</span><span>${totalF.toFixed(2)}€</span></div>
                </div>
                <textarea id="cliente-notas" placeholder="Ej: Piso 3, puerta B..." class="w-full bg-white/5 border border-white/10 rounded-2xl p-4 mt-4 text-white h-24 resize-none"></textarea>`;
            
            const u = JSON.parse(localStorage.getItem('ae_cliente'));
            document.getElementById('info-cliente-logueado').innerText = `${u.nombre} | ${u.telf}\n${u.dir}`;
            document.getElementById('panel-checkout').style.setProperty('display', 'block', 'important');
        }

        function cerrarCheckout() { document.getElementById('panel-checkout').style.display = 'none'; }

        async function enviarPedidoFinal() {
            const u = JSON.parse(localStorage.getItem('ae_cliente'));
            const totalF = (cesta.reduce((a, b) => a + b.total, 0) + 3.49).toFixed(2);
            const btn = document.getElementById('btn-final');
            btn.innerText = "⏳ ENVIANDO..."; btn.disabled = true;

            const paquete = {
                cliente_info: u.nombre, telf_info: u.telf, dir_info: u.dir,
                pedido_info: cesta.map(i => i.nombre).join(" | "), total_info: totalF + "€",
                pago_info: document.getElementById('metodo-pago').value, id_res_info: rActivo.id,
                notas_info: document.getElementById('cliente-notas').value || "Sin notas"
            };

            try {
                const formData = new FormData(); formData.append("data", JSON.stringify(paquete));
                const res = await fetch(scriptURL, { method: "POST", body: formData });
                const resp = await res.json();
                const pid = resp.idPedido;

                await database.ref('pedidos/' + pid).set({ id: pid, cliente: u.nombre, estado: 'recibido', total: totalF + "€", timestamp: Date.now() });

                localStorage.setItem('ae_pedido_id', pid);
                cesta = []; actualizarCestaBar(); cerrarCheckout();
                Swal.fire("ENVIADO", `Ref: ${pid}`, "success").then(() => renderSeguimiento());
            } catch (e) { btn.innerText = "PROCESAR ORDEN"; btn.disabled = false; }
        }

        // SEGUIMIENTO
        function renderSeguimiento() {
            const pid = localStorage.getItem('ae_pedido_id');
            const card = document.getElementById('card-seguimiento');
            document.getElementById('modal-exito').style.display = 'flex';
            if(!pid) { card.innerHTML = "<p>No hay pedido.</p>"; return; }
            card.innerHTML = `
                <div class="w-16 h-16 bg-cyan-400 rounded-full flex items-center justify-center mx-auto mb-6 shadow-[0_0_20px_rgba(6,182,212,0.5)]"><svg class="w-8 h-8 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M5 13l4 4L19 7"></path></svg></div>
                <h2 class="text-xl font-black italic uppercase">¡ORDEN RECIBIDA!</h2>
                <p class="text-[10px] text-white/50 mb-6 tracking-widest uppercase">Ref: ${pid}</p>
                <div class="mb-8 bg-white/5 border border-white/10 p-4 rounded-3xl text-center"><p class="text-[9px] text-cyan-400 font-black uppercase mb-1">Estado</p><div id="countdown-display" class="text-sm font-bold italic text-white">Sincronizando...</div></div>
                <div class="flex justify-between items-start w-full relative mb-12 px-2">
                    <div class="track-node" id="node-recibido"><div class="track-line"></div><div class="track-dot">✔</div><span class="text-[8px] font-black uppercase mt-2">Recibido</span></div>
                    <div class="track-node" id="node-cocina"><div class="track-line"></div><div class="track-dot">🍳</div><span class="text-[8px] font-black uppercase mt-2">Cocina</span></div>
                    <div class="track-node" id="node-camino"><div class="track-dot">🛵</div><span class="text-[8px] font-black uppercase mt-2">Camino</span></div>
                </div>
                <button onclick="window.open('https://wa.me/34643261881', '_blank')" class="w-full bg-[#25D366] text-white py-4 rounded-2xl font-black uppercase text-[10px] mb-2">Soporte WhatsApp</button>
                <button onclick="document.getElementById('modal-exito').style.display='none'" class="w-full bg-white/5 text-white/40 py-4 rounded-2xl font-black uppercase text-[10px]">Cerrar</button>`;
            escucharPedidoActivo();
        }

        function escucharPedidoActivo() {
            const pid = localStorage.getItem('ae_pedido_id');
            const btnM = document.getElementById('btn-reabrir-seguimiento');
            if(!pid) return;
            database.ref('pedidos/' + pid).on('value', snap => {
                const data = snap.val();
                if(!data || data.estado === 'entregado') { localStorage.removeItem('ae_pedido_id'); if(btnM) btnM.style.display='none'; return; }
                if(btnM) btnM.style.display='block';
                const est = String(data.estado).toLowerCase();
                document.querySelectorAll('.track-node').forEach(n => n.classList.remove('active'));
                document.getElementById('node-recibido')?.classList.add('active');
                if(est !== 'recibido') document.getElementById('node-cocina')?.classList.add('active');
                if(['en camino', 'llegó', 'llegó 📍', 'entregado'].includes(est)) document.getElementById('node-camino')?.classList.add('active');
                const d = document.getElementById('countdown-display');
                if(d) d.innerText = est.toUpperCase();
            });
        }

        function guardarRegistro() {
            const n = document.getElementById('reg-nombre').value; const t = document.getElementById('reg-telf').value; const d = document.getElementById('reg-dir').value;
            if(!n || !t || !d) { alert("Completa los datos"); return; }
            localStorage.setItem('ae_cliente', JSON.stringify({ nombre: n, telf: t, dir: d }));
            document.getElementById('modal-registro').style.display = 'none';
        }

        function toggleZoom(el) { el.classList.toggle('img-zoom'); }
        function filtrarCat(cat, el) {
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active')); el.classList.add('active');
            document.querySelectorAll('.plato-card').forEach(p => { p.style.display = (cat === 'TODOS' || p.dataset.cat === cat) ? 'flex' : 'none'; });
        }

        init();
    </script>
</body>
</html>
