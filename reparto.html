<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AE COCINA V70 - PROFESIONAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        /* ESTILOS DIRECTOS (por si Tailwind falla) */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #020617 !important; 
            color: white !important; 
            min-height: 100vh;
        }
        .glass { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255,255,255,0.05); 
        }
        .card-stats { 
            background: rgba(30, 41, 59, 0.5); 
            border: 1px solid rgba(255,255,255,0.03); 
            border-radius: 1.5rem; 
        }
        .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #06b6d4; }
        input:checked + .slider:before { transform: translateX(22px); }
        .modal-blur { backdrop-filter: blur(12px); background: rgba(0,0,0,0.85); }
        .ticket-font { font-family: 'JetBrains+Mono', monospace; white-space: pre-wrap; line-height: 1.4; }
        .btn-logout { position: fixed; bottom: 20px; right: 20px; z-index: 100; width: 45px; height: 45px; border-radius: 12px; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .btn-tiempo { transition: all 0.2s; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; }
        .btn-tiempo:active { scale: 0.90; }
        .t-15 { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .t-30 { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .t-45 { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .nuevo-pedido { animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(6,182,212,0.4); } 50% { box-shadow: 0 0 0 8px rgba(6,182,212,0); } }
        
        /* Asegurar fondo oscuro en todo */
        .bg-slate-950 { background-color: #020617; }
        .text-white { color: white; }
        .hidden { display: none; }
        
        button { cursor: pointer; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body class="min-h-screen pb-24" style="background-color:#020617; color:white;">

    <!-- AUDIO MEJORADO -->
    <audio id="alerta" src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_c6c8b7c1c1.mp3" preload="auto"></audio>

    <!-- PANTALLA DE LOGIN -->
    <div id="loginScreen" class="fixed inset-0 z-[100]" style="background-color:#020617; display:flex; align-items:center; justify-content:center; padding:20px;">
        <div class="glass w-full max-w-xs rounded-[2.5rem] p-8 text-center shadow-2xl" style="background: rgba(30,41,59,0.7);">
            <div class="text-cyan-400 font-black italic text-3xl mb-1">AE</div>
            <h2 class="text-white font-black italic text-xl mb-6 tracking-tighter uppercase font-bold">Cocina</h2>
            <input type="text" id="pinInput" placeholder="PIN" class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 text-center text-2xl font-black text-cyan-400 focus:outline-none mb-4 uppercase" style="color:white;">
            <button onclick="verificarPIN()" class="w-full bg-cyan-500 text-black py-4 rounded-2xl font-black uppercase active:scale-95 transition-transform shadow-lg shadow-cyan-500/20" style="background-color:#06b6d4;">Entrar</button>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div id="appContent" class="hidden" style="background-color:#020617; min-height:100vh;">
        <nav class="sticky top-0 z-40 glass border-b border-white/5 p-4 shadow-2xl" style="background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px);">
            <div class="max-w-xl mx-auto flex justify-between items-start">
                <div>
                    <h1 class="text-cyan-400 font-black italic tracking-tighter text-xl leading-none">AGUADULCE EXPRESS</h1>
                    <p id="resNombreDisplay" class="text-sm text-white font-black uppercase mt-1 italic tracking-tight underline decoration-cyan-500/50">Cargando...</p>
                </div>
                <div class="flex items-center gap-4">
                    <div class="relative">
                        <button onclick="abrirHistorial()" class="bg-white/5 p-2 rounded-xl border border-white/10 shadow-lg">
                            <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </button>
                        <span id="contadorPendientes" class="absolute -top-2 -right-2 bg-red-500 text-white text-[10px] font-black px-1.5 py-0.5 rounded-full">0</span>
                    </div>
                    <div class="flex flex-col items-end">
                        <span id="txtEstado" class="text-[8px] font-black mb-1 uppercase tracking-widest text-emerald-400">---</span>
                        <label class="switch">
                            <input type="checkbox" id="tiendaToggle" onchange="confirmarToggleTienda()">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>
        </nav>

        <main class="max-w-xl mx-auto p-4 space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div class="card-stats p-4 text-center border-l-2 border-white/10 shadow-xl" style="background: rgba(30, 41, 59, 0.5);">
                    <p class="text-[8px] font-bold text-slate-500 uppercase">HOY</p>
                    <p id="statHoy" class="text-xl font-black text-white">0.00€</p>
                </div>
                <div class="card-stats p-4 text-center border-l-2 border-cyan-500/20 shadow-xl" style="background: rgba(30, 41, 59, 0.5);">
                    <p class="text-[8px] font-bold text-slate-500 uppercase">SEMANA</p>
                    <p id="statSemana" class="text-xl font-black text-cyan-400">0.00€</p>
                </div>
            </div>
            <div id="lista" class="space-y-4"></div>
        </main>

        <button onclick="preguntarSalir()" class="btn-logout shadow-lg">
            <svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
    </div>

    <!-- MODALES -->
    <div id="customModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 modal-blur" style="backdrop-filter: blur(12px); background: rgba(0,0,0,0.85);">
        <div class="glass w-full max-w-sm rounded-[2.5rem] p-6 border border-white/10 shadow-2xl" style="background: rgba(30, 41, 59, 0.7);">
            <h3 id="modalTitle" class="text-center text-cyan-400 font-black italic uppercase mb-4 text-xs"></h3>
            <div id="modalBody" class="ticket-font bg-black/50 p-5 rounded-2xl text-[10px] text-white mb-6 border border-white/10 overflow-y-auto max-h-[50vh]"></div>
            <div id="modalFooter" class="flex gap-3"></div>
        </div>
    </div>

    <div id="sideHistorial" class="fixed inset-y-0 right-0 w-full max-w-sm glass z-50 transform translate-x-full transition-transform duration-300 p-6 overflow-y-auto shadow-2xl" style="background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(12px);">
        <div class="flex justify-between items-center mb-6 border-b border-white/10 pb-4">
            <h2 class="text-xl font-black italic text-cyan-400 uppercase">Historial Hoy</h2>
            <button onclick="cerrarHistorial()" class="text-slate-400 font-bold bg-white/5 px-3 py-1 rounded-lg text-xs uppercase">Cerrar</button>
        </div>
        <div id="listaHistorial" class="space-y-3"></div>
    </div>

    <script>
        // ==========================================
        // CONFIGURACIÓN FIREBASE
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyCJcLQ0ikUwZSV7L_8mLLax8B5qnhP0Roc",
            authDomain: "aguadulce-notificaciones.firebaseapp.com",
            databaseURL: "https://aguadulce-notificaciones-default-rtdb.firebaseio.com",
            projectId: "aguadulce-notificaciones",
            storageBucket: "aguadulce-notificaciones.firebasestorage.app",
            messagingSenderId: "940283725281",
            appId: "1:940283725281:web:3b388d2e7f362a99d2bea0"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const ACCESS_DB = { "DELI10":"6G4L1V", "CHUN20":"RT33M5", "HARO30":"8N3Z7K", "SUCU40":"TR92X5", "PERU50":"9V1L8K", "LIMA60":"FL44K8", "PECA70":"CV11Q9" };
        const scriptURL = "https://script.google.com/macros/s/AKfycbzYFDShcrP7I4FKhiH3q5UcEInpSKJstrumJ9ddI4Tj9S31ZUgwiuie81fGFmCJ6ob2/exec"; 
        
        let MI_ID_REST = localStorage.getItem('AE_REST_ID') || "";
        let pedidosActivos = [], historialHoy = [], aceptados = new Set(), tiendaAbierta = false;
        let ultimoConteo = 0;

        // Inicialización
        window.onload = () => { 
            if(MI_ID_REST) iniciarApp(); 
        };

        function verificarPIN() {
            const pin = document.getElementById('pinInput').value.trim().toUpperCase();
            if (ACCESS_DB[pin]) {
                MI_ID_REST = ACCESS_DB[pin];
                localStorage.setItem('AE_REST_ID', MI_ID_REST);
                const alerta = document.getElementById('alerta');
                alerta.play().then(() => { alerta.pause(); alerta.currentTime = 0; }).catch(e => console.log("Audio esperando..."));
                iniciarApp();
            } else { 
                alert("PIN INCORRECTO"); 
            }
        }

        function iniciarApp() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('appContent').classList.remove('hidden');
            
            database.ref('pedidosActivos').on('value', () => cargar());
            setInterval(cargar, 30000);
            cargar();
        }

        async function cargar() {
            try {
                const r = await fetch(`${scriptURL}?action=leerPanelCompleto&idRest=${MI_ID_REST}&t=${Date.now()}`);
                const data = await r.json();
                
                if(data.tienda) {
                    document.getElementById('resNombreDisplay').innerText = data.tienda.nombre || "Establecimiento";
                    const est = (data.tienda.estado || "").trim().toLowerCase();
                    tiendaAbierta = (est === "abierto");
                    document.getElementById('tiendaToggle').checked = tiendaAbierta;
                    const txtE = document.getElementById('txtEstado');
                    txtE.innerText = tiendaAbierta ? "ABIERTO" : "CERRADO";
                    txtE.className = tiendaAbierta ? "text-[8px] font-black text-emerald-400 tracking-widest" : "text-[8px] font-black text-red-500 tracking-widest";
                }

                // Valores seguros para stats
                const stats = data.stats || {};
                document.getElementById('statHoy').innerText = (stats.diaria || "0.00") + "€";
                document.getElementById('statSemana').innerText = (stats.semanal || "0.00") + "€";
                
                pedidosActivos = (data.pedidos || []).sort((a,b) => new Date(a.FECHA) - new Date(b.FECHA));
                historialHoy = data.historial || [];
                
                const nuevosPedidos = pedidosActivos.filter(p => !aceptados.has(p.ID_PEDIDO)).length;
                if(nuevosPedidos > ultimoConteo) {
                    const alerta = document.getElementById('alerta');
                    alerta.currentTime = 0;
                    alerta.play().catch(()=>{});
                    if(navigator.vibrate) navigator.vibrate(500);
                }
                ultimoConteo = nuevosPedidos;
                document.getElementById('contadorPendientes').innerText = nuevosPedidos;
                
                render();
            } catch (e) { 
                console.error(e); 
            }
        }

        function calcularTiempoTranscurrido(fechaStr) {
            if(!fechaStr) return "---";
            const fechaPedido = new Date(fechaStr);
            const ahora = new Date();
            const diffMin = Math.floor((ahora - fechaPedido) / 60000);
            if(diffMin < 1) return "Ahora mismo";
            if(diffMin < 60) return `Hace ${diffMin} min`;
            return `Hace ${Math.floor(diffMin/60)}h ${diffMin%60}min`;
        }

        function render() {
            const cont = document.getElementById('lista');
            if(pedidosActivos.length === 0) {
                cont.innerHTML = `<div class="text-center py-20 opacity-20 font-black italic text-xs uppercase tracking-widest" style="color:white;">SIN PEDIDOS</div>`;
                return;
            }
            cont.innerHTML = pedidosActivos.map(p => {
                const esNuevo = !aceptados.has(p.ID_PEDIDO);
                const claseNuevo = esNuevo ? 'ring-2 ring-cyan-500 animate-pulse' : '';
                return `
                <div class="glass p-6 rounded-[2.5rem] border border-white/5 shadow-xl ${claseNuevo}" style="background: rgba(30, 41, 59, 0.7);">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <span class="text-cyan-400 font-black text-2xl italic tracking-tighter">#${p.ID_PEDIDO}</span>
                            <h2 class="text-white font-bold uppercase text-[10px] mt-1 opacity-60 italic">${p.CLIENTE}</h2>
                            <p class="text-[8px] text-cyan-500/70 mt-1">⏱️ ${calcularTiempoTranscurrido(p.FECHA)}</p>
                        </div>
                        <p class="text-2xl font-black text-white">${parseFloat(p.TOTAL).toFixed(2)}€</p>
                    </div>

                    <div class="flex gap-2 mb-4">
                        <button onclick="asignarTiempo('${p.ID_PEDIDO}', 15)" class="btn-tiempo t-15 flex-1 py-3 rounded-xl text-[9px] font-black italic border border-green-500/30">15 MIN</button>
                        <button onclick="asignarTiempo('${p.ID_PEDIDO}', 30)" class="btn-tiempo t-30 flex-1 py-3 rounded-xl text-[9px] font-black italic border border-amber-500/30">30 MIN</button>
                        <button onclick="asignarTiempo('${p.ID_PEDIDO}', 45)" class="btn-tiempo t-45 flex-1 py-3 rounded-xl text-[9px] font-black italic border border-red-500/30">45 MIN</button>
                    </div>

                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="aceptarPedido('${p.ID_PEDIDO}')" class="py-4 rounded-2xl text-[9px] font-black uppercase ${aceptados.has(p.ID_PEDIDO) ? 'bg-slate-800 text-slate-600' : 'bg-white text-black ring-4 ring-white/10'} shadow-lg">${aceptados.has(p.ID_PEDIDO) ? 'ACEPTADO' : 'ACEPTAR'}</button>
                        <button onclick="verDetalles('${p.ID_PEDIDO}')" class="bg-slate-800 text-cyan-400 py-4 rounded-2xl text-[9px] font-black uppercase border border-cyan-400/20 shadow-lg">DETALLES</button>
                        <button onclick="confirmarListo('${p.ID_PEDIDO}')" class="bg-cyan-500 text-black py-4 rounded-2xl text-[9px] font-black uppercase shadow-lg shadow-cyan-500/20">LISTO</button>
                    </div>
                </div>`;
            }).join('');
        }

        async function aceptarPedido(id) { 
            aceptados.add(id); 
            document.getElementById('alerta').pause(); 
            render(); 
            await fetch(`${scriptURL}?action=actualizarEstado&idPedido=${id}&nuevoEstado=EN PROCESO`);
            cargar(); 
        }
        
        function verDetalles(id) {
            const p = pedidosActivos.find(x => x.ID_PEDIDO == id) || historialHoy.find(x => x.ID_PEDIDO == id);
            if(!p) return;
            const resNombre = document.getElementById('resNombreDisplay').innerText;
            const layoutTicket = `********************************\n       AGUADULCE EXPRESS\n********************************\n        ${resNombre.toUpperCase()}\n--------------------------------\n        PEDIDO # ${p.ID_PEDIDO}\n--------------------------------\nCLIENTE: ${p.CLIENTE}\nDIR: ${p.DIRECCION}\n--------------------------------\n${p.PEDIDO_DETALLE || ''}\n--------------------------------\nTOTAL: ${parseFloat(p.TOTAL).toFixed(2)} EUR\nPAGO: ${p.PAGO || 'EFECTIVO'}\nFECHA: ${p.FECHA}\n--------------------------------\n   ¡GRACIAS POR SU COMPRA!\n********************************`;
            mostrarModal("VISTA PREVIA TICKET", layoutTicket,
                `<div class="flex flex-col w-full gap-2">
                    <button onclick="ejecutarImpresion('${p.ID_PEDIDO}')" class="w-full bg-cyan-600 py-4 rounded-2xl font-black text-[10px] text-white shadow-xl shadow-cyan-500/20">IMPRIMIR 🖨️</button>
                    <button onclick="cerrarModal()" class="w-full bg-slate-800 py-4 rounded-2xl font-black text-[10px] text-slate-500 uppercase tracking-widest">VOLVER</button>
                </div>`);
        }

        function ejecutarImpresion(id) {
            const p = pedidosActivos.find(x => x.ID_PEDIDO == id) || historialHoy.find(x => x.ID_PEDIDO == id);
            if(!p) return;
            const resNombre = document.getElementById('resNombreDisplay').innerText;
            let t = "";
            t += "AGUADULCE EXPRESS\n";
            t += "********************************\n";
            t += resNombre.toUpperCase() + "\n";
            t += "--------------------------------\n";
            t += "PEDIDO # " + p.ID_PEDIDO + "\n";
            t += "--------------------------------\n";
            t += "CLIENTE: " + p.CLIENTE + "\n";
            t += "DIR: " + p.DIRECCION + "\n";
            t += "--------------------------------\n";
            t += (p.PEDIDO_DETALLE || "").replace(/\|/g, "\n") + "\n";
            t += "--------------------------------\n";
            t += "TOTAL: " + parseFloat(p.TOTAL).toFixed(2) + " EUR\n";
            t += "PAGO: " + (p.PAGO || "EFECTIVO") + "\n";
            t += "FECHA: " + p.FECHA + "\n";
            t += "--------------------------------\n";
            t += "GRACIAS POR SU COMPRA\n\n\n\n";
            const encodedText = encodeURIComponent(t);
            window.location.href = "intent:" + encodedText + "#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;";
        }

        function confirmarListo(id) {
            mostrarModal("¿PEDIDO LISTO?", "Confirma que el pedido está terminado y listo para reparto",
                `<div class="flex w-full gap-3"><button onclick="cerrarModal()" class="w-1/2 bg-slate-800 py-4 rounded-2xl font-black text-xs text-slate-400">NO</button><button onclick="ejecutarListo('${id}')" class="w-1/2 bg-cyan-500 py-4 rounded-2xl font-black text-xs text-black">SÍ</button></div>`);
        }

        async function ejecutarListo(id) { 
            cerrarModal(); 
            await fetch(`${scriptURL}?action=actualizarEstado&idPedido=${id}&nuevoEstado=LISTO`); 
            cargar(); 
        }

        function confirmarToggleTienda() {
            const nuevo = !tiendaAbierta ? "Abierto" : "Cerrado";
            mostrarModal("TIENDA", `¿CAMBIAR A ${nuevo.toUpperCase()}?`,
                `<div class="flex w-full gap-3"><button onclick="cancelarToggle()" class="w-1/2 bg-slate-800 py-4 rounded-2xl font-black text-xs text-slate-400">NO</button><button onclick="ejecutarToggle('${nuevo}')" class="w-1/2 bg-cyan-500 py-4 rounded-2xl font-black text-xs text-black">SÍ</button></div>`);
        }

        function cancelarToggle() { document.getElementById('tiendaToggle').checked = tiendaAbierta; cerrarModal(); }

        async function ejecutarToggle(estado) { 
            cerrarModal(); 
            await fetch(`${scriptURL}?action=toggleTienda&idRest=${MI_ID_REST}&sheet=configuracion&nuevoEstado=${estado}`); 
            setTimeout(cargar, 1000); 
        }

        function preguntarSalir() {
            mostrarModal("CERRAR SESIÓN", "¿Deseas salir del panel?",
                `<div class="flex w-full gap-3"><button onclick="cerrarModal()" class="w-1/2 bg-slate-800 py-4 rounded-2xl font-black text-xs text-slate-400">NO</button><button onclick="ejecutarSalir()" class="w-1/2 bg-red-500 py-4 rounded-2xl font-black text-xs text-white">SÍ</button></div>`);
        }

        function ejecutarSalir() { localStorage.removeItem('AE_REST_ID'); location.reload(); }

        function abrirHistorial() {
            const listaH = document.getElementById('listaHistorial');
            if (historialHoy.length === 0) {
                listaH.innerHTML = '<p class="opacity-20 italic text-xs text-center py-10 uppercase" style="color:white;">Vacío</p>';
            } else {
                listaH.innerHTML = historialHoy.map(p => `
                    <div class="bg-white/5 p-4 rounded-2xl border border-white/5 mb-2 active:scale-95 transition-transform cursor-pointer" onclick="cerrarHistorial(); verDetalles('${p.ID_PEDIDO}')">
                        <div class="flex justify-between font-black text-cyan-400 text-xs">
                            <span>#${p.ID_PEDIDO}</span>
                            <span>${parseFloat(p.TOTAL).toFixed(2)}€</span>
                        </div>
                        <p class="text-[9px] opacity-50 uppercase mt-1 italic" style="color:white;">${p.CLIENTE}</p>
                        <p class="text-[7px] text-cyan-500/50 mt-1 uppercase font-bold tracking-widest">Ver detalle completo</p>
                    </div>
                `).join('');
            }
            document.getElementById('sideHistorial').classList.remove('translate-x-full');
        }

        function cerrarHistorial() { document.getElementById('sideHistorial').classList.add('translate-x-full'); }

        function mostrarModal(titulo, bodyCont, footer) {
            document.getElementById('modalTitle').innerText = titulo;
            document.getElementById('modalBody').innerText = bodyCont;
            document.getElementById('modalFooter').innerHTML = footer;
            document.getElementById('customModal').classList.remove('hidden');
        }

        function cerrarModal() { document.getElementById('customModal').classList.add('hidden'); }

        async function asignarTiempo(idPedido, minutos) {
            const ahora = new Date();
            const horaListo = new Date(ahora.getTime() + minutos * 60000);
            const horaFormateada = horaListo.getHours().toString().padStart(2, '0') + ":" + horaListo.getMinutes().toString().padStart(2, '0');
            try {
                await database.ref('pedidos/' + idPedido).update({
                    tiempoEstimado: minutos,
                    horaSalida: horaFormateada,
                    timestampListo: horaListo.getTime()
                });
                alert(`⏳ Pedido #${idPedido} listo a las ${horaFormateada} (${minutos} min)`);
            } catch (error) { console.error("Error:", error); }
        }
    </script>
</body>
</html>
