<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aguadulce Express v107</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <style>
    :root {
      --cyan: #06b6d4;
      --dark: #020617;
    }

    body {
      margin: 0;
      background: var(--dark);
      color: white;
      font-family: sans-serif;
    }

    .hidden {
      display: none !important;
    }

    #loader {
      position: fixed;
      inset: 0;
      background: #020617;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.1);
      border-top-color: var(--cyan);
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .track-node.active .track-dot {
      background: var(--cyan);
      color: black;
      box-shadow: 0 0 20px var(--cyan);
    }

    .track-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

<div id="loader">
  <div class="spinner"></div>
  <p class="mt-4 text-cyan-400 font-bold">Sincronizando Aguadulce...</p>
</div>

<header class="p-5 border-b border-white/10 flex items-center gap-4">
  <img id="app-logo" class="w-14 h-14 rounded-full border-2 border-cyan-400" />
  <div>
    <h1 class="text-2xl font-black uppercase italic">Aguadulce</h1>
    <p class="text-cyan-400 text-xs uppercase font-black tracking-widest">Express</p>
  </div>
</header>

<main id="app-container" class="p-5"></main>

<div id="cesta-flotante" class="hidden fixed bottom-5 left-4 right-4 bg-cyan-400 text-black rounded-3xl p-5 z-50 font-black">
  <div class="flex justify-between items-center">
    <div>
      <div id="cesta-info">0 productos</div>
      <div id="cesta-total">0.00€</div>
    </div>
    <button onclick="abrirCheckout()" class="bg-black text-white px-5 py-3 rounded-2xl">
      Abrir
    </button>
  </div>
</div>

<div id="panel-checkout" class="hidden fixed inset-0 bg-black z-[5000] overflow-y-auto p-6">
  <div class="flex justify-between items-center mb-8">
    <h2 class="text-2xl font-black uppercase italic">Checkout</h2>
    <button onclick="cerrarCheckout()" class="bg-white/10 px-4 py-2 rounded-xl">Cerrar</button>
  </div>

  <div id="lista-cesta-checkout" class="space-y-3 mb-8"></div>

  <div id="desglose-pago"></div>

  <textarea id="cliente-notas" placeholder="Notas para el repartidor"
    class="w-full mt-5 bg-white/5 border border-white/10 rounded-2xl p-4 text-white"></textarea>

  <select id="metodo-pago" class="w-full mt-5 bg-white/5 border border-white/10 rounded-2xl p-4">
    <option>Efectivo</option>
    <option>Tarjeta</option>
  </select>

  <button id="btn-final"
    onclick="enviarPedidoFinal()"
    class="w-full mt-8 bg-cyan-400 text-black py-5 rounded-3xl font-black uppercase italic">
    Procesar Orden
  </button>
</div>

<div id="modal-exito" class="hidden fixed inset-0 bg-black/90 z-[6000] items-center justify-center p-5">
  <div id="card-seguimiento" class="bg-[#020617] border border-cyan-400/30 p-8 rounded-[2rem] w-full max-w-sm"></div>
</div>

<audio id="audio-llegada" preload="auto">
  <source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" type="audio/ogg">
</audio>

<script>

// =====================================================
// FIREBASE
// =====================================================

const firebaseConfig = {
  apiKey: "AIzaSyCJcLQ0ikUwZSV7L_8mLLax8B5qnhP0Roc",
  authDomain: "aguadulce-notificaciones.firebaseapp.com",
  databaseURL: "https://aguadulce-notificaciones-default-rtdb.firebaseio.com/",
  projectId: "aguadulce-notificaciones",
  storageBucket: "aguadulce-notificaciones.firebasestorage.app",
  messagingSenderId: "940283725281",
  appId: "1:940283725281:web:3b388d2e7f362a99d2bea0"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();

// =====================================================
// VARIABLES GLOBALES
// =====================================================

const scriptURL = 'https://script.google.com/macros/s/AKfycbzYFDShcrP7I4FKhiH3q5UcEInpSKJstrumJ9ddI4Tj9S31ZUgwiuie81fGFmCJ6ob2/exec';

let db = {
  restaurantes: [],
  menu: [],
  anuncios: []
};

let cesta = [];

let rActivo = {
  id: null,
  nombre: '',
  foto: ''
};

let pedidoListener = null;
let intervaloAlarma = null;

// =====================================================
// INIT
// =====================================================

async function init() {

  try {

    const res = await fetch(scriptURL);
    const data = await res.json();

    db.restaurantes = data.RESTAURANTES || [];
    db.menu = data.MENU_GENERAL || [];

    if (data.CONFIG && data.CONFIG[0]) {
      document.getElementById('app-logo').src = data.CONFIG[0].LOGO_URL;
    }

    restaurarCesta();

    renderHome();

    escucharPedidoActivo();

    document.getElementById('loader').style.display = 'none';

  } catch (e) {

    console.error(e);

    Swal.fire({
      title: 'Error',
      text: 'No se pudo conectar con el servidor.',
      icon: 'error',
      background: '#020617',
      color: '#fff'
    });
  }
}

// =====================================================
// HOME
// =====================================================

function renderHome() {

  const app = document.getElementById('app-container');

  let html = '<h2 class="text-sm uppercase font-black text-cyan-400 mb-6">Restaurantes</h2>';

  db.restaurantes.forEach(r => {

    const cerrado = String(r.ESTADO || '').toLowerCase() === 'cerrado';

    html += `
      <div onclick="abrirTienda('${r.NOMBRE_RESTAURANTE}','${r.ID_RESTAURANTE}','${r.FOTO}','${r.ESTADO}')"
        class="relative h-[180px] rounded-[2rem] overflow-hidden mb-5 border border-white/10 ${cerrado ? 'opacity-40 pointer-events-none' : ''}">

        <img src="${r.FOTO}" class="absolute inset-0 w-full h-full object-cover">

        <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent"></div>

        <div class="absolute bottom-6 left-6">
          <h3 class="text-2xl font-black uppercase italic">${r.NOMBRE_RESTAURANTE}</h3>
        </div>

        <div class="absolute top-5 right-5 bg-black/70 px-4 py-2 rounded-xl text-xs font-black uppercase ${cerrado ? 'text-red-500' : 'text-cyan-400'}">
          ${cerrado ? 'Cerrado' : 'Abierto'}
        </div>
      </div>
    `;
  });

  app.innerHTML = html;
}

// =====================================================
// MENU
// =====================================================

function abrirTienda(nombre,id,foto,estado) {

  if (String(estado).toLowerCase() === 'cerrado') {

    Swal.fire({
      title: 'Restaurante cerrado',
      icon: 'warning',
      background: '#020617',
      color: '#fff'
    });

    return;
  }

  if (cesta.length > 0 && rActivo.id && rActivo.id !== id) {

    Swal.fire({
      title: 'Pedido en curso',
      text: 'Tu cesta pertenece a otro restaurante.',
      icon: 'warning',
      background: '#020617',
      color: '#fff'
    });

    return;
  }

  rActivo.id = id;
  rActivo.nombre = nombre;
  rActivo.foto = foto;

  verMenu();
}

function verMenu() {

  const platos = db.menu.filter(p => String(p.ID_RESTAURANTE) === String(rActivo.id));

  let html = `
    <div class="flex items-center gap-4 mb-8">
      <button onclick="renderHome()" class="bg-white/10 px-4 py-2 rounded-xl">←</button>
      <h2 class="text-xl font-black uppercase italic">${rActivo.nombre}</h2>
    </div>
  `;

  platos.forEach(p => {

    html += `
      <div onclick='anadirSimple(${JSON.stringify(p)})'
        class="bg-white/5 border border-white/10 rounded-[2rem] p-4 flex items-center gap-4 mb-4 active:scale-95">

        <img src="${p.FOTO_PLATO}" class="w-20 h-20 rounded-2xl object-cover">

        <div class="flex-1">
          <h3 class="font-black uppercase">${p.PLATO}</h3>
          <p class="text-cyan-400 font-bold">${parseFloat(p.PRECIO).toFixed(2)}€</p>
        </div>

      </div>
    `;
  });

  document.getElementById('app-container').innerHTML = html;
}

// =====================================================
// CESTA
// =====================================================

function anadirSimple(p) {

  cesta.push({
    nombre: p.PLATO,
    total: parseFloat(p.PRECIO)
  });

  guardarCesta();
  actualizarCestaBar();

  Swal.fire({
    title: 'Añadido',
    text: p.PLATO,
    icon: 'success',
    timer: 1000,
    showConfirmButton: false,
    background: '#020617',
    color: '#fff'
  });
}

function actualizarCestaBar() {

  const barra = document.getElementById('cesta-flotante');

  if (cesta.length <= 0) {
    barra.classList.add('hidden');
    return;
  }

  barra.classList.remove('hidden');

  const total = cesta.reduce((a,b) => a + b.total, 0);

  document.getElementById('cesta-info').innerText = `${cesta.length} productos`;
  document.getElementById('cesta-total').innerText = `${total.toFixed(2)}€ total`;
}

function guardarCesta() {

  localStorage.setItem('ae_cesta_temporal', JSON.stringify(cesta));
  localStorage.setItem('ae_restaurante_temporal', JSON.stringify(rActivo));
}

function restaurarCesta() {

  const c = localStorage.getItem('ae_cesta_temporal');
  const r = localStorage.getItem('ae_restaurante_temporal');

  if (c) cesta = JSON.parse(c);
  if (r) rActivo = JSON.parse(r);

  actualizarCestaBar();
}

// =====================================================
// CHECKOUT
// =====================================================

function abrirCheckout() {

  const panel = document.getElementById('panel-checkout');

  panel.classList.remove('hidden');

  const lista = document.getElementById('lista-cesta-checkout');

  lista.innerHTML = '';

  cesta.forEach(i => {

    lista.innerHTML += `
      <div class="bg-white/5 border border-white/10 p-4 rounded-2xl flex justify-between">
        <span>${i.nombre}</span>
        <span>${i.total.toFixed(2)}€</span>
      </div>
    `;
  });

  const subtotal = cesta.reduce((a,b) => a + b.total, 0);
  const envio = 2.50;
  const gestion = 0.99;
  const total = subtotal + envio + gestion;

  document.getElementById('desglose-pago').innerHTML = `
    <div class="bg-white/5 border border-white/10 rounded-3xl p-5 space-y-3">
      <div class="flex justify-between">
        <span>Subtotal</span>
        <span>${subtotal.toFixed(2)}€</span>
      </div>

      <div class="flex justify-between">
        <span>Envío</span>
        <span>${envio.toFixed(2)}€</span>
      </div>

      <div class="flex justify-between">
        <span>Gestión</span>
        <span>${gestion.toFixed(2)}€</span>
      </div>

      <div class="border-t border-white/10 pt-3 flex justify-between text-cyan-400 font-black text-xl">
        <span>Total</span>
        <span>${total.toFixed(2)}€</span>
      </div>
    </div>
  `;

  document.getElementById('btn-final').innerText = `Procesar Orden (${total.toFixed(2)}€)`;
}

function cerrarCheckout() {

  document.getElementById('panel-checkout').classList.add('hidden');
}

// =====================================================
// ENVIAR PEDIDO
// =====================================================

async function enviarPedidoFinal() {

  if (cesta.length <= 0) return;

  const btn = document.getElementById('btn-final');

  btn.disabled = true;
  btn.innerText = 'Enviando...';

  try {

    const total = cesta.reduce((a,b) => a + b.total, 0) + 2.50 + 0.99;

    const pid = 'AE-' + Math.floor(1000 + Math.random() * 9000);

    await database.ref('pedidos/' + pid).set({
      id: pid,
      estado: 'recibido',
      total: total.toFixed(2),
      items: cesta,
      timestamp: Date.now()
    });

    localStorage.setItem('ae_pedido_id', pid);

    cesta = [];

    localStorage.removeItem('ae_cesta_temporal');

    actualizarCestaBar();

    cerrarCheckout();

    renderSeguimiento();

  } catch(e) {

    console.error(e);

    Swal.fire({
      title: 'Error',
      text: 'No se pudo enviar el pedido.',
      icon: 'error',
      background: '#020617',
      color: '#fff'
    });

  } finally {

    btn.disabled = false;
    btn.innerText = 'Procesar Orden';
  }
}

// =====================================================
// SEGUIMIENTO
// =====================================================

function renderSeguimiento() {

  const pid = localStorage.getItem('ae_pedido_id');

  if (!pid) return;

  const modal = document.getElementById('modal-exito');
  const card = document.getElementById('card-seguimiento');

  modal.classList.remove('hidden');
  modal.style.display = 'flex';

  card.innerHTML = `
    <div class="text-center">

      <div class="w-20 h-20 rounded-full bg-cyan-400 flex items-center justify-center mx-auto text-black text-3xl mb-6">
        ✔
      </div>

      <h2 class="text-2xl font-black uppercase italic mb-2">Pedido recibido</h2>

      <p class="text-white/50 text-xs uppercase mb-8">Ref ${pid}</p>

      <div class="bg-white/5 border border-white/10 rounded-3xl p-5 mb-8">
        <div id="timer-label" class="text-cyan-400 text-xs font-black uppercase mb-2">
          Estado
        </div>

        <div id="countdown-display" class="font-black uppercase">
          Sincronizando...
        </div>
      </div>

      <div class="flex justify-between mb-10">

        <div class="track-node" id="node-recibido">
          <div class="track-dot">✔</div>
          <div class="text-[10px] mt-2 uppercase font-black">Recibido</div>
        </div>

        <div class="track-node" id="node-cocina">
          <div class="track-dot">🍳</div>
          <div class="text-[10px] mt-2 uppercase font-black">Cocina</div>
        </div>

        <div class="track-node" id="node-camino">
          <div class="track-dot">🛵</div>
          <div class="text-[10px] mt-2 uppercase font-black">Camino</div>
        </div>

      </div>

      <button onclick="cerrarSeguimiento()"
        class="w-full bg-white/10 py-4 rounded-2xl uppercase font-black">
        Cerrar
      </button>

    </div>
  `;

  escucharPedidoActivo();
}

function escucharPedidoActivo() {

  const pid = localStorage.getItem('ae_pedido_id');

  if (!pid) return;

  if (pedidoListener) {
    pedidoListener.off();
  }

  pedidoListener = database.ref('pedidos/' + pid);

  pedidoListener.on('value', snap => {

    const data = snap.val();

    if (!data) {
      limpiarPedidoCompleto();
      return;
    }

    const estado = String(data.estado || '').toLowerCase();

    actualizarLucesBarra(estado);

    if (estado.includes('llego')) {
      reproducirAlarmaLlegada();
    } else {
      detenerAlarmaLlegada();
    }

    if (
      estado === 'entregado' ||
      estado === 'finalizado' ||
      estado === 'completado'
    ) {

      Swal.fire({
        title: 'Pedido entregado',
        icon: 'success',
        background: '#020617',
        color: '#fff'
      }).then(() => {

        limpiarPedidoCompleto();
        renderHome();
      });
    }
  });
}

function actualizarLucesBarra(est) {

  document.querySelectorAll('.track-node').forEach(n => {
    n.classList.remove('active');
  });

  const recibido = document.getElementById('node-recibido');
  const cocina = document.getElementById('node-cocina');
  const camino = document.getElementById('node-camino');

  if (recibido) recibido.classList.add('active');

  const display = document.getElementById('countdown-display');

  if (est.includes('recibido')) {
    display.innerText = 'Orden confirmada';
  }

  if (est.includes('cocina')) {

    cocina.classList.add('active');

    display.innerText = 'Preparando pedido';
  }

  if (est.includes('camino')) {

    cocina.classList.add('active');
    camino.classList.add('active');

    display.innerText = 'Repartidor en camino';
  }

  if (est.includes('llego')) {

    cocina.classList.add('active');
    camino.classList.add('active');

    display.innerText = 'Tu pedido ha llegado';
  }
}

function limpiarPedidoCompleto() {

  if (pedidoListener) {
    pedidoListener.off();
    pedidoListener = null;
  }

  detenerAlarmaLlegada();

  localStorage.removeItem('ae_pedido_id');

  const modal = document.getElementById('modal-exito');

  modal.classList.add('hidden');
  modal.style.display = 'none';
}

function cerrarSeguimiento() {

  document.getElementById('modal-exito').style.display = 'none';
}

// =====================================================
// ALARMA
// =====================================================

function reproducirAlarmaLlegada() {

  if (intervaloAlarma) return;

  const audio = document.getElementById('audio-llegada');

  audio.play().catch(() => {});

  intervaloAlarma = setInterval(() => {
    audio.play().catch(() => {});
  }, 60000);
}

function detenerAlarmaLlegada() {

  if (!intervaloAlarma) return;

  clearInterval(intervaloAlarma);
  intervaloAlarma = null;
}

// =====================================================
// ARRANQUE
// =====================================================

init();

</script>
</body>
</html>
