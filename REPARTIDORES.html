<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reparto Express - Aguadulce</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* ESTILOS PROPIOS - SIN TAILWIND */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #020617;
            color: white;
            min-height: 100vh;
        }
        
        /* HEADER */
        .header {
            padding: 24px;
            background: linear-gradient(to bottom, rgba(6,182,212,0.1), transparent);
        }
        
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .btn-salir {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-salir:active {
            background: rgba(239,68,68,0.2);
            border-color: #ef4444;
            transform: scale(0.95);
        }
        
        .repartidor-info {
            text-align: left;
        }
        
        .repartidor-nombre {
            font-size: 20px;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
        }
        
        .repartidor-id {
            font-size: 10px;
            color: #06b6d4;
            font-weight: 900;
        }
        
        .billetera {
            text-align: right;
        }
        
        .billetera-label {
            font-size: 8px;
            font-weight: 900;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
        }
        
        .billetera-monto {
            font-size: 20px;
            font-weight: 900;
            color: white;
        }
        
        /* STATUS BAR */
        .status-bar {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .estado-disponible {
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
        }
        
        .disponible {
            color: #4ade80;
        }
        
        .offline {
            color: #ef4444;
        }
        
        .contador-pedidos {
            font-size: 10px;
            font-weight: 900;
            background: #06b6d4;
            color: black;
            padding: 4px 12px;
            border-radius: 999px;
        }
        
        /* MAIN */
        .main {
            padding: 24px;
            padding-bottom: 80px;
        }
        
        /* CARDS DE PEDIDOS */
        .card-pedido {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 32px;
            padding: 20px;
            margin-bottom: 16px;
            transition: all 0.2s;
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .estado-badge {
            background: #06b6d4;
            color: black;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
        }
        
        .estado-badge.listo {
            background: #22c55e;
            animation: pulse 1s infinite;
        }
        
        .estado-badge.cancelado {
            background: #ef4444;
        }
        
        @keyframes pulse {
            0% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0.7; transform: scale(1); }
        }
        
        .ref-pedido {
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            font-weight: 900;
        }
        
        .direccion {
            font-size: 18px;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            margin-bottom: 16px;
            word-break: break-word;
        }
        
        /* DATOS DEL CLIENTE - NUEVO BLOQUE MEJORADO */
        .cliente-completo {
            background: #0f172a;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(6,182,212,0.3);
        }
        
        .cliente-nombre {
            font-size: 14px;
            font-weight: 900;
            color: #06b6d4;
            margin-bottom: 8px;
        }
        
        .cliente-telefono {
            font-size: 16px;
            font-weight: 900;
            color: white;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .btn-llamar, .btn-whatsapp-cliente {
            background: #22c55e;
            color: black;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        
        .btn-whatsapp-cliente {
            background: #25D366;
        }
        
        /* TIEMPO DE COCINA - MÁS GRANDE Y VISIBLE */
        .tiempo-cocina {
            background: rgba(6,182,212,0.15);
            border: 2px solid rgba(6,182,212,0.5);
            border-radius: 20px;
            padding: 14px 20px;
            font-size: 18px;
            font-weight: 900;
            color: #06b6d4;
            display: block;
            margin-bottom: 16px;
            text-align: center;
            letter-spacing: 1px;
        }
        
        .tiempo-listo {
            background: rgba(34,197,94,0.2);
            border-color: #22c55e;
            color: #22c55e;
            font-size: 20px;
        }
        
        .tiempo-alerta {
            animation: pulse 1s infinite;
        }
        
        /* TIMER DE ESPERA (5 MINUTOS) - VISIBLE */
        .timer-espera {
            background: #eab308;
            color: black;
            padding: 14px;
            border-radius: 20px;
            margin: 12px 0;
            text-align: center;
            font-weight: 900;
            font-size: 16px;
            border: 2px solid #fbbf24;
        }
        
        /* BOTONES DE MAPA Y WHATSAPP */
        .botones-accion {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .btn-mapa, .btn-whatsapp {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .btn-mapa:active, .btn-whatsapp:active {
            transform: scale(0.95);
        }
        
        .icono {
            font-size: 18px;
            display: block;
            margin-bottom: 4px;
        }
        
        .btn-mapa-texto {
            font-size: 8px;
            font-weight: 900;
            text-transform: uppercase;
            color: #06b6d4;
        }
        
        .btn-whatsapp-texto {
            font-size: 8px;
            font-weight: 900;
            text-transform: uppercase;
            color: #22c55e;
        }
        
        /* BOTONES DE ESTADO */
        .botones-estado {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .btn-principal {
            width: 100%;
            background: white;
            color: black;
            padding: 18px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 12px;
            text-transform: uppercase;
            text-align: center;
            border: none;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .btn-principal:active {
            transform: scale(0.97);
        }
        
        .btn-principal.yellow {
            background: #eab308;
            color: black;
        }
        
        .btn-principal.green {
            background: #22c55e;
            color: white;
        }
        
        .btn-principal.blue {
            background: #06b6d4;
            color: black;
        }
        
        .btn-principal.red {
            background: #ef4444;
            color: white;
        }
        
        .total {
            font-size: 20px;
            font-weight: 900;
            color: #06b6d4;
        }
        
        /* SIN PEDIDOS */
        .sin-pedidos {
            text-align: center;
            padding: 80px 0;
            opacity: 0.3;
            font-weight: 900;
            font-style: italic;
            font-size: 12px;
        }
        
        /* LOADER */
        .loader {
            position: fixed;
            inset: 0;
            background: #020617;
            z-index: 5000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(6,182,212,0.1);
            border-top-color: #06b6d4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* TOAST NOTIFICATIONS */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #06b6d4;
            color: black;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 900;
            font-size: 14px;
            z-index: 6000;
            animation: fadeOut 2.5s ease forwards;
            box-shadow: 0 0 20px rgba(6,182,212,0.5);
            text-align: center;
            max-width: 90%;
        }
        
        .toast.success {
            background: #22c55e;
        }
        
        .toast.warning {
            background: #eab308;
        }
        
        @keyframes fadeOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); visibility: hidden; }
        }
        
        .hidden {
            display: none;
        }
        
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .text-center {
            text-align: center;
        }
        
        .mt-2 {
            margin-top: 8px;
        }
        
        .mb-2 {
            margin-bottom: 8px;
        }
        
        .gap-2 {
            gap: 8px;
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>

    <div id="loader" class="loader">
        <div class="spinner mb-4"></div>
        <p style="color:#06b6d4; font-size:10px; font-weight:900;">Iniciando Terminal de Reparto...</p>
    </div>

    <audio id="audio-notificacion" preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
    </audio>

    <div id="appContent">
        <div class="header">
            <div class="header-top">
                <button onclick="cerrarSesion()" class="btn-salir">
                    <span style="font-size:18px;">🚪</span>
                </button>
                <div class="repartidor-info">
                    <div id="nombre-repartidor" class="repartidor-nombre">REPARTIDOR</div>
                    <div id="codigo-ui" class="repartidor-id">Cargando código...</div>
                </div>
                <div class="billetera">
                    <div class="billetera-label">Billetera Hoy</div>
                    <div id="saldo-billetera" class="billetera-monto">0.00€</div>
                </div>
            </div>

            <div class="status-bar">
                <span class="estado-disponible">Estado: <span id="txt-estado" class="disponible">Disponible</span></span>
                <div class="flex-between" style="gap: 8px;">
                    <div id="indicador-pedidos" class="contador-pedidos">0/2 ACTIVOS</div>
                </div>
            </div>
        </div>

        <main class="main" id="lista-pedidos"></main>
    </div>

    <script>
        // ============================================
        // CONFIGURACIÓN
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyCJcLQ0ikUwZSV7L_8mLLax8B5qnhP0Roc",
            authDomain: "aguadulce-notificaciones.firebaseapp.com",
            databaseURL: "https://aguadulce-notificaciones-default-rtdb.firebaseio.com",
            projectId: "aguadulce-notificaciones",
            storageBucket: "aguadulce-notificaciones.firebasestorage.app",
            messagingSenderId: "940283725281",
            appId: "1:940283725281:web:3b388d2e7f362a99d2bea0"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzYFDShcrP7I4FKhiH3q5UcEInpSKJstrumJ9ddI4Tj9S31ZUgwiuie81fGFmCJ6ob2/exec';
        
        let miCodigo = localStorage.getItem('ae_cod_reparto');
        let pedidosActivos = [];
        let audioNotificacion = null;
        let listenerRef = null;
        let temporizadoresActivos = {};

        // ============================================
        // INICIALIZACIÓN
        // ============================================
        async function initReparto() {
            if(!miCodigo) {
                let inputCodigo = prompt("Introduce tu código de repartidor (ej: REPA10):");
                if(!inputCodigo) return location.reload();
                miCodigo = inputCodigo.trim().toUpperCase();
                localStorage.setItem('ae_cod_reparto', miCodigo);
            }
            
            document.getElementById('codigo-ui').innerText = `ID: ${miCodigo}`;
            audioNotificacion = document.getElementById('audio-notificacion');
            
            if(listenerRef) listenerRef.off();
            listenerRef = database.ref('pedidosActivos');
            listenerRef.on('value', () => refrescarDatos());
            
            await refrescarDatos();
            document.getElementById('loader').style.display = 'none';
            setInterval(refrescarDatos, 15000);
        }

        // ============================================
        // REFRESCAR DATOS
        // ============================================
        async function refrescarDatos() {
            try {
                const res = await fetch(`${scriptURL}?action=getPedidosReparto&idRepartidor=${miCodigo}&t=${Date.now()}`);
                const data = await res.json();
                
                if(data.error) {
                    mostrarToast(data.error, "warning");
                    cerrarSesion();
                    return;
                }
                
                const idsAnteriores = pedidosActivos.map(p => p.ID_PEDIDO);
                pedidosActivos = data.pedidos || [];
                const saldo = parseFloat(data.saldo) || 0;
                
                document.getElementById('saldo-billetera').innerText = saldo.toFixed(2) + "€";
                document.getElementById('indicador-pedidos').innerText = `${pedidosActivos.length}/2 ACTIVOS`;
                document.getElementById('nombre-repartidor').innerText = data.nombre || "REPARTIDOR";
                document.getElementById('txt-estado').innerText = "Disponible";
                document.getElementById('txt-estado').className = "disponible";
                
                const idsNuevos = pedidosActivos.map(p => p.ID_PEDIDO).filter(id => !idsAnteriores.includes(id));
                if(idsNuevos.length > 0) {
                    if(audioNotificacion) {
                        audioNotificacion.currentTime = 0;
                        audioNotificacion.play().catch(() => {});
                    }
                    if(navigator.vibrate) navigator.vibrate([500, 200, 500]);
                    mostrarToast(`📦 Nuevo pedido asignado`, "success");
                }
                
                const snapshot = await database.ref('pedidos').once('value');
                const fbData = snapshot.val() || {};
                
                pedidosActivos = pedidosActivos.map(p => {
                    const fbPedido = fbData[p.ID_PEDIDO];
                    return {
                        ...p,
                        timestampListo: fbPedido ? fbPedido.timestampListo : null,
                        tiempoEstimado: fbPedido ? fbPedido.tiempoEstimado : null,
                        horaSalida: fbPedido ? fbPedido.horaSalida : null,
                        estadoFirebase: fbPedido ? fbPedido.estado : p.ESTADO,
                        telefono: p.telf || p.WHATSAPP || "",
                        cliente: p.CLIENTE || p.cliente
                    };
                });
                
                renderPedidos();
            } catch (e) {
                console.error("Error:", e);
                document.getElementById('txt-estado').innerText = "Offline";
                document.getElementById('txt-estado').className = "offline";
            }
        }

        // ============================================
        // RENDER PEDIDOS
        // ============================================
        function calcularTiempoRestante(timestamp) {
            if(!timestamp || timestamp === 0) return { min: 0, seg: 0, listo: false };
            const ahora = Date.now();
            const diff = timestamp - ahora;
            if(diff <= 0) return { min: 0, seg: 0, listo: true };
            return {
                min: Math.floor(diff / 60000),
                seg: Math.floor((diff % 60000) / 1000),
                listo: false
            };
        }
        
        function renderPedidos() {
            const contenedor = document.getElementById('lista-pedidos');
            if(pedidosActivos.length === 0) {
                contenedor.innerHTML = `<div class="sin-pedidos">Sin pedidos asignados...</div>`;
                return;
            }
            
            contenedor.innerHTML = pedidosActivos.map(p => {
                const estadoActual = (p.ESTADO || "").toUpperCase();
                const tieneTiempo = p.timestampListo && p.timestampListo > 0;
                const tiempoRestante = tieneTiempo ? calcularTiempoRestante(p.timestampListo) : null;
                const esListo = tiempoRestante && tiempoRestante.listo;
                const total = parseFloat(p.TOTAL) || 0;
                const telefonoLimpio = String(p.telefono || p.telf || p.WHATSAPP || '').replace(/\D/g, '');
                
                let botonesHTML = '';
                
                if (estadoActual === 'LISTO' || esListo) {
                    botonesHTML = `
                        <div class="botones-estado">
                            <button onclick="recogerPedido('${p.ID_PEDIDO}')" class="btn-principal blue">
                                🛵 RECOGER PEDIDO
                            </button>
                        </div>
                    `;
                } else if (estadoActual === 'EN CAMINO') {
                    botonesHTML = `
                        <div class="botones-estado">
                            <button onclick="marcarLlegada('${p.ID_PEDIDO}')" class="btn-principal yellow">
                                📍 HE LLEGADO AL CLIENTE
                            </button>
                        </div>
                    `;
                } else if (estadoActual === 'LLEGÓ' || estadoActual === 'LLEGO') {
                    // Verificar si hay temporizador activo para este pedido
                    const hayTimer = temporizadoresActivos[p.ID_PEDIDO];
                    botonesHTML = `
                        ${hayTimer ? `<div id="timer-${p.ID_PEDIDO}" class="timer-espera">⏰ Esperando al cliente...</div>` : ''}
                        <div class="botones-estado">
                            <button onclick="confirmarEntrega('${p.ID_PEDIDO}', ${total})" class="btn-principal green">
                                💰 COBRAR Y ENTREGAR (${total.toFixed(2)}€)
                            </button>
                            ${!hayTimer ? `<button onclick="iniciarTemporizadorCancelacion('${p.ID_PEDIDO}', ${total})" class="btn-principal red" style="background:#ef4444;">
                                ⏰ CLIENTE NO RESPONDE - ESPERAR 5 MIN
                            </button>` : ''}
                        </div>
                    `;
                } else {
                    const tiempoMostrar = tieneTiempo ? `${tiempoRestante.min}m ${tiempoRestante.seg}s` : 'Calculando...';
                    botonesHTML = `
                        <div class="tiempo-cocina ${esListo ? 'tiempo-listo tiempo-alerta' : ''}">
                            ${esListo ? '🔔 ¡PEDIDO LISTO PARA RECOGER!' : `⏳ TIEMPO DE COCINA: ${tiempoMostrar}`}
                        </div>
                    `;
                }
                
                return `
                    <div class="card-pedido" data-id="${p.ID_PEDIDO}">
                        <div class="card-header">
                            <span class="estado-badge ${esListo || estadoActual === 'LISTO' ? 'listo' : ''}">
                                ${esListo || estadoActual === 'LISTO' ? '📦 LISTO' : (estadoActual || 'PREPARANDO')}
                            </span>
                            <span class="ref-pedido">Ref: ${p.ID_PEDIDO}</span>
                        </div>
                        
                        <div class="direccion">${p.DIRECCION || p.direccion}</div>
                        
                        <!-- DATOS COMPLETOS DEL CLIENTE -->
                        <div class="cliente-completo">
                            <div class="cliente-nombre">👤 ${p.CLIENTE || p.cliente}</div>
                            <div class="cliente-telefono">
                                📞 ${p.telefono || p.telf || 'No disponible'}
                                <div style="display: flex; gap: 8px;">
                                    <a href="tel:${telefonoLimpio}" class="btn-llamar">📞 Llamar</a>
                                    <a href="https://wa.me/${telefonoLimpio}" target="_blank" class="btn-whatsapp-cliente">💬 WhatsApp</a>
                                </div>
                            </div>
                            <div style="font-size: 11px; color: #94a3b8; margin-top: 8px;">
                                💳 Pago: ${p.PAGO || p.pago}
                            </div>
                        </div>
                        
                        <div class="botones-accion">
                            <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.DIRECCION || p.direccion)}" target="_blank" class="btn-mapa">
                                <span class="icono">📍</span>
                                <span class="btn-mapa-texto">Ver Mapa</span>
                            </a>
                            <a href="https://wa.me/${telefonoLimpio}" target="_blank" class="btn-whatsapp">
                                <span class="icono">💬</span>
                                <span class="btn-whatsapp-texto">WhatsApp</span>
                            </a>
                        </div>
                        
                        <div class="flex-between" style="margin-bottom: 16px;">
                            <span class="total">💰 Total: ${total.toFixed(2)}€</span>
                        </div>
                        
                        ${botonesHTML}
                    </div>
                `;
            }).join('');
        }

        // ============================================
        // ACCIONES DEL REPARTIDOR
        // ============================================
        
        async function recogerPedido(id) {
            mostrarLoader(true);
            try {
                await fetch(`${scriptURL}?action=actualizarEstado&idPedido=${id}&nuevoEstado=EN CAMINO`);
                await database.ref('pedidos/' + id).update({ 
                    estado: 'en_camino',
                    repartidor_recogio: new Date().toISOString()
                });
                mostrarToast("🛵 Pedido recogido. ¡Buen viaje!", "success");
                if(navigator.vibrate) navigator.vibrate(200);
                await refrescarDatos();
            } catch (e) {
                mostrarToast("Error al actualizar el estado", "warning");
            } finally {
                mostrarLoader(false);
            }
        }
        
        async function marcarLlegada(id) {
            mostrarLoader(true);
            try {
                await fetch(`${scriptURL}?action=actualizarEstado&idPedido=${id}&nuevoEstado=LLEGÓ`);
                await database.ref('pedidos/' + id).update({ 
                    estado: 'llegando',
                    timestamp_llegada: Date.now()
                });
                
                mostrarToast("📍 Has llegado al cliente. Esperando...", "success");
                if(navigator.vibrate) navigator.vibrate([300, 100, 300]);
                await refrescarDatos();
            } catch (e) {
                mostrarToast("Error al marcar llegada", "warning");
            } finally {
                mostrarLoader(false);
            }
        }
        
        function iniciarTemporizadorCancelacion(idPedido, total) {
            if (temporizadoresActivos[idPedido]) {
                mostrarToast("Ya hay un temporizador activo para este pedido", "warning");
                return;
            }
            
            mostrarToast("⏰ Iniciando temporizador de 5 minutos. Espera al cliente...", "warning");
            
            let tiempoRestante = 300; // 5 minutos
            let timerDiv = document.getElementById(`timer-${idPedido}`);
            if (!timerDiv) {
                const card = document.querySelector(`.card-pedido[data-id="${idPedido}"]`);
                if (card) {
                    const botonesDiv = card.querySelector('.botones-estado');
                    if (botonesDiv) {
                        timerDiv = document.createElement('div');
                        timerDiv.id = `timer-${idPedido}`;
                        timerDiv.className = 'timer-espera';
                        timerDiv.style.background = '#eab308';
                        timerDiv.style.color = 'black';
                        timerDiv.style.padding = '14px';
                        timerDiv.style.borderRadius = '20px';
                        timerDiv.style.margin = '12px 0';
                        timerDiv.style.textAlign = 'center';
                        timerDiv.style.fontWeight = '900';
                        timerDiv.style.fontSize = '16px';
                        botonesDiv.insertAdjacentElement('beforebegin', timerDiv);
                    }
                }
            }
            
            temporizadoresActivos[idPedido] = setInterval(() => {
                tiempoRestante--;
                const minutos = Math.floor(tiempoRestante / 60);
                const segundos = tiempoRestante % 60;
                
                if (timerDiv) {
                    timerDiv.innerHTML = `⏰ ESPERANDO AL CLIENTE: ${minutos}:${segundos.toString().padStart(2, '0')} - Intenta contactarlo 📞`;
                }
                
                if (tiempoRestante <= 0) {
                    clearInterval(temporizadoresActivos[idPedido]);
                    delete temporizadoresActivos[idPedido];
                    if (timerDiv) timerDiv.remove();
                    
                    // Mostrar botón de cancelar
                    const card = document.querySelector(`.card-pedido[data-id="${idPedido}"]`);
                    if (card) {
                        const btnEntregar = card.querySelector('.btn-principal.green');
                        if (btnEntregar) btnEntregar.style.display = 'none';
                        
                        const btnCancelar = document.createElement('button');
                        btnCancelar.className = 'btn-principal red';
                        btnCancelar.style.background = '#ef4444';
                        btnCancelar.style.color = 'white';
                        btnCancelar.innerHTML = `❌ CANCELAR PEDIDO (Cliente no recogió - Deuda ${total.toFixed(2)}€)`;
                        btnCancelar.onclick = () => cancelarPorCliente(idPedido, total);
                        
                        const botonesDiv = card.querySelector('.botones-estado');
                        if (botonesDiv) {
                            botonesDiv.appendChild(btnCancelar);
                        }
                    }
                }
            }, 1000);
        }
        
        async function cancelarPorCliente(idPedido, total) {
            const confirmacion = confirm(`⚠️ CANCELAR PEDIDO ⚠️\n\nEsta acción:\n• Acumulará deuda de ${total.toFixed(2)}€ al cliente\n• El pedido se marcará como CANCELADO\n• El cliente será notificado\n\n¿Estás seguro?`);
            
            if (!confirmacion) return;
            
            mostrarLoader(true);
            try {
                const pedido = pedidosActivos.find(p => p.ID_PEDIDO === idPedido);
                
                await fetch(`${scriptURL}?action=actualizarEstado&idPedido=${idPedido}&nuevoEstado=CANCELADO&tiempo=cliente_no_recogio_${Date.now()}`);
                
                await database.ref('pedidos/' + idPedido).update({
                    estado: 'cancelado',
                    cancelado_por: 'cliente_no_recogio',
                    deuda_acumulada: total,
                    monto_deuda: total,
                    timestamp_cancelacion: Date.now(),
                    repartidor_que_cancelo: miCodigo
                });
                
                mostrarToast(`❌ Pedido #${idPedido} cancelado. Deuda de ${total.toFixed(2)}€ acumulada al cliente.`, "warning");
                if(navigator.vibrate) navigator.vibrate([500, 300, 500]);
                
                await refrescarDatos();
            } catch(e) {
                console.error("Error:", e);
                mostrarToast("Error al cancelar el pedido", "error");
            } finally {
                mostrarLoader(false);
            }
        }
        
        function confirmarEntrega(id, total) {
            mostrarToast(`💵 Prepara el cobro de ${total.toFixed(2)}€ al cliente`, "warning");
            
            const confirmado = confirm(`=========================================\n
🛵 AGUADULCE EXPRESS - REPARTO\n=========================================\n
📋 Pedido: ${id}\n💰 Monto a cobrar: ${total.toFixed(2)}€\n
⚠️ Verifica que el cliente haya pagado:\n   • Efectivo\n   • Tarjeta (datáfono)\n
=========================================\n✅ ¿Confirmas el cobro y la entrega?`);
            
            if(confirmado) {
                finalizarEntrega(id, total);
            } else {
                mostrarToast("Entrega cancelada. Verifica el pago.", "warning");
            }
        }
        
        async function finalizarEntrega(id, total) {
            mostrarLoader(true);
            try {
                await fetch(`${scriptURL}?action=finalizarEntrega&idPedido=${id}&total=${total}&idRepartidor=${miCodigo}`);
                await database.ref('pedidos/' + id).update({ 
                    estado: 'entregado',
                    finalizado: true,
                    cobrado: total,
                    entregado_en: new Date().toISOString()
                });
                
                setTimeout(() => {
                    alert(`🎉 ENTREGA COMPLETADA 🎉\n\n✅ Pedido: ${id}\n💰 Monto cobrado: ${total.toFixed(2)}€\n👤 Cliente ha pagado correctamente\n\n📊 El monto ha sido añadido a tu billetera.\n\n¡Gracias por tu trabajo! 🚀`);
                }, 500);
                
                mostrarToast(`✅ Pedido entregado. +${total.toFixed(2)}€ en tu billetera`, "success");
                if(navigator.vibrate) navigator.vibrate([200, 100, 200]);
                await refrescarDatos();
            } catch (e) {
                mostrarToast("Error al finalizar la entrega", "warning");
            } finally {
                mostrarLoader(false);
            }
        }
        
        // ============================================
        // UTILIDADES
        // ============================================
        function mostrarToast(mensaje, tipo = "success") {
            const toast = document.createElement('div');
            toast.className = `toast ${tipo === "warning" ? "warning" : (tipo === "success" ? "success" : "")}`;
            toast.innerText = mensaje;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        function mostrarLoader(mostrar) {
            document.getElementById('loader').style.display = mostrar ? 'flex' : 'none';
        }
        
        function cerrarSesion() {
            if(confirm("¿Cerrar sesión?")) {
                localStorage.removeItem('ae_cod_reparto');
                if(listenerRef) listenerRef.off();
                location.reload();
            }
        }
        
        setInterval(() => {
            if(pedidosActivos.length > 0) {
                renderPedidos();
            }
        }, 1000);
        
        initReparto();
    </script>
</body>
</html>
