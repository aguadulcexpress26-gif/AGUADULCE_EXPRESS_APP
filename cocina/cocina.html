<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="screen-orientation" content="landscape">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Aguadulce Express - Cocina</title>
    
    <link rel="manifest" href="/AGUADULCE_EXPRESS_APP/cocina/manifest-cocina.json">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/cCv7qsHf/IMAGEN-PNG-512.jpg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>

    <style>
        /* ============================================
           RESET Y ESTILOS GLOBALES
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0f172a;
        }
        
        /* ============================================
           LOGIN
           ============================================ */
        #login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 1rem;
            position: fixed;
            inset: 0;
            z-index: 100;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        
        #login-container.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        
        .login-card {
            background: white;
            border-radius: 1.5rem;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.5s ease-out;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .login-card h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #1f2937;
            text-align: center;
            margin-bottom: 0.5rem;
        }
        
        .login-card .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 2rem;
        }
        
        .login-card input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 0.75rem;
            font-size: 1rem;
            transition: all 0.3s;
            background: #f9fafb;
            color: #1f2937;
        }
        
        .login-card input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            background: white;
        }
        
        .login-card button[type="submit"] {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .login-card button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }
        
        .login-card button[type="submit"]:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        
        /* ============================================
           APP PRINCIPAL
           ============================================ */
        #app {
            display: none;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #0f172a;
            position: fixed;
            inset: 0;
            z-index: 10;
        }
        
        #app:not(.hidden) {
            display: flex;
        }
        
        /* ============================================
           HEADER CON BANNER
           ============================================ */
        .app-header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 0.75rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f59e0b;
            flex-shrink: 0;
            min-height: 70px;
        }
        
        .app-header .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .app-header .logo h1 {
            color: #f59e0b;
            font-size: 1.25rem;
            font-weight: 700;
        }
        
        .app-header .logo span {
            color: #94a3b8;
            font-size: 0.75rem;
        }
        
        .app-header .restaurante-info {
            text-align: right;
            color: white;
        }
        
        .app-header .restaurante-info .nombre {
            font-weight: 600;
            font-size: 1rem;
        }
        
        .app-header .restaurante-info .email {
            font-size: 0.75rem;
            color: #94a3b8;
        }
        
        /* ============================================
           CONTADORES DE ESTADO
           ============================================ */
        .contadores {
            display: flex;
            gap: 1rem;
            background: #1e293b;
            padding: 0.5rem 2rem;
            flex-shrink: 0;
            border-bottom: 1px solid #334155;
            flex-wrap: wrap;
        }
        
        .contador-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #94a3b8;
            font-size: 0.875rem;
            font-weight: 500;
        }
        
        .contador-item .badge {
            background: #f59e0b;
            color: #0f172a;
            padding: 0.125rem 0.75rem;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 0.75rem;
        }
        
        .contador-item .badge.pendiente { background: #f59e0b; }
        .contador-item .badge.coccion { background: #3b82f6; color: white; }
        .contador-item .badge.listo { background: #10b981; color: white; }
        .contador-item .badge.reparto { background: #8b5cf6; color: white; }
        
        /* ============================================
           COLUMNAS DE PEDIDOS
           ============================================ */
        .columnas-container {
            flex: 1;
            display: flex;
            gap: 1rem;
            padding: 1rem;
            overflow-x: auto;
            overflow-y: hidden;
            background: #0f172a;
            min-height: 0;
        }
        
        .columna {
            flex: 1;
            min-width: 280px;
            max-width: 400px;
            background: #1e293b;
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #334155;
            transition: all 0.3s ease;
        }
        
        .columna-header {
            padding: 0.75rem 1rem;
            font-weight: 600;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid transparent;
            flex-shrink: 0;
        }
        
        .columna-header .titulo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .columna-header .cantidad {
            background: rgba(255,255,255,0.1);
            padding: 0.125rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
        }
        
        .columna-pendiente .columna-header {
            color: #f59e0b;
            border-bottom-color: #f59e0b;
        }
        
        .columna-coccion .columna-header {
            color: #3b82f6;
            border-bottom-color: #3b82f6;
        }
        
        .columna-listo .columna-header {
            color: #10b981;
            border-bottom-color: #10b981;
        }
        
        .columna-contenido {
            flex: 1;
            overflow-y: auto;
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        
        /* ============================================
           TARJETAS DE PEDIDOS
           ============================================ */
        .pedido-card {
            background: #0f172a;
            border-radius: 0.75rem;
            padding: 1rem;
            border: 1px solid #334155;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        
        .pedido-card:hover {
            border-color: #f59e0b;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        
        .pedido-card .cliente {
            font-weight: 600;
            color: white;
            font-size: 0.9rem;
        }
        
        .pedido-card .detalle {
            color: #94a3b8;
            font-size: 0.8rem;
            margin-top: 0.25rem;
        }
        
        .pedido-card .productos {
            color: #cbd5e1;
            font-size: 0.75rem;
            margin-top: 0.5rem;
            padding-top: 0.5rem;
            border-top: 1px solid #334155;
        }
        
        .pedido-card .productos span {
            display: inline-block;
            background: #1e293b;
            padding: 0.125rem 0.5rem;
            border-radius: 9999px;
            margin: 0.125rem 0.25rem 0.125rem 0;
            font-size: 0.7rem;
            color: #94a3b8;
        }
        
        .pedido-card .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid #334155;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        
        .pedido-card .footer .precio {
            color: #f59e0b;
            font-weight: 700;
            font-size: 0.9rem;
        }
        
        .pedido-card .footer .tiempo {
            color: #64748b;
            font-size: 0.7rem;
        }
        
        .btn-accion {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-accion:hover {
            transform: scale(1.05);
        }
        
        .btn-accion.primary { background: #f59e0b; color: #0f172a; }
        .btn-accion.primary:hover { background: #d97706; }
        .btn-accion.success { background: #10b981; color: white; }
        .btn-accion.success:hover { background: #059669; }
        .btn-accion.warning { background: #f59e0b; color: #0f172a; }
        .btn-accion.warning:hover { background: #d97706; }
        .btn-accion.danger { background: #ef4444; color: white; }
        .btn-accion.danger:hover { background: #dc2626; }
        
        /* ============================================
           MENÚ HAMBURGUESA
           ============================================ */
        #menu-toggle {
            position: fixed;
            top: 0.75rem;
            left: 0.75rem;
            z-index: 50;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.75rem;
            padding: 0.5rem 0.75rem;
            font-size: 1.25rem;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            display: none !important;
        }
        
        #app:not(.hidden) #menu-toggle {
            display: flex !important;
            align-items: center;
            justify-content: center;
        }
        
        #menu-toggle:hover {
            background: #334155;
        }
        
        #menu-toggle.active {
            background: #ef4444;
            border-color: #ef4444;
        }
        
        /* ============================================
           MENÚ DESPLEGABLE
           ============================================ */
        #menu-desplegable {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            height: 100vh;
            background: #1e293b;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.3);
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 40;
            padding: 5rem 1.5rem 2rem;
            overflow-y: auto;
            border-right: 1px solid #334155;
        }
        
        #menu-desplegable.open {
            transform: translateX(0);
        }
        
        #menu-desplegable .menu-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 0.25rem;
            border: none;
            background: transparent;
            width: 100%;
            font-size: 0.9rem;
        }
        
        #menu-desplegable .menu-item:hover {
            background: #334155;
            color: white;
        }
        
        #menu-desplegable .menu-item.active {
            background: #f59e0b;
            color: #0f172a;
        }
        
        #menu-desplegable .menu-item.danger {
            color: #ef4444;
        }
        
        #menu-desplegable .menu-item.danger:hover {
            background: #7f1d1d;
            color: #fca5a5;
        }
        
        /* ============================================
           TOAST NOTIFICATIONS
           ============================================ */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            color: white;
            font-weight: 500;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            z-index: 999;
            animation: slideIn 0.3s ease-out;
            max-width: 400px;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .toast-success { background: #10b981; }
        .toast-error { background: #ef4444; }
        .toast-info { background: #3b82f6; }
        .toast-warning { background: #f59e0b; color: #0f172a; }
        
        /* ============================================
           OVERLAY DE ORIENTACIÓN
           ============================================ */
        #orientacion-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        
        #orientacion-overlay:not(.hidden) {
            display: flex !important;
        }
        
        /* ============================================
           BOTÓN DE INSTALACIÓN PWA
           ============================================ */
        #install-btn {
            display: none !important;
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 50;
            padding: 0.6rem 1.25rem;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #0f172a;
            border: none;
            border-radius: 9999px;
            font-weight: 700;
            box-shadow: 0 8px 30px rgba(245, 158, 11, 0.4);
            cursor: pointer;
            transition: all 0.3s;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
        }
        
        #app:not(.hidden) #install-btn {
            display: flex !important;
        }
        
        #install-btn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 12px 40px rgba(245, 158, 11, 0.5);
        }
        
        /* ============================================
           SCROLLBAR
           ============================================ */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #1e293b; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #f59e0b; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #d97706; }
        
        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 1024px) {
            .columnas-container {
                flex-direction: column;
                overflow-y: auto;
                overflow-x: hidden;
                padding: 0.5rem;
            }
            
            .columna {
                min-width: unset;
                max-width: unset;
                max-height: 300px;
            }
        }
        
        @media (max-width: 768px) {
            .app-header {
                padding: 0.5rem 1rem;
                flex-direction: column;
                align-items: flex-start;
                gap: 0.25rem;
                min-height: 60px;
            }
            
            .app-header .restaurante-info {
                text-align: left;
                width: 100%;
            }
            
            .contadores {
                padding: 0.5rem 1rem;
                flex-wrap: wrap;
                gap: 0.5rem;
            }
            
            .contador-item {
                font-size: 0.7rem;
            }
            
            .columna {
                min-width: unset;
                max-height: 250px;
            }
            
            .pedido-card {
                padding: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================
    LOGIN CONTAINER
    ============================================ -->
    <div id="login-container">
        <div class="login-card">
            <h1>🍳 Aguadulce Express</h1>
            <p class="subtitle">Panel de Cocina</p>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="login-email" placeholder="restaurante@email.com" required>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                
                <button type="submit" id="login-btn">
                    <span id="login-text">Iniciar Sesión</span>
                    <span id="login-loading" class="hidden">Cargando...</span>
                </button>
                
                <div id="login-error" class="text-red-500 text-sm text-center hidden"></div>
            </form>
        </div>
    </div>

    <!-- ============================================
    APP PRINCIPAL
    ============================================ -->
    <div id="app" class="hidden">
        
        <!-- MENÚ HAMBURGUESA -->
        <button id="menu-toggle" aria-label="Menú">☰</button>
        
        <!-- MENÚ DESPLEGABLE -->
        <div id="menu-desplegable">
            <div class="mb-6 pb-4 border-b border-gray-700">
                <div class="font-bold text-lg text-white" id="restaurante-nombre">Cargando...</div>
                <div class="text-sm text-gray-400" id="restaurante-email"></div>
            </div>
            
            <button class="menu-item active" data-view="activos">
                <span>📋</span> Pedidos Activos
                <span class="ml-auto bg-blue-600 text-white px-2 py-0.5 rounded-full text-xs" id="contador-activos">0</span>
            </button>
            
            <button class="menu-item" data-view="historial">
                <span>📊</span> Historial
            </button>
            
            <button class="menu-item" data-view="demoras">
                <span>⏱️</span> Registro de Demoras
            </button>
            
            <div class="mt-4 pt-4 border-t border-gray-700">
                <button class="menu-item danger" id="btn-cerrar-sesion">
                    <span>🚪</span> Cerrar Sesión
                </button>
            </div>
        </div>
        
        <!-- HEADER CON BANNER -->
        <div class="app-header">
            <div class="logo">
                <span style="font-size: 1.5rem;">🍳</span>
                <div>
                    <h1>Aguadulce Express</h1>
                    <span>Panel de Cocina</span>
                </div>
            </div>
            <div class="restaurante-info">
                <div class="nombre" id="header-restaurante">Cargando...</div>
                <div class="email" id="header-email"></div>
            </div>
        </div>
        
        <!-- CONTADORES -->
        <div class="contadores">
            <div class="contador-item">
                📥 Entrada
                <span class="badge pendiente" id="count-pendiente">0</span>
            </div>
            <div class="contador-item">
                👨‍🍳 En Proceso
                <span class="badge coccion" id="count-coccion">0</span>
            </div>
            <div class="contador-item">
                ✅ Listo
                <span class="badge listo" id="count-listo">0</span>
            </div>
            <div class="contador-item">
                🛵 En Reparto
                <span class="badge reparto" id="count-reparto">0</span>
            </div>
        </div>
        
        <!-- COLUMNAS -->
        <div class="columnas-container" id="columnas-container">
            
            <!-- COLUMNA: ENTRADA -->
            <div class="columna columna-pendiente" id="columna-pendiente">
                <div class="columna-header">
                    <span class="titulo">📥 Entrada</span>
                    <span class="cantidad" id="col-count-pendiente">0</span>
                </div>
                <div class="columna-contenido" id="col-pendiente">
                    <!-- Pedidos pendientes -->
                </div>
            </div>
            
            <!-- COLUMNA: EN PROCESO -->
            <div class="columna columna-coccion" id="columna-coccion">
                <div class="columna-header">
                    <span class="titulo">👨‍🍳 En Proceso</span>
                    <span class="cantidad" id="col-count-coccion">0</span>
                </div>
                <div class="columna-contenido" id="col-coccion">
                    <!-- Pedidos en cocción -->
                </div>
            </div>
            
            <!-- COLUMNA: LISTO -->
            <div class="columna columna-listo" id="columna-listo">
                <div class="columna-header">
                    <span class="titulo">✅ Listo</span>
                    <span class="cantidad" id="col-count-listo">0</span>
                </div>
                <div class="columna-contenido" id="col-listo">
                    <!-- Pedidos listos -->
                </div>
            </div>
            
        </div>
        
        <!-- BOTÓN DE INSTALACIÓN PWA -->
        <button id="install-btn">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
            </svg>
            <span>Instalar App 📱</span>
        </button>
        
    </div>

    <!-- ============================================
    OVERLAY DE ORIENTACIÓN
    ============================================ -->
    <div id="orientacion-overlay" class="hidden">
        <div class="text-center text-white p-8">
            <div class="text-6xl mb-6 animate-pulse">🔄</div>
            <h2 class="text-2xl font-bold mb-4">¡Gira tu tableta!</h2>
            <p class="text-lg text-gray-300">
                Por favor, coloca tu dispositivo en <strong>posición horizontal</strong>
                para una mejor experiencia.
            </p>
            <button onclick="ocultarOverlayOrientacion()" class="mt-8 px-6 py-3 bg-white text-black rounded-lg font-semibold hover:bg-gray-200 transition">
                Continuar de todas formas
            </button>
        </div>
    </div>

    <!-- ============================================
    JAVASCRIPT PRINCIPAL
    ============================================ -->
    <script>
        // ============================================
        // 1. CONFIGURACIÓN DE FIREBASE
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyBEapmpody3y_vFyPF0ngUnCn5ZFOtxPjs",
            authDomain: "aguadulce-express-v2.firebaseapp.com",
            databaseURL: "https://aguadulce-express-v2-default-rtdb.firebaseio.com",
            projectId: "aguadulce-express-v2",
            storageBucket: "aguadulce-express-v2.appspot.com",
            messagingSenderId: "103953800507",
            appId: "1:103953800507:web:tu_app_id"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // ============================================
        // 2. VARIABLES GLOBALES
        // ============================================
        let currentUser = null;
        let currentView = 'activos';
        let pedidosListeners = [];
        let restauranteId = null;
        let deferredPrompt = null;

        // ============================================
        // 3. DETECCIÓN DE ORIENTACIÓN
        // ============================================
        function detectarOrientacion() {
            const esTableta = window.innerWidth >= 768 && window.innerWidth <= 1024;
            const esVertical = window.innerHeight > window.innerWidth;
            const overlay = document.getElementById('orientacion-overlay');
            
            if (esTableta && esVertical) {
                overlay.classList.remove('hidden');
            } else {
                overlay.classList.add('hidden');
            }
        }

        function ocultarOverlayOrientacion() {
            document.getElementById('orientacion-overlay').classList.add('hidden');
        }

        window.addEventListener('resize', detectarOrientacion);
        window.addEventListener('orientationchange', () => setTimeout(detectarOrientacion, 300));
        document.addEventListener('DOMContentLoaded', detectarOrientacion);

        // ============================================
        // 4. PWA - INSTALACIÓN
        // ============================================
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const btn = document.getElementById('install-btn');
            if (btn && !window.matchMedia('(display-mode: standalone)').matches) {
                btn.style.display = 'flex';
            }
        });

        window.addEventListener('appinstalled', () => {
            deferredPrompt = null;
            document.getElementById('install-btn').style.display = 'none';
            showToast('🎉 App instalada correctamente', 'success');
        });

        document.getElementById('install-btn').addEventListener('click', async () => {
            if (!deferredPrompt) {
                showToast('⚠️ La instalación no está disponible ahora', 'warning');
                return;
            }
            deferredPrompt.prompt();
            const result = await deferredPrompt.userChoice;
            if (result.outcome === 'accepted') {
                showToast('✅ App instalada con éxito', 'success');
            } else {
                showToast('❌ Instalación cancelada', 'error');
            }
            deferredPrompt = null;
        });

        // ============================================
        // 5. TOAST NOTIFICATIONS
        // ============================================
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(20px)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ============================================
        // 6. MENÚ HAMBURGUESA
        // ============================================
        const menuToggle = document.getElementById('menu-toggle');
        const menuDesplegable = document.getElementById('menu-desplegable');

        if (menuToggle) {
            menuToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                menuDesplegable.classList.toggle('open');
                menuToggle.classList.toggle('active');
                menuToggle.textContent = menuDesplegable.classList.contains('open') ? '✕' : '☰';
            });

            document.addEventListener('click', (e) => {
                if (!menuDesplegable.contains(e.target) && e.target !== menuToggle) {
                    menuDesplegable.classList.remove('open');
                    menuToggle.classList.remove('active');
                    menuToggle.textContent = '☰';
                }
            });
        }

        // ============================================
        // 7. AUTENTICACIÓN
        // ============================================
        const loginForm = document.getElementById('login-form');
        const loginEmail = document.getElementById('login-email');
        const loginPassword = document.getElementById('login-password');
        const loginBtn = document.getElementById('login-btn');
        const loginText = document.getElementById('login-text');
        const loginLoading = document.getElementById('login-loading');
        const loginError = document.getElementById('login-error');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = loginEmail.value.trim();
            const password = loginPassword.value;
            
            if (!email || !password) {
                loginError.textContent = 'Por favor, completa todos los campos';
                loginError.classList.remove('hidden');
                return;
            }
            
            loginBtn.disabled = true;
            loginText.classList.add('hidden');
            loginLoading.classList.remove('hidden');
            loginError.classList.add('hidden');
            
            try {
                const credenciales = await auth.signInWithEmailAndPassword(email, password);
                const user = credenciales.user;
                
                const snapshot = await db.ref(`restaurantes/${user.uid}`).once('value');
                if (!snapshot.exists()) {
                    await auth.signOut();
                    throw new Error('Esta cuenta no es un restaurante válido');
                }
                
                showToast('✅ Bienvenido al panel de cocina', 'success');
                
            } catch (error) {
                console.error('Error de login:', error);
                loginError.textContent = error.message;
                loginError.classList.remove('hidden');
                
                loginBtn.disabled = false;
                loginText.classList.remove('hidden');
                loginLoading.classList.add('hidden');
            }
        });

        // ============================================
        // 8. ESTADO DE AUTENTICACIÓN
        // ============================================
        auth.onAuthStateChanged(async (user) => {
            const app = document.getElementById('app');
            const loginContainer = document.getElementById('login-container');
            
            if (user) {
                console.log('✅ Usuario autenticado:', user.uid);
                currentUser = user;
                restauranteId = user.uid;
                
                loginContainer.classList.add('hidden');
                app.classList.remove('hidden');
                
                await cargarDatosRestaurante();
                escucharPedidos();
                renderizarVista();
                
                setTimeout(solicitarPermisoNotificaciones, 3000);
                
            } else {
                console.log('❌ Sin usuario autenticado');
                app.classList.add('hidden');
                loginContainer.classList.remove('hidden');
                
                pedidosListeners.forEach(ref => ref.off());
                pedidosListeners = [];
            }
        });

        // ============================================
        // 9. CERRAR SESIÓN
        // ============================================
        document.getElementById('btn-cerrar-sesion').addEventListener('click', async () => {
            if (confirm('¿Seguro que quieres cerrar sesión?')) {
                await auth.signOut();
                showToast('👋 Sesión cerrada', 'info');
            }
        });

        // ============================================
        // 10. MENÚ - CAMBIO DE VISTA
        // ============================================
        document.querySelectorAll('.menu-item[data-view]').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.menu-item[data-view]').forEach(el => {
                    el.classList.remove('active');
                });
                item.classList.add('active');
                
                currentView = item.dataset.view;
                
                // Si es Activos, restaurar las 3 columnas
                if (currentView === 'activos') {
                    restaurarVistaColumnas();
                }
                
                renderizarVista();
                
                menuDesplegable.classList.remove('open');
                menuToggle.classList.remove('active');
                menuToggle.textContent = '☰';
            });
        });

        // ============================================
        // 11. CARGAR DATOS DEL RESTAURANTE
        // ============================================
        async function cargarDatosRestaurante() {
            try {
                const snapshot = await db.ref(`restaurantes/${restauranteId}`).once('value');
                const data = snapshot.val();
                
                if (data) {
                    const nombre = data.NOMBRE_RESTAURANTE || data.nombre || 'Restaurante';
                    const email = data.email || '';
                    
                    document.getElementById('restaurante-nombre').textContent = nombre;
                    document.getElementById('restaurante-email').textContent = email;
                    document.getElementById('header-restaurante').textContent = nombre;
                    document.getElementById('header-email').textContent = email;
                }
            } catch (error) {
                console.error('Error al cargar restaurante:', error);
            }
        }

        // ============================================
        // 12. ESCUCHAR PEDIDOS
        // ============================================
        function escucharPedidos() {
            pedidosListeners.forEach(ref => ref.off());
            pedidosListeners = [];
            
            const pedidosRef = db.ref('pedidos');
            pedidosRef.on('value', () => {
                renderizarVista();
            });
            
            pedidosListeners.push(pedidosRef);
        }

        // ============================================
        // 13. RENDERIZAR VISTA PRINCIPAL
        // ============================================
        function renderizarVista() {
            db.ref('pedidos').once('value')
                .then((snapshot) => {
                    const pedidos = snapshot.val();
                    
                    // Limpiar columnas
                    document.getElementById('col-pendiente').innerHTML = '';
                    document.getElementById('col-coccion').innerHTML = '';
                    document.getElementById('col-listo').innerHTML = '';
                    
                    let countPendiente = 0;
                    let countCoccion = 0;
                    let countListo = 0;
                    let countReparto = 0;
                    
                    // Si es Historial
                    if (currentView === 'historial') {
                        mostrarVistaHistorial(pedidos);
                        return;
                    }
                    
                    // Si es Demoras
                    if (currentView === 'demoras') {
                        mostrarVistaDemoras(pedidos);
                        return;
                    }
                    
                    // Si es Activos (vista normal)
                    if (!pedidos) {
                        mostrarMensajeVacio('col-pendiente', '📥', 'No hay pedidos en entrada');
                        mostrarMensajeVacio('col-coccion', '👨‍🍳', 'No hay pedidos en proceso');
                        mostrarMensajeVacio('col-listo', '✅', 'No hay pedidos listos');
                        actualizarContadores(0, 0, 0, 0);
                        return;
                    }
                    
                    const pedidosArray = Object.entries(pedidos);
                    let hayPedidosActivos = false;
                    
                    for (const [id, data] of pedidosArray) {
                        const restId = data.restauranteId || data.restaurante_id;
                        if (restId !== restauranteId) continue;
                        
                        if (data.estado === 'pendiente' || data.estado === 'coccion' || data.estado === 'listo' || data.estado === 'reparto') {
                            hayPedidosActivos = true;
                            agregarPedidoAColumna(id, data);
                        }
                    }
                    
                    // Si no hay pedidos activos, mostrar mensajes
                    if (!hayPedidosActivos) {
                        mostrarMensajeVacio('col-pendiente', '📥', 'No hay pedidos en entrada');
                        mostrarMensajeVacio('col-coccion', '👨‍🍳', 'No hay pedidos en proceso');
                        mostrarMensajeVacio('col-listo', '✅', 'No hay pedidos listos');
                    } else {
                        // Si hay pedidos, actualizar mensajes de columnas vacías
                        if (document.getElementById('col-pendiente').children.length === 0) {
                            mostrarMensajeVacio('col-pendiente', '📥', 'No hay pedidos en entrada');
                        }
                        if (document.getElementById('col-coccion').children.length === 0) {
                            mostrarMensajeVacio('col-coccion', '👨‍🍳', 'No hay pedidos en proceso');
                        }
                        if (document.getElementById('col-listo').children.length === 0) {
                            mostrarMensajeVacio('col-listo', '✅', 'No hay pedidos listos');
                        }
                    }
                    
                    actualizarContadores(countPendiente, countCoccion, countListo, countReparto);
                    
                })
                .catch((error) => {
                    console.error('Error al cargar pedidos:', error);
                });
        }

        // ============================================
        // AGREGAR PEDIDO A COLUMNA
        // ============================================
        function agregarPedidoAColumna(id, data) {
            const estado = data.estado || 'pendiente';
            let columnaId = '';
            let contadorRef = '';
            
            switch(estado) {
                case 'pendiente':
                    columnaId = 'col-pendiente';
                    contadorRef = 'count-pendiente';
                    break;
                case 'coccion':
                    columnaId = 'col-coccion';
                    contadorRef = 'count-coccion';
                    break;
                case 'listo':
                    columnaId = 'col-listo';
                    contadorRef = 'count-listo';
                    break;
                case 'reparto':
                    columnaId = 'col-listo';
                    contadorRef = 'count-reparto';
                    break;
                default:
                    columnaId = 'col-pendiente';
                    contadorRef = 'count-pendiente';
            }
            
            const container = document.getElementById(columnaId);
            if (!container) return;
            
            // Incrementar contador
            const contador = document.getElementById(contadorRef);
            if (contador) {
                contador.textContent = parseInt(contador.textContent) + 1;
            }
            
            // Crear tarjeta
            const card = document.createElement('div');
            card.className = 'pedido-card';
            card.dataset.pedidoId = id;
            
            const estadoDisplay = {
                'pendiente': '📥 Pendiente',
                'coccion': '👨‍🍳 En Cocción',
                'listo': '✅ Listo',
                'reparto': '🛵 En Reparto'
            }[estado] || estado;
            
            const productosHtml = data.productos ? 
                Object.entries(data.productos).map(([pid, prod]) => 
                    `<span>${prod.cantidad || 1}x ${prod.nombre}</span>`
                ).join('') : 
                '<span>Sin productos</span>';
            
            const total = data.total || 0;
            const tiempo = data.timestamp ? new Date(data.timestamp).toLocaleTimeString() : '';
            
            // Botones según estado
            let botones = '';
            if (estado === 'pendiente') {
                botones = `<button class="btn-accion primary" onclick="cambiarEstado('${id}', 'coccion')">Iniciar Cocción</button>`;
            } else if (estado === 'coccion') {
                botones = `<button class="btn-accion success" onclick="cambiarEstado('${id}', 'listo')">Marcar Listo</button>`;
            } else if (estado === 'listo') {
                botones = `<button class="btn-accion warning" onclick="cambiarEstado('${id}', 'reparto')">Enviar a Reparto</button>`;
            } else if (estado === 'reparto') {
                botones = `<span style="color: #8b5cf6; font-size: 0.7rem;">🛵 En camino</span>`;
            }
            
            card.innerHTML = `
                <div class="cliente">${data.clienteNombre || 'Cliente'}</div>
                <div class="detalle">${data.direccion || 'Sin dirección'} • ${estadoDisplay}</div>
                <div class="productos">${productosHtml}</div>
                <div class="footer">
                    <span class="precio">$${total.toFixed(2)}</span>
                    <span class="tiempo">${tiempo}</span>
                    ${botones}
                </div>
            `;
            
            container.appendChild(card);
        }

        // ============================================
        // MOSTRAR MENSAJE DE VACÍO
        // ============================================
        function mostrarMensajeVacio(columnaId, icono, mensaje) {
            const container = document.getElementById(columnaId);
            if (!container) return;
            
            // Solo mostrar si no hay hijos
            if (container.children.length > 0) return;
            
            const empty = document.createElement('div');
            empty.style.cssText = `
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 2rem 1rem;
                color: #475569;
                text-align: center;
                font-size: 0.875rem;
                height: 100%;
                min-height: 120px;
            `;
            empty.innerHTML = `
                <div style="font-size: 2rem; margin-bottom: 0.5rem;">${icono}</div>
                <div>${mensaje}</div>
            `;
            container.appendChild(empty);
        }

        // ============================================
        // ACTUALIZAR CONTADORES
        // ============================================
        function actualizarContadores(pendiente, coccion, listo, reparto) {
            document.getElementById('count-pendiente').textContent = pendiente;
            document.getElementById('count-coccion').textContent = coccion;
            document.getElementById('count-listo').textContent = listo;
            document.getElementById('count-reparto').textContent = reparto;
            document.getElementById('col-count-pendiente').textContent = pendiente;
            document.getElementById('col-count-coccion').textContent = coccion;
            document.getElementById('col-count-listo').textContent = listo;
            
            // Actualizar contador del menú
            document.getElementById('contador-activos').textContent = pendiente + coccion + listo + reparto;
        }

        // ============================================
        // MOSTRAR VISTA HISTORIAL
        // ============================================
        function mostrarVistaHistorial(pedidos) {
            const columna = document.getElementById('col-pendiente');
            const columna2 = document.getElementById('col-coccion');
            const columna3 = document.getElementById('col-listo');
            
            // Limpiar todas las columnas
            columna.innerHTML = '';
            columna2.innerHTML = '';
            columna3.innerHTML = '';
            
            // Ocultar las otras columnas y mostrar solo una
            columna2.parentElement.style.display = 'none';
            columna3.parentElement.style.display = 'none';
            columna.parentElement.style.display = 'flex';
            columna.parentElement.style.maxWidth = '100%';
            
            // Cambiar título de la columna
            const header = columna.parentElement.querySelector('.columna-header .titulo');
            if (header) header.innerHTML = '📜 Historial de Pedidos';
            
            const contador = columna.parentElement.querySelector('.columna-header .cantidad');
            
            if (!pedidos) {
                mostrarMensajeVacio('col-pendiente', '📜', 'No hay pedidos en el historial');
                if (contador) contador.textContent = '0';
                return;
            }
            
            let pedidosHistorial = [];
            const pedidosArray = Object.entries(pedidos);
            
            for (const [id, data] of pedidosArray) {
                const restId = data.restauranteId || data.restaurante_id;
                if (restId !== restauranteId) continue;
                
                if (data.estado === 'entregado' || data.estado === 'cancelado' || data.estado === 'ENTREGADO') {
                    pedidosHistorial.push({ id, ...data });
                }
            }
            
            // Ordenar por fecha (más reciente primero)
            pedidosHistorial.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            
            if (pedidosHistorial.length === 0) {
                mostrarMensajeVacio('col-pendiente', '📜', 'No hay pedidos en el historial');
                if (contador) contador.textContent = '0';
                return;
            }
            
            if (contador) contador.textContent = pedidosHistorial.length;
            
            for (const pedido of pedidosHistorial) {
                const card = document.createElement('div');
                card.className = 'pedido-card';
                card.style.borderLeftColor = '#64748b';
                
                const productosHtml = pedido.productos ? 
                    Object.entries(pedido.productos).map(([pid, prod]) => 
                        `<span>${prod.cantidad || 1}x ${prod.nombre}</span>`
                    ).join('') : 
                    '<span>Sin productos</span>';
                
                const fecha = pedido.timestamp ? new Date(pedido.timestamp).toLocaleString() : 'Fecha desconocida';
                const estadoIcon = pedido.estado === 'entregado' || pedido.estado === 'ENTREGADO' ? '✅' : '❌';
                
                card.innerHTML = `
                    <div class="cliente">${pedido.clienteNombre || 'Cliente'}</div>
                    <div class="detalle">${pedido.direccion || 'Sin dirección'} • ${estadoIcon} ${pedido.estado}</div>
                    <div class="productos">${productosHtml}</div>
                    <div class="footer">
                        <span class="precio">$${(pedido.total || 0).toFixed(2)}</span>
                        <span class="tiempo">${fecha}</span>
                    </div>
                `;
                
                columna.appendChild(card);
            }
        }

        // ============================================
        // MOSTRAR VISTA DEMORAS
        // ============================================
        function mostrarVistaDemoras(pedidos) {
            const columna = document.getElementById('col-pendiente');
            const columna2 = document.getElementById('col-coccion');
            const columna3 = document.getElementById('col-listo');
            
            // Limpiar todas las columnas
            columna.innerHTML = '';
            columna2.innerHTML = '';
            columna3.innerHTML = '';
            
            // Ocultar las otras columnas y mostrar solo una
            columna2.parentElement.style.display = 'none';
            columna3.parentElement.style.display = 'none';
            columna.parentElement.style.display = 'flex';
            columna.parentElement.style.maxWidth = '100%';
            
            // Cambiar título de la columna
            const header = columna.parentElement.querySelector('.columna-header .titulo');
            if (header) header.innerHTML = '⏱️ Registro de Demoras';
            
            const contador = columna.parentElement.querySelector('.columna-header .cantidad');
            
            if (!pedidos) {
                mostrarMensajeVacio('col-pendiente', '⏱️', 'No hay registros de demoras');
                if (contador) contador.textContent = '0';
                return;
            }
            
            let pedidosDemora = [];
            const pedidosArray = Object.entries(pedidos);
            
            for (const [id, data] of pedidosArray) {
                const restId = data.restauranteId || data.restaurante_id;
                if (restId !== restauranteId) continue;
                
                if (data.demora && data.demora > 0) {
                    pedidosDemora.push({ id, ...data });
                }
            }
            
            // Ordenar por demora (mayor primero)
            pedidosDemora.sort((a, b) => (b.demora || 0) - (a.demora || 0));
            
            if (pedidosDemora.length === 0) {
                mostrarMensajeVacio('col-pendiente', '⏱️', 'No hay registros de demoras');
                if (contador) contador.textContent = '0';
                return;
            }
            
            if (contador) contador.textContent = pedidosDemora.length;
            
            for (const pedido of pedidosDemora) {
                const card = document.createElement('div');
                card.className = 'pedido-card';
                card.style.borderLeftColor = '#ef4444';
                
                const productosHtml = pedido.productos ? 
                    Object.entries(pedido.productos).map(([pid, prod]) => 
                        `<span>${prod.cantidad || 1}x ${prod.nombre}</span>`
                    ).join('') : 
                    '<span>Sin productos</span>';
                
                const fecha = pedido.timestamp ? new Date(pedido.timestamp).toLocaleString() : 'Fecha desconocida';
                const minutosDemora = pedido.demora || 0;
                const demoraColor = minutosDemora > 30 ? '#ef4444' : minutosDemora > 15 ? '#f59e0b' : '#10b981';
                
                card.innerHTML = `
                    <div class="cliente">${pedido.clienteNombre || 'Cliente'}</div>
                    <div class="detalle" style="color: ${demoraColor};">
                        ⏱️ Demora: ${minutosDemora} minutos • ${pedido.estado || 'Finalizado'}
                    </div>
                    <div class="productos">${productosHtml}</div>
                    <div class="footer">
                        <span class="precio">$${(pedido.total || 0).toFixed(2)}</span>
                        <span class="tiempo">${fecha}</span>
                    </div>
                `;
                
                columna.appendChild(card);
            }
        }

        // ============================================
        // RESTAURAR VISTA DE 3 COLUMNAS
        // ============================================
        function restaurarVistaColumnas() {
            const col1 = document.getElementById('col-pendiente').parentElement;
            const col2 = document.getElementById('col-coccion').parentElement;
            const col3 = document.getElementById('col-listo').parentElement;
            
            col1.style.display = 'flex';
            col2.style.display = 'flex';
            col3.style.display = 'flex';
            col1.style.maxWidth = '400px';
            col2.style.maxWidth = '400px';
            col3.style.maxWidth = '400px';
            
            // Restaurar títulos
            const header1 = col1.querySelector('.columna-header .titulo');
            const header2 = col2.querySelector('.columna-header .titulo');
            const header3 = col3.querySelector('.columna-header .titulo');
            if (header1) header1.innerHTML = '📥 Entrada';
            if (header2) header2.innerHTML = '👨‍🍳 En Proceso';
            if (header3) header3.innerHTML = '✅ Listo';
        }

        // ============================================
        // 14. CAMBIAR ESTADO DE PEDIDO
        // ============================================
        window.cambiarEstado = async function(pedidoId, nuevoEstado) {
            try {
                await db.ref(`pedidos/${pedidoId}/estado`).set(nuevoEstado);
                await db.ref(`pedidos/${pedidoId}/historial`).push({
                    estado: nuevoEstado,
                    timestamp: Date.now(),
                    usuario: currentUser.uid
                });
                
                showToast(`✅ Pedido actualizado a ${nuevoEstado}`, 'success');
                renderizarVista();
                
                if (nuevoEstado === 'reparto') {
                    await notificarRepartidor(pedidoId);
                }
                
            } catch (error) {
                console.error('Error al cambiar estado:', error);
                showToast('❌ Error al actualizar pedido', 'error');
            }
        };

        // ============================================
        // 15. NOTIFICAR REPARTIDOR
        // ============================================
        async function notificarRepartidor(pedidoId) {
            try {
                const snapshot = await db.ref(`pedidos/${pedidoId}`).once('value');
                const pedido = snapshot.val();
                if (!pedido) return;
                
                const repartidoresSnap = await db.ref('repartidores').orderByChild('estado').equalTo('activo').once('value');
                const repartidores = repartidoresSnap.val();
                
                if (!repartidores) {
                    showToast('⚠️ No hay repartidores disponibles', 'warning');
                    return;
                }
                
                const repartidorId = Object.keys(repartidores)[0];
                
                await db.ref(`pedidos/${pedidoId}/repartidorId`).set(repartidorId);
                await db.ref(`pedidos/${pedidoId}/repartidorNombre`).set(repartidores[repartidorId].nombre);
                await db.ref(`pedidos/${pedidoId}/estado`).set('reparto');
                
                showToast(`📱 Repartidor asignado: ${repartidores[repartidorId].nombre}`, 'success');
                renderizarVista();
                
            } catch (error) {
                console.error('Error al notificar repartidor:', error);
            }
        }

        // ============================================
        // 16. SOLICITAR PERMISO NOTIFICACIONES
        // ============================================
        async function solicitarPermisoNotificaciones() {
            if (!('Notification' in window)) {
                console.log('❌ Este navegador no soporta notificaciones');
                return false;
            }
            
            if (Notification.permission === 'granted') {
                console.log('✅ Permiso de notificaciones ya concedido');
                await registrarTokenFCM();
                return true;
            }
            
            if (Notification.permission === 'denied') {
                console.log('❌ Permiso de notificaciones denegado');
                return false;
            }
            
            try {
                const permission = await Notification.requestPermission();
                if (permission === 'granted') {
                    console.log('✅ Permiso de notificaciones concedido');
                    await registrarTokenFCM();
                    return true;
                } else {
                    console.log('❌ Permiso de notificaciones denegado');
                    return false;
                }
            } catch (error) {
                console.error('❌ Error al solicitar permiso:', error);
                return false;
            }
        }

        // ============================================
        // 17. REGISTRAR TOKEN FCM
        // ============================================
        async function registrarTokenFCM() {
            try {
                const messaging = firebase.messaging();
                const token = await messaging.getToken({
                    vapidKey: 'TU_VAPID_KEY_AQUI'
                });
                
                console.log('📨 Token FCM obtenido:', token);
                
                if (currentUser) {
                    await db.ref(`restaurantes/${currentUser.uid}/fcmTokens/${token}`).set(true);
                    console.log('✅ Token FCM guardado en Firebase');
                }
                
                return token;
            } catch (error) {
                console.error('❌ Error al obtener token FCM:', error);
                return null;
            }
        }

        // ============================================
        // 18. INICIALIZAR
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(detectarOrientacion, 500);
            
            if (auth.currentUser) {
                setTimeout(() => {
                    showToast('🍳 Panel de Cocina listo', 'info');
                }, 1000);
            }
        });

        // ============================================
        // 19. LOGS DE SEGURIDAD
        // ============================================
        async function registrarLogSeguridad(evento, detalles = {}) {
            try {
                await db.ref('logs_seguridad').push({
                    usuario: currentUser?.uid || 'anonimo',
                    email: currentUser?.email || 'desconocido',
                    evento: evento,
                    detalles: detalles,
                    timestamp: Date.now(),
                    dispositivo: navigator.userAgent
                });
            } catch (error) {
                console.error('Error al registrar log:', error);
            }
        }

        auth.onAuthStateChanged((user) => {
            if (user) {
                registrarLogSeguridad('inicio_sesion', { view: 'cocina' });
            }
        });

        console.log('🍳 Aguadulce Express - Panel de Cocina');
        console.log('📱 Versión 2.0 - Optimizado para tabletas');
    </script>

    <!-- ============================================
    SERVICE WORKER
    ============================================ -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker
                    .register('/AGUADULCE_EXPRESS_APP/cocina/sw-cocina.js')
                    .then(registration => {
                        console.log('✅ Service Worker registrado:', registration);
                        
                        setInterval(() => {
                            registration.update();
                            console.log('🔄 Buscando actualizaciones del SW...');
                        }, 24 * 60 * 60 * 1000);
                        
                        navigator.serviceWorker.addEventListener('message', event => {
                            console.log('💬 Mensaje del SW:', event.data);
                        });
                    })
                    .catch(error => {
                        console.error('❌ Error al registrar SW:', error);
                    });
            });
        }
    </script>
