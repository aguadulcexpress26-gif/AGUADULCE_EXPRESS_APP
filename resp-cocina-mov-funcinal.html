                        }
                        
                        function calcularCostoAlternativo(direccion) {
                            const esRoquetas = direccion.toLowerCase().includes('roquetas') || direccion.includes('04740');
                            const costo = esRoquetas ? 3.50 : 5.00;
                            
                            costoDisplay.textContent = `${costo.toFixed(2)}€`;
                            costoDisplay.style.color = '#f59e0b';
                            distanciaDisplay.textContent = esRoquetas ? '📍 Zona Roquetas' : '📍 Fuera de zona';
                            envioDetalle.style.display = 'block';
                            tarifaBaseDisplay.textContent = `${costo.toFixed(2)}€`;
                            distanciaKmDisplay.textContent = '-- km';
                            envioTotalDisplay.textContent = `${costo.toFixed(2)}€`;
                            calculator.style.borderColor = '#f59e0b';
                            window._costoEnvioCalculado = costo;
                            return costo;
                        }
                        
                        let timeoutId = null;
                        direccionInput.addEventListener('input', function() {
                            clearTimeout(timeoutId);
                            const dir = this.value.trim();
                            if (dir.length < 5) {
                                costoDisplay.textContent = '📍 Escribe dirección';
                                costoDisplay.style.color = '#94a3b8';
                                envioDetalle.style.display = 'none';
                                calculator.style.borderColor = '#334155';
                                return;
                            }
                            timeoutId = setTimeout(() => {
                                calcularCostoEnvio(dir);
                            }, 800);
                        });
                        
                        if (direccionInput.value.trim().length >= 5) {
                            setTimeout(() => calcularCostoEnvio(direccionInput.value.trim()), 500);
                        }
                    },
                    preConfirm: async () => {
                        const cliente = document.getElementById('cliente-reparto').value.trim();
                        const telefono = document.getElementById('telefono-reparto').value.trim();
                        const direccion = document.getElementById('direccion-reparto').value.trim();
                        const pago = document.getElementById('pago-reparto').value;
                        const nota = document.getElementById('nota-reparto').value.trim();
                        const costoEnvio = window._costoEnvioCalculado || 3.50;
                        
                        if (!cliente) {
                            Swal.showValidationMessage('❌ El nombre del cliente es obligatorio');
                            return false;
                        }
                        if (!telefono) {
                            Swal.showValidationMessage('❌ El teléfono es obligatorio');
                            return false;
                        }
                        if (!direccion) {
                            Swal.showValidationMessage('❌ La dirección es obligatoria');
                            return false;
                        }
                        
                        const esRoquetas = direccion.toLowerCase().includes('roquetas') || direccion.includes('04740');
                        if (!esRoquetas) {
                            const confirm = await Swal.fire({
                                title: '⚠️ Fuera de zona',
                                text: 'La dirección no parece estar en Roquetas de Mar. ¿Quieres continuar?',
                                icon: 'warning',
                                showCancelButton: true,
                                confirmButtonText: 'Sí, continuar',
                                cancelButtonText: 'Cancelar',
                                background: '#0f172a',
                                color: 'white'
                            });
                            if (!confirm.isConfirmed) return false;
                        }
                        
                        return { cliente, telefono, direccion, pago, nota, costoEnvio };
                    }
                }).then(async (result) => {
                    if (result.isConfirmed) {
                        await crearEnvio(result.value);
                    }
                });
            };

async function crearEnvio(data) {
    console.log('🚚 Creando envío con datos:', data);
    
    try {
        const repartidoresSnap = await db.ref('repartidores')
            .orderByChild('activo')
            .equalTo(true)
            .once('value');
        
        const repartidores = repartidoresSnap.val();
        if (!repartidores) {
            showToast('⚠️ No hay repartidores disponibles', 'warning');
            return;
        }
        
        let repartidorId = null;
        let repartidorData = null;
        let menorCarga = Infinity;
        
        for (const [uid, rData] of Object.entries(repartidores)) {
            const pedidosActivosSnap = await db.ref('pedidos')
                .orderByChild('uid_repartidor')
                .equalTo(uid)
                .once('value');
            
            const pedidosActivos = pedidosActivosSnap.val();
            let carga = 0;
            
            if (pedidosActivos) {
                for (const [pid, pData] of Object.entries(pedidosActivos)) {
                    const estado = pData.estado ? pData.estado.toUpperCase() : '';
                    if (estado !== 'ENTREGADO' && estado !== 'CANCELADO_POR_AUSENCIA') {
                        carga++;
                    }
                }
            }
            
            if (carga < menorCarga) {
                menorCarga = carga;
                repartidorId = uid;
                repartidorData = rData;
            }
        }
        
        if (!repartidorId) {
            const keys = Object.keys(repartidores);
            if (keys.length > 0) {
                repartidorId = keys[0];
                repartidorData = repartidores[keys[0]];
            } else {
                showToast('⚠️ No hay repartidores disponibles', 'warning');
                return;
            }
        }
        
        console.log(`✅ Repartidor seleccionado: ${repartidorData.nombre || repartidorId}`);
        
        const pedidoId = db.ref('pedidos').push().key;
        const costoEnvio = data.costoEnvio || 3.50;
        
        const pedido = {
            uid_restaurante: restauranteId,
            restaurante_id: restauranteId,
            restaurante_nombre: 'Restaurante',
            uid_repartidor: repartidorId,
            repartidor_nombre: repartidorData.nombre || 'Repartidor',
            uid_cliente: 'reparto_personal',
            cliente_nombre: data.cliente,
            cliente_telefono: data.telefono,
            direccion: data.direccion,
            items: [
                {
                    nombre: '📦 Reparto Personal',
                    cantidad: 1,
                    precio_unitario: 0,
                    total: 0
                }
            ],
            total: 0,
            subtotal: 0,
            envio: costoEnvio,
            estado: 'LISTO',
            tipo: 'reparto_personal',
            metodo_pago: data.pago === 'pagado' ? 'Pagado' : 'Contra entrega',
            nota: data.nota || '',
            debe_cobrar: data.pago === 'cobrar',
            timestamp: Date.now(),
            timestamp_inicio: Date.now(),
            timestamp_listo: Date.now(),
            tiempo_preparacion: 0,
            distancia_aproximada: window._distanciaCalculada || null,
            historial: [
                {
                    estado: 'LISTO',
                    timestamp: Date.now(),
                    accion: 'creado_por_restaurante',
                    tipo: 'reparto_personal'
                }
            ],
            reparto_personal: {
                creado_por: 'restaurante',
                fecha_creacion: Date.now(),
                nota: data.nota || '',
                estado_pago: data.pago,
                costo_envio_calculado: costoEnvio
            }
        };
        
        await db.ref(`pedidos/${pedidoId}`).set(pedido);
        console.log(`✅ Pedido ${pedidoId} creado correctamente`);
        
        const envioId = db.ref('envios').push().key;
        const envio = {
            uid_restaurante: restauranteId,
            uid_repartidor: repartidorId,
            pedido_id: pedidoId,
            cliente_nombre: data.cliente,
            cliente_telefono: data.telefono,
            direccion: data.direccion,
            monto: 0,
            costo_envio: costoEnvio,
            estado_pago: data.pago === 'pagado' ? 'pagado' : 'pendiente',
            debe_cobrar: data.pago === 'cobrar',
            estado: 'entregado',
            tipo: 'reparto_personal',
            nota: data.nota || '',
            timestamp: Date.now(),
            distancia_aproximada: window._distanciaCalculada || null,
            historial: [
                {
                    estado: 'entregado',
                    timestamp: Date.now(),
                    accion: 'creado_por_restaurante'
                }
            ]
        };
        
        await db.ref(`envios/${envioId}`).set(envio);
        console.log(`✅ Envío ${envioId} creado correctamente`);
        
        await notificarRepartidor(pedidoId);
        
        showToast(`✅ Reparto #${pedidoId.substring(0,8)} listo - Envío: ${costoEnvio.toFixed(2)}€`, 'success');

    }

// 25b. CARGAR HISTORIAL FILTRADO - VERSIÓN GLOBAL
// ============================================
window.cargarHistorialFiltrado = function() {
    console.log('🔍 Cargando historial filtrado...');
    
    const content = document.getElementById('historial-contenido');
    const contador = document.getElementById('col-count-historial');
    const filtro = document.getElementById('filtro-historial');
    
    if (!content) {
        console.warn('⚠️ Contenedor de historial no encontrado');
        return;
    }
    
    if (!restauranteId) {
        console.warn('⏳ Esperando restauranteId...');
        content.innerHTML = `<div class="empty"><div class="icon">⏳</div><div>Esperando datos del restaurante...</div></div>`;
        setTimeout(() => window.cargarHistorialFiltrado(), 1000);
        return;
    }
    
    const filtroSeleccionado = filtro ? filtro.value : 'todos';
    console.log(`📋 Filtro seleccionado: "${filtroSeleccionado}"`);
    
    content.innerHTML = `<div class="empty"><div class="icon">⏳</div><div>Cargando pedidos...</div></div>`;
    
    db.ref('pedidos').once('value').then(snap => {
        const pedidos = snap.val();
        let count = 0;
        
        if (!pedidos) { 
            content.innerHTML = `<div class="empty"><div class="icon">📜</div><div>No hay pedidos</div></div>`; 
            if (contador) contador.textContent = '0'; 
            return; 
        }
        
        let html = '';
        let pedidosFiltrados = [];
        
        for (const [id, data] of Object.entries(pedidos)) {
            const restId = data.restauranteId || data.restaurante_id || data.uid_restaurante;
            if (restId !== restauranteId) continue;
            
            const estado = data.estado ? data.estado.toLowerCase() : '';
            const tipo = data.tipo || 'normal';
            
            if (filtroSeleccionado === 'ventas' && tipo === 'reparto_personal') continue;
            if (filtroSeleccionado === 'repartos' && tipo !== 'reparto_personal') continue;
            
            if (estado === 'entregado' || estado === 'cancelado' || estado === 'rechazado' || estado === 'listo') {
                count++;
                pedidosFiltrados.push({
                    id: id,
                    data: data,
                    estado: estado,
                    tipo: tipo
                });
            }
        }
        
        console.log(`📊 Total: ${count} pedidos (filtro: "${filtroSeleccionado}")`);
        
        pedidosFiltrados.sort((a, b) => {
            const fechaA = a.data.timestamp || 0;
            const fechaB = b.data.timestamp || 0;
            return fechaB - fechaA;
        });
        
        if (pedidosFiltrados.length === 0) {
            let mensajeVacio = 'No hay pedidos en el historial';
            if (filtroSeleccionado === 'ventas') mensajeVacio = 'No hay ventas';
            if (filtroSeleccionado === 'repartos') mensajeVacio = 'No hay repartos';
            content.innerHTML = `<div class="empty"><div class="icon">📭</div><div>${mensajeVacio}</div></div>`;
        } else {
            for (const item of pedidosFiltrados) {
                const data = item.data;
                const estado = item.estado;
                const esReparto = item.tipo === 'reparto_personal';
                const fecha = data.timestamp ? new Date(data.timestamp).toLocaleString() : 'Sin fecha';
                
                let productosHtml = '';
                if (data.items && data.items.length > 0) {
                    productosHtml = data.items.slice(0, 4).map(item => 
                        `<span>${item.cantidad || 1}x ${item.nombre}</span>`
                    ).join('');
                    if (data.items.length > 4) {
                        productosHtml += `<span style="font-size:0.5rem;color:var(--text-muted);">+${data.items.length-4} más</span>`;
                    }
                } else {
                    productosHtml = '<span>Sin productos</span>';
                }
                
                let estadoIcono = '';
                let estadoColor = '';
                if (estado === 'entregado' || estado === 'listo') {
                    estadoIcono = '✅';
                    estadoColor = 'var(--accent-green)';
                } else if (estado === 'cancelado' || estado === 'rechazado') {
                    estadoIcono = '❌';
                    estadoColor = 'var(--accent-red)';
                } else {
                    estadoIcono = '⏳';
                    estadoColor = 'var(--accent-gold)';
                }
                
                html += `
                    <div class="order-card" style="border-left:4px solid ${esReparto ? 'var(--accent-purple)' : '#64748b'};">
                        <div class="top">
                            <span class="id">#${data.id_pedido || item.id.substring(0,8)}</span>
                            <span class="time">${fecha}</span>
                        </div>
                        <div class="cliente">${escapeHTML(data.cliente_nombre || 'Cliente')}</div>
                        <div class="direccion">${escapeHTML(data.direccion || 'Sin dirección')}</div>
                        <div style="display:flex;gap:0.2rem;margin-top:0.15rem;flex-wrap:wrap;">
                            <span style="font-size:0.5rem;padding:0.05rem 0.3rem;border-radius:50px;background:${esReparto ? 'rgba(139,92,246,0.15)' : 'rgba(245,158,11,0.15)'};color:${esReparto ? 'var(--accent-purple)' : 'var(--accent-gold)'};">${esReparto ? '📦 Reparto' : '🛒 Venta'}</span>
                            <span style="font-size:0.5rem;padding:0.05rem 0.3rem;border-radius:50px;background:rgba(16,185,129,0.15);color:${estadoColor};">${estadoIcono} ${estado.charAt(0).toUpperCase() + estado.slice(1)}</span>
                        </div>
                        <div class="productos">${productosHtml}</div>
                        <div style="display:flex;justify-content:space-between;margin-top:0.2rem;padding-top:0.2rem;border-top:1px solid var(--border-color);">
                            <span style="font-weight:700;color:var(--accent-gold);font-size:0.7rem;">$${(data.total || 0).toFixed(2)}</span>
                            <button class="btn btn-secondary" onclick="verDetallePedido('${item.id}')" style="padding:0.05rem 0.3rem;font-size:0.5rem;">📋</button>
                        </div>
                    </div>
                `;
            }
            
            content.innerHTML = html;
        }
        
        if (contador) contador.textContent = count;
        console.log(`✅ Historial actualizado: ${count} pedidos`);
        
    }).catch(error => {
        console.error('❌ Error cargando historial:', error);
        content.innerHTML = `<div class="empty"><div class="icon">❌</div><div>Error: ${error.message}</div></div>`;
    });
};

// ============================================
// CARGAR GANANCIAS - VERSIÓN GLOBAL
// ============================================
window.cargarGanancias = function() {
    console.log('💰 Cargando ganancias...');
    
    const content = document.getElementById('ganancias-contenido');
    const filtro = document.getElementById('filtro-ganancias');
    if (!content) return;
    
    const periodo = filtro ? filtro.value : 'semana';
    content.innerHTML = '<div style="text-align:center;padding:1.5rem;color:var(--text-muted);">🔄 Cargando datos...</div>';
    
    // ✅ USAR COMISIÓN DESDE FIREBASE
    const comisionPorcentaje = comisionGlobal || 10;
    const comisionTipo = comisionTipoGlobal || 'porcentaje';
    
    db.ref('pedidos').once('value').then(snap => {
        const pedidos = snap.val();
        if (!pedidos) {
            content.innerHTML = `<div class="empty"><div class="icon">📊</div><div>No hay datos de ventas</div></div>`;
            return;
        }
        
        const ahora = new Date();
        let fechaInicio;
        
        switch(periodo) {
            case 'hoy':
                fechaInicio = new Date(ahora);
                fechaInicio.setHours(0, 0, 0, 0);
                break;
            case 'semana':
                fechaInicio = new Date(ahora);
                const dia = ahora.getDay();
                const diff = (dia === 0 ? 6 : dia - 1);
                fechaInicio.setDate(ahora.getDate() - diff);
                fechaInicio.setHours(0, 0, 0, 0);
                break;
            case 'mes':
                fechaInicio = new Date(ahora.getFullYear(), ahora.getMonth(), 1);
                fechaInicio.setHours(0, 0, 0, 0);
                break;
            case 'quincena':
                fechaInicio = new Date(ahora);
                fechaInicio.setDate(ahora.getDate() <= 15 ? 1 : 16);
                fechaInicio.setHours(0, 0, 0, 0);
                break;
            default:
                fechaInicio = new Date(ahora);
                fechaInicio.setDate(ahora.getDate() - 7);
                fechaInicio.setHours(0, 0, 0, 0);
        }
        
        let totalPedidos = 0;
        let totalVentas = 0;
        let totalComisiones = 0;
        let totalLiquidar = 0;
        let pedidosDetalle = [];
        
        for (const [id, data] of Object.entries(pedidos)) {
            const restId = data.restauranteId || data.restaurante_id || data.uid_restaurante;
            if (restId !== restauranteId) continue;
            
            const fecha = new Date(data.fecha || data.timestamp || 0);
            if (fecha < fechaInicio) continue;
            
            if (data.estado === 'ENTREGADO' || data.estado === 'LISTO') {
                totalPedidos++;
                
                // ✅ CALCULAR BASE (neto)
                let montoBase = data.base || data.subtotal || 0;
                if (montoBase === 0 && data.total > 0) {
                    const envio = data.envio || 0;
                    let comisionCalculada = data.comision_aplicada || 0;
                    if (comisionCalculada === 0) {
                        if (comisionTipo === 'porcentaje') {
                            comisionCalculada = (data.total - envio) * (comisionPorcentaje / 100);
                        } else {
                            comisionCalculada = comisionPorcentaje;
                        }
                    }
                    montoBase = data.total - envio - comisionCalculada;
                }
                
                // ✅ CALCULAR COMISIÓN CON VALOR DESDE FIREBASE
                let comision = data.comision_aplicada || 0;
                if (comision === 0) {
                    if (comisionTipo === 'porcentaje') {
                        comision = montoBase * (comisionPorcentaje / 100);
                    } else {
                        comision = comisionPorcentaje;
                    }
                }
                
                totalVentas += montoBase;
                totalComisiones += comision;
                totalLiquidar += (montoBase - comision);
                
                pedidosDetalle.push({
                    id: data.id_pedido || id.substring(0, 8),
                    cliente: data.cliente_nombre || 'Cliente',
                    total: montoBase,
                    base: montoBase,
                    envio: data.envio || 0,
                    comision: comision,
                    liquidar: montoBase - comision,
                    fecha: fecha
                });
            }
        }
        
        totalGanancias = totalVentas;
        
        // Actualizar contador en stats bar
        const gananciasElement = document.getElementById('count-ganancias');
        if (gananciasElement) gananciasElement.textContent = totalGanancias.toFixed(0);
        
        pedidosDetalle.sort((a, b) => b.fecha - a.fecha);
        
        let html = `
            <div class="ganancias-resumen">
                <div class="resumen-card">
                    <div class="label">📦 Pedidos</div>
                    <div class="value gold">${totalPedidos}</div>
                </div>
                <div class="resumen-card">
                    <div class="label">💰 Base (Neto)</div>
                    <div class="value green">${totalVentas.toFixed(2)}€</div>
                </div>
                <div class="resumen-card">
                    <div class="label">🏪 Comisión (${comisionPorcentaje}%)</div>
                    <div class="value blue">${totalComisiones.toFixed(2)}€</div>
                </div>
                <div class="resumen-card">
                    <div class="label">💵 A Liquidar</div>
                    <div class="value purple">${totalLiquidar.toFixed(2)}€</div>
                </div>
            </div>
            <div style="text-align:center;font-size:0.5rem;color:var(--text-muted);margin-bottom:0.3rem;">
                ⚙️ Comisión: ${comisionTipo === 'porcentaje' ? comisionPorcentaje + '%' : comisionPorcentaje + '€ fijo'}
            </div>
        `;
        
        if (pedidosDetalle.length === 0) {
            html += `<div class="empty"><div class="icon">📭</div><div>No hay pedidos en este período</div></div>`;
        } else {
            html += `<div class="ganancias-detalle" style="max-height:300px;overflow-y:auto;">`;
            html += `<div style="font-size:0.55rem;font-weight:700;color:var(--text-secondary);margin-bottom:0.2rem;">📋 Detalle de pedidos</div>`;
            for (const p of pedidosDetalle) {
                const fechaStr = p.fecha ? p.fecha.toLocaleDateString() : 'Sin fecha';
                html += `
                    <div class="detalle-item">
                        <div>
                            <span class="cliente-nombre">#${p.id}</span>
                            <span style="color:var(--text-secondary);margin-left:0.3rem;font-size:0.55rem;">${escapeHTML(p.cliente)}</span>
                        </div>
                        <div>
                            <span class="pedido-total">${p.total.toFixed(2)}€</span>
                            <span class="pedido-fecha" style="margin-left:0.3rem;">${fechaStr}</span>
                        </div>
                    </div>
                `;
            }
            html += `</div>`;
        }
        
        content.innerHTML = html;
        
        window._gananciasData = {
            periodo: periodo,
            totalPedidos: totalPedidos,
            totalVentas: totalVentas,
            totalComisiones: totalComisiones,
            totalLiquidar: totalLiquidar,
            detalle: pedidosDetalle,
            comisionPorcentaje: comisionPorcentaje,
            comisionTipo: comisionTipo
        };
        
        console.log(`💰 Ganancias cargadas: ${totalPedidos} pedidos, ${totalVentas.toFixed(2)}€ base`);
        
    }).catch(error => {
        console.error('Error cargando ganancias:', error);
        content.innerHTML = `<div class="empty"><div class="icon">❌</div><div>Error al cargar datos: ${error.message}</div></div>`;
    });
};

// ============================================
// EXPORTAR GANANCIAS EXCEL - VERSIÓN GLOBAL
// ============================================
window.exportarGananciasExcel = function() {
    const data = window._gananciasData;
    if (!data || data.detalle.length === 0) {
        Swal.fire({
            title: '⚠️ Sin datos',
            text: 'No hay datos para exportar en este período',
            icon: 'warning',
            background: '#0f172a',
            color: 'white'
        });
        return;
    }
    
    let csv = "Pedido,Cliente,Base (Neto),Comisión,A Liquidar,Fecha\n";
    for (const p of data.detalle) {
        const fechaStr = p.fecha ? p.fecha.toLocaleDateString() : 'Sin fecha';
        csv += `"${p.id}","${p.cliente}",${p.total.toFixed(2)},${p.comision.toFixed(2)},${p.liquidar.toFixed(2)},"${fechaStr}"\n`;
    }
    
    csv += `\n"RESUMEN","","","","",""\n`;
    csv += `"Total Pedidos",${data.totalPedidos},"","","",""\n`;
    csv += `"Total Base",${data.totalVentas.toFixed(2)}€,"","","",""\n`;
    csv += `"Total Comisiones",${data.totalComisiones.toFixed(2)}€,"","","",""\n`;
    csv += `"Total A Liquidar",${data.totalLiquidar.toFixed(2)}€,"","","",""\n`;
    
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const link = document.createElement("a");
    const url = URL.createObjectURL(blob);
    link.href = url;
    link.setAttribute("download", `ganancias_${data.periodo}_${new Date().toISOString().slice(0,10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
    
    Swal.fire({
        title: '✅ Reporte exportado',
        text: `Se exportaron ${data.detalle.length} pedidos`,
        icon: 'success',
        timer: 2000,
        showConfirmButton: false,
        background: '#0f172a',
        color: 'white'
    });
};

window.limpiarHistorial = async function() {
    // ✅ Verificar que el usuario es admin
    const user = firebase.auth().currentUser;
    if (!user) {
        showToast('❌ Debes iniciar sesión', 'error');
        return;
    }
    
    const adminSnap = await db.ref(`usuarios/${user.uid}/rol`).once('value');
    if (adminSnap.val() !== 'admin') {
        showToast('❌ Solo el administrador puede limpiar el historial', 'error');
        return;
    }
    
    const confirm = await Swal.fire({
        title: '⚠️ ¿Limpiar historial?',
        text: 'Esta acción eliminará todos los pedidos finalizados (ENTREGADOS, LISTOS, CANCELADOS). ¿Estás seguro?',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Sí, limpiar',
        cancelButtonText: 'Cancelar',
        background: '#0f172a',
        color: 'white',
        confirmButtonColor: '#ef4444',
        cancelButtonColor: '#334155'
    });
    
    if (!confirm.isConfirmed) return;
    
    try {
        const pedidos = await db.ref('pedidos').once('value');
        const updates = {};
        let count = 0;
        
        for (const [id, data] of Object.entries(pedidos.val() || {})) {
            const restId = data.restauranteId || data.restaurante_id || data.uid_restaurante;
            if (restId === restauranteId) {
                const estado = data.estado ? data.estado.toUpperCase() : '';
                if (estado === 'ENTREGADO' || estado === 'LISTO' || estado === 'CANCELADO' || estado === 'RECHAZADO') {
                    updates[id] = null;
                    count++;
                }
            }
        }
        
        if (count === 0) {
            showToast('📭 No hay pedidos para limpiar', 'info');
            return;
        }
        
        await db.ref('pedidos').update(updates);
        showToast(`✅ ${count} pedidos eliminados del historial`, 'success');
        renderizarVista();
        
    } catch (error) {
        console.error('Error limpiando historial:', error);
        showToast('❌ Error al limpiar historial', 'error');
    }
};
