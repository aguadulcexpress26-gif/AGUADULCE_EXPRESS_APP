    <!-- ============================================
    ESTILOS
    ============================================ -->
    <style>
        /* ============================================
           RESET Y VARIABLES
           ============================================ */
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: #1a2234;
            --bg-card-hover: #243049;
            --border-color: #2a3a5a;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-gold: #f59e0b;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-purple: #8b5cf6;
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font-size-base: 14px;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: var(--font-size-base);
        }
        
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--accent-gold); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #d97706; }
        
        /* ============================================
           LOGIN
           ============================================ */
        #login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-primary);
            padding: 1rem;
            position: fixed;
            inset: 0;
            z-index: 100;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #login-container.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        
        .login-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 2.5rem 1.5rem;
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            animation: fadeInUp 0.6s ease-out;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .login-card .logo { text-align: center; margin-bottom: 1.5rem; }
        .login-card .logo h1 { font-size: 1.8rem; font-weight: 900; color: var(--accent-gold); letter-spacing: -0.5px; }
        .login-card .logo p { color: var(--text-secondary); font-size: 0.8rem; }
        
        .login-card input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            color: var(--text-primary);
            transition: var(--transition);
            outline: none;
        }
        .login-card input:focus { border-color: var(--accent-gold); box-shadow: 0 0 0 3px rgba(245,158,11,0.15); }
        .login-card input::placeholder { color: var(--text-muted); }
        
        .login-card .btn-login {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, var(--accent-gold), #d97706);
            color: #0f172a;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }
        .login-card .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(245,158,11,0.3); }
        .login-card .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        /* ============================================
           APP LAYOUT
           ============================================ */
        #app {
            display: none;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: var(--bg-primary);
            position: fixed;
            inset: 0;
            z-index: 10;
        }
        #app:not(.hidden) { display: flex; flex-direction: column; }
        
        /* ============================================
           TOP BAR (VERSIÓN MÓVIL)
           ============================================ */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.3rem 0.5rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            min-height: 40px;
            z-index: 20;
        }
        
        .top-bar .brand {
            font-weight: 900;
            font-size: 0.8rem;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        
        .top-bar .brand span {
            font-size: 0.5rem;
            color: var(--text-muted);
            font-weight: 400;
        }
        
        .top-bar .header-actions {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        
        #estado-restaurante {
            font-size: 0.5rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 50px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            white-space: nowrap;
        }
        
        .top-bar .header-actions .btn-pausa {
            padding: 0.1rem 0.5rem;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            font-size: 0.6rem;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }
        .top-bar .header-actions .btn-pausa.active {
            background: var(--accent-red);
            color: white;
        }
        .top-bar .header-actions .btn-pausa.inactive {
            background: var(--accent-green);
            color: white;
        }
        
        #estado-banner {
            display: none;
        }
        #estado-banner.active { display: block; }
        #estado-banner .banner-content {
            background: var(--accent-red);
            color: white;
            text-align: center;
            padding: 4px 8px;
            font-weight: 700;
            font-size: 0.6rem;
        }
        
        #pausa-banner {
            display: none;
            background: var(--accent-red);
            color: white;
            text-align: center;
            padding: 3px;
            font-weight: 600;
            font-size: 0.6rem;
            flex-shrink: 0;
        }
        
        /* ============================================
           STATS BAR
           ============================================ */
        .stats-bar {
            display: flex;
            gap: 0.3rem;
            padding: 0.2rem 0.5rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.2rem;
            padding: 0.1rem 0.4rem;
            background: var(--bg-card);
            border-radius: 50px;
            border: 1px solid var(--border-color);
        }
        .stat-item .icon { font-size: 0.7rem; }
        .stat-item .label { font-size: 0.5rem; color: var(--text-muted); }
        .stat-item .value { font-size: 0.7rem; font-weight: 700; min-width: 14px; text-align: center; }
        .stat-item .value.gold { color: var(--accent-gold); }
        .stat-item .value.blue { color: var(--accent-blue); }
        
        /* ============================================
           KANBAN - VERSIÓN MÓVIL (VERTICAL)
           ============================================ */
        .kanban-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding: 0.3rem;
            overflow-y: auto;
            background: var(--bg-primary);
            min-height: 0;
        }
        
        .kanban-column {
            flex: 1;
            min-height: 35vh;
            max-height: 45vh;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        
        .kanban-column .column-header {
            padding: 0.3rem 0.6rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            flex-shrink: 0;
            background: var(--bg-secondary);
        }
        .kanban-column .column-header .title {
            font-weight: 700;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .kanban-column .column-header .count {
            background: var(--bg-card);
            padding: 0.05rem 0.4rem;
            border-radius: 50px;
            font-size: 0.55rem;
            font-weight: 700;
        }
        
        .kanban-column.pending .column-header { border-bottom-color: var(--accent-gold); }
        .kanban-column.pending .column-header .title { color: var(--accent-gold); }
        
        .kanban-column.cooking .column-header { border-bottom-color: var(--accent-blue); }
        .kanban-column.cooking .column-header .title { color: var(--accent-blue); }
        
        .kanban-column .column-content {
            flex: 1;
            overflow-y: auto;
            padding: 0.3rem;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        
      /* ============================================
   TARJETAS DE PEDIDOS - VERSIÓN MÁS GRANDE
   ============================================ */
.order-card {
    background: var(--bg-card);
    border-radius: var(--radius-sm);
    padding: 0.8rem 0.8rem;  /* ✅ Más padding */
    border: 1px solid var(--border-color);
    transition: var(--transition);
    flex-shrink: 0;
    margin-bottom: 0.5rem;   /* ✅ Más espacio entre tarjetas */
}
.order-card:hover {
    border-color: var(--accent-gold);
}
.order-card.delayed {
    border-left: 4px solid var(--accent-red);
    background: rgba(239,68,68,0.05);
}

.order-card .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.3rem;
}

/* ✅ ID MÁS GRANDE */
.order-card .top .id {
    font-size: 1.2rem;       /* ✅ Antes: 0.85rem */
    font-weight: 900;
    font-family: 'Courier New', monospace;
    color: #0f172a;
    background: var(--accent-gold);
    padding: 0.2rem 0.8rem;  /* ✅ Más padding */
    border-radius: 6px;
    letter-spacing: 0.5px;
    box-shadow: 0 0 15px rgba(245,158,11,0.3);
    display: inline-block;
}
.order-card .top .id.pendiente { background: #f59e0b; color: #0f172a; }
.order-card .top .id.coccion { background: #3b82f6; color: white; }

.order-card .top .time {
    font-size: 0.6rem;       /* ✅ Antes: 0.5rem */
    color: var(--text-muted);
}

/* ✅ CLIENTE MÁS GRANDE */
.order-card .cliente {
    font-weight: 700;
    font-size: 1rem;         /* ✅ Antes: 0.8rem */
    color: var(--text-primary);
    margin-bottom: 0.1rem;
}

.order-card .direccion {
    font-size: 0.75rem;      /* ✅ Antes: 0.6rem */
    color: var(--text-secondary);
}

.order-card .telefono {
    font-size: 0.7rem;       /* ✅ Antes: 0.55rem */
    color: var(--text-muted);
}

/* ✅ TIMER MÁS GRANDE */
.order-card .timer {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0.2rem 0.5rem;
    background: var(--bg-secondary);
    border-radius: var(--radius-sm);
    margin: 0.3rem 0;
    font-size: 0.7rem;       /* ✅ Antes: 0.55rem */
    border: 1px solid var(--border-color);
}
.order-card .timer .label { color: var(--text-muted); }
.order-card .timer .value { font-weight: 700; color: var(--accent-gold); font-size: 0.8rem; }
.order-card .timer .value.delayed { color: var(--accent-red); }

/* ✅ PRODUCTOS MÁS GRANDES */
.order-card .productos {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
    margin: 0.3rem 0;
}
.order-card .productos span {
    background: var(--bg-secondary);
    padding: 0.1rem 0.5rem;
    border-radius: 50px;
    font-size: 0.65rem;      /* ✅ Antes: 0.5rem */
    color: var(--text-secondary);
    border: 1px solid var(--border-color);
}

.order-card .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 0.3rem;
    padding-top: 0.3rem;
    border-top: 1px solid var(--border-color);
    flex-wrap: wrap;
    gap: 0.3rem;
}
.order-card .footer .precio {
    font-weight: 700;
    color: var(--accent-gold);
    font-size: 0.9rem;       /* ✅ Antes: 0.7rem */
}
.order-card .footer .badge-estado {
    font-size: 0.6rem;       /* ✅ Antes: 0.5rem */
    padding: 0.1rem 0.5rem;
    border-radius: 50px;
    font-weight: 600;
}
.order-card .footer .badge-estado.pending { background: rgba(245,158,11,0.15); color: var(--accent-gold); }
.order-card .footer .badge-estado.cooking { background: rgba(59,130,246,0.15); color: var(--accent-blue); }

/* ✅ BOTONES MÁS GRANDES Y GRUESOS */
.order-card .actions {
    display: flex;
    gap: 0.4rem;             /* ✅ Más espacio entre botones */
    margin-top: 0.3rem;
    flex-wrap: wrap;
    width: 100%;
}
.order-card .actions .btn {
    padding: 0.5rem 0.8rem;  /* ✅ Más padding (antes: 0.15rem 0.4rem) */
    border-radius: 50px;
    font-size: 0.8rem;       /* ✅ Antes: 0.55rem */
    font-weight: 700;        /* ✅ Más grueso */
    border: none;
    cursor: pointer;
    transition: var(--transition);
    flex: 1;
    min-width: 70px;         /* ✅ Más ancho (antes: 40px) */
    text-align: center;
    height: 48px;            /* ✅ Altura fija para mejor tacto */
    display: flex;
    align-items: center;
    justify-content: center;
}
.order-card .actions .btn:hover { transform: scale(1.05); }
.order-card .actions .btn-primary { background: var(--accent-gold); color: #0f172a; }
.order-card .actions .btn-primary:hover { background: #d97706; }
.order-card .actions .btn-success { background: var(--accent-green); color: white; }
.order-card .actions .btn-success:hover { background: #059669; }
.order-card .actions .btn-danger { background: var(--accent-red); color: white; }
.order-card .actions .btn-danger:hover { background: #dc2626; }
.order-card .actions .btn-secondary { background: var(--bg-secondary); color: var(--text-secondary); border: 1px solid var(--border-color); }
.order-card .actions .btn-secondary:hover { background: var(--bg-card-hover); }

/* ✅ ICONOS DE BOTONES MÁS GRANDES */
.order-card .actions .btn .icon {
    font-size: 1.1rem;
    margin-right: 0.3rem;
}
        /* ============================================
           VISTAS (Historial, Demoras, Ganancias)
           ============================================ */
        .view-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            overflow: hidden;
            margin: 0.3rem 0;
        }
        .view-container .view-header {
            padding: 0.3rem 0.6rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 0.3rem;
            background: var(--bg-secondary);
        }
        .view-container .view-header .title {
            font-weight: 700;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .view-container .view-header .filters {
            display: flex;
            gap: 0.3rem;
            flex-wrap: wrap;
            align-items: center;
        }
        .view-container .view-header .filters select,
        .view-container .view-header .filters button {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 0.1rem 0.4rem;
            color: var(--text-primary);
            font-size: 0.5rem;
            outline: none;
            cursor: pointer;
        }
        .view-container .view-header .filters select:focus,
        .view-container .view-header .filters button:hover {
            border-color: var(--accent-gold);
        }
        
        .view-container .view-content {
            flex: 1;
            overflow-y: auto;
            padding: 0.3rem 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        
        .view-container .view-content .empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: var(--text-muted);
            text-align: center;
        }
        .view-container .view-content .empty .icon { font-size: 2rem; margin-bottom: 0.3rem; }
        
        .ganancias-resumen {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.3rem;
            margin-bottom: 0.3rem;
        }
        .ganancias-resumen .resumen-card {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 0.4rem;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .ganancias-resumen .resumen-card .label {
            font-size: 0.5rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }
        .ganancias-resumen .resumen-card .value {
            font-size: 1rem;
            font-weight: 900;
        }
        .ganancias-resumen .resumen-card .value.gold { color: var(--accent-gold); }
        .ganancias-resumen .resumen-card .value.green { color: var(--accent-green); }
        .ganancias-resumen .resumen-card .value.blue { color: var(--accent-blue); }
        .ganancias-resumen .resumen-card .value.purple { color: var(--accent-purple); }
        .ganancias-resumen .resumen-card .value.red { color: var(--accent-red); }
        
        .ganancias-detalle .detalle-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.2rem 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.6rem;
        }
        .ganancias-detalle .detalle-item .cliente-nombre {
            font-weight: 600;
            color: var(--text-primary);
        }
        .ganancias-detalle .detalle-item .pedido-total {
            font-weight: 700;
            color: var(--accent-gold);
        }
        .ganancias-detalle .detalle-item .pedido-fecha {
            font-size: 0.5rem;
            color: var(--text-muted);
        }
        
        /* ============================================
           TOAST
           ============================================ */
        .toast {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            padding: 0.4rem 0.8rem;
            border-radius: var(--radius-sm);
            color: white;
            font-weight: 500;
            font-size: 0.7rem;
            box-shadow: var(--shadow);
            z-index: 999;
            animation: slideInToast 0.3s ease-out;
            max-width: 280px;
        }
        @keyframes slideInToast {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .toast-success { background: var(--accent-green); }
        .toast-error { background: var(--accent-red); }
        .toast-info { background: var(--accent-blue); }
        .toast-warning { background: var(--accent-gold); color: #0f172a; }
        
        /* ============================================
           FONT CONTROLS (RESTAURADO)
           ============================================ */
        .font-controls {
            display: flex;
            gap: 0.3rem;
            padding: 0.2rem 0.5rem;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
        }
        .font-controls button {
            padding: 0.15rem 0.5rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 600;
            transition: var(--transition);
        }
        .font-controls button:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
            border-color: var(--accent-gold);
        }
        .font-controls .size-label {
            font-size: 0.6rem;
            color: var(--text-muted);
            padding: 0 0.3rem;
            min-width: 40px;
            text-align: center;
        }

    <script>
        // ============================================
        // 1. CONFIGURACIÓN DE FIREBASE
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyBEapmpody3y_vFyPF0ngUnCn5ZFOtxPjs",
            authDomain: "aguadulce-express-v2.firebaseapp.com",
            databaseURL: "https://aguadulce-express-v2-default-rtdb.firebaseio.com",
            projectId: "aguadulce-express-v2",
            storageBucket: "aguadulce-express-v2.appspot.com",
            messagingSenderId: "103953800507",
            appId: "1:103953800507:web:tu_app_id"
        };

        // Esperar a que Firebase esté cargado
        function esperarFirebase() {
            return new Promise((resolve) => {
                if (typeof firebase !== 'undefined' && firebase.initializeApp) {
                    resolve();
                } else {
                    const checkInterval = setInterval(() => {
                        if (typeof firebase !== 'undefined' && firebase.initializeApp) {
                            clearInterval(checkInterval);
                            resolve();
                        }
                    }, 100);
                }
            });
        }

        // ============================================
        // 2. CONTROL DE TAMAÑO DE FUENTE
        // ============================================
        let tamañoFuenteActual = 100;

        function aplicarTamañoFuente() {
            const root = document.documentElement;
            const baseSize = 14;
            const newSize = (baseSize * tamañoFuenteActual) / 100;
            root.style.setProperty('--font-size-base', newSize + 'px');
            document.body.style.fontSize = newSize + 'px';
            const label = document.getElementById('font-size-label');
            if (label) label.textContent = tamañoFuenteActual + '%';
            localStorage.setItem('cocina_movil_font_size', tamañoFuenteActual);
        }

        function cambiarTamanoFuente(incremento) {
            tamañoFuenteActual = Math.min(Math.max(tamañoFuenteActual + incremento * 10, 70), 150);
            aplicarTamañoFuente();
        }

        function cargarTamañoFuente() {
            const guardado = localStorage.getItem('cocina_movil_font_size');
            if (guardado) {
                tamañoFuenteActual = parseInt(guardado);
            }
            aplicarTamañoFuente();
        }

        // ============================================
        // 3. INICIALIZACIÓN PRINCIPAL
        // ============================================
        // ✅ VARIABLES GLOBALES (DECLARADAS ANTES DE USARSE)
        let comisionGlobal = 10;
        let comisionTipoGlobal = 'porcentaje';
        let claveGananciasGlobal = 'admin123';
        let costoDemoraPorMinuto = 0.50;

        async function iniciarApp() {
            console.log('🚀 Iniciando app móvil...');
            
            // Esperar a que Firebase esté disponible
            await esperarFirebase();
            
            // Inicializar Firebase
            firebase.initializeApp(firebaseConfig);
            console.log('✅ Firebase inicializado');
            
            const auth = firebase.auth();
            const db = firebase.database();
            const functions = firebase.functions();
            
            // Cargar tamaño de fuente
            cargarTamañoFuente();
            
            // ✅ CARGAR CONFIGURACIONES CON MANEJO DE ERRORES
            try {
                await cargarConfiguracionGlobal();
            } catch (e) {
                console.warn('⚠️ Error cargando configuración global:', e.message);
            }
            
            try {
                await cargarConfiguracionDemoras();
            } catch (e) {
                console.warn('⚠️ Error cargando configuración de demoras:', e.message);
            }
            
            // ============================================
            // 4. VARIABLES GLOBALES DE LA APP
            // ============================================
            let currentUser = null;
            let currentView = 'activos';
            let restauranteId = null;
            let estaPausado = false;
            let pedidosListeners = [];
            let enviosListeners = [];
            const TIEMPO_ELABORACION_DEFAULT = 20;
            let tiempoElaboracionRestaurante = TIEMPO_ELABORACION_DEFAULT;
            let pedidosAnteriores = {};
            let sonidoActivo = false;
            let intervaloSonido = null;
            let pedidoSonando = null;
            let impresoraConfigurada = false;
            let nombreImpresora = '';
            
            // ============================================
            // 5. FUNCIONES UTILITARIAS
            // ============================================
            function showToast(message, type = 'info') {
                const toast = document.createElement('div');
                toast.className = `toast toast-${type}`;
                toast.textContent = message;
                document.body.appendChild(toast);
                setTimeout(() => { 
                    toast.style.opacity = '0'; 
                    toast.style.transform = 'translateY(20px)'; 
                    setTimeout(() => toast.remove(), 300); 
                }, 3000);
            }

            function escapeHTML(str) { 
                if (!str) return ''; 
                return str.replace(/[&<>"]/g, function(m) { 
                    if (m === '&') return '&amp;'; 
                    if (m === '<') return '&lt;'; 
                    if (m === '>') return '&gt;'; 
                    if (m === '"') return '&quot;'; 
                    return m; 
                }); 
            }

            function setText(id, value) {
                const el = document.getElementById(id);
                if (el) { el.textContent = value; }
            }

            // ============================================
            // 6. AUTENTICACIÓN
            // ============================================
            const loginForm = document.getElementById('login-form');
            const loginEmail = document.getElementById('login-email');
            const loginPassword = document.getElementById('login-password');
            const loginBtn = document.getElementById('login-btn');
            const loginText = document.getElementById('login-text');
            const loginLoading = document.getElementById('login-loading');
            const loginError = document.getElementById('login-error');

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = loginEmail.value.trim();
                const password = loginPassword.value;
                if (!email || !password) { 
                    loginError.textContent = 'Completa todos los campos'; 
                    loginError.style.display = 'block'; 
                    return; 
                }
                loginBtn.disabled = true;
                loginText.style.display = 'none';
                loginLoading.style.display = 'inline';
                loginError.style.display = 'none';
                try {
                    const credenciales = await auth.signInWithEmailAndPassword(email, password);
                    const user = credenciales.user;
                    const snapshot = await db.ref(`restaurantes/${user.uid}`).once('value');
                    if (!snapshot.exists()) { 
                        await auth.signOut(); 
                        throw new Error('Esta cuenta no es un restaurante válido'); 
                    }
                    showToast('✅ Bienvenido al panel de cocina móvil', 'success');
                } catch (error) {
                    console.error('Error de login:', error);
                    loginError.textContent = error.message;
                    loginError.style.display = 'block';
                    loginBtn.disabled = false;
                    loginText.style.display = 'inline';
                    loginLoading.style.display = 'none';
                }
            });

            // ============================================
            // 7. ESTADO DE AUTENTICACIÓN
            // ============================================
            auth.onAuthStateChanged(async (user) => {
                const app = document.getElementById('app');
                const loginContainer = document.getElementById('login-container');
                if (user) {
                    console.log('✅ Usuario autenticado:', user.uid);
                    currentUser = user;
                    restauranteId = user.uid;
                    loginContainer.classList.add('hidden');
                    app.classList.remove('hidden');
                    
                    await cargarDatosRestaurante();
                    await cargarEstadoPausa();
                    await cargarTiempoElaboracion();
                    await cargarConfiguracionImpresora();
                    
                    await mostrarEstadoRestaurante();
                    
                    db.ref(`restaurantes/${restauranteId}/pausado`).on('value', () => {
                        mostrarEstadoRestaurante();
                    });
                    db.ref(`restaurantes/${restauranteId}/horarios_dias`).on('value', () => {
                        mostrarEstadoRestaurante();
                    });
                    
                    escucharPedidos();
                    setTimeout(() => renderizarVista(), 500);
                } else {
                    console.log('❌ Sin usuario autenticado');
                    app.classList.add('hidden');
                    loginContainer.classList.remove('hidden');
                    pedidosListeners.forEach(ref => { try { ref.off(); } catch(e) {} });
                    pedidosListeners = [];
                    enviosListeners.forEach(ref => { try { ref.off(); } catch(e) {} });
                    enviosListeners = [];
                }
            });

            // ============================================
            // 8. CERRAR SESIÓN
            // ============================================
            document.getElementById('btn-cerrar-sesion').addEventListener('click', async () => {
                if (confirm('¿Seguro que quieres cerrar sesión?')) {
                    await auth.signOut();
                    showToast('👋 Sesión cerrada', 'info');
                }
            });

            // ============================================
            // 4b. CONFIGURACIÓN GLOBAL (DESDE ADMIN)
            // ============================================
            async function cargarConfiguracionGlobal() {
                try {
                    // ✅ INTENTAR CARGAR COMISIÓN
                    try {
                        const comisionSnap = await db.ref('configuracion_global/comision_plataforma').once('value');
                        if (comisionSnap.val() !== null) comisionGlobal = comisionSnap.val();
                    } catch (e) {
                        console.warn('⚠️ No se pudo cargar comisión global, usando valor por defecto:', e.message);
                    }
                    
                    // ✅ INTENTAR CARGAR TIPO DE COMISIÓN
                    try {
                        const tipoSnap = await db.ref('configuracion_global/comision_tipo').once('value');
                        if (tipoSnap.val() !== null) comisionTipoGlobal = tipoSnap.val();
                    } catch (e) {
                        console.warn('⚠️ No se pudo cargar tipo de comisión, usando valor por defecto');
                    }
                    
                    // ✅ INTENTAR CARGAR CLAVE PARA GANANCIAS
                    try {
                        const claveSnap = await db.ref('configuracion_global/clave_ganancias').once('value');
                        if (claveSnap.val() !== null) claveGananciasGlobal = claveSnap.val();
                    } catch (e) {
                        console.warn('⚠️ No se pudo cargar clave de ganancias, usando valor por defecto');
                    }
                    
                    console.log(`💰 Comisión: ${comisionGlobal}% (${comisionTipoGlobal})`);
                    console.log(`🔑 Clave ganancias: ${claveGananciasGlobal}`);
                    
                    // ✅ Escuchar cambios en tiempo real (con manejo de errores)
                    try {
                        db.ref('configuracion_global').on('value', (snapshot) => {
                            const config = snapshot.val() || {};
                            if (config.comision_plataforma !== undefined) comisionGlobal = config.comision_plataforma;
                            if (config.comision_tipo !== undefined) comisionTipoGlobal = config.comision_tipo;
                            if (config.clave_ganancias !== undefined) claveGananciasGlobal = config.clave_ganancias;
                            console.log('🔄 Configuración global actualizada');
                        });
                    } catch (e) {
                        console.warn('⚠️ No se pudo establecer listener de configuración global');
                    }
                    
                } catch (error) {
                    console.warn('⚠️ Usando valores por defecto para configuración global:', error.message);
                    comisionGlobal = 10;
                    comisionTipoGlobal = 'porcentaje';
                    claveGananciasGlobal = 'admin123';
                }
            }

            async function cargarConfiguracionDemoras() {
                try {
                    // ✅ INTENTAR CARGAR COSTO DE DEMORA
                    try {
                        const snap = await db.ref(`restaurantes/${restauranteId}/configuracion_demoras/costo_por_minuto`).once('value');
                        if (snap.val() !== null) {
                            costoDemoraPorMinuto = snap.val();
                            console.log(`⏱️ Costo demora: ${costoDemoraPorMinuto}€/min`);
                        }
                    } catch (e) {
                        console.warn('⚠️ No se pudo cargar costo de demora, usando valor por defecto');
                    }
                    
                    // ✅ Escuchar cambios (con manejo de errores)
                    try {
                        db.ref(`restaurantes/${restauranteId}/configuracion_demoras`).on('value', (snapshot) => {
                            const config = snapshot.val() || {};
                            if (config.costo_por_minuto !== undefined) {
                                costoDemoraPorMinuto = config.costo_por_minuto;
                                console.log(`🔄 Costo demora actualizado: ${costoDemoraPorMinuto}€/min`);
                            }
                        });
                    } catch (e) {
                        console.warn('⚠️ No se pudo establecer listener de demoras');
                    }
                    
                } catch (error) {
                    console.warn('⚠️ Usando valor por defecto para demoras:', error.message);
                    costoDemoraPorMinuto = 0.50;
                }
            }

            // ============================================
            // 9. FUNCIONES DE CARGA
            // ============================================
            async function cargarDatosRestaurante() {
                try {
                    const snapshot = await db.ref(`restaurantes/${restauranteId}`).once('value');
                    const data = snapshot.val();
                    if (data) {
                        const nombre = data.NOMBRE_RESTAURANTE || data.nombre || 'Restaurante';
                        
                        // ✅ SOLO ACTUALIZAR LA BARRA SUPERIOR (existe)
                        const brandElement = document.querySelector('.top-bar .brand');
                        if (brandElement) {
                            brandElement.innerHTML = `🍳 ${nombre}`;
                            console.log(`✅ Nombre actualizado: ${nombre}`);
                        }
                    }
                } catch (error) { 
                    console.error('Error al cargar restaurante:', error); 
                }
            }

            async function cargarTiempoElaboracion() {
                try {
                    const snapshot = await db.ref(`restaurantes/${restauranteId}/tiempo_elaboracion`).once('value');
                    tiempoElaboracionRestaurante = snapshot.val() || TIEMPO_ELABORACION_DEFAULT;
                    console.log(`⏱️ Tiempo de elaboración: ${tiempoElaboracionRestaurante} minutos`);
                    
                    // ✅ NUEVO: Escuchar cambios en tiempo real
                    db.ref(`restaurantes/${restauranteId}/tiempo_elaboracion`).on('value', (snap) => {
                        const nuevo = snap.val();
                        if (nuevo) {
                            tiempoElaboracionRestaurante = nuevo;
                            console.log(`⏱️ Tiempo actualizado: ${tiempoElaboracionRestaurante} min`);
                        }
                    });
                    
                } catch (error) {
                    tiempoElaboracionRestaurante = TIEMPO_ELABORACION_DEFAULT;
                }
            }

            async function cargarEstadoPausa() {
                try {
                    const snapshot = await db.ref(`restaurantes/${restauranteId}/pausado`).once('value');
                    estaPausado = snapshot.val() === true;
                    actualizarUIEstadoPausa();
                } catch (error) { console.error('Error al cargar estado de pausa:', error); }
            }

            function actualizarUIEstadoPausa() {
                const banner = document.getElementById('pausa-banner');
                const btnHeader = document.getElementById('btn-pausa-header');
                const btnNav = document.getElementById('btn-pausa-nav');
                const iconoPausa = document.getElementById('icono-pausa');
                const textoPausa = document.getElementById('texto-pausa');

                if (estaPausado) {
                    if (banner) banner.style.display = 'block';
                    if (btnHeader) { btnHeader.className = 'btn-pausa active'; btnHeader.textContent = '▶️'; }
                    if (btnNav) { btnNav.className = 'nav-item'; }
                    if (iconoPausa) iconoPausa.textContent = '▶️';
                    if (textoPausa) textoPausa.textContent = 'Reanudar';
                } else {
                    if (banner) banner.style.display = 'none';
                    if (btnHeader) { btnHeader.className = 'btn-pausa inactive'; btnHeader.textContent = '⏸️'; }
                    if (btnNav) { btnNav.className = 'nav-item'; }
                    if (iconoPausa) iconoPausa.textContent = '⏸️';
                    if (textoPausa) textoPausa.textContent = 'Pausar';
                }
            }

            window.togglePausa = async function() {
                try {
                    const nuevoEstado = !estaPausado;
                    await db.ref(`restaurantes/${restauranteId}/pausado`).set(nuevoEstado);
                    estaPausado = nuevoEstado;
                    actualizarUIEstadoPausa();
                    showToast(estaPausado ? '⏸️ Restaurante en PAUSA' : '▶️ Restaurante ACTIVO', estaPausado ? 'warning' : 'success');
                } catch (error) {
                    console.error('Error al cambiar estado de pausa:', error);
                    showToast('❌ Error al cambiar estado de pausa', 'error');
                }
            };
// ============================================

// ============================================

let impresoraConectada = null; // Guardar la conexión activa
let impresoraDevice = null; // Guardar el dispositivo Bluetooth
let impresoraCharacteristic = null; // Guardar la característica

// ✅ FUNCIÓN: Cargar configuración de impresora desde Firebase
async function cargarConfiguracionImpresora() {
    try {
        const snap = await db.ref(`restaurantes/${restauranteId}/impresora`).once('value');
        const config = snap.val();
        if (config && config.activo) {
            impresoraConfigurada = true;
            nombreImpresora = config.nombre || 'Impresora Bluetooth';
            window._impresoraDeviceId = config.deviceId || null;
            
            const estadoEl = document.getElementById('estado-impresora');
            if (estadoEl) {
                estadoEl.textContent = '🟢';
                estadoEl.title = `Impresora: ${nombreImpresora}`;
            }
            
            localStorage.setItem('impresora_nombre', nombreImpresora);
            localStorage.setItem('impresora_id', config.deviceId || '');
            
            console.log(`🖨️ Impresora configurada: ${nombreImpresora}`);
            
            // ✅ INTENTAR CONECTAR AUTOMÁTICAMENTE AL INICIAR
            setTimeout(() => {
                conectarImpresoraAutomaticamente();
            }, 2000);
            
        } else {
            impresoraConfigurada = false;
            nombreImpresora = '';
            window._impresoraDeviceId = null;
            
            const estadoEl = document.getElementById('estado-impresora');
            if (estadoEl) {
                estadoEl.textContent = '⭕';
                estadoEl.title = 'No hay impresora configurada';
            }
            
            localStorage.removeItem('impresora_nombre');
            localStorage.removeItem('impresora_id');
        }
    } catch (error) { 
        console.error('Error cargando impresora:', error);
        impresoraConfigurada = false;
        const estadoEl = document.getElementById('estado-impresora');
        if (estadoEl) estadoEl.textContent = '⭕';
    }
}

// ✅ NUEVA FUNCIÓN: Conectar impresora automáticamente al inicio
async function conectarImpresoraAutomaticamente() {
    if (!impresoraConfigurada || !navigator.bluetooth) {
        console.log('⚠️ No se puede conectar automáticamente');
        return;
    }
    
    try {
        console.log('🔄 Conectando automáticamente a:', nombreImpresora);
        
        // Intentar conectar con el dispositivo guardado
        const device = await navigator.bluetooth.requestDevice({
            filters: [
                { services: ['000018f0-0000-1000-8000-00805f9b34fb'] },
                { name: nombreImpresora }
            ],
            optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb']
        });
        
        if (device) {
            await conectarYGuardarImpresora(device);
            console.log('✅ Impresora conectada automáticamente');
            const estadoEl = document.getElementById('estado-impresora');
            if (estadoEl) {
                estadoEl.textContent = '🟢';
                estadoEl.title = `Impresora conectada: ${nombreImpresora}`;
            }
        }
    } catch (error) {
        console.warn('⚠️ No se pudo conectar automáticamente:', error.message);
        // No mostrar error al usuario, solo intentar reconectar después
    }
}

// ✅ FUNCIÓN: Conectar y guardar la impresora
async function conectarYGuardarImpresora(device) {
    try {
        // Desconectar conexión anterior si existe
        if (impresoraConectada) {
            try {
                await impresoraConectada.server.disconnect();
            } catch(e) {}
            impresoraConectada = null;
            impresoraCharacteristic = null;
        }
        
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
        const characteristic = await service.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb');
        
        // Guardar conexión
        impresoraConectada = { device, server, service, characteristic };
        impresoraDevice = device;
        impresoraCharacteristic = characteristic;
        
        console.log('✅ Conexión Bluetooth establecida y guardada');
        return impresoraConectada;
    } catch (error) {
        console.error('❌ Error conectando:', error);
        throw error;
    }
}

// ✅ FUNCIÓN MODIFICADA: Conectar a impresora guardada (usa conexión existente)
async function conectarImpresoraGuardada() {
    // ✅ Si ya hay una conexión activa, usarla
    if (impresoraConectada && impresoraCharacteristic) {
        try {
            // Verificar que la conexión sigue activa
            if (impresoraConectada.device.gatt.connected) {
                console.log('✅ Usando conexión existente:', impresoraConectada.device.name);
                return impresoraConectada;
            } else {
                console.log('⚠️ Conexión perdida, reconectando...');
                impresoraConectada = null;
                impresoraCharacteristic = null;
            }
        } catch(e) {
            console.warn('⚠️ Error verificando conexión:', e);
            impresoraConectada = null;
            impresoraCharacteristic = null;
        }
    }
    
    if (!impresoraConfigurada || !navigator.bluetooth) {
        console.warn('⚠️ No hay impresora configurada');
        return null;
    }
    
    try {
        console.log('🔄 Conectando a impresora guardada:', nombreImpresora);
        
        const device = await navigator.bluetooth.requestDevice({
            filters: [
                { services: ['000018f0-0000-1000-8000-00805f9b34fb'] },
                { name: nombreImpresora }
            ],
            optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb']
        });
        
        if (device) {
            const connection = await conectarYGuardarImpresora(device);
            console.log('✅ Conectado a:', device.name);
            
            const estadoEl = document.getElementById('estado-impresora');
            if (estadoEl) {
                estadoEl.textContent = '🟢';
                estadoEl.title = `Impresora conectada: ${nombreImpresora}`;
            }
            
            return connection;
        }
        return null;
        
    } catch (error) {
        console.warn('⚠️ Error conectando:', error);
        const estadoEl = document.getElementById('estado-impresora');
        if (estadoEl) {
            estadoEl.textContent = '🟡';
            estadoEl.title = `Error de conexión: ${error.message}`;
        }
        return null;
    }
}

// ✅ FUNCIÓN: Generar texto del ticket (SIN SÍMBOLO €)
function generarTextoComanda(data, nombreRestaurante, pedidoId) {
    let texto = '';
    
    // ============================================
    // 🔥 ENCABEZADO - AGUADULCE EXPRESS EN GRANDE
    // ============================================
    texto += '\x1B\x40'; // Inicializar impresora
    texto += '\x1B\x61\x01'; // Centrar
    texto += '\x1B\x45\x01'; // Negrita ON
    
    // 🔥 TAMAÑO DE TEXTO DOBLE (ALTURA Y ANCHO x2)
    texto += '\x1B\x21\x10'; // Doble tamaño
    texto += '  AGUADULCE\n';
    texto += '   EXPRESS\n';
    texto += '\x1B\x21\x00'; // Tamaño normal
    texto += '\x1B\x45\x00'; // Negrita OFF
    texto += '\x1B\x61\x00'; // Alinear izquierda
    
    // ============================================
    // 📋 TICKET
    // ============================================
    texto += '\x1B\x45\x01'; // Negrita ON
    texto += '===============================\n';
    texto += '\x1B\x45\x00'; // Negrita OFF
    texto += `   Ticket #${data.id_pedido || pedidoId.substring(0,8)}\n`;
    texto += `   Fecha: ${new Date(data.timestamp).toLocaleString()}\n`;
    texto += '-------------------------------\n';
    texto += `   Cliente: ${data.cliente_nombre || 'Sin nombre'}\n`;
    texto += `   Telefono: ${data.cliente_telefono || 'Sin telefono'}\n`;
    texto += `   Direccion: ${data.direccion || 'Sin direccion'}\n`;
    texto += '-------------------------------\n';
    texto += '   PRODUCTOS:\n';
    
    // ============================================
    // 📦 PRODUCTOS
    // ============================================
    if (data.items && data.items.length > 0) {
        for (const item of data.items) {
            const cantidad = item.cantidad || 1;
            const nombre = item.nombre || 'Producto';
            texto += `     ${cantidad}x ${nombre}\n`;
        }
    } else {
        texto += '   Sin productos\n';
    }
    
    texto += '-------------------------------\n';
    
    // ============================================
    // 💰 TOTAL - SIN SÍMBOLO € (USAR "EUR")
    // ============================================
    texto += '\x1B\x45\x01'; // Negrita ON
    const totalStr = (data.total || 0).toFixed(2);
    texto += `   TOTAL: ${totalStr} EUR\n`;
    texto += '\x1B\x45\x00'; // Negrita OFF
    texto += '===============================\n';
    
    // ============================================
    // 🏪 NOMBRE DEL RESTAURANTE EN NEGRITAS
    // ============================================
    texto += '\x1B\x45\x01'; // Negrita ON
    texto += `   ${nombreRestaurante}\n`;
    texto += '\x1B\x45\x00'; // Negrita OFF
    texto += '   Gracias por su pedido!\n';
    texto += '===============================\n';
    
    // ============================================
    // ✂️ CORTE DE PAPEL
    // ============================================
    texto += '\x1B\x69'; // Cortar papel
    texto += '\n\n\n\n\n\n\n\n';
    
    return texto;
}

// ✅ FUNCIÓN MODIFICADA: Imprimir comanda con impresora configurada
window.imprimirComandaConImpresora = function(pedidoId) {
    console.log('🖨️ Preparando ticket para impresión...');
    
    if (!impresoraConfigurada) {
        Swal.fire({
            title: '⚠️ Sin impresora',
            text: 'No hay una impresora configurada. ¿Quieres configurar una ahora?',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: '✅ Configurar',
            cancelButtonText: 'Cancelar',
            background: '#0f172a',
            color: 'white',
            confirmButtonColor: '#f59e0b'
        }).then((result) => {
            if (result.isConfirmed) {
                window.configurarImpresora();
            }
        });
        return;
    }
    
    if (!navigator.bluetooth) {
        Swal.fire({
            title: '❌ No soportado',
            text: 'Este navegador no soporta Bluetooth. Usa Chrome en Android.',
            icon: 'error',
            background: '#0f172a',
            color: 'white',
            confirmButtonColor: '#f59e0b'
        });
        return;
    }
    
    Promise.all([
        db.ref(`pedidos/${pedidoId}`).once('value'),
        db.ref(`restaurantes/${restauranteId}`).once('value')
    ]).then(async ([pedidoSnap, restauranteSnap]) => {
        const data = pedidoSnap.val();
        const restaurante = restauranteSnap.val();
        
        if (!data) { 
            showToast('❌ Pedido no encontrado', 'error'); 
            return; 
        }
        
        const nombreRestaurante = restaurante?.NOMBRE_RESTAURANTE || restaurante?.nombre || 'Restaurante';
        const texto = generarTextoComanda(data, nombreRestaurante, pedidoId);
        
        console.log('📄 Ticket generado:');
        console.log(texto);
        
        try {
            // ✅ OBTENER CONEXIÓN (reutilizar si existe)
            let connection = impresoraConectada;
            
            if (!connection || !connection.characteristic) {
                connection = await conectarImpresoraGuardada();
            }
            
            if (!connection) {
                throw new Error('No se pudo conectar a la impresora');
            }
            
            // ✅ ENVIAR DATOS
            const encoder = new TextEncoder('utf-8');
            const dataBytes = encoder.encode(texto);
            
            const chunkSize = 20;
            for (let i = 0; i < dataBytes.length; i += chunkSize) {
                const chunk = dataBytes.slice(i, i + chunkSize);
                await connection.characteristic.writeValue(chunk);
                await new Promise(resolve => setTimeout(resolve, 50));
            }
            
            console.log('✅ Ticket enviado a:', connection.device.name);
            showToast(`🖨️ Ticket enviado a ${connection.device.name}`, 'success');
            
            // ✅ ACTUALIZAR ESTADO DE LA IMPRESORA
            const estadoEl = document.getElementById('estado-impresora');
            if (estadoEl) {
                estadoEl.textContent = '🟢';
                estadoEl.title = `Impresora conectada: ${nombreImpresora}`;
            }
            
        } catch (bluetoothError) {
            console.warn('⚠️ Error en Bluetooth:', bluetoothError);
            
            // ✅ SI HAY ERROR, RECONECTAR
            const estadoEl = document.getElementById('estado-impresora');
            if (estadoEl) {
                estadoEl.textContent = '🟡';
                estadoEl.title = `Reconectando...`;
            }
            
            // Intentar reconectar
            try {
                impresoraConectada = null;
                impresoraCharacteristic = null;
                const newConnection = await conectarImpresoraGuardada();
                
                if (newConnection) {
                    // Reintentar impresión
                    const encoder = new TextEncoder('utf-8');
                    const dataBytes = encoder.encode(texto);
                    
                    const chunkSize = 20;
                    for (let i = 0; i < dataBytes.length; i += chunkSize) {
                        const chunk = dataBytes.slice(i, i + chunkSize);
                        await newConnection.characteristic.writeValue(chunk);
                        await new Promise(resolve => setTimeout(resolve, 50));
                    }
                    
                    showToast('🖨️ Ticket enviado (reconexión exitosa)', 'success');
                    return;
                }
            } catch (retryError) {
                console.error('❌ Error en reconexión:', retryError);
            }
            
            // ✅ FALLBACK: Mostrar vista previa
            const textoPreview = texto
                .replace(/\x1B/g, '').replace(/\x40/g, '')
                .replace(/\x61/g, '').replace(/\x45/g, '')
                .replace(/\x69/g, '').replace(/\x21/g, '');
            
            Swal.fire({
                title: '🧾 Ticket de Cocina',
                html: `
                    <div style="text-align:left;color:white;background:#0f172a;border-radius:12px;padding:16px;font-family:'Courier New',monospace;font-size:12px;max-height:400px;overflow-y:auto;white-space:pre-wrap;border:1px solid #2a3a5a;">
${textoPreview}
                    </div>
                    <div style="margin-top:12px;font-size:12px;color:#94a3b8;text-align:center;">
                        ⚠️ No se pudo conectar con la impresora.<br>
                        Impresora: <strong style="color:#f59e0b;">${nombreImpresora}</strong>
                    </div>
                `,
                confirmButtonText: '📄 Vista previa',
                showCancelButton: true,
                cancelButtonText: 'Cancelar',
                background: '#0f172a',
                color: 'white',
                confirmButtonColor: '#f59e0b',
                cancelButtonColor: '#334155',
                width: '92%'
            }).then((result) => {
                if (result.isConfirmed) {
                    window.imprimirComanda(pedidoId);
                }
            });
        }
        
    }).catch((error) => { 
        console.error('Error al obtener datos:', error); 
        showToast('❌ Error al imprimir', 'error'); 
    });
};

// ✅ FUNCIÓN MODIFICADA: Desvincular impresora (cierra conexión)
window.desvincularImpresora = function() {
    Swal.fire({
        title: '⚠️ Desvincular Impresora',
        text: '¿Seguro que quieres desvincular la impresora configurada?',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Sí, desvincular',
        cancelButtonText: 'Cancelar',
        background: '#0f172a',
        color: 'white',
        confirmButtonColor: '#ef4444',
        cancelButtonColor: '#334155'
    }).then(async (result) => {
        if (result.isConfirmed) {
            try {
                // ✅ DESCONECTAR BLUETOOTH
                if (impresoraConectada) {
                    try {
                        await impresoraConectada.server.disconnect();
                    } catch(e) {}
                    impresoraConectada = null;
                    impresoraCharacteristic = null;
                    impresoraDevice = null;
                }
                
                await db.ref(`restaurantes/${restauranteId}/impresora`).remove();
                impresoraConfigurada = false;
                nombreImpresora = '';
                window._impresoraDeviceId = null;
                
                localStorage.removeItem('impresora_nombre');
                localStorage.removeItem('impresora_id');
                
                const estadoEl = document.getElementById('estado-impresora');
                if (estadoEl) {
                    estadoEl.textContent = '⭕';
                    estadoEl.title = 'No hay impresora configurada';
                }
                
                showToast('🖨️ Impresora desvinculada', 'info');
            } catch (error) {
                console.error('Error al desvincular:', error);
                showToast('❌ Error al desvincular impresora', 'error');
            }
        }
    });
};

            function reproducirSonidoLlegada() {
                try {
                    const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
                    audio.volume = 0.9;
                    audio.play().catch(e => console.log('⚠️ Sonido bloqueado'));
                    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                } catch (error) { console.log('⚠️ Error al reproducir sonido:', error); }
            }

            function iniciarSonidoRepetido(pedidoId) {
                if (pedidoSonando === pedidoId || sonidoActivo) return;
                sonidoActivo = true;
                pedidoSonando = pedidoId;
                let repeticiones = 0;
                if (intervaloSonido) clearInterval(intervaloSonido);
                reproducirSonidoLlegada();
                intervaloSonido = setInterval(() => {
                    repeticiones++;
                    db.ref(`pedidos/${pedidoId}/estado`).once('value').then((snap) => {
                        const estado = snap.val() ? snap.val().toLowerCase() : '';
                        if (estado !== 'recibido' && estado !== 'pendiente') { detenerSonidoRepetido(); return; }
                    }).catch(() => {});
                    if (repeticiones >= 30) detenerSonidoRepetido();
                    else reproducirSonidoLlegada();
                }, 3000);
            }

            function detenerSonidoRepetido() {
                if (intervaloSonido) { clearInterval(intervaloSonido); intervaloSonido = null; }
                sonidoActivo = false;
                pedidoSonando = null;
            }

// 15b. CARGAR PEDIDOS ACTIVOS - CORREGIDO (SIN DUPLICADOS)
// ============================================
function cargarPedidosActivos() {
    console.log('📋 Cargando pedidos activos...');
    
    const colPendiente = document.getElementById('col-pendiente');
    const colCoccion = document.getElementById('col-coccion');
    
    if (!colPendiente || !colCoccion) {
        console.warn('⚠️ Columnas no encontradas, restaurando...');
        restaurarVistaColumnas();
        return;
    }
    
    // ✅ LIMPIAR COLUMNAS COMPLETAMENTE
    colPendiente.innerHTML = '';
    colCoccion.innerHTML = '';
    
    // ✅ MOSTRAR MENSAJE DE CARGA
    mostrarMensajeVacio('col-pendiente', '⏳', 'Cargando pedidos...');
    mostrarMensajeVacio('col-coccion', '⏳', 'Cargando pedidos...');
    
    db.ref('pedidos').once('value').then((snapshot) => {
        const pedidos = snapshot.val();
        let pendiente = 0, coccion = 0, demoras = 0;
        
        if (!pedidos) {
            console.log('📭 No hay pedidos');
            mostrarMensajeVacio('col-pendiente', '📥', 'No hay pedidos en entrada');
            mostrarMensajeVacio('col-coccion', '👨‍🍳', 'No hay pedidos en cocción');
            actualizarContadores(0, 0, 0);
            return;
        }
        
        // ✅ LIMPIAR COLUMNAS NUEVAMENTE (por si hay algún residuo)
        colPendiente.innerHTML = '';
        colCoccion.innerHTML = '';
        
        const idsProcesados = new Set();
        let pedidosPendientes = [];
        let pedidosCoccion = [];
        
        // ✅ PRIMERO: RECOLECTAR TODOS LOS PEDIDOS
        for (const [id, data] of Object.entries(pedidos)) {
            const restId = data.restauranteId || data.restaurante_id || data.uid_restaurante;
            if (restId !== restauranteId) continue;
            
            if (idsProcesados.has(id)) {
                console.warn(`⚠️ Pedido duplicado detectado: ${id}, saltando...`);
                continue;
            }
            idsProcesados.add(id);
            
            let estado = data.estado ? data.estado.toLowerCase() : '';
            if (estado === 'recibido') estado = 'pendiente';
            
            if (estado === 'pendiente') {
                pendiente++;
                pedidosPendientes.push({ id, data: { ...data, estado } });
            } else if (estado === 'coccion') {
                coccion++;
                const demora = data.demora || data.tiempo_demora || 0;
                if (demora > 0) demoras++;
                pedidosCoccion.push({ id, data: { ...data, estado } });
            }
        }
        
        console.log(`📊 Pedidos: ${pendiente} entrada, ${coccion} cocción (IDs únicos: ${idsProcesados.size})`);
        
        // ✅ SEGUNDO: RENDERIZAR PEDIDOS PENDIENTES
        if (pedidosPendientes.length === 0) {
            mostrarMensajeVacio('col-pendiente', '📥', 'No hay pedidos en entrada');
        } else {
            for (const item of pedidosPendientes) {
                agregarPedidoAColumna(item.id, item.data);
            }
        }
        
        // ✅ TERCERO: RENDERIZAR PEDIDOS EN COCCIÓN
        if (pedidosCoccion.length === 0) {
            mostrarMensajeVacio('col-coccion', '👨‍🍳', 'No hay pedidos en cocción');
        } else {
            for (const item of pedidosCoccion) {
                agregarPedidoAColumna(item.id, item.data);
            }
        }
        
        actualizarContadores(pendiente, coccion, demoras);
        
    }).catch((error) => {
        console.error('❌ Error al cargar pedidos:', error);
        mostrarMensajeVacio('col-pendiente', '❌', 'Error al cargar');
        mostrarMensajeVacio('col-coccion', '❌', 'Error al cargar');
    });
}

// 16. AGREGAR PEDIDO A COLUMNA - CORREGIDO (CON VERIFICACIÓN DE DUPLICADOS)
// ============================================
function agregarPedidoAColumna(id, data) {
    let estado = data.estado || 'pendiente';
    if (estado === 'recibido') estado = 'pendiente';
    
    let columnaId = estado === 'pendiente' ? 'col-pendiente' : 'col-coccion';
    const container = document.getElementById(columnaId);
    if (!container) {
        console.warn(`⚠️ Columna ${columnaId} no encontrada`);
        return;
    }

    // ✅ VERIFICAR SI LA TARJETA YA EXISTE (EVITAR DUPLICADOS)
    const idPedido = data.id_pedido || data.id || id.substring(0, 8);
    const tarjetasExistentes = container.querySelectorAll('.order-card');
    for (const tarjeta of tarjetasExistentes) {
        const idElement = tarjeta.querySelector('.id');
        if (idElement) {
            const idTexto = idElement.textContent.replace('#', '');
            if (idTexto === idPedido) {
                console.warn(`⚠️ Tarjeta duplicada detectada: #${idPedido}, omitiendo...`);
                return; // ✅ NO AGREGAR DUPLICADOS
            }
        }
    }

    const clienteNombre = data.cliente_nombre || data.clienteNombre || 'Cliente';
    const telefono = data.cliente_telefono || data.telefono || 'Sin teléfono';
    const direccion = data.direccion || 'Sin dirección';
    const total = data.total || 0;
    const timestamp = data.timestamp ? new Date(data.timestamp).toLocaleTimeString() : '';

    const tiempoInicio = data.timestamp_inicio || data.timestamp || Date.now();
    const tiempoActual = Date.now();
    const tiempoTranscurrido = Math.floor((tiempoActual - tiempoInicio) / 60000);
    const tiempoLimite = data.tiempo_limite || tiempoElaboracionRestaurante || TIEMPO_ELABORACION_DEFAULT;
    const tiempoRestante = Math.max(0, tiempoLimite - tiempoTranscurrido);
    const enDemora = tiempoTranscurrido > tiempoLimite;

    let tiempoDisplay = '', badgeDemora = '';
    let idClass = estado === 'pendiente' ? 'pendiente' : 'coccion';
    
    if (estado === 'pendiente') {
        tiempoDisplay = '⏳ Esperando';
    } else if (estado === 'coccion') {
        if (enDemora) {
            tiempoDisplay = `⏱️ ${tiempoTranscurrido} min DEMORA`;
            badgeDemora = `<span style="background:var(--accent-red);color:white;padding:1px 4px;border-radius:9999px;font-size:7px;font-weight:700;">🔴</span>`;
        } else {
            tiempoDisplay = `⏱️ ${tiempoTranscurrido} min (${tiempoRestante})`;
        }
    }

    let productosHtml = '';
    if (data.items && data.items.length > 0) {
        productosHtml = data.items.slice(0, 3).map(item => 
            `<span>${item.cantidad || 1}x ${item.nombre}</span>`
        ).join('');
        if (data.items.length > 3) {
            productosHtml += `<span style="font-size:0.4rem;color:var(--text-muted);">+${data.items.length-3}</span>`;
        }
    } else {
        productosHtml = '<span>Sin productos</span>';
    }

    let botones = '';
    if (estado === 'pendiente') {
        botones = `
            <button class="btn btn-success" onclick="aceptarPedido('${id}')">✅ Aceptar</button>
            <button class="btn btn-danger" onclick="rechazarPedido('${id}')">❌ Rechazar</button>
        `;
    } else if (estado === 'coccion') {
        botones = `
            <button class="btn btn-success" onclick="marcarListo('${id}')">✅ Listo</button>
            <button class="btn btn-secondary" onclick="verDetallePedido('${id}')">📋</button>
            <button class="btn btn-primary" onclick="imprimirComandaConImpresora('${id}')">🖨️</button>
        `;
    }

    const card = document.createElement('div');
    card.className = `order-card${enDemora && estado === 'coccion' ? ' delayed' : ''}`;
    card.innerHTML = `
        <div class="top">
            <span class="id ${idClass}">#${idPedido}</span>
            <span class="time">${timestamp}</span>
        </div>
        <div class="cliente">${escapeHTML(clienteNombre)}</div>
        <div class="direccion">${escapeHTML(direccion)}</div>
        <div class="telefono">📞 ${escapeHTML(telefono)}</div>
        <div class="timer">
            <span class="label">${estado === 'coccion' ? '⏱️' : '📌'}</span>
            <span class="value${enDemora && estado === 'coccion' ? ' delayed' : ''}">${tiempoDisplay}</span>
            ${badgeDemora}
        </div>
        <div class="productos">${productosHtml}</div>
        <div class="footer">
            <span class="precio">$${total.toFixed(2)}</span>
            <span class="badge-estado ${estado}">${estado === 'pendiente' ? 'Pendiente' : 'Cocción'}</span>
        </div>
        <div class="actions">${botones}</div>
    `;
    container.appendChild(card);
}

            async function verificarEstadoRestaurante() {
                try {
                    const snapshot = await db.ref(`restaurantes/${restauranteId}`).once('value');
                    const data = snapshot.val();
                    
                    if (!data) {
                        return { abierto: false, motivo: 'Restaurante no encontrado', horario: '' };
                    }
                    
                    if (data.activo === false) {
                        return { abierto: false, motivo: '🚫 Desactivado', horario: '' };
                    }
                    
                    if (data.pausado === true) {
                        return { abierto: false, motivo: '⏸️ En pausa', horario: '' };
                    }
                    
                    const horarios = data.horarios_dias;
                    if (!horarios) {
                        return { abierto: false, motivo: '📅 Sin horarios', horario: '' };
                    }
                    
                    const ahora = new Date();
                    const diasSemana = ['DOMINGO', 'LUNES', 'MARTES', 'MIERCOLES', 'JUEVES', 'VIERNES', 'SABADO'];
                    const hoy = diasSemana[ahora.getDay()];
                    const horarioHoy = horarios[hoy];
                    
                    if (!horarioHoy || horarioHoy.dia_libre === true || horarioHoy.activo === false) {
                        return { abierto: false, motivo: '📅 Cerrado hoy', horario: '' };
                    }
                    
                    const horaActual = ahora.getHours() + ahora.getMinutes() / 60;
                    
                    function conv(h) {
                        if (!h || h === 'CERRADO') return null;
                        const [hh, mm] = h.split(':');
                        return parseInt(hh) + parseInt(mm) / 60;
                    }
                    
                    const a1 = conv(horarioHoy.apertura1);
                    const c1 = conv(horarioHoy.cierre1);
                    const a2 = conv(horarioHoy.apertura2);
                    const c2 = conv(horarioHoy.cierre2);
                    
                    let abierto = false;
                    let horarioTexto = '';
                    
                    if (a1 !== null && c1 !== null) {
                        if (horaActual >= a1 && horaActual < c1) abierto = true;
                        horarioTexto = `${horarioHoy.apertura1}-${horarioHoy.cierre1}`;
                    }
                    
                    if (a2 !== null && c2 !== null) {
                        if (horaActual >= a2 && horaActual < c2) abierto = true;
                        if (horarioTexto) horarioTexto += ` / `;
                        horarioTexto += `${horarioHoy.apertura2}-${horarioHoy.cierre2}`;
                    }
                    
                    if (!horarioTexto) {
                        return { abierto: false, motivo: '📅 Sin horario', horario: '' };
                    }
                    
                    return {
                        abierto: abierto,
                        motivo: abierto ? `✅ Abierto` : `🔴 Cerrado`,
                        horario: horarioTexto
                    };
                    
                } catch (error) {
                    console.error('❌ Error verificando estado:', error);
                    return { abierto: false, motivo: '❌ Error', horario: '' };
                }
            }

            // ============================================
            window.notificarRepartidor = async function(pedidoId) {
                console.log('📤 Notificando repartidor para pedido:', pedidoId);
                
                try {
                    const pedidoSnap = await db.ref(`pedidos/${pedidoId}`).once('value');
                    const pedido = pedidoSnap.val();
                    
                    if (!pedido) {
                        console.error('❌ Pedido no encontrado');
                        return;
                    }

                    const repartidoresSnap = await db.ref('repartidores')
                        .orderByChild('activo')
                        .equalTo(true)
                        .once('value');
                    
                    const repartidores = repartidoresSnap.val();
                    
                    if (!repartidores) {
                        console.warn('⚠️ No hay repartidores disponibles');
                        return;
                    }

                    let repartidorId = null;
                    let repartidorData = null;
                    let menorCarga = Infinity;
                    
                    for (const [uid, data] of Object.entries(repartidores)) {
                        const pedidosActivosSnap = await db.ref('pedidos')
                            .orderByChild('uid_repartidor')
                            .equalTo(uid)
                            .once('value');
                        
                        const pedidosActivos = pedidosActivosSnap.val();
                        let carga = 0;
                        
                        if (pedidosActivos) {
                            for (const [pid, pData] of Object.entries(pedidosActivos)) {
                                const estado = pData.estado ? pData.estado.toUpperCase() : '';
                                if (estado !== 'ENTREGADO' && estado !== 'CANCELADO_POR_AUSENCIA') {
                                    carga++;
                                }
                            }
                        }
                        
                        if (carga < menorCarga) {
                            menorCarga = carga;
                            repartidorId = uid;
                            repartidorData = data;
                        }
                    }
                    
                    if (!repartidorId) {
                        console.warn('⚠️ No se pudo seleccionar un repartidor');
                        return;
                    }
                    
                    console.log(`✅ Repartidor seleccionado: ${repartidorData.nombre || repartidorId}`);

                    await db.ref(`pedidos/${pedidoId}/uid_repartidor`).set(repartidorId);
                    await db.ref(`pedidos/${pedidoId}/repartidor_nombre`).set(repartidorData.nombre || 'Repartidor');
                    await db.ref(`pedidos/${pedidoId}/timestamp_asignacion`).set(Date.now());
                    await db.ref(`pedidos/${pedidoId}/historial`).push({
                        estado: 'coccion',
                        timestamp: Date.now(),
                        usuario: currentUser.uid,
                        accion: 'asignar_repartidor',
                        repartidor: repartidorId,
                        repartidor_nombre: repartidorData.nombre || 'Repartidor'
                    });

                    const token = repartidorData.token;
                    
                    if (!token) {
                        console.warn('⚠️ Repartidor sin token FCM');
                        showToast('⚠️ El repartidor no tiene notificaciones activas', 'warning');
                        return;
                    }
                    
                    const titulo = '🛵 Nuevo pedido disponible';
                    const mensaje = `Recoge el pedido de ${pedido.cliente_nombre || 'cliente'}`;
                    
                    try {
                        const enviarNotificacion = functions.httpsCallable('enviarNotificationPedido');
                        
                        const result = await enviarNotificacion({
                            token: token,
                            titulo: titulo,
                            mensaje: mensaje,
                            data: { 
                                tipo: 'pedido', 
                                uid: repartidorId,
                                pedidoId: pedidoId
                            }
                        });
                        
                        console.log('✅ Notificación push enviada:', result.data);
                        showToast(`✅ Repartidor asignado: ${repartidorData.nombre || 'Repartidor'}`, 'success');
                        
                    } catch (error) {
                        console.error('❌ Error al enviar notificación:', error);
                        showToast('⚠️ Repartidor asignado pero notificación falló', 'warning');
                    }
                    
                } catch (error) {
                    console.error('❌ Error en notificarRepartidor:', error);
                }
            };
