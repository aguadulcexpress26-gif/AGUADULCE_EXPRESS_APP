<script>
const scriptURL = 'https://script.google.com/macros/s/AKfycbzmIW4rvilG6rCN7NbT-sQw-VniY0PDyi7wxQuBYbmDXOGbMup8J4tMEu99uqwzMHuq/exec';

let db = { menu: [], restaurantes: [], config: {}, anuncios: [], legal: "" };
let cesta = [];
let rActivo = { id: null, nombre: "", foto: "" };

let itemActual = { 
    pBase: 0, 
    pOpciones: 0, 
    pExtras: 0, 
    cantidad: 1, 
    obligatorioOk: false, 
    data: null 
};

let fondoOriginal = "";

/* ================= INIT ================= */
async function init() {
    try {
        const res = await fetch(scriptURL);
        const data = await res.json();

        db.restaurantes = data.RESTAURANTES.filter(r => r.NOMBRE_RESTAURANTE && r.NOMBRE_RESTAURANTE !== "ADMIN");
        db.menu = data.MENU_GENERAL;
        db.anuncios = data.ANUNCIOS || [];
        db.legal = data.LEGAL?.[0]?.TEXTO || "";

        if (db.anuncios.length > 0)
            document.getElementById('texto-anuncio').innerText = db.anuncios.map(a => a.TEXTO).join(" • ");

        if (data.CONFIG?.[0]) {
            document.getElementById('app-logo').src = data.CONFIG[0].LOGO_URL;
            document.getElementById('header-bg').style.backgroundImage = `url('${data.CONFIG[0].FONDO_URL}')`;
            fondoOriginal = data.CONFIG[0].FONDO_URL;
        }

        document.getElementById('loader').style.display = 'none';

        if(localStorage.getItem('ae_pedido_id')) renderSeguimiento();

        renderHome();

    } catch (e) { console.error(e); }
}

/* ================= CANTIDAD ================= */
function cambiarCantPlato(delta) {
    itemActual.cantidad += delta;
    if (itemActual.cantidad < 1) itemActual.cantidad = 1;

    document.getElementById('cant-plato-modal').innerText = itemActual.cantidad;
    actualizarBarraModal();
}

/* ================= AÑADIR ================= */
function confirmarAnadir() {
    try {
        let sel = [];

        document.querySelectorAll('.grid-option.selected').forEach(el => {
            let texto = el.innerText.split('+')[0].trim();
            if (texto) sel.push(texto);
        });

        document.querySelectorAll('.qty').forEach(el => {
            const cant = parseInt(el.innerText) || 0;
            if (cant > 0) {
                const nombreExtra = el.dataset.nombre || "Extra";
                sel.push(`${cant}x ${nombreExtra}`);
            }
        });

        const detalle = sel.length ? ` [${sel.join(', ')}]` : "";
        const nombreBase = `${itemActual.data.PLATO}${detalle}`;
        const precioUnitario = itemActual.pBase + itemActual.pOpciones + itemActual.pExtras;

        let existente = cesta.find(i => i.base === nombreBase);

        if (existente) {
            existente.cantidad += itemActual.cantidad;
            existente.total += precioUnitario * itemActual.cantidad;
        } else {
            cesta.push({
                base: nombreBase,
                cantidad: itemActual.cantidad,
                total: precioUnitario * itemActual.cantidad
            });
        }

        actualizarCestaBar();
        cerrarModal();

    } catch (e) {
        alert("Error al añadir");
    }
}

/* ================= CESTA ================= */
function actualizarCestaBar() {
    const total = cesta.reduce((acc, i) => acc + i.total, 0);

    document.getElementById('cesta-flotante')
        .classList.toggle('hidden', cesta.length === 0);

    document.getElementById('cesta-info')
        .innerText = `${cesta.length} PRODUCTOS`;

    document.getElementById('cesta-total')
        .innerText = `${total.toFixed(2)}€ TOTAL`;
}

/* ================= MODAL PRECIO ================= */
function actualizarBarraModal() {
    const total = (itemActual.pBase + itemActual.pOpciones + itemActual.pExtras) * itemActual.cantidad;

    document.getElementById('total-modal-btn').innerText = total.toFixed(2) + "€";

    const btn = document.getElementById('btn-anadir-modal');
    btn.disabled = !itemActual.obligatorioOk;
    btn.style.opacity = itemActual.obligatorioOk ? "1" : "0.3";
}

/* ================= ELIMINAR ================= */
function eliminarItem(i) {
    cesta.splice(i, 1);
    actualizarCestaBar();
    if(cesta.length === 0)
        document.getElementById('panel-revision').style.display = 'none';
}

/* ================= CHECKOUT ================= */
function abrirCheckout() {
    document.getElementById('panel-revision').style.display = 'none';
    document.getElementById('panel-checkout').style.display = 'flex';

    const subtotal = cesta.reduce((acc, i) => acc + i.total, 0);

    document.getElementById('desglose-pago').innerHTML = `
        <div class="flex justify-between"><span>Subtotal</span><span>${subtotal.toFixed(2)}€</span></div>
        <div class="flex justify-between"><span>Envío</span><span>2.50€</span></div>
        <div class="flex justify-between font-black text-cyan-400 text-lg">
            <span>Total</span>
            <span>${(subtotal + 2.5 + 1).toFixed(2)}€</span>
        </div>`;
}

/* ================= ENVÍO ================= */
async function enviarPedidoFinal() {
    const nom = document.getElementById('cliente-nombre').value;
    const tel = document.getElementById('cliente-telf').value;
    const dir = document.getElementById('cliente-dir').value;

    if(!nom || !dir || tel.length < 9)
        return alert("Completa datos");

    const pedido = {
        cliente_info: nom,
        telf_info: tel,
        dir_info: dir,
        pedido_info: cesta.map(i => `${i.cantidad}x ${i.base}`).join(" | "),
        total_info: cesta.reduce((a,b)=>a+b.total,0).toFixed(2)+"€",
        pago_info: document.getElementById('metodo-pago').value,
        id_res_info: rActivo.id
    };

    try {
        await fetch(scriptURL, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify(pedido)
        });

        cesta = [];
        actualizarCestaBar();
        cerrarCheckout();
        renderSeguimiento();

    } catch (e) {
        alert("Error envío");
    }
}

/* ================= UTIL ================= */
function cerrarModal() {
    document.getElementById('modal-plato').style.display = 'none';
}
function cerrarCheckout() {
    document.getElementById('panel-checkout').style.display = 'none';
}

/* ================= START ================= */
init();
</script>
