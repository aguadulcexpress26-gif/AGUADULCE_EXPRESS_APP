<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Fashion Studio Pro - Diseñador de Moda</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #0a0a0f;
      --panel-bg: #14141a;
      --panel-border: #2a2a35;
      --accent-gold: #d4af37;
      --accent-gold-dark: #aa820a;
      --text-main: #f0f0f5;
      --text-muted: #8e8e9e;
      --hover-bg: rgba(212, 175, 55, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ===== HEADER ===== */
    header {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--panel-border);
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 100;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.5px;
    }

    .brand .logo-icon {
      color: var(--accent-gold);
      font-size: 1.4rem;
    }

    .brand span {
      color: var(--accent-gold);
      font-weight: 300;
      font-size: 0.7rem;
      opacity: 0.8;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .header-btn {
      background: transparent;
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      width: 36px;
      height: 36px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 0.9rem;
    }

    .header-btn:hover {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
      background: var(--hover-bg);
    }

    .header-btn.danger:hover {
      border-color: #e74c3c;
      color: #e74c3c;
      background: rgba(231, 76, 60, 0.1);
    }

    .header-btn.primary {
      background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-dark));
      color: #000;
      border: none;
      font-weight: 700;
      font-size: 0.7rem;
      padding: 0 16px;
      width: auto;
      gap: 6px;
    }

    .header-btn.primary:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
    }

    /* ===== MENU HAMBURGUESA ===== */
    .hamburger-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 8px;
      display: none;
      transition: all 0.3s;
    }

    .hamburger-btn:hover {
      color: var(--accent-gold);
    }

    /* ===== SIDEBAR FLOTANTE ===== */
    .floating-sidebar {
      position: fixed;
      left: 0;
      top: 56px;
      bottom: 0;
      width: 340px;
      background: var(--panel-bg);
      border-right: 1px solid var(--panel-border);
      z-index: 90;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .floating-sidebar.open {
      transform: translateX(0);
    }

    .sidebar-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      background: var(--panel-bg);
    }

    .sidebar-header h3 {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .sidebar-header .close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 8px;
      transition: all 0.3s;
    }

    .sidebar-header .close-btn:hover {
      color: var(--accent-gold);
    }

    .sidebar-tabs {
      display: flex;
      border-bottom: 1px solid var(--panel-border);
      background: #0d0d12;
      flex-shrink: 0;
      overflow-x: auto;
    }

    .sidebar-tab {
      padding: 10px 16px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.65rem;
      font-weight: 700;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.3s;
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .sidebar-tab.active {
      color: var(--accent-gold);
      border-bottom-color: var(--accent-gold);
    }

    .sidebar-tab:hover {
      color: var(--text-main);
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .sidebar-panel {
      display: none;
    }

    .sidebar-panel.active {
      display: block;
    }

    /* ===== WORKSPACE ===== */
    .workspace {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    .canvas-viewport {
      flex: 1;
      background: #0a0a0f;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      touch-action: none;
    }

    .canvas-card {
      background: #ffffff;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
      border-radius: 4px;
      position: relative;
      touch-action: none;
    }

    /* ===== TOOLS SIDEBAR ===== */
    .tools-sidebar {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(20, 20, 26, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      padding: 12px 8px;
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 20;
      align-items: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }

    .tool-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      position: relative;
    }

    .tool-btn:hover {
      color: var(--text-main);
      background: rgba(255,255,255,0.05);
    }

    .tool-btn.active {
      color: #000;
      background: var(--accent-gold);
    }

    .tool-btn .tooltip {
      position: absolute;
      left: 52px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.9);
      color: #fff;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 0.65rem;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s;
    }

    .tool-btn:hover .tooltip {
      opacity: 1;
    }

    .tools-divider {
      width: 24px;
      height: 1px;
      background: var(--panel-border);
      margin: 2px 0;
    }

    .zoom-display {
      font-size: 0.6rem;
      color: var(--accent-gold);
      font-weight: 700;
      text-align: center;
      line-height: 1.2;
    }

    /* ===== REFERENCE BOX ===== */
    .reference-box {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 180px;
      height: 210px;
      background: rgba(20, 20, 26, 0.95);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      z-index: 25;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      cursor: grab;
      transition: border-color 0.3s;
      touch-action: none;
      backdrop-filter: blur(12px);
    }

    .reference-box:hover {
      border-color: var(--accent-gold);
    }

    .reference-box:active {
      cursor: grabbing;
    }

    .reference-box .ref-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      flex-shrink: 0;
      font-size: 0.6rem;
      font-weight: 700;
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .reference-box .ref-header .ref-actions {
      display: flex;
      gap: 6px;
    }

    .reference-box .ref-header .ref-actions i {
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      transition: all 0.3s;
      font-size: 0.8rem;
    }

    .reference-box .ref-header .ref-actions i:hover {
      background: var(--hover-bg);
    }

    .reference-box .ref-body {
      flex: 1;
      background: #0d0d12;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      min-height: 0;
    }

    .reference-box .ref-body img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .reference-box .ref-body .placeholder {
      font-size: 0.6rem;
      color: var(--text-muted);
      text-align: center;
      padding: 10px;
    }

    .reference-box .ref-body .placeholder i {
      font-size: 1.5rem;
      display: block;
      margin-bottom: 6px;
    }

    /* ===== RESIZE HANDLE ===== */
    .resize-handle {
      position: absolute;
      bottom: -3px;
      right: -3px;
      width: 16px;
      height: 16px;
      cursor: nwse-resize;
      background: var(--accent-gold);
      border-radius: 50%;
      opacity: 0.5;
      transition: opacity 0.3s;
    }

    .resize-handle:hover {
      opacity: 1;
    }

    /* ===== COLOR PICKER MEJORADO ===== */
    .color-picker-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }

    .color-swatch {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 6px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
    }

    .color-swatch:hover {
      transform: scale(1.1);
    }

    .color-swatch.active {
      border-color: #fff;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
    }

    .color-hex-input {
      width: 100%;
      padding: 8px 12px;
      background: #0d0d12;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.8rem;
      font-family: monospace;
      text-transform: uppercase;
    }

    .color-hex-input:focus {
      outline: none;
      border-color: var(--accent-gold);
    }

    .color-slider {
      width: 100%;
      height: 8px;
      border-radius: 4px;
      background: linear-gradient(to right, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
      margin: 8px 0;
    }

    .color-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: white;
      border: 2px solid var(--accent-gold);
      cursor: pointer;
    }

    /* ===== FIGURINES ===== */
    .figurine-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .figurine-card {
      background: #0d0d12;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
    }

    .figurine-card:hover {
      border-color: var(--accent-gold);
      transform: translateY(-2px);
    }

    .figurine-card .preview {
      width: 100%;
      height: 100px;
      background: #1a1a24;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      color: var(--text-muted);
    }

    .figurine-card .preview img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .figurine-card span {
      display: block;
      font-size: 0.65rem;
      margin-top: 6px;
      color: var(--text-muted);
    }

    /* ===== SCROLLBAR ===== */
    .sidebar-content::-webkit-scrollbar {
      width: 4px;
    }

    .sidebar-content::-webkit-scrollbar-track {
      background: transparent;
    }

    .sidebar-content::-webkit-scrollbar-thumb {
      background: var(--panel-border);
      border-radius: 2px;
    }

    .sidebar-content::-webkit-scrollbar-thumb:hover {
      background: var(--accent-gold);
    }

    /* ===== OVERLAY ===== */
    .sidebar-overlay {
      position: fixed;
      top: 56px;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 85;
      display: none;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .sidebar-overlay.show {
      display: block;
      opacity: 1;
    }

    /* ===== TOAST ===== */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 20, 26, 0.95);
      color: var(--text-main);
      padding: 12px 24px;
      border-radius: 8px;
      border: 1px solid var(--accent-gold);
      z-index: 1000;
      display: none;
      font-size: 0.85rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      max-width: 90%;
      text-align: center;
    }

    .toast.show {
      display: block;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateX(-50%) translateY(20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .hamburger-btn {
        display: block;
      }

      .floating-sidebar {
        width: 100%;
        max-width: 400px;
      }

      .tools-sidebar {
        left: 8px;
        padding: 8px 4px;
        gap: 6px;
      }

      .tool-btn {
        width: 32px;
        height: 32px;
        font-size: 0.9rem;
      }

      .tool-btn .tooltip {
        display: none;
      }

      .reference-box {
        width: 140px;
        height: 160px;
        bottom: 10px;
        right: 10px;
      }

      .header-actions .header-btn span {
        display: none;
      }

      .brand .subtitle {
        display: none;
      }
    }

    @media (max-width: 480px) {
      .reference-box {
        display: none;
      }

      .tools-sidebar {
        left: 4px;
        padding: 6px 3px;
        gap: 4px;
        border-radius: 20px;
      }

      .tool-btn {
        width: 28px;
        height: 28px;
        font-size: 0.75rem;
      }

      .zoom-display {
        font-size: 0.5rem;
      }
    }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 24px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-header h3 {
      font-size: 1.1rem;
    }

    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 8px;
    }

    .modal-close:hover {
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header>
    <div class="brand">
      <button class="hamburger-btn" onclick="toggleSidebar()">
        <i class="fa-solid fa-bars"></i>
      </button>
      <i class="fa-solid fa-wand-magic-sparkles logo-icon"></i>
      <span>Fashion Studio</span>
      <span class="subtitle">Pro</span>
    </div>
    <div class="header-actions">
      <button class="header-btn" onclick="undoAction()" title="Deshacer (Ctrl+Z)">
        <i class="fa-solid fa-rotate-left"></i>
      </button>
      <button class="header-btn" onclick="redoAction()" title="Rehacer (Ctrl+Y)">
        <i class="fa-solid fa-rotate-right"></i>
      </button>
      <button class="header-btn danger" onclick="deleteSelected()" title="Eliminar Selección (Delete)">
        <i class="fa-solid fa-trash-can"></i>
      </button>
      <button class="header-btn" onclick="clearCanvas()" title="Limpiar Lienzo">
        <i class="fa-solid fa-broom"></i>
      </button>
      <button class="header-btn primary" onclick="saveProject(false)">
        <i class="fa-solid fa-floppy-disk"></i> <span>Guardar</span>
      </button>
      <button class="header-btn primary" onclick="saveProject(true)">
        <i class="fa-solid fa-check"></i> <span>Finalizar</span>
      </button>
    </div>
  </header>

  <!-- ===== OVERLAY ===== -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <!-- ===== FLOATING SIDEBAR ===== -->
  <div class="floating-sidebar" id="sidebar">
    <div class="sidebar-header">
      <h3><i class="fa-regular fa-compass" style="color: var(--accent-gold);"></i> Panel de Control</h3>
      <button class="close-btn" onclick="closeSidebar()"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="sidebar-tabs">
      <button class="sidebar-tab active" onclick="switchSidebarTab('figurines')">Figurines</button>
      <button class="sidebar-tab" onclick="switchSidebarTab('colors')">Colores</button>
      <button class="sidebar-tab" onclick="switchSidebarTab('fabrics')">Telas</button>
      <button class="sidebar-tab" onclick="switchSidebarTab('accessories')">Accesorios</button>
      <button class="sidebar-tab" onclick="switchSidebarTab('layers')">Capas</button>
      <button class="sidebar-tab" onclick="switchSidebarTab('projects')">Proyectos</button>
    </div>

    <div class="sidebar-content">
      <!-- ===== FIGURINES ===== -->
      <div class="sidebar-panel active" id="panel-figurines">
        <div style="margin-bottom: 12px;">
          <div class="upload-box" onclick="document.getElementById('custom-figurine-input').click()" style="padding:10px; text-align:center; border:2px dashed var(--accent-gold); border-radius:8px; cursor:pointer;">
            <i class="fa-solid fa-cloud-arrow-up" style="color:var(--accent-gold); font-size:1.2rem;"></i>
            <p style="font-size:0.7rem; margin-top:4px;">Cargar Figurín</p>
            <input type="file" id="custom-figurine-input" accept="image/*" style="display:none" onchange="uploadCustomFigurine(event)">
          </div>
        </div>

        <div style="font-size:0.65rem; font-weight:700; text-transform:uppercase; color:var(--text-muted); margin-bottom:10px;">
          Figurines Profesionales
        </div>
        <div class="figurine-grid" id="figurine-list">
          <!-- Generado por JS -->
        </div>
      </div>

      <!-- ===== COLORES ===== -->
      <div class="sidebar-panel" id="panel-colors">
        <div style="font-size:0.65rem; font-weight:700; text-transform:uppercase; color:var(--text-muted); margin-bottom:10px;">
          Paleta de Colores
        </div>
        <div class="color-picker-grid" id="colorPalette">
          <!-- Generado por JS -->
        </div>
        
        <input type="range" class="color-slider" min="0" max="360" value="0" id="hueSlider" oninput="updateColorFromHue(this.value)">
        
        <div style="display:flex; gap:8px; margin-top:8px; align-items:center;">
          <div id="colorPreview" style="width:40px; height:40px; border-radius:6px; border:1px solid var(--panel-border); flex-shrink:0; background:#ff0000;"></div>
          <input type="text" class="color-hex-input" id="hexInput" value="#FF0000" onchange="updateColorFromHex(this.value)">
        </div>

        <div style="margin-top:12px;">
          <div style="font-size:0.6rem; color:var(--text-muted);">Grosor del Pincel</div>
          <input type="range" id="brush-size" min="1" max="50" value="4" oninput="updateBrushSize(this.value)" style="width:100%; accent-color:var(--accent-gold);">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
            <span style="font-size:0.6rem; color:var(--text-muted);">1px</span>
            <span id="brush-size-val" style="font-size:0.7rem; font-weight:bold; color:var(--accent-gold);">4px</span>
            <span style="font-size:0.6rem; color:var(--text-muted);">50px</span>
          </div>
        </div>

        <div style="margin-top:12px;">
          <div style="font-size:0.6rem; color:var(--text-muted); margin-bottom:4px;">Tipo de Pincel</div>
          <select class="brush-select" id="brush-type" onchange="changeBrushType(this.value)">
            <option value="pencil">✏️ Lápiz</option>
            <option value="ink">🖊️ Tinta</option>
            <option value="marker">🖍️ Marcador</option>
            <option value="spray">💨 Aerógrafo</option>
          </select>
        </div>
      </div>

      <!-- ===== TELAS ===== -->
      <div class="sidebar-panel" id="panel-fabrics">

  <!-- ===== TOAST ===== -->
  <div class="toast" id="toast"></div>

  <script>
    // =============================================
    // CONFIGURACIÓN INICIAL
    // =============================================
    const canvas = new fabric.Canvas('mainCanvas', {
      isDrawingMode: true,
      backgroundColor: '#ffffff',
      selection: true,
      renderOnAddRemove: true
    });

    let currentZoom = 1;
    let currentMode = 'draw';
    let currentColor = '#ff0000';
    let selectedPattern = null;
    let activeLayerId = 1;
    let isPanning = false;
    let lastPanX, lastPanY;
    let history = [];
    let historyIndex = -1;
    const MAX_HISTORY = 50;

    let layers = [
      { id: 0, name: 'Base: Figurín', opacity: 0.5, visible: true },
      { id: 1, name: 'Capa 1: Prenda', opacity: 1.0, visible: true }
    ];

    // =============================================
    // COLORES PREDEFINIDOS - PALETA MEJORADA
    // =============================================
    const colorPalette = [
      '#000000', '#434343', '#666666', '#999999', '#b7b7b7', '#cccccc', '#e6e6e6',
      '#ff0000', '#e63946', '#ff6b6b', '#ff9f9f', '#ffc3c3', '#ffe0e0', '#fff0f0',
      '#ff6b00', '#e67e22', '#f39c12', '#f1c40f', '#f9e79f', '#fdebd0', '#fff5e6',
      '#00ff00', '#2ecc71', '#58d68d', '#82e0aa', '#a9dfbf', '#d5f5e3', '#eafaf1',
      '#0000ff', '#3498db', '#5dade2', '#85c1e9', '#aed6f1', '#d6eaf8', '#ebf5fb',
      '#8b00ff', '#9b59b6', '#af7ac5', '#c39bd3', '#d7bde2', '#ebdef0', '#f4ecf7',
      '#ff00ff', '#e84393', '#f06292', '#f48fb1', '#f8bbd0', '#fce4ec', '#fbe9f2'
    ];

    // =============================================
    // FIGURINES PROFESIONALES (VOGUE STYLE)
    // =============================================
    const figurines = [
      { name: 'Frontal 1', icon: 'fa-solid fa-person-dress', pose: 'frontal1' },
      { name: 'Frontal 2', icon: 'fa-solid fa-person-dress', pose: 'frontal2' },
      { name: 'Perfil 1', icon: 'fa-solid fa-person', pose: 'profile1' },
      { name: 'Perfil 2', icon: 'fa-solid fa-person', pose: 'profile2' },
      { name: 'Dinámico 1', icon: 'fa-solid fa-person-walking', pose: 'dynamic1' },
      { name: 'Dinámico 2', icon: 'fa-solid fa-person-running', pose: 'dynamic2' },
      { name: 'Sentado 1', icon: 'fa-solid fa-person-seat', pose: 'sitting1' },
      { name: 'Sentado 2', icon: 'fa-solid fa-person-seat', pose: 'sitting2' },
      { name: 'Alta Costura', icon: 'fa-solid fa-crown', pose: 'haute1' },
      { name: 'Pasarela', icon: 'fa-solid fa-wand-magic-sparkles', pose: 'runway1' }
    ];

    // =============================================
    // ACCESORIOS
    // =============================================
    const accessories = [
      { name: 'Sombrero', icon: 'fa-solid fa-hat-wizard', type: 'hat' },
      { name: 'Gafas', icon: 'fa-solid fa-glasses', type: 'glasses' },
      { name: 'Bufanda', icon: 'fa-solid fa-mitten', type: 'scarf' },
      { name: 'Collar', icon: 'fa-solid fa-gem', type: 'necklace' },
      { name: 'Cinturón', icon: 'fa-solid fa-ring', type: 'belt' },
      { name: 'Bolso', icon: 'fa-solid fa-bag-shopping', type: 'handbag' }
    ];

    // =============================================
    // TELAS
    // =============================================
    const fabrics = [
      { name: 'Rayas', pattern: 'stripes', style: 'background: repeating-linear-gradient(45deg, #000 0, #000 10px, #fff 10px, #fff 20px);' },
      { name: 'Lunares', pattern: 'dots', style: 'background-color: #e63946; background-image: radial-gradient(#fff 15%, transparent 16%); background-size: 12px 12px;' },
      { name: 'Escocés', pattern: 'tartan', style: 'background: repeating-linear-gradient(0deg, #d4af37, #d4af37 5px, #1e1e24 5px, #1e1e24 10px);' },
      { name: 'Arcoíris', pattern: 'rainbow', style: 'background: repeating-linear-gradient(90deg, #ff6b6b, #ff6b6b 8px, #ffd93d 8px, #ffd93d 16px);' },
      { name: 'Geométrico', pattern: 'geometric', style: 'background: repeating-conic-gradient(#2ecc71 0% 25%, #3498db 0% 50%, #2ecc71 0% 75%, #3498db 0% 100%); background-size: 20px 20px;' },
      { name: 'Chevron', pattern: 'chevron', style: 'background: repeating-linear-gradient(135deg, #9b59b6, #9b59b6 5px, #8e44ad 5px, #8e44ad 10px);' }
    ];

    // =============================================
    // INICIALIZACIÓN
    // =============================================
    window.onload = function() {
      renderColorPalette();
      renderFigurines();
      renderAccessories();
      renderFabrics();
      renderLayers();
      renderProjects();
      loadBaseFemale();
      setupReferenceBox();
      setupZoomGestures();
      setupKeyboardShortcuts();
      updateColorFromHue(0);
      saveToHistory();
      setTimeout(() => showToast('✨ Fashion Studio Pro cargado'), 500);
    };

    // =============================================
    // SIDEBAR
    // =============================================
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('show');
    }

    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarOverlay').classList.remove('show');
    }

    function switchSidebarTab(tabId) {
      document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.sidebar-panel').forEach(p => p.classList.remove('active'));
      
      const tabs = document.querySelectorAll('.sidebar-tab');
      const panels = document.querySelectorAll('.sidebar-panel');
      const tabMap = ['figurines', 'colors', 'fabrics', 'accessories', 'layers', 'projects'];
      const index = tabMap.indexOf(tabId);
      
      if (tabs[index]) tabs[index].classList.add('active');
      if (panels[index]) panels[index].classList.add('active');
    }

    // =============================================
    // COLOR PALETTE
    // =============================================
    function renderColorPalette() {
      const container = document.getElementById('colorPalette');
      container.innerHTML = colorPalette.map(color => `
        <div class="color-swatch" style="background:${color}" onclick="selectColor('${color}')" title="${color}"></div>
      `).join('');
    }

    function selectColor(color) {
      currentColor = color;
      document.getElementById('colorPreview').style.backgroundColor = color;
      document.getElementById('hexInput').value = color.toUpperCase();
      document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
      event.target.classList.add('active');
      if (canvas.freeDrawingBrush) canvas.freeDrawingBrush.color = color;
    }

    function updateColorFromHue(hue) {
      const color = `hsl(${hue}, 100%, 50%)`;
      currentColor = color;
      document.getElementById('colorPreview').style.backgroundColor = color;
      document.getElementById('hexInput').value = rgbToHex(color);
      if (canvas.freeDrawingBrush) canvas.freeDrawingBrush.color = color;
    }

    function updateColorFromHex(hex) {
      if (!hex.match(/^#[0-9A-Fa-f]{6}$/)) return;
      currentColor = hex;
      document.getElementById('colorPreview').style.backgroundColor = hex;
      if (canvas.freeDrawingBrush) canvas.freeDrawingBrush.color = hex;
    }

    function rgbToHex(rgb) {
      const match = rgb.match(/\d+/g);
      if (!match) return '#000000';
      const r = parseInt(match[0]);
      const g = parseInt(match[1]);
      const b = parseInt(match[2]);
      return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('').toUpperCase();
    }

    // =============================================
    // FIGURINES
    // =============================================
    function renderFigurines() {
      const container = document.getElementById('figurine-list');
      container.innerHTML = figurines.map((fig, i) => `
        <div class="figurine-card" onclick="loadFigurine('${fig.pose}')">
          <div class="preview"><i class="${fig.icon}" style="font-size:2.5rem; color:var(--text-muted);"></i></div>
          <span>${fig.name}</span>
        </div>
      `).join('');
    }

    function loadFigurine(pose) {
      clearBaseModel();
      // Crear figurín según la pose
      let modelGroup;
      const baseColor = '#c4c4d4';
      
      switch(pose) {
        case 'frontal1':
        case 'frontal2':
          modelGroup = createFrontalFigurine(baseColor);
          break;
        case 'profile1':
        case 'profile2':
          modelGroup = createProfileFigurine(baseColor);
          break;
        case 'dynamic1':
        case 'dynamic2':
          modelGroup = createDynamicFigurine(baseColor);
          break;
        case 'sitting1':
        case 'sitting2':
          modelGroup = createSittingFigurine(baseColor);
          break;
        case 'haute1':
          modelGroup = createHauteCoutureFigurine(baseColor);
          break;
        case 'runway1':
          modelGroup = createRunwayFigurine(baseColor);
          break;
        default:
          modelGroup = createFrontalFigurine(baseColor);
      }

      modelGroup.set({
        selectable: false,
        evented: false,
        opacity: layers[0].opacity,
        layerId: 0
      });

      canvas.add(modelGroup);
      canvas.sendToBack(modelGroup);
      canvas.renderAll();
      saveToHistory();
      showToast('👤 Figurín cargado');
    }

    function createFrontalFigurine(color) {
      const head = new fabric.Circle({ radius: 20, fill: color, left: 240, top: 40 });
      const torso = new fabric.Rect({ width: 50, height: 120, fill: color, left: 225, top: 80, rx: 6 });
      const leftLeg = new fabric.Rect({ width: 16, height: 200, fill: color, left: 220, top: 210 });
      const rightLeg = new fabric.Rect({ width: 16, height: 200, fill: color, left: 264, top: 210 });
      const leftArm = new fabric.Rect({ width: 12, height: 90, fill: color, left: 205, top: 95, rx: 4 });
      const rightArm = new fabric.Rect({ width: 12, height: 90, fill: color, left: 283, top: 95, rx: 4 });
      
      return new fabric.Group([head, torso, leftLeg, rightLeg, leftArm, rightArm], {
        left: 10, top: 10
      });
    }

    function createProfileFigurine(color) {
      const head = new fabric.Circle({ radius: 20, fill: color, left: 260, top: 40 });
      const torso = new fabric.Rect({ width: 45, height: 120, fill: color, left: 250, top: 80, rx: 6 });
      const leg1 = new fabric.Rect({ width: 14, height: 200, fill: color, left: 248, top: 210 });
      const leg2 = new fabric.Rect({ width: 14, height: 200, fill: color, left: 282, top: 210 });
      const arm1 = new fabric.Rect({ width: 10, height: 85, fill: color, left: 235, top: 95, rx: 4 });
      const arm2 = new fabric.Rect({ width: 10, height: 85, fill: color, left: 300, top: 95, rx: 4 });
      
      return new fabric.Group([head, torso, leg1, leg2, arm1, arm2], {
        left: 10, top: 10
      });
    }

    function createDynamicFigurine(color) {
      const head = new fabric.Circle({ radius: 20, fill: color, left: 260, top: 35 });
      const torso = new fabric.Rect({ width: 45, height: 115, fill: color, left: 235, top: 75, rx: 6, angle: -8 });
      const leg1 = new fabric.Rect({ width: 14, height: 200, fill: color, left: 220, top: 200, angle: 12 });
      const leg2 = new fabric.Rect({ width: 14, height: 200, fill: color, left: 280, top: 205, angle: -8 });
      const arm1 = new fabric.Rect({ width: 10, height: 85, fill: color, left: 210, top: 90, angle: -15 });
      const arm2 = new fabric.Rect({ width: 10, height: 85, fill: color, left: 295, top: 85, angle: 20 });
      
      return new fabric.Group([head, torso, leg1, leg2, arm1, arm2], {
        left: 10, top: 10
      });
    }

    function createSittingFigurine(color) {
      const head = new fabric.Circle({ radius: 20, fill: color, left: 250, top: 35 });
      const torso = new fabric.Rect({ width: 50, height: 100, fill: color, left: 225, top: 75, rx: 6 });
      const leg1 = new fabric.Rect({ width: 16, height: 130, fill: color, left: 220, top: 180, angle: 90 });
      const leg2 = new fabric.Rect({ width: 16, height: 130, fill: color, left: 264, top: 180, angle: 90 });
      const arm1 = new fabric.Rect({ width: 12, height: 80, fill: color, left: 205, top: 90, rx: 4 });
      const arm2 = new fabric.Rect({ width: 12, height: 80, fill: color, left: 283, top: 90, rx: 4 });
      
      return new fabric.Group([head, torso, leg1, leg2, arm1, arm2], {
        left: 10, top: 10
      });
    }

    function createHauteCoutureFigurine(color) {
      const head = new fabric.Circle({ radius: 18, fill: color, left: 240, top: 30 });
      const torso = new fabric.Rect({ width: 40, height: 130, fill: color, left: 230, top: 70, rx: 4 });
      const leg1 = new fabric.Rect({ width: 12, height: 250, fill: color, left: 225, top: 210 });
      const leg2 = new fabric.Rect({ width: 12, height: 250, fill: color, left: 263, top: 210 });
      const arm1 = new fabric.Rect({ width: 10, height: 100, fill: color, left: 215, top: 85, rx: 3 });
      const arm2 = new fabric.Rect({ width: 10, height: 100, fill: color, left: 275, top: 85, rx: 3 });
      
      return new fabric.Group([head, torso, leg1, leg2, arm1, arm2], {
        left: 10, top: 10
      });
    }

    function createRunwayFigurine(color) {
      const head = new fabric.Circle({ radius: 20, fill: color, left: 250, top: 30 });
      const torso = new fabric.Rect({ width: 45, height: 120, fill: color, left: 230, top: 70, rx: 5 });
      const leg1 = new fabric.Rect({ width: 14, height: 220, fill: color, left: 220, top: 200, angle: 5 });
      const leg2 = new fabric.Rect({ width: 14, height: 220, fill: color, left: 266, top: 200, angle: -5 });
      const arm1 = new fabric.Rect({ width: 10, height: 90, fill: color, left: 210, top: 85, angle: -10, rx: 3 });
      const arm2 = new fabric.Rect({ width: 10, height: 90, fill: color, left: 280, top: 85, angle: 10, rx: 3 });
      
      return new fabric.Group([head, torso, leg1, leg2, arm1, arm2], {
        left: 10, top: 10
      });
    }

    function loadBaseFemale() {
      clearBaseModel();
      const model = createFrontalFigurine('#c4c4d4');
      model.set({
        selectable: false,
        evented: false,
        opacity: layers[0].opacity,
        layerId: 0
      });
      canvas.add(model);
      canvas.sendToBack(model);
      canvas.renderAll();
      saveToHistory();
    }

    function loadBaseMale() {
      clearBaseModel();
      const color = '#b8b8c8';
      const head = new fabric.Circle({ radius: 24, fill: color, left: 230, top: 30 });
      const torso = new fabric.Rect({ width: 80, height: 150, fill: color, left: 210, top: 80, rx: 8 });
      const leftLeg = new fabric.Rect({ width: 22, height: 200, fill: color, left: 215, top: 240 });
      const rightLeg = new fabric.Rect({ width: 22, height: 200, fill: color, left: 263, top: 240 });
      const leftArm = new fabric.Rect({ width: 14, height: 95, fill: color, left: 190, top: 95, rx: 4 });
      const rightArm = new fabric.Rect({ width: 14, height: 95, fill: color, left: 296, top: 95, rx: 4 });
      
      const modelGroup = new fabric.Group([head, torso, leftLeg, rightLeg, leftArm, rightArm], {
        selectable: false,
        evented: false,
        opacity: layers[0].opacity,
        layerId: 0
      });
      
      canvas.add(modelGroup);
      canvas.sendToBack(modelGroup);
      canvas.renderAll();
      saveToHistory();
      showToast('👨 Figurín masculino cargado');
    }

    function clearBaseModel() {
      canvas.getObjects().forEach(obj => {
        if (obj.layerId === 0 && obj.type === 'group') {
          canvas.remove(obj);
        }
      });
    }

    function uploadCustomFigurine(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(f) {
        const dataUrl = f.target.result;
        let saved = JSON.parse(localStorage.getItem('saved_figurines') || '[]');
        saved.push({ id: Date.now(), image: dataUrl, name: 'Custom ' + (saved.length + 1) });
        localStorage.setItem('saved_figurines', JSON.stringify(saved));
        renderFigurines();
        fabric.Image.fromURL(dataUrl, function(img) {
          clearBaseModel();
          const scale = Math.min((canvas.width - 40) / img.width, (canvas.height - 40) / img.height);
          img.set({
            scaleX: scale, scaleY: scale,
            left: (canvas.width - img.width * scale) / 2,
            top: (canvas.height - img.height * scale) / 2,
            selectable: false, evented: false, opacity: layers[0].opacity, layerId: 0
          });
          canvas.add(img);
          canvas.sendToBack(img);
          canvas.renderAll();
          saveToHistory();
          showToast('📸 Figurín cargado');
        });
      };
      reader.readAsDataURL(file);
    }

    // =============================================
    // ACCESSORIES
    // =============================================
    function renderAccessories() {
      const container = document.getElementById('accessoryGrid');
      container.innerHTML = accessories.map(acc => `
        <div class="figurine-card" onclick="addAccessory('${acc.type}')">
          <div class="preview"><i class="${acc.icon}" style="font-size:2rem; color:var(--accent-gold);"></i></div>
          <span>${acc.name}</span>
        </div>
      `).join('');
    }

    function addAccessory(type) {
      const colors = ['#d4af37', '#e63946', '#2a9d8f', '#f4a261', '#9b59b6', '#1a5276', '#e67e22', '#2ecc71'];
      const color = colors[Math.floor(Math.random() * colors.length)];
      let shape;

      switch(type) {
        case 'hat':
          shape = new fabric.Group([
            new fabric.Triangle({ width: 100, height: 50, fill: color, left: 0, top: 0 }),
            new fabric.Rect({ width: 100, height: 15, fill: color, left: 0, top: 40, rx: 3 })
          ], { left: 200, top: 20 });
          break;
        case 'glasses':
          shape = new fabric.Group([
            new fabric.Rect({ width: 35, height: 22, fill: 'rgba(0,0,0,0.2)', left: 0, top: 0, rx: 6 }),
            new fabric.Rect({ width: 35, height: 22, fill: 'rgba(0,0,0,0.2)', left: 45, top: 0, rx: 6 }),
            new fabric.Line([35, 11, 45, 11], { stroke: '#111', strokeWidth: 2 })
          ], { left: 190, top: 45 });
          break;
        case 'scarf':
          shape = new fabric.Rect({ width: 90, height: 35, fill: color, left: 200, top: 120, rx: 5 });
          break;
        case 'necklace':
          shape = new fabric.Circle({ radius: 30, fill: 'transparent', stroke: '#d4af37', strokeWidth: 3, left: 220, top: 65 });
          break;
        case 'belt':
          shape = new fabric.Rect({ width: 80, height: 10, fill: '#8B4513', left: 210, top: 170, rx: 2 });
          break;
        case 'handbag':
          shape = new fabric.Group([
            new fabric.Rect({ width: 55, height: 45, fill: color, left: 0, top: 0, rx: 6 }),
            new fabric.Line([12, 0, 12, -18], { stroke: color, strokeWidth: 4 }),
            new fabric.Line([43, 0, 43, -18], { stroke: color, strokeWidth: 4 })
          ], { left: 220, top: 200 });
          break;
        default:
          shape = new fabric.Circle({ radius: 35, fill: color, left: 220, top: 120 });
      }

      shape.set({
        selectable: true,
        evented: true,
        layerId: activeLayerId,
        opacity: layers.find(l => l.id === activeLayerId)?.opacity || 1
      });

      canvas.add(shape);
      canvas.setActiveObject(shape);
      setMode('select');
      canvas.renderAll();
      saveToHistory();
      showToast('✨ Accesorio añadido');
    }

    // =============================================
    // FABRICS
    // =============================================
    function renderFabrics() {
      const container = document.getElementById('fabricGrid');
      container.innerHTML = fabrics.map(f => `
        <div class="fabric-item" style="${f.style}" onclick="selectFabricPattern('${f.pattern}')" title="${f.name}"></div>
      `).join('');
    }

    function selectFabricPattern(pattern) {
      selectedPattern = pattern;
      document.querySelectorAll('.fabric-item').forEach(el => el.classList.remove('selected'));
      event.target.classList.add('selected');
      document.getElementById('selected-pattern-display').textContent = `✅ Patrón: ${pattern.toUpperCase()}`;
      showToast(`🎨 Patrón "${pattern}" seleccionado`);
      setMode('fill');
    }

    function applyFabricToTarget(target) {
      if (!target) {
        showToast('Selecciona una prenda');
        return;
      }

      if (!selectedPattern) {
        target.set('fill', currentColor);
        canvas.renderAll();
        saveToHistory();
        showToast('🎨 Color aplicado');
        return;
      }

      const patternCanvas = document.createElement('canvas');
      patternCanvas.width = 40;
      patternCanvas.height = 40;
      const pctx = patternCanvas.getContext('2d');

      pctx.fillStyle = currentColor;
      pctx.fillRect(0, 0, 40, 40);

      switch(selectedPattern) {
        case 'stripes':
          pctx.strokeStyle = '#ffffff';
          pctx.lineWidth = 6;
          pctx.beginPath(); pctx.moveTo(0,0); pctx.lineTo(40,40); pctx.stroke();
          pctx.beginPath(); pctx.moveTo(0,40); pctx.lineTo(40,0); pctx.stroke();
          break;
        case 'dots':
          pctx.fillStyle = '#ffffff';
          for (let i = 10; i < 40; i += 20) {
            for (let j = 10; j < 40; j += 20) {
              pctx.beginPath();
              pctx.arc(i, j, 8, 0, Math.PI * 2);
              pctx.fill();
            }
          }
          break;
        case 'tartan':
          pctx.fillStyle = 'rgba(255,255,255,0.3)';
          for (let i = 0; i < 40; i += 10) {
            pctx.fillRect(i, 0, 4, 40);
            pctx.fillRect(0, i, 40, 4);
          }
          break;
        case 'rainbow':
          const rc = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#9b59b6'];
          for (let i = 0; i < 40; i += 8) {
            pctx.fillStyle = rc[Math.floor(i / 8) % rc.length];
            pctx.fillRect(i, 0, 8, 40);
          }
          break;
        case 'geometric':
          pctx.fillStyle = 'rgba(255,255,255,0.5)';
          for (let i = 0; i < 40; i += 20) {
            for (let j = 0; j < 40; j += 20) {
              pctx.beginPath();
              pctx.arc(i + 10, j + 10, 8, 0, Math.PI * 2);
              pctx.fill();
            }
          }
          break;
        case 'chevron':
          pctx.strokeStyle = '#ffffff';
          pctx.lineWidth = 4;
          for (let i = 0; i < 40; i += 10) {
            pctx.beginPath();
            pctx.moveTo(i, 0);
            pctx.lineTo(i + 5, 5);
            pctx.lineTo(i, 10);
            pctx.stroke();
          }
          break;
      }

      const pattern = new fabric.Pattern({
        source: patternCanvas,
        repeat: 'repeat'
      });

      target.set('fill', pattern);
      canvas.renderAll();
      saveToHistory();
      showToast(`✅ Patrón "${selectedPattern}" aplicado`);
      
      selectedPattern = null;
      document.querySelectorAll('.fabric-item').forEach(el => el.classList.remove('selected'));
      document.getElementById('selected-pattern-display').textContent = 'Selecciona un patrón';
    }

    // =============================================
    // LAYERS
    // =============================================
    function renderLayers() {
      const container = document.getElementById('layer-container');
      container.innerHTML = '';
      layers.slice().reverse().forEach(l => {
        const item = document.createElement('div');
        item.className = `layer-item ${l.id === activeLayerId ? 'active' : ''}`;
        item.innerHTML = `
          <div class="layer-row">
            <span onclick="selectLayer(${l.id})">${l.name}</span>
            <div class="layer-controls">
              <button class="layer-btn ${l.visible ? 'active' : ''}" onclick="toggleLayerVis(${l.id})">
                <i class="fa-solid ${l.visible ? 'fa-eye' : 'fa-eye-slash'}"></i>
              </button>
              ${l.id > 0 ? `<button class="layer-btn" onclick="deleteLayer(${l.id})" style="color:#e74c3c;"><i class="fa-solid fa-trash"></i></button>` : ''}
            </div>
          </div>
          <div class="layer-slider-row">
            <span>Opacidad</span>
            <input type="range" min="0" max="100" value="${l.opacity * 100}" oninput="changeLayerOpacity(${l.id}, this.value)">
            <span>${Math.round(l.opacity * 100)}%</span>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function selectLayer(id) {
      activeLayerId = id;
      renderLayers();
      showToast(`📁 Capa: ${layers.find(l => l.id === id).name}`);
    }

    function toggleLayerVis(id) {
      const layer = layers.find(l => l.id === id);
      layer.visible = !layer.visible;
      canvas.getObjects().forEach(obj => {
        if (obj.layerId === id) obj.set('visible', layer.visible);
      });
      canvas.renderAll();
      renderLayers();
    }

    function changeLayerOpacity(id, val) {
      const layer = layers.find(l => l.id === id);
      layer.opacity = val / 100;
      canvas.getObjects().forEach(obj => {
        if (obj.layerId === id) obj.set('opacity', layer.opacity);
      });
      canvas.renderAll();
      renderLayers();
    }

    function addLayer() {
      const newId = layers.length;
      const name = prompt("Nombre de la capa:", `Capa ${newId}`);
      if (!name) return;
      layers.push({ id: newId, name: name, opacity: 1.0, visible: true });
      activeLayerId = newId;
      renderLayers();
      showToast(`✨ Capa "${name}" creada`);
    }

    function deleteLayer(id) {
      if (id === 0) { showToast('No se puede eliminar la capa base'); return; }
      if (!confirm(`¿Eliminar "${layers.find(l => l.id === id).name}"?`)) return;
      
      canvas.getObjects().forEach(obj => {
        if (obj.layerId === id) canvas.remove(obj);
      });
      layers = layers.filter(l => l.id !== id);
      if (activeLayerId === id) activeLayerId = 0;
      renderLayers();
      canvas.renderAll();
      saveToHistory();
      showToast('🗑️ Capa eliminada');
    }

    // =============================================
    // PROJECTS
    // =============================================
    function renderProjects() {
      const container = document.getElementById('projects-container');
      const drafts = JSON.parse(localStorage.getItem('draft_projects') || '[]');
      const finished = JSON.parse(localStorage.getItem('finished_projects') || '[]');
      const all = [...finished, ...drafts];
      
      if (all.length === 0) {
        container.innerHTML = `<div style="text-align:center; color:var(--text-muted); font-size:0.8rem; padding:20px;">
          <i class="fa-regular fa-folder-open" style="font-size:2rem; display:block; margin-bottom:10px;"></i>
          No hay proyectos guardados
        </div>`;
        return;
      }

      container.innerHTML = all.map((p, i) => `
        <div class="figurine-card" onclick="loadProject(${i})" style="margin-bottom:8px;">
          <img src="${p.image}" style="width:100%; height:80px; object-fit:contain; background:#0d0d12; border-radius:4px;">
          <span>${p.name}</span>
        </div>
      `).join('');
    }

    function loadProject(index) {
      const all = [...JSON.parse(localStorage.getItem('finished_projects') || '[]'), ...JSON.parse(localStorage.getItem('draft_projects') || '[]')];
      if (!all[index]) return;
      if (!confirm(`¿Cargar "${all[index].name}"?`)) return;
      
      fabric.Image.fromURL(all[index].image, function(img) {
        canvas.clear();
        canvas.backgroundColor = '#ffffff';
        const scale = Math.min(canvas.width / img.width, canvas.height / img.height);
        img.set({
          scaleX: scale, scaleY: scale,
          left: (canvas.width - img.width * scale) / 2,
          top: (canvas.height - img.height * scale) / 2,
          selectable: false, evented: false
        });
        canvas.add(img);
        canvas.renderAll();
        saveToHistory();
        showToast(`📂 Proyecto cargado`);
      });
    }

    function saveProject(isFinished) {
      const name = prompt("Nombre del diseño:", "Diseño " + new Date().toLocaleDateString());
      if (!name) return;
      
      const dataUrl = canvas.toDataURL({ format: 'png', quality: 0.9 });
      const key = isFinished ? 'finished_projects' : 'draft_projects';
      let projects = JSON.parse(localStorage.getItem(key) || '[]');
      projects.push({ name, image: dataUrl, date: new Date().toISOString() });
      localStorage.setItem(key, JSON.stringify(projects));
      renderProjects();
      showToast(`💾 "${name}" guardado`);
    }

    // =============================================
    // MODOS
    // =============================================
    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
      
      canvas.isDrawingMode = false;
      canvas.selection = false;
      canvas.defaultCursor = 'default';

      switch(mode) {
        case 'draw':
          document.querySelector('.tool-btn[title="Dibujar"]')?.classList.add('active');
          canvas.isDrawingMode = true;
          setupBrush();
          showToast('✏️ Dibujo');
          break;
        case 'select':
          document.querySelector('.tool-btn[title="Seleccionar"]')?.classList.add('active');
          canvas.selection = true;
          showToast('🖱️ Selección');
          break;
        case 'pan':
          document.querySelector('.tool-btn[title="Mover Lienzo"]')?.classList.add('active');
          canvas.defaultCursor = 'grab';
          showToast('✋ Mover');
          break;
        case 'erase':
          document.querySelector('.tool-btn[title="Borrador"]')?.classList.add('active');
          canvas.isDrawingMode = true;
          canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
          canvas.freeDrawingBrush.color = '#ffffff';
          canvas.freeDrawingBrush.width = parseInt(document.getElementById('brush-size').value) * 3;
          showToast('🧹 Borrador');
          break;
        case 'fill':
          document.querySelector('.tool-btn[title="Rellenar"]')?.classList.add('active');
          canvas.selection = true;
          showToast('🪣 Relleno');
          break;
      }
    }

    // =============================================
    // BRUSH SETTINGS
    // =============================================
    function setupBrush() {
      if (currentMode !== 'draw') return;
      const type = document.getElementById('brush-type').value;
      const size = parseInt(document.getElementById('brush-size').value);

      switch(type) {
        case 'spray':
          canvas.freeDrawingBrush = new fabric.SprayBrush(canvas);
          canvas.freeDrawingBrush.sprayWidth = size * 3;
          canvas.freeDrawingBrush.sprayDensity = 5;
          break;
        case 'ink':
          canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
          canvas.freeDrawingBrush.strokeLineCap = 'round';
          canvas.freeDrawingBrush.strokeLineJoin = 'round';
          break;
        case 'marker':
          canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
          canvas.freeDrawingBrush.strokeLineCap = 'round';
          canvas.freeDrawingBrush.strokeLineJoin = 'round';
          canvas.freeDrawingBrush.width = size * 1.5;
          break;
        default:
          canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
      }
      
      canvas.freeDrawingBrush.color = currentColor;
      canvas.freeDrawingBrush.width = size;
    }

    function updateBrushSize(val) {
      document.getElementById('brush-size-val').textContent = val + 'px';
      if (canvas.freeDrawingBrush) canvas.freeDrawingBrush.width = parseInt(val);
    }

    function changeBrushType() {
      setupBrush();
      showToast('🖌️ Pincel cambiado');
    }

    // =============================================
    // ZOOM Y PAN
    // =============================================
    function zoomIn() {
      const newZoom = Math.min(currentZoom * 1.2, 5);
      currentZoom = newZoom;
      canvas.setZoom(currentZoom);
      updateZoomDisplay();
    }

    function zoomOut() {
      const newZoom = Math.max(currentZoom / 1.2, 0.5);
      currentZoom = newZoom;
      canvas.setZoom(currentZoom);
      updateZoomDisplay();
    }

    function resetZoom() {
      currentZoom = 1;
      canvas.setZoom(1);
      canvas.viewportTransform[4] = 0;
      canvas.viewportTransform[5] = 0;
      canvas.renderAll();
      updateZoomDisplay();
    }

    function updateZoomDisplay() {
      document.getElementById('zoom-level').textContent = Math.round(currentZoom * 100) + '%';
    }

    // =============================================
    // ZOOM GESTURES (TOUCH)
    // =============================================
    function setupZoomGestures() {
      const viewport = document.getElementById('canvas-viewport');
      let lastDist = 0;
      let pinching = false;

      viewport.addEventListener('touchstart', function(e) {
        if (e.touches.length === 2) {
          const t1 = e.touches[0], t2 = e.touches[1];
          lastDist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
          pinching = true;
          e.preventDefault();
        } else if (e.touches.length === 1 && currentMode === 'pan') {
          const touch = e.touches[0];
          lastPanX = touch.clientX;
          lastPanY = touch.clientY;
          isPanning = true;
          canvas.isDrawingMode = false;
          e.preventDefault();
        }
      }, { passive: false });

      viewport.addEventListener('touchmove', function(e) {
        if (e.touches.length === 2 && pinching) {
          const t1 = e.touches[0], t2 = e.touches[1];
          const dist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
          const scale = dist / lastDist;
          let newZoom = currentZoom * scale;
          if (newZoom < 0.5) newZoom = 0.5;
          if (newZoom > 5) newZoom = 5;
          
          const vpt = canvas.viewportTransform;
          const rect = document.getElementById('canvas-card').getBoundingClientRect();
          const cx = (t1.clientX + t2.clientX) / 2 - rect.left;
          const cy = (t1.clientY + t2.clientY) / 2 - rect.top;
          const factor = newZoom / currentZoom;
          vpt[4] = cx - (cx - vpt[4]) * factor;
          vpt[5] = cy - (cy - vpt[5]) * factor;
          
          currentZoom = newZoom;
          canvas.setZoom(currentZoom);
          canvas.renderAll();
          updateZoomDisplay();
          lastDist = dist;
          e.preventDefault();
        } else if (e.touches.length === 1 && isPanning) {
          const touch = e.touches[0];
          const vpt = canvas.viewportTransform;
          vpt[4] += touch.clientX - lastPanX;
          vpt[5] += touch.clientY - lastPanY;
          canvas.requestRenderAll();
          lastPanX = touch.clientX;
          lastPanY = touch.clientY;
          e.preventDefault();
        }
      }, { passive: false });

      viewport.addEventListener('touchend', function() {
        pinching = false;
        isPanning = false;
        if (currentMode === 'draw') canvas.isDrawingMode = true;
      });
    }

    // =============================================
    // CANVAS EVENTS
    // =============================================
    canvas.on('mouse:down', function(opt) {
      if (currentMode === 'pan') {
        isPanning = true;
        canvas.isDrawingMode = false;
        canvas.selection = false;
        lastPanX = opt.e.clientX;
        lastPanY = opt.e.clientY;
        canvas.defaultCursor = 'grabbing';
        return;
      }
      if (currentMode === 'fill' && opt.target) {
        applyFabricToTarget(opt.target);
        return;
      }
    });

    canvas.on('mouse:move', function(opt) {
      if (isPanning) {
        const e = opt.e;
        const vpt = canvas.viewportTransform;
        vpt[4] += e.clientX - lastPanX;
        vpt[5] += e.clientY - lastPanY;
        canvas.requestRenderAll();
        lastPanX = e.clientX;
        lastPanY = e.clientY;
      }
    });

    canvas.on('mouse:up', function() {
      if (isPanning) {
        isPanning = false;
        canvas.defaultCursor = 'grab';
        if (currentMode === 'draw') {
          canvas.isDrawingMode = true;
          canvas.selection = false;
        }
      }
    });

    canvas.on('path:created', function() { saveToHistory(); });
    canvas.on('object:added', function() { if (!canvas._loadingFromHistory) saveToHistory(); });
    canvas.on('object:modified', function() { saveToHistory(); });
    canvas.on('object:removed', function() { saveToHistory(); });

    // =============================================
    // HISTORY (UNDO/REDO)
    // =============================================
    function saveToHistory() {
      if (historyIndex < history.length - 1) {
        history = history.slice(0, historyIndex + 1);
      }
      history.push(canvas.toJSON(['layerId', 'selectable', 'evented']));
      if (history.length > MAX_HISTORY) history.shift();
      historyIndex = history.length - 1;
    }

    function undoAction() {
      if (historyIndex > 0) {
        historyIndex--;
        loadHistory(history[historyIndex]);
        showToast('↩️ Deshacer');
      } else {
        showToast('No hay más acciones');
      }
    }

    function redoAction() {
      if (historyIndex < history.length - 1) {
        historyIndex++;
        loadHistory(history[historyIndex]);
        showToast('↪️ Rehacer');
      } else {
        showToast('No hay más acciones');
      }
    }

    function loadHistory(data) {
      canvas._loadingFromHistory = true;
      canvas.clear();
      canvas.backgroundColor = '#ffffff';
      canvas.loadFromJSON(data, function() {
        canvas.renderAll();
        canvas._loadingFromHistory = false;
        if (!canvas.getObjects().some(obj => obj.layerId === 0)) {
          loadBaseFemale();
        }
      });
    }

    // =============================================
    // DELETE SELECTED
    // =============================================
    function deleteSelected() {
      const active = canvas.getActiveObject();
      if (!active) { showToast('Selecciona un objeto'); return; }
      if (active.layerId === 0) { showToast('No se puede eliminar el figurín'); return; }
      if (confirm('¿Eliminar el objeto seleccionado?')) {
        canvas.remove(active);
        canvas.renderAll();
        saveToHistory();
        showToast('🗑️ Objeto eliminado');
      }
    }

    // =============================================
    // KEYBOARD SHORTCUTS
    // =============================================
    function setupKeyboardShortcuts() {
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Delete' || e.key === 'Supr') deleteSelected();
        if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undoAction(); }
        if (e.ctrlKey && e.key === 'y') { e.preventDefault(); redoAction(); }
        if (e.key === 'Escape') closeSidebar();
      });
    }

    // =============================================
    // REFERENCE BOX (DRAGGABLE + RESIZABLE)
    // =============================================
    function setupReferenceBox() {
      const box = document.getElementById('referenceBox');
      const handle = document.getElementById('resizeHandle');
      let isDragging = false, isResizing = false;
      let startX, startY, startWidth, startHeight, origX, origY;

      // Drag
      box.addEventListener('mousedown', function(e) {
        if (e.target.closest('.ref-actions')) return;
        if (e.target === handle) return;
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        origX = box.offsetLeft;
        origY = box.offsetTop;
        box.style.cursor = 'grabbing';
        e.preventDefault();
      });

      // Resize
      handle.addEventListener('mousedown', function(e) {
        isResizing = true;
        startX = e.clientX;
        startY = e.clientY;
        startWidth = box.offsetWidth;
        startHeight = box.offsetHeight;
        e.stopPropagation();
        e.preventDefault();
      });

      document.addEventListener('mousemove', function(e) {
        if (isDragging) {
          box.style.left = (origX + e.clientX - startX) + 'px';
          box.style.top = (origY + e.clientY - startY) + 'px';
          box.style.bottom = 'auto';
          box.style.right = 'auto';
        }
        if (isResizing) {
          const w = Math.max(120, startWidth + e.clientX - startX);
          const h = Math.max(150, startHeight + e.clientY - startY);
          box.style.width = w + 'px';
          box.style.height = h + 'px';
        }
      });

      document.addEventListener('mouseup', function() {
        if (isDragging) { isDragging = false; box.style.cursor = 'grab'; }
        if (isResizing) { isResizing = false; }
      });

      // Touch support
      let touchStartX, touchStartY, touchOrigX, touchOrigY, touchStartW, touchStartH;
      
      box.addEventListener('touchstart', function(e) {
        if (e.target.closest('.ref-actions')) return;
        const touch = e.touches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
        touchOrigX = box.offsetLeft;
        touchOrigY = box.offsetTop;
        isDragging = true;
        e.preventDefault();
      }, { passive: false });

      handle.addEventListener('touchstart', function(e) {
        const touch = e.touches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
        touchStartW = box.offsetWidth;
        touchStartH = box.offsetHeight;
        isResizing = true;
        e.stopPropagation();
        e.preventDefault();
      }, { passive: false });

      document.addEventListener('touchmove', function(e) {
        if (isDragging && e.touches.length === 1) {
          const touch = e.touches[0];
          box.style.left = (touchOrigX + touch.clientX - touchStartX) + 'px';
          box.style.top = (touchOrigY + touch.clientY - touchStartY) + 'px';
          box.style.bottom = 'auto';
          box.style.right = 'auto';
          e.preventDefault();
        }
        if (isResizing && e.touches.length === 1) {
          const touch = e.touches[0];
          const w = Math.max(120, touchStartW + touch.clientX - touchStartX);
          const h = Math.max(150, touchStartH + touch.clientY - touchStartY);
          box.style.width = w + 'px';
          box.style.height = h + 'px';
          e.preventDefault();
        }
      }, { passive: false });

      document.addEventListener('touchend', function() {
        isDragging = false;
        isResizing = false;
      });
    }

    function loadReferenceImage(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(f) {
        document.getElementById('refContainer').innerHTML = `<img src="${f.target.result}">`;
        showToast('🖼️ Referencia cargada');
      };
      reader.readAsDataURL(file);
    }

    function clearReference() {
      document.getElementById('refContainer').innerHTML = `
        <div class="placeholder">
          <i class="fa-regular fa-image"></i>
          Toca para subir foto
        </div>
      `;
      showToast('🗑️ Referencia eliminada');
    }

    // =============================================
    // CLEAR CANVAS
    // =============================================
    function clearCanvas() {
      if (!confirm('¿Limpiar todo el lienzo?')) return;
      canvas.clear();
      canvas.backgroundColor = '#ffffff';
      loadBaseFemale();
      saveToHistory();
      showToast('🧹 Lienzo limpiado');
    }

    // =============================================
    // TOAST
    // =============================================
    let toastTimeout;

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // =============================================
    // AUTO-SAVE
    // =============================================
    setInterval(() => {
      try {
        localStorage.setItem('auto_save', JSON.stringify(canvas.toJSON(['layerId', 'selectable', 'evented'])));
      } catch(e) {}
    }, 30000);

    try {
      const autoSave = localStorage.getItem('auto_save');
      if (autoSave) {
        const data = JSON.parse(autoSave);
        if (data.objects && data.objects.length > 0) {
          canvas.loadFromJSON(data, function() {
            canvas.renderAll();
