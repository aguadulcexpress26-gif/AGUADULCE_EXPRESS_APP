<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="screen-orientation" content="landscape">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Aguadulce Express - Cocina</title>
    
    <!-- Link al manifest.json -->
    <link rel="manifest" href="/AGUADULCE_EXPRESS_APP/cocina/manifest-cocina.json">
    
    <!-- Para iOS -->
    <link rel="apple-touch-icon" href="https://i.postimg.cc/cCv7qsHf/IMAGEN-PNG-512.jpg">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>

    <style>
        /* ============================================
           ESTILOS GLOBALES - (TODOS LOS ESTILOS DE ANTES)
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #f3f4f6;
            height: 100vh;
            overflow: hidden;
        }
        
        /* ============================================
           ORIENTACIÓN HORIZONTAL EN TABLETA
           ============================================ */
        @media screen and (min-width: 768px) and (max-width: 1024px) {
            body {
                display: flex;
                flex-direction: column;
                height: 100vh;
                overflow: hidden;
            }
            
            #app {
                flex: 1;
                display: flex;
                flex-direction: column;
                height: 100vh;
                overflow: hidden;
            }
            
            .contenido-principal {
                flex: 1;
                display: flex;
                flex-wrap: wrap;
                overflow-y: auto;
                padding: 1rem;
                gap: 1rem;
            }
        }
        
        /* Advertencia de orientación vertical */
        @media screen and (min-width: 768px) and (max-width: 1024px) and (orientation: portrait) {
            body::before {
                content: "🔄 Por favor, gira tu tableta a posición horizontal";
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0, 0, 0, 0.95);
                color: white;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1.5rem;
                text-align: center;
                z-index: 9999;
                padding: 2rem;
            }
            
            #app, #login-container, .contenido-principal {
                display: none !important;
            }
        }
        
        /* ============================================
           ESTILOS DE LA APP
           ============================================ */
        #login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 1rem;
        }
        
        .login-card {
            background: white;
            border-radius: 1.5rem;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.5s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .login-card h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #1f2937;
            text-align: center;
            margin-bottom: 0.5rem;
        }
        
        .login-card .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 2rem;
        }
        
        .login-card input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 0.75rem;
            font-size: 1rem;
            transition: all 0.3s;
            background: #f9fafb;
        }
        
        .login-card input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            background: white;
        }
        
        .login-card button[type="submit"] {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .login-card button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }
        
        .login-card button[type="submit"]:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        
        /* ============================================
           MENÚ HAMBURGUESA
           ============================================ */
      #menu-toggle {
    position: fixed;
    top: 1rem;
    left: 1rem;
    z-index: 50;
    background: white;
    border: none;
    border-radius: 0.75rem;
    padding: 0.75rem;
    font-size: 1.5rem;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    cursor: pointer;
    transition: all 0.3s;
    display: none !important;  /* ← NUEVO: oculto por defecto */
}

/* NUEVO: Solo se muestra cuando la app está visible */
#app:not(.hidden) #menu-toggle {
    display: block !important;
}

#menu-toggle:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
}

#menu-toggle.active {
    background: #ef4444;
    color: white;
}
        /* ============================================
           MENÚ DESPLEGABLE
           ============================================ */
        #menu-desplegable {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            height: 100vh;
            background: white;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.1);
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 40;
            padding: 5rem 1.5rem 2rem;
            overflow-y: auto;
        }
        
        #menu-desplegable.open {
            transform: translateX(0);
        }
        
        #menu-desplegable .menu-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            color: #374151;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 0.25rem;
            border: none;
            background: transparent;
            width: 100%;
            font-size: 1rem;
        }
        
        #menu-desplegable .menu-item:hover {
            background: #f3f4f6;
        }
        
        #menu-desplegable .menu-item.active {
            background: #667eea;
            color: white;
        }
        
        #menu-desplegable .menu-item.danger {
            color: #ef4444;
        }
        
        #menu-desplegable .menu-item.danger:hover {
            background: #fef2f2;
        }
        
        /* ============================================
           CONTENIDO PRINCIPAL
           ============================================ */
        #app {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #f3f4f6;
        }
        
        #app.hidden {
            display: none !important;
        }
        
        .contenido-principal {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
            margin-top: 0;
        }
        
        /* ============================================
           TARJETAS DE PEDIDOS
           ============================================ */
        .pedido-card {
            background: white;
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: all 0.3s;
            border-left: 4px solid #667eea;
            margin-bottom: 1rem;
        }
        
        .pedido-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }
        
        .pedido-card .estado {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .estado-pendiente { background: #fef3c7; color: #92400e; }
        .estado-coccion { background: #dbeafe; color: #1e40af; }
        .estado-listo { background: #d1fae5; color: #065f46; }
        .estado-reparto { background: #e0e7ff; color: #3730a3; }
        .estado-entregado { background: #d1fae5; color: #065f46; }
        
        /* ============================================
           BOTÓN DE INSTALACIÓN PWA
           ============================================ */
        #install-btn {
            display: none !important;
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 50;
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 9999px;
            font-weight: 600;
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.4);
            cursor: pointer;
            transition: all 0.3s;
            align-items: center;
            gap: 0.5rem;
        }
        
        #app:not(.hidden) #install-btn {
            display: flex !important;
        }
        
        #install-btn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 12px 40px rgba(102, 126, 234, 0.5);
        }
        
        #install-btn:active {
            transform: scale(0.95);
        }
        
        /* ============================================
           TOAST NOTIFICATIONS
           ============================================ */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            color: white;
            font-weight: 500;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            z-index: 999;
            animation: slideIn 0.3s ease-out;
            max-width: 400px;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .toast-success { background: #10b981; }
        .toast-error { background: #ef4444; }
        .toast-info { background: #3b82f6; }
        .toast-warning { background: #f59e0b; }
        
        /* ============================================
           OVERLAY DE ORIENTACIÓN
           ============================================ */
        #orientacion-overlay {
            display: none;
        }
        
        #orientacion-overlay:not(.hidden) {
            display: flex !important;
        }
        
        /* Scrollbar personalizada */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #5a67d8;
        }
    </style>
</head>
<body>

    <!-- ============================================
    LOGIN CONTAINER
    ============================================ -->
    <div id="login-container">
        <div class="login-card">
            <h1>🍳 Aguadulce Express</h1>
            <p class="subtitle">Panel de Cocina</p>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="login-email" placeholder="restaurante@email.com" required>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                
                <button type="submit" id="login-btn">
                    <span id="login-text">Iniciar Sesión</span>
                    <span id="login-loading" class="hidden">Cargando...</span>
                </button>
                
                <div id="login-error" class="text-red-500 text-sm text-center hidden"></div>
            </form>
        </div>
    </div>

    <!-- ============================================
    APP PRINCIPAL
    ============================================ -->
    <div id="app" class="hidden">
        
        <!-- MENÚ HAMBURGUESA -->
        <button id="menu-toggle" aria-label="Menú">☰</button>
        
        <!-- MENÚ DESPLEGABLE -->
        <div id="menu-desplegable">
            <div class="mb-6 pb-4 border-b border-gray-200">
                <div class="font-bold text-lg text-gray-800" id="restaurante-nombre">Cargando...</div>
                <div class="text-sm text-gray-500" id="restaurante-email"></div>
            </div>
            
            <button class="menu-item active" data-view="activos">
                <span>📋</span> Pedidos Activos
                <span class="ml-auto bg-blue-100 text-blue-800 px-2 py-0.5 rounded-full text-xs" id="contador-activos">0</span>
            </button>
            
            <button class="menu-item" data-view="historial">
                <span>📊</span> Historial
            </button>
            
            <button class="menu-item" data-view="demoras">
                <span>⏱️</span> Registro de Demoras
            </button>
            
            <div class="mt-4 pt-4 border-t border-gray-200">
                <button class="menu-item danger" id="btn-cerrar-sesion">
                    <span>🚪</span> Cerrar Sesión
                </button>
            </div>
        </div>
        
        <!-- CONTENIDO PRINCIPAL -->
        <div class="contenido-principal" id="contenido-principal">
            <!-- Los pedidos se renderizan aquí -->
            <div id="lista-pedidos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Renderizado por JavaScript -->
            </div>
        </div>
        
        <!-- BOTÓN DE INSTALACIÓN PWA -->
        <button id="install-btn">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
            </svg>
            <span>Instalar App 📱</span>
        </button>
        
    </div>

    <!-- ============================================
    OVERLAY DE ORIENTACIÓN
    ============================================ -->
    <div id="orientacion-overlay" class="fixed inset-0 bg-black bg-opacity-95 z-[9999] items-center justify-center hidden">
        <div class="text-center text-white p-8">
            <div class="text-6xl mb-6 animate-pulse">🔄</div>
            <h2 class="text-2xl font-bold mb-4">¡Gira tu tableta!</h2>
            <p class="text-lg text-gray-300">
                Por favor, coloca tu dispositivo en <strong>posición horizontal</strong>
                para una mejor experiencia.
            </p>
            <div class="mt-8 flex justify-center gap-4">
                <div class="w-24 h-32 bg-blue-500 rounded-lg border-4 border-white transform rotate-90"></div>
                <span class="text-4xl text-white">→</span>
                <div class="w-32 h-24 bg-green-500 rounded-lg border-4 border-white"></div>
            </div>
            <button onclick="ocultarOverlayOrientacion()" class="mt-8 px-6 py-3 bg-white text-black rounded-lg font-semibold hover:bg-gray-200 transition">
                Continuar de todas formas
            </button>
        </div>
    </div>

    <!-- ============================================
    JAVASCRIPT PRINCIPAL
    ============================================ -->
    <script>
        // ============================================
        // 1. CONFIGURACIÓN DE FIREBASE
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyBEapmpody3y_vFyPF0ngUnCn5ZFOtxPjs",
            authDomain: "aguadulce-express-v2.firebaseapp.com",
            databaseURL: "https://aguadulce-express-v2-default-rtdb.firebaseio.com",
            projectId: "aguadulce-express-v2",
            storageBucket: "aguadulce-express-v2.appspot.com",
            messagingSenderId: "103953800507",
            appId: "1:103953800507:web:tu_app_id"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // ============================================
        // 2. VARIABLES GLOBALES
        // ============================================
        let currentUser = null;
        let currentView = 'activos';
        let pedidosListeners = [];
        let restauranteId = null;
        let deferredPrompt = null;
        let temporizadores = {};

        // ============================================
        // 3. DETECCIÓN DE ORIENTACIÓN
        // ============================================
        function detectarOrientacion() {
            const esTableta = window.innerWidth >= 768 && window.innerWidth <= 1024;
            const esVertical = window.innerHeight > window.innerWidth;
            
            if (esTableta && esVertical) {
                document.getElementById('orientacion-overlay').classList.remove('hidden');
            } else {
                document.getElementById('orientacion-overlay').classList.add('hidden');
            }
        }

        function ocultarOverlayOrientacion() {
            document.getElementById('orientacion-overlay').classList.add('hidden');
        }

        window.addEventListener('resize', detectarOrientacion);
        window.addEventListener('orientationchange', () => setTimeout(detectarOrientacion, 300));
        document.addEventListener('DOMContentLoaded', detectarOrientacion);

        // ============================================
        // 4. PWA - INSTALACIÓN
        // ============================================
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const btn = document.getElementById('install-btn');
            if (btn && !window.matchMedia('(display-mode: standalone)').matches) {
                btn.style.display = 'flex';
            }
        });

        window.addEventListener('appinstalled', () => {
            deferredPrompt = null;
            document.getElementById('install-btn').style.display = 'none';
            showToast('🎉 App instalada correctamente', 'success');
        });

        document.getElementById('install-btn').addEventListener('click', async () => {
            if (!deferredPrompt) {
                showToast('⚠️ La instalación no está disponible ahora', 'warning');
                return;
            }
            deferredPrompt.prompt();
            const result = await deferredPrompt.userChoice;
            if (result.outcome === 'accepted') {
                showToast('✅ App instalada con éxito', 'success');
            } else {
                showToast('❌ Instalación cancelada', 'error');
            }
            deferredPrompt = null;
        });

        // ============================================
        // 5. TOAST NOTIFICATIONS
        // ============================================
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(20px)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ============================================
        // 6. MENÚ HAMBURGUESA
        // ============================================
        const menuToggle = document.getElementById('menu-toggle');
        const menuDesplegable = document.getElementById('menu-desplegable');

        menuToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            menuDesplegable.classList.toggle('open');
            menuToggle.classList.toggle('active');
            menuToggle.textContent = menuDesplegable.classList.contains('open') ? '✕' : '☰';
        });

        document.addEventListener('click', (e) => {
            if (!menuDesplegable.contains(e.target) && e.target !== menuToggle) {
                menuDesplegable.classList.remove('open');
                menuToggle.classList.remove('active');
                menuToggle.textContent = '☰';
            }
        });

        // ============================================
        // 7. AUTENTICACIÓN
        // ============================================
        const loginForm = document.getElementById('login-form');
        const loginEmail = document.getElementById('login-email');
        const loginPassword = document.getElementById('login-password');
        const loginBtn = document.getElementById('login-btn');
        const loginText = document.getElementById('login-text');
        const loginLoading = document.getElementById('login-loading');
        const loginError = document.getElementById('login-error');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = loginEmail.value.trim();
            const password = loginPassword.value;
            
            if (!email || !password) {
                loginError.textContent = 'Por favor, completa todos los campos';
                loginError.classList.remove('hidden');
                return;
            }
            
            loginBtn.disabled = true;
            loginText.classList.add('hidden');
            loginLoading.classList.remove('hidden');
            loginError.classList.add('hidden');
            
            try {
                const credenciales = await auth.signInWithEmailAndPassword(email, password);
                const user = credenciales.user;
                
                // Verificar que sea un restaurante
                const snapshot = await db.ref(`restaurantes/${user.uid}`).once('value');
                if (!snapshot.exists()) {
                    await auth.signOut();
                    throw new Error('Esta cuenta no es un restaurante válido');
                }
                
                showToast('✅ Bienvenido al panel de cocina', 'success');
                
            } catch (error) {
                console.error('Error de login:', error);
                loginError.textContent = error.message;
                loginError.classList.remove('hidden');
                
                loginBtn.disabled = false;
                loginText.classList.remove('hidden');
                loginLoading.classList.add('hidden');
            }
        });

        // ============================================
        // 8. ESTADO DE AUTENTICACIÓN
        // ============================================
        auth.onAuthStateChanged(async (user) => {
            const app = document.getElementById('app');
            const loginContainer = document.getElementById('login-container');
            
            if (user) {
                currentUser = user;
                restauranteId = user.uid;
                
                // Ocultar login, mostrar app
                loginContainer.classList.add('hidden');
                app.classList.remove('hidden');
                
                // Cargar datos del restaurante
                await cargarDatosRestaurante();
                
                // Escuchar pedidos
                escucharPedidos();
                
                // Ocultar botón de instalación si ya está instalado
                if (window.matchMedia('(display-mode: standalone)').matches) {
                    document.getElementById('install-btn').style.display = 'none';
                }
                
                // SOLICITAR PERMISO DE NOTIFICACIONES DESPUÉS DEL LOGIN
                setTimeout(solicitarPermisoNotificaciones, 3000);
                
            } else {
                // Mostrar login, ocultar app
                app.classList.add('hidden');
                loginContainer.classList.remove('hidden');
                
                // Limpiar listeners
                pedidosListeners.forEach(ref => ref.off());
                pedidosListeners = [];
                
                // Resetear formulario
                loginBtn.disabled = false;
                loginText.classList.remove('hidden');
                loginLoading.classList.add('hidden');
                loginError.classList.add('hidden');
            }
        });

        // ============================================
        // 9. CERRAR SESIÓN
        // ============================================
        document.getElementById('btn-cerrar-sesion').addEventListener('click', async () => {
            if (confirm('¿Seguro que quieres cerrar sesión?')) {
                await auth.signOut();
                showToast('👋 Sesión cerrada', 'info');
            }
        });

        // ============================================
        // 10. MENÚ - CAMBIO DE VISTA
        // ============================================
        document.querySelectorAll('.menu-item[data-view]').forEach(item => {
            item.addEventListener('click', () => {
                // Actualizar vista activa
                document.querySelectorAll('.menu-item[data-view]').forEach(el => {
                    el.classList.remove('active');
                });
                item.classList.add('active');
                
                currentView = item.dataset.view;
                renderizarVista();
                
                // Cerrar menú
                menuDesplegable.classList.remove('open');
                menuToggle.classList.remove('active');
                menuToggle.textContent = '☰';
            });
        });

        // ============================================
        // 11. CARGAR DATOS DEL RESTAURANTE
        // ============================================
        async function cargarDatosRestaurante() {
            try {
                const snapshot = await db.ref(`restaurantes/${restauranteId}`).once('value');
                const data = snapshot.val();
                
                if (data) {
                    document.getElementById('restaurante-nombre').textContent = data.nombre || 'Restaurante';
                    document.getElementById('restaurante-email').textContent = data.email || '';
                }
            } catch (error) {
                console.error('Error al cargar restaurante:', error);
            }
        }

        // ============================================
        // 12. ESCUCHAR PEDIDOS
        // ============================================
        function escucharPedidos() {
            // Limpiar listeners anteriores
            pedidosListeners.forEach(ref => ref.off());
            pedidosListeners = [];
            
            const pedidosRef = db.ref('pedidos');
            
            // Escuchar nuevos pedidos
            const listener = pedidosRef.orderByChild('estado').on('value', (snapshot) => {
                renderizarVista();
            });
            
            pedidosListeners.push(pedidosRef);
        }

        // ============================================
        // 13. RENDERIZAR VISTA
        // ============================================
       function renderizarVista() {
    const container = document.getElementById('lista-pedidos');
    
    // Mostrar estado de carga
    container.innerHTML = `
        <div class="col-span-full text-center py-12 text-gray-500">
            <div class="text-4xl mb-4 animate-pulse">⏳</div>
            <p class="text-lg">Cargando pedidos...</p>
        </div>
    `;
    
    db.ref('pedidos').once('value')
        .then((snapshot) => {
            const pedidos = snapshot.val();
            
            if (!pedidos) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12 text-gray-500">
                        <div class="text-6xl mb-4">🍽️</div>
                        <p class="text-lg">No hay pedidos disponibles</p>
                        <p class="text-sm text-gray-400 mt-2">Los pedidos aparecerán aquí cuando lleguen</p>
                    </div>
                `;
                return;
            }
            
            // Filtrar pedidos según vista
            let pedidosFiltrados = [];
            const pedidosArray = Object.entries(pedidos);
            
            for (const [id, data] of pedidosArray) {
                // Solo pedidos de este restaurante (compatibilidad con ambos campos)
                if (data.restauranteId !== restauranteId && data.restaurante_id !== restauranteId) continue;
                
                if (currentView === 'activos') {
                    if (data.estado === 'pendiente' || data.estado === 'coccion' || data.estado === 'listo' || data.estado === 'reparto') {
                        pedidosFiltrados.push({ id, ...data });
                    }
                } else if (currentView === 'historial') {
                    if (data.estado === 'entregado' || data.estado === 'cancelado') {
                        pedidosFiltrados.push({ id, ...data });
                    }
                } else if (currentView === 'demoras') {
                    if (data.demora && data.demora > 0) {
                        pedidosFiltrados.push({ id, ...data });
                    }
                }
            }
            
            // Ordenar por estado y tiempo
            const ordenEstados = { pendiente: 0, coccion: 1, listo: 2, reparto: 3 };
            pedidosFiltrados.sort((a, b) => {
                const estadoA = ordenEstados[a.estado] !== undefined ? ordenEstados[a.estado] : 99;
                const estadoB = ordenEstados[b.estado] !== undefined ? ordenEstados[b.estado] : 99;
                if (estadoA !== estadoB) return estadoA - estadoB;
                return (a.timestamp || 0) - (b.timestamp || 0);
            });
            
            // Actualizar contador
            const activos = pedidosFiltrados.filter(p => 
                p.estado === 'pendiente' || p.estado === 'coccion' || p.estado === 'listo' || p.estado === 'reparto'
            );
            document.getElementById('contador-activos').textContent = activos.length;
            
            // Renderizar
            if (pedidosFiltrados.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12 text-gray-500">
                        <div class="text-6xl mb-4">📭</div>
                        <p class="text-lg">No hay pedidos en esta vista</p>
                        ${currentView === 'activos' ? '<p class="text-sm text-gray-400 mt-2">Esperando nuevos pedidos...</p>' : ''}
                    </div>
                `;
                return;
            }
            
            container.innerHTML = pedidosFiltrados.map(pedido => `
                <div class="pedido-card">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <span class="font-bold text-lg">#${pedido.id.slice(-6)}</span>
                            <span class="estado estado-${pedido.estado} ml-2">${pedido.estado}</span>
                        </div>
                        <span class="text-sm text-gray-500">${pedido.timestamp ? new Date(pedido.timestamp).toLocaleTimeString() : '--:--'}</span>
                    </div>
                    
                    <div class="mb-3">
                        <div class="font-medium">${pedido.clienteNombre || 'Cliente'}</div>
                        <div class="text-sm text-gray-500">${pedido.direccion || 'Sin dirección'}</div>
                    </div>
                    
                    <div class="mb-3">
                        <div class="text-sm font-medium">Productos:</div>
                        ${pedido.productos ? Object.entries(pedido.productos).map(([id, prod]) => `
                            <div class="text-sm text-gray-600">${prod.cantidad || 1}x ${prod.nombre}</div>
                        `).join('') : '<div class="text-sm text-gray-400">Sin productos</div>'}
                    </div>
                    
                    <div class="flex justify-between items-center mt-3 pt-3 border-t border-gray-100">
                        <div class="font-bold text-lg">${pedido.total ? `$${pedido.total.toFixed(2)}` : '$0.00'}</div>
                        <div class="space-x-2">
                            ${pedido.estado === 'pendiente' ? `
                                <button onclick="cambiarEstado('${pedido.id}', 'coccion')" class="px-3 py-1 bg-blue-500 text-white rounded-lg text-sm hover:bg-blue-600">
                                    Iniciar Cocción
                                </button>
                            ` : ''}
                            ${pedido.estado === 'coccion' ? `
                                <button onclick="cambiarEstado('${pedido.id}', 'listo')" class="px-3 py-1 bg-green-500 text-white rounded-lg text-sm hover:bg-green-600">
                                    Marcar Listo
                                </button>
                            ` : ''}
                            ${pedido.estado === 'listo' ? `
                                <button onclick="cambiarEstado('${pedido.id}', 'reparto')" class="px-3 py-1 bg-purple-500 text-white rounded-lg text-sm hover:bg-purple-600">
                                    Enviar a Reparto
                                </button>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        })
        .catch((error) => {
            console.error('Error al cargar pedidos:', error);
            container.innerHTML = `
                <div class="col-span-full text-center py-12 text-red-500">
                    <div class="text-4xl mb-4">❌</div>
                    <p class="text-lg">Error al cargar pedidos</p>
                    <p class="text-sm text-gray-400 mt-2">${error.message}</p>
                    <button onclick="renderizarVista()" class="mt-4 px-4 py-2 bg-amber-500 text-black rounded-lg font-bold">
                        🔄 Reintentar
                    </button>
                </div>
            `;
        });
}

        // ============================================
        // 14. CAMBIAR ESTADO DE PEDIDO
        // ============================================
        window.cambiarEstado = async function(pedidoId, nuevoEstado) {
            try {
                await db.ref(`pedidos/${pedidoId}/estado`).set(nuevoEstado);
                
                // Registrar en historial
                await db.ref(`pedidos/${pedidoId}/historial`).push({
                    estado: nuevoEstado,
                    timestamp: Date.now(),
                    usuario: currentUser.uid
                });
                
                showToast(`✅ Pedido actualizado a ${nuevoEstado}`, 'success');
                
                // Si es reparto, notificar al repartidor
                if (nuevoEstado === 'reparto') {
                    await notificarRepartidor(pedidoId);
                }
                
            } catch (error) {
                console.error('Error al cambiar estado:', error);
                showToast('❌ Error al actualizar pedido', 'error');
            }
        };

        // ============================================
        // 15. NOTIFICAR REPARTIDOR
        // ============================================
        async function notificarRepartidor(pedidoId) {
            try {
                // Obtener datos del pedido
                const snapshot = await db.ref(`pedidos/${pedidoId}`).once('value');
                const pedido = snapshot.val();
                
                if (!pedido) return;
                
                // Buscar repartidor disponible
                const repartidoresSnap = await db.ref('repartidores').orderByChild('estado').equalTo('activo').once('value');
                const repartidores = repartidoresSnap.val();
                
                if (!repartidores) {
                    showToast('⚠️ No hay repartidores disponibles', 'warning');
                    return;
                }
                
                // Asignar al primer repartidor disponible
                const repartidorId = Object.keys(repartidores)[0];
                
                // Actualizar pedido con repartidor
                await db.ref(`pedidos/${pedidoId}/repartidorId`).set(repartidorId);
                await db.ref(`pedidos/${pedidoId}/repartidorNombre`).set(repartidores[repartidorId].nombre);
                await db.ref(`pedidos/${pedidoId}/estado`).set('reparto');
                
                showToast(`📱 Repartidor asignado: ${repartidores[repartidorId].nombre}`, 'success');
                
            } catch (error) {
                console.error('Error al notificar repartidor:', error);
            }
        }

        // ============================================
        // 16. SOLICITAR PERMISO PARA NOTIFICACIONES PUSH
        // ============================================
        async function solicitarPermisoNotificaciones() {
            if (!('Notification' in window)) {
                console.log('❌ Este navegador no soporta notificaciones');
                return false;
            }
            
            if (Notification.permission === 'granted') {
                console.log('✅ Permiso de notificaciones ya concedido');
                // Registrar el token FCM
                await registrarTokenFCM();
                return true;
            }
            
            if (Notification.permission === 'denied') {
                console.log('❌ Permiso de notificaciones denegado');
                return false;
            }
            
            try {
                const permission = await Notification.requestPermission();
                if (permission === 'granted') {
                    console.log('✅ Permiso de notificaciones concedido');
                    await registrarTokenFCM();
                    return true;
                } else {
                    console.log('❌ Permiso de notificaciones denegado');
                    return false;
                }
            } catch (error) {
                console.error('❌ Error al solicitar permiso:', error);
                return false;
            }
        }

        // ============================================
        // 17. REGISTRAR TOKEN FCM PARA NOTIFICACIONES
        // ============================================
        async function registrarTokenFCM() {
            try {
                const messaging = firebase.messaging();
                
                // Solicitar token
                const token = await messaging.getToken({
                    vapidKey: 'TU_VAPID_KEY_AQUI'
                });
                
                console.log('📨 Token FCM obtenido:', token);
                
                // Guardar token en Firebase
                if (currentUser) {
                    await db.ref(`restaurantes/${currentUser.uid}/fcmTokens/${token}`).set(true);
                    console.log('✅ Token FCM guardado en Firebase');
                }
                
                return token;
            } catch (error) {
                console.error('❌ Error al obtener token FCM:', error);
                return null;
            }
        }

        // ============================================
        // 18. INICIALIZAR
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            // Forzar detección de orientación
            setTimeout(detectarOrientacion, 500);
            
            // Mostrar toast de bienvenida si hay usuario
            if (auth.currentUser) {
                setTimeout(() => {
                    showToast('🍳 Panel de Cocina listo', 'info');
                }, 1000);
            }
        });

        // ============================================
        // 19. LOGS DE SEGURIDAD (Opcional)
        // ============================================
        async function registrarLogSeguridad(evento, detalles = {}) {
            try {
                await db.ref('logs_seguridad').push({
                    usuario: currentUser?.uid || 'anonimo',
                    email: currentUser?.email || 'desconocido',
                    evento: evento,
                    detalles: detalles,
                    timestamp: Date.now(),
                    ip: 'desconocida',
                    dispositivo: navigator.userAgent
                });
            } catch (error) {
                console.error('Error al registrar log:', error);
            }
        }

        // Registrar inicios de sesión
        auth.onAuthStateChanged((user) => {
            if (user) {
                registrarLogSeguridad('inicio_sesion', { view: 'cocina' });
            }
        });

        console.log('🍳 Aguadulce Express - Panel de Cocina');
        console.log('📱 Versión 2.0 - Optimizado para tabletas');
    </script>

    <!-- ============================================
    CÓDIGO PARA REGISTRAR SERVICE WORKER
    (ANEXADO AL FINAL - JUSTO ANTES DE CERRAR BODY)
    ============================================ -->
    <script>
        // ============================================
        // REGISTRAR SERVICE WORKER
        // ============================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker
                    .register('/AGUADULCE_EXPRESS_APP/cocina/sw-cocina.js')
                    .then(registration => {
                        console.log('✅ Service Worker registrado:', registration);
                        
                        // Verificar actualizaciones cada 24 horas
                        setInterval(() => {
                            registration.update();
                            console.log('🔄 Buscando actualizaciones del SW...');
                        }, 24 * 60 * 60 * 1000);
                        
                        // Escuchar mensajes del SW
                        navigator.serviceWorker.addEventListener('message', event => {
                            console.log('💬 Mensaje del SW:', event.data);
                        });
                    })
                    .catch(error => {
                        console.error('❌ Error al registrar SW:', error);
                    });
            });
        }
    </script>
