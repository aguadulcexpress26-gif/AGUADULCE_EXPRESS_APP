<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repartidor - Aguadulce Express</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #020617; color: white; padding: 16px; padding-bottom: 80px; }
        .header { background: linear-gradient(135deg, #06b6d4, #020617); margin: -16px -16px 16px -16px; padding: 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .flex { display: flex; justify-content: space-between; align-items: center; }
        .btn-salir, .btn-historial { background: rgba(255,255,255,0.1); border: none; padding: 8px 16px; border-radius: 12px; color: white; cursor: pointer; font-weight: bold; font-size: 13px; }
        .repartidor-nombre { font-size: 18px; font-weight: bold; }
        .repartidor-id { font-size: 11px; color: #eab308; opacity: 0.8; margin-top: 2px; }
        .billetera-monto { font-size: 20px; font-weight: bold; color: #22c55e; }
        .status-bar { background: rgba(255,255,255,0.02); border-radius: 16px; padding: 12px; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.05); }
        .contador { background: rgba(6,182,212,0.2); color: #06b6d4; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .card { background: rgba(15,23,42,0.6); border-radius: 20px; padding: 16px; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.05); }
        .ref { background: rgba(6,182,212,0.1); padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; color: #06b6d4; }
        .status-badge { background: rgba(6,182,212,0.2); color: #06b6d4; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; }
        .direccion { font-size: 15px; font-weight: bold; margin: 14px 0; line-height: 1.4; }
        .cliente-box { background: rgba(2,6,23,0.6); border-radius: 16px; padding: 14px; margin: 12px 0; border: 1px solid rgba(255,255,255,0.02); position: relative; }
        button { width: 100%; padding: 16px; border-radius: 16px; font-weight: bold; border: none; margin-top: 12px; cursor: pointer; font-size: 14px; display: flex; justify-content: center; align-items: center; gap: 8px; transition: all 0.2s; }
        .btn-blue { background: #06b6d4; color: black; }
        .btn-yellow { background: #eab308; color: black; }
        .btn-green { background: #22c55e; color: black; font-size: 15px; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn-red { background: #ef4444; color: white; }
        .sin-pedidos { text-align: center; padding: 60px 20px; opacity: 0.5; font-size: 15px; }
        .loader { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #020617; display: flex; align-items: center; justify-content: center; flex-direction: column; z-index: 9999; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(6,182,212,0.1); border-top-color: #06b6d4; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn-accion-tel { background: #22c55e; color: black; padding: 8px 14px; border-radius: 10px; font-size: 12px; font-weight: bold; width: auto; margin: 0; text-decoration: none; }
        .btn-accion-wa { background: #25D366; color: black; padding: 8px 14px; border-radius: 10px; font-size: 12px; font-weight: bold; width: auto; margin: 0; text-decoration: none; }
        .cronometro-box { margin: 12px 0; padding: 12px; border-radius: 14px; text-align: center; font-weight: bold; font-size: 13px; letter-spacing: 0.5px; }
    </style>
</head>
<body>

<div id="loader" class="loader">
    <div class="spinner"></div>
    <p style="color:#06b6d4; margin-top: 15px; font-weight: bold; font-size: 14px;">Iniciando Panel de Reparto...</p>
</div>

<div id="app" style="display: none;">
    <div class="header">
        <div class="flex">
            <div style="display: flex; gap: 8px;">
                <button class="btn-historial" onclick="mensaje('Historial próximamente', 'info')">📋 Historial</button>
                <button class="btn-salir" onclick="cerrarSesion()">🚪 Salir</button>
            </div>
            <div style="text-align: right;">
                <div class="repartidor-nombre" id="nombreRep">Cargando...</div>
                <div class="repartidor-id" id="codigoRep"></div>
            </div>
            <div style="text-align: center; background: rgba(255,255,255,0.03); padding: 6px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);">
                <div style="font-size: 9px; opacity: 0.6; text-transform: uppercase;">Billetera</div>
                <div class="billetera-monto" id="saldo">0.00€</div>
            </div>
        </div>
    </div>

    <div class="status-bar flex">
        <span style="font-size: 13px;">🟢 <span id="estado" style="font-weight: bold; color: #22c55e;">Conectado</span></span>
        <span class="contador" id="contador">0 pedidos activos</span>
    </div>

    <div id="listaPedidos"></div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzYFDShcrP7I4FKhiH3q5UcEInpSKJstrumJ9ddI4Tj9S31ZUgwiuie81fGFmCJ6ob2/exec';
    
    let codigo = localStorage.getItem('repartidor_codigo');
    let pedidos = [];
    let intervalId = null;
    let intervalosCronometro = {};
    
    function mensaje(texto, icono) {
        Swal.fire({
            text: texto, icon: icono || 'info', background: '#020617', color: 'white',
            confirmButtonColor: '#06b6d4', timer: 2000, showConfirmButton: false
        });
    }
    
    async function cargarPedidos() {
        if (!codigo) return;
        try {
            const url = SCRIPT_URL + '?action=getPedidosReparto&idRepartidor=' + encodeURIComponent(codigo) + '&t=' + Date.now();
            const resp = await fetch(url);
            const data = await resp.json();
            
            if (data.error) {
                document.getElementById('estado').innerHTML = 'Error de Permisos';
                return;
            }
            
            pedidos = data.pedidos || [];
            document.getElementById('nombreRep').innerHTML = data.nombre || codigo;
            document.getElementById('codigoRep').innerHTML = '🔑 ' + codigo;
            document.getElementById('saldo').innerHTML = (parseFloat(data.saldo) || 0).toFixed(2) + '€';
            document.getElementById('contador').innerHTML = 'Tienes ' + pedidos.length + ' pedido' + (pedidos.length !== 1 ? 's' : '') + ' activos';
            document.getElementById('estado').innerHTML = 'Conectado';
            
            renderizar();
        } catch(e) {
            console.error("🚨 Error de sincronización:", e);
            document.getElementById('estado').innerHTML = 'Reconectando...';
        }
    }
    
    function iniciarTemporizadorReparto(id, estado) {
        if (intervalosCronometro[id]) clearInterval(intervalosCronometro[id]);

        let tiempoLimiteSegundos = (estado === 'LLEGÓ' || estado === 'LLEGO') ? 5 * 60 : 45 * 60; 

        intervalosCronometro[id] = setInterval(() => {
            const elemento = document.getElementById('cronometro-' + id);
            const contenedorBotonFalta = document.getElementById('bloque-cancelar-emergencia-' + id);
            
            if (!elemento) {
                clearInterval(intervalosCronometro[id]);
                return;
            }

            if (tiempoLimiteSegundos <= 0) {
                clearInterval(intervalosCronometro[id]);
                
                if (estado === 'LLEGÓ' || estado === 'LLEGO') {
                    elemento.style.background = 'rgba(239, 68, 68, 0.15)';
                    elemento.style.border = '1px solid #ef4444';
                    elemento.style.color = '#ef4444';
                    elemento.innerHTML = '🚨 TIEMPO DE ESPERA AGOTADO (CLIENTE AUSENTE)';
                    
                    if (contenedorBotonFalta) {
                        contenedorBotonFalta.innerHTML = `
                            <button class="btn-red" style="background: #991b1b; border: 2px solid #ef4444; color: white; margin-top: 12px;" onclick="cancelarPorAusencia('${id}')">
                                ❌ REGISTRAR AUSENCIA Y PENALIZAR CLIENTE
                            </button>
                        `;
                    }
                } else {
                    elemento.style.background = 'rgba(239, 68, 68, 0.15)';
                    elemento.style.border = '1px solid #ef4444';
                    elemento.style.color = '#ef4444';
                    elemento.innerHTML = '🚨 PEDIDO RETRASADO';
                }
                return;
            }

            tiempoLimiteSegundos--;
            const minutos = Math.floor(tiempoLimiteSegundos / 60);
            const segundos = tiempoLimiteSegundos % 60;
            const textoSegundos = segundos < 10 ? "0" + segundos : segundos;

            if (estado === 'LLEGÓ' || estado === 'LLEGO') {
                elemento.style.background = 'rgba(234, 179, 8, 0.1)';
                elemento.style.border = '1px solid rgba(234, 179, 8, 0.3)';
                elemento.style.color = '#eab308';
                elemento.innerHTML = '📦 TIEMPO DE ESPERA AL CLIENTE: ' + minutos + ':' + textoSegundos;
            } else {
                elemento.style.background = 'rgba(6, 182, 212, 0.1)';
                elemento.style.border = '1px solid rgba(6, 182, 212, 0.3)';
                elemento.style.color = '#06b6d4';
                elemento.innerHTML = '🛵 TIEMPO ESTIMADO DE ENTREGA: ' + minutos + ':' + textoSegundos;
            }
        }, 1000);
    }

    function renderizar() {
        const container = document.getElementById('listaPedidos');
        
        if (!pedidos.length) {
            for (let k in intervalosCronometro) clearInterval(intervalorsCronometro[k]);
            intervalosCronometro = {};
            container.innerHTML = '<div class="sin-pedidos">📭 Sin pedidos asignados</div>';
            return;
        }
        
        let html = '';
        let cronometrosPorActivar = [];

        for (let p of pedidos) {
            const estado = (p.ESTADO || '').toUpperCase();
            const total = parseFloat(p.TOTAL) || 0;
            const metodoPago = p.PAGO || 'Efectivo';
            
            const telefono = p.telf || p.WHATSAPP || p.telefono || p.TELEFONO || '';
            const telefonoLimpio = telefono.replace(/\D/g, '');
            
            let infoCambioHTML = '';
            if (metodoPago.toLowerCase() === 'efectivo') {
                const pagaConStr = p.PAGA_CON || p.PAGA || p.paga_con || '';
                const pagaCon = parseFloat(pagaConStr) || 0;
                
                if (pagaCon > 0 && pagaCon > total) {
                    const cambio = pagaCon - total;
                    infoCambioHTML = `
                        <div style="position: absolute; bottom: 12px; right: 14px; font-size: 11px; text-align: right;">
                            <span style="opacity: 0.6; display:block;">Paga con: <strong style="color: #eab308;">${pagaCon.toFixed(2)}€</strong></span>
                            <span style="display:block; margin-top:2px;">Cambio: <strong style="color: #22c55e; font-weight:bold;">${cambio.toFixed(2)}€</strong></span>
                        </div>
                    `;
                } else {
                    infoCambioHTML = `
                        <div style="position: absolute; bottom: 12px; right: 14px; font-size: 11px; opacity: 0.6;">
                            <span style="color: #eab308; font-weight: bold;">Llevar cambio</span>
                        </div>
                    `;
                }
            }

            let cronometroHTML = '';
            if (estado === 'EN CAMINO' || estado === 'LLEGÓ' || estado === 'LLEGO') {
                cronometroHTML = `
                    <div id="cronometro-${p.ID_PEDIDO}" class="cronometro-box" style="background: rgba(6,182,212,0.05); color: #06b6d4;">
                        ⏳ CARGANDO TIEMPO...
                    </div>
                `;
                cronometrosPorActivar.push({ id: p.ID_PEDIDO, estado: estado });
            }

            let botones = '';
            if (estado === 'LISTO' || estado === 'PREPARADO' || estado === 'RECIBIDO') {
                botones = '<button class="btn-blue" onclick="recoger(\'' + p.ID_PEDIDO + '\')">🏍️ RECOGER PEDIDO</button>';
            } else if (estado === 'EN CAMINO') {
                botones = '<button class="btn-yellow" onclick="llegada(\'' + p.ID_PEDIDO + '\')">📍 HE LLEGADO AL DOMICILIO</button>';
            } else if (estado === 'LLEGÓ' || estado === 'LLEGO') {
                botones = '<button class="btn-green" onclick="entregar(\'' + p.ID_PEDIDO + '\', ' + total + ')">💰 CONFIRMAR COBRO Y ENTREGA</button>';
            }
            
            html += '<div class="card">';
            html += '<div class="flex">';
            html += '<span class="ref">📋 REF: ' + p.ID_PEDIDO + '</span>';
            html += '<span class="status-badge">' + estado + '</span>';
            html += '</div>';
            html += '<div class="direccion">📍 ' + (p.DIRECCION || 'Sin dirección') + '</div>';
            
            html += '<div class="cliente-box">';
            html += '<div style="color: #a855f7; font-weight: bold; font-size: 14px;">👤 ' + (p.CLIENTE || 'Cliente') + '</div>';
            html += '<div class="flex mt-2" style="margin-top: 10px; justify-content: flex-start; gap: 10px;">';
            html += '<span style="font-size: 13px; opacity: 0.8;">📞 ' + (telefono || 'No disponible') + '</span>';
            if (telefonoLimpio) {
                html += '<a href="tel:' + telefonoLimpio + '" class="btn-accion-tel">Llamar</a>';
                html += '<a href="https://wa.me/' + telefonoLimpio + '" target="_blank" class="btn-accion-wa">WhatsApp</a>';
            }
            html += '</div>';
            html += '<div style="font-size:12px; opacity:0.7; margin-top: 12px;">💳 Método: <strong>' + metodoPago + '</strong></div>';
            html += infoCambioHTML;
            html += '</div>';
            
            html += cronometroHTML;

            html += '<div class="flex" style="margin: 14px 0; border-top: 1px solid rgba(255,255,255,0.02); padding-top: 12px;">';
            html += '<div><span style="font-size:12px; opacity:0.5;">Total a recibir:</span></div>';
            html += '<div><span style="color:#22c55e; font-size:20px; font-weight:bold;">' + total.toFixed(2) + '€</span></div>';
            html += '</div>';
            
            html += '<a href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.DIRECCION || '') + '" target="_blank" style="display:block; text-align:center; background: rgba(255,255,255,0.05); color: #06b6d4; padding: 10px; border-radius: 12px; font-size: 12px; font-weight: bold; margin-bottom: 4px; border: 1px solid rgba(6,182,212,0.1);">🗺️ Abrir Mapa de Ruta</a>';
            
            html += botones;
            html += `<div id="bloque-cancelar-emergencia-${p.ID_PEDIDO}"></div>`;
            html += '</div>';
        }
        
        container.innerHTML = html;

        // EJECUCIÓN SEGURA: Los cronómetros se activan CUANDO el HTML ya existe físicamente.
        cronometrosPorActivar.forEach(cron => {
            iniciarTemporizadorReparto(cron.id, cron.estado);
        });
    }
    
    window.recoger = async function(id) {
        try {
            await fetch(SCRIPT_URL + '?action=actualizarEstado&idPedido=' + id + '&nuevoEstado=EN CAMINO');
            mensaje('✅ Pedido en camino', 'success');
            cargarPedidos();
        } catch(e) { console.error(e); }
    };
    
    window.llegada = async function(id) {
        try {
            await fetch(SCRIPT_URL + '?action=actualizarEstado&idPedido=' + id + '&nuevoEstado=LLEGÓ');
            mensaje('📍 Ubicación alcanzada', 'success');
            cargarPedidos();
        } catch(e) { console.error(e); }
    };
    
    window.entregar = function(id, total) {
        Swal.fire({
            title: '💰 Cobrar ' + total.toFixed(2) + '€',
            text: '¿Confirmas la entrega física y el cobro correcto?',
            icon: 'question', background: '#020617', color: 'white',
            confirmButtonColor: '#22c55e', confirmButtonText: '✅ Confirmar',
            showCancelButton: true, cancelButtonText: 'Cancelar'
        }).then(async (res) => {
            if (res.isConfirmed) {
                try {
                    await fetch(SCRIPT_URL + '?action=finalizarEntrega&idPedido=' + id + '&total=' + total + '&idRepartidor=' + codigo);
                    mensaje('🎉 ¡Entrega finalizada con éxito!', 'success');
                    cargarPedidos();
                } catch(e) { console.error(e); }
            }
        });
    };

    window.cancelarPorAusencia = function(id) {
        Swal.fire({
            title: '⚠️ ¿REGISTRAR AUSENCIA?',
            text: 'Se cancelará el pedido, se enviará la notificación al cliente y se le cargará el monto total como deuda pendiente en su cuenta de Aguadulce Express.',
            icon: 'warning', background: '#020617', color: 'white',
            confirmButtonColor: '#ef4444', confirmButtonText: '❌ Sí, Penalizar Cliente',
            showCancelButton: true, cancelButtonText: 'Esperar un poco más'
        }).then(async (res) => {
            if (res.isConfirmed) {
                try {
                    const url = SCRIPT_URL + '?action=actualizarEstado&idPedido=' + encodeURIComponent(id) + '&nuevoEstado=CANCELADO&tiempo=' + encodeURIComponent('Cliente no recogió el pedido - Ausencia');
                    await fetch(url);
                    mensaje('❌ Ausencia registrada y cuenta penalizada.', 'error');
                    cargarPedidos();
                } catch(e) { console.error(e); }
            }
        });
    };
    
    window.cerrarSesion = function() {
        if (intervalId) clearInterval(intervalId);
        for (let k in intervalosCronometro) clearInterval(intervalosCronometro[k]);
        localStorage.removeItem('repartidor_codigo');
        location.reload();
    };
    
    async function iniciarApp() {
        if (!codigo) {
            const res = await Swal.fire({
                title: '🔐 Código de Repartidor',
                input: 'text', inputPlaceholder: 'Ej: R001',
                background: '#020617', color: 'white',
                confirmButtonColor: '#06b6d4', allowOutsideClick: false
            });
            if (res.value) {
                codigo = res.value.trim().toUpperCase();
                localStorage.setItem('repartidor_codigo', codigo);
            } else {
                location.reload();
                return;
            }
        }
        await cargarPedidos();
        intervalId = setInterval(cargarPedidos, 10000);
        
        document.getElementById('loader').style.display = 'none';
        document.getElementById('app').style.display = 'block';
    }
    
    iniciarApp();
</script>
</body>
</html>
