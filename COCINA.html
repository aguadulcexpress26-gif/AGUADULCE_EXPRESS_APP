<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aguadulce Express - Cocina Profesional</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #020617; color: #f8fafc; font-family: system-ui, sans-serif; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        .btn-touch-active:active { transform: scale(0.98); opacity: 0.9; }
        .pedido-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 1.5rem; padding: 1rem; transition: all 0.2s; }
        .timer-cocina { background: rgba(234,179,8,0.1); border: 1px solid rgba(234,179,8,0.3); border-radius: 1rem; padding: 0.5rem; text-align: center; font-weight: bold; margin: 0.5rem 0; }
        .badge { background: rgba(6,182,212,0.2); color: #06b6d4; padding: 0.2rem 0.7rem; border-radius: 2rem; font-size: 0.75rem; font-weight: bold; }
    </style>
</head>
<body>

<div id="loginScreen" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px;">
    <h1 class="text-3xl font-black italic uppercase text-cyan-400 mb-8">Aguadulce Cocina</h1>
    <input type="password" id="pinInput" maxlength="6" class="w-full max-w-[250px] p-4 rounded-2xl bg-white/5 border border-white/10 text-center text-2xl tracking-widest text-white">
    <button onclick="verificarPIN()" class="mt-6 bg-cyan-400 text-black px-8 py-3 rounded-2xl font-black">Ingresar</button>
</div>

<div id="appContent" style="display: none;">
    <div class="relative w-full h-44 bg-slate-900 overflow-hidden border-b border-slate-800">
        <img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=1200&q=80" class="absolute inset-0 w-full h-full object-cover opacity-25">
        <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-black/50"></div>
        <div class="absolute inset-0 flex justify-between items-center p-6">
            <div class="flex items-center gap-4">
                <img src="https://i.postimg.cc/mZwjLXxw/Logo-Aguadulce-Express.jpg" class="w-12 h-12 rounded-xl border-2 border-cyan-500">
                <div>
                    <h1 id="nombreRestaurante" class="text-2xl font-black text-white">CARGANDO...</h1>
                    <span id="txtEstado" class="text-xs bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full">ABIERTO</span>
                </div>
            </div>
            <div class="flex gap-3">
                <button onclick="abrirHistorial()" class="bg-white/10 p-2 rounded-xl">📋</button>
                <button onclick="preguntarSalir()" class="bg-white/10 p-2 rounded-xl">🚪</button>
            </div>
        </div>
    </div>

    <main class="p-6 max-w-[1600px] mx-auto">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- NUEVOS -->
            <div class="bg-slate-900/40 rounded-2xl p-4 border border-slate-800">
                <div class="flex justify-between mb-3">
                    <h3 class="font-bold text-cyan-400">📥 Nuevos Entrantes</h3>
                    <span id="badgeNuevos" class="badge">0</span>
                </div>
                <div id="listaNuevos" class="space-y-4 max-h-[70vh] overflow-y-auto"></div>
            </div>
            <!-- PREPARACIÓN -->
            <div class="bg-slate-900/40 rounded-2xl p-4 border border-slate-800">
                <div class="flex justify-between mb-3">
                    <h3 class="font-bold text-amber-400">🍳 En Preparación</h3>
                    <span id="badgeProceso" class="badge">0</span>
                </div>
                <div id="listaProceso" class="space-y-4 max-h-[70vh] overflow-y-auto"></div>
            </div>
            <!-- LISTOS -->
            <div class="bg-slate-900/40 rounded-2xl p-4 border border-slate-800">
                <div class="flex justify-between mb-3">
                    <h3 class="font-bold text-emerald-400">✅ Listos para Reparto</h3>
                    <span id="badgeListos" class="badge">0</span>
                </div>
                <div id="listaListos" class="space-y-4 max-h-[70vh] overflow-y-auto"></div>
            </div>
        </div>
    </main>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCJcLQ0ikUwZSV7L_8mLLax8B5qnhP0Roc",
        authDomain: "aguadulce-notificaciones.firebaseapp.com",
        databaseURL: "https://aguadulce-notificaciones-default-rtdb.firebaseio.com",
        projectId: "aguadulce-notificaciones",
        storageBucket: "aguadulce-notificaciones.firebasestorage.app",
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const ACCESS_DB = { "DELI10":"6G4L1V", "CHUN20":"RT33M5", "HARO30":"8N3Z7K", "SUCU40":"TR92X5" };
    const scriptURL = "https://script.google.com/macros/s/AKfycbzYFDShcrP7I4FKhiH3q5UcEInpSKJstrumJ9ddI4Tj9S31ZUgwiuie81fGFmCJ6ob2/exec";

    let MI_ID_REST = localStorage.getItem('AE_REST_ID') || "";
    let pedidosActivos = [];
    let aceptados = new Set();
    let intervalosSonido = {};
    let sonidosActivados = false;

    function verificarPIN() {
        let pin = document.getElementById('pinInput').value.trim().toUpperCase();
        if (ACCESS_DB[pin]) {
            MI_ID_REST = ACCESS_DB[pin];
            localStorage.setItem('AE_REST_ID', MI_ID_REST);
            iniciarApp();
        } else {
            Swal.fire({ title: 'PIN Incorrecto', icon: 'error' });
        }
    }

    async function iniciarApp() {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('appContent').style.display = 'block';
        await cargarPedidos();
        database.ref('pedidosActivos').on('value', () => cargarPedidos());
        setInterval(() => {
            document.querySelectorAll('[id^="timer-"]').forEach(el => {
                let timestamp = parseInt(el.getAttribute('data-timestamp'));
                if (timestamp) {
                    let diff = timestamp - Date.now();
                    if (diff <= 0) el.innerHTML = "✅ LISTO";
                    else {
                        let m = Math.floor(diff / 60000);
                        let s = Math.floor((diff % 60000) / 1000);
                        el.innerHTML = `⏳ ${m}:${s < 10 ? '0' + s : s}`;
                    }
                }
            });
        }, 1000);
    }

    async function cargarPedidos() {
        let r = await fetch(`${scriptURL}?action=leerPanelCompleto&idRest=${MI_ID_REST}&t=${Date.now()}`);
        let data = await r.json();
        pedidosActivos = (data.pedidos || []).sort((a,b)=>new Date(a.FECHA)-new Date(b.FECHA));
        document.getElementById('nombreRestaurante').innerText = data.tienda?.nombre || "Restaurante";
        renderColumnas();
    }

    function renderColumnas() {
        let nuevos = pedidosActivos.filter(p => !aceptados.has(p.ID_PEDIDO));
        let enProceso = pedidosActivos.filter(p => aceptados.has(p.ID_PEDIDO) && p.ESTADO !== 'LISTO');
        let listos = pedidosActivos.filter(p => p.ESTADO === 'LISTO');

        document.getElementById('badgeNuevos').innerText = nuevos.length;
        document.getElementById('badgeProceso').innerText = enProceso.length;
        document.getElementById('badgeListos').innerText = listos.length;

        document.getElementById('listaNuevos').innerHTML = nuevos.map(p => renderCard(p, 'nuevo')).join('');
        document.getElementById('listaProceso').innerHTML = enProceso.map(p => renderCard(p, 'proceso')).join('');
        document.getElementById('listaListos').innerHTML = listos.map(p => renderCard(p, 'listo')).join('');
    }

    function renderCard(p, tipo) {
        let total = parseFloat(p.TOTAL).toFixed(2);
        let tiempoHtml = p.timestamp_fin_elaboracion ? `<div id="timer-${p.ID_PEDIDO}" data-timestamp="${p.timestamp_fin_elaboracion}" class="timer-cocina">⏳ --:--</div>` : '';
        let botones = '';
        if (tipo === 'nuevo') {
            botones = `<div class="flex gap-2 mt-3">
                <button onclick="asignarTiempo('${p.ID_PEDIDO}',15)" class="bg-cyan-500 text-black px-3 py-2 rounded-xl text-sm font-bold">15 MIN</button>
                <button onclick="asignarTiempo('${p.ID_PEDIDO}',30)" class="bg-cyan-500 text-black px-3 py-2 rounded-xl text-sm font-bold">30 MIN</button>
                <button onclick="asignarTiempo('${p.ID_PEDIDO}',45)" class="bg-cyan-500 text-black px-3 py-2 rounded-xl text-sm font-bold">45 MIN</button>
                <button onclick="rechazarPedido('${p.ID_PEDIDO}')" class="bg-red-600 text-white px-3 py-2 rounded-xl text-sm font-bold">❌</button>
            </div>`;
        } else if (tipo === 'proceso') {
            botones = `<button onclick="confirmarListo('${p.ID_PEDIDO}')" class="w-full bg-amber-500 text-black font-bold py-2 rounded-xl mt-2">✅ LISTO</button>`;
        } else if (tipo === 'listo') {
            botones = `<div class="text-emerald-400 text-center text-sm font-bold">🟢 ESPERANDO REPARTIDOR</div>`;
        }
        return `
            <div class="pedido-card">
                <div class="flex justify-between">
                    <span class="text-cyan-400 font-bold">#${p.ID_PEDIDO}</span>
                    <span class="text-white font-bold">${total}€</span>
                </div>
                <div class="text-white font-semibold mt-1">${p.CLIENTE}</div>
                <div class="text-xs text-slate-400">📍 ${p.DIRECCION}</div>
                ${tiempoHtml}
                ${botones}
                <button onclick="verDetalles('${p.ID_PEDIDO}')" class="w-full text-xs text-slate-400 mt-2">📄 Ver ticket</button>
            </div>
        `;
    }

    async function asignarTiempo(id, min) {
        let timestampFin = Date.now() + (min * 60 * 1000);
        aceptados.add(id);
        await database.ref('pedidos/'+id).update({ 
            estado: 'en proceso',
            timestamp_fin_elaboracion: timestampFin,
            tiempo_elaboracion: min
        });
        await fetch(`${scriptURL}?action=actualizarEstado&idPedido=${id}&nuevoEstado=EN PROCESO&tiempo=${min}`);
        cargarPedidos();
    }

    async function rechazarPedido(id) {
        let { value: motivo } = await Swal.fire({ title: 'Motivo del rechazo', input: 'select', inputOptions: { 'No disponible':'📦 Plato no disponible','Ingredientes':'🥬 Sin ingredientes','Otro':'📝 Otro' } });
        if (!motivo) return;
        await fetch(`${scriptURL}?action=actualizarEstado&idPedido=${id}&nuevoEstado=RECHAZADO&tiempo=${motivo}`);
        aceptados.delete(id);
        cargarPedidos();
    }

    async function confirmarListo(id) {
        await database.ref('pedidos/'+id).update({ estado: 'listo', timestamp_listo: Date.now() });
        await fetch(`${scriptURL}?action=actualizarEstado&idPedido=${id}&nuevoEstado=LISTO`);
        cargarPedidos();
    }

    function verDetalles(id) {
        let p = pedidosActivos.find(x => x.ID_PEDIDO == id);
        if (p) Swal.fire({ title: `Pedido #${id}`, html: `<strong>${p.CLIENTE}</strong><br>📍 ${p.DIRECCION}<br><br>📦 ${p.PEDIDO_DETALLE}`, icon: 'info' });
    }

    function abrirHistorial() { Swal.fire({ title: '📋 Historial', text: 'Función en desarrollo', icon: 'info' }); }
    function preguntarSalir() { localStorage.removeItem('AE_REST_ID'); location.reload(); }
    window.onload = () => { if (MI_ID_REST) iniciarApp(); };
</script>
</body>
</html>
