<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cocina Express - Aguadulce</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --cyan: #06b6d4; --dark: #020617; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--dark); color: white; }
        
        .pedido-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 2rem; padding: 20px; margin-bottom: 15px; transition: all 0.2s; }
        .pedido-card.nuevo { animation: pulse-card 1s ease-in-out; background: rgba(6,182,212,0.15); }
        @keyframes pulse-card { 0% { background: rgba(6,182,212,0.4); } 100% { background: rgba(255,255,255,0.05); } }
        
        .pedido-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .pedido-id { font-weight: 900; font-size: 18px; color: var(--cyan); }
        .pedido-cliente { font-size: 12px; opacity: 0.7; }
        .pedido-total { font-weight: 900; font-size: 18px; color: var(--cyan); }
        
        .tiempos { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-tiempo { flex: 1; text-align: center; padding: 10px; border-radius: 16px; font-weight: 900; font-size: 12px; cursor: pointer; transition: transform 0.1s; background: rgba(255,255,255,0.05); }
        .btn-tiempo:active { transform: scale(0.95); }
        .t-15 { background: rgba(6,182,212,0.2); color: var(--cyan); }
        .t-30 { background: rgba(6,182,212,0.2); color: var(--cyan); }
        .t-45 { background: rgba(6,182,212,0.2); color: var(--cyan); }
        
        .acciones { display: flex; gap: 10px; }
        .btn-aceptar { flex: 1; background: var(--cyan); color: black; padding: 12px; border-radius: 16px; font-weight: 900; font-size: 12px; border: none; cursor: pointer; }
        .btn-aceptar.aceptado { background: #22c55e; color: white; }
        .btn-detalles { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 12px; border-radius: 16px; font-weight: 900; font-size: 12px; cursor: pointer; }
        .btn-listo { flex: 1; background: #eab308; color: black; padding: 12px; border-radius: 16px; font-weight: 900; font-size: 12px; border: none; cursor: pointer; }
        .btn-rechazar { flex: 1; background: #ef4444; color: white; padding: 12px; border-radius: 16px; font-weight: 900; font-size: 12px; border: none; cursor: pointer; }
        
        .tiempo { font-size: 10px; opacity: 0.5; margin-top: 5px; }
        
        .sidebar { position: fixed; top: 0; right: -100%; width: 85%; max-width: 350px; height: 100%; background: #0f172a; z-index: 2000; transition: 0.3s ease; padding: 20px; overflow-y: auto; }
        .sidebar.open { right: 0; }
        .historial-card { background: #1e293b; border-radius: 16px; padding: 12px; margin-bottom: 10px; cursor: pointer; }
        
        .loader { position: fixed; inset: 0; background: var(--dark); z-index: 500; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(6,182,212,0.1); border-top-color: var(--cyan); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .estado-badge { padding: 4px 12px; border-radius: 20px; font-size: 10px; font-weight: 900; }
        .estado-badge.abierto { background: #22c55e; color: black; }
        .estado-badge.cerrado { background: #ef4444; color: white; }
        
        .hidden { display: none; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .text-center { text-align: center; }
        .mb-2 { margin-bottom: 8px; }
        .mt-2 { margin-top: 8px; }

        button:active { transform: scale(0.96); transition: transform 0.05s; }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        .swal2-select-custom {
            background-color: #1e293b !important;
            color: white !important;
            border: 1px solid #06b6d4 !important;
            border-radius: 12px !important;
            padding: 12px !important;
            font-size: 14px !important;
        }
        .swal2-select-custom option {
            background-color: #0f172a !important;
            color: white !important;
            padding: 10px !important;
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>

<div id="loader" class="loader">
    <div class="spinner"></div>
    <p style="color:#06b6d4; margin-top: 15px; font-weight: bold; tracking-widest;">SINCRONIZANDO COCINA EXPRESS...</p>
</div>

<div id="loginScreen" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px;">
    <h1 class="text-3xl font-black italic uppercase text-cyan-400 mb-8">Aguadulce</h1>
    <p class="text-white/50 text-xs mb-4">🔐 INGRESA TU PIN DE ACCESO</p>
    <input type="password" id="pinInput" maxlength="6" class="w-full max-w-[250px] p-4 rounded-2xl bg-white/5 border border-white/10 text-center text-2xl tracking-widest text-white focus:outline-none focus:border-cyan-400">
    <button onclick="verificarPIN()" class="mt-6 bg-cyan-400 text-black px-8 py-3 rounded-2xl font-black uppercase tracking-wider transition-transform active:scale-95">Ingresar</button>
</div>

<div id="appContent" class="hidden">
    <div class="p-5">
        <div class="flex-between mb-6">
            <button onclick="preguntarSalir()" class="p-3 bg-white/5 border border-white/10 rounded-2xl active:scale-95 transition-transform">🚪</button>
            <div class="text-center">
                <h1 id="resNombreDisplay" class="text-xl font-black italic uppercase">CARGANDO...</h1>
                <div class="flex gap-2 items-center justify-center mt-1">
                    <span id="txtEstado" class="estado-badge">---</span>
                    <span class="contador-pendientes" id="contadorPendientes" style="background: #ef4444; color: white; padding: 2px 10px; border-radius: 20px; font-size: 10px; font-weight: bold;">0</span>
                </div>
            </div>
            <div class="text-right">
                <div class="text-[8px] opacity-50 font-bold">HOY / SEMANA</div>
                <div class="text-sm font-bold"><span id="statHoy">0.00</span>€ / <span id="statSemana">0.00</span>€</div>
                <label class="flex items-center gap-2 mt-1 justify-end">
                    <span class="text-[10px]">🔌</span>
                    <input type="checkbox" id="tiendaToggle" onchange="confirmarToggleTienda()" class="rounded bg-white/10 border-white/20 text-cyan-400 focus:ring-0">
                </label>
            </div>
        </div>

        <div class="flex gap-2 mb-4">
            <button onclick="abrirHistorial()" class="flex-1 bg-white/5 border border-white/10 py-3 rounded-2xl text-[10px] font-black uppercase tracking-wider active:scale-[0.98] transition-transform">📋 Historial de Entregas</button>
        </div>

        <div id="lista" class="space-y-4 pb-32"></div>
    </div>
</div>

<div id="sideHistorial" class="sidebar">
    <div class="flex-between mb-6 border-b border-white/10 pb-3">
        <h2 class="text-xl font-black italic text-cyan-400">HISTORIAL</h2>
        <button onclick="cerrarHistorial()" class="p-2 bg-white/10 rounded-xl text-xs">✕</button>
    </div>
    <div id="listaHistorial" class="space-y-3">Cargando...</div>
</div>

<!-- Sonidos para la cocina -->
<audio id="audio-nuevo-pedido" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
</audio>
<audio id="audio-aceptar" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3" type="audio/mpeg">
</audio>
<audio id="audio-rechazar" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/2582/2582-preview.mp3" type="audio/mpeg">
</audio>
<audio id="audio-listo" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3" type="audio/mpeg">
</audio>

<script>
    // ==========================================
    // SISTEMA DE SONIDOS PARA COCINA
    // ==========================================
    let audioNuevoPedido = null;
    let audioAceptar = null;
    let audioRechazar = null;
    let audioListo = null;
    let intervalosSonido = {};
    let sonidosActivados = false;

    function initSonidosCocina() {
        audioNuevoPedido = document.getElementById('audio-nuevo-pedido');
        audioAceptar = document.getElementById('audio-aceptar');
        audioRechazar = document.getElementById('audio-rechazar');
        audioListo = document.getElementById('audio-listo');
        
        if (audioNuevoPedido) audioNuevoPedido.load();
        if (audioAceptar) audioAceptar.load();
        if (audioRechazar) audioRechazar.load();
        if (audioListo) audioListo.load();
    }

    // Activar sonidos después de la primera interacción del usuario
    function activarSonidos() {
        if (!sonidosActivados) {
            sonidosActivados = true;
            console.log("🔊 Sonidos activados por interacción del usuario");
            // Reproducir un sonido de prueba silencioso para activar
            if (audioAceptar) {
                audioAceptar.volume = 0;
                audioAceptar.play().then(() => {
                    audioAceptar.pause();
                    audioAceptar.currentTime = 0;
                    audioAceptar.volume = 0.8;
                }).catch(e => console.log("Test de audio:", e));
            }
        }
    }

    function playSoundNuevoPedidoRepetitivo(idPedido) {
        if (audioNuevoPedido && sonidosActivados) {
            if (intervalosSonido[idPedido]) {
                clearInterval(intervalosSonido[idPedido]);
            }
            
            const clone = audioNuevoPedido.cloneNode(true);
            clone.volume = 0.8;
            clone.play().catch(e => console.log('Audio necesita interacción'));
            
            intervalosSonido[idPedido] = setInterval(() => {
                if (sonidosActivados) {
                    const nuevoClone = audioNuevoPedido.cloneNode(true);
                    nuevoClone.volume = 0.8;
                    nuevoClone.play().catch(e => console.log('Audio necesita interacción'));
                }
            }, 5000);
        }
    }

    function detenerSonidoRepetitivo(idPedido) {
        if (intervalosSonido[idPedido]) {
            clearInterval(intervalosSonido[idPedido]);
            delete intervalosSonido[idPedido];
            console.log(`🔇 Sonido repetitivo detenido para pedido ${idPedido}`);
        }
    }

    function playSoundAceptar() {
        if (audioAceptar && sonidosActivados) {
            const clone = audioAceptar.cloneNode(true);
            clone.volume = 0.8;
            clone.play().catch(e => console.log('Audio necesita interacción'));
        }
    }

    function playSoundRechazar() {
        if (audioRechazar && sonidosActivados) {
            const clone = audioRechazar.cloneNode(true);
            clone.volume = 0.8;
            clone.play().catch(e => console.log('Audio necesita interacción'));
        }
    }

    function playSoundListo() {
        if (audioListo && sonidosActivados) {
            const clone = audioListo.cloneNode(true);
            clone.volume = 0.8;
            clone.play().catch(e => console.log('Audio necesita interacción'));
        }
    }

    // ==========================================
    // CONFIGURACIÓN FIREBASE
    // ==========================================
    const firebaseConfig = {
        apiKey: "AIzaSyCJcLQ0ikUwZSV7L_8mLLax8B5qnhP0Roc",
        authDomain: "aguadulce-notificaciones.firebaseapp.com",
        databaseURL: "https://aguadulce-notificaciones-default-rtdb.firebaseio.com",
        projectId: "aguadulce-notificaciones",
        storageBucket: "aguadulce-notificaciones.firebasestorage.app",
        messagingSenderId: "940283725281",
        appId: "1:940283725281:web:3b388d2e7f362a99d2bea0"
    };
    
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    
    const ACCESS_DB = { "DELI10":"6G4L1V", "CHUN20":"RT33M5", "HARO30":"8N3Z7K", "SUCU40":"TR92X5", "PERU50":"9V1L8K", "LIMA60":"FL44K8", "PECA70":"CV11Q9" };
    const scriptURL = "https://script.google.com/macros/s/AKfycbzYFDShcrP7I4FKhiH3q5UcEInpSKJstrumJ9ddI4Tj9S31ZUgwiuie81fGFmCJ6ob2/exec";

    let MI_ID_REST = localStorage.getItem('AE_REST_ID') || "";
    let pedidosActivos = [], historialHoy = [], aceptados = new Set(), tiendaAbierta = false, ultimoConteo = 0;
    let audioNotif = null;
    let intervaloTiempos = null;
    
    function initAudio() {
        audioNotif = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
        audioNotif.volume = 0.8;
        audioNotif.preload = 'auto';
    }
    
    function playSound() {
        if (audioNotif && sonidosActivados) {
            const clone = audioNotif.cloneNode(true);
            clone.volume = 0.8;
            clone.play().catch(e => console.log('Audio en espera de interacción:', e));
        }
    }
    
    function mostrarMensaje(titulo, texto, icono) {
        Swal.fire({ title: titulo, text: texto, icon: icono, background: '#020617', color: 'white', confirmButtonColor: '#06b6d4' });
    }
    
    window.onload = async () => { 
        initAudio(); 
        if(MI_ID_REST) {
            await iniciarApp();
        } else {
            document.getElementById('loader').style.display = 'none';
        }
    };
    
    function verificarPIN() {
        let pin = document.getElementById('pinInput').value.trim().toUpperCase();
        if (ACCESS_DB[pin]) {
            MI_ID_REST = ACCESS_DB[pin];
            localStorage.setItem('AE_REST_ID', MI_ID_REST);
            document.getElementById('loader').style.display = 'flex';
            iniciarApp();
        } else { 
            mostrarMensaje('PIN Incorrecto', 'El código ingresado no es válido', 'error');
        }
    }
    
    async function iniciarApp() {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('appContent').classList.remove('hidden');
        
        initAudio();
        initSonidosCocina();
        
        await cargar();
        
        database.ref('pedidosActivos').on('value', () => {
            cargar();
        });
        
        if (intervaloTiempos) clearInterval(intervaloTiempos);
        intervaloTiempos = setInterval(actualizarContadores, 1000);
        
        document.getElementById('loader').style.display = 'none';
        
        // Activar sonidos en la primera interacción con cualquier botón
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', activarSonidos, { once: true });
        });
    }
    
    async function cargar() {
        if (!MI_ID_REST) return;
        try {
            const r = await fetch(`${scriptURL}?action=leerPanelCompleto&idRest=${MI_ID_REST}&t=${Date.now()}`);
            const data = await r.json();
            
            if(data.tienda) {
                document.getElementById('resNombreDisplay').innerText = data.tienda.nombre || "Establecimiento";
                tiendaAbierta = (data.tienda.estado || "").toLowerCase() === "abierto";
                document.getElementById('tiendaToggle').checked = tiendaAbierta;
                let txtE = document.getElementById('txtEstado');
                txtE.innerText = tiendaAbierta ? "ABIERTO" : "CERRADO";
                txtE.className = tiendaAbierta ? "estado-badge abierto" : "estado-badge cerrado";
            }
            
            let stats = data.stats || {};
            document.getElementById('statHoy').innerHTML = (parseFloat(stats.diaria) || 0).toFixed(2) + "€";
            document.getElementById('statSemana').innerHTML = (parseFloat(stats.semanal) || 0).toFixed(2) + "€";
            
            // El restaurante SOLO ve pedidos en RECIBIDO o EN PROCESO
            const todosPedidos = data.pedidos || [];
            const pedidosFiltrados = todosPedidos.filter(p => {
                const estado = (p.ESTADO || '').toUpperCase();
                return estado === 'RECIBIDO' || estado === 'EN PROCESO';
            });
            
            const nuevosIds = pedidosFiltrados.map(p => p.ID_PEDIDO);
            const realmenteNuevos = nuevosIds.filter(id => !aceptados.has(id));
            
            if (realmenteNuevos.length > 0 && aceptados.size > 0 && sonidosActivados) {
                playSound();
                realmenteNuevos.forEach(id => {
                    playSoundNuevoPedidoRepetitivo(id);
                });
                mostrarMensaje('📦 Nuevo Pedido', 'Tienes un nuevo pedido en la lista', 'info');
                if(navigator.vibrate) navigator.vibrate(500);
            }
            
            pedidosActivos = pedidosFiltrados.sort((a,b)=>new Date(a.FECHA)-new Date(b.FECHA));
            
            // ==========================================
            // HISTORIAL: Incluir TODOS los pedidos que ya no están en cocina
            // ==========================================
            const pedidosHistorial = todosPedidos.filter(p => {
                const estado = (p.ESTADO || '').toUpperCase();
                return estado === 'LISTO' || estado === 'ENTREGADO' || estado === 'CANCELADO' || estado === 'RECHAZADO' || estado === 'EN CAMINO' || estado === 'LLEGÓ';
            });
            
            historialHoy = pedidosHistorial;
            
            ultimoConteo = pedidosActivos.filter(p=>!aceptados.has(p.ID_PEDIDO)).length;
            document.getElementById('contadorPendientes').innerText = ultimoConteo;
            
            // Limpiar sonidos de pedidos que ya no están activos
            Object.keys(intervalosSonido).forEach(id => {
                const sigueActivo = pedidosActivos.some(p => p.ID_PEDIDO === id && !aceptados.has(id));
                if (!sigueActivo) {
                    detenerSonidoRepetitivo(id);
                }
            });
            
            render();
        } catch(e) { 
            console.error("Error en consulta remota panel de cocina:", e); 
        }
    }
    
    function render() {
        let cont = document.getElementById('lista');
        if(pedidosActivos.length === 0) { 
            cont.innerHTML = '<div class="text-center py-20 opacity-20 font-bold tracking-widest text-sm">SIN PEDIDOS ACTIVOS</div>'; 
            return; 
        }
        
        cont.innerHTML = pedidosActivos.map(p => {
            const esNuevo = !aceptados.has(p.ID_PEDIDO);
            return `
            <div class="pedido-card ${esNuevo ? 'nuevo' : ''}" data-id="${p.ID_PEDIDO}">
                <div class="pedido-header">
                    <div>
                        <div class="pedido-id">#${p.ID_PEDIDO}</div>
                        <div class="pedido-cliente font-bold text-white/90 mt-0.5">${p.CLIENTE}</div>
                        <div class="tiempo font-medium text-white/50">⏱️ ${calcularTiempo(p.FECHA)}</div>
                    </div>
                    <div class="pedido-total">${parseFloat(p.TOTAL).toFixed(2)}€</div>
                </div>
                <div class="tiempos">
                    <div onclick="asignarTiempo('${p.ID_PEDIDO}',15)" class="btn-tiempo t-15">15 MIN</div>
                    <div onclick="asignarTiempo('${p.ID_PEDIDO}',30)" class="btn-tiempo t-30">30 MIN</div>
                    <div onclick="asignarTiempo('${p.ID_PEDIDO}',45)" class="btn-tiempo t-45">45 MIN</div>
                </div>
                <div class="acciones">
                    <button onclick="aceptarPedido('${p.ID_PEDIDO}')" class="btn-aceptar ${aceptados.has(p.ID_PEDIDO) ? 'aceptado' : ''}">${aceptados.has(p.ID_PEDIDO) ? '✓ ACEPTADO' : 'ACEPTAR'}</button>
                    <button onclick="verDetalles('${p.ID_PEDIDO}')" class="btn-detalles">DETALLES</button>
                    <button onclick="rechazarPedido('${p.ID_PEDIDO}')" class="btn-rechazar">RECHAZAR</button>
                    <button onclick="confirmarListo('${p.ID_PEDIDO}')" class="btn-listo">LISTO</button>
                </div>
            </div>
        `}).join('');
    }
    
    function calcularTiempo(fechaStr) {
        if(!fechaStr) return "---";
        let diff = Math.floor((new Date() - new Date(fechaStr)) / 60000);
        if(diff < 1) return "Ahora mismo";
        if(diff < 60) return `Hace ${diff} min`;
        return `Hace ${Math.floor(diff/60)}h ${diff%60}min`;
    }
    
    async function aceptarPedido(id) { 
        const btn = event.target;
        btn.disabled = true;
        btn.innerHTML = '⏳ PROCESANDO...';
        
        detenerSonidoRepetitivo(id);
        
        aceptados.add(id); 
        let ahora = Date.now();
        let timestampFin = ahora + (20 * 60 * 1000);
        try {
            await database.ref('pedidos/'+id).update({ 
                estado: 'en proceso',
                tiempo_elaboracion: 20,
                timestamp_inicio: ahora,
                timestamp_fin_elaboracion: timestampFin
            });
            await fetch(`${scriptURL}?action=actualizarEstado&idPedido=${id}&nuevoEstado=EN PROCESO`);
            playSoundAceptar();
            render(); 
            cargar();
        } catch(err) {
            console.error(err);
        } finally {
            btn.disabled = false;
            btn.innerHTML = '✓ ACEPTADO';
            btn.classList.add('aceptado');
        }
    }
    
    async function asignarTiempo(id, min) {
        const btn = event.target;
        btn.disabled = true;
        btn.innerHTML = '⏳...';
        
        let ahora = Date.now();
        let timestampFin = ahora + (min * 60 * 1000);
        let horaStr = new Date(timestampFin).getHours().toString().padStart(2,'0') + ":" + new Date(timestampFin).getMinutes().toString().padStart(2,'0');
        
        try {
            await database.ref('pedidos/'+id).update({ 
                tiempo_elaboracion: min,
                timestamp_inicio: ahora,
                timestamp_fin_elaboracion: timestampFin,
                tiempoEstimado: min, 
                horaSalida: horaStr
            });
            
            await fetch(`${scriptURL}?action=actualizarEstado&idPedido=${id}&nuevoEstado=EN PROCESO&tiempo=${min}`);
            cargar();
            
            Swal.fire({
                title: '⏳ Tiempo Asignado',
                text: `Pedido #${id} listo a las ${horaStr}`,
                icon: 'success',
                background: '#020617',
                color: 'white',
                timer: 1500,
                showConfirmButton: false
            });
        } catch(e) {
            console.error(e);
        } finally {
            btn.disabled = false;
            btn.innerHTML = `${min} MIN`;
        }
    }
    
    async function rechazarPedido(id) {
        const btn = event.target;
        btn.disabled = true;
        btn.innerHTML = '⏳...';
        
        detenerSonidoRepetitivo(id);
        
        const { value: motivo } = await Swal.fire({
            title: '❌ Rechazar Pedido',
            text: 'Motivo del rechazo:',
            input: 'select',
            inputOptions: {
                'No disponible': '📦 Plato no disponible en este momento',
                'Ingredientes': '🥬 Ingredientes agotados',
                'Capacidad': '🏭 Restaurante a máxima capacidad',
                'Horario': '⏰ Fuera de horario de preparación',
                'Otro': '📝 Otro motivo (especificar)'
            },
            inputPlaceholder: 'Selecciona un motivo...',
            icon: 'warning',
            background: '#020617',
            color: 'white',
            confirmButtonColor: '#ef4444',
            confirmButtonText: 'Rechazar',
            cancelButtonText: 'Cancelar',
            showCancelButton: true,
            customClass: {
                input: 'swal2-select-custom'
            }
        });
        
        if (!motivo) {
            btn.disabled = false;
            btn.innerHTML = 'RECHAZAR';
            return;
        }
        
        let motivoTexto = motivo;
        if (motivo === 'Otro') {
            const { value: otro } = await Swal.fire({
                title: 'Especifica el motivo',
                input: 'text',
                inputPlaceholder: 'Ej: Problemas con el pedido...',
                background: '#020617',
                color: 'white',
                confirmButtonText: 'Aceptar',
                cancelButtonText: 'Cancelar',
                showCancelButton: true
            });
            if (otro) motivoTexto = otro;
        }
        
        try {
            await fetch(`${scriptURL}?action=actualizarEstado&idPedido=${id}&nuevoEstado=RECHAZADO&tiempo=${encodeURIComponent(motivoTexto)}`);
            await database.ref('pedidos/'+id).update({ 
                estado: 'rechazado',
                motivo_rechazo: motivoTexto,
                timestamp_rechazo: Date.now()
            });
            playSoundRechazar();
            
            Swal.fire({
                title: '❌ Pedido Rechazado',
                text: `Motivo: ${motivoTexto}`,
                icon: 'error',
                background: '#020617',
                color: 'white',
                timer: 2000,
                showConfirmButton: false
            });
            cargar();
        } catch(e) {
            console.error(e);
        } finally {
            btn.disabled = false;
            btn.innerHTML = 'RECHAZAR';
        }
    }
    
    function verDetalles(id) { 
        let p = [...pedidosActivos, ...historialHoy].find(x=>x.ID_PEDIDO==id); 
        if(p) {
            let textoMetodo = p.PAGO || 'Efectivo';
            let informacionPagoExtra = '';
            let pagaCon = parseFloat(p.PAGA_CON) || 0;
            if(pagaCon > 0 && textoMetodo.toUpperCase().includes('EFECTIVO')) {
                let cambio = pagaCon - (parseFloat(p.TOTAL) || 0);
                informacionPagoExtra = `<br><strong>💵 Paga con:</strong> ${pagaCon.toFixed(2)}€ (Cambio: ${cambio > 0 ? cambio.toFixed(2) : '0.00'}€)`;
            }

            Swal.fire({
                title: `Pedido #${p.ID_PEDIDO}`,
                html: `<div id="ticketModalView" style="text-align:left; font-size: 14px; line-height: 1.6;">
                    <strong>👤 Cliente:</strong> ${p.CLIENTE}<br>
                    <strong>📍 Dirección:</strong> ${p.DIRECCION || 'No especificada'}<br>
                    <strong>💳 Método de Pago:</strong> ${textoMetodo}${informacionPagoExtra}<br><br>
                    <strong style="border-bottom: 1px dashed rgba(255,255,255,0.2); display:block; padding-bottom:4px;">📋 DETALLE DEL PEDIDO:</strong>
                    <div style="background: rgba(255,255,255,0.03); padding: 10px; border-radius: 8px; margin-top: 6px; font-family: monospace; white-space: pre-wrap; color: #06b6d4;">${p.PEDIDO_DETALLE || ''}</div><br>
                    <strong>💰 Total:</strong> <span style="font-size:16px; color:#22c55e; font-weight:bold;">${parseFloat(p.TOTAL).toFixed(2)}€</span>
                </div>`,
                icon: 'info',
                background: '#020617',
                color: 'white',
                showCancelButton: true,
                confirmButtonColor: '#06b6d4',
                cancelButtonColor: '#1e293b',
                confirmButtonText: '🖨️ Imprimir Ticket',
                cancelButtonText: 'Cerrar'
            }).then((result) => {
                if (result.isConfirmed) {
                    imprimirTicketFisico(p);
                }
            });
        }
    }

    function imprimirTicketFisico(pedido) {
        const ventanaImpresion = window.open('', '_blank', 'width=600,height=600');
        
        let cambioTexto = '';
        let pagaCon = parseFloat(pedido.PAGA_CON) || 0;
        if(pagaCon > 0 && (pedido.PAGO || '').toUpperCase().includes('EFECTIVO')) {
            let vuelto = pagaCon - (parseFloat(pedido.TOTAL) || 0);
            cambioTexto = `
                <p><strong>Paga Con:</strong> ${pagaCon.toFixed(2)}€</p>
                <p><strong>Cambio a Llevar:</strong> ${vuelto > 0 ? vuelto.toFixed(2) : '0.00'}€</p>
            `;
        }

        ventanaImpresion.document.write(`
            <html>
            <head>
                <title>Ticket_Pedido_${pedido.ID_PEDIDO}</title>
                <style>
                    body { 
                        font-family: 'Courier New', Courier, monospace; 
                        color: #000; 
                        background: #fff; 
                        padding: 10px; 
                        font-size: 14px; 
                        width: 100%;
                        max-width: 280px;
                        margin: 0 auto;
                    }
                    .text-center { text-align: center; }
                    .separator { border-top: 1px dashed #000; margin: 10px 0; }
                    .id-pedido { font-size: 22px; font-weight: bold; margin: 5px 0; }
                    .detalle-productos { white-space: pre-wrap; font-size: 13px; font-weight: bold; margin: 10px 0; }
                    .total { font-size: 16px; font-weight: bold; text-align: right; }
                </style>
            </head>
            <body>
                <div class="text-center">
                    <h2 style="margin:0; font-size:16px;">AGUADULCE EXPRESS</h2>
                    <p style="margin:2px 0; font-size:11px;">Control de Cocina y Embalaje</p>
                    <div class="separator"></div>
                    <div class="id-pedido">TICKET #${pedido.ID_PEDIDO}</div>
                    <p style="margin:2px 0; font-size:11px;">${new Date().toLocaleString('es-ES')}</p>
                </div>
                <div class="separator"></div>
                <p><strong>Cliente:</strong> ${pedido.CLIENTE}</p>
                <p><strong>Dirección:</strong> ${pedido.DIRECCION || 'Para Recoger'}</p>
                <div class="separator"></div>
                <div class="detalle-productos">${pedido.PEDIDO_DETALLE || ''}</div>
                <div class="separator"></div>
                <p><strong>Pago:</strong> ${pedido.PAGO || 'Efectivo'}</p>
                ${cambioTexto}
                <div class="total">TOTAL: ${parseFloat(pedido.TOTAL).toFixed(2)}€</div>
                <div class="separator"></div>
                <div class="text-center" style="font-size:11px; margin-top:15px;">
                    ¡Buen servicio!<br>Verifica bien la bolsa antes de salir.
                </div>
                <script>
                    window.onload = function() {
                        window.print();
                        setTimeout(function(){ window.close(); }, 500);
                    };
                <\/script>
            </body>
            </html>
        `);
        ventanaImpresion.document.close();
    }
    
    function confirmarListo(id) {
        Swal.fire({
            title: '¿Pedido listo?',
            text: `El repartidor será notificado inmediatamente`,
            icon: 'question',
            background: '#020617',
            color: 'white',
            confirmButtonColor: '#eab308',
            confirmButtonText: '✅ Sí, listo',
            showCancelButton: true,
            cancelButtonText: 'Cancelar'
        }).then(async (result) => {
            if (result.isConfirmed) {
                const btn = document.querySelector(`button[onclick="confirmarListo('${id}')"]`);
                if (btn) btn.disabled = true;
                await ejecutarListo(id);
                if (btn) btn.disabled = false;
            }
        });
    }

    async function ejecutarListo(id) {
        let timestampFin = Date.now();
        try {
            await database.ref('pedidos/'+id).update({ 
                estado: 'listo',
                timestamp_fin_elaboracion: timestampFin,
                timestamp_listo: timestampFin
            });
            await fetch(`${scriptURL}?action=actualizarEstado&idPedido=${id}&nuevoEstado=LISTO`);
            playSoundListo();
            
            // Eliminar de la lista activa inmediatamente
            aceptados.delete(id);
            pedidosActivos = pedidosActivos.filter(p => p.ID_PEDIDO !== id);
            
            Swal.fire({
                title: '✅ Pedido Listo',
                text: 'Repartidor notificado automáticamente',
                icon: 'success',
                background: '#020617',
                color: 'white',
                timer: 1500,
                showConfirmButton: false
            });
            
            render();
            cargar(); // Recargar para actualizar stats
        } catch(e) {
            console.error(e);
        }
    }
    
    function confirmarToggleTienda() { 
        let nuevo = !tiendaAbierta ? "Abierto" : "Cerrado"; 
        Swal.fire({
            title: `¿Cambiar estado a ${nuevo.toUpperCase()}?`,
            text: tiendaAbierta ? 'Al cerrar, no se recibirán nuevos pedidos' : 'Al abrir, se recibirán pedidos normalmente',
            icon: 'question',
            background: '#020617',
            color: 'white',
            confirmButtonColor: '#06b6d4',
            confirmButtonText: 'Confirmar',
            showCancelButton: true
        }).then(async (result) => {
            if (result.isConfirmed) {
                await ejecutarToggle(nuevo);
            } else {
                document.getElementById('tiendaToggle').checked = tiendaAbierta;
            }
        });
    }
    
    async function ejecutarToggle(estado) { 
        try {
            await fetch(`${scriptURL}?action=toggleTienda&idRest=${MI_ID_REST}&sheet=configuracion&nuevoEstado=${estado}`); 
            setTimeout(cargar,1000); 
        } catch(e) {
            console.error(e);
        }
    }
    
    function preguntarSalir() {
        Swal.fire({
            title: '¿Cerrar sesión?',
            icon: 'question',
            background: '#020617',
            color: 'white',
            confirmButtonColor: '#ef4444',
            confirmButtonText: 'Sí, salir',
            showCancelButton: true
        }).then(result => {
            if (result.isConfirmed) {
                localStorage.removeItem('AE_REST_ID');
                location.reload();
            }
        });
    }
    
    function abrirHistorial() {
        let lista = document.getElementById('listaHistorial');
        
        if(historialHoy.length === 0) {
            lista.innerHTML = '<div class="text-center opacity-50 text-xs py-10">Ningún pedido registrado</div>';
        } else {
            lista.innerHTML = historialHoy.map(p => {
                const estado = (p.ESTADO || '').toUpperCase();
                let estadoTexto = '';
                if (estado === 'LISTO') estadoTexto = '🔔 LISTO PARA REPARTIDOR';
                else if (estado === 'EN CAMINO') estadoTexto = '🛵 EN REPARTO';
                else if (estado === 'LLEGÓ') estadoTexto = '📍 LLEGÓ AL CLIENTE';
                else if (estado === 'ENTREGADO') estadoTexto = '✅ ENTREGADO';
                else if (estado === 'CANCELADO') estadoTexto = '❌ CANCELADO';
                else if (estado === 'RECHAZADO') estadoTexto = '🚫 RECHAZADO';
                else estadoTexto = estado;
                
                return `
                <div class="historial-card cursor-pointer active:scale-95 transition-transform" onclick="cerrarHistorial(); verDetalles('${p.ID_PEDIDO}')">
                    <div class="flex-between">
                        <span class="text-cyan-400 font-bold font-mono">#${p.ID_PEDIDO}</span>
                        <span class="font-bold text-emerald-400">${parseFloat(p.TOTAL).toFixed(2)}€</span>
                    </div>
                    <div class="text-xs mt-1 text-white/70 font-semibold">${p.CLIENTE}</div>
                    <div class="text-[9px] mt-1 text-cyan-400/70">${estadoTexto}</div>
                </div>
            `}).join('');
        }
        document.getElementById('sideHistorial').classList.add('open');
    }
    
    function cerrarHistorial() { 
        document.getElementById('sideHistorial').classList.remove('open'); 
    }
    
    function actualizarContadores() {
        document.querySelectorAll('.tiempo-contador').forEach(el => {
            const target = parseInt(el.getAttribute('data-time'));
            if (!target) return;
            const ahora = Date.now();
            const diff = target - ahora;
            if (diff <= 0) {
                el.innerHTML = "🔔 ¡LISTO!";
                el.style.background = "#22c55e20";
                el.style.color = "#22c55e";
            } else {
                const min = Math.floor(diff / 60000);
                const seg = Math.floor((diff % 60000) / 1000);
                el.innerHTML = `⏳ ${min}m ${seg}s`;
            }
        });
    }
