<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aguadulce Express - Repartidor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f0f4f8; color: #1e293b; }
        .card { background: white; border-radius: 24px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #e2e8f0; }
        .btn-primary { background: #3b82f6; color: white; font-weight: 700; padding: 14px; border-radius: 60px; width: 100%; border: none; cursor: pointer; }
        .btn-success { background: #22c55e; color: white; font-weight: 700; padding: 14px; border-radius: 60px; width: 100%; border: none; cursor: pointer; }
        .btn-danger { background: #ef4444; color: white; font-weight: 700; padding: 14px; border-radius: 60px; width: 100%; border: none; cursor: pointer; }
        .btn-warning { background: #f97316; color: white; font-weight: 700; padding: 14px; border-radius: 60px; width: 100%; border: none; cursor: pointer; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 50px; font-size: 11px; font-weight: 700; }
        .badge-blue { background: #dbeafe; color: #1d4ed8; }
        .badge-green { background: #dcfce7; color: #15803d; }
        .badge-orange { background: #ffedd5; color: #c2410c; }
        .badge-purple { background: #f3e8ff; color: #7e22ce; }
        .modal-capa { position: fixed; inset: 0; background: white; z-index: 200; display: none; flex-direction: column; overflow-y: auto; }
        .modal-header { padding: 20px; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; background: white; z-index: 10; }
        .timer-grande { font-size: 48px; font-weight: 800; text-align: center; color: #ef4444; font-family: monospace; }
        .tab { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid #e2e8f0; }
        .tab button { background: none; border: none; padding: 12px 16px; font-weight: 600; color: #64748b; cursor: pointer; }
        .tab button.active { color: #3b82f6; border-bottom: 2px solid #3b82f6; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .contador-coccion { background: #dbeafe; border-radius: 12px; padding: 10px; text-align: center; margin: 10px 0; }
        .contador-coccion .tiempo { font-size: 24px; font-weight: 800; color: #1d4ed8; }
        .boton-opciones { background: #64748b; color: white; padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 600; width: 100%; border: none; cursor: pointer; margin-top: 10px; }
        .contador-ausencia { background: #fee2e2; border: 2px solid #ef4444; border-radius: 16px; padding: 15px; margin-top: 15px; text-align: center; }
    </style>
</head>
<body>

<div id="loginScreen" class="min-h-screen flex flex-col items-center justify-center p-5" style="background: #f0f4f8;">
    <div class="text-center mb-8">
        <div class="text-6xl mb-4">🛵</div>
        <h1 class="text-3xl font-black text-slate-800">Aguadulce</h1>
        <p class="text-slate-500 text-xs mt-2">Área de Repartidores</p>
    </div>
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-lg">
        <input type="text" id="repartidorNombre" placeholder="Nombre" class="w-full p-3 rounded-xl bg-slate-50 border border-slate-200 mb-3">
        <input type="password" id="repartidorPass" placeholder="Contraseña" class="w-full p-3 rounded-xl bg-slate-50 border border-slate-200 mb-4">
        <button onclick="loginRepartidor()" class="btn-primary">Ingresar</button>
    </div>
</div>

<div id="dashboardPanel" class="hidden min-h-screen pb-24">
    <div class="bg-white border-b border-slate-200 p-4 sticky top-0 z-10">
        <div class="flex justify-between items-center">
            <div><h1 class="text-xl font-black">🛵 Repartidor</h1><p id="repartidorNombreDisplay" class="text-slate-500 text-xs"></p></div>
            <button onclick="logoutRepartidor()" class="bg-slate-100 text-slate-600 px-4 py-2 rounded-full text-sm">🚪 Salir</button>
        </div>
    </div>
    <div class="p-4">
        <div class="grid grid-cols-3 gap-3 mb-6">
            <div class="bg-white rounded-xl p-3 text-center shadow-sm"><div class="text-[10px] text-slate-400">📦 Por Recoger</div><div class="text-2xl font-bold text-blue-600" id="totalPorRecoger">0</div></div>
            <div class="bg-white rounded-xl p-3 text-center shadow-sm"><div class="text-[10px] text-slate-400">🛵 En Camino</div><div class="text-2xl font-bold text-purple-600" id="totalEnCamino">0</div></div>
            <div class="bg-white rounded-xl p-3 text-center shadow-sm"><div class="text-[10px] text-slate-400">💰 Ganancias Hoy</div><div class="text-2xl font-bold text-emerald-600" id="totalGanadoHoy">0</div></div>
        </div>
        <div class="tab"><button id="tab-activos" class="active" onclick="cambiarTab('activos')">📋 En Curso</button><button id="tab-historial" onclick="cambiarTab('historial')">📜 Historial</button></div>
        <div id="listaActivos" class="tab-content active space-y-3"></div>
        <div id="listaHistorial" class="tab-content space-y-3"></div>
    </div>
</div>

<div id="modalOpciones" class="modal-capa">
    <div class="modal-header"><button onclick="cerrarModalOpciones()">←</button><h2 class="font-bold text-lg">🔧 Opciones del Pedido</h2></div>
    <div class="modal-body" id="opcionesContent"></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCJcLQ0ikUwZSV7L_8mLLax8B5qnhP0Roc",
        authDomain: "aguadulce-notificaciones.firebaseapp.com",
        databaseURL: "https://aguadulce-notificaciones-default-rtdb.firebaseio.com",
        projectId: "aguadulce-notificaciones",
        storageBucket: "aguadulce-notificaciones.firebasestorage.app",
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    
    let repartidorActual = null, pedidosListener = null, pedidoActual = null, temporizadorAusencia = null, avisoEnviado = false;
    
    const mensajesPredefinidos = {
        'ya_llegue': '📍 ¡Hola! Ya llegué a tu dirección, estoy en la puerta.',
        'esperando': '⏰ ¡Hola! Estoy esperando en la puerta. ¿Puedes salir?',
        'timbre': '🔔 ¡Hola! He llamado al timbre. Por favor, sal a recibir tu pedido.'
    };
    
    function escapeHTML(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }
    function sanitizarEmail(email) { return email ? email.replace(/\./g, '_') : ''; }
    function cerrarModalOpciones() { document.getElementById('modalOpciones').style.display = 'none'; if (temporizadorAusencia) clearInterval(temporizadorAusencia); }
    function cambiarTab(tab) {
        document.getElementById('listaActivos').classList.toggle('active', tab === 'activos');
        document.getElementById('listaHistorial').classList.toggle('active', tab === 'historial');
        document.getElementById('tab-activos').classList.toggle('active', tab === 'activos');
        document.getElementById('tab-historial').classList.toggle('active', tab === 'historial');
    }
    
    async function loginRepartidor() {
        const nombre = document.getElementById('repartidorNombre').value.trim();
        const password = document.getElementById('repartidorPass').value;
        const snapshot = await database.ref('repartidores').once('value');
        const repartidores = snapshot.val() || {};
        let encontrado = null;
        for (const [id, data] of Object.entries(repartidores)) {
            if (data.nombre === nombre && data.password === password && data.activo !== false) { encontrado = { id, ...data }; break; }
        }
        if (encontrado) {
            repartidorActual = encontrado;
            localStorage.setItem('repartidor_actual', JSON.stringify(repartidorActual));
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboardPanel').classList.remove('hidden');
            document.getElementById('repartidorNombreDisplay').innerText = repartidorActual.nombre;
            iniciarEscuchaPedidos();
        } else Swal.fire({ title: 'Error', text: 'Credenciales incorrectas', icon: 'error' });
    }
    
    function logoutRepartidor() { if (pedidosListener && pedidosListener.off) pedidosListener.off(); localStorage.removeItem('repartidor_actual'); location.reload(); }
    
    if (localStorage.getItem('repartidor_actual')) {
        repartidorActual = JSON.parse(localStorage.getItem('repartidor_actual'));
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('dashboardPanel').classList.remove('hidden');
        document.getElementById('repartidorNombreDisplay').innerText = repartidorActual.nombre;
        iniciarEscuchaPedidos();
    }
    
    function iniciarEscuchaPedidos() {
        if (pedidosListener) pedidosListener.off();
        pedidosListener = database.ref('pedidos').on('value', (snapshot) => {
            const todosPedidos = snapshot.val() || {};
            const activos = [], historial = [];
            for (const [id, data] of Object.entries(todosPedidos)) {
                if (data.repartidor_asignado !== repartidorActual.nombre) continue;
                if (data.estado === 'ENTREGADO' || data.estado === 'CANCELADO_POR_AUSENCIA') historial.push({ id, ...data });
                else activos.push({ id, ...data });
            }
            activos.sort((a,b) => (b.fecha||0)-(a.fecha||0));
            historial.sort((a,b) => (b.fecha||0)-(a.fecha||0));
            renderizarActivos(activos);
            renderizarHistorial(historial);
            actualizarContadores(activos);
        });
    }
    
    function actualizarContadores(pedidos) {
        const porRecoger = pedidos.filter(p => p.estado === 'LISTO' || p.estado === 'COCCIÓN').length;
        const enCamino = pedidos.filter(p => p.estado === 'EN_REPARTO').length;
        document.getElementById('totalPorRecoger').innerText = porRecoger;
        document.getElementById('totalEnCamino').innerText = enCamino;
    }
    
    function renderizarActivos(pedidos) {
        const container = document.getElementById('listaActivos');
        if (pedidos.length === 0) { container.innerHTML = '<div class="text-center text-slate-400 p-10">📭 No hay pedidos activos</div>'; return; }
        container.innerHTML = '';
        for (const p of pedidos) {
            const estado = p.estado || '';
            let badgeClass = 'badge-blue', badgeText = '📦 Por recoger', colorBorder = '#3b82f6';
            
            if (estado === 'COCCIÓN') { badgeClass = 'badge-orange'; badgeText = '⏱️ En preparación'; colorBorder = '#f97316'; }
            else if (estado === 'LISTO') { badgeClass = 'badge-blue'; badgeText = '📦 Por recoger'; colorBorder = '#3b82f6'; }
            else if (estado === 'EN_REPARTO') { badgeClass = 'badge-purple'; badgeText = '🛵 En reparto'; colorBorder = '#8b5cf6'; }
            else if (estado === 'EN_PUERTA') { badgeClass = 'badge-orange'; badgeText = '🔔 En la puerta'; colorBorder = '#f97316'; }
            
            let tiempoHtml = '';
            if (p.tiempo_restante && estado === 'COCCIÓN') {
                tiempoHtml = `<div class="contador-coccion"><div class="tiempo" id="timer-${p.id}">${p.tiempo_restante} min</div><div class="text-xs">tiempo restante</div></div>`;
                iniciarContadorTiempo(p.id, p.tiempo_restante);
            }
            
            container.innerHTML += `
                <div class="card" style="border-left: 4px solid ${colorBorder};">
                    <div class="flex justify-between items-start">
                        <div><span class="text-blue-600 font-bold text-sm">#${p.id_pedido || p.id.substring(0,8)}</span><p class="font-bold">${escapeHTML(p.cliente_nombre)}</p><p class="text-slate-500 text-xs">${escapeHTML(p.direccion || 'Sin dirección')}</p></div>
                        <div class="text-right"><span class="text-emerald-600 font-bold">${(p.total||0).toFixed(2)}€</span><div class="badge ${badgeClass} mt-1">${badgeText}</div></div>
                    </div>
                    ${tiempoHtml}
                    <button onclick="abrirOpciones('${p.id}')" class="boton-opciones">🔧 Opciones</button>
                </div>
            `;
        }
    }
    
    function renderizarHistorial(pedidos) {
        const container = document.getElementById('listaHistorial');
        if (pedidos.length === 0) { container.innerHTML = '<div class="text-center text-slate-400 p-10">📭 No hay pedidos</div>'; return; }
        container.innerHTML = '';
        for (const p of pedidos) {
            const estado = p.estado === 'ENTREGADO' ? '✅ Entregado' : '❌ Cancelado';
            container.innerHTML += `<div class="card bg-slate-50"><div class="flex justify-between"><div><span class="font-bold text-sm">#${p.id_pedido || p.id.substring(0,8)}</span><p class="text-sm">${escapeHTML(p.cliente_nombre)}</p></div><div class="text-right"><span class="font-bold">${(p.total||0).toFixed(2)}€</span><div class="badge badge-green mt-1">${estado}</div></div></div></div>`;
        }
    }
    
    function iniciarContadorTiempo(pedidoId, minutos) { }
    
    async function abrirOpciones(pedidoId) {
        const snapshot = await database.ref(`pedidos/${pedidoId}`).once('value');
        pedidoActual = snapshot.val();
        if (!pedidoActual) return;
        avisoEnviado = pedidoActual.aviso_enviado === true;
        window.pedidoActualId = pedidoId;
        const estado = pedidoActual.estado || '';
        const contenido = document.getElementById('opcionesContent');
        
        let html = `<div class="bg-slate-50 rounded-xl p-4 mb-4"><p><strong>Cliente:</strong> ${escapeHTML(pedidoActual.cliente_nombre)}</p><p><strong>Total:</strong> ${(pedidoActual.total||0).toFixed(2)}€</p><p><strong>Dirección:</strong> ${escapeHTML(pedidoActual.direccion)}</p><p><strong>Teléfono:</strong> ${pedidoActual.cliente_telefono || 'No disponible'}</p></div>`;
        
        if (estado === 'COCCIÓN') {
            html += `<div class="space-y-3"><button onclick="verDetalleCompleto('${pedidoId}')" class="btn-secondary w-full">📋 Ver detalle</button><button onclick="abrirGPS('${pedidoId}')" class="btn-primary w-full">🗺️ GPS al restaurante</button><button onclick="cerrarModalOpciones()" class="btn-secondary w-full">⏳ Esperando preparación</button></div>`;
        } else if (estado === 'LISTO') {
            html += `<div class="space-y-3"><button onclick="verDetalleCompleto('${pedidoId}')" class="btn-secondary w-full">📋 Ver detalle</button><button onclick="abrirGPS('${pedidoId}')" class="btn-primary w-full">🗺️ GPS al restaurante</button><button onclick="marcarRecogido('${pedidoId}')" class="btn-success w-full">🛵 Recoger pedido</button></div>`;
        } else if (estado === 'EN_REPARTO') {
            html += `<div class="space-y-3"><button onclick="verDetalleCompleto('${pedidoId}')" class="btn-secondary w-full">📋 Ver detalle</button><button onclick="abrirGPS('${pedidoId}')" class="btn-primary w-full">🗺️ GPS al cliente</button><button onclick="marcarLlegado('${pedidoId}')" class="btn-warning w-full">📍 Llegué a la dirección</button></div>`;
        } else if (estado === 'EN_PUERTA') {
            html += `<div class="space-y-3"><button onclick="verDetalleCompleto('${pedidoId}')" class="btn-secondary w-full">📋 Ver detalle</button><button onclick="llamarCliente('${pedidoId}')" class="btn-primary w-full">📞 Llamar al cliente</button>`;
            if (!avisoEnviado) {
                html += `<div class="bg-blue-50 rounded-xl p-3"><p class="font-bold mb-2">📱 Enviar aviso al cliente:</p><button onclick="enviarMensajeCliente('${pedidoId}', 'ya_llegue')" class="w-full bg-blue-500 text-white py-2 rounded-xl mb-2">📍 "Ya llegué, estoy en la puerta"</button><button onclick="enviarMensajeCliente('${pedidoId}', 'esperando')" class="w-full bg-blue-500 text-white py-2 rounded-xl mb-2">⏰ "Estoy esperando, ¿puedes salir?"</button><button onclick="enviarMensajeCliente('${pedidoId}', 'timbre')" class="w-full bg-blue-500 text-white py-2 rounded-xl">🔔 "He llamado al timbre"</button></div>`;
            } else {
                html += `<div class="bg-green-100 rounded-xl p-3 text-center"><p class="text-green-600">✅ Aviso enviado al cliente</p></div>`;
                html += `<div class="contador-ausencia"><p class="text-red-600 font-bold">⏰ Esperando al cliente...</p><div class="timer-grande" id="contadorTiempo">6:00</div><button id="btnCancelarAusencia" onclick="cancelarPorAusencia('${pedidoId}')" class="w-full bg-red-500 text-white py-2 rounded-xl font-bold mt-3 hidden">❌ Cancelar por ausencia</button></div>`;
            }
            if (!avisoEnviado) html += `<button class="btn-success w-full mt-2" disabled style="opacity:0.5">💰 Cobrar (requiere aviso)</button>`;
            else html += `<button onclick="entregarPedido('${pedidoId}')" class="btn-success w-full mt-2">💰 Cobrar y Entregar</button>`;
            html += `</div>`;
        }
        
        contenido.innerHTML = html;
        document.getElementById('modalOpciones').style.display = 'flex';
        if (avisoEnviado && estado === 'EN_PUERTA') iniciarContadorAusencia(pedidoId);
    }
    
    function iniciarContadorAusencia(pedidoId) {
        if (temporizadorAusencia) clearInterval(temporizadorAusencia);
        let tiempo = 360;
        const timerElement = document.getElementById('contadorTiempo');
        const btnCancelar = document.getElementById('btnCancelarAusencia');
        temporizadorAusencia = setInterval(() => {
            if (document.getElementById('modalOpciones').style.display !== 'flex') { clearInterval(temporizadorAusencia); return; }
            tiempo--;
            if (timerElement) { const m = Math.floor(tiempo/60), s = tiempo%60; timerElement.innerHTML = `${m}:${s.toString().padStart(2,'0')}`; }
            if (tiempo <= 0) { clearInterval(temporizadorAusencia); if(btnCancelar) btnCancelar.classList.remove('hidden'); }
        }, 1000);
    }
    
    async function enviarMensajeCliente(pedidoId, tipo) {
        await database.ref(`mensajes/${pedidoId}`).push({ emisor: 'repartidor', texto: mensajesPredefinidos[tipo], timestamp: Date.now() });
        await database.ref(`pedidos/${pedidoId}`).update({ aviso_enviado: true, timestamp_aviso: Date.now() });
        avisoEnviado = true;
        Swal.fire({ title: '✅ Aviso enviado', text: 'El cliente ha sido notificado', icon: 'success', timer: 1500 });
        setTimeout(() => abrirOpciones(pedidoId), 500);
    }
    
    async function marcarRecogido(pedidoId) { await database.ref(`pedidos/${pedidoId}`).update({ estado: 'EN_REPARTO', timestamp_recogido: Date.now() }); cerrarModalOpciones(); Swal.fire({ title: '🛵 En reparto', text: 'Pedido en camino', icon: 'success', timer: 1500 }); }
    async function marcarLlegado(pedidoId) { await database.ref(`pedidos/${pedidoId}`).update({ estado: 'EN_PUERTA', timestamp_llegada: Date.now() }); cerrarModalOpciones(); Swal.fire({ title: '📍 Llegaste', text: 'Estás en la puerta', icon: 'success', timer: 1500 }); }
    
    async function entregarPedido(pedidoId) {
        if (!avisoEnviado) { Swal.fire({ title: '⚠️ Requisito', text: 'Debes enviar el aviso al cliente antes de cobrar.', icon: 'warning' }); return; }
        const total = pedidoActual?.total || 0;
        const { value: monto } = await Swal.fire({ title: '💰 Cobro', html: `<p>Total: <strong>${total.toFixed(2)}€</strong></p><input type="number" id="montoRecibido" step="0.01" class="w-full p-3 rounded-xl border" placeholder="¿Con cuánto paga?">`, confirmButtonText: 'Confirmar', showCancelButton: true, preConfirm: () => ({ recibido: parseFloat(document.getElementById('montoRecibido').value) || total }) });
        if (monto) { const cambio = monto.recibido - total; await database.ref(`pedidos/${pedidoId}`).update({ estado: 'ENTREGADO', monto_recibido: monto.recibido, cambio_entregado: cambio >=0 ? cambio : 0, timestamp_entregado: Date.now() }); cerrarModalOpciones(); Swal.fire({ title: '✅ Entregado', icon: 'success', timer: 2000 }); }
    }
    
    async function cancelarPorAusencia(pedidoId) {
        const confirm = await Swal.fire({ title: '¿Cancelar?', text: 'El cliente no se presentó', icon: 'warning', showCancelButton: true, confirmButtonText: 'Sí' });
        if (confirm.isConfirmed) {
            const deuda = pedidoActual?.total || 0;
            const emailSanitizado = sanitizarEmail(pedidoActual?.cliente_email);
            await database.ref(`clientes_morosos/${emailSanitizado}`).set({ email_original: pedidoActual?.cliente_email, nombre: pedidoActual?.cliente_nombre, motivo: 'No se presentó', deuda, fecha: Date.now(), activo: true });
            await database.ref(`pedidos/${pedidoId}`).update({ estado: 'CANCELADO_POR_AUSENCIA', deuda_generada: deuda });
            cerrarModalOpciones();
            Swal.fire({ title: '❌ Cancelado', text: `Deuda: ${deuda.toFixed(2)}€`, icon: 'error' });
        }
    }
    
    function abrirGPS(pedidoId) { database.ref(`pedidos/${pedidoId}`).once('value', snap => { const p = snap.val(); Swal.fire({ title: '🗺️ Navegación', html: `<button onclick="window.open('https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.direccion || '')}', '_blank')" class="btn-primary mb-2">📍 Ir al Cliente</button><button onclick="window.open('https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.restaurante_direccion || '')}", '_blank')" class="btn-secondary">🏪 Ir al Restaurante</button>`, showConfirmButton: false }); }); }
    function llamarCliente(pedidoId) { database.ref(`pedidos/${pedidoId}`).once('value', snap => { const p = snap.val(); if(p?.cliente_telefono) window.location.href = `tel:${p.cliente_telefono}`; else Swal.fire({ title: 'Info', text: 'Número no disponible', icon: 'info' }); }); }
    async function verDetalleCompleto(pedidoId) { const snap = await database.ref(`pedidos/${pedidoId}`).once('value'); const p = snap.val(); Swal.fire({ title: `Pedido #${p.id_pedido || pedidoId.substring(0,8)}`, html: `<div class="text-left"><p><strong>Cliente:</strong> ${escapeHTML(p.cliente_nombre)}</p><p><strong>Dirección:</strong> ${escapeHTML(p.direccion)}</p><p><strong>Total:</strong> ${(p.total||0).toFixed(2)}€</p><p><strong>Productos:</strong></p><p>${p.items?.map(i => `${i.cantidad}x ${i.nombre}`).join('<br>') || p.detalle}</p></div>`, width: '90%' }); }
</script>
</body>
</html>
