<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aguadulce Express - Reparto</title>
    
    <!-- PWA manifest específico para repartidor -->
    <link rel="manifest" href="/AGUADULCE_EXPRESS_APP/reparto/manifest-reparto.json">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/JzmCWWG3/MOTO-LOGO.webp">
    <meta name="theme-color" content="#22c55e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Reparto AE">
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #020617; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .loader { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #020617; display: flex; align-items: center; justify-content: center; z-index: 500; flex-direction: column; gap: 15px; }
        .spinner { width: 50px; height: 50px; border: 5px solid #1e293b; border-top: 5px solid #22c55e; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .pedido-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 20px; margin-bottom: 16px; transition: all 0.2s; overflow: hidden; }
        .pedido-card.nuevo { animation: pulse 0.5s ease-in-out 3; background: rgba(34,197,94,0.15); border-color: #22c55e; }
        @keyframes pulse { 0% { transform: scale(1); background: rgba(34,197,94,0.05); } 50% { transform: scale(1.01); background: rgba(34,197,94,0.25); } 100% { transform: scale(1); background: rgba(34,197,94,0.05); } }
        .card-header { padding: 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: rgba(15,23,42,0.8); }
        .card-header:active { background: rgba(34,197,94,0.1); }
        .card-content { padding: 0 16px 16px 16px; display: none; border-top: 1px solid #1e293b; }
        .card-content.open { display: block; }
        .ref { font-size: 16px; font-weight: bold; color: #22c55e; font-family: monospace; }
        .status-badge { background: #1e293b; color: #94a3b8; font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: bold; }
        .direccion { font-size: 14px; font-weight: 500; color: #fff; margin: 8px 0; line-height: 1.4; }
        .restaurante-info { background: rgba(34,197,94,0.1); padding: 12px; border-radius: 12px; margin: 10px 0; border-left: 3px solid #22c55e; }
        .btn-recoger, .btn-llegada, .btn-deuda, .btn-entregar, .btn-mapa, .btn-mapa-cliente { transition: transform 0.1s, opacity 0.2s; cursor: pointer; width: 100%; padding: 12px; border-radius: 12px; margin-top: 8px; text-align: center; border: none; font-weight: bold; }
        .btn-recoger:active, .btn-llegada:active, .btn-deuda:active, .btn-entregar:active, .btn-mapa:active, .btn-mapa-cliente:active { transform: scale(0.97); }
        .btn-recoger { background: #22c55e; color: #020617; }
        .btn-llegada { background: #f59e0b; color: #020617; }
        .btn-espera { background: #334155; color: #cbd5e1; font-weight: bold; width: 100%; padding: 12px; border-radius: 12px; margin-top: 10px; text-align: center; }
        .btn-deuda { background: #ef4444; color: #ffffff; }
        .btn-entregar { background: #22c55e; color: #020617; }
        .btn-mapa, .btn-mapa-cliente { background: #4f46e5; color: #ffffff; display: flex; justify-content: center; align-items: center; gap: 6px; text-decoration: none; font-size: 13px; }
        .btn-mapa-cliente { background: #3b82f6; }
        .sin-pedidos { text-align: center; padding: 40px; color: #64748b; }
        .btn-historial { background: #334155; color: #f8fafc; font-size: 12px; padding: 6px 12px; border-radius: 8px; cursor: pointer; border: none; }
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(2,6,23,0.95); z-index: 1000; display: none; align-items: center; justify-content: center; }
        .modal-content { background: #0f172a; border-radius: 20px; padding: 20px; max-width: 400px; width: 90%; max-height: 80vh; overflow-y: auto; border: 1px solid #1e293b; }
        .flecha { font-size: 18px; transition: transform 0.2s; }
        .flecha.abierta { transform: rotate(180deg); }
    </style>
</head>
<body>

<div id="loader" class="loader">
    <div class="spinner"></div>
    <h2 style="font-size: 16px; font-weight: bold; color: #22c55e;">CONECTANDO CON AGUADULCE EXPRESS...</h2>
</div>

<div id="app" style="display: none; padding: 12px; max-width: 600px; margin: 0 auto;">
    <div class="flex justify-between items-center" style="margin-bottom: 20px; background: #0f172a; padding: 12px; border-radius: 14px; border: 1px solid #1e293b;">
        <div>
            <h1 id="nombreRep" style="font-size: 18px; font-weight: bold; color: #fff;">-</h1>
            <span id="codigoRep" style="font-size: 12px; color: #64748b; font-weight: 500;">🔑 ---</span>
        </div>
        <div style="text-align: right;">
            <span style="font-size: 11px; color: #64748b; display: block;">💰 Billetera</span>
            <span id="saldo" style="font-size: 18px; font-weight: bold; color: #22c55e;">0.00€</span>
        </div>
    </div>

    <div class="flex justify-between items-center" style="margin-bottom: 16px;">
        <div class="flex items-center" style="gap: 8px;">
            <span style="display: inline-block; width: 10px; height: 10px; background: #22c55e; border-radius: 50%;"></span>
            <span id="estadoConexion" style="font-size: 14px; color: #22c55e; font-weight: 500;">Conectado</span>
        </div>
        <div style="display: flex; gap: 8px;">
            <button id="btnHistorial" class="btn-historial">📋 Historial</button>
            <button id="btnActivarSonido" class="btn-historial" style="background: #f59e0b; color: #020617;">🔊 ACTIVAR SONIDO</button>
            <button id="btnSalir" class="btn-historial" style="background: #ef4444;">🚪 Salir</button>
        </div>
    </div>

    <div style="margin-bottom: 14px; font-size: 14px; color: #94a3b8;">
        Pedidos activos: <span id="contadorPedidos" style="color: #22c55e; font-weight: bold;">0</span>
    </div>

    <div id="listaPedidos"></div>
</div>

<div id="modalHistorial" class="modal">
    <div class="modal-content">
        <div class="flex justify-between items-center" style="margin-bottom: 16px;">
            <h3 style="font-size: 18px; font-weight: bold; color: #22c55e;">📋 Historial de Hoy</h3>
            <button id="btnCerrarHistorial" style="background: #1e293b; border: none; padding: 6px 12px; border-radius: 8px; color: white; cursor: pointer;">✕ Cerrar</button>
        </div>
        <div id="historialLista" style="max-height: 400px; overflow-y: auto;"></div>
    </div>
</div>

<script>
    const URL = 'https://script.google.com/macros/s/AKfycbzYFDShcrP7I4FKhiH3q5UcEInpSKJstrumJ9ddI4Tj9S31ZUgwiuie81fGFmCJ6ob2/exec';
    let codigoActual = null;
    let intervalo = null;
    let pedidosActuales = [];
    let audioNotif = null;
    let sonidoActivado = localStorage.getItem('sonido_reparto') === 'true';
    let timeoutSonido = null;
    let pedidosAbiertos = new Set(); // Para mantener las tarjetas desplegadas

    function initAudio() {
        audioNotif = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
        audioNotif.volume = 1.0;
        audioNotif.loop = false;
    }
    
    function playSoundNotificacion() {
        if (!audioNotif || !sonidoActivado) return;
        if (timeoutSonido) clearTimeout(timeoutSonido);
        audioNotif.currentTime = 0;
        audioNotif.play().catch(e => console.log('Audio necesita interacción'));
        timeoutSonido = setTimeout(() => {
            if (audioNotif) audioNotif.pause();
        }, 3000);
        if (navigator.vibrate) navigator.vibrate([500, 200, 500]);
    }
    
    function generarLinkMapa(direccion) {
        if (!direccion || direccion === '') return '#';
        const direccionEncoded = encodeURIComponent(direccion + ', España');
        return `https://www.google.com/maps/search/?api=1&query=${direccionEncoded}`;
    }
    
    async function cargarPedidos() {
        if (!codigoActual) return;
        try {
            const res = await fetch(URL + '?action=getPedidosReparto&idRepartidor=' + encodeURIComponent(codigoActual) + '&t=' + Date.now());
            const data = await res.json();
            if (data.error) {
                document.getElementById('estadoConexion').innerHTML = 'Error de código';
                document.getElementById('estadoConexion').style.color = '#ef4444';
                return;
            }
            document.getElementById('estadoConexion').innerHTML = 'Conectado';
            document.getElementById('estadoConexion').style.color = '#22c55e';
            document.getElementById('nombreRep').innerHTML = data.nombre || codigoActual;
            document.getElementById('saldo').innerHTML = (parseFloat(data.saldo) || 0).toFixed(2) + '€';
            
            const nuevosPedidos = (data.pedidos || []).filter(p => {
                const estado = (p.ESTADO || '').toUpperCase().trim();
                return !estado.includes('CANCELADO') && !estado.includes('RECHAZADO') && !estado.includes('ENTREGADO');
            });
            
            const hayNuevos = nuevosPedidos.length > pedidosActuales.length;
            pedidosActuales = nuevosPedidos;
            document.getElementById('contadorPedidos').innerHTML = pedidosActuales.length;
            renderizarPedidos(pedidosActuales);
            
            if (hayNuevos && sonidoActivado && pedidosActuales.length > 0) {
                playSoundNotificacion();
                if (Notification.permission === 'granted') {
                    new Notification('📦 Nuevo pedido asignado', {
                        body: 'Tienes un nuevo pedido para entregar',
                        icon: 'https://i.postimg.cc/JzmCWWG3/MOTO-LOGO.webp',
                        vibrate: [200, 100, 200]
                    });
                }
            }
        } catch(e) {
            console.error("Error cargando pedidos:", e);
            document.getElementById('estadoConexion').innerHTML = 'Offline';
            document.getElementById('estadoConexion').style.color = '#ef4444';
        }
    }
    
    function toggleCard(id) {
        const content = document.getElementById(`content-${id}`);
        const flecha = document.getElementById(`flecha-${id}`);
        if (content.classList.contains('open')) {
            content.classList.remove('open');
            flecha.classList.remove('abierta');
            pedidosAbiertos.delete(id);
        } else {
            content.classList.add('open');
            flecha.classList.add('abierta');
            pedidosAbiertos.add(id);
        }
    }
    
    function calcularTiempoRestante(timestampFin) {
        if (!timestampFin || timestampFin === 0) return null;
        const ahora = Date.now();
        const diff = timestampFin - ahora;
        if (diff <= 0) return { texto: "⚠️ PEDIDO RETRASADO", retrasado: true };
        const minutos = Math.floor(diff / 60000);
        const segundos = Math.floor((diff % 60000) / 1000);
        return { texto: `⏳ ${minutos}:${segundos < 10 ? '0' + segundos : segundos}`, retrasado: false };
    }
    
    function silenciarYMarcarRecogido(idPedido) {
        if (timeoutSonido) clearTimeout(timeoutSonido);
        if (audioNotif) audioNotif.pause();
        recogerPedido(idPedido);
    }
    
    function renderizarPedidos(pedidos) {
        const contenedor = document.getElementById('listaPedidos');
        if (!contenedor) return;
        if (pedidos.length === 0) {
            contenedor.innerHTML = '<div class="sin-pedidos">📭 Sin pedidos asignados en este momento</div>';
            return;
        }
        
        let html = '';
        for (let p of pedidos) {
            const estado = (p.ESTADO || '').toUpperCase().trim();
            const total = parseFloat(p.TOTAL) || 0;
            let telefono = p.telf || p.WHATSAPP || '';
            const telefonoLimpio = String(telefono).replace(/\D/g, '');
            const direccionCliente = p.DIRECCION || 'Sin dirección';
            const nombreRestaurante = p.restaurante_nombre || 'Restaurante';
            const direccionRestaurante = p.restaurante_direccion || '';
            const linkMapaRestaurante = direccionRestaurante ? generarLinkMapa(direccionRestaurante) : '#';
            const linkMapaCliente = generarLinkMapa(direccionCliente);
            const estaAbierto = pedidosAbiertos.has(p.ID_PEDIDO);
            const flechaClase = estaAbierto ? 'flecha abierta' : 'flecha';
            
            let estadoTexto = '';
            if (estado === 'LISTO') estadoTexto = '🛵 LISTO PARA RECOGER';
            else if (estado === 'EN CAMINO') estadoTexto = '🚀 EN RUTA';
            else if (estado === 'LLEGÓ' || estado === 'LLEGO') estadoTexto = '📍 EN EL CLIENTE';
            else if (estado === 'RECIBIDO' || estado === 'EN PROCESO') estadoTexto = '🍳 EN PREPARACIÓN';
            else estadoTexto = estado;
            
            html += `
                <div class="pedido-card ${estado === 'LISTO' ? 'nuevo' : ''}" data-id="${p.ID_PEDIDO}">
                    <div class="card-header" onclick="toggleCard('${p.ID_PEDIDO}')">
                        <div>
                            <div class="ref">📋 ${p.ID_PEDIDO}</div>
                            <div class="text-white text-sm font-bold mt-1">${p.CLIENTE || 'Cliente'}</div>
                        </div>
                        <div class="text-right">
                            <div class="status-badge">${estadoTexto}</div>
                            <div class="text-emerald-400 font-bold text-sm mt-1">${total.toFixed(2)}€</div>
                        </div>
                        <span id="flecha-${p.ID_PEDIDO}" class="flecha ${flechaClase}">▼</span>
                    </div>
                    <div id="content-${p.ID_PEDIDO}" class="card-content ${estaAbierto ? 'open' : ''}">
                        <div class="restaurante-info">
                            <div style="font-size: 11px; color: #22c55e; font-weight: bold;">🏪 RECOGER EN:</div>
                            <div style="font-weight: bold;">${nombreRestaurante}</div>
                            ${direccionRestaurante ? `<div style="font-size: 12px; color: #94a3b8;">📍 ${direccionRestaurante}</div>` : '<div style="font-size: 12px; color: #94a3b8;">📍 Dirección no disponible</div>'}
                        </div>
                        ${estado === 'LISTO' ? `<a class="btn-mapa" href="${linkMapaRestaurante}" target="_blank">🏪 VER RUTA AL RESTAURANTE</a>` : ''}
                        <div style="background: rgba(30,41,59,0.6); padding: 14px; border-radius: 14px; margin-top: 12px;">
                            <div style="font-weight: bold;">👤 ${p.CLIENTE || 'Cliente'}</div>
                            <div style="font-size: 14px; margin-top: 4px;">🏠 ${direccionCliente}</div>
                            <div class="flex justify-between items-center mt-2">
                                <span>📞 ${telefono || 'No disponible'}</span>
                                ${telefonoLimpio ? `<div style="display: flex; gap: 8px;">
                                    <a href="tel:+34${telefonoLimpio}" style="background:#22c55e; color:#020617; padding: 6px 12px; border-radius: 8px; text-decoration:none; font-size:12px; font-weight:bold;">📞 Llamar</a>
                                    <a href="https://wa.me/34${telefonoLimpio}" target="_blank" style="background:#25D366; color:white; padding: 6px 12px; border-radius: 8px; text-decoration:none; font-size:12px; font-weight:bold;">💬 WhatsApp</a>
                                </div>` : ''}
                            </div>
                            <div class="mt-2 pt-2 border-t border-white/10">💳 Método: <strong>${p.PAGO || 'Efectivo'}</strong></div>
                        </div>
                        ${estado === 'EN CAMINO' || estado === 'LLEGÓ' ? `<a class="btn-mapa-cliente" href="${linkMapaCliente}" target="_blank">📍 VER RUTA AL CLIENTE</a>` : ''}
                        <div class="flex justify-between items-center mt-3">
                            <span>💰 Total a cobrar:</span>
                            <span style="color:#22c55e; font-size: 24px; font-weight: 800;">${total.toFixed(2)}€</span>
                        </div>
                        ${estado === 'LISTO' ? `<button class="btn-recoger" onclick="silenciarYMarcarRecogido('${p.ID_PEDIDO}')">🛵 RECOGER PEDIDO (SILENCIA ALERTA)</button>` : ''}
                        ${estado === 'EN CAMINO' ? `<button class="btn-llegada" onclick="validarLlegadaGPS(this, '${p.ID_PEDIDO}')">📍 HE LLEGADO AL CLIENTE</button>` : ''}
                        ${estado === 'LLEGÓ' || estado === 'LLEGO' ? `
                            <button class="btn-deuda" onclick="aplicarDeudaAusencia('${p.ID_PEDIDO}', ${total})">❌ CLIENTE AUSENTE / CARGAR DEUDA</button>
                            <button class="btn-entregar" style="margin-top:8px;" onclick="confirmarEntrega('${p.ID_PEDIDO}', ${total})">💰 CONFIRMAR COBRO Y ENTREGA</button>
                        ` : ''}
                        ${estado === 'RECIBIDO' || estado === 'EN PROCESO' ? `<div class="btn-espera">⏳ ESPERANDO QUE EL RESTAURANTE PREPARE EL PEDIDO</div>` : ''}
                    </div>
                </div>
            `;
        }
        contenedor.innerHTML = html;
    }
    
    window.validarLlegadaGPS = function(btn, id) {
        btn.disabled = true;
        btn.innerHTML = '🛸 UBICANDO GPS...';
        if (!navigator.geolocation) {
            ejecutarLlegada(id);
            return;
        }
        navigator.geolocation.getCurrentPosition(async () => ejecutarLlegada(id), () => ejecutarLlegada(id));
    };
    
    async function ejecutarLlegada(id) {
        localStorage.setItem('espera_' + id, Date.now() + (6 * 60 * 1000));
        await fetch(URL + '?action=actualizarEstado&idPedido=' + id + '&nuevoEstado=LLEGÓ');
        await cargarPedidos();
    }
    
    window.recogerPedido = async function(id) {
        try {
            await fetch(URL + '?action=actualizarEstado&idPedido=' + id + '&nuevoEstado=EN CAMINO');
            await Swal.fire({ title: '✅ Pedido en camino', icon: 'success', background: '#0f172a', color: 'white', timer: 1500, showConfirmButton: false });
            await cargarPedidos();
        } catch(e) {
            Swal.fire({ title: 'Error', text: 'No se pudo actualizar', icon: 'error', background: '#0f172a', color: 'white' });
        }
    };
    
    window.aplicarDeudaAusencia = async function(id, total) {
        Swal.fire({
            title: '🚨 ¿Registrar Sanción?',
            html: `Se aplicarán <strong>${total.toFixed(2)}€</strong> de deuda al cliente por no responder.`,
            icon: 'warning',
            background: '#0f172a', color: 'white',
            showCancelButton: true, confirmButtonColor: '#ef4444', confirmButtonText: 'Sí, aplicar deuda',
            cancelButtonText: 'Volver a intentar'
        }).then(async (result) => {
            if (result.isConfirmed) {
                await fetch(URL + '?action=actualizarEstado&idPedido=' + id + '&nuevoEstado=CANCELADO&tiempo=' + encodeURIComponent('cliente ausente tras 6 min de espera'));
                localStorage.removeItem('espera_' + id);
                await cargarPedidos();
                Swal.fire({ title: '❌ Deuda aplicada', text: `Cliente penalizado con ${total.toFixed(2)}€`, icon: 'error', background: '#0f172a', color: 'white' });
            }
        });
    };
    
    window.confirmarEntrega = function(id, total) {
        Swal.fire({
            title: '💰 Confirmar Cobro',
            html: `¿Confirmas que has cobrado <strong>${total.toFixed(2)}€</strong> y entregaste el pedido?`,
            icon: 'question',
            background: '#0f172a', color: 'white',
            showCancelButton: true, confirmButtonColor: '#22c55e', confirmButtonText: '✅ Sí, entregado',
            cancelButtonText: 'Cancelar'
        }).then(async (result) => {
            if (result.isConfirmed) {
                await fetch(URL + '?action=finalizarEntrega&idPedido=' + id + '&total=' + total);
                localStorage.removeItem('espera_' + id);
                await cargarPedidos();
                Swal.fire({ title: '🎉 Entregado!', text: `+${total.toFixed(2)}€ en tu billetera`, icon: 'success', background: '#0f172a', color: 'white', timer: 2000, showConfirmButton: false });
            }
        });
    };
    
    async function mostrarHistorial() {
        const modal = document.getElementById('modalHistorial');
        modal.style.display = 'flex';
        const historialDiv = document.getElementById('historialLista');
        historialDiv.innerHTML = '<div class="text-center" style="padding: 20px;">⏳ Cargando historial...</div>';
        try {
            const nombreRepartidor = document.getElementById('nombreRep').innerText;
            const url = URL + '?action=getHistorialRepartidor&nombre=' + encodeURIComponent(nombreRepartidor);
            const res = await fetch(url);
            const data = await res.json();
            const pedidos = data.historial || [];
            if (pedidos.length === 0) {
                historialDiv.innerHTML = '<div class="text-center" style="padding: 40px;">📭 No hay entregas registradas</div>';
                return;
            }
            const totalGeneral = pedidos.reduce((sum, p) => sum + (parseFloat(p.TOTAL) || 0), 0);
            let html = `<div style="padding: 12px; background: #1e293b; border-radius: 12px; margin-bottom: 16px;"><div class="flex justify-between"><span>📊 Total entregado:</span><span style="color: #22c55e; font-weight: bold;">${totalGeneral.toFixed(2)}€</span></div><div class="flex justify-between mt-1"><span>📦 Pedidos entregados:</span><span>${pedidos.length}</span></div></div>`;
            for (let p of pedidos.slice().reverse()) {
                const fecha = p.FECHA ? p.FECHA.substring(0, 10) : 'Fecha desconocida';
                html += `<div style="display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #1e293b;"><div><strong>${p.ID_PEDIDO}</strong><div style="font-size: 11px;">${p.CLIENTE || 'Cliente'}</div><div style="font-size: 10px;">${fecha}</div></div><div style="color: #22c55e; font-weight: bold;">${(parseFloat(p.TOTAL) || 0).toFixed(2)}€</div></div>`;
            }
            historialDiv.innerHTML = html;
        } catch(e) {
            historialDiv.innerHTML = '<div class="text-center" style="padding: 40px;">❌ Error al cargar historial</div>';
        }
    }
    
    function cerrarHistorial() { document.getElementById('modalHistorial').style.display = 'none'; }
    
    function activarSonido() {
        sonidoActivado = !sonidoActivado;
        localStorage.setItem('sonido_reparto', sonidoActivado);
        const btn = document.getElementById('btnActivarSonido');
        if (btn) {
            if (sonidoActivado) {
                btn.innerHTML = '🔊 SONIDO ACTIVADO';
                btn.style.background = '#22c55e';
                btn.style.color = '#020617';
                playSoundNotificacion();
            } else {
                btn.innerHTML = '🔇 ACTIVAR SONIDO';
                btn.style.background = '#f59e0b';
                btn.style.color = '#020617';
            }
        }
    }
    
    async function iniciarApp() {
        initAudio();
        const btnSonido = document.getElementById('btnActivarSonido');
        if (btnSonido) {
            btnSonido.onclick = activarSonido;
            if (sonidoActivado) {
                btnSonido.innerHTML = '🔊 SONIDO ACTIVADO';
                btnSonido.style.background = '#22c55e';
            } else {
                btnSonido.innerHTML = '🔇 ACTIVAR SONIDO';
                btnSonido.style.background = '#f59e0b';
            }
        }
        document.getElementById('btnSalir').onclick = () => {
            Swal.fire({
                title: '¿Cerrar sesión?',
                icon: 'question',
                background: '#0f172a', color: 'white',
                confirmButtonColor: '#ef4444', confirmButtonText: 'Sí',
                showCancelButton: true
            }).then(result => {
                if (result.isConfirmed) {
                    if (intervalo) clearInterval(intervalo);
                    localStorage.removeItem('rep_code');
                    localStorage.removeItem('espera_');
                    location.reload();
                }
            });
        };
        document.getElementById('btnHistorial').onclick = mostrarHistorial;
        document.getElementById('btnCerrarHistorial').onclick = cerrarHistorial;
        
        let codigo = localStorage.getItem('rep_code');
        if (!codigo) {
            const result = await Swal.fire({
                title: '🔑 Código de Acceso',
                input: 'text',
                inputPlaceholder: 'Ej: R001, R003',
                background: '#0f172a', color: 'white',
                confirmButtonColor: '#22c55e', confirmButtonText: 'Ingresar',
                allowOutsideClick: false
            });
            if (result.value) {
                codigo = result.value.trim().toUpperCase();
                localStorage.setItem('rep_code', codigo);
            } else {
                document.getElementById('loader').innerHTML = '<h2 style="color:#ef4444;">❌ No se ingresó código</h2>';
                return;
            }
        }
        
        codigoActual = codigo;
        document.getElementById('codigoRep').innerHTML = '🔑 ' + codigoActual;
        await cargarPedidos();
        document.getElementById('loader').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        if (intervalo) clearInterval(intervalo);
        intervalo = setInterval(cargarPedidos, 8000);
        if ('Notification' in window && Notification.permission !== 'granted' && Notification.permission !== 'denied') {
            Notification.requestPermission();
        }
    }
    
    iniciarApp().catch(e => console.error(e));

async function registrarNotificaciones() {
    if (!('Notification' in window)) {
        console.log('Este navegador no soporta notificaciones');
        return;
    }
    
    if (Notification.permission === 'denied') {
        console.log('Notificaciones denegadas');
        return;
    }
    
    if (Notification.permission !== 'granted') {
        const permiso = await Notification.requestPermission();
        if (permiso !== 'granted') return;
    }
    
    try {
        const registration = await navigator.serviceWorker.ready;
        console.log('Service Worker listo', registration);
        
        const VAPID_PUBLIC_KEY = 'BGmwJAiWUFBmPJDXNDwI8_n1nvUD1NwqOxD9HcygmvdmylvDr7W_ijKk6irTkvtZW4IRL-2QXeJH_pqb3KMaoIU';
        
        const subscription = await registration.pushManager.subscribe({

}

function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const rawData = window.atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
    }
    return outputArray;
}
