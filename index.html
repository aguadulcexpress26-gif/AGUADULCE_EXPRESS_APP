<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aguadulce Express v106 Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --cyan: #06b6d4; --dark: #020617; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--dark); color: white; margin: 0; -webkit-tap-highlight-color: transparent; }
        #loader { position: fixed; inset: 0; background: var(--dark); z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(6,182,212,0.1); border-top-color: var(--cyan); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .brand-header { position: relative; height: 160px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; }
        #header-bg { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0.8; }
        .brand-overlay { position: absolute; inset: 0; background: linear-gradient(to top, var(--dark), transparent); }
        .plato-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 1.5rem; padding: 15px; display: flex; align-items: center; gap: 15px; margin-bottom: 12px; }
        #modal-plato, #panel-checkout, #modal-legal, #modal-alerta-pro, #modal-exito, #panel-revision { position: fixed; inset: 0; background: var(--dark); z-index: 1000; display: none; flex-direction: column; overflow-y: auto; }
        .step-tag { font-weight: 800; font-size: 10px; text-transform: uppercase; color: var(--cyan); letter-spacing: 1px; margin-bottom: 10px; display: block; }
        .grid-option { border: 1px solid rgba(255,255,255,0.1); padding: 12px; text-align: center; font-size: 11px; font-weight: 600; border-radius: 12px; cursor: pointer; }
        .grid-option.selected { border-color: var(--cyan); background: rgba(6,182,212,0.1); color: var(--cyan); }
        input, select { background: rgba(255,255,255,0.05)!important; border: 1px solid rgba(255,255,255,0.1)!important; padding: 14px!important; border-radius: 12px!important; color: white!important; width: 100%; }
        .cat-chip { padding: 10px 20px; background: rgba(255,255,255,0.05); border-radius: 15px; font-size: 11px; font-weight: 800; white-space: nowrap; border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); }
        .cat-chip.active { background: var(--cyan); color: var(--dark); border-color: var(--cyan); }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* Seguimiento Visual */
        .track-node { position: relative; display: flex; flex-direction: column; align-items: center; flex: 1; }
        .track-line { position: absolute; top: 15px; left: 50%; width: 100%; height: 2px; background: rgba(255,255,255,0.1); z-index: 1; }
        .track-dot { width: 30px; height: 30px; border-radius: 50%; background: #1e293b; z-index: 2; display: flex; align-items: center; justify-content: center; font-size: 12px; border: 2px solid rgba(255,255,255,0.1); }
        .track-node.active .track-dot { background: var(--cyan); border-color: var(--cyan); color: var(--dark); box-shadow: 0 0 15px var(--cyan); }

        /* Cintillo Anuncios */
        .marquee { overflow: hidden; white-space: nowrap; background: rgba(6,182,212,0.1); padding: 8px 0; border-bottom: 1px solid rgba(6,182,212,0.2); }
        .marquee p { display: inline-block; padding-left: 100%; animation: marquee 25s linear infinite; font-size: 10px; font-weight: 800; color: var(--cyan); text-transform: uppercase; italic; }
        @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner mb-4"></div>
        <p class="text-cyan-400 text-[10px] font-black uppercase">Sincronizando Aguadulce Express...</p>
    </div>

    <header class="brand-header">
        <div id="header-bg"></div>
        <div class="brand-overlay"></div>
        <div class="relative z-10 flex items-center gap-4">
            <img id="app-logo" src="" class="w-12 h-12 rounded-full border-2 border-cyan-400 bg-white">
            <div>
                <h1 class="text-xl font-black italic uppercase leading-none text-left">Aguadulce</h1>
                <p class="text-cyan-400 text-[8px] font-black uppercase tracking-widest text-left">Express</p>
            </div>
        </div>
    </header>

    <div id="cintillo-mensajes" class="marquee"><p id="texto-anuncio">¡Bienvenidos a Aguadulce Express! Los mejores restaurantes en tu puerta...</p></div>

    <main id="app-container" class="px-5 py-6 pb-32"></main>

    <div id="cesta-flotante" class="fixed bottom-6 left-4 right-4 bg-white text-black p-0 rounded-[2rem] hidden flex-col z-[100] shadow-2xl overflow-hidden border-2 border-cyan-400">
    <div class="p-5 flex items-center gap-4" onclick="abrirRevision()">
        <div class="bg-cyan-400 w-12 h-12 rounded-2xl flex items-center justify-center text-2xl">🛒</div>
        <div class="flex-1 text-left">
            <span id="cesta-info" class="font-black text-sm italic uppercase block text-black">0 PRODUCTOS</span>
            <span id="cesta-total" class="font-bold text-cyan-600 text-xs uppercase tracking-tighter">0.00€ TOTAL</span>
        </div>
      <button onclick="abrirRevision(true); event.stopPropagation();" class="bg-red-100 text-red-600 p-3 rounded-xl font-black flex items-center justify-center mr-2">
            <span class="text-xs uppercase italic">Vaciar</span>
        </button>
    </div>
</div>

    <div id="panel-revision" class="p-6 bg-dark">
        <div class="flex items-center gap-4 mb-8">
            <button onclick="document.getElementById('panel-revision').style.display='none'" class="w-10 h-10 rounded-xl bg-white/5 text-cyan-400">←</button>
            <h2 class="text-xl font-black italic uppercase text-white">Revisar Pedido</h2>
        </div>
        <p class="text-xs font-bold text-cyan-400 uppercase mb-6 text-left italic">¿Estás de acuerdo con tu elección?</p>
        <div id="items-revision" class="space-y-4 mb-8 text-left"></div>
        <div class="border-t border-white/10 pt-6">
            <button onclick="abrirCheckout()" class="w-full bg-cyan-400 text-black py-6 rounded-2xl font-black uppercase italic shadow-lg shadow-cyan-400/20">CONFIRMAR Y IR AL PAGO</button>
        </div>
    </div>

    <div id="modal-plato">
        <button onclick="cerrarModal()" class="absolute top-5 left-5 z-[1001] bg-black/60 w-10 h-10 rounded-full text-white">✕</button>
        <img id="modal-img" src="" class="w-full h-[220px] object-cover">
        <div class="p-6 pb-40 text-left">
            <div class="flex justify-between items-start mb-6">
                <div class="flex-1 pr-4">
                    <h2 id="modal-titulo" class="text-2xl font-black italic uppercase leading-tight"></h2>
                    <p id="modal-desc" class="text-white/50 text-xs mt-2"></p>
                </div>
                <div id="modal-precio-base" class="bg-cyan-400 text-black px-4 py-2 rounded-xl font-black text-lg">0€</div>
            </div>
            <div id="contenedor-pasos" class="space-y-8"></div>
        </div>
        <div class="fixed bottom-0 left-0 right-0 p-5 bg-gradient-to-t from-dark via-dark">
            <button id="btn-anadir-modal" onclick="confirmarAnadir()" class="w-full bg-cyan-400 text-black font-black py-5 rounded-2xl flex justify-between px-8">
                <span id="txt-anadir">Añadir al Carrito</span>
                <span id="total-modal-btn">0.00€</span>
            </button>
        </div>
    </div>

    <div id="panel-checkout" class="p-6 bg-dark text-white">
        <div class="flex items-center gap-4 mb-8">
            <button onclick="cerrarCheckout()" class="w-10 h-10 rounded-xl bg-white/5 text-cyan-400">←</button>
            <h2 class="text-xl font-black italic uppercase text-white">Caja de Pago</h2>
        </div>
        <div class="space-y-4 text-left">
            <p class="step-tag text-left text-cyan-400">Datos de Entrega</p>
            <input type="text" id="cliente-nombre" placeholder="TU NOMBRE">
            <input type="tel" id="cliente-telf" value="+34">
            <input type="text" id="cliente-dir" placeholder="DIRECCIÓN DE ENTREGA">
            <select id="metodo-pago">
                <option value="EFECTIVO">EFECTIVO</option>
                <option value="BIZUM">BIZUM</option>
                <option value="TARJETA">TARJETA (TPV EN SITIO)</option>
            </select>
        </div>
        <div id="desglose-pago" class="mt-8 p-6 bg-white/5 rounded-[2rem] space-y-2 text-sm text-white text-left"></div>
        <button id="btn-final" onclick="enviarPedidoFinal()" class="w-full bg-cyan-400 text-black py-6 rounded-2xl font-black uppercase mt-6">Procesar Orden</button>
    </div>

    <div id="modal-exito" class="fixed inset-0 z-[6000] hidden items-center justify-center p-6 bg-black/95 backdrop-blur-sm">
        <div id="card-seguimiento" class="bg-[#020617] border border-cyan-400/30 p-8 rounded-[2.5rem] w-full max-w-sm text-center"></div>
    </div>

    <div id="modal-legal" class="fixed inset-0 z-[7000] hidden items-center justify-center p-6 backdrop-blur-xl bg-black/80">
        <div class="bg-[#020617] w-full max-w-sm rounded-[2rem] p-8 border border-white/10 shadow-2xl">
            <h3 class="text-cyan-400 font-black uppercase text-xs mb-4 italic text-left">Tratamiento de Datos</h3>
            <p id="texto-legal-completo" class="text-[10px] text-white/60 mb-6 italic font-medium leading-relaxed text-left"></p>
            <button onclick="document.getElementById('modal-legal').style.display='none'" class="w-full bg-cyan-400 text-black py-4 rounded-2xl font-black uppercase text-[10px]">Cerrar</button>
        </div>
    </div>

    <div id="modal-alerta-pro" class="fixed inset-0 z-[9000] hidden items-center justify-center p-6 bg-black/80 backdrop-blur-md">
        <div class="bg-[#020617] border border-white/10 p-8 rounded-[2.5rem] w-full max-w-sm text-center">
            <div class="w-16 h-16 bg-cyan-400/20 rounded-full flex items-center justify-center mx-auto mb-4">
                <span class="text-cyan-400 text-2xl">⚠️</span>
            </div>
            <h3 id="titulo-alerta" class="text-white font-black uppercase italic mb-2">Atención</h3>
            <p id="texto-alerta" class="text-[11px] text-white/60 mb-8 uppercase font-bold leading-relaxed"></p>
            <div id="contenedor-botones-alerta" class="flex flex-col gap-3"></div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzmIW4rvilG6rCN7NbT-sQw-VniY0PDyi7wxQuBYbmDXOGbMup8J4tMEu99uqwzMHuq/exec';
        let db = { menu: [], restaurantes: [], config: {}, anuncios: [], legal: "" };
        let cesta = [];
        let rActivo = { id: null, nombre: "", foto: "" };
        let itemActual = { pBase: 0, pOpciones: 0, pExtras: 0, cantidad: 1, obligatorioOk: false, data: null };

        async function init() {
            try {
                const res = await fetch(scriptURL);
                const data = await res.json();
                db.restaurantes = data.RESTAURANTES.filter(r => r.NOMBRE_RESTAURANTE && r.NOMBRE_RESTAURANTE !== "ADMIN");
                db.menu = data.MENU_GENERAL;
                db.anuncios = data.ANUNCIOS || [];
                db.legal = data.LEGAL && data.LEGAL[0] ? data.LEGAL[0].TEXTO : "Tratamiento de datos personales...";
                
                if(db.anuncios.length > 0) document.getElementById('texto-anuncio').innerText = db.anuncios.map(a => a.TEXTO).join(" • ");
                if(data.CONFIG && data.CONFIG[0]) {
                    document.getElementById('app-logo').src = data.CONFIG[0].LOGO_URL;
                    document.getElementById('header-bg').style.backgroundImage = `url('${data.CONFIG[0].FONDO_URL}')`;
                    fondoOriginal = data.CONFIG[0].FONDO_URL;
                }
                document.getElementById('loader').style.display = 'none';

                // PERSISTENCIA DE SEGUIMIENTO
                if(localStorage.getItem('ae_pedido_id')) renderSeguimiento();
                
                renderHome();
            } catch (e) { console.error(e); }
        }

        function renderHome() {

    // 🔥 RESTAURAR IMAGEN ORIGINAL
    document.getElementById('header-bg').style.backgroundImage = `url('${fondoOriginal}')`;

    let html = `<p class="step-tag mb-6 ml-2 italic text-left text-white/50">Selecciona un restaurante</p>`;
    
    db.restaurantes.forEach(r => {
        html += `<div class="relative rounded-[2.5rem] overflow-hidden h-[160px] mb-5 border border-white/5 active:scale-95 transition-all shadow-xl" onclick="abrirTienda('${r.NOMBRE_RESTAURANTE}', '${r.ID_RESTAURANTE}', '${r.FOTO}')"><img src="${r.FOTO}" class="absolute inset-0 w-full h-full object-cover opacity-70"><div class="absolute inset-0 bg-gradient-to-t from-dark via-transparent"></div><div class="absolute bottom-6 left-8 text-left"><h2 class="text-2xl font-black italic uppercase text-white">${r.NOMBRE_RESTAURANTE}</h2></div></div>`;
    });

    document.getElementById('app-container').innerHTML = html;
}

        function abrirTienda(nombre, id, foto) {
    if (cesta.length > 0 && String(rActivo.id) !== String(id)) {
        mostrarAviso("PEDIDO EN CURSO", `Tienes productos de "${rActivo.nombre}" en la cesta.`, true, "vaciarCesta()");
        return;
    }

    rActivo.id = id;
    rActivo.nombre = nombre;
    rActivo.foto = foto;

    // 🔥 CAMBIO CLAVE: usar imagen del restaurante
    document.getElementById('header-bg').style.backgroundImage = `url('${foto}')`;

    verMenu();
}

        function verMenu() {
            const platos = db.menu.filter(p => String(p.ID_RESTAURANTE) === String(rActivo.id));
            const cats = [...new Set(platos.map(p => p.CATEGORIA || "General"))];
            let html = `<div class="flex items-center gap-4 mb-6"><button onclick="renderHome()" class="w-10 h-10 rounded-xl bg-black/40 border border-white/10 text-cyan-400 flex items-center justify-center font-bold">←</button><h2 class="text-lg font-black uppercase italic truncate text-white text-left">${rActivo.nombre}</h2></div><div class="flex overflow-x-auto gap-2 mb-6 no-scrollbar"><div class="cat-chip active" onclick="filtrarCat('TODOS', this)">Todos</div>${cats.map(c => `<div class="cat-chip" onclick="filtrarCat('${c}', this)">${c}</div>`).join('')}</div><div id="lista-platos" class="space-y-3 text-left">`;
            platos.forEach(p => {
                html += `<div class="plato-card" data-cat="${p.CATEGORIA}" onclick='abrirDetalle(${JSON.stringify(p).replace(/'/g, "&apos;")})'><div class="flex-1 text-left"><h4 class="font-black text-sm uppercase leading-none mb-1 text-white">${p.PLATO}</h4><p class="text-cyan-400 font-black text-xs">${parseFloat(p.PRECIO).toFixed(2)}€</p></div><img src="${p.FOTO_PLATO}" class="w-16 h-16 rounded-xl object-cover shadow-lg"></div>`;
            });
            document.getElementById('app-container').innerHTML = html + "</div>";
        }

       function abrirDetalle(p) {
    // REPARACIÓN: Carga inmediata de imagen y datos para que el diseño no se rompa
    itemActual = { pBase: parseFloat(p.PRECIO), pOpciones: 0, pExtras: 0, cantidad: 1, obligatorioOk: !p.SELECCION_OBLIGATORIA, data: p };
    document.getElementById('modal-titulo').innerText = p.PLATO;
    document.getElementById('modal-desc').innerText = p.DESCRIPCION || "";
    document.getElementById('modal-img').src = p.FOTO_PLATO; // Recupera la imagen del plato
    document.getElementById('modal-precio-base').innerText = itemActual.pBase.toFixed(2) + "€";

    let html = "";
    
    const renderGrid = (titulo, datos, tipo) => {
        if (!datos || datos.trim() === "") return "";
        let res = `<div class="text-left mb-4"><span class="step-tag">${titulo}</span><div class="grid grid-cols-2 gap-2">`;
        datos.split(',').forEach(d => {
            const partes = d.split(':');
            const nombre = partes[0].trim();
            const precio = parseFloat(partes[1]) || 0;
            res += `<div class="grid-option" onclick="toggleSel(this, ${precio}, '${tipo}')">
                        ${nombre}${precio > 0 ? ' +'+precio.toFixed(2)+'€' : ''}
                    </div>`;
        });
        return res + `</div></div>`;
    };

    // Reparación: Se inyectan Obligatorios y Únicos
    html += renderGrid("Selección Obligatoria", p.SELECCION_OBLIGATORIA, 'oblig');
    html += renderGrid("Opciones", p.SELECCION_UNICA, 'unica');

    // Reparación: Extras con nombre identificable y espacio inferior (pb-32) para que el botón no los tape
    if (p.EXTRAS) {
        html += `<div class="text-left pb-32"><span class="step-tag text-left">Extras y Bebidas</span><div class="space-y-2">`;
        p.EXTRAS.split(',').forEach(d => {
            const partes = d.split(':');
            const nombreExtra = partes[0].trim();
            const precioExtra = parseFloat(partes[1]) || 0;
            html += `
            <div class="flex justify-between items-center py-3 border-b border-white/5">
                <span class="text-[11px] font-bold uppercase text-white/80 extra-item-name">${nombreExtra}</span>
                <div class="flex items-center gap-4">
                    <span class="text-cyan-400 font-black text-[10px]">+${precioExtra.toFixed(2)}€</span>
                    <div class="flex items-center gap-3 bg-white/5 p-1 rounded-xl">
                        <button onclick="updEx(this, -1, ${precioExtra})" class="w-8 h-8 rounded-lg bg-white/5 text-white">-</button>
                        <span class="qty text-xs font-black" data-nombre="${nombreExtra}">0</span>
                        <button onclick="updEx(this, 1, ${precioExtra})" class="w-8 h-8 rounded-lg bg-cyan-400 text-black font-bold">+</button>
                    </div>
                </div>
            </div>`;
        });
        html += `</div></div>`;
    }

    document.getElementById('contenedor-pasos').innerHTML = html;
    document.getElementById('modal-plato').style.display = 'flex';
    actualizarBarraModal();
}
        // CORRECCIÓN NOMBRES EXTRAS
       function confirmarAnadir() {
    try {
        let sel = [];
        
        // 1. Capturar Obligatorios y Únicos
        document.querySelectorAll('.grid-option.selected').forEach(el => {
            let texto = el.innerText.split('+')[0].trim();
            if (texto) sel.push(texto);
        });

        // 2. REPARACIÓN: Capturar nombres reales de los extras
       document.querySelectorAll('.qty').forEach(el => {
    const cant = parseInt(el.innerText) || 0;
    if (cant > 0) {
        const nombreExtra = el.dataset.nombre || "Extra";
        sel.push(`${cant}x ${nombreExtra}`);
    }
});

        const detalle = sel.length > 0 ? ` [${sel.join(', ')}]` : "";
        cesta.push({ 
            nombre: `${itemActual.cantidad}x ${itemActual.data.PLATO}${detalle}`, 
            total: (itemActual.pBase + itemActual.pOpciones + itemActual.pExtras) * itemActual.cantidad 
        });

        actualizarCestaBar(); 
        cerrarModal();
    } catch (e) { 
        alert("Error al añadir"); 
    }
}

        function actualizarCestaBar() {
            const total = cesta.reduce((acc, i) => acc + i.total, 0);
            document.getElementById('cesta-flotante').classList.toggle('hidden', cesta.length === 0);
            document.getElementById('cesta-info').innerText = `${cesta.length} PRODUCTOS`;
            document.getElementById('cesta-total').innerText = `${total.toFixed(2)}€ TOTAL`;
        }

        // PANEL DE REVISIÓN
       function abrirRevision(modoVaciar = false) {
    const list = document.getElementById('items-revision');
    list.innerHTML = "";

    cesta.forEach((item, index) => {
        list.innerHTML += `
        <div class="bg-white/5 p-4 rounded-2xl flex justify-between items-center text-left">
            <div class="flex-1">
                <p class="text-[11px] font-black uppercase text-white">${item.nombre}</p>
                <p class="text-[10px] text-cyan-400 font-bold">${item.total.toFixed(2)}€</p>
            </div>
            ${modoVaciar ? "" : `<button onclick="eliminarItem(${index})" class="text-red-500 font-black px-3">✕</button>`}
        </div>`;
    });

    // 🔥 CAMBIO TEXTO DINÁMICO
    const texto = document.querySelector('#panel-revision p');
    texto.innerText = modoVaciar 
        ? "¿Seguro que quieres eliminar todo el pedido?" 
        : "¿Estás de acuerdo con tu elección?";

    const contenedorBoton = document.querySelector('#panel-revision .border-t');

    if (modoVaciar) {
        contenedorBoton.innerHTML = `
        <button onclick="confirmarVaciarFinal()" 
        class="w-full bg-red-500 text-white py-6 rounded-2xl font-black uppercase italic">
        ¿SEGURO QUE QUIERES VACIAR?
        </button>`;
    } else {
        contenedorBoton.innerHTML = `
        <button onclick="abrirCheckout()" 
        class="w-full bg-cyan-400 text-black py-6 rounded-2xl font-black uppercase italic shadow-lg shadow-cyan-400/20">
        CONFIRMAR Y IR AL PAGO
        </button>`;
    }

    document.getElementById('panel-revision').style.display = 'flex';
}
        function confirmarVaciarFinal() {
    cesta = [];
    actualizarCestaBar();

    document.getElementById('panel-revision').style.display = 'none';

    // volver al menú del restaurante actual
    verMenu();
}

        function abrirCheckout() {
            document.getElementById('panel-revision').style.display = 'none';
            const modal = document.getElementById('panel-checkout'); modal.style.display = 'flex';
            const subtotal = cesta.reduce((acc, i) => acc + i.total, 0);
            const envio = 2.50; const plataforma = 1.00;
            document.getElementById('desglose-pago').innerHTML = `
                <div class="flex justify-between"><span>Subtotal</span><span>${subtotal.toFixed(2)}€</span></div>
                <div class="flex justify-between"><span>Costo Envío</span><span>${envio.toFixed(2)}€</span></div>
                <div class="flex justify-between text-white/50 italic"><span>Uso de Plataforma</span><span>${plataforma.toFixed(2)}€</span></div>
                <div class="flex justify-between font-black text-cyan-400 text-lg border-t border-white/10 pt-2 mt-2 uppercase italic"><span>Total a Pagar</span><span>${(subtotal + envio + plataforma).toFixed(2)}€</span></div>
                <div class="p-4 bg-white/5 border border-white/10 rounded-2xl mt-6 text-left">
                    <label class="flex items-start gap-3 cursor-pointer">
                        <input type="checkbox" id="check-legal" ${localStorage.getItem('ae_legal') === 'true' ? 'checked' : ''} onchange="document.getElementById('btn-final').disabled = !this.checked; document.getElementById('btn-final').style.opacity = this.checked ? '1' : '0.5'" class="mt-1 w-4 h-4 accent-cyan-400">
                        <span class="text-[10px] text-white/50 leading-tight uppercase font-bold">Acepto el <span onclick="abrirLegal()" class="text-cyan-400 underline">Tratamiento de Datos</span> de Aguadulce Express.</span>
                    </label>
                </div>`;
            const aceptado = localStorage.getItem('ae_legal') === 'true';
            document.getElementById('btn-final').disabled = !aceptado;
            document.getElementById('btn-final').style.opacity = aceptado ? "1" : "0.5";
            document.getElementById('cliente-nombre').value = localStorage.getItem('ae_nombre') || "";
            document.getElementById('cliente-telf').value = localStorage.getItem('ae_telf') || "+34";
            document.getElementById('cliente-dir').value = localStorage.getItem('ae_dir') || "";
        }

        // SEGUIMIENTO VISUAL
        function renderSeguimiento() {
            const pid = localStorage.getItem('ae_pedido_id');
            document.getElementById('card-seguimiento').innerHTML = `
                <div class="w-16 h-16 bg-cyan-400 rounded-full flex items-center justify-center mx-auto mb-6"><svg class="w-8 h-8 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M5 13l4 4L19 7"></path></svg></div>
                <h2 class="text-xl font-black italic uppercase text-white mb-2">ORDEN EN MARCHA</h2>
                <p class="text-[9px] text-white/50 mb-10 uppercase italic">Referencia: ${pid}</p>
                <div class="flex justify-between items-start w-full relative mb-12">
                    <div class="track-node active"><div class="track-line"></div><div class="track-dot">✔</div><span class="text-[8px] font-black uppercase mt-2 text-cyan-400">Recibido</span></div>
                    <div class="track-node"><div class="track-line"></div><div class="track-dot">🍳</div><span class="text-[8px] font-black uppercase mt-2 text-white/30">Cocina</span></div>
                    <div class="track-node"><div class="track-dot">🛵</div><span class="text-[8px] font-black uppercase mt-2 text-white/30">Camino</span></div>
                </div>
                <button onclick="localStorage.removeItem('ae_pedido_id'); location.reload();" class="w-full bg-white/5 text-white py-4 rounded-2xl font-black uppercase text-[10px]">Cerrar Seguimiento</button>`;
            document.getElementById('modal-exito').style.display = 'flex';
        }

        async function enviarPedidoFinal() {
            const nom = document.getElementById('cliente-nombre').value;
            const tel = document.getElementById('cliente-telf').value;
            const dir = document.getElementById('cliente-dir').value;
            if(!nom || !dir || tel.length < 9) return alert("Completa tus datos.");
            const btn = document.getElementById('btn-final'); btn.innerText = "⏳ ENVIANDO..."; btn.disabled = true;
            const pid = "AE-" + Math.floor(1000 + Math.random() * 9000);
            const paquete = { cliente_info: nom, telf_info: tel, dir_info: dir, pedido_info: cesta.map(i => i.nombre).join(" | "), total_info: (cesta.reduce((a,b)=>a+b.total,0)+3.5).toFixed(2)+"€", pago_info: document.getElementById('metodo-pago').value, id_res_info: rActivo.id };
            try {
                await fetch(scriptURL, { method: "POST", mode: "no-cors", body: JSON.stringify(paquete) });
                localStorage.setItem('ae_pedido_id', pid);
                localStorage.setItem('ae_nombre', nom); localStorage.setItem('ae_telf', tel); localStorage.setItem('ae_dir', dir); localStorage.setItem('ae_legal', "true");
                cesta = []; actualizarCestaBar(); cerrarCheckout(); renderSeguimiento();
            } catch (e) { alert("Error al enviar"); btn.disabled = false; btn.innerText = "Procesar Orden"; }
        }

        function toggleSel(el, pr, tipo) {
            if (tipo === 'oblig') {
                const s = el.parentElement.querySelectorAll('.selected').length;
                if (el.classList.contains('selected')) el.classList.remove('selected');
                else if (s < 5) el.classList.add('selected');
            } else { el.parentElement.querySelectorAll('.grid-option').forEach(o => o.classList.remove('selected')); el.classList.add('selected'); }
            let eg = 0; document.querySelectorAll('.grid-option.selected').forEach(s => { if(s.innerText.includes('+')) eg += parseFloat(s.innerText.split('+')[1]) || 0; });
            itemActual.pOpciones = eg; itemActual.obligatorioOk = !itemActual.data.SELECCION_OBLIGATORIA || document.querySelectorAll('#contenedor-pasos .grid-option.selected').length > 0;
            actualizarBarraModal();
        }
        function updEx(btn, mod, pr) { const s = btn.parentElement.querySelector('.qty'); let v = parseInt(s.innerText) + mod; if(v >= 0) { s.innerText = v; itemActual.pExtras += (mod * pr); actualizarBarraModal(); } }
        function actualizarBarraModal() { const total = (itemActual.pBase + itemActual.pOpciones + itemActual.pExtras) * itemActual.cantidad; document.getElementById('total-modal-btn').innerText = total.toFixed(2) + "€"; const btn = document.getElementById('btn-anadir-modal'); btn.disabled = !itemActual.obligatorioOk; btn.style.opacity = itemActual.obligatorioOk ? "1" : "0.3"; }
        function eliminarItem(i) { cesta.splice(i, 1); if(cesta.length === 0) document.getElementById('panel-revision').style.display = 'none'; else abrirRevision(); actualizarCestaBar(); }
        function mostrarAviso(t, m, c, cb) { document.getElementById('titulo-alerta').innerText = t; document.getElementById('texto-alerta').innerText = m; const cnt = document.getElementById('contenedor-botones-alerta'); cnt.innerHTML = c ? `<button onclick="${cb}" class="w-full bg-cyan-400 text-black py-4 rounded-xl font-black uppercase text-xs">Confirmar</button><button onclick="cerrarAvisoPro()" class="w-full bg-white/10 py-4 rounded-xl font-black uppercase text-xs">Cancelar</button>` : `<button onclick="cerrarAvisoPro()" class="w-full bg-cyan-400 text-black py-4 rounded-xl font-black uppercase text-xs">Entendido</button>`; document.getElementById('modal-alerta-pro').style.display = 'flex'; }
        function cerrarAvisoPro() { document.getElementById('modal-alerta-pro').style.display = 'none'; }
        function vaciarCesta() { cesta = []; actualizarCestaBar(); cerrarAvisoPro(); }
        function cerrarModal() { document.getElementById('modal-plato').style.display = 'none'; }
        function cerrarCheckout() { document.getElementById('panel-checkout').style.display = 'none'; }
        function abrirLegal() { document.getElementById('texto-legal-completo').innerText = db.legal; document.getElementById('modal-legal').style.display = 'flex'; }
        function filtrarCat(cat, el) { document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active')); el.classList.add('active'); document.querySelectorAll('.plato-card').forEach(p => { p.style.display = (cat === 'TODOS' || p.dataset.cat === cat) ? 'flex' : 'none'; }); }
        init();
    </script>
</body>
</html>
