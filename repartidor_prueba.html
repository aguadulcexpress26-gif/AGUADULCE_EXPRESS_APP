<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Repartidor - Aguadulce Express</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #020617; color: white; font-family: system-ui, sans-serif; padding: 16px; padding-bottom: 30px; }
        .header { background: linear-gradient(135deg, #06b6d4, #020617); margin: -16px -16px 16px -16px; padding: 20px 16px; }
        .flex { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .btn-salir, .btn-historial { background: rgba(255,255,255,0.1); border: none; padding: 8px 16px; border-radius: 12px; color: white; cursor: pointer; font-weight: bold; }
        .card { background: rgba(15,23,42,0.8); border-radius: 20px; padding: 16px; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.05); }
        .ref { background: rgba(6,182,212,0.2); padding: 4px 12px; border-radius: 20px; font-size: 12px; color: #06b6d4; display: inline-block; }
        .status-badge { background: rgba(6,182,212,0.2); color: #06b6d4; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; }
        .direccion { font-size: 15px; font-weight: bold; margin: 12px 0; }
        .cliente-box { background: rgba(2,6,23,0.5); border-radius: 16px; padding: 12px; margin: 12px 0; }
        button { width: 100%; padding: 14px; border-radius: 14px; font-weight: bold; border: none; margin-top: 10px; cursor: pointer; transition: transform 0.1s; }
        button:active { transform: scale(0.98); }
        .btn-blue { background: #06b6d4; color: black; }
        .btn-yellow { background: #eab308; color: black; }
        .btn-green { background: #22c55e; color: black; }
        .sin-pedidos { text-align: center; padding: 40px; opacity: 0.5; }
        .loader { position: fixed; inset: 0; background: #020617; display: flex; align-items: center; justify-content: center; flex-direction: column; z-index: 9999; }
        .spinner { width: 40px; height: 40px; border: 4px solid #1e293b; border-top-color: #06b6d4; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none; }
        .text-center { text-align: center; }
        .billetera-monto { font-size: 20px; font-weight: bold; color: #22c55e; }
    </style>
</head>
<body>

<div id="loader" class="loader">
    <div class="spinner"></div>
    <p style="color:#06b6d4; margin-top: 15px;">Iniciando Panel de Reparto...</p>
</div>

<div id="app" class="hidden">
    <div class="header">
        <div class="flex">
            <div style="display: flex; gap: 8px;">
                <button class="btn-historial" id="btnHistorial">📋 Historial</button>
                <button class="btn-salir" id="btnSalir">🚪 Salir</button>
            </div>
            <div>
                <div id="nombreRep" style="font-weight: bold;">Cargando...</div>
                <div id="codigoRep" style="font-size: 11px; color: #eab308;"></div>
            </div>
            <div style="text-align: center; background: rgba(255,255,255,0.03); padding: 6px 12px; border-radius: 12px;">
                <div style="font-size: 9px; opacity: 0.6;">💰 Billetera</div>
                <div class="billetera-monto" id="saldo">0.00€</div>
            </div>
        </div>
    </div>

    <div style="background: rgba(255,255,255,0.03); border-radius: 16px; padding: 12px; margin-bottom: 16px; display: flex; justify-content: space-between;">
        <span>🟢 <span id="estadoConexion">Conectado</span></span>
        <span id="contadorPedidos" style="background: rgba(6,182,212,0.2); padding: 4px 12px; border-radius: 20px; font-size: 12px;">0 pedidos</span>
    </div>

    <div id="listaPedidos"></div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzYFDShcrP7I4FKhiH3q5UcEInpSKJstrumJ9ddI4Tj9S31ZUgwiuie81fGFmCJ6ob2/exec';
    
    let codigoActual = null;
    let intervalo = null;
    let pedidosActivos = [];
    let ultimosIds = [];
    let audioNotif = null;
    
    function initAudio() {
        audioNotif = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
        audioNotif.volume = 0.8;
    }
    
    function playSound() {
        if (audioNotif) {
            audioNotif.currentTime = 0;
            audioNotif.play().catch(e => console.log('Audio no disponible'));
        }
    }
    
    function mostrarLoader(mostrar) {
        const loader = document.getElementById('loader');
        const app = document.getElementById('app');
        if (mostrar) {
            loader.classList.remove('hidden');
            app.classList.add('hidden');
        } else {
            loader.classList.add('hidden');
            app.classList.remove('hidden');
        }
    }
    
    async function cargarPedidos() {
        if (!codigoActual) return;
        
        try {
            document.getElementById('estadoConexion').innerHTML = 'Conectando...';
            const url = `${SCRIPT_URL}?action=getPedidosReparto&idRepartidor=${encodeURIComponent(codigoActual)}&t=${Date.now()}`;
            const resp = await fetch(url);
            const data = await resp.json();
            
            if (data.error) {
                document.getElementById('estadoConexion').innerHTML = 'Error';
                return;
            }
            
            document.getElementById('estadoConexion').innerHTML = 'Conectado';
            document.getElementById('nombreRep').innerHTML = data.nombre || codigoActual;
            document.getElementById('saldo').innerHTML = (parseFloat(data.saldo) || 0).toFixed(2) + '€';
            
            const nuevosIds = (data.pedidos || []).map(p => p.ID_PEDIDO);
            const realmenteNuevos = nuevosIds.filter(id => !ultimosIds.includes(id));
            if (realmenteNuevos.length > 0) playSound();
            ultimosIds = nuevosIds;
            
            pedidosActivos = (data.pedidos || []).filter(p => {
                const estado = (p.ESTADO || '').toUpperCase();
                return estado !== 'CANCELADO' && estado !== 'RECHAZADO' && estado !== 'ENTREGADO';
            });
            
            document.getElementById('contadorPedidos').innerHTML = `${pedidosActivos.length} pedido${pedidosActivos.length !== 1 ? 's' : ''}`;
            renderizarPedidos();
        } catch(e) {
            console.error(e);
            document.getElementById('estadoConexion').innerHTML = 'Offline';
        }
    }
    
    function renderizarPedidos() {
        const container = document.getElementById('listaPedidos');
        if (pedidosActivos.length === 0) {
            container.innerHTML = '<div class="sin-pedidos">📭 Sin pedidos asignados</div>';
            return;
        }
        
        let html = '';
        for (let p of pedidosActivos) {
            const estado = (p.ESTADO || '').toUpperCase();
            const total = parseFloat(p.TOTAL) || 0;
            const telefono = p.telf || '';
            const telefonoLimpio = telefono.replace(/\D/g, '');
            
            let botones = '';
            if (estado === 'LISTO') botones = `<button class="btn-blue" onclick="recogerPedido('${p.ID_PEDIDO}')">🏍️ RECOGER PEDIDO</button>`;
            else if (estado === 'EN CAMINO') botones = `<button class="btn-yellow" onclick="marcarLlegada('${p.ID_PEDIDO}')">📍 HE LLEGADO AL CLIENTE</button>`;
            else if (estado === 'LLEGÓ') botones = `<button class="btn-green" onclick="confirmarEntrega('${p.ID_PEDIDO}', ${total})">💰 CONFIRMAR ENTREGA</button>`;
            else botones = `<div style="background: rgba(6,182,212,0.1); padding: 14px; border-radius: 14px; text-align: center;">⏳ ${estado}</div>`;
            
            html += `<div class="card">
                <div class="flex"><span class="ref">📋 ${p.ID_PEDIDO}</span><span class="status-badge">${estado}</span></div>
                <div class="direccion">📍 ${p.DIRECCION || 'Sin dirección'}</div>
                <div class="cliente-box">
                    <div style="color: #a855f7;">👤 ${p.CLIENTE || 'Cliente'}</div>
                    <div class="flex" style="margin-top: 10px; justify-content: space-between;">
                        <span>📞 ${telefono || 'No disponible'}</span>
                        ${telefonoLimpio ? `<div style="display: flex; gap: 8px;">
                            <a href="tel:+34${telefonoLimpio}" style="background: #22c55e; color: black; padding: 6px 12px; border-radius: 10px; text-decoration: none; font-size: 11px;">📞 Llamar</a>
                            <a href="https://wa.me/34${telefonoLimpio}" target="_blank" style="background: #25D366; color: black; padding: 6px 12px; border-radius: 10px; text-decoration: none; font-size: 11px;">💬 WhatsApp</a>
                        </div>` : ''}
                    </div>
                    <div style="margin-top: 10px;">💳 ${p.PAGO || 'Efectivo'}</div>
                </div>
                <div class="flex" style="margin: 12px 0;"><span>💰 Total a cobrar:</span><span style="color: #22c55e; font-weight: bold;">${total.toFixed(2)}€</span></div>
                <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.DIRECCION || '')}" target="_blank" style="display: block; text-align: center; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 12px; font-size: 12px; color: #06b6d4; text-decoration: none;">🗺️ Abrir Mapa</a>
                ${botones}
            </div>`;
        }
        container.innerHTML = html;
    }
    
    window.recogerPedido = async function(id) {
        try {
            await fetch(`${SCRIPT_URL}?action=actualizarEstado&idPedido=${id}&nuevoEstado=EN CAMINO`);
            await Swal.fire({ title: '✅ Pedido en camino', icon: 'success', background: '#020617', color: 'white', timer: 1500, showConfirmButton: false });
            cargarPedidos();
        } catch(e) { Swal.fire({ title: 'Error', icon: 'error', background: '#020617', color: 'white' }); }
    };
    
    window.marcarLlegada = async function(id) {
        try {
            await fetch(`${SCRIPT_URL}?action=actualizarEstado&idPedido=${id}&nuevoEstado=LLEGÓ`);
            await Swal.fire({ title: '📍 Llegada registrada', icon: 'success', background: '#020617', color: 'white', timer: 1500, showConfirmButton: false });
            cargarPedidos();
        } catch(e) { Swal.fire({ title: 'Error', icon: 'error', background: '#020617', color: 'white' }); }
    };
    
    window.confirmarEntrega = function(id, total) {
        Swal.fire({
            title: '💰 Confirmar Entrega',
            text: `¿Cobrar ${total.toFixed(2)}€ y finalizar?`,
            icon: 'question', background: '#020617', color: 'white',
            confirmButtonColor: '#22c55e', confirmButtonText: '✅ Sí',
            showCancelButton: true
        }).then(async (res) => {
            if (res.isConfirmed) {
                try {
                    await fetch(`${SCRIPT_URL}?action=finalizarEntrega&idPedido=${id}&total=${total}`);
                    await Swal.fire({ title: '🎉 Entregado!', text: `+${total.toFixed(2)}€`, icon: 'success', background: '#020617', color: 'white', timer: 2000 });
                    cargarPedidos();
                } catch(e) { Swal.fire({ title: 'Error', icon: 'error', background: '#020617', color: 'white' }); }
            }
        });
    };
    
    async function mostrarHistorial() {
        try {
            const resp = await fetch(`${SCRIPT_URL}?action=getHistorialRepartidor&nombre=${encodeURIComponent(codigoActual)}`);
            const data = await resp.json();
            const entregas = (data.historial || []).filter(p => p.ESTADO === 'ENTREGADO');
            const total = entregas.reduce((sum, p) => sum + (parseFloat(p.TOTAL) || 0), 0);
            let lista = entregas.slice().reverse().map(p => `<div style="display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #1e293b;"><span>${p.ID_PEDIDO}</span><span style="color:#22c55e;">${(parseFloat(p.TOTAL)||0).toFixed(2)}€</span></div>`).join('');
            Swal.fire({ title: '📋 Historial', html: `<div style="text-align:left;"><div style="background:#1e293b;padding:10px;border-radius:12px;margin-bottom:10px;">💰 Total: ${total.toFixed(2)}€</div>${lista||'Sin entregas'}</div>`, background: '#020617', color: 'white', confirmButtonColor: '#06b6d4' });
        } catch(e) { Swal.fire({ title: 'Error', icon: 'error' }); }
    }
    
    async function cerrarSesion() {
        const res = await Swal.fire({ title: '¿Cerrar sesión?', icon: 'question', confirmButtonColor: '#ef4444', confirmButtonText: 'Sí', showCancelButton: true });
        if (res.isConfirmed) {
            if (intervalo) clearInterval(intervalo);
            localStorage.removeItem('repartidor_codigo');
            location.reload();
        }
    }
    
    async function iniciarApp() {
        console.log("⚙️ Iniciando app...");
        initAudio();
        mostrarLoader(true);
        
        document.getElementById('btnHistorial').onclick = mostrarHistorial;
        document.getElementById('btnSalir').onclick = cerrarSesion;
        
        let codigo = localStorage.getItem('repartidor_codigo');
        
        if (!codigo) {
            const result = await Swal.fire({
                title: '🔐 Código de Repartidor',
                input: 'text', inputPlaceholder: 'Ej: R001, R003',
                background: '#020617', color: 'white',
                confirmButtonColor: '#06b6d4', allowOutsideClick: false
            });
            if (result.value && result.value.trim()) {
                codigo = result.value.trim().toUpperCase();
                localStorage.setItem('repartidor_codigo', codigo);
            } else {
                mostrarLoader(false);
                document.getElementById('listaPedidos').innerHTML = '<div class="sin-pedidos">❌ No se ingresó código</div>';
                return;
            }
        }
        
        codigoActual = codigo;
        document.getElementById('codigoRep').innerHTML = `🔑 ${codigoActual}`;
        
        await cargarPedidos();
        mostrarLoader(false);
        
        if (intervalo) clearInterval(intervalo);
        intervalo = setInterval(cargarPedidos, 10000);
        
        if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
        console.log("✅ App iniciada!");
    }
    
    iniciarApp();
</script>
</body>
</html>
