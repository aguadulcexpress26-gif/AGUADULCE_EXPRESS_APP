<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aguadulce Express - Control de Cocina v1.0</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <style>
        body { 
            background-color: #020617; 
            color: #f8fafc; 
            font-family: system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }
        /* Scrollbars oscuras y elegantes para monitores */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
        
        /* Efecto de pulsación táctil activa para los botones de cocina */
        .btn-touch-active:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        /* Animación sutil para pedidos entrantes totalmente nuevos */
        .pedido-nuevo-anim {
            animation: pulseBorder 2s infinite alternate;
        }
        @keyframes pulseBorder {
            0% { border-color: rgba(6, 182, 212, 0.2); box-shadow: 0 0 0 0 rgba(6, 182, 212, 0.1); }
            100% { border-color: rgba(6, 182, 212, 0.7); box-shadow: 0 0 12px 2px rgba(6, 182, 212, 0.2); }
        }

        /* Estilos laterales para el Historial deslizante */
        #sideHistorial {
            position: fixed;
            top: 0;
            right: -350px;
            width: 320px;
            height: 100vh;
            background: #090d16;
            border-left: 1px border #1e293b;
            transition: right 0.3s ease;
            z-index: 50;
        }
        #sideHistorial.open {
            right: 0;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div id="sideHistorial" class="shadow-2xl p-4 flex flex-col">
        <div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-4">
            <h3 class="text-sm font-bold tracking-widest text-cyan-400 uppercase">📋 Historial de Hoy</h3>
            <button onclick="cerrarHistorial()" class="text-slate-400 hover:text-white font-bold text-xl px-2 cursor-pointer">&times;</button>
        </div>
        <div id="listaHistorial" class="space-y-3 flex-1 overflow-y-auto pr-1">
            </div>
    </div>

    <div class="relative w-full h-36 sm:h-44 bg-slate-900 overflow-hidden border-b border-slate-800">
        <img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=1200&q=80" 
             alt="Banner de Cocina" 
             class="absolute inset-0 w-full h-full object-cover opacity-15 filter blur-xs scale-105">
        
        <div class="absolute inset-0 bg-gradient-to-t from-[#020617] via-transparent to-black/30"></div>
        
        <div class="absolute inset-0 flex flex-col sm:flex-row justify-between items-start sm:items-center p-4 sm:px-8 gap-4">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 sm:w-14 sm:h-14 bg-slate-950 rounded-xl border border-cyan-500/30 flex items-center justify-center p-1.5 shadow-xl">
                    <img src="https://i.postimg.cc/mZwjLXxw/Logo-Aguadulce-Express.jpg" 
                         alt="Logo AE" 
                         class="w-full h-full object-contain rounded-md">
                </div>
                <div>
                    <span class="text-cyan-400 font-bold tracking-widest text-[10px] uppercase bg-cyan-500/10 px-2.5 py-0.5 rounded-full border border-cyan-500/20">
                        PANEL DE PRODUCCIÓN
                    </span>
                    <h1 id="nombreRestaurante" class="text-xl sm:text-2xl font-black text-white mt-0.5 drop-shadow-md">
                        AGUADULCE EXPRESS
                    </h1>
                </div>
            </div>
            
            <div class="flex items-center gap-4 bg-slate-950/80 p-2.5 rounded-xl border border-slate-800 backdrop-blur-md self-end sm:self-auto">
                <div class="text-right">
                    <span class="text-[10px] text-slate-500 block font-medium">Terminal de Cocina</span>
                    <span id="relojDigital" class="text-base font-bold text-white tracking-wider">00:00:00</span>
                </div>
                <div class="h-6 w-px bg-slate-800"></div>
                <div class="flex items-center gap-3 px-1">
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="tiendaToggle" onchange="confirmarToggleTienda()" class="sr-only peer">
                        <div class="w-9 h-5 bg-slate-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500"></div>
                    </label>
                    <span id="txtEstadoTienda" class="text-xs font-bold text-slate-400 uppercase tracking-wider">CERRADO</span>
                </div>
            </div>
        </div>
    </div>

    <main class="flex-1 p-4 md:p-6 max-w-[1600px] w-full mx-auto flex flex-col gap-4">
        
        <div class="flex flex-wrap justify-between items-center gap-3 bg-slate-900/50 border border-slate-800 p-3.5 rounded-xl">
            <div class="flex gap-4 sm:gap-6">
                <div class="text-xs sm:text-sm text-slate-400 font-medium">
                    Nuevos en Cola: <span id="cantPendientes" class="text-cyan-400 font-black text-base ml-1">0</span>
                </div>
                <div class="text-xs sm:text-sm text-slate-400 font-medium">
                    Al Fuego (Proceso): <span id="cantProceso" class="text-amber-400 font-black text-base ml-1">0</span>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="abrirHistorial()" class="btn-touch-active text-xs bg-slate-800 hover:bg-slate-700 font-bold text-slate-300 px-3 py-2 rounded-lg transition border border-slate-700 cursor-pointer">
                    📋 Ver Historial
                </button>
                <button onclick="preguntarSalir()" class="btn-touch-active text-xs bg-red-950/40 hover:bg-red-900/40 font-bold text-red-400 px-3 py-2 rounded-lg transition border border-red-900/30 cursor-pointer">
                    🚪 Salir
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 md:gap-6 flex-1">
            
            <div class="bg-slate-900/30 rounded-xl p-4 border border-slate-800/80 flex flex-col min-h-[400px]">
                <div class="flex justify-between items-center mb-3 border-b border-slate-800/60 pb-2">
                    <h3 class="font-bold text-xs uppercase tracking-wider text-cyan-400 flex items-center gap-2">
                        📥 Nuevos Pedidos
                    </h3>
                    <span class="bg-cyan-500/10 text-cyan-400 text-xs px-2 py-0.5 rounded-full font-black border border-cyan-500/20" id="badgeNuevos">0</span>
                </div>
                <div id="listaNuevos" class="space-y-3 flex-1 overflow-y-auto max-h-[65vh] pr-1">
                    </div>
            </div>

            <div class="bg-slate-900/30 rounded-xl p-4 border border-slate-800/80 flex flex-col min-h-[400px]">
                <div class="flex justify-between items-center mb-3 border-b border-slate-800/60 pb-2">
                    <h3 class="font-bold text-xs uppercase tracking-wider text-amber-400 flex items-center gap-2">
                        🍳 En Cocción / Proceso
                    </h3>
                    <span class="bg-amber-500/10 text-amber-400 text-xs px-2 py-0.5 rounded-full font-black border border-amber-500/20" id="badgeProceso">0</span>
                </div>
                <div id="listaProceso" class="space-y-3 flex-1 overflow-y-auto max-h-[65vh] pr-1">
                    </div>
            </div>

            <div class="bg-slate-900/30 rounded-xl p-4 border border-slate-800/80 flex flex-col min-h-[400px]">
                <div class="flex justify-between items-center mb-3 border-b border-slate-800/60 pb-2">
                    <h3 class="font-bold text-xs uppercase tracking-wider text-emerald-400 flex items-center gap-2">
                        📦 Listos para Retirar
                    </h3>
                    <span class="bg-emerald-500/10 text-emerald-400 text-xs px-2 py-0.5 rounded-full font-black border border-emerald-500/20" id="badgeListos">0</span>
                </div>
                <div id="listaListos" class="space-y-3 flex-1 overflow-y-auto max-h-[65vh] pr-1">
                    </div>
            </div>

        </div>
    </main>

    <script>
        // --- CONFIGURACIÓN Y VARIABLES GLOBALES DE CONEXIÓN ---
        const scriptURL = 'AQUÍ_TU_URL_DE_GOOGLE_APPS_SCRIPT'; // Tu WebApp de Google Sheets
        const MI_ID_REST = localStorage.getItem('AE_REST_ID') || 'RESTAURANTE_DEFAULT';
        
        // Estructuras de control reactivo
        let pedidosActivos = [];
        let historialHoy = [];
        let aceptados = new Set();
        let tiendaAbierta = false;

        // --- RELOJ Y RELACIONES DE TIEMPO ---
        function actualizarReloj() {
            const ahora = new Date();
            document.getElementById('relojDigital').innerText = ahora.toLocaleTimeString('es-ES');
        }
        setInterval(actualizarReloj, 1000);
        actualizarReloj();

        // Ciclo del temporizador dinámico para las cuentas atrás en platos al fuego
        setInterval(actualizarContadores, 1000);

        // --- INYECTOR DE VISTA (RENDER) SEGMENTADO ---
        function render() {
            // Referencias a los contenedores de las columnas
            const contNuevos = document.getElementById('listaNuevos');
            const contProceso = document.getElementById('listaProceso');
            const contListos = document.getElementById('listaListos');

            if (pedidosActivos.length === 0) { 
                const sinPedidosHTML = '<div class="text-center py-14 opacity-25 font-bold tracking-widest text-xs">SIN PEDIDOS ACTIVOS</div>';
                contNuevos.innerHTML = sinPedidosHTML;
                contProceso.innerHTML = sinPedidosHTML;
                contListos.innerHTML = sinPedidosHTML;
                actualizarBadges(0, 0, 0);
                return; 
            }

            // Clasificar según su estado real
            let htmlNuevos = '';
            let htmlProceso = '';
            let htmlListos = '';

            let cPend = 0, cProc = 0, cList = 0;

            pedidosActivos.forEach(p => {
                const estado = (p.estado || p.ESTADO || '').toLowerCase();
                const esNuevo = !aceptados.has(p.ID_PEDIDO) && estado !== 'en proceso' && estado !== 'listo';

                // Creación de la estructura base de la tarjeta
                let tarjetaHTML = `
                <div class="bg-slate-950 border ${esNuevo ? 'pedido-nuevo-anim border-cyan-500/30' : 'border-slate-800/80'} rounded-xl p-4 shadow-lg space-y-3 flex flex-col justify-between" data-id="${p.ID_PEDIDO}">
                    <div>
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="text-[11px] text-cyan-400 font-bold font-mono">#${p.ID_PEDIDO}</span>
                                <h4 class="font-bold text-sm text-white/90 mt-0.5">${p.CLIENTE}</h4>
                                <span class="text-[11px] font-medium text-slate-500 block mt-0.5">⏱️ Encolado: ${calcularTiempo(p.FECHA)}</span>
                            </div>
                            <span class="text-sm font-black text-emerald-400 bg-emerald-500/5 px-2 py-1 rounded-md border border-emerald-500/10">${parseFloat(p.TOTAL).toFixed(2)}€</span>
                        </div>
                        
                        <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-800 mt-2.5">
                            <div class="text-xs font-semibold font-mono text-cyan-400/90 whitespace-pre-wrap leading-relaxed">${p.PEDIDO_DETALLE || 'Sin detalle de productos'}</div>
                            ${p.NOTA ? `<div class="text-[11px] text-amber-400 mt-2 italic font-medium bg-amber-500/5 p-1.5 rounded border border-amber-500/10">💡 ${p.NOTA}</div>` : ''}
                        </div>
                    </div>
                `;

                // Renderizado condicional de los controles según la columna de destino
                if (estado === 'en proceso' || aceptados.has(p.ID_PEDIDO)) {
                    cProc++;
                    tarjetaHTML += `
                        <div class="space-y-2.5 pt-1">
                            <div class="tiempo-contador text-center font-mono font-bold text-xs py-1.5 rounded-lg bg-amber-500/10 text-amber-400 border border-amber-500/20" data-time="${p.timestamp_fin_elaboracion || ''}">
                                ⏳ Calculando...
                            </div>
                            <div class="grid grid-cols-3 gap-1.5 text-[10px] font-bold">
                                <button onclick="asignarTiempo('${p.ID_PEDIDO}', 15, event)" class="btn-touch-active bg-slate-900 hover:bg-slate-800 text-slate-300 py-1.5 rounded border border-slate-800 cursor-pointer">15 MIN</button>
                                <button onclick="asignarTiempo('${p.ID_PEDIDO}', 30, event)" class="btn-touch-active bg-slate-900 hover:bg-slate-800 text-slate-300 py-1.5 rounded border border-slate-800 cursor-pointer">30 MIN</button>
                                <button onclick="asignarTiempo('${p.ID_PEDIDO}', 45, event)" class="btn-touch-active bg-slate-900 hover:bg-slate-800 text-slate-300 py-1.5 rounded border border-slate-800 cursor-pointer">45 MIN</button>
                            </div>
                            <div class="grid grid-cols-2 gap-2 pt-1">
                                <button onclick="verDetalles('${p.ID_PEDIDO}')" class="btn-touch-active text-[11px] font-bold bg-slate-800 text-slate-300 py-2 rounded-lg cursor-pointer">DETALLES</button>
                                <button onclick="confirmarListo('${p.ID_PEDIDO}')" class="btn-touch-active text-[11px] font-black bg-emerald-500 text-slate-950 py-2 rounded-lg cursor-pointer shadow-md shadow-emerald-500/10">🧑‍🍳 ¡LISTO!</button>
                            </div>
                        </div>
                    </div>`;
                    htmlProceso += tarjetaHTML;
                } 
                else if (estado === 'listo') {
                    cList++;
                    tarjetaHTML += `
                        <div class="pt-2">
                            <div class="text-center text-[10px] font-bold tracking-wider text-emerald-400 bg-emerald-500/10 p-2 rounded-lg border border-emerald-500/20 uppercase">
                                🔔 Listo (Esperando Reparto)
                            </div>
                            <button onclick="verDetalles('${p.ID_PEDIDO}')" class="btn-touch-active w-full text-[11px] font-bold bg-slate-800 text-slate-300 py-2 rounded-lg mt-2 cursor-pointer">VER TICKET</button>
                        </div>
                    </div>`;
                    htmlListos += tarjetaHTML;
                } 
                else {
                    cPend++;
                    tarjetaHTML += `
                        <div class="flex flex-col gap-2 pt-2">
                            <button onclick="aceptarPedido('${p.ID_PEDIDO}', event)" class="btn-touch-active w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black tracking-wider text-xs p-3 rounded-xl transition uppercase cursor-pointer">
                                ACEPTAR PEDIDO
                            </button>
                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="verDetalles('${p.ID_PEDIDO}')" class="btn-touch-active text-[11px] font-bold bg-slate-900 border border-slate-800 text-slate-400 py-2 rounded-lg cursor-pointer">DETALLES</button>
                                <button onclick="rechazarPedido('${p.ID_PEDIDO}', event)" class="btn-touch-active text-[11px] font-bold bg-red-950/20 border border-red-900/30 text-red-400 py-2 rounded-lg cursor-pointer">RECHAZAR</button>
                            </div>
                        </div>
                    </div>`;
                    htmlNuevos += tarjetaHTML;
                }
            });

            // Volcar construcciones HTML
            contNuevos.innerHTML = htmlNuevos || '<div class="text-center py-10 opacity-25 text-xs font-semibold">Cola limpia</div>';
            contProceso.innerHTML = htmlProceso || '<div class="text-center py-10 opacity-25 text-xs font-semibold">Fuegos vacíos</div>';
            contListos.innerHTML = htmlListos || '<div class="text-center py-10 opacity-25 text-xs font-semibold">Nada esperando despachar</div>';
            
            actualizarBadges(cPend, cProc, cList);
        }

        function actualizarBadges(nuevos, proceso, listos) {
            document.getElementById('badgeNuevos').innerText = nuevos;
            document.getElementById('badgeProceso').innerText = proceso;
            document.getElementById('badgeListos').innerText = listos;
            document.getElementById('cantPendientes').innerText = nuevos;
            document.getElementById('cantProceso').innerText = proceso;
        }

        // --- RELACIONES DE CÓMPUTO CRONOLÓGICO ---
        function calcularTiempo(fechaStr) {
            if(!fechaStr) return "---";
            let diff = Math.floor((new Date() - new Date(fechaStr)) / 60000);
            if(diff < 1) return "Ahora mismo";
            if(diff < 60) return `Hace ${diff} min`;
            return `Hace ${Math.floor(diff/60)}h ${diff%60}min`;
        }
        
        function actualizarContadores() {
            document.querySelectorAll('.tiempo-contador').forEach(el => {
                const target = parseInt(el.getAttribute('data-time'));
                if (!target) return;
                const ahora = Date.now();
                const diff = target - ahora;
                if (diff <= 0) {
                    el.innerHTML = "🔔 ¡AVISAR / LISTO!";
                    el.style.background = "rgba(34, 197, 94, 0.15)";
                    el.style.color = "#22c55e";
                    el.style.borderColor = "rgba(34, 197, 94, 0.3)";
                } else {
                    const min = Math.floor(diff / 60000);
                    const seg = Math.floor((diff % 60000) / 1000);
                    el.innerHTML = `⏳ Quedan: ${min}m ${seg}s`;
                }
            });
        }

        // --- ACCIONES TÁCTILES DEL PANEL (LOGICA ASÍNCRONA) ---
        async function aceptarPedido(id, event) { 
            const btn = event.target;
            btn.disabled = true;
            const originalText = btn.innerHTML;
            btn.innerHTML = '⏳ PROCESANDO...';
            
            if (typeof detenerSonidoRepetitivo === "function") detenerSonidoRepetitivo(id);
            
            aceptados.add(id); 
            let ahora = Date.now();
            let timestampFin = ahora + (20 * 60 * 1000); // 20 min base de cocina
            try {
                await database.ref('pedidos/'+id).update({ 
                    estado: 'en proceso',
                    tiempo_elaboracion: 20,
                    timestamp_inicio: ahora,
                    timestamp_fin_elaboracion: timestampFin
                });
                await fetch(`${scriptURL}?action=actualizarEstado&idPedido=${id}&nuevoEstado=EN PROCESO`);
                if (typeof playSoundAceptar === "function") playSoundAceptar();
                render(); 
                if (typeof cargar === "function") cargar();
            } catch(err) {
                console.error(err);
                aceptados.delete(id);
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }
        
        async function asignarTiempo(id, min, event) {
            const btn = event.target;
            btn.disabled = true;
            const textOrig = btn.innerHTML;
            btn.innerHTML = '⏳...';
            
            let ahora = Date.now();
            let timestampFin = ahora + (min * 60 * 1000);
            let horaStr = new Date(timestampFin).getHours().toString().padStart(2,'0') + ":" + new Date(timestampFin).getMinutes().toString().padStart(2,'0');
            
            try {
                await database.ref('pedidos/'+id).update({ 
                    tiempo_elaboracion: min,
                    timestamp_inicio: ahora,
                    timestamp_fin_elaboracion: timestampFin,
                    tiempoEstimado: min, 
                    horaSalida: horaStr
                });
                
                await fetch(`${scriptURL}?action=actualizarEstado&idPedido=${id}&nuevoEstado=EN PROCESO&tiempo=${min}`);
                if (typeof cargar === "function") cargar();
                
                Swal.fire({
                    title: '⏳ Tiempo Asignado',
                    text: `Pedido #${id} listo a las ${horaStr}`,
                    icon: 'success',
                    background: '#020617',
                    color: 'white',
                    timer: 1500,
                    showConfirmButton: false
                });
            } catch(e) {
                console.error(e);
            } finally {
                btn.disabled = false;
                btn.innerHTML = textOrig;
            }
        }
        
        async function rechazarPedido(id, event) {
            const btn = event.target;
            btn.disabled = true;
            
            if (typeof detenerSonidoRepetitivo === "function") detenerSonidoRepetitivo(id);
            
            const { value: motivo } = await Swal.fire({
                title: '❌ Rechazar Pedido',
                text: 'Motivo del rechazo:',
                input: 'select',
                inputOptions: {
                    'No disponible': '📦 Plato no disponible en este momento',
                    'Ingredientes': '🥬 Ingredientes agotados',
                    'Capacidad': '🏭 Restaurante a máxima capacidad',
                    'Horario': '⏰ Fuera de horario de preparación',
                    'Otro': '📝 Otro motivo (especificar)'
                },
                inputPlaceholder: 'Selecciona un motivo...',
                icon: 'warning',
                background: '#020617',
                color: 'white',
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'Rechazar',
                cancelButtonText: 'Cancelar',
                showCancelButton: true
            });
            
            if (!motivo) {
                btn.disabled = false;
                return;
            }
            
            let motivoTexto = motivo;
            if (motivo === 'Otro') {
                const { value: otro } = await Swal.fire({
                    title: 'Especifica el motivo',
                    input: 'text',
                    inputPlaceholder: 'Ej: Problemas con el pedido...',
                    background: '#020617',
                    color: 'white',
                    confirmButtonText: 'Aceptar',
                    cancelButtonText: 'Cancelar',
                    showCancelButton: true
                });
                if (otro) motivoTexto = otro;
            }
            
            try {
                await fetch(`${scriptURL}?action=actualizarEstado&idPedido=${id}&nuevoEstado=RECHAZADO&tiempo=${encodeURIComponent(motivoTexto)}`);
                await database.ref('pedidos/'+id).update({ 
                    estado: 'rechazado',
                    motivo_rechazo: motivoTexto,
                    timestamp_rechazo: Date.now()
                });
                if (typeof playSoundRechazar === "function") playSoundRechazar();
                
                Swal.fire({
                    title: '❌ Pedido Fue Rechazado',
                    text: `Motivo: ${motivoTexto}`,
                    icon: 'error',
                    background: '#020617',
                    color: 'white',
                    timer: 2000,
                    showConfirmButton: false
                });
                if (typeof cargar === "function") cargar();
            } catch(e) {
                console.error(e);
                btn.disabled = false;
            }
        }
        
        function verDetalles(id) { 
            let p = [...pedidosActivos, ...historialHoy].find(x => x.ID_PEDIDO == id); 
            if(p) {
                let textoMetodo = p.PAGO || 'Efectivo';
                let informacionPagoExtra = '';
                let pagaCon = parseFloat(p.PAGA_CON) || 0;
                if(pagaCon > 0 && textoMetodo.toUpperCase().includes('EFECTIVO')) {
                    let cambio = pagaCon - (parseFloat(p.TOTAL) || 0);
                    informacionPagoExtra = `<br><strong>💵 Paga con:</strong> ${pagaCon.toFixed(2)}€ (Cambio: ${cambio > 0 ? cambio.toFixed(2) : '0.00'}€)`;
                }

                Swal.fire({
                    title: `Pedido #${p.ID_PEDIDO}`,
                    html: `<div id="ticketModalView" style="text-align:left; font-size: 14px; line-height: 1.6;">
                        <strong>👤 Cliente:</strong> ${p.CLIENTE}<br>
                        <strong>📍 Dirección:</strong> ${p.DIRECCION || 'No especificada'}<br>
                        <strong>💳 Método de Pago:</strong> ${textoMetodo}${informacionPagoExtra}<br><br>
                        <strong style="border-bottom: 1px dashed rgba(255,255,255,0.2); display:block; padding-bottom:4px;">📋 DETALLE DEL PEDIDO:</strong>
                        <div style="background: rgba(255,255,255,0.03); padding: 10px; border-radius: 8px; margin-top: 6px; font-family: monospace; white-space: pre-wrap; color: #06b6d4;">${p.PEDIDO_DETALLE || ''}</div><br>
                        <strong>💰 Total:</strong> <span style="font-size:16px; color:#22c55e; font-weight:bold;">${parseFloat(p.TOTAL).toFixed(2)}€</span>
                    </div>`,
                    icon: 'info',
                    background: '#020617',
                    color: 'white',
                    showCancelButton: true,
                    confirmButtonColor: '#06b6d4',
                    cancelButtonColor: '#1e293b',
                    confirmButtonText: '🖨️ Imprimir Ticket',
                    cancelButtonText: 'Cerrar'
                }).then((result) => {
                    if (result.isConfirmed) {
                        imprimirTicketFisico(p);
                    }
                });
            }
        }

        function imprimirTicketFisico(pedido) {
            const ventanaImpresion = window.open('', '_blank', 'width=600,height=600');
            let cambioTexto = '';
            let pagaCon = parseFloat(pedido.PAGA_CON) || 0;
            if(pagaCon > 0 && (pedido.PAGO || '').toUpperCase().includes('EFECTIVO')) {
                let vuelto = pagaCon - (parseFloat(pedido.TOTAL) || 0);
                cambioTexto = `
                    <p><strong>Paga Con:</strong> ${pagaCon.toFixed(2)}€</p>
                    <p><strong>Cambio a Llevar:</strong> ${vuelto > 0 ? vuelto.toFixed(2) : '0.00'}€</p>
                `;
            }

            ventanaImpresion.document.write(`
                <html>
                <head>
                    <title>Ticket_Pedido_${pedido.ID_PEDIDO}</title>
                    <style>
                        body { 
                            font-family: 'Courier New', Courier, monospace; 
                            color: #000; 
                            background: #fff; 
                            padding: 10px; 
                            font-size: 14px; 
                            width: 100%;
                            max-width: 280px;
                            margin: 0 auto;
                        }
                        .text-center { text-align: center; }
                        .separator { border-top: 1px dashed #000; margin: 10px 0; }
                        .id-pedido { font-size: 22px; font-weight: bold; margin: 5px 0; }
                        .detalle-productos { white-space: pre-wrap; font-size: 13px; font-weight: bold; margin: 10px 0; }
                        .total { font-size: 16px; font-weight: bold; text-align: right; }
                    </style>
                </head>
                <body>
                    <div class="text-center">
                        <h2 style="margin:0; font-size:16px;">AGUADULCE EXPRESS</h2>
                        <p style="margin:2px 0; font-size:11px;">Control de Cocina y Embalaje</p>
                        <div class="separator"></div>
                        <div class="id-pedido">TICKET #${pedido.ID_PEDIDO}</div>
                        <p style="margin:2px 0; font-size:11px;">${new Date().toLocaleString('es-ES')}</p>
                    </div>
                    <div class="separator"></div>
                    <p><strong>Cliente:</strong> ${pedido.CLIENTE}</p>
                    <p><strong>Dirección:</strong> ${pedido.DIRECCION || 'Para Recoger'}</p>
                    <div class="separator"></div>
                    <div class="detalle-productos">${pedido.PEDIDO_DETALLE || ''}</div>
                    <div class="separator"></div>
                    <p><strong>Pago:</strong> ${pedido.PAGO || 'Efectivo'}</p>
                    ${cambioTexto}
                    <div class="total">TOTAL: ${parseFloat(pedido.TOTAL).toFixed(2)}€</div>
                    <div class="separator"></div>
                    <div class="text-center" style="font-size:11px; margin-top:15px;">
                        ¡Buen servicio!<br>Verifica bien la bolsa antes de salir.
                    </div>
                    <script>
                        window.onload = function() {
                            window.print();
                            setTimeout(function(){ window.close(); }, 500);
                        };
                    <\/script>
                </body>
                </html>
            `);
            ventanaImpresion.document.close();
        }
        
        function confirmarListo(id) {
            Swal.fire({
                title: '¿Pedido listo?',
                text: `El repartidor será notificado inmediatamente`,
                icon: 'question',
                background: '#020617',
                color: 'white',
                confirmButtonColor: '#eab308',
                confirmButtonText: '✅ Sí, listo',
                showCancelButton: true,
                cancelButtonText: 'Cancelar'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    await ejecutarListo(id);
                }
            });
        }

        async function ejecutarListo(id) {
            let timestampFin = Date.now();
            try {
                await database.ref('pedidos/'+id).update({ 
                    estado: 'listo',
                    timestamp_fin_elaboracion: timestampFin,
                    timestamp_listo: timestampFin
                });
                await fetch(`${scriptURL}?action=actualizarEstado&idPedido=${id}&nuevoEstado=LISTO`);
                if (typeof playSoundListo === "function") playSoundListo();
                
                aceptados.delete(id);
                pedidosActivos = pedidosActivos.filter(p => p.ID_PEDIDO !== id);
                
                Swal.fire({
                    title: '✅ Pedido Listo',
                    text: 'Repartidor notificado automáticamente',
                    icon: 'success',
                    background: '#020617',
                    color: 'white',
                    timer: 1500,
                    showConfirmButton: false
                });
                
                render();
                if (typeof cargar === "function") cargar(); 
            } catch(e) {
                console.error(e);
            }
        }
        
        // --- APERTURA Y CIERRE DE LA TIENDA DE COMIDAS ---
        function confirmarToggleTienda() { 
            let nuevo = !tiendaAbierta ? "Abierto" : "Cerrado"; 
            Swal.fire({
                title: `¿Cambiar estado a ${nuevo.toUpperCase()}?`,
                text: tiendaAbierta ? 'Al cerrar, no se recibirán nuevos pedidos' : 'Al abrir, se recibirán pedidos normalmente',
                icon: 'question',
                background: '#020617',
                color: 'white',
                confirmButtonColor: '#06b6d4',
                confirmButtonText: 'Confirmar',
                showCancelButton: true
            }).then(async (result) => {
                if (result.isConfirmed) {
                    await ejecutarToggle(nuevo);
                } else {
                    document.getElementById('tiendaToggle').checked = tiendaAbierta;
                }
            });
        }
        
        async function ejecutarToggle(estado) { 
            try {
                await fetch(`${scriptURL}?action=toggleTienda&idRest=${MI_ID_REST}&sheet=configuracion&nuevoEstado=${estado}`); 
                tiendaAbierta = (estado === "Abierto");
                actualizarInterfazTienda();
                setTimeout(typeof cargar === "function" ? cargar : () => {}, 1000); 
            } catch(e) {
                console.error(e);
                document.getElementById('tiendaToggle').checked = !tiendaAbierta;
            }
        }

        function actualizarInterfazTienda() {
            const txt = document.getElementById('txtEstadoTienda');
            document.getElementById('tiendaToggle').checked = tiendaAbierta;
            if(tiendaAbierta) {
                txt.innerText = "ABIERTO";
                txt.className = "text-xs font-bold text-emerald-400 uppercase tracking-wider";
            } else {
                txt.innerText = "CERRADO";
                txt.className = "text-xs font-bold text-slate-400 uppercase tracking-wider";
            }
        }
        
        // --- INTERFAZ HISTORIAL Y SESIÓN ---
        function preguntarSalir() {
            Swal.fire({
                title: '¿Cerrar sesión?',
                icon: 'question',
                background: '#020617',
                color: 'white',
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'Sí, salir',
                showCancelButton: true
            }).then(result => {
                if (result.isConfirmed) {
                    localStorage.removeItem('AE_REST_ID');
                    location.reload();
                }
            });
        }
        
        function abrirHistorial() {
            let lista = document.getElementById('listaHistorial');
            
            if(historialHoy.length === 0) {
                lista.innerHTML = '<div class="text-center opacity-50 text-xs py-10">Ningún pedido registrado hoy</div>';
            } else {
                lista.innerHTML = historialHoy.map(p => {
                    const estado = (p.ESTADO || p.estado || '').toUpperCase();
                    let estadoTexto = estado;
                    if (estado === 'LISTO') estadoTexto = '🔔 LISTO PARA REPARTIDOR';
                    else if (estado === 'EN CAMINO') estadoTexto = '🛵 EN REPARTO';
                    else if (estado === 'ENTREGADO') estadoTexto = '✅ ENTREGADO';
                    else if (estado === 'RECHAZADO') estadoTexto = '🚫 RECHAZADO';
                    
                    return `
                    <div class="bg-slate-900 border border-slate-800 p-3 rounded-lg cursor-pointer active:scale-95 transition-transform" onclick="cerrarHistorial(); verDetalles('${p.ID_PEDIDO}')">
                        <div class="flex justify-between items-center">
                            <span class="text-cyan-400 font-bold font-mono text-xs">#${p.ID_PEDIDO}</span>
                            <span class="font-bold text-emerald-400 text-xs">${parseFloat(p.TOTAL).toFixed(2)}€</span>
                        </div>
                        <div class="text-xs mt-1 text-white/70 font-semibold">${p.CLIENTE}</div>
                        <div class="text-[9px] mt-1 text-cyan-400/70 uppercase tracking-wider font-bold">${estadoTexto}</div>
                    </div>`;
                }).join('');
            }
            document.getElementById('sideHistorial').classList.add('open');
        }
        
        function cerrarHistorial() { 
            document.getElementById('sideHistorial').classList.remove('open'); 
        }

        function forzarRefresco() {
            if (typeof cargar === "function") {
                cargar();
            } else {
                Swal.fire({ title: 'Sincronizando...', timer: 800, showConfirmButton: false, background: '#020617', color:'white' });
                render();
            }
        }

        // --- GESTIÓN DE AUDIO CONTEXTUAL ---
        function activarSonidosPorPrimeraVez() {
            if (window.sonidosActivados) return;
            window.sonidosActivados = true;
            console.log("🔊 Contexto de audio inicializado");
            
            const testAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
            testAudio.volume = 0;
            testAudio.play().then(() => {
                testAudio.pause();
                testAudio.currentTime = 0;
            }).catch(e => console.log("Audio interactivo:", e.message));
            
            document.removeEventListener('click', activarSonidosPorPrimeraVez);
        }
        document.addEventListener('click', activarSonidosPorPrimeraVez, { once: true });

        // --- INTERCEPCIÓN EN CASO DE POBLACIÓN DE PRUEBA INICIAL ---
        // Si no tienes Firebase activo al cargar por primera vez, pinta la estructura base
        window.onload = () => {
            actualizarInterfazTienda();
            render();
        };

        // --- REGISTRO DEL SERVICE WORKER ---
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(reg => {
                console.log('✅ Service Worker registrado');
            }).catch(err => {
                console.log('❌ Error SW:', err);
            });
        }
    </script>
</body>
</html>
