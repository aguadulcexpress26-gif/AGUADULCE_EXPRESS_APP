<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reparto Express - Aguadulce</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; color: white; }
        .header { padding: 20px; background: linear-gradient(to bottom, rgba(6,182,212,0.1), transparent); }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-salir { background: rgba(255,255,255,0.1); border: none; padding: 10px 15px; border-radius: 12px; cursor: pointer; }
        .repartidor-nombre { font-size: 18px; font-weight: 900; }
        .repartidor-id { font-size: 10px; color: #06b6d4; }
        .billetera { text-align: right; }
        .billetera-monto { font-size: 20px; font-weight: 900; color: #06b6d4; }
        .status-bar { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 12px; display: flex; justify-content: space-between; margin-top: 10px; }
        .contador-pedidos { background: #06b6d4; color: black; padding: 4px 12px; border-radius: 20px; font-weight: 900; font-size: 12px; }
        .main { padding: 20px; padding-bottom: 80px; }
        .card-pedido { background: rgba(30,41,59,0.8); border-radius: 24px; padding: 16px; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.05); }
        .ref-pedido-grande { font-size: 16px; font-weight: 900; background: rgba(6,182,212,0.2); padding: 4px 12px; border-radius: 20px; color: #06b6d4; }
        .direccion { font-size: 16px; font-weight: 900; margin: 12px 0; }
        .btn-principal { width: 100%; padding: 14px; border-radius: 16px; font-weight: 900; border: none; margin-top: 10px; cursor: pointer; }
        .btn-principal.blue { background: #06b6d4; color: black; }
        .btn-principal.yellow { background: #eab308; color: black; }
        .btn-principal.green { background: #22c55e; color: white; }
        .btn-principal.red { background: #ef4444; color: white; }
        .timer-espera { background: #eab308; color: black; padding: 12px; border-radius: 16px; text-align: center; font-weight: 900; margin: 10px 0; }
        .sin-pedidos { text-align: center; padding: 50px; opacity: 0.5; }
        .loader { position: fixed; inset: 0; background: #020617; z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(6,182,212,0.2); border-top-color: #06b6d4; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .mt-2 { margin-top: 8px; }
        .mb-2 { margin-bottom: 8px; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>

<div id="loader" class="loader">
    <div class="spinner"></div>
    <p style="color:#06b6d4; margin-top: 15px;">Iniciando...</p>
</div>

<audio id="audio-notificacion" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

<div id="app" style="display: none;">
    <div class="header">
        <div class="header-top">
            <button class="btn-salir" onclick="cerrarSesion()">🚪 Salir</button>
            <div>
                <div class="repartidor-nombre" id="nombreRepartidor">Repartidor</div>
                <div class="repartidor-id" id="codigoRepartidor">Cargando...</div>
            </div>
            <div class="billetera">
                <div style="font-size: 10px; opacity: 0.6;">Billetera</div>
                <div class="billetera-monto" id="saldoBilletera">0.00€</div>
            </div>
        </div>
        <div class="status-bar">
            <span>📡 Estado: <span id="estadoConexion">Conectado</span></span>
            <span class="contador-pedidos" id="contadorPedidos">0 pedidos</span>
        </div>
    </div>
    <main class="main" id="listaPedidos">
        <div class="sin-pedidos">Cargando pedidos...</div>
    </main>
</div>

<script>
    // Configuración Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyCJcLQ0ikUwZSV7L_8mLLax8B5qnhP0Roc",
        authDomain: "aguadulce-notificaciones.firebaseapp.com",
        databaseURL: "https://aguadulce-notificaciones-default-rtdb.firebaseio.com",
        projectId: "aguadulce-notificaciones",
        storageBucket: "aguadulce-notificaciones.firebasestorage.app",
        messagingSenderId: "940283725281",
        appId: "1:940283725281:web:3b388d2e7f362a99d2bea0"
    };
    
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzYFDShcrP7I4FKhiH3q5UcEInpSKJstrumJ9ddI4Tj9S31ZUgwiuie81fGFmCJ6ob2/exec';
    
    let miCodigo = localStorage.getItem('codigoRepartidor');
    let pedidos = [];
    let audioNotif = null;
    let temporizadores = {};
    let intervaloRefresco = null;
    
    // Función para mostrar notificaciones
    function mostrarMensaje(texto, tipo) {
        Swal.fire({
            title: tipo === 'error' ? 'Error' : (tipo === 'success' ? 'Éxito' : 'Información'),
            text: texto,
            icon: tipo || 'info',
            background: '#020617',
            color: 'white',
            confirmButtonColor: '#06b6d4'
        });
    }
    
    // Función para mostrar toast
    function mostrarToast(texto) {
        const toast = document.createElement('div');
        toast.style.position = 'fixed';
        toast.style.bottom = '20px';
        toast.style.left = '50%';
        toast.style.transform = 'translateX(-50%)';
        toast.style.backgroundColor = '#06b6d4';
        toast.style.color = 'black';
        toast.style.padding = '10px 20px';
        toast.style.borderRadius = '30px';
        toast.style.fontWeight = 'bold';
        toast.style.zIndex = '9999';
        toast.innerText = texto;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }
    
    // Iniciar sesión
    async function iniciarSesion() {
        if (!miCodigo) {
            const result = await Swal.fire({
                title: 'Código de Repartidor',
                input: 'text',
                inputPlaceholder: 'Ej: R001',
                background: '#020617',
                color: 'white',
                confirmButtonColor: '#06b6d4',
                showCancelButton: false
            });
            if (result.value) {
                miCodigo = result.value.trim().toUpperCase();
                localStorage.setItem('codigoRepartidor', miCodigo);
            } else {
                location.reload();
                return;
            }
        }
        
        document.getElementById('codigoRepartidor').innerHTML = '🔑 ' + miCodigo;
        audioNotif = document.getElementById('audio-notificacion');
        
        // Cargar datos
        await cargarPedidos();
        
        // Escuchar cambios en tiempo real
        database.ref('pedidosActivos').on('value', function() {
            cargarPedidos();
        });
        
        // Refrescar cada 10 segundos
        intervaloRefresco = setInterval(cargarPedidos, 10000);
        
        document.getElementById('loader').style.display = 'none';
        document.getElementById('app').style.display = 'block';
    }
    
    // Cargar pedidos del repartidor
    async function cargarPedidos() {
        try {
            const url = scriptURL + '?action=getPedidosReparto&idRepartidor=' + encodeURIComponent(miCodigo) + '&t=' + Date.now();
            const resp = await fetch(url);
            const data = await resp.json();
            
            if (data.error) {
                mostrarMensaje(data.error, 'error');
                cerrarSesion();
                return;
            }
            
            pedidos = data.pedidos || [];
            const saldo = parseFloat(data.saldo) || 0;
            
            document.getElementById('nombreRepartidor').innerText = data.nombre || 'Repartidor';
            document.getElementById('saldoBilletera').innerText = saldo.toFixed(2) + '€';
            document.getElementById('contadorPedidos').innerText = pedidos.length + ' pedido' + (pedidos.length !== 1 ? 's' : '');
            document.getElementById('estadoConexion').innerText = 'Conectado';
            
            // Obtener tiempos de Firebase
            const snapshot = await database.ref('pedidos').once('value');
            const fbData = snapshot.val() || {};
            
            for (let i = 0; i < pedidos.length; i++) {
                const p = pedidos[i];
                const fb = fbData[p.ID_PEDIDO];
                if (fb) {
                    p.timestampListo = fb.timestampListo;
                    p.estadoFirebase = fb.estado;
                }
            }
            
            renderizarPedidos();
            
        } catch (error) {
            console.error(error);
            document.getElementById('estadoConexion').innerText = 'Offline';
        }
    }
    
    // Renderizar lista de pedidos
    function renderizarPedidos() {
        const contenedor = document.getElementById('listaPedidos');
        
        if (!pedidos || pedidos.length === 0) {
            contenedor.innerHTML = '<div class="sin-pedidos">📭 Sin pedidos asignados</div>';
            return;
        }
        
        let html = '';
        for (let i = 0; i < pedidos.length; i++) {
            const p = pedidos[i];
            const estado = (p.ESTADO || '').toUpperCase();
            const total = parseFloat(p.TOTAL) || 0;
            const telefono = p.telf || p.WHATSAPP || '';
            const telefonoLimpio = telefono.replace(/\D/g, '');
            
            // Calcular tiempo restante si está listo
            let tiempoRestante = '';
            let esListo = false;
            if (p.timestampListo) {
                const ahora = Date.now();
                const diff = p.timestampListo - ahora;
                if (diff <= 0) {
                    esListo = true;
                } else {
                    const minutos = Math.floor(diff / 60000);
                    const segundos = Math.floor((diff % 60000) / 1000);
                    tiempoRestante = minutos + 'm ' + segundos + 's';
                }
            }
            
            let botones = '';
            
            if (estado === 'LISTO' || esListo) {
                botones = '<button class="btn-principal blue" onclick="recogerPedido(\'' + p.ID_PEDIDO + '\')">🛵 RECOGER PEDIDO</button>';
            } else if (estado === 'EN CAMINO') {
                botones = '<button class="btn-principal yellow" onclick="marcarLlegada(\'' + p.ID_PEDIDO + '\')">📍 HE LLEGADO AL CLIENTE</button>';
            } else if (estado === 'LLEGÓ' || estado === 'LLEGO') {
                const tieneTimer = temporizadores[p.ID_PEDIDO];
                botones = '<button class="btn-principal green" onclick="confirmarEntrega(\'' + p.ID_PEDIDO + '\', ' + total + ')">💰 COBRAR Y ENTREGAR (' + total.toFixed(2) + '€)</button>';
                if (!tieneTimer) {
                    botones += '<button class="btn-principal red" onclick="iniciarTimer(\'' + p.ID_PEDIDO + '\', ' + total + ')">⏰ CLIENTE NO RESPONDE</button>';
                }
                if (tieneTimer) {
                    botones = '<div class="timer-espera">⏰ Esperando al cliente...</div>' + botones;
                }
            } else {
                botones = '<div style="background: rgba(6,182,212,0.2); padding: 12px; border-radius: 16px; text-align: center; font-weight: bold;">⏳ Preparando pedido... ' + (tiempoRestante ? ('Listo en: ' + tiempoRestante) : '') + '</div>';
            }
            
            html += '<div class="card-pedido">';
            html += '<div class="flex-between">';
            html += '<span class="ref-pedido-grande">📋 ' + p.ID_PEDIDO + '</span>';
            html += '<span style="background: #06b6d4; color: black; padding: 2px 10px; border-radius: 12px; font-size: 10px; font-weight: bold;">' + (estado || 'PREPARANDO') + '</span>';
            html += '</div>';
            html += '<div class="direccion">📍 ' + (p.DIRECCION || 'Sin dirección') + '</div>';
            html += '<div style="background: #0f172a; border-radius: 16px; padding: 12px; margin: 12px 0;">';
            html += '<div style="color: #06b6d4; font-weight: bold;">👤 ' + (p.CLIENTE || 'Cliente') + '</div>';
            html += '<div class="flex-between mt-2">';
            html += '<span>📞 ' + telefono + '</span>';
            html += '<div>';
            if (telefonoLimpio) {
                html += '<a href="tel:' + telefonoLimpio + '" style="background: #22c55e; color: black; padding: 5px 10px; border-radius: 12px; text-decoration: none; margin-right: 5px; font-size: 11px;">📞 Llamar</a>';
                html += '<a href="https://wa.me/' + telefonoLimpio + '" target="_blank" style="background: #25D366; color: black; padding: 5px 10px; border-radius: 12px; text-decoration: none; font-size: 11px;">💬 WhatsApp</a>';
            }
            html += '</div></div>';
            html += '<div class="mt-2" style="font-size: 11px; opacity: 0.7;">💳 Pago: ' + (p.PAGO || 'Efectivo') + '</div>';
            html += '</div>';
            html += '<div class="flex-between" style="margin: 12px 0;">';
            html += '<span class="ref-pedido-grande">💰 Total: ' + total.toFixed(2) + '€</span>';
            html += '<a href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.DIRECCION || '') + '" target="_blank" style="color: #06b6d4; text-decoration: none;">📍 Mapa</a>';
            html += '</div>';
            html += botones;
            html += '</div>';
        }
        
        contenedor.innerHTML = html;
    }
    
    // Recoger pedido
    async function recogerPedido(id) {
        const confirm = await Swal.fire({
            title: '¿Recoger pedido?',
            text: 'Confirma que has recogido el pedido',
            icon: 'question',
            background: '#020617',
            color: 'white',
            confirmButtonColor: '#06b6d4',
            showCancelButton: true
        });
        if (!confirm.isConfirmed) return;
        
        try {
            await fetch(scriptURL + '?action=actualizarEstado&idPedido=' + id + '&nuevoEstado=EN CAMINO');
            await database.ref('pedidos/' + id).update({ estado: 'en_camino' });
            mostrarToast('✅ Pedido recogido');
            await cargarPedidos();
        } catch (e) {
            mostrarMensaje('Error al recoger', 'error');
        }
    }
    
    // Marcar llegada
    async function marcarLlegada(id) {
        const confirm = await Swal.fire({
            title: '¿Has llegado?',
            text: 'Confirma que estás en la dirección',
            icon: 'question',
            background: '#020617',
            color: 'white',
            confirmButtonColor: '#eab308',
            showCancelButton: true
        });
        if (!confirm.isConfirmed) return;
        
        try {
            await fetch(scriptURL + '?action=actualizarEstado&idPedido=' + id + '&nuevoEstado=LLEGÓ');
            await database.ref('pedidos/' + id).update({ estado: 'llegando' });
            mostrarToast('📍 Llegaste al cliente');
            await cargarPedidos();
        } catch (e) {
            mostrarMensaje('Error', 'error');
        }
    }
    
    // Iniciar timer de cancelación
    function iniciarTimer(idPedido, total) {
        if (temporizadores[idPedido]) {
            mostrarMensaje('Ya hay un temporizador activo', 'warning');
            return;
        }
        
        mostrarMensaje('⏰ Temporizador activado. El cliente tiene 5 minutos.', 'info');
        
        let tiempo = 300;
        temporizadores[idPedido] = setInterval(async function() {
            tiempo--;
            if (tiempo <= 0) {
                clearInterval(temporizadores[idPedido]);
                delete temporizadores[idPedido];
                await cancelarPorCliente(idPedido, total);
            }
        }, 1000);
        
        // Refrescar para mostrar el timer visual
        setTimeout(() => cargarPedidos(), 100);
    }
    
    // Cancelar por cliente (acumular deuda)
    async function cancelarPorCliente(idPedido, total) {
        const confirm = await Swal.fire({
            title: 'Cancelar pedido',
            html: 'El cliente no respondió. Se acumulará una deuda de <strong>' + total.toFixed(2) + '€</strong>',
            icon: 'warning',
            background: '#020617',
            color: 'white',
            confirmButtonColor: '#ef4444',
            confirmButtonText: 'Cancelar pedido'
        });
        if (!confirm.isConfirmed) return;
        
        try {
            await fetch(scriptURL + '?action=actualizarEstado&idPedido=' + idPedido + '&nuevoEstado=CANCELADO&tiempo=cliente_no_recogio');
            await database.ref('pedidos/' + idPedido).update({
                estado: 'cancelado',
                deuda_acumulada: total
            });
            mostrarMensaje('Pedido cancelado. Deuda acumulada: ' + total.toFixed(2) + '€', 'error');
            await cargarPedidos();
        } catch (e) {
            mostrarMensaje('Error', 'error');
        }
    }
    
    // Confirmar entrega
    function confirmarEntrega(id, total) {
        Swal.fire({
            title: '💰 Cobrar ' + total.toFixed(2) + '€',
            text: 'Verifica que el cliente haya pagado',
            icon: 'info',
            background: '#020617',
            color: 'white',
            confirmButtonColor: '#22c55e',
            confirmButtonText: '✅ Confirmar pago',
            showCancelButton: true
        }).then(async (result) => {
            if (result.isConfirmed) {
                await finalizarEntrega(id, total);
            }
        });
    }
    
    // Finalizar entrega
    async function finalizarEntrega(id, total) {
        try {
            await fetch(scriptURL + '?action=finalizarEntrega&idPedido=' + id + '&total=' + total + '&idRepartidor=' + miCodigo);
            await database.ref('pedidos/' + id).update({
                estado: 'entregado',
                cobrado: total
            });
            mostrarMensaje('🎉 Pedido entregado. +' + total.toFixed(2) + '€ en tu billetera', 'success');
            await cargarPedidos();
        } catch (e) {
            mostrarMensaje('Error', 'error');
        }
    }
    
    // Cerrar sesión
    async function cerrarSesion() {
        const confirm = await Swal.fire({
            title: '¿Cerrar sesión?',
            icon: 'question',
            background: '#020617',
            color: 'white',
            confirmButtonColor: '#ef4444',
            showCancelButton: true
        });
        if (confirm.isConfirmed) {
            if (intervaloRefresco) clearInterval(intervaloRefresco);
            localStorage.removeItem('codigoRepartidor');
            location.reload();
        }
    }
    
    // Iniciar
    iniciarSesion();
</script>
</body>
</html>
