<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reparto Express - Diagnóstico</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background: #020617; color: white; font-family: system-ui; padding: 20px; }
        .card { background: #1e293b; border-radius: 16px; padding: 20px; margin-bottom: 15px; }
        button { background: #06b6d4; border: none; padding: 12px; border-radius: 12px; color: black; font-weight: bold; margin-top: 10px; cursor: pointer; width: 100%; }
        .error { color: #ef4444; background: #7f1d1d20; padding: 10px; border-radius: 8px; margin: 10px 0; }
        .success { color: #22c55e; background: #14532d20; padding: 10px; border-radius: 8px; margin: 10px 0; }
    </style>
</head>
<body>

<div id="status" class="card">
    <h3>🔧 Diagnóstico del Sistema</h3>
    <div id="log"></div>
</div>

<div id="app" style="display: none;">
    <div class="card">
        <h2>✅ App Iniciada Correctamente</h2>
        <p>Repartidor: <strong id="nombreRep">-</strong></p>
        <p>Saldo: <strong id="saldo">0€</strong></p>
        <button onclick="cerrarSesion()">🚪 Cerrar Sesión</button>
    </div>
    <div id="pedidos"></div>
</div>

<script>
    const URL = 'https://script.google.com/macros/s/AKfycbzYFDShcrP7I4FKhiH3q5UcEInpSKJstrumJ9ddI4Tj9S31ZUgwiuie81fGFmCJ6ob2/exec';
    
    function log(mensaje, esError = false) {
        const logDiv = document.getElementById('log');
        const div = document.createElement('div');
        div.innerHTML = esError ? `❌ ${mensaje}` : `✅ ${mensaje}`;
        div.style.color = esError ? '#ef4444' : '#22c55e';
        div.style.margin = '5px 0';
        div.style.fontSize = '14px';
        logDiv.appendChild(div);
        console.log(mensaje);
    }
    
    async function testConexion() {
        log('Probando conexión con el servidor...');
        try {
            const res = await fetch(URL + '?action=getPedidosReparto&idRepartidor=R001&t=' + Date.now());
            const data = await res.json();
            log('Conexión exitosa. Respuesta del servidor: ' + JSON.stringify(data).substring(0, 100));
            return true;
        } catch(e) {
            log('Error de conexión: ' + e.message, true);
            return false;
        }
    }
    
    async function iniciar() {
        log('Iniciando diagnóstico...');
        
        // Probar conexión primero
        const conectado = await testConexion();
        if (!conectado) {
            log('⚠️ No se pudo conectar al servidor. Verifica la URL.', true);
            return;
        }
        
        // Verificar localStorage
        let codigo = localStorage.getItem('rep_code');
        log('Código en localStorage: ' + (codigo || 'ninguno'));
        
        if (!codigo) {
            const result = await Swal.fire({
                title: '🔐 Código de Repartidor',
                input: 'text',
                inputPlaceholder: 'Ej: R001',
                background: '#020617',
                color: 'white',
                confirmButtonColor: '#06b6d4',
                allowOutsideClick: false
            });
            
            if (result.value) {
                codigo = result.value.trim().toUpperCase();
                localStorage.setItem('rep_code', codigo);
                log('Código guardado: ' + codigo);
            } else {
                log('No se ingresó código', true);
                return;
            }
        }
        
        // Cargar datos del repartidor
        log('Cargando datos para repartidor: ' + codigo);
        try {
            const res = await fetch(URL + '?action=getPedidosReparto&idRepartidor=' + encodeURIComponent(codigo) + '&t=' + Date.now());
            const data = await res.json();
            
            if (data.error) {
                log('Error del servidor: ' + data.error, true);
                return;
            }
            
            log('Datos cargados correctamente');
            log('Repartidor: ' + (data.nombre || codigo));
            log('Saldo: ' + (data.saldo || 0) + '€');
            log('Pedidos activos: ' + (data.pedidos ? data.pedidos.length : 0));
            
            // Mostrar la app
            document.getElementById('nombreRep').innerHTML = data.nombre || codigo;
            document.getElementById('saldo').innerHTML = (parseFloat(data.saldo) || 0).toFixed(2) + '€';
            document.getElementById('status').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            
        } catch(e) {
            log('Error al cargar datos: ' + e.message, true);
        }
    }
    
    window.cerrarSesion = function() {
        localStorage.removeItem('rep_code');
        location.reload();
    };
    
    // Ejecutar
    iniciar();
</script>
</body>
</html>
