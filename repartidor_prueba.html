<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repartidor - Aguadulce Express</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #020617;
            color: white;
            padding: 16px;
            padding-bottom: 80px;
        }
        .header {
            background: linear-gradient(135deg, #06b6d4, #020617);
            margin: -16px -16px 16px -16px;
            padding: 20px 16px;
        }
        .flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-salir {
            background: rgba(0,0,0,0.5);
            border: none;
            padding: 8px 16px;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        .repartidor-nombre {
            font-size: 18px;
            font-weight: bold;
        }
        .repartidor-id {
            font-size: 10px;
            opacity: 0.7;
        }
        .billetera-monto {
            font-size: 20px;
            font-weight: bold;
            color: #22c55e;
        }
        .status-bar {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
        }
        .contador {
            background: #06b6d4;
            color: black;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .card {
            background: rgba(30,41,59,0.8);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .ref {
            background: rgba(6,182,212,0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            color: #06b6d4;
        }
        .direccion {
            font-size: 15px;
            font-weight: bold;
            margin: 12px 0;
            word-break: break-word;
        }
        .cliente-box {
            background: #0f172a;
            border-radius: 14px;
            padding: 12px;
            margin: 12px 0;
        }
        button {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-weight: bold;
            border: none;
            margin-top: 10px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-blue { background: #06b6d4; color: black; }
        .btn-yellow { background: #eab308; color: black; }
        .btn-green { background: #22c55e; color: white; }
        .btn-red { background: #ef4444; color: white; }
        .sin-pedidos {
            text-align: center;
            padding: 60px 20px;
            opacity: 0.5;
        }
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #020617;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 9999;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(6,182,212,0.2);
            border-top-color: #06b6d4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .mt-2 { margin-top: 8px; }
        a { text-decoration: none; }
        .inline-flex { display: inline-flex; gap: 8px; }
        .text-center { text-align: center; }
    </style>
</head>
<body>

<div id="loader" class="loader">
    <div class="spinner"></div>
    <p style="color:#06b6d4; margin-top: 15px;">Iniciando Panel de Reparto...</p>
</div>

<div id="app" style="display: none;">
    <div class="header">
        <div class="flex">
            <button class="btn-salir" onclick="cerrarSesion()">🚪 Salir</button>
            <div>
                <div class="repartidor-nombre" id="nombreRep">Cargando...</div>
                <div class="repartidor-id" id="codigoRep"></div>
            </div>
            <div class="text-center">
                <div style="font-size: 10px;">💰 Billetera</div>
                <div class="billetera-monto" id="saldo">0.00€</div>
            </div>
        </div>
    </div>

    <div class="status-bar">
        <span>📡 <span id="estado">Conectado</span></span>
        <span class="contador" id="contador">0 pedidos</span>
    </div>

    <div id="listaPedidos"></div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzYFDShcrP7I4FKhiH3q5UcEInpSKJstrumJ9ddI4Tj9S31ZUgwiuie81fGFmCJ6ob2/exec';
    
    let codigo = localStorage.getItem('repartidor_codigo');
    let pedidos = [];
    let intervalId = null;
    let intervalosCronometro = {};
    
    function mensaje(texto, icono) {
        Swal.fire({
            text: texto,
            icon: icono || 'info',
            background: '#020617',
            color: 'white',
            confirmButtonColor: '#06b6d4',
            timer: 2000,
            showConfirmButton: false
        });
    }
    
    async function cargarPedidos() {
        try {
            const url = SCRIPT_URL + '?action=getPedidosReparto&idRepartidor=' + encodeURIComponent(codigo) + '&t=' + Date.now();
            const resp = await fetch(url);
            const data = await resp.json();
            
            if (data.error) {
                document.getElementById('estado').innerHTML = 'Error';
                return;
            }
            
            pedidos = data.pedidos || [];
            const saldo = parseFloat(data.saldo) || 0;
            
            document.getElementById('nombreRep').innerHTML = data.nombre || codigo;
            document.getElementById('codigoRep').innerHTML = '🔑 ' + codigo;
            document.getElementById('saldo').innerHTML = saldo.toFixed(2) + '€';
            document.getElementById('contador').innerHTML = pedidos.length + ' pedido' + (pedidos.length !== 1 ? 's' : '');
            document.getElementById('estado').innerHTML = 'Conectado';
            
            renderizar();
        } catch(e) {
            console.error(e);
            document.getElementById('estado').innerHTML = 'Offline';
        }
    }
    
    function iniciarTemporizadorReparto(id, estado) {
        if (intervalosCronometro[id]) clearInterval(intervalosCronometro[id]);

        let tiempoLimiteSegundos = 45 * 60; 

        if (estado === 'LLEGÓ' || estado === 'LLEGO') {
            tiempoLimiteSegundos = 5 * 60; 
        }

        intervalosCronometro[id] = setInterval(() => {
            const elemento = document.getElementById('cronometro-' + id);
            const contenedorBotonFalta = document.getElementById('bloque-cancelar-emergencia-' + id);
            
            if (!elemento) {
                clearInterval(intervalosCronometro[id]);
                return;
            }

            // EXCLUSIVO: CUANDO EL TIEMPO LLEGA A 00:00
            if (tiempoLimiteSegundos <= 0) {
                clearInterval(intervalosCronometro[id]);
                
                if (estado === 'LLEGÓ' || estado === 'LLEGO') {
                    elemento.style.background = '#581c1c';
                    elemento.style.borderColor = '#ef4444';
                    elemento.style.color = '#ef4444';
                    elemento.innerHTML = '🚨 TIEMPO DE ESPERA EXPIRED (CLIENTE AUSENTE)';
                    
                    // Solo aquí se dibuja el botón vinculando tu backend
                    if (contenedorBotonFalta) {
                        contenedorBotonFalta.innerHTML = `
                            <button class="btn-red" style="margin-top: 12px; background: #991b1b; border: 2px solid #ef4444; color: white;" onclick="cancelarPorAusencia('${id}')">
                                ❌ REGISTRAR AUSENCIA Y PENALIZAR CLIENTE
                            </button>
                        `;
                    }
                } else {
                    elemento.style.background = '#581c1c';
                    elemento.style.borderColor = '#ef4444';
                    elemento.style.color = '#ef4444';
                    elemento.innerHTML = '🚨 PEDIDO RETRASADO';
                }
                return;
            }

            tiempoLimiteSegundos--;
            const minutos = Math.floor(tiempoLimiteSegundos / 60);
            const segundos = tiempoLimiteSegundos % 60;
            const textoSegundos = segundos < 10 ? "0" + segundos : segundos;

            if (estado === 'LLEGÓ' || estado === 'LLEGO') {
                elemento.style.background = '#451a03';
                elemento.style.borderColor = '#f59e0b';
                elemento.style.color = '#f59e0b';
                elemento.innerHTML = '⏱️ TIEMPO DE ESPERA AL CLIENTE: ' + minutos + ':' + textoSegundos;
            } else {
                elemento.innerHTML = '🛵 TIEMPO ESTIMADO DE ENTREGA: ' + minutos + ':' + textoSegundos;
            }
        }, 1000);
    }

    function renderizar() {
        const container = document.getElementById('listaPedidos');
        
        if (!pedidos.length) {
            for (let k in intervalosCronometro) clearInterval(intervalosCronometro[k]);
            intervalosCronometro = {};
            container.innerHTML = '<div class="sin-pedidos">📭 Sin pedidos asignados</div>';
            return;
        }
        
        let html = '';
        for (let p of pedidos) {
            const estado = (p.ESTADO || '').toUpperCase();
            const total = parseFloat(p.TOTAL) || 0;
            const metodoPago = p.PAGO || 'Efectivo';
            
            const telefono = p.telf || p.WHATSAPP || p.telefono || p.TELEFONO || '';
            const telefonoLimpio = telefono.replace(/\D/g, '');
            
            let infoCambioHTML = '';
            if (metodoPago.toLowerCase() === 'efectivo') {
                const pagaConStr = p.PAGA_CON || p.PAGA || p.paga_con || '';
                const pagaCon = parseFloat(pagaConStr) || 0;
                
                if (pagaCon > 0 && pagaCon > total) {
                    const cambio = pagaCon - total;
                    infoCambioHTML = `
                        <div class="mt-2" style="background: rgba(15,23,42,0.6); padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; font-size: 11px;">
                            <span>Paga con: <strong style="color: #eab308;">${pagaCon.toFixed(2)}€</strong></span>
                            <span>Cambio: <strong style="color: #22c55e;">${cambio.toFixed(2)}€</strong></span>
                        </div>
                    `;
                } else {
                    infoCambioHTML = `
                        <div class="mt-2" style="background: rgba(15,23,42,0.6); padding: 10px; border-radius: 10px; display: flex; justify-content: space-between; font-size: 11px; opacity: 0.8;">
                            <span>Monto a cobrar en efectivo</span>
                            <span style="color: #eab308; font-weight: bold;">Llevar cambio</span>
                        </div>
                    `;
                }
            }

            let cronometroHTML = '';
            if (estado === 'EN CAMINO' || estado === 'LLEGÓ' || estado === 'LLEGO') {
                cronometroHTML = `
                    <div id="cronometro-${p.ID_PEDIDO}" style="margin: 12px 0; background: rgba(6,182,212,0.1); border: 1px solid rgba(6,182,212,0.3); color: #06b6d4; font-weight: bold; padding: 10px; border-radius: 12px; text-align: center; font-size: 12px;">
                        ⏳ ASIGNANDO TIEMPO LOGÍSTICO...
                    </div>
                `;
                setTimeout(() => iniciarTemporizadorReparto(p.ID_PEDIDO, estado), 100);
            }

            let botones = '';
            if (estado === 'LISTO' || estado === 'PREPARADO') {
                botones = '<button class="btn-blue" onclick="recoger(\'' + p.ID_PEDIDO + '\')">🏍️ RECOGER Y INICIAR REPARTO</button>';
            } else if (estado === 'EN CAMINO') {
                botones = '<button class="btn-yellow" onclick="llegada(\'' + p.ID_PEDIDO + '\')">📍 HE LLEGADO AL DOMICILIO</button>';
            } else if (estado === 'LLEGÓ' || estado === 'LLEGO') {
                botones = '<button class="btn-green" onclick="entregar(\'' + p.ID_PEDIDO + '\', ' + total + ')">💰 CONFIRMAR COBRO Y ENTREGA</button>';
            } else {
                botones = '<button disabled style="background: #1e293b; color: #64748b; cursor: not-allowed; font-size:12px;">⏳ ESPERANDO QUE COCINA TERMINE EL PEDIDO</button>';
            }
            
            html += '<div class="card">';
            html += '<div class="flex">';
            html += '<span class="ref">📋 REF: ' + p.ID_PEDIDO + '</span>';
            html += '<span style="background:#06b6d420;color:#06b6d4;padding:4px 12px;border-radius:12px;font-size:10px;font-weight:bold;">' + estado + '</span>';
            html += '</div>';
            html += '<div class="direccion">📍 ' + (p.DIRECCION || 'Sin dirección') + '</div>';
            
            html += '<div class="cliente-box">';
            html += '<div style="color:#06b6d4; font-weight: bold;">👤 ' + (p.CLIENTE || 'Cliente') + '</div>';
            html += '<div class="flex mt-2">';
            html += '<span>📞 ' + (telefono || 'No disponible') + '</span>';
            if (telefonoLimpio) {
                html += '<div class="inline-flex">';
                html += '<a href="tel:' + telefonoLimpio + '" style="background:#22c55e;color:black;padding:6px 10px;border-radius:10px;font-size:12px;font-weight:bold;">📞</a>';
                html += '<a href="https://wa.me/' + telefonoLimpio + '" target="_blank" style="background:#25D366;color:black;padding:6px 10px;border-radius:10px;font-size:12px;font-weight:bold;">💬</a>';
                html += '</div>';
            }
            html += '</div>';
            html += '<div class="mt-2" style="font-size:11px;opacity:0.7;">💳 Método de Pago: <strong>' + metodoPago + '</strong></div>';
            html += infoCambioHTML;
            html += '</div>';
            
            html += cronometroHTML;

            html += '<div class="flex" style="margin:16px 0 8px 0; align-items: flex-end;">';
            html += '<div><span style="font-size:12px; opacity:0.6; display:block;">Total a recibir:</span><span style="color:#22c55e; font-size:24px; font-weight:black;">' + total.toFixed(2) + '€</span></div>';
            html += '<a href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.DIRECCION || '') + '" target="_blank" style="background:#06b6d4; color:black; padding:8px 14px; border-radius:10px; font-size:12px; font-weight:bold;">🗺️ Abrir Mapa</a>';
            html += '</div>';
            
            html += botones;
            
            html += `<div id="bloque-cancelar-emergencia-${p.ID_PEDIDO}"></div>`;
            
            html += '</div>';
        }
        container.innerHTML = html;
    }
    
    window.recoger = async function(id) {
        try {
            await fetch(SCRIPT_URL + '?action=actualizarEstado&idPedido=' + id + '&nuevoEstado=EN CAMINO');
            mensaje('✅ Pedido recogido correctamente', 'success');
            cargarPedidos();
        } catch(e) { console.error(e); }
    };
    
    window.llegada = async function(id) {
        try {
            await fetch(SCRIPT_URL + '?action=actualizarEstado&idPedido=' + id + '&nuevoEstado=LLEGÓ');
            mensaje('📍 Avisado: Llegaste al domicilio', 'success');
            cargarPedidos();
        } catch(e) { console.error(e); }
    };
    
    window.entregar = function(id, total) {
        Swal.fire({
            title: '💰 Cobrar ' + total.toFixed(2) + '€',
            text: '¿Confirmas que has recibido el dinero y entregado el paquete?',
            icon: 'question',
            background: '#020617',
            color: 'white',
            confirmButtonColor: '#22c55e',
            confirmButtonText: '✅ Confirmar',
            showCancelButton: true,
            cancelButtonText: 'Cancelar'
        }).then(async (res) => {
            if (res.isConfirmed) {
                try {
                    await fetch(SCRIPT_URL + '?action=finalizarEntrega&idPedido=' + id + '&total=' + total + '&idRepartidor=' + codigo);
                    mensaje('🎉 ¡Pedido liquidado! +' + total.toFixed(2) + '€', 'success');
                    cargarPedidos();
                } catch(e) { console.error(e); }
            }
        });
    };

    // 🚨 SINCRONIZACIÓN PERFECTA CON TU GOOGLE APPS SCRIPT LÍNEA 300
    window.cancelarPorAusencia = function(id) {
        Swal.fire({
            title: '⚠️ ¿REGISTRAR AUSENCIA?',
            text: 'Se cancelará el pedido, se enviará la notificación al cliente y se le cargará el monto total como deuda pendiente en su cuenta.',
            icon: 'warning',
            background: '#020617',
            color: 'white',
            confirmButtonColor: '#ef4444',
            confirmButtonText: '❌ Sí, Penalizar Cliente',
            showCancelButton: true,
            cancelButtonText: 'Esperar un poco más'
        }).then(async (res) => {
            if (res.isConfirmed) {
                try {
                    // LLAMADA EXACTA: pasa action=actualizarEstado, nuevoEstado=CANCELADO 
                    // y el parámetro tiempo="Cliente ausente" para detonar acumularDeudaCliente()
                    const url = SCRIPT_URL + '?action=actualizarEstado&idPedido=' + encodeURIComponent(id) + '&nuevoEstado=CANCELADO&tiempo=' + encodeURIComponent('Cliente no recogió el pedido - Ausencia');
                    await fetch(url);
                    mensaje('❌ Ausencia registrada. Deuda cargada al cliente.', 'error');
                    cargarPedidos();
                } catch(e) { console.error(e); }
            }
        });
    };
    
    window.cerrarSesion = async function() {
        const confirm = await Swal.fire({
            title: '¿Cerrar sesión?',
            text: "Tendrás que volver a ingresar tu identificador único de repartidor.",
            icon: 'question',
            background: '#020617',
            color: 'white',
            confirmButtonColor: '#ef4444',
            showCancelButton: true,
            cancelButtonText: 'Cancelar'
        });
        if (confirm.isConfirmed) {
            if (intervalId) clearInterval(intervalId);
            for (let k in intervalosCronometro) clearInterval(intervalosCronometro[k]);
            localStorage.removeItem('repartidor_codigo');
            location.reload();
        }
    };
    
    async function init() {
        if (!codigo) {
            const res = await Swal.fire({
                title: '🔐 Código de Repartidor',
                input: 'text',
                inputPlaceholder: 'Ej: R001',
                background: '#020617',
                color: 'white',
                confirmButtonColor: '#06b6d4',
                allowOutsideClick: false,
                showCancelButton: false
            });
            if (res.value) {
                codigo = res.value.trim().toUpperCase();
                localStorage.setItem('repartidor_codigo', codigo);
            } else {
                location.reload();
                return;
            }
        }
        
        await cargarPedidos();
        intervalId = setInterval(cargarPedidos, 10000);
        
        document.getElementById('loader').style.display = 'none';
        document.getElementById('app').style.display = 'block';
    }
    
    init();
</script>
</body>
</html>
