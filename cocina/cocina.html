<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Aguadulce Express - Cocina</title>
    
    <link rel="manifest" href="/AGUADULCE_EXPRESS_APP/cocina/manifest-cocina.json">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/cCv7qsHf/IMAGEN-PNG-512.jpg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-functions-compat.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        /* ============================================
           RESET Y VARIABLES
           ============================================ */
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: #1a2234;
            --bg-card-hover: #243049;
            --border-color: #2a3a5a;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-gold: #f59e0b;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-purple: #8b5cf6;
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--accent-gold); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #d97706; }
        
        /* ============================================
           LOGIN
           ============================================ */
        #login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-primary);
            padding: 1rem;
            position: fixed;
            inset: 0;
            z-index: 100;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #login-container.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        
        .login-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            animation: fadeInUp 0.6s ease-out;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .login-card .logo { text-align: center; margin-bottom: 1.5rem; }
        .login-card .logo h1 { font-size: 2rem; font-weight: 900; color: var(--accent-gold); letter-spacing: -0.5px; }
        .login-card .logo p { color: var(--text-secondary); font-size: 0.85rem; }
        
        .login-card input {
            width: 100%;
            padding: 0.85rem 1rem;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 1rem;
            color: var(--text-primary);
            transition: var(--transition);
            outline: none;
        }
        .login-card input:focus { border-color: var(--accent-gold); box-shadow: 0 0 0 3px rgba(245,158,11,0.15); }
        .login-card input::placeholder { color: var(--text-muted); }
        
        .login-card .btn-login {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, var(--accent-gold), #d97706);
            color: #0f172a;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }
        .login-card .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(245,158,11,0.3); }
        .login-card .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        /* ============================================
           APP LAYOUT - SIDEBAR + CONTENIDO
           ============================================ */
        #app {
            display: none;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: var(--bg-primary);
            position: fixed;
            inset: 0;
            z-index: 10;
        }
        #app:not(.hidden) { display: flex; }
        
        /* ============================================
           SIDEBAR - SIEMPRE VISIBLE
           ============================================ */
        .sidebar {
            width: 220px;
            min-width: 220px;
            height: 100%;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 1rem 0.75rem;
            overflow-y: auto;
            flex-shrink: 0;
            z-index: 10;
        }
        
        .sidebar .brand {
            padding: 0 0.75rem 1rem 0.75rem;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 1rem;
        }
        .sidebar .brand h1 {
            font-size: 1.1rem;
            font-weight: 900;
            color: var(--accent-gold);
            letter-spacing: -0.5px;
        }
        .sidebar .brand span {
            font-size: 0.65rem;
            color: var(--text-muted);
            display: block;
        }
        
        .sidebar .restaurant-info {
            padding: 0.5rem 0.75rem;
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            margin-bottom: 1rem;
            border: 1px solid var(--border-color);
        }
        .sidebar .restaurant-info .name {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sidebar .restaurant-info .email {
            font-size: 0.6rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sidebar .restaurant-info .status {
            font-size: 0.6rem;
            margin-top: 0.2rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .sidebar .restaurant-info .status .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }
        .sidebar .restaurant-info .status .dot.active { background: var(--accent-green); }
        .sidebar .restaurant-info .status .dot.paused { background: var(--accent-red); animation: pulse-dot 1s ease-in-out infinite; }
        
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }
        
        .sidebar .menu-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.6rem 0.75rem;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
            border: none;
            background: transparent;
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: 0.15rem;
        }
        .sidebar .menu-item:hover {
            background: var(--bg-card);
            color: var(--text-primary);
        }
        .sidebar .menu-item.active {
            background: var(--accent-gold);
            color: #0f172a;
        }
        .sidebar .menu-item .badge {
            margin-left: auto;
            background: var(--accent-blue);
            color: white;
            padding: 0.05rem 0.5rem;
            border-radius: 50px;
            font-size: 0.6rem;
            font-weight: 700;
            min-width: 20px;
            text-align: center;
        }
        .sidebar .menu-item .badge.gold { background: var(--accent-gold); color: #0f172a; }
        .sidebar .menu-item .badge.red { background: var(--accent-red); }
        
        .sidebar .menu-divider {
            height: 1px;
            background: var(--border-color);
            margin: 0.5rem 0.75rem;
        }
        
        .sidebar .menu-item.danger { color: var(--accent-red); }
        .sidebar .menu-item.danger:hover { background: rgba(239,68,68,0.15); color: var(--accent-red); }
        
        /* ============================================
           CONTENIDO PRINCIPAL
           ============================================ */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-primary);
        }
        
        /* ============================================
           HEADER
           ============================================ */
        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 1.5rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            min-height: 50px;
        }
        
        .main-header .title-section {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .main-header .title-section .page-title {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-primary);
        }
        .main-header .title-section .page-title .highlight {
            color: var(--accent-gold);
        }
        
        .main-header .header-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .main-header .header-actions .btn-pausa {
            padding: 0.2rem 0.8rem;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            font-size: 0.7rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .main-header .header-actions .btn-pausa.active {
            background: var(--accent-red);
            color: white;
        }
        .main-header .header-actions .btn-pausa.active:hover { background: #dc2626; }
        .main-header .header-actions .btn-pausa.inactive {
            background: var(--accent-green);
            color: white;
        }
        .main-header .header-actions .btn-pausa.inactive:hover { background: #059669; }
        
        /* ============================================
           STATS BAR (COMPACTA)
           ============================================ */
        .stats-bar {
            display: flex;
            gap: 0.75rem;
            padding: 0.4rem 1.5rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.15rem 0.7rem;
            background: var(--bg-card);
            border-radius: 50px;
            border: 1px solid var(--border-color);
        }
        .stat-item .icon { font-size: 0.8rem; }
        .stat-item .label { font-size: 0.6rem; color: var(--text-muted); font-weight: 500; }
        .stat-item .value {
            font-size: 0.8rem;
            font-weight: 700;
            min-width: 16px;
            text-align: center;
        }
        .stat-item .value.gold { color: var(--accent-gold); }
        .stat-item .value.blue { color: var(--accent-blue); }
        
        /* ============================================
           COLUMNAS - SOLO 2
           ============================================ */
        .kanban-container {
            flex: 1;
            display: flex;
            gap: 1rem;
            padding: 0.75rem 1.5rem;
            overflow-x: auto;
            overflow-y: hidden;
            background: var(--bg-primary);
            min-height: 0;
        }
        
        .kanban-column {
            flex: 1;
            min-width: 280px;
            max-width: 50%;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }
        .kanban-column:hover { border-color: var(--accent-gold); }
        
        .kanban-column .column-header {
            padding: 0.5rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            flex-shrink: 0;
            background: var(--bg-secondary);
        }
        .kanban-column .column-header .title {
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .kanban-column .column-header .count {
            background: var(--bg-card);
            padding: 0.05rem 0.6rem;
            border-radius: 50px;
            font-size: 0.65rem;
            font-weight: 700;
        }
        
        .kanban-column.pending .column-header { border-bottom-color: var(--accent-gold); }
        .kanban-column.pending .column-header .title { color: var(--accent-gold); }
        
        .kanban-column.cooking .column-header { border-bottom-color: var(--accent-blue); }
        .kanban-column.cooking .column-header .title { color: var(--accent-blue); }
        
        .kanban-column .column-content {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        /* ============================================
           TARJETAS DE PEDIDOS
           ============================================ */
        .order-card {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            transition: var(--transition);
            flex-shrink: 0;
            position: relative;
        }
        .order-card:hover {
            border-color: var(--accent-gold);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .order-card.delayed {
            border-left: 4px solid var(--accent-red);
            background: rgba(239,68,68,0.05);
        }
        
        .order-card .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.2rem;
        }
        .order-card .top .id {
            font-size: 0.6rem;
            font-family: monospace;
            color: var(--text-muted);
        }
        .order-card .top .time {
            font-size: 0.55rem;
            color: var(--text-muted);
        }
        
        .order-card .cliente {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-primary);
        }
        .order-card .direccion {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 0.1rem;
        }
        .order-card .telefono {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 0.1rem;
        }
        
        .order-card .timer {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.2rem 0.5rem;
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            margin: 0.3rem 0;
            font-size: 0.65rem;
            border: 1px solid var(--border-color);
        }
        .order-card .timer .label { color: var(--text-muted); }
        .order-card .timer .value { font-weight: 700; color: var(--accent-gold); }
        .order-card .timer .value.delayed { color: var(--accent-red); }
        
        .order-card .productos {
            display: flex;
            flex-wrap: wrap;
            gap: 0.2rem;
            margin: 0.3rem 0;
        }
        .order-card .productos span {
            background: var(--bg-secondary);
            padding: 0.05rem 0.4rem;
            border-radius: 50px;
            font-size: 0.55rem;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        
        .order-card .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.3rem;
            padding-top: 0.3rem;
            border-top: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 0.2rem;
        }
        .order-card .footer .precio {
            font-weight: 700;
            color: var(--accent-gold);
            font-size: 0.8rem;
        }
        .order-card .footer .badge-estado {
            font-size: 0.55rem;
            padding: 0.1rem 0.5rem;
            border-radius: 50px;
            font-weight: 600;
        }
        .order-card .footer .badge-estado.pending { background: rgba(245,158,11,0.15); color: var(--accent-gold); }
        .order-card .footer .badge-estado.cooking { background: rgba(59,130,246,0.15); color: var(--accent-blue); }
        
        .order-card .actions {
            display: flex;
            gap: 0.3rem;
            margin-top: 0.3rem;
            flex-wrap: wrap;
            width: 100%;
        }
        .order-card .actions .btn {
            padding: 0.2rem 0.6rem;
            border-radius: 50px;
            font-size: 0.6rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            flex: 1;
            min-width: 50px;
            text-align: center;
        }
        .order-card .actions .btn:hover { transform: scale(1.05); }
        .order-card .actions .btn-primary { background: var(--accent-gold); color: #0f172a; }
        .order-card .actions .btn-primary:hover { background: #d97706; }
        .order-card .actions .btn-success { background: var(--accent-green); color: white; }
        .order-card .actions .btn-success:hover { background: #059669; }
        .order-card .actions .btn-danger { background: var(--accent-red); color: white; }
        .order-card .actions .btn-danger:hover { background: #dc2626; }
        .order-card .actions .btn-secondary { background: var(--bg-secondary); color: var(--text-secondary); border: 1px solid var(--border-color); }
        .order-card .actions .btn-secondary:hover { background: var(--bg-card-hover); }
        
        /* ============================================
           VISTA HISTORIAL / DEMORAS
           ============================================ */
        .view-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            overflow: hidden;
            margin: 0.5rem 0;
        }
        .view-container .view-header {
            padding: 0.5rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 0.5rem;
            background: var(--bg-secondary);
        }
        .view-container .view-header .title {
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .view-container .view-header .filters {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            align-items: center;
        }
        .view-container .view-header .filters select {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 0.2rem 0.6rem;
            color: var(--text-primary);
            font-size: 0.65rem;
            outline: none;
            cursor: pointer;
        }
        .view-container .view-header .filters select:focus { border-color: var(--accent-gold); }
        
        .view-container .view-content {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        
        .view-container .view-content .empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: var(--text-muted);
            text-align: center;
        }
        .view-container .view-content .empty .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
        
        .view-container .view-content .order-card { 
            border-left: 4px solid #64748b; 
        }
        .view-container .view-content .order-card .cliente { font-size: 0.8rem; }
        
        /* ============================================
           TOAST
           ============================================ */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius-sm);
            color: white;
            font-weight: 500;
            font-size: 0.8rem;
            box-shadow: var(--shadow);
            z-index: 999;
            animation: slideInToast 0.3s ease-out;
            max-width: 350px;
        }
        @keyframes slideInToast {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .toast-success { background: var(--accent-green); }
        .toast-error { background: var(--accent-red); }
        .toast-info { background: var(--accent-blue); }
        .toast-warning { background: var(--accent-gold); color: #0f172a; }
        
        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 1024px) {
            .sidebar { width: 180px; min-width: 180px; padding: 0.5rem; }
            .sidebar .brand h1 { font-size: 0.9rem; }
            .sidebar .menu-item { font-size: 0.7rem; padding: 0.4rem 0.5rem; }
            .kanban-container { padding: 0.5rem; }
            .kanban-column { min-width: 220px; max-width: 50%; }
            .main-header { padding: 0.4rem 1rem; }
            .main-header .title-section .page-title { font-size: 0.85rem; }
            .stats-bar { padding: 0.3rem 1rem; }
        }
        
        @media (max-width: 768px) {
            .sidebar { width: 60px; min-width: 60px; padding: 0.3rem; }
            .sidebar .brand { display: none; }
            .sidebar .restaurant-info { display: none; }
            .sidebar .menu-item { font-size: 0.6rem; padding: 0.4rem 0.3rem; justify-content: center; }
            .sidebar .menu-item span:not(.icon) { display: none; }
            .sidebar .menu-item .badge { display: none; }
            .sidebar .menu-divider { margin: 0.2rem 0; }
            .sidebar .menu-item.danger span:not(.icon) { display: none; }
            
            .kanban-container { flex-direction: column; overflow-y: auto; overflow-x: hidden; padding: 0.3rem; }
            .kanban-column { min-width: unset; max-width: unset; max-height: 45vh; }
            
            .main-header { padding: 0.3rem 0.5rem; }
            .main-header .title-section .page-title { font-size: 0.7rem; }
            .stats-bar { padding: 0.2rem 0.5rem; gap: 0.3rem; }

            .order-card { padding: 0.5rem; }
            .order-card .cliente { font-size: 0.75rem; }

</head>
<body>

    <!-- ============================================
    LOGIN

    <div id="login-container">
        <div class="login-card">
            <div class="logo">
                <h1>🍳 Aguadulce Express</h1>

                    <span id="login-text">Iniciar Sesión</span>
                    <span id="login-loading" style="display:none;">Cargando...</span>

                <div id="login-error" style="color:var(--accent-red);font-size:0.8rem;text-align:center;display:none;"></div>
            </form>
        </div>
    </div>

    <!-- ============================================
    APP PRINCIPAL - SIDEBAR + CONTENIDO
    ============================================ -->
    <div id="app" class="hidden">
        
        <!-- ============================================
        SIDEBAR - SIEMPRE VISIBLE
        ============================================ -->
        <aside class="sidebar" id="sidebar">
            
            <div class="brand">
                <h1>🍳 Aguadulce</h1>
                <span>Panel de Cocina</span>
            </div>
            
            <div class="restaurant-info">
                <div class="name" id="sidebar-restaurante">Cargando...</div>
                <div class="email" id="sidebar-email"></div>
                <div class="status">
                    <span class="dot active" id="sidebar-status-dot"></span>
                    <span id="sidebar-status-text">Activo</span>
                </div>
            </div>
            
            <!-- MENÚ PRINCIPAL -->
            <button class="menu-item active" data-view="activos">
                <span class="icon">📋</span>
                <span>Pedidos</span>
                <span class="badge gold" id="sidebar-contador">0</span>
            </button>
            
            <button class="menu-item" data-view="historial">
                <span class="icon">📊</span>
                <span>Historial</span>
            </button>
            
            <button class="menu-item" data-view="demoras">
                <span class="icon">⏱️</span>
                <span>Demoras</span>

            <div class="menu-divider"></div>
            
            <button class="menu-item" onclick="abrirFormularioReparto()">

            <button class="menu-item" onclick="configurarImpresora()">
                <span class="icon">🖨️</span>
                <span>Impresora</span>
                <span style="font-size:0.5rem;margin-left:auto;color:var(--text-muted);" id="estado-impresora">⭕</span>
            </button>
            
            <div class="menu-divider"></div>
            
            <button class="menu-item" onclick="togglePausa()" id="btn-pausa-sidebar">

            <button class="menu-item danger" id="btn-cerrar-sesion">
                <span class="icon">🚪</span>

        </aside>
        
        <!-- ============================================
        CONTENIDO PRINCIPAL
        ============================================ -->
        <div class="main-content">
            
            <!-- HEADER -->
            <header class="main-header">
                <div class="title-section">
                    <span class="page-title" id="page-title">📋 <span class="highlight">Pedidos</span> Activos</span>
                </div>
                <div class="header-actions">
                    <button class="btn-pausa inactive" id="btn-pausa-header" onclick="togglePausa()">⏸️ Pausar</button>
                </div>
            </header>
            
            <!-- BANNER DE PAUSA -->
            <div id="pausa-banner" style="display:none;background:var(--accent-red);color:white;text-align:center;padding:4px;font-weight:600;font-size:0.75rem;flex-shrink:0;">
                ⏸️ RESTAURANTE EN PAUSA - NO SE RECIBEN NUEVOS PEDIDOS
            </div>
            
            <!-- STATS BAR -->
            <div class="stats-bar" id="stats-bar">
                <div class="stat-item">
                    <span class="icon">📥</span>
                    <span class="label">Entrada</span>
                    <span class="value gold" id="count-pendiente">0</span>
                </div>
                <div class="stat-item">
                    <span class="icon">👨‍🍳</span>
                    <span class="label">En Cocción</span>
                    <span class="value blue" id="count-coccion">0</span>
                </div>
            </div>
            
            <!-- KANBAN CONTAINER - SOLO 2 COLUMNAS -->
            <div class="kanban-container" id="kanban-container">
                
                <!-- COLUMNA: ENTRADA -->
                <div class="kanban-column pending" id="columna-pendiente">
                    <div class="column-header">
                        <span class="title">📥 Entrada</span>
                        <span class="count" id="col-count-pendiente">0</span>
                    </div>
                    <div class="column-content" id="col-pendiente"></div>
                </div>
                
                <!-- COLUMNA: EN COCCIÓN -->
                <div class="kanban-column cooking" id="columna-coccion">
                    <div class="column-header">
                        <span class="title">👨‍🍳 En Cocción</span>
                        <span class="count" id="col-count-coccion">0</span>
                    </div>
                    <div class="column-content" id="col-coccion"></div>
                </div>
                
            </div>
            
        </div>
        
    </div>

    <!-- ============================================
    JAVASCRIPT PRINCIPAL
    ============================================ -->
    <script>
        // ============================================
        // 1. CONFIGURACIÓN DE FIREBASE
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyBEapmpody3y_vFyPF0ngUnCn5ZFOtxPjs",
            authDomain: "aguadulce-express-v2.firebaseapp.com",
            databaseURL: "https://aguadulce-express-v2-default-rtdb.firebaseio.com",
            projectId: "aguadulce-express-v2",
            storageBucket: "aguadulce-express-v2.appspot.com",
            messagingSenderId: "103953800507",
            appId: "1:103953800507:web:tu_app_id"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        const functions = firebase.functions();

        // ============================================
        // 2. VARIABLES GLOBALES
        // ============================================
        let currentUser = null;
        let currentView = 'activos';
        let restauranteId = null;
        let estaPausado = false;
        let pedidosListeners = [];
        let enviosListeners = [];
        const TIEMPO_ELABORACION_DEFAULT = 20;
        let tiempoElaboracionRestaurante = TIEMPO_ELABORACION_DEFAULT;
        let pedidosAnteriores = {};
        let sonidoActivo = false;
        let intervaloSonido = null;
        let pedidoSonando = null;
        let impresoraConfigurada = false;
        let nombreImpresora = '';

        // ============================================
        // 3. FUNCIONES UTILITARIAS
        // ============================================
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateY(20px)'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function escapeHTML(str) { if (!str) return ''; return str.replace(/[&<>"]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; if (m === '"') return '&quot;'; return m; }); }

        function setText(id, value) {
            const el = document.getElementById(id);
            if (el) { el.textContent = value; }
        }

        // ============================================
        // 4. AUTENTICACIÓN
        // ============================================
        const loginForm = document.getElementById('login-form');
        const loginEmail = document.getElementById('login-email');
        const loginPassword = document.getElementById('login-password');
        const loginBtn = document.getElementById('login-btn');
        const loginText = document.getElementById('login-text');
        const loginLoading = document.getElementById('login-loading');
        const loginError = document.getElementById('login-error');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = loginEmail.value.trim();
            const password = loginPassword.value;
            if (!email || !password) { loginError.textContent = 'Completa todos los campos'; loginError.style.display = 'block'; return; }
            loginBtn.disabled = true;
            loginText.style.display = 'none';
            loginLoading.style.display = 'inline';
            loginError.style.display = 'none';
            try {
                const credenciales = await auth.signInWithEmailAndPassword(email, password);
                const user = credenciales.user;
                const snapshot = await db.ref(`restaurantes/${user.uid}`).once('value');
                if (!snapshot.exists()) { await auth.signOut(); throw new Error('Esta cuenta no es un restaurante válido'); }
                showToast('✅ Bienvenido al panel de cocina', 'success');
            } catch (error) {
                console.error('Error de login:', error);
                loginError.textContent = error.message;
                loginError.style.display = 'block';
                loginBtn.disabled = false;
                loginText.style.display = 'inline';
                loginLoading.style.display = 'none';
            }
        });

        // ============================================
        // 5. ESTADO DE AUTENTICACIÓN
        // ============================================
        auth.onAuthStateChanged(async (user) => {
            const app = document.getElementById('app');
            const loginContainer = document.getElementById('login-container');
            if (user) {
                console.log('✅ Usuario autenticado:', user.uid);
                currentUser = user;
                restauranteId = user.uid;
                loginContainer.classList.add('hidden');
                app.classList.remove('hidden');
                await cargarDatosRestaurante();
                await cargarEstadoPausa();
                await cargarTiempoElaboracion();
                await cargarConfiguracionImpresora();
                escucharPedidos();
                setTimeout(() => renderizarVista(), 500);
            } else {
                console.log('❌ Sin usuario autenticado');
                app.classList.add('hidden');
                loginContainer.classList.remove('hidden');
                pedidosListeners.forEach(ref => { try { ref.off(); } catch(e) {} });
                pedidosListeners = [];
                enviosListeners.forEach(ref => { try { ref.off(); } catch(e) {} });
                enviosListeners = [];
            }
        });

        // ============================================
        // 6. CERRAR SESIÓN
        // ============================================
        document.getElementById('btn-cerrar-sesion').addEventListener('click', async () => {
            if (confirm('¿Seguro que quieres cerrar sesión?')) {
                await auth.signOut();
                showToast('👋 Sesión cerrada', 'info');
            }
        });

        // ============================================
        // 7. CARGAR DATOS DEL RESTAURANTE
        // ============================================
        async function cargarDatosRestaurante() {
            try {
                const snapshot = await db.ref(`restaurantes/${restauranteId}`).once('value');
                const data = snapshot.val();
                if (data) {
                    const nombre = data.NOMBRE_RESTAURANTE || data.nombre || 'Restaurante';
                    const email = data.email || '';
                    document.getElementById('sidebar-restaurante').textContent = nombre;
                    document.getElementById('sidebar-email').textContent = email;
                }
            } catch (error) { console.error('Error al cargar restaurante:', error); }
        }

        // ============================================
        // 8. CARGAR TIEMPO DE ELABORACIÓN
        // ============================================
        async function cargarTiempoElaboracion() {
            try {
                const snapshot = await db.ref(`restaurantes/${restauranteId}/tiempo_elaboracion`).once('value');
                tiempoElaboracionRestaurante = snapshot.val() || TIEMPO_ELABORACION_DEFAULT;
                console.log(`⏱️ Tiempo de elaboración: ${tiempoElaboracionRestaurante} minutos`);
            } catch (error) {
                tiempoElaboracionRestaurante = TIEMPO_ELABORACION_DEFAULT;
            }
        }

        // ============================================
        // 9. ESTADO DE PAUSA
        // ============================================
        async function cargarEstadoPausa() {
            try {
                const snapshot = await db.ref(`restaurantes/${restauranteId}/pausado`).once('value');
                estaPausado = snapshot.val() === true;
                actualizarUIEstadoPausa();
            } catch (error) { console.error('Error al cargar estado de pausa:', error); }
        }

        function actualizarUIEstadoPausa() {
            const banner = document.getElementById('pausa-banner');
            const btnHeader = document.getElementById('btn-pausa-header');
            const btnSidebar = document.getElementById('btn-pausa-sidebar');
            const iconoPausa = document.getElementById('icono-pausa');
            const textoPausa = document.getElementById('texto-pausa');
            const statusDot = document.getElementById('sidebar-status-dot');
            const statusText = document.getElementById('sidebar-status-text');

            if (estaPausado) {
                if (banner) banner.style.display = 'block';
                if (btnHeader) { btnHeader.className = 'btn-pausa active'; btnHeader.textContent = '▶️ Reanudar'; }
                if (iconoPausa) iconoPausa.textContent = '▶️';
                if (textoPausa) textoPausa.textContent = 'Reanudar';
                if (statusDot) { statusDot.className = 'dot paused'; }
                if (statusText) statusText.textContent = 'Pausado';
            } else {
                if (banner) banner.style.display = 'none';
                if (btnHeader) { btnHeader.className = 'btn-pausa inactive'; btnHeader.textContent = '⏸️ Pausar'; }
                if (iconoPausa) iconoPausa.textContent = '⏸️';
                if (textoPausa) textoPausa.textContent = 'Pausar';
                if (statusDot) { statusDot.className = 'dot active'; }
                if (statusText) statusText.textContent = 'Activo';
            }
        }

        window.togglePausa = async function() {
            try {
                const nuevoEstado = !estaPausado;
                await db.ref(`restaurantes/${restauranteId}/pausado`).set(nuevoEstado);
                estaPausado = nuevoEstado;
                actualizarUIEstadoPausa();
                showToast(estaPausado ? '⏸️ Restaurante en PAUSA' : '▶️ Restaurante ACTIVO', estaPausado ? 'warning' : 'success');
            } catch (error) {
                console.error('Error al cambiar estado de pausa:', error);
                showToast('❌ Error al cambiar estado de pausa', 'error');
            }
        };

        // ============================================
        // 10. ESCUCHAR PEDIDOS
        // ============================================
        function escucharPedidos() {
            pedidosListeners.forEach(ref => { try { ref.off(); } catch(e) {} });
            pedidosListeners = [];
            const pedidosRef = db.ref('pedidos');
            pedidosRef.on('value', (snapshot) => {
                const pedidos = snapshot.val() || {};
                const pedidosActuales = {};
                for (const [id, data] of Object.entries(pedidos)) pedidosActuales[id] = data;
                const nuevosPedidos = [];
                for (const [id, data] of Object.entries(pedidosActuales)) {
                    if (!pedidosAnteriores[id]) {
                        const restId = data.restauranteId || data.restaurante_id || data.uid_restaurante;
                        if (restId === restauranteId) nuevosPedidos.push({ id, ...data });
                    }
                }
                if (nuevosPedidos.length > 0) {
                    console.log(`🔔 ${nuevosPedidos.length} nuevo(s) pedido(s)`);
                    for (const pedido of nuevosPedidos) {
                        const cliente = pedido.cliente_nombre || pedido.clienteNombre || 'Cliente';
                        showToast(`📦 Nuevo pedido de ${cliente}`, 'info');
                        const estado = pedido.estado ? pedido.estado.toLowerCase() : '';
                        if (estado === 'recibido' || estado === 'pendiente') {
                            if (!sonidoActivo) iniciarSonidoRepetido(pedido.id);
                        }
                    }
                }
                pedidosAnteriores = pedidosActuales;
                if (currentView === 'activos') renderizarVista();
                else actualizarContadoresDesdePedidos(pedidosActuales);
            });
            pedidosListeners.push(pedidosRef);
            console.log('✅ Listener de pedidos activado');
        }

        // ============================================
        // 11. SONIDO REPETIDO
        // ============================================
        function reproducirSonidoLlegada() {
            try {
                const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
                audio.volume = 0.9;
                audio.play().catch(e => console.log('⚠️ Sonido bloqueado'));
                if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            } catch (error) { console.log('⚠️ Error al reproducir sonido:', error); }
        }

        function iniciarSonidoRepetido(pedidoId) {
            if (pedidoSonando === pedidoId || sonidoActivo) return;
            sonidoActivo = true;
            pedidoSonando = pedidoId;
            let repeticiones = 0;
            if (intervaloSonido) clearInterval(intervaloSonido);
            reproducirSonidoLlegada();
            intervaloSonido = setInterval(() => {
                repeticiones++;
                db.ref(`pedidos/${pedidoId}/estado`).once('value').then((snap) => {
                    const estado = snap.val() ? snap.val().toLowerCase() : '';
                    if (estado !== 'recibido' && estado !== 'pendiente') { detenerSonidoRepetido(); return; }
                }).catch(() => {});
                if (repeticiones >= 30) detenerSonidoRepetido();
                else reproducirSonidoLlegada();
            }, 3000);
        }

        function detenerSonidoRepetido() {
            if (intervaloSonido) { clearInterval(intervaloSonido); intervaloSonido = null; }
            sonidoActivo = false;
            pedidoSonando = null;
        }

        // ============================================
        // 12. ACTUALIZAR CONTADORES DESDE PEDIDOS
        // ============================================
        function actualizarContadoresDesdePedidos(pedidos) {
            let pendiente = 0, coccion = 0;
            for (const [id, data] of Object.entries(pedidos)) {
                const restId = data.restauranteId || data.restaurante_id || data.uid_restaurante;
                if (restId !== restauranteId) continue;
                let estado = data.estado ? data.estado.toLowerCase() : '';
                if (estado === 'recibido') estado = 'pendiente';
                if (estado === 'pendiente') pendiente++;
                else if (estado === 'coccion') coccion++;
            }
            actualizarContadores(pendiente, coccion);
        }

        // ============================================
        // 13. ACTUALIZAR CONTADORES (SOLO 2)
        // ============================================
        function actualizarContadores(pendiente, coccion) {
            setText('count-pendiente', pendiente);
            setText('count-coccion', coccion);
            setText('col-count-pendiente', pendiente);
            setText('col-count-coccion', coccion);
            setText('sidebar-contador', pendiente + coccion);
        }

        // ============================================
        // 14. RENDERIZAR VISTA
        // ============================================
        function renderizarVista() {
            console.log('🔄 Renderizando vista:', currentView);
            const title = document.getElementById('page-title');
            
            if (currentView === 'historial') {
                if (title) title.innerHTML = '📊 <span class="highlight">Historial</span>';
                mostrarVistaHistorial();
                return;
            }
            if (currentView === 'demoras') {
                if (title) title.innerHTML = '⏱️ <span class="highlight">Demoras</span>';
                mostrarVistaDemoras();
                return;
            }
            // DEFAULT: ACTIVOS
            if (title) title.innerHTML = '📋 <span class="highlight">Pedidos</span> Activos';
            restaurarVistaColumnas();
        }

        // ============================================
        // 15. RESTAURAR VISTA DE COLUMNAS (SOLO 2)
        // ============================================
        function restaurarVistaColumnas() {
            const container = document.getElementById('kanban-container');
            if (!container) return;
            
            container.innerHTML = '';
            container.innerHTML = `
                <div class="kanban-column pending" id="columna-pendiente">
                    <div class="column-header">
                        <span class="title">📥 Entrada</span>
                        <span class="count" id="col-count-pendiente">0</span>
                    </div>
                    <div class="column-content" id="col-pendiente"></div>
                </div>
                <div class="kanban-column cooking" id="columna-coccion">
                    <div class="column-header">
                        <span class="title">👨‍🍳 En Cocción</span>
                        <span class="count" id="col-count-coccion">0</span>
                    </div>
                    <div class="column-content" id="col-coccion"></div>
                </div>
            `;
            
            actualizarContadores(0, 0);
            cargarPedidosActivos();
        }

        // ============================================
        // 16. CARGAR PEDIDOS ACTIVOS
        // ============================================
        function cargarPedidosActivos() {
            const colPendiente = document.getElementById('col-pendiente');
            const colCoccion = document.getElementById('col-coccion');
            
            if (!colPendiente || !colCoccion) {
                restaurarVistaColumnas();
                return;
            }
            
            colPendiente.innerHTML = '';
            colCoccion.innerHTML = '';
            
            db.ref('pedidos').once('value').then((snapshot) => {
                const pedidos = snapshot.val();
                let pendiente = 0, coccion = 0;
                
                if (!pedidos) {
                    mostrarMensajeVacio('col-pendiente', '📥', 'No hay pedidos en entrada');
                    mostrarMensajeVacio('col-coccion', '👨‍🍳', 'No hay pedidos en cocción');
                    actualizarContadores(0, 0);
                    return;
                }
                
                const pedidosArray = Object.entries(pedidos);
                for (const [id, data] of pedidosArray) {
                    const restId = data.restauranteId || data.restaurante_id || data.uid_restaurante;
                    if (restId !== restauranteId) continue;
                    
                    let estado = data.estado ? data.estado.toLowerCase() : '';
                    if (estado === 'recibido') estado = 'pendiente';
                    
                    if (estado === 'pendiente') {
                        pendiente++;
                        agregarPedidoAColumna(id, { ...data, estado });
                    } else if (estado === 'coccion') {
                        coccion++;
                        agregarPedidoAColumna(id, { ...data, estado });
                    }
                }
                
                if (pendiente === 0) mostrarMensajeVacio('col-pendiente', '📥', 'No hay pedidos en entrada');
                if (coccion === 0) mostrarMensajeVacio('col-coccion', '👨‍🍳', 'No hay pedidos en cocción');
                
                actualizarContadores(pendiente, coccion);
                console.log(`✅ Pedidos: ${pendiente} entrada, ${coccion} cocción`);
            }).catch((error) => {
                console.error('Error al cargar pedidos:', error);
                mostrarMensajeVacio('col-pendiente', '❌', 'Error al cargar');
                mostrarMensajeVacio('col-coccion', '❌', 'Error al cargar');
            });
        }

        // ============================================
        // 17. AGREGAR PEDIDO A COLUMNA
        // ============================================
        function agregarPedidoAColumna(id, data) {
            let estado = data.estado || 'pendiente';
            if (estado === 'recibido') estado = 'pendiente';
            
            let columnaId = estado === 'pendiente' ? 'col-pendiente' : 'col-coccion';
            const container = document.getElementById(columnaId);
            if (!container) return;

            const clienteNombre = data.cliente_nombre || data.clienteNombre || 'Cliente';
            const telefono = data.cliente_telefono || data.telefono || 'Sin teléfono';
            const direccion = data.direccion || 'Sin dirección';
            const idPedido = data.id_pedido || data.id || id.substring(0, 8);
            const total = data.total || 0;
            const timestamp = data.timestamp ? new Date(data.timestamp).toLocaleTimeString() : '';

            const tiempoInicio = data.timestamp_inicio || data.timestamp || Date.now();
            const tiempoActual = Date.now();
            const tiempoTranscurrido = Math.floor((tiempoActual - tiempoInicio) / 60000);
            const tiempoLimite = data.tiempo_limite || tiempoElaboracionRestaurante || TIEMPO_ELABORACION_DEFAULT;
            const tiempoRestante = Math.max(0, tiempoLimite - tiempoTranscurrido);
            const enDemora = tiempoTranscurrido > tiempoLimite;

            let tiempoDisplay = '', badgeDemora = '';

// ============================================
window.notificarRepartidor = async function(pedidoId) {
    console.log('📤 Iniciando notificación al repartidor para pedido:', pedidoId);
    
    try {
        // 1. OBTENER DATOS DEL PEDIDO
        const pedidoSnap = await db.ref(`pedidos/${pedidoId}`).once('value');
        const pedido = pedidoSnap.val();
        
        if (!pedido) {
            console.error('❌ Pedido no encontrado');
            showToast('❌ Pedido no encontrado', 'error');
            return;
        }
        
        console.log('📦 Pedido obtenido:', pedido);

        // 2. BUSCAR REPARTIDORES ACTIVOS
        const repartidoresSnap = await db.ref('repartidores')
            .orderByChild('activo')
            .equalTo(true)
            .once('value');
        
        const repartidores = repartidoresSnap.val();
        console.log('📊 Repartidores activos:', repartidores);
        
        if (!repartidores) {
            console.warn('⚠️ No hay repartidores disponibles');
            showToast('⚠️ No hay repartidores disponibles', 'warning');
            return;
        }

        // 3. SELECCIONAR REPARTIDOR CON MENOS CARGA
        let repartidorId = null;
        let repartidorData = null;
        let menorCarga = Infinity;
        
        for (const [uid, data] of Object.entries(repartidores)) {
            // Contar pedidos activos de este repartidor
            const pedidosActivosSnap = await db.ref('pedidos')
                .orderByChild('uid_repartidor')
                .equalTo(uid)
                .once('value');
            
            const pedidosActivos = pedidosActivosSnap.val();
            let carga = 0;
            
            if (pedidosActivos) {
                for (const [pid, pData] of Object.entries(pedidosActivos)) {
                    const estado = pData.estado ? pData.estado.toUpperCase() : '';
                    if (estado === 'EN_REPARTO' || estado === 'LISTO' || estado === 'REPARTO' || estado === 'PENDIENTE') {
                        carga++;
                    }
                }
            }
            
            console.log(`🛵 Repartidor ${data.nombre || uid}: ${carga} pedidos activos`);
            
            if (carga < menorCarga) {
                menorCarga = carga;
                repartidorId = uid;
                repartidorData = data;
            }
        }
        
        if (!repartidorId) {
            console.warn('⚠️ No se pudo seleccionar un repartidor');
            showToast('⚠️ No hay repartidores disponibles', 'warning');
            return;
        }
        
        console.log(`✅ Repartidor seleccionado: ${repartidorData.nombre || repartidorId} (${menorCarga} pedidos)`);

        // 4. ASIGNAR REPARTIDOR AL PEDIDO
        await db.ref(`pedidos/${pedidoId}/uid_repartidor`).set(repartidorId);
        await db.ref(`pedidos/${pedidoId}/repartidor_nombre`).set(repartidorData.nombre || 'Repartidor');
        await db.ref(`pedidos/${pedidoId}/timestamp_asignacion`).set(Date.now());
        await db.ref(`pedidos/${pedidoId}/historial`).push({
            estado: 'coccion',
            timestamp: Date.now(),
            usuario: currentUser.uid,
            accion: 'asignar_repartidor',
            repartidor: repartidorId,
            repartidor_nombre: repartidorData.nombre || 'Repartidor'
        });

        // 5. ENVIAR NOTIFICACIÓN PUSH
        const token = repartidorData.token;
        console.log('📱 Token del repartidor:', token ? '✅ Disponible' : '❌ No disponible');
        
        if (!token) {
            console.warn('⚠️ Repartidor sin token FCM');
            showToast('⚠️ El repartidor no tiene notificaciones activas', 'warning');
            return;
        }
        
        const titulo = '🛵 Nuevo pedido disponible';
        const mensaje = `Recoge el pedido de ${pedido.cliente_nombre || 'cliente'} en ${pedido.restaurante_nombre || 'el restaurante'}`;
        
        console.log(`📤 Enviando notificación a ${repartidorData.nombre || repartidorId}`);
        console.log(`📨 Título: ${titulo}`);
        console.log(`📨 Mensaje: ${mensaje}`);
        
        try {
            const enviarNotificacion = functions.httpsCallable('enviarNotificationPedido');
            
            const result = await enviarNotificacion({
                token: token,
                titulo: titulo,
                mensaje: mensaje,
                data: { 
                    tipo: 'pedido', 
                    uid: repartidorId,
                    pedidoId: pedidoId
                }
            });
            
            console.log('✅ Notificación push enviada:', result.data);
            showToast(`✅ Repartidor asignado: ${repartidorData.nombre || 'Repartidor'}`, 'success');
            
        } catch (error) {
            console.error('❌ Error al enviar notificación:', error);
            showToast('⚠️ Repartidor asignado pero notificación falló', 'warning');
        }
        
    } catch (error) {
        console.error('❌ Error en notificarRepartidor:', error);
        showToast('❌ Error al asignar repartidor', 'error');
    }
};

        window.marcarListo = async function(pedidoId) {
            try {
                const snapshot = await db.ref(`pedidos/${pedidoId}`).once('value');
                const data = snapshot.val();
                if (!data) { showToast('❌ Pedido no encontrado', 'error'); return; }
                const tiempoInicio = data.timestamp_inicio || data.timestamp || Date.now();
                const tiempoPreparacion = Math.floor((Date.now() - tiempoInicio) / 60000);
                const tiempoLimite = data.tiempo_limite || tiempoElaboracionRestaurante || TIEMPO_ELABORACION_DEFAULT;
                const demora = Math.max(0, tiempoPreparacion - tiempoLimite);
                await db.ref(`pedidos/${pedidoId}/estado`).set('LISTO');
                await db.ref(`pedidos/${pedidoId}/tiempo_preparacion`).set(tiempoPreparacion);
                await db.ref(`pedidos/${pedidoId}/timestamp_listo`).set(Date.now());
                await db.ref(`pedidos/${pedidoId}/historial`).push({ estado: 'LISTO', timestamp: Date.now(), usuario: currentUser.uid, accion: 'marcado_listo' });
                if (demora > 0) {
                    await db.ref(`pedidos/${pedidoId}/demora`).set(demora);
                    await db.ref(`pedidos/${pedidoId}/historial`).push({ estado: 'demora_registrada', timestamp: Date.now(), usuario: currentUser.uid, demora, accion: 'registrar_demora' });

        function cargarHistorialFiltrado() {
            const content = document.getElementById('historial-contenido');

            const filtro = document.getElementById('filtro-historial');
            if (!content) return;
            const filtroSeleccionado = filtro ? filtro.value : 'todos';
            content.innerHTML = '';
            db.ref('pedidos').once('value').then(snap => {
                const pedidos = snap.val();
                let count = 0;
                if (!pedidos) { content.innerHTML = `<div class="empty"><div class="icon">📜</div><div>No hay pedidos</div></div>`; if (contador) contador.textContent = '0'; return; }
                for (const [id, data] of Object.entries(pedidos)) {
                    const restId = data.restauranteId || data.restaurante_id || data.uid_restaurante;
                    if (restId !== restauranteId) continue;
                    const estado = data.estado ? data.estado.toLowerCase() : '';
                    const tipo = data.tipo || 'normal';
                    if (filtroSeleccionado === 'ventas' && tipo === 'reparto_personal') continue;
                    if (filtroSeleccionado === 'repartos' && tipo !== 'reparto_personal') continue;
                    if (estado === 'entregado' || estado === 'cancelado' || estado === 'rechazado') {
                        count++;

                            if (data.items.length > 4) productosHtml += `<span style="font-size:0.5rem;color:var(--text-muted);">+${data.items.length-4} más</span>`;
                        } else { productosHtml = '<span>Sin productos</span>'; }
                        card.innerHTML = `
                            <div class="top"><span class="id">#${data.id_pedido || id.substring(0,8)}</span><span class="time">${fecha}</span></div>

                <div class="view-header">
                    <span class="title" style="color:var(--accent-red);">⏱️ Demoras</span>
                    <span style="background:var(--bg-card);padding:0.1rem 0.6rem;border-radius:50px;font-size:0.6rem;color:var(--text-muted);" id="col-count-demoras">0</span>
                </div>
                <div class="view-content" id="demoras-contenido"></div>
            `;
            container.appendChild(viewContainer);
            db.ref('pedidos').once('value').then((snapshot) => {
                const pedidos = snapshot.val();
                const content = document.getElementById('demoras-contenido');
                const contador = document.getElementById('col-count-demoras');
                if (!pedidos) { content.innerHTML = `<div class="empty"><div class="icon">⏱️</div><div>No hay demoras</div></div>`; if (contador) contador.textContent = '0'; return; }
                let demoras = [], totalDemora = 0, countDemora = 0;
                for (const [id, data] of Object.entries(pedidos)) {
                    const restId = data.restauranteId || data.restaurante_id || data.uid_restaurante;
                    if (restId !== restauranteId) continue;
                    const demora = data.demora || data.tiempo_demora || 0;
                    if (demora > 0) {
                        demoras.push({ id, id_pedido: data.id_pedido || id.substring(0, 8), cliente: data.cliente_nombre || 'Cliente', total: data.total || 0, demora, fecha: data.timestamp ? new Date(data.timestamp) : null, items: data.items || [] });
                        totalDemora += demora; countDemora++;
                    }
                }
                demoras.sort((a, b) => b.demora - a.demora);
                if (demoras.length === 0) { content.innerHTML = `<div class="empty"><div class="icon">⏱️</div><div>No hay demoras</div></div>`; if (contador) contador.textContent = '0'; return; }
                if (contador) contador.textContent = demoras.length;
                let html = `<div style="background:var(--bg-card);border-radius:var(--radius-sm);padding:0.3rem 0.8rem;border:1px solid var(--border-color);margin-bottom:0.4rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:0.75rem;">
                    <div><span style="color:var(--text-muted);">📊 Total:</span> <strong style="color:var(--accent-red);">${countDemora}</strong></div>
                    <div><span style="color:var(--text-muted);">⏱️ Promedio:</span> <strong style="color:var(--accent-gold);">${(totalDemora/countDemora).toFixed(0)} min</strong></div>
                </div>`;
                for (const d of demoras) {
                    const color = d.demora > 30 ? 'var(--accent-red)' : d.demora > 15 ? 'var(--accent-gold)' : 'var(--accent-green)';
                    let prodHtml = '';
                    if (d.items && d.items.length > 0) {
                        prodHtml = d.items.slice(0, 3).map(item => `<span>${item.cantidad || 1}x ${item.nombre}</span>`).join('');
                        if (d.items.length > 3) prodHtml += `<span style="font-size:0.5rem;color:var(--text-muted);">+${d.items.length-3} más</span>`;
                    } else { prodHtml = '<span>Sin productos</span>'; }
                    html += `
                        <div class="order-card" style="border-left:4px solid ${color};">
                            <div class="top"><span class="id">#${d.id_pedido}</span><span class="time">${d.fecha ? d.fecha.toLocaleString() : 'Sin fecha'}</span></div>
                            <div class="cliente">${escapeHTML(d.cliente)}</div>
                            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:0.2rem;">
                                <span style="font-size:0.6rem;color:var(--text-muted);">⏱️ Demora</span>
                                <span style="background:${color};color:#0f172a;padding:0.05rem 0.5rem;border-radius:50px;font-size:0.6rem;font-weight:700;">${d.demora} min</span>
                            </div>
                            <div class="productos">${prodHtml}</div>
                            <div style="display:flex;justify-content:space-between;margin-top:0.2rem;padding-top:0.2rem;border-top:1px solid var(--border-color);">
                                <span style="font-weight:700;color:var(--accent-gold);font-size:0.75rem;">$${d.total.toFixed(2)}</span>
                                <button class="btn btn-secondary" onclick="verDetallePedido('${d.id}')" style="padding:0.05rem 0.4rem;font-size:0.55rem;">📋</button>
                            </div>
                        </div>
                    `;
                }
                content.innerHTML = html;
            }).catch(error => console.error('Error:', error));
        }

        // ============================================
        // 24. MENÚ NAVEGACIÓN
        // ============================================
        document.querySelectorAll('.menu-item[data-view]').forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                const view = this.dataset.view;
                console.log('📌 Menú click:', view);
                
                document.querySelectorAll('.menu-item[data-view]').forEach(el => {
                    el.classList.remove('active');
                });
                this.classList.add('active');
                
                currentView = view;
                renderizarVista();
            });
        });

        // ============================================
        // 25. REPARTO PERSONAL
        // ============================================
        window.abrirFormularioReparto = function() {
            Swal.fire({
                title: '🚚 Nuevo Reparto',
                html: `
                    <div style="text-align:left;color:white;font-size:0.85rem;">
                        <div style="margin-bottom:10px;"><label style="display:block;color:#94a3b8;font-size:0.7rem;">👤 Cliente *</label><input id="cliente-reparto" class="swal2-input" placeholder="Nombre" style="background:#1e293b;border:1px solid #334155;color:white;font-size:0.85rem;"></div>
                        <div style="margin-bottom:10px;"><label style="display:block;color:#94a3b8;font-size:0.7rem;">📞 Teléfono *</label><input id="telefono-reparto" class="swal2-input" placeholder="Teléfono" style="background:#1e293b;border:1px solid #334155;color:white;font-size:0.85rem;"></div>
                        <div style="margin-bottom:10px;"><label style="display:block;color:#94a3b8;font-size:0.7rem;">📍 Dirección *</label><input id="direccion-reparto" class="swal2-input" placeholder="Dirección" style="background:#1e293b;border:1px solid #334155;color:white;font-size:0.85rem;"></div>
                        <div style="margin-bottom:10px;"><label style="display:block;color:#94a3b8;font-size:0.7rem;">💳 Pago</label><select id="pago-reparto" style="width:100%;padding:0.6rem;background:#1e293b;border:1px solid #334155;border-radius:8px;color:white;font-size:0.85rem;"><option value="pagado">✅ Pagado</option><option value="cobrar">💵 Cobrar en sitio</option></select></div>
                    </div>
                `,
                confirmButtonText: '📨 Enviar',
                showCancelButton: true,
                cancelButtonText: 'Cancelar',
                background: '#0f172a',
                color: 'white',
                confirmButtonColor: '#8b5cf6',
                cancelButtonColor: '#334155',
                width: '90%',
                preConfirm: () => {
                    const cliente = document.getElementById('cliente-reparto').value.trim();
                    const telefono = document.getElementById('telefono-reparto').value.trim();
                    const direccion = document.getElementById('direccion-reparto').value.trim();
                    if (!cliente || !telefono || !direccion) {
                        Swal.showValidationMessage('❌ Completa todos los campos');
                        return false;
                    }
                    return { cliente, telefono, direccion, pago: document.getElementById('pago-reparto').value };
                }
            }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        const repartidoresSnap = await db.ref('repartidores').orderByChild('activo').equalTo(true).once('value');
                        const repartidores = repartidoresSnap.val();
                        if (!repartidores) { showToast('⚠️ No hay repartidores', 'warning'); return; }
                        let repartidorId = Object.keys(repartidores)[0];
                        const pedidoId = db.ref('pedidos').push().key;
                        await db.ref(`pedidos/${pedidoId}`).set({
                            uid_restaurante: restauranteId, restaurante_id: restauranteId,
                            restaurante_nombre: document.getElementById('sidebar-restaurante').textContent || 'Restaurante',
                            uid_repartidor: repartidorId, repartidor_nombre: repartidores[repartidorId].nombre || 'Repartidor',
                            uid_cliente: 'reparto_personal', cliente_nombre: result.value.cliente,
                            cliente_telefono: result.value.telefono, direccion: result.value.direccion,
                            items: [{ nombre: '📦 Reparto Personal', cantidad: 1, precio_unitario: 0, total: 0 }],
                            total: 0, envio: 5.00, estado: 'LISTO', tipo: 'reparto_personal',
                            metodo_pago: result.value.pago === 'pagado' ? 'Pagado' : 'Contra entrega',
                            timestamp: Date.now(), timestamp_inicio: Date.now(), timestamp_listo: Date.now(),
                            historial: [{ estado: 'LISTO', timestamp: Date.now(), accion: 'creado' }]
                        });
                        showToast('✅ Reparto enviado', 'success');
                        renderizarVista();
                    } catch (error) { console.error('Error:', error); showToast('❌ Error', 'error'); }
                }
            });
        };

        // ============================================
        // 26. INICIALIZAR
        // ============================================
        console.log('🍳 Aguadulce Express - Panel de Cocina V3');
        console.log('📱 Solo 2 columnas: Entrada y Cocción');
        console.log('📱 Sidebar siempre visible');
    </script>

</body>
</html>
