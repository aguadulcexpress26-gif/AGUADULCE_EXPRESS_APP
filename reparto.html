<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reparto Express - Aguadulce</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/mZwjLXxw/Logo-Aguadulce-Express.jpg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        :root { --cyan: #06b6d4; --dark: #020617; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--dark); color: white; margin: 0; }
        .card-reparto { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 2rem; padding: 20px; margin-bottom: 15px; }
        #loader { position: fixed; inset: 0; background: var(--dark); z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(6,182,212,0.1); border-top-color: var(--cyan); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Estilo para el botón de salida */
        .btn-salir { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); transition: all 0.3s; }
        .btn-salir:active { background: rgba(239, 68, 68, 0.2); border-color: #ef4444; }
        .badge-tiempo {
    background: rgba(6, 182, 212, 0.1);
    border: 1px solid rgba(6, 182, 212, 0.3);
    color: var(--cyan);
    padding: 4px 10px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 800;
}
.blink { animation: blinker 1.5s linear infinite; }
@keyframes blinker { 50% { opacity: 0; } }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>

    <div id="loader">
        <div class="spinner mb-4"></div>
        <p class="text-cyan-400 text-[10px] font-black uppercase tracking-widest">Iniciando Terminal de Reparto...</p>
    </div>

    <!-- HEADER LOGÍSTICA -->
    <header class="p-6 bg-gradient-to-b from-cyan-900/20 to-transparent">
        <div class="flex justify-between items-center mb-6">
            <div class="flex items-center gap-4">
                <!-- BOTÓN SALIR -->
                <button onclick="cerrarSesion()" class="btn-salir p-3 rounded-2xl">
                    <span class="text-lg">🚪</span>
                </button>
                <div>
                    <h1 id="nombre-repartidor" class="text-xl font-black italic uppercase italic leading-tight">REPARTIDOR</h1>
                    <p id="codigo-ui" class="text-cyan-400 text-[10px] font-bold uppercase tracking-tighter">Cargando código...</p>
                </div>
            </div>
            <div class="text-right">
                <p class="text-[8px] font-black text-white/40 uppercase">Billetera Hoy</p>
                <p id="saldo-billetera" class="text-xl font-black text-white">0.00€</p>
            </div>
        </div>
        
        <!-- ESTADO DE CONEXIÓN -->
        <div id="status-bar" class="bg-white/5 p-4 rounded-2xl border border-white/10 flex justify-between items-center">
            <span class="text-[10px] font-black uppercase">Estado: <span id="txt-estado" class="text-green-400">Disponible</span></span>
            <div id="indicador-pedidos" class="text-[10px] font-black bg-cyan-400 text-black px-3 py-1 rounded-full">0/2 ACTIVOS</div>
        </div>
    </header>

    <main id="lista-pedidos" class="px-6 pb-32">
        <!-- Las tarjetas de pedidos aparecerán aquí -->
    </main>

    <script>
        // RECUERDA: La URL debe terminar en /exec
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzYFDShcrP7I4FKhiH3q5UcEInpSKJstrumJ9ddI4Tj9S31ZUgwiuie81fGFmCJ6ob2/exec'; 
        const firebaseConfig = {
    databaseURL: "https://aguadulce-notificaciones-default-rtdb.firebaseio.com/"
};
firebase.initializeApp(firebaseConfig);
const database = firebase.database();
        let miCodigo = localStorage.getItem('ae_cod_reparto');
        let pedidosActivos = [];
        let saldoActual = 0;

       async function initReparto() {
    if(!miCodigo) {
        let inputCodigo = prompt("Introduce tu código de repartidor (ej: R001):");
        if(!inputCodigo) return location.reload();
        
        // CORRECCIÓN: Limpiamos espacios y pasamos a MAYÚSCULAS antes de guardar
        miCodigo = inputCodigo.trim().toUpperCase(); 
        localStorage.setItem('ae_cod_reparto', miCodigo);
    }
    
    document.getElementById('codigo-ui').innerText = `ID: ${miCodigo}`;
    
    // Escucha de Firebase para refrescar cuando hay pedidos nuevos
    database.ref('pedidosActivos').on('value', (snapshot) => {
        console.log("Movimiento detectado, actualizando panel...");
        refrescarDatos(); 
    });
    
    await refrescarDatos();
    document.getElementById('loader').style.display = 'none';
}

async function refrescarDatos() {
    try {
        // Aseguramos que el código vaya limpio en la URL
        const urlFinal = `${scriptURL}?action=getPedidosReparto&idRepartidor=${miCodigo.trim().toUpperCase()}`;
        const res = await fetch(urlFinal);
        const data = await res.json();
        
        if(data.error) {
            // Si el error es "No encontrado", avisamos qué ID se intentó usar
            console.error("Error desde el servidor:", data.error);
            alert(`Repartidor ${miCodigo} no encontrado en el sistema.`);
            cerrarSesion();
            return;
        }

        pedidosActivos = data.pedidos;
        saldoActual = parseFloat(data.saldo) || 0;
        
        document.getElementById('saldo-billetera').innerText = saldoActual.toFixed(2) + "€";
        document.getElementById('indicador-pedidos').innerText = `${pedidosActivos.length}/2 ACTIVOS`;
        document.getElementById('nombre-repartidor').innerText = data.nombre || "REPARTIDOR";
        
        // --- SINCRONIZACIÓN CON FIREBASE ---
        const snapshot = await database.ref('pedidos').once('value');
        const tiemposFirebase = snapshot.val() || {};

        pedidosActivos = pedidosActivos.map(p => {
            if (tiemposFirebase[p.id]) {
                return { ...p, timestampListo: tiemposFirebase[p.id].timestampListo };
            }
            return p;
        });
        
        renderPedidos();
        
        // Resetear estado visual a Online
        document.getElementById('txt-estado').innerText = "Disponible";
        document.getElementById('txt-estado').className = "text-green-400";

    } catch (e) { 
        console.error("Error de conexión:", e); 
        document.getElementById('txt-estado').innerText = "Offline";
        document.getElementById('txt-estado').className = "text-red-400";
    }
}
        function renderPedidos() {
            const contenedor = document.getElementById('lista-pedidos');
            if(pedidosActivos.length === 0) {
                contenedor.innerHTML = `<div class="py-20 text-center opacity-30 font-black italic uppercase text-xs">Sin pedidos asignados...</div>`;
                return;
            }

            contenedor.innerHTML = pedidosActivos.map(p => {
    // Intentamos obtener el timestamp de Firebase si existe para este pedido
    // Nota: Necesitaremos que el objeto 'p' incluya este dato de Firebase
    return `
        <div class="card-reparto">
            <div class="flex justify-between items-start mb-4">
                <span class="bg-cyan-400 text-black px-3 py-1 rounded-lg text-[10px] font-black italic uppercase">${p.estado}</span>
                <span class="text-white/40 text-[10px] font-bold">Ref: ${p.id}</span>
            </div>
            
            <h3 class="font-black text-lg italic uppercase leading-tight mb-1">${p.direccion}</h3>
            
            <!-- --- CRONÓMETRO DE COCINA --- -->
            <div class="mb-4">
                <span class="timer-cocina badge-tiempo" data-time="${p.timestampListo || ''}">
                    ${p.timestampListo ? 'Calculando...' : '⏳ ESPERANDO TIEMPO'}
                </span>
            </div>
            
            <p class="text-white/60 text-xs mb-4">${p.cliente} • ${p.pago}</p>
            
            <div class="grid grid-cols-2 gap-3 mb-6">
                <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.direccion)}" class="bg-white/5 border border-white/10 p-4 rounded-xl text-center">
                    <span class="block text-[18px]">📍</span>
                    <span class="text-[8px] font-black uppercase text-cyan-400">Ver Mapa</span>
                </a>
                <a href="https://wa.me/${p.telf.toString().replace(/\+/g,'')}" class="bg-white/5 border border-white/10 p-4 rounded-xl text-center">
                    <span class="block text-[18px]">💬</span>
                    <span class="text-[8px] font-black uppercase text-green-400">WhatsApp</span>
                </a>
            </div>

            <div class="flex items-center justify-between gap-4">
                <div class="text-left">
                    <p class="text-[8px] font-bold text-white/40 uppercase">Total a Cobrar</p>
                    <p class="text-xl font-black text-cyan-400">${parseFloat(p.total).toFixed(2)}€</p>
                </div>
                ${p.estado === 'EN PROCESO' || p.estado === 'PREPARANDO' || p.estado === 'LISTO' ? 
                    `<button onclick="actualizarEstado('${p.id}', 'EN CAMINO')" class="flex-1 bg-white text-black py-4 rounded-xl font-black uppercase text-[10px] italic">Iniciar Reparto</button>` :
                    `<button onclick="finalizarEntrega('${p.id}', ${p.total})" class="flex-1 bg-green-500 text-white py-4 rounded-xl font-black uppercase text-[10px] italic">Confirmar Entrega</button>`
                }
            </div>
        </div>
    `;
}).join('');
        }

        async function actualizarEstado(id, nuevoEstado) {
            document.getElementById('loader').style.display = 'flex';
            await fetch(`${scriptURL}?action=cambiarEstadoReparto&idPedido=${id}&estado=${nuevoEstado}`);
            await refrescarDatos();
            document.getElementById('loader').style.display = 'none';
        }

        async function finalizarEntrega(id, total) {
            if(!confirm("¿Confirmas que el cliente ha pagado y recibido el pedido?")) return;
            document.getElementById('loader').style.display = 'flex';
            await fetch(`${scriptURL}?action=finalizarEntrega&idPedido=${id}&total=${total}&idRepartidor=${miCodigo}`);
            await refrescarDatos();
            document.getElementById('loader').style.display = 'none';
        }

        function cerrarSesion() {
            if(confirm("¿Quieres cerrar sesión y cambiar de repartidor?")) {
                localStorage.removeItem('ae_cod_reparto');
                location.reload();
            }
        }
        function actualizarContadores() {
    document.querySelectorAll('.timer-cocina').forEach(el => {
        const target = parseInt(el.getAttribute('data-time'));
        if (!target) return;

        const ahora = new Date().getTime();
        const diff = target - ahora;

        if (diff <= 0) {
            el.innerHTML = "🔔 ¡PEDIDO LISTO!";
            el.className = "timer-cocina text-green-400 font-black blink";
        } else {
            const min = Math.floor(diff / 60000);
            const seg = Math.floor((diff % 60000) / 1000);
            el.innerHTML = `⏳ COCINA: ${min}m ${seg}s`;
        }
    });
}
// Ejecutamos la actualización cada segundo
setInterval(actualizarContadores, 1000);
        initReparto();
    </script>
</body>
</html>
