<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aguadulce Express - Control de Cocina v1.0</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body { 
            background-color: #020617; 
            color: #f8fafc; 
            font-family: system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }
        /* Scrollbars oscuras y elegantes para monitores */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
        
        /* Efecto de pulsación táctil activa para los botones de cocina */
        .btn-touch-active:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div class="relative w-full h-44 sm:h-52 md:h-60 bg-slate-900 overflow-hidden border-b border-slate-800">
        <img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=1200&q=80" 
             alt="Banner de Cocina" 
             class="absolute inset-0 w-full h-full object-cover opacity-25 filter blur-xs scale-105">
        
        <div class="absolute inset-0 bg-gradient-to-t from:#020617 via-transparent to-black/50"></div>
        
        <div class="absolute inset-0 flex flex-col md:flex-row justify-between items-start md:items-center p-6 md:px-10 gap-4">
            <div class="flex items-center gap-5">
                <div class="w-16 h-16 md:w-20 md:h-20 bg-slate-950 rounded-2xl border-2 border-cyan-500/30 flex items-center justify-center p-2 shadow-xl backdrop-blur-md">
                    <img src="https://i.postimg.cc/mZwjLXxw/Logo-Aguadulce-Express.jpg" 
                         alt="Logo AE" 
                         class="w-full h-full object-contain rounded-lg">
                </div>
                <div>
                    <span class="text-cyan-400 font-bold tracking-widest text-xs uppercase bg-cyan-500/10 px-3 py-1 rounded-full border border-cyan-500/20">
                        PANEL DE PRODUCCIÓN
                    </span>
                    <h1 id="nombreRestaurante" class="text-2xl md:text-4xl font-black text-white mt-1 drop-shadow-md">
                        DELICIOUS FOOD
                    </h1>
                </div>
            </div>
            
            <div class="flex items-center gap-4 bg-slate-950/80 p-3 rounded-xl border border-slate-800 backdrop-blur-md">
                <div class="text-right">
                    <span class="text-xs text-slate-400 block font-medium">Terminal táctil activa</span>
                    <span id="relojDigital" class="text-lg font-bold text-white tracking-wider">00:00:00</span>
                </div>
                <div class="h-8 w-px bg-slate-800"></div>
                <div class="flex items-center gap-2 px-2">
                    <span class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
                    <span class="text-sm font-semibold text-emerald-400 uppercase tracking-wider">ABIERTO</span>
                </div>
            </div>
        </div>
    </div>

    <main class="flex-1 p-6 max-w-[1600px] w-full mx-auto flex flex-col gap-4">
        
        <div class="flex flex-wrap justify-between items-center gap-4 bg-slate-900/50 border border-slate-800 p-4 rounded-2xl">
            <div class="flex gap-6">
                <div class="text-sm text-slate-400">
                    Pedidos Pendientes: <span id="cantPendientes" class="text-cyan-400 font-bold text-base ml-1">0</span>
                </div>
                <div class="text-sm text-slate-400">
                    En Proceso (Fuego): <span id="cantProceso" class="text-amber-400 font-bold text-base ml-1">0</span>
                </div>
            </div>
            <div>
                <button onclick="forzarRefresco()" class="btn-touch-active text-xs bg-slate-800 hover:bg-slate-700 font-bold text-slate-300 px-4 py-2 rounded-xl transition border border-slate-700 cursor-pointer">
                    🔄 Sincronizar Base de Datos
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 flex-1">
            
            <div class="bg-slate-900/40 rounded-2xl p-4 border border-slate-800 flex flex-col min-h-[450px]">
                <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
                    <h3 class="font-bold text-sm uppercase tracking-wider text-cyan-400 flex items-center gap-2">
                        📥 Nuevos Entrantes
                    </h3>
                    <span class="bg-cyan-500/10 text-cyan-400 text-xs px-2.5 py-0.5 rounded-full font-bold border border-cyan-500/20" id="badgeNuevos">0</span>
                </div>
                <div id="listaNuevos" class="space-y-4 flex-1 overflow-y-auto max-h-[60vh]">
                    </div>
            </div>

            <div class="bg-slate-900/40 rounded-2xl p-4 border border-slate-800 flex flex-col min-h-[450px]">
                <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
                    <h3 class="font-bold text-sm uppercase tracking-wider text-amber-400 flex items-center gap-2">
                        🍳 En Preparación
                    </h3>
                    <span class="bg-amber-500/10 text-amber-400 text-xs px-2.5 py-0.5 rounded-full font-bold border border-amber-500/20" id="badgeProceso">0</span>
                </div>
                <div id="listaProceso" class="space-y-4 flex-1 overflow-y-auto max-h-[60vh]">
                    </div>
            </div>

            <div class="bg-slate-900/40 rounded-2xl p-4 border border-slate-800 flex flex-col min-h-[450px]">
                <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
                    <h3 class="font-bold text-sm uppercase tracking-wider text-emerald-400 flex items-center gap-2">
                        📦 Listos / Despachados
                    </h3>
                    <span class="bg-emerald-500/10 text-emerald-400 text-xs px-2.5 py-0.5 rounded-full font-bold border border-emerald-500/20" id="badgeListos">0</span>
                </div>
                <div id="listaListos" class="space-y-4 flex-1 overflow-y-auto max-h-[60vh]">
                    </div>
            </div>

        </div>
    </main>

    <script>
        // Reloj digital superior en tiempo real
        function actualizarReloj() {
            const ahora = new Date();
            document.getElementById('relojDigital').innerText = ahora.toLocaleTimeString('es-ES');
        }
        setInterval(actualizarReloj, 1000);
        actualizarReloj();

        // Simulación de ejemplo de cómo se estructurarán las tarjetas táctiles para la cocina
        const ejemploPedido = `
            <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 shadow-lg space-y-3">
                <div class="flex justify-between items-start">
                    <div>
                        <span class="text-xs text-slate-500 font-mono">#AE-3012</span>
                        <h4 class="font-bold text-base text-white">Mesa 4 / Para Llevar</h4>
                    </div>
                    <span class="bg-slate-800 text-slate-300 text-xs font-bold px-2 py-1 rounded-md">Hace 4 min</span>
                </div>
                
                <div class="bg-slate-900 p-3 rounded-lg border border-slate-800/80">
                    <ul class="space-y-1.5 text-sm font-semibold text-slate-200">
                        <li class="flex items-center gap-2"><span class="text-cyan-400 font-extrabold text-base">2x</span> Hamburguesa Especial AE</li>
                        <li class="flex items-center gap-2"><span class="text-cyan-400 font-extrabold text-base">1x</span> Patatas Supremas</li>
                    </ul>
                    <div class="text-xs text-amber-400 mt-2 italic font-medium">💡 NOTA: Sin cebolla en las hamburguesas</div>
                </div>

                <button class="btn-touch-active w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black tracking-wider text-sm p-3.5 rounded-xl transition uppercase cursor-pointer">
                    🧑‍🍳 EMPEZAR A COCINAR
                </button>
            </div>
        `;

        // Insertar ejemplos visuales de demostración inicial
        document.getElementById('listaNuevos').innerHTML = ejemploPedido;
    </script>
</body>
</html>
