<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aguadulce Express - Monitor de Pedidos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #020617; font-family: 'Plus Jakarta Sans', sans-serif; color: white; padding: 16px; }
        .pedido-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 20px; padding: 16px; margin-bottom: 12px; }
        .pedido-card.alerta { border-left: 4px solid #f59e0b; }
        .pedido-card.critico { border-left: 4px solid #ef4444; background: rgba(239,68,68,0.1); }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: bold; }
        .badge-recibido { background: rgba(6,182,212,0.2); color: #06b6d4; }
        .badge-proceso { background: rgba(245,158,11,0.2); color: #f59e0b; }
        .badge-reparto { background: rgba(79,70,229,0.2); color: #818cf8; }
        .badge-entregado { background: rgba(34,197,94,0.2); color: #22c55e; }
        .tab { padding: 8px 16px; border-radius: 30px; cursor: pointer; transition: all 0.2s; font-size: 13px; white-space: nowrap; }
        .tab.active { background: #06b6d4; color: #020617; font-weight: bold; }
        .estadistica { background: #0f172a; border-radius: 16px; padding: 12px; text-align: center; }
        .numero-grande { font-size: 24px; font-weight: 800; color: #06b6d4; }
        .btn-accion { background: #f59e0b; color: #020617; padding: 6px 12px; border-radius: 10px; font-size: 11px; font-weight: bold; border: none; cursor: pointer; margin-top: 8px; width: 100%; }
        .btn-accion:active { transform: scale(0.96); }
        audio { display: none; }
        .scroll-horizontal { overflow-x: auto; white-space: nowrap; padding-bottom: 8px; }
    </style>
</head>
<body>

<div id="loader" style="display: flex; justify-content: center; align-items: center; height: 100vh;">
    <div class="text-center">
        <div class="w-10 h-10 border-4 border-cyan-400/20 border-t-cyan-400 rounded-full animate-spin mx-auto mb-4"></div>
        <p>Cargando monitor...</p>
    </div>
</div>

<div id="app" style="display: none;">
    
    <!-- Cabecera -->
    <div class="flex justify-between items-center mb-5 flex-wrap gap-3">
        <div>
            <h1 class="text-xl font-black italic uppercase text-cyan-400">📊 Monitor</h1>
            <p class="text-white/40 text-[10px]">Actualización en tiempo real</p>
        </div>
        <button id="btnActivarSonido" class="bg-yellow-500/20 text-yellow-400 px-4 py-2 rounded-xl text-xs font-bold">🔊 ACTIVAR SONIDO</button>
    </div>

    <!-- Estadísticas -->
    <div class="grid grid-cols-2 gap-3 mb-5">
        <div class="estadistica">
            <div class="numero-grande" id="totalPendientes">0</div>
            <div class="text-[10px] text-white/50">⚠️ Sin confirmar</div>
        </div>
        <div class="estadistica">
            <div class="numero-grande text-amber-400" id="totalCocina">0</div>
            <div class="text-[10px] text-white/50">🍳 En cocina</div>
        </div>
        <div class="estadistica">
            <div class="numero-grande text-purple-400" id="totalReparto">0</div>
            <div class="text-[10px] text-white/50">🛵 En reparto</div>
        </div>
        <div class="estadistica">
            <div class="numero-grande text-emerald-400" id="totalEntregados">0</div>
            <div class="text-[10px] text-white/50">✅ Entregados</div>
        </div>
    </div>

    <!-- Tabs (scroll horizontal para móvil) -->
    <div class="scroll-horizontal flex gap-2 mb-5">
        <div class="tab active" data-tab="pendientes">⚠️ SIN CONFIRMAR</div>
        <div class="tab" data-tab="cocina">🍳 EN COCINA</div>
        <div class="tab" data-tab="reparto">🛵 EN REPARTO</div>
        <div class="tab" data-tab="historial">✅ HISTORIAL</div>
    </div>

    <!-- Lista de pedidos -->
    <div id="listaPedidos"></div>

</div>

<audio id="audio-alerta" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
</audio>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCJcLQ0ikUwZSV7L_8mLLax8B5qnhP0Roc",
        authDomain: "aguadulce-notificaciones.firebaseapp.com",
        databaseURL: "https://aguadulce-notificaciones-default-rtdb.firebaseio.com",
        projectId: "aguadulce-notificaciones",
        storageBucket: "aguadulce-notificaciones.firebasestorage.app",
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let todosLosPedidos = [];
    let restaurantes = [];
    let sonidoActivado = localStorage.getItem('monitor_sonido') === 'true';
    let audioElement = null;
    let tabActual = 'pendientes';
    let ultimoConteoPendientes = 0;
    let intervaloFirebase = null;

    function initAudio() {
        audioElement = document.getElementById('audio-alerta');
        if (audioElement) audioElement.volume = 0.8;
    }

    function playSound() {
        if (audioElement && sonidoActivado) {
            audioElement.currentTime = 0;
            audioElement.play().catch(e => console.log('Audio necesita interacción'));
        }
    }

    async function cargarRestaurantesDesdeGS() {
        try {
            const scriptURL = "https://script.google.com/macros/s/AKfycbzYFDShcrP7I4FKhiH3q5UcEInpSKJstrumJ9ddI4Tj9S31ZUgwiuie81fGFmCJ6ob2/exec";
            const response = await fetch(`${scriptURL}?action=cargarTodo&t=${Date.now()}`);
            const data = await response.json();
            restaurantes = data.RESTAURANTES || [];
            console.log("✅ Restaurantes cargados:", restaurantes.length);
        } catch (error) {
            console.error("Error cargando restaurantes:", error);
        }
    }

    function getNombreRestaurante(idRest) {
        const rest = restaurantes.find(r => String(r.ID_RESTAURANTE).trim() === String(idRest).trim());
        return rest ? (rest.NOMBRE_RESTAURANTE || rest.NOMBRE || idRest) : idRest;
    }

    function getTextoEstado(estado) {
        const e = (estado || '').toUpperCase();
        if (e === 'RECIBIDO') return '📥 RECIBIDO';
        if (e === 'NUEVO') return '🆕 NUEVO';
        if (e === 'EN PROCESO') return '🍳 EN COCINA';
        if (e === 'LISTO') return '✅ LISTO';
        if (e === 'RECOGIDO' || e === 'EN CAMINO') return '🛵 EN REPARTO';
        if (e === 'LLEGÓ') return '📍 EN EL CLIENTE';
        if (e === 'ENTREGADO' || e === 'FINALIZADO') return '🎉 ENTREGADO';
        return estado || 'RECIBIDO';
    }

    function getEstadoParaFiltro(estado) {
        const e = (estado || '').toUpperCase();
        if (e === 'RECIBIDO' || e === 'NUEVO') return 'pendiente';
        if (e === 'EN PROCESO' || e === 'LISTO') return 'cocina';
        if (e === 'RECOGIDO' || e === 'EN CAMINO' || e === 'LLEGÓ') return 'reparto';
        if (e === 'ENTREGADO' || e === 'FINALIZADO') return 'entregado';
        return 'pendiente';
    }

    function getTiempoTranscurrido(timestamp) {
        if (!timestamp) return { texto: '---', minutos: 0 };
        const ahora = Date.now();
        const diffMs = ahora - timestamp;
        const diffMin = Math.floor(diffMs / 60000);
        if (diffMin < 1) return { texto: 'Hace segundos', minutos: 0 };
        if (diffMin < 60) return { texto: `Hace ${diffMin} min`, minutos: diffMin };
        const horas = Math.floor(diffMin / 60);
        const mins = diffMin % 60;
        return { texto: `Hace ${horas}h ${mins}min`, minutos: diffMin };
    }

    function renderizarPedidos() {
        let filtrados = [];
        if (tabActual === 'pendientes') {
            filtrados = todosLosPedidos.filter(p => getEstadoParaFiltro(p.estado) === 'pendiente');
        } else if (tabActual === 'cocina') {
            filtrados = todosLosPedidos.filter(p => getEstadoParaFiltro(p.estado) === 'cocina');
        } else if (tabActual === 'reparto') {
            filtrados = todosLosPedidos.filter(p => getEstadoParaFiltro(p.estado) === 'reparto');
        } else {
            filtrados = todosLosPedidos.filter(p => getEstadoParaFiltro(p.estado) === 'entregado').slice(0, 30);
        }

        const contenedor = document.getElementById('listaPedidos');
        if (!filtrados.length) {
            contenedor.innerHTML = '<div class="text-center py-10 text-white/30">📭 No hay pedidos en esta categoría</div>';
            return;
        }

        let html = '';
        for (let p of filtrados) {
            const esPendiente = getEstadoParaFiltro(p.estado) === 'pendiente';
            const tiempo = getTiempoTranscurrido(p.timestamp);
            let alertaClass = '';
            let alertaMensaje = '';
            if (esPendiente && tiempo.minutos >= 10) {
                alertaClass = 'critico';
                alertaMensaje = '<span class="text-red-400 text-[10px] ml-2">🔴 +10 min</span>';
            } else if (esPendiente && tiempo.minutos >= 5) {
                alertaClass = 'alerta';
                alertaMensaje = '<span class="text-yellow-400 text-[10px] ml-2">🟡 +5 min</span>';
            }

            html += `
                <div class="pedido-card ${alertaClass}">
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="font-mono font-bold text-cyan-400 text-sm">#${p.id}</span>
                                <span class="badge ${getEstadoParaFiltro(p.estado) === 'pendiente' ? 'badge-recibido' : (getEstadoParaFiltro(p.estado) === 'cocina' ? 'badge-proceso' : (getEstadoParaFiltro(p.estado) === 'reparto' ? 'badge-reparto' : 'badge-entregado'))}">${getTextoEstado(p.estado)}</span>
                                ${alertaMensaje}
                            </div>
                            <div class="text-white text-sm font-bold mt-1">${escapeHtml(p.cliente || 'Cliente')}</div>
                            <div class="text-white/40 text-[11px] mt-1">${escapeHtml(p.direccion || 'Sin dirección')}</div>
                        </div>
                        <div class="text-right">
                            <div class="text-emerald-400 font-bold text-base">${(parseFloat(p.total) || 0).toFixed(2)}€</div>
                            <div class="text-white/40 text-[10px]">${tiempo.texto}</div>
                        </div>
                    </div>
                    <div class="mt-2 pt-2 border-t border-white/10 flex justify-between items-center">
                        <div class="text-[11px]">
                            <span class="text-white/60">🏪 ${escapeHtml(getNombreRestaurante(p.restaurante_id))}</span>
                            ${p.repartidor ? `<span class="text-white/40 ml-2">🛵 ${escapeHtml(p.repartidor)}</span>` : ''}
                        </div>
                    </div>
                </div>
            `;
        }
        contenedor.innerHTML = html;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function actualizarEstadisticas() {
        const pendientes = todosLosPedidos.filter(p => getEstadoParaFiltro(p.estado) === 'pendiente').length;
        const cocina = todosLosPedidos.filter(p => getEstadoParaFiltro(p.estado) === 'cocina').length;
        const reparto = todosLosPedidos.filter(p => getEstadoParaFiltro(p.estado) === 'reparto').length;
        const entregados = todosLosPedidos.filter(p => getEstadoParaFiltro(p.estado) === 'entregado').length;
        
        document.getElementById('totalPendientes').innerText = pendientes;
        document.getElementById('totalCocina').innerText = cocina;
        document.getElementById('totalReparto').innerText = reparto;
        document.getElementById('totalEntregados').innerText = entregados;

        if (pendientes > ultimoConteoPendientes && pendientes > 0) {
            playSound();
            if (Notification.permission === 'granted') {
                new Notification('📦 Nuevo pedido sin confirmar', {
                    body: `Hay ${pendientes} pedido(s) que el restaurante no ha aceptado.`,
                    icon: 'https://i.postimg.cc/mZwjLXxw/Logo-Aguadulce-Express.jpg'
                });
            }
        }
        ultimoConteoPendientes = pendientes;
    }

    function cargarPedidosFirebase() {
        const pedidosRef = database.ref('pedidos');
        pedidosRef.on('value', (snapshot) => {
            const data = snapshot.val() || {};
            todosLosPedidos = Object.entries(data).map(([id, p]) => ({
                id: id,
                cliente: p.cliente || '',
                direccion: p.direccion || '',
                total: p.total || 0,
                estado: p.estado || 'recibido',
                repartidor: p.repartidor || '',
                restaurante_id: p.restaurante_id || '',
                timestamp: p.timestamp || Date.now()
            }));
            actualizarEstadisticas();
            renderizarPedidos();
            console.log("📦 Pedidos cargados desde Firebase:", todosLosPedidos.length);
        });
    }

    function activarSonido() {
        sonidoActivado = !sonidoActivado;
        localStorage.setItem('monitor_sonido', sonidoActivado);
        const btn = document.getElementById('btnActivarSonido');
        if (sonidoActivado) {
            btn.innerHTML = '🔊 SONIDO ACTIVADO';
            btn.style.background = '#22c55e';
            btn.style.color = '#020617';
            playSound();
        } else {
            btn.innerHTML = '🔇 ACTIVAR SONIDO';
            btn.style.background = '#f59e0b';
            btn.style.color = '#020617';
        }
    }

    async function iniciarMonitor() {
        initAudio();
        await cargarRestaurantesDesdeGS();
        cargarPedidosFirebase();
        
        document.getElementById('loader').style.display = 'none';
        document.getElementById('app').style.display = 'block';

        const btnSonido = document.getElementById('btnActivarSonido');
        if (sonidoActivado) {
            btnSonido.innerHTML = '🔊 SONIDO ACTIVADO';
            btnSonido.style.background = '#22c55e';
        } else {
            btnSonido.innerHTML = '🔇 ACTIVAR SONIDO';
            btnSonido.style.background = '#f59e0b';
        }
        btnSonido.onclick = activarSonido;

        document.querySelectorAll('.tab').forEach(tab => {
            tab.onclick = () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                tabActual = tab.dataset.tab;
                renderizarPedidos();
            };
        });

        if ('Notification' in window && Notification.permission !== 'granted' && Notification.permission !== 'denied') {
            Notification.requestPermission();
        }
    }

    iniciarMonitor();
</script>
</body>
</html>
