<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONITOR - Versión Simple</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { background: #0f172a; font-family: system-ui; padding: 20px; }
        .pedido { background: #1e293b; border-radius: 12px; padding: 12px; margin-bottom: 8px; border-left: 4px solid #06b6d4; }
        .critico { border-left-color: #ef4444; background: #2a1215; }
        .alerta { border-left-color: #f59e0b; }
        .btn-ok { background: #22c55e; border: none; padding: 4px 12px; border-radius: 20px; color: white; cursor: pointer; }
        .btn-ok:hover { background: #16a34a; }
        .oculto { display: none; }
        audio { display: none; }
    </style>
</head>
<body>

<div class="max-w-4xl mx-auto">
    <div class="flex justify-between items-center mb-4">
        <h1 class="text-2xl font-bold text-white">📊 MONITOR</h1>
        <div class="flex gap-2">
            <span id="contador" class="bg-red-600 px-3 py-1 rounded-full text-white font-bold">0</span>
            <button id="btnReset" class="bg-gray-600 px-3 py-1 rounded-full text-white">🔄 RESET</button>
        </div>
    </div>

    <div id="listaPedidos" class="space-y-2"></div>
</div>

<audio id="sonido">
    <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3">
</audio>

<script>
    const firebaseConfig = { databaseURL: "https://aguadulce-notificaciones-default-rtdb.firebaseio.com/" };
    
    let audio = null;
    let sonidoActivo = true;
    let idsOcultos = new Set(); // Pedidos que ya atendí (OK)
    let ultimoPedidoVisto = null;
    
    function playSound() {
        if (!sonidoActivo) return;
        if (audio) {
            audio.currentTime = 0;
            audio.play().catch(e => console.log("Haz clic en la pantalla"));
        }
    }
    
    function guardarOcultos() {
        localStorage.setItem('ids_ocultos', JSON.stringify([...idsOcultos]));
    }
    
    function cargarOcultos() {
        const guardados = localStorage.getItem('ids_ocultos');
        if (guardados) {
            idsOcultos = new Set(JSON.parse(guardados));
        }
    }
    
    function atenderPedido(id) {
        idsOcultos.add(id);
        guardarOcultos();
        mostrarPedidos();
    }
    
    function resetTodo() {
        idsOcultos.clear();
        guardarOcultos();
        mostrarPedidos();
    }
    
    function mostrarPedidos() {
        if (!window.pedidosGlobal) return;
        
        // Filtrar pedidos NO entregados y NO atendidos
        const pendientes = window.pedidosGlobal.filter(p => {
            const estado = (p.estado || '').toUpperCase();
            const noEntregado = estado !== 'ENTREGADO' && estado !== 'FINALIZADO' && estado !== 'RECHAZADO';
            const noOculto = !idsOcultos.has(p.id);
            return noEntregado && noOculto;
        });
        
        // Actualizar contador
        document.getElementById('contador').textContent = pendientes.length;
        
        // ⚠️ CONTROL DE SONIDO: Solo suena si HAY pedidos pendientes
        if (pendientes.length === 0) {
            // NO HAY PEDIDOS → Silencio total
            if (audio) {
                audio.pause();
                audio.currentTime = 0;
            }
            sonidoActivo = false;
        } else {
            // HAY PEDIDOS → Activar sonido y reproducir
            if (!sonidoActivo) sonidoActivo = true;
            playSound();
        }
        
        // Mostrar lista
        const container = document.getElementById('listaPedidos');
        if (pendientes.length === 0) {
            container.innerHTML = '<div class="text-center py-10 text-white/40">✅ No hay pedidos pendientes</div>';
            return;
        }
        
        let html = '';
        for (const p of pendientes) {
            const minutos = Math.floor((new Date() - new Date(p.fecha)) / 60000);
            let clase = '';
            let tiempo = minutos < 1 ? 'Ahora' : `${minutos} min`;
            if (minutos >= 10) { clase = 'critico'; tiempo = `🔴 ${minutos} min`; }
            else if (minutos >= 5) { clase = 'alerta'; tiempo = `🟡 ${minutos} min`; }
            
            html += `
                <div class="pedido ${clase}">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="font-mono text-cyan-400">#${p.id}</span>
                            <span class="text-white/60 text-sm ml-2">${tiempo}</span>
                        </div>
                        <button class="btn-ok" onclick="atenderPedido('${p.id}')">✓ OK</button>
                    </div>
                    <div class="font-bold mt-1">${p.cliente || 'Sin nombre'}</div>
                    <div class="text-white/50 text-sm">${(p.direccion || '').substring(0, 60)}</div>
                    <div class="flex justify-between mt-2">
                        <span class="text-emerald-400 font-bold">${parseFloat(p.total || 0).toFixed(2)}€</span>
                        <span class="text-cyan-400 text-sm">🏪 ${p.restaurante_nombre || 'Restaurante'}</span>
                    </div>
                </div>
            `;
        }
        container.innerHTML = html;
    }
    
    // Configurar sonido repetitivo CADA 5 SEGUNDOS solo si hay pedidos
    function iniciarAlertaContinua() {
        setInterval(() => {
            if (!window.pedidosGlobal) return;
            
            const pendientes = window.pedidosGlobal.filter(p => {
                const estado = (p.estado || '').toUpperCase();
                const noEntregado = estado !== 'ENTREGADO' && estado !== 'FINALIZADO' && estado !== 'RECHAZADO';
                const noOculto = !idsOcultos.has(p.id);
                return noEntregado && noOculto;
            });
            
            // SOLO suena si HAY pedidos pendientes
            if (pendientes.length > 0 && sonidoActivo) {
                if (audio) {
                    audio.currentTime = 0;
                    audio.play().catch(e => console.log(""));
                }
                console.log("🔔 Alerta - Pedidos pendientes:", pendientes.length);
            }
        }, 5000);
    }
    
    // Cargar datos
    function initFirebase() {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        db.ref('pedidos').once('value', (snap) => {
            const pedidos = [];
            snap.forEach((child) => {
                const p = child.val();
                p.id = child.key;
                pedidos.push(p);
            });
            window.pedidosGlobal = pedidos;
            mostrarPedidos();
        });
        
        db.ref('pedidos').on('child_added', (snap) => {
            const nuevo = snap.val();
            nuevo.id = snap.key;
            if (window.pedidosGlobal) {
                window.pedidosGlobal.unshift(nuevo);
                mostrarPedidos();
                console.log("🆕 Nuevo pedido - Reproduciendo sonido");
                if (audio) {
                    audio.currentTime = 0;
                    audio.play().catch(e => console.log(""));
                }
            }
        });
    }
    
    // Inicio
    function init() {
        audio = document.getElementById('sonido');
        if (audio) audio.volume = 0.8;
        
        cargarOcultos();
        initFirebase();
        iniciarAlertaContinua();
        
        document.getElementById('btnReset').onclick = resetTodo;
        
        // Activar audio con primer clic
        document.body.addEventListener('click', () => {
            if (audio) audio.play().catch(e => {});
        }, { once: true });
    }
    
    window.atenderPedido = atenderPedido;
    init();
</script>
</body>
</html>
