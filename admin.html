<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aguadulce Express - Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #020617; font-family: 'Plus Jakarta Sans', sans-serif; color: white; padding: 16px; }
        .pedido-card { background: #0f172a; border-radius: 20px; padding: 16px; margin-bottom: 12px; border-left: 4px solid #1e293b; }
        .pedido-card.alerta { border-left-color: #f59e0b; background: rgba(245,158,11,0.05); }
        .pedido-card.critico { border-left-color: #ef4444; background: rgba(239,68,68,0.1); }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: bold; }
        .badge-recibido { background: rgba(6,182,212,0.2); color: #06b6d4; }
        .badge-proceso { background: rgba(245,158,11,0.2); color: #f59e0b; }
        .badge-reparto { background: rgba(79,70,229,0.2); color: #818cf8; }
        .badge-entregado { background: rgba(34,197,94,0.2); color: #22c55e; }
        .btn-actualizar { background: #06b6d4; color: #020617; padding: 8px 16px; border-radius: 30px; font-weight: bold; border: none; cursor: pointer; margin-bottom: 16px; }
        .btn-actualizar:active { transform: scale(0.96); }
        .fecha-info { background: #1e293b; border-radius: 20px; padding: 6px 12px; font-size: 11px; display: inline-block; margin-bottom: 16px; }
        audio { display: none; }
        .titulo { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
        .refresco { font-size: 10px; color: #64748b; margin-bottom: 16px; }
    </style>
</head>
<body>

<div id="loader" class="flex justify-center items-center h-screen">
    <div class="text-center">
        <div class="w-10 h-10 border-4 border-cyan-400/20 border-t-cyan-400 rounded-full animate-spin mx-auto mb-4"></div>
        <p>Cargando monitor...</p>
    </div>
</div>

<div id="app" style="display: none;">
    
    <!-- Cabecera simple -->
    <div class="flex justify-between items-center mb-4">
        <div>
            <div class="titulo">📊 MONITOR DE PEDIDOS</div>
            <div class="refresco">Actualización automática cada 10 segundos</div>
        </div>
        <button id="btnActualizar" class="btn-actualizar">🔄 ACTUALIZAR</button>
    </div>

    <!-- Fecha -->
    <div class="text-center mb-4">
        <span class="fecha-info" id="fechaActual"></span>
    </div>

    <!-- Lista de pedidos (solo lo que importa) -->
    <div id="listaPedidos"></div>

</div>

<audio id="audio-alerta" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
</audio>

<script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbzYFDShcrP7I4FKhiH3q5UcEInpSKJstrumJ9ddI4Tj9S31ZUgwiuie81fGFmCJ6ob2/exec";
    
    let sonidoActivado = localStorage.getItem('monitor_sonido') === 'true';
    let audioElement = null;
    let ultimoConteo = 0;

    function initAudio() {
        audioElement = document.getElementById('audio-alerta');
        if (audioElement) audioElement.volume = 0.8;
    }

    function playSound() {
        if (audioElement && sonidoActivado) {
            audioElement.currentTime = 0;
            audioElement.play().catch(e => console.log('Audio necesita interacción'));
        }
    }

    function activarSonido() {
        sonidoActivado = !sonidoActivado;
        localStorage.setItem('monitor_sonido', sonidoActivado);
        const btn = document.getElementById('btnActivarSonido');
        if (sonidoActivado) {
            btn.innerHTML = '🔊 SONIDO ON';
            btn.style.background = '#22c55e';
            playSound();
        } else {
            btn.innerHTML = '🔇 SONIDO OFF';
            btn.style.background = '#334155';
        }
    }

    function getTextoEstado(estado) {
        const e = (estado || '').toUpperCase();
        if (e === 'RECIBIDO' || e === 'NUEVO') return '📥 SIN CONFIRMAR';
        if (e === 'EN PROCESO') return '🍳 EN COCINA';
        if (e === 'LISTO') return '✅ LISTO';
        if (e === 'RECOGIDO' || e === 'EN CAMINO') return '🛵 EN REPARTO';
        if (e === 'LLEGÓ') return '📍 EN EL CLIENTE';
        if (e === 'ENTREGADO' || e === 'FINALIZADO') return '🎉 ENTREGADO';
        return estado || '📥 RECIBIDO';
    }

    function getColorEstado(estado) {
        const e = (estado || '').toUpperCase();
        if (e === 'RECIBIDO' || e === 'NUEVO') return 'badge-recibido';
        if (e === 'EN PROCESO' || e === 'LISTO') return 'badge-proceso';
        if (e === 'RECOGIDO' || e === 'EN CAMINO' || e === 'LLEGÓ') return 'badge-reparto';
        if (e === 'ENTREGADO' || e === 'FINALIZADO') return 'badge-entregado';
        return 'badge-recibido';
    }

    function getTiempoTranscurrido(fechaRaw) {
        if (!fechaRaw) return { texto: '---', minutos: 999 };
        let fechaDate;
        if (fechaRaw instanceof Date) {
            fechaDate = fechaRaw;
        } else if (typeof fechaRaw === 'string') {
            const partes = fechaRaw.split(' ');
            const fechaParte = partes[0];
            let horaParte = partes[1] || '00:00:00';
            if (fechaParte.includes('/')) {
                const [dia, mes, anio] = fechaParte.split('/');
                const [hora, min, seg] = horaParte.split(':');
                fechaDate = new Date(anio, mes-1, dia, hora, min, seg);
            } else if (fechaParte.includes('-')) {
                const [anio, mes, dia] = fechaParte.split('-');
                const [hora, min, seg] = horaParte.split(':');
                fechaDate = new Date(anio, mes-1, dia, hora, min, seg);
            } else {
                fechaDate = new Date(fechaRaw);
            }
        }
        if (!fechaDate || isNaN(fechaDate.getTime())) return { texto: '---', minutos: 999 };
        
        const ahora = new Date();
        const diffMs = ahora - fechaDate;
        const diffMin = Math.floor(diffMs / 60000);
        if (diffMin < 1) return { texto: 'Ahora mismo', minutos: 0 };
        if (diffMin < 60) return { texto: `Hace ${diffMin} min`, minutos: diffMin };
        const horas = Math.floor(diffMin / 60);
        const mins = diffMin % 60;
        return { texto: `Hace ${horas}h ${mins}min`, minutos: diffMin };
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    async function cargarPedidos() {
        try {
            const response = await fetch(`${scriptURL}?action=cargarTodo&t=${Date.now()}`);
            const data = await response.json();
            
            const restaurantes = data.RESTAURANTES || [];
            const pedidosRaw = data.PEDIDOS || [];
            
            // Filtrar solo pedidos RECIENTES (últimas 24 horas) y en estado activo
            const ahora = new Date();
            const hace24h = new Date(ahora.getTime() - 24 * 60 * 60 * 1000);
            
            const pedidosFiltrados = pedidosRaw.filter(p => {
                const estado = (p.ESTADO || '').toUpperCase();
                // Mostrar pedidos que NO estén entregados ni rechazados
                const esActivo = estado !== 'ENTREGADO' && estado !== 'FINALIZADO' && estado !== 'RECHAZADO' && estado !== 'CANCELADO';
                if (!esActivo) return false;
                
                // Filtrar por fecha (solo últimos 7 días para no saturar)
                let fechaPedido = null;
                if (p.FECHA) {
                    if (p.FECHA instanceof Date) {
                        fechaPedido = p.FECHA;
                    } else {
                        const partes = p.FECHA.split(' ');
                        const fechaParte = partes[0];
                        if (fechaParte.includes('/')) {
                            const [dia, mes, anio] = fechaParte.split('/');
                            fechaPedido = new Date(anio, mes-1, dia);
                        }
                    }
                }
                if (fechaPedido) {
                    const diffDias = (ahora - fechaPedido) / (1000 * 60 * 60 * 24);
                    if (diffDias > 7) return false;
                }
                return true;
            });
            
            // Ordenar por fecha (más reciente primero)
            pedidosFiltrados.sort((a, b) => {
                const fechaA = a.FECHA ? new Date(a.FECHA) : 0;
                const fechaB = b.FECHA ? new Date(b.FECHA) : 0;
                return fechaB - fechaA;
            });
            
            // Mapear con datos del restaurante
            const pedidos = pedidosFiltrados.map(p => {
                const restaurante = restaurantes.find(r => String(r.ID_RESTAURANTE).trim() === String(p.ID_RESTAURANTE).trim());
                return {
                    id: p.ID_PEDIDO,
                    cliente: p.CLIENTE,
                    direccion: p.DIRECCION,
                    total: parseFloat(p.TOTAL) || 0,
                    estado: p.ESTADO,
                    restaurante_nombre: restaurante ? (restaurante.NOMBRE_RESTAURANTE || restaurante.NOMBRE) : 'Restaurante',
                    fechaRaw: p.FECHA,
                    detalle: p.PEDIDO_DETALLE
                };
            });
            
            // Sonido si hay nuevos pedidos pendientes
            const pendientes = pedidos.filter(p => {
                const e = (p.estado || '').toUpperCase();
                return e === 'RECIBIDO' || e === 'NUEVO';
            }).length;
            
            if (pendientes > ultimoConteo && pendientes > 0) {
                playSound();
                if (Notification.permission === 'granted') {
                    new Notification('📦 Nuevo pedido sin confirmar', {
                        body: `Hay ${pendientes} pedido(s) pendientes de aceptar.`,
                        icon: 'https://i.postimg.cc/mZwjLXxw/Logo-Aguadulce-Express.jpg'
                    });
                }
            }
            ultimoConteo = pendientes;
            
            renderizarPedidos(pedidos);
            
        } catch (error) {
            console.error("Error cargando pedidos:", error);
            document.getElementById('listaPedidos').innerHTML = '<div class="text-center py-10 text-red-400">❌ Error al cargar datos</div>';
        }
    }

    function renderizarPedidos(pedidos) {
        const contenedor = document.getElementById('listaPedidos');
        
        if (!pedidos.length) {
            contenedor.innerHTML = '<div class="text-center py-10 text-white/30">📭 No hay pedidos activos</div>';
            return;
        }
        
        let html = '';
        for (let p of pedidos) {
            const estado = (p.estado || 'RECIBIDO').toUpperCase();
            const tiempo = getTiempoTranscurrido(p.fechaRaw);
            let alertaClass = '';
            if (estado === 'RECIBIDO' || estado === 'NUEVO') {
                if (tiempo.minutos >= 10) {
                    alertaClass = 'critico';
                } else if (tiempo.minutos >= 5) {
                    alertaClass = 'alerta';
                }
            }
            
            // Dirección truncada
            const direccionShort = p.direccion ? p.direccion.substring(0, 40) : 'Sin dirección';
            
            html += `
                <div class="pedido-card ${alertaClass}">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <span class="font-mono font-bold text-cyan-400">#${escapeHtml(p.id)}</span>
                            <span class="badge ${getColorEstado(p.estado)} ml-2">${getTextoEstado(p.estado)}</span>
                            ${alertaClass === 'critico' ? '<span class="text-red-400 text-[10px] ml-2">🔴 URGENTE</span>' : (alertaClass === 'alerta' ? '<span class="text-yellow-400 text-[10px] ml-2">🟡 ATENCIÓN</span>' : '')}
                        </div>
                        <div class="text-right">
                            <div class="text-emerald-400 font-bold">${p.total.toFixed(2)}€</div>
                            <div class="text-white/40 text-[10px]">${tiempo.texto}</div>
                        </div>
                    </div>
                    
                    <div class="text-white text-sm font-bold">${escapeHtml(p.cliente || 'Cliente sin nombre')}</div>
                    <div class="text-white/40 text-[11px] mt-1">📍 ${escapeHtml(direccionShort)}</div>
                    
                    <div class="mt-3 pt-2 border-t border-white/10 flex justify-between items-center">
                        <div class="text-[12px]">
                            <span class="text-cyan-400 font-bold">🏪 ${escapeHtml(p.restaurante_nombre)}</span>
                        </div>
                        <div class="text-[10px] text-white/30">
                            ⏰ ${p.fechaRaw ? new Date(p.fechaRaw).toLocaleTimeString() : '---'}
                        </div>
                    </div>
                </div>
            `;
        }
        contenedor.innerHTML = html;
    }

    function actualizar() {
        document.getElementById('listaPedidos').innerHTML = '<div class="text-center py-10 text-white/30">🔄 Actualizando...</div>';
        cargarPedidos();
    }

    function iniciarMonitor() {
        initAudio();
        
        // Fecha actual
        const hoy = new Date();
        document.getElementById('fechaActual').innerHTML = hoy.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
        
        // Añadir botón de sonido
        const btnSonido = document.createElement('button');
        btnSonido.id = 'btnActivarSonido';
        btnSonido.className = 'btn-actualizar ml-2';
        btnSonido.style.background = sonidoActivado ? '#22c55e' : '#334155';
        btnSonido.innerHTML = sonidoActivado ? '🔊 SONIDO ON' : '🔇 SONIDO OFF';
        btnSonido.onclick = activarSonido;
        document.querySelector('.flex.justify-between.items-center.mb-4').appendChild(btnSonido);
        
        document.getElementById('btnActualizar').onclick = () => actualizar();
        
        cargarPedidos();
        document.getElementById('loader').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        
        // Actualizar cada 10 segundos
        setInterval(cargarPedidos, 10000);
        
        if ('Notification' in window && Notification.permission !== 'granted' && Notification.permission !== 'denied') {
            Notification.requestPermission();
        }
    }

    iniciarMonitor();
</script>
</body>
</html>
