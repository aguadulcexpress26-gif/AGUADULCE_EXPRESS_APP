<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin conexión - Aguadulce Express</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, sans-serif;
        }
        .offline-card {
            background: white;
            border-radius: 2rem;
            padding: 3rem;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .icon {
            font-size: 5rem;
            margin-bottom: 1.5rem;
        }
        .retry-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 9999px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1.5rem;
        }
        .retry-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="icon">🌐</div>
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Sin Conexión</h1>
        <p class="text-gray-600 mb-4">
            Parece que no tienes conexión a internet.<br>
            Vuelve a intentarlo cuando tengas señal.
        </p>
        <p class="text-sm text-gray-400 mb-4">
            Los pedidos pendientes se sincronizarán automáticamente.
        </p>
        <button onclick="location.reload()" class="retry-btn">
            🔄 Reintentar
        </button>
        <div class="mt-4 text-sm text-gray-400">
            Aguadulce Express v2.0
        </div>
    </div>
</body>
</html>
