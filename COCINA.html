<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <style>
        body { 
            background-color: #020617; 
            color: #f8fafc; 
            font-family: system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
        
        .btn-touch-active:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .pedido-nuevo-anim {
            animation: pulseBorder 2s infinite alternate;
        }
        @keyframes pulseBorder {
            0% { border-color: rgba(6, 182, 212, 0.2); box-shadow: 0 0 0 0 rgba(6, 182, 212, 0.1); }
            100% { border-color: rgba(6, 182, 212, 0.7); box-shadow: 0 0 12px 2px rgba(6, 182, 212, 0.2); }
        }

        #sideHistorial {
            position: fixed;
            top: 0;
            right: -350px;
            width: 320px;
            height: 100vh;
            background: #090d16;
            border-left: 1px solid #1e293b;
            transition: right 0.3s ease;
            z-index: 50;
        }
        #sideHistorial.open {
            right: 0;
        }
        @media print {
            body * { visibility: hidden; }
            #ticketImprimir, #ticketImprimir * { visibility: visible; }
            #ticketImprimir { position: absolute; left: 0; top: 0; width: 100%; color: black !important; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center">

        <main class="flex-1 p-4 md:p-6 max-w-[1600px] w-full mx-auto flex flex-col gap-4">

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 md:gap-6 flex-1">

                    <div class="flex justify-between items-center mb-3 border-b border-slate-800/60 pb-2">

                            🍳 En Cocción / Proceso
                        </h3>
                        <span class="bg-amber-500/10 text-amber-400 text-xs px-2 py-0.5 rounded-full font-black border border-amber-500/20" id="badgeProceso">0</span>
                    </div>
                    <div id="listaProceso" class="space-y-3 flex-1 overflow-y-auto max-h-[65vh] pr-1"></div>
                </div>

                <div class="bg-slate-900/30 rounded-xl p-4 border border-slate-800/80 flex flex-col min-h-[400px]">

                            📦 Listos para Retirar
                        </h3>

    <div id="ticketImprimir" class="hidden"></div>

    <script>
        // CONFIGURACIÓN DE TU BASE DE DATOS ORIGINAL
        const firebaseConfig = {
    // ... tus otras propiedades (apiKey, authDomain, etc) ...
    databaseURL: "https://aguadulce-notificaciones-default-rtdb.firebaseio.com/"
};
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzYFDShcrP7I4FKhiH3q5UcEInpSKJstrumJ9ddI4Tj9S31ZUgwiuie81fGFmCJ6ob2/exec'; 
        
        // Variables globales del sistema original
        let MI_ID_REST = "";
        let pedidosActivos = [];
        let historialHoy = [];
        let aceptados = new Set();
        let tiendaAbierta = false;
        let dbRefPedidos = null;
        let sonidosPendientes = {};

        // --- SISTEMA INYECTOR DE CONTROL DE ACCESO ---
       function verificarSesionCocina() {
    MI_ID_REST = localStorage.getItem('AE_REST_ID');
    const nombreComercial = localStorage.getItem('AE_REST_NOMBRE');
    
    const vistaLogin = document.getElementById('vistaLogin');
    const vistaPanelCocina = document.getElementById('vistaPanelCocina');
    const txtNombreRestaurante = document.getElementById('nombreRestaurante');

    if (!MI_ID_REST) {
        document.body.className = "min-h-screen flex flex-col justify-center items-center bg-slate-950 text-slate-100";
        if(vistaLogin) vistaLogin.classList.remove('hidden');
        if(vistaPanelCocina) vistaPanelCocina.classList.add('hidden');
    } else {
        document.body.className = "min-h-screen flex flex-col bg-slate-950 text-slate-100";
        if(vistaLogin) vistaLogin.classList.add('hidden');
        if(vistaPanelCocina) vistaPanelCocina.classList.remove('hidden');
        
        // Muestra el nombre comercial si existe, si no, el ID de respaldo
        if(txtNombreRestaurante) txtNombreRestaurante.innerText = nombreComercial || MI_ID_REST;
        
        cargar();
    }
}
       // --- NUEVO INICIO DE SESIÓN ADAPTADO A TU GOOGLE SHEETS ---
function iniciarSesionTerminal(event) {
    event.preventDefault();
    // Captura el código tal cual (Ej: CHUN20)
    const codigoInput = document.getElementById('inputIdRestaurante').value.trim().toUpperCase();
    
    // Nombres comerciales únicamente para el banner visual
    const nombresComerciales = {
        "DELI10": "DELICIOUS FOOD",
        "CHUN20": "CHUHAN PIZZERIA KEBAB",
        "HARO30": "HARO RESTAURANTE",
        "SUCU40": "LA SUCURSAL",
        "PERU50": "RINCONCITO PERUANO",
        "LIMA60": "LIMAÑA BAR Y TAPAS",
        "PECA70": "PECADOS"
    };

    if (nombresComerciales[codigoInput]) {
        // Guardamos el código original (CHUN20) porque tu script de Sheets lo usa en la URL
        localStorage.setItem('AE_REST_ID', codigoInput);
        localStorage.setItem('AE_REST_NOMBRE', nombresComerciales[codigoInput]);
        
        Swal.fire({
            title: '🔓 Conectando Terminal',
            text: `Abriendo cocina de: ${nombresComerciales[codigoInput]}`,
            icon: 'success',
            background: '#020617',
            color: 'white',
            timer: 1500,
            showConfirmButton: false
        });
        verificarSesionCocina();
    } else {
        Swal.fire({
            title: '❌ Código No Válido',
            text: 'El código introducido no corresponde a ningún terminal.',
            icon: 'error',
            background: '#020617',
            color: 'white'
        });
    }
}

function verificarSesionCocina() {
    MI_ID_REST = localStorage.getItem('AE_REST_ID');
    const nombreComercial = localStorage.getItem('AE_REST_NOMBRE');
    
    const vistaLogin = document.getElementById('vistaLogin');
    const vistaPanelCocina = document.getElementById('vistaPanelCocina');
    const txtNombreRestaurante = document.getElementById('nombreRestaurante');

    if (!MI_ID_REST) {
        document.body.className = "min-h-screen flex flex-col justify-center items-center bg-slate-950 text-slate-100";
        if(vistaLogin) vistaLogin.classList.remove('hidden');
        if(vistaPanelCocina) vistaPanelCocina.classList.add('hidden');
    } else {
        document.body.className = "min-h-screen flex flex-col bg-slate-950 text-slate-100";
        if(vistaLogin) vistaLogin.classList.add('hidden');
        if(vistaPanelCocina) vistaPanelCocina.classList.remove('hidden');
        
        if(txtNombreRestaurante) txtNombreRestaurante.innerText = nombreComercial || MI_ID_REST;
        
        // Ejecuta tu carga remota por Google Sheets
        cargar();
    }
}

// --- TU FUNCIÓN CARGAR() ORIGINAL CON LOS CORRECCIONES DE ELEMENTOS DE LA NUEVA INTERFAZ ---
async function cargar() {
    if (!MI_ID_REST) return;
    try {
        // Hace la petición exacta a tu Google Script pasando el código (ej: CHUN20)
        const r = await fetch(`${scriptURL}?action=leerPanelCompleto&idRest=${MI_ID_REST}&t=${Date.now()}`);
        const data = await r.json();
        
        // 1. Sincronizar el estado del interruptor (Abierto / Cerrado)
        if(data.tienda) {
            tiendaAbierta = (data.tienda.estado || "").toLowerCase() === "abierto";
            const toggle = document.getElementById('tiendaToggle');
            const txtE = document.getElementById('txtEstadoTienda');
            
            if(toggle) toggle.checked = tiendaAbierta;
            if(txtE) {
                txtE.innerText = tiendaAbierta ? "ABIERTO" : "CERRADO";
                txtE.className = tiendaAbierta ? "text-xs font-bold text-emerald-400 uppercase tracking-wider" : "text-xs font-bold text-slate-400 uppercase tracking-wider";
            }
        }
        
        // 2. Sincronizar las estadísticas de dinero del día y de la semana
        let stats = data.stats || {};
        const txtDiario = document.getElementById('txtDineroDiario');
        const txtSemanal = document.getElementById('txtDineroSemanal');
        if(txtDiario) txtDiario.innerHTML = (parseFloat(stats.diaria) || 0).toFixed(2) + "€";
        if(txtSemanal) txtSemanal.innerHTML = (parseFloat(stats.semanal) || 0).toFixed(2) + "€";
        
        // 3. Filtrar pedidos activos: tu cocina SOLO ve RECIBIDO o EN PROCESO
        const todosPedidos = data.pedidos || [];
        const pedidosFiltrados = todosPedidos.filter(p => {
            const estado = (p.ESTADO || '').toUpperCase();
            return estado === 'RECIBIDO' || estado === 'EN PROCESO';
        });
        
        // 4. Gestión y control de alertas sonoras para pedidos nuevos
        const nuevosIds = pedidosFiltrados.map(p => p.ID_PEDIDO);
        const realmenteNuevos = nuevosIds.filter(id => !aceptados.has(id));
        const sonidosActivados = (typeof sonidosActivos !== 'undefined') ? sonidosActivos : true;
        
        if (realmenteNuevos.length > 0 && aceptados.size > 0 && sonidosActivados) {
            if (typeof playSound === "function") playSound();
            realmenteNuevos.forEach(id => {
                if (typeof playSoundNuevoPedidoRepetitivo === "function") playSoundNuevoPedidoRepetitivo(id);
                else if (typeof reproducirSonidoRepetitivo === "function") reproducirSonidoRepetitivo(id);
            });
            if (typeof mostrarMensaje === "function") mostrarMensaje('📦 Nuevo Pedido', 'Tienes un nuevo pedido en la lista', 'info');
            if (navigator.vibrate) navigator.vibrate(500);
        }
        
        // Ordenar los pedidos cronológicamente por fecha
        pedidosActivos = pedidosFiltrados.sort((a,b)=>new Date(a.FECHA)-new Date(b.FECHA));
        
        // 5. Historial: Filtrar los pedidos que ya terminaron su ciclo en cocina
        const pedidosHistorial = todosPedidos.filter(p => {
            const estado = (p.ESTADO || '').toUpperCase();
            return estado === 'LISTO' || estado === 'ENTREGADO' || estado === 'CANCELADO' || estado === 'RECHAZADO' || estado === 'EN CAMINO' || estado === 'LLEGÓ';
        });
        historialHoy = pedidosHistorial;
        
        // 6. Actualizar el contador numérico de pendientes en la cabecera
        ultimoConteo = pedidosActivos.filter(p=>!aceptados.has(p.ID_PEDIDO)).length;
        const cantPendientes = document.getElementById('cantPendientes');
        if(cantPendientes) cantPendientes.innerText = ultimoConteo;
        
        // 7. Limpiar intervalos de sonido de pedidos que ya se procesaron
        const listaIntervalos = (typeof intervalosSonido !== 'undefined') ? intervalosSonido : (typeof sonidosPendientes !== 'undefined' ? sonidosPendientes : {});
        Object.keys(listaIntervalos).forEach(id => {
            const sigueActivo = pedidosActivos.some(p => p.ID_PEDIDO === id && !aceptados.has(id));
            if (!sigueActivo) {
                if (typeof detenerSonidoRepetitivo === "function") detenerSonidoRepetitivo(id);
            }
        });
        
        // Dibujar las tarjetas en las nuevas columnas
        render();
    } catch(e) { 
        console.error("Error en consulta remota panel de cocina:", e); 
    }
}
        function cerrarSesionTerminal() {
            Swal.fire({
                title: '¿Cerrar sesión en esta terminal?',
                text: "Tendrás que introducir el ID del restaurante nuevamente para operar.",
                icon: 'warning',
                background: '#020617',
                color: 'white',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#1e293b',
                confirmButtonText: 'Sí, salir',
                cancelButtonText: 'Cancelar'
            }).then(result => {
                if (result.isConfirmed) {
                    if (dbRefPedidos) dbRefPedidos.off();
                    Object.keys(sonidosPendientes).forEach(id => detenerSonidoRepetitivo(id));
                    localStorage.removeItem('AE_REST_ID');
                    location.reload(); 
                }
            });
        }

        // --- TU FUNCIÓN CARGAR() ORIGINAL ---
        function cargar() {
            // Consulta de estado de la tienda a Google Sheets
            fetch(`${scriptURL}?action=obtenerEstadoTienda&idRest=${MI_ID_REST}&sheet=configuracion`)
                .then(res => res.json())
                .then(data => {
                    tiendaAbierta = (data.estado === "Abierto");
                    actualizarInterfazTienda();
                }).catch(e => console.error("Error tienda:", e));

            // Consulta de caja diaria y semanal desde Google Sheets
            fetch(`${scriptURL}?action=obtenerResumenCaja&idRest=${MI_ID_REST}`)
                .then(res => res.json())
                .then(data => {
                    if(document.getElementById('txtDineroDiario')) document.getElementById('txtDineroDiario').innerText = `${parseFloat(data.diario || 0).toFixed(2)}€`;
                    if(document.getElementById('txtDineroSemanal')) document.getElementById('txtDineroSemanal').innerText = `${parseFloat(data.semanal || 0).toFixed(2)}€`;
                }).catch(e => console.error("Error caja:", e));

            // Escucha en tiempo real de Firebase exacta a tu lógica funcional
            if(dbRefPedidos) dbRefPedidos.off();
            dbRefPedidos = database.ref('pedidos');
            dbRefPedidos.on('value', snapshot => {
                const datos = snapshot.val();
                pedidosActivos = [];
                historialHoy = [];
                
                if (datos) {
                    Object.keys(datos).forEach(key => {
                        let p = datos[key];
                        p.ID_PEDIDO = key;
                        
                        const restPedido = (p.RESTAURANTE || p.restaurante || '').toUpperCase();
                        if (restPedido === MI_ID_REST) {
                            const est = (p.estado || p.ESTADO || '').toLowerCase();
                            
                            if (est === 'pendiente' || est === 'en proceso' || est === 'listo') {
                                pedidosActivos.push(p);
                                if (est === 'pendiente' && !aceptados.has(key)) {
                                    reproducirSonidoRepetitivo(key);
                                }
                            } else {
                                historialHoy.push(p);
                            }
                        }
                    });
                }
                pedidosActivos.sort((a,b) => new Date(b.FECHA) - new Date(a.FECHA));
                render();
            });
        }

        // --- TUS BOTONES ORIGINALES (ACEPTAR, RECHAZAR, LISTO, TEMPORIZADORES, DETALLES) ---
        async function aceptarPedido(id, event) { 
            const btn = event.target;
            btn.disabled = true;
            detenerSonidoRepetitivo(id);
            aceptados.add(id); 
            
            let ahora = Date.now();
            let timestampFin = ahora + (20 * 60 * 1000); 
            try {
                await database.ref('pedidos/'+id).update({ 
                    estado: 'en proceso',
                    tiempo_elaboracion: 20,
                    timestamp_inicio: ahora,
                    timestamp_fin_elaboracion: timestampFin
                });
                await fetch(`${scriptURL}?action=actualizarEstado&idPedido=${id}&nuevoEstado=EN PROCESO`);
                let a = new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3'); a.play().catch(e=>{});
                render(); 
            } catch(err) {
                aceptados.delete(id);
                btn.disabled = false;
            }
        }
        
        async function asignarTiempo(id, min, event) {
            let ahora = Date.now();
            let timestampFin = ahora + (min * 60 * 1000);
            let horaStr = new Date(timestampFin).getHours().toString().padStart(2,'0') + ":" + new Date(timestampFin).getMinutes().toString().padStart(2,'0');
            try {
                await database.ref('pedidos/'+id).update({ 
                    tiempo_elaboracion: min,
                    timestamp_fin_elaboracion: timestampFin,
                    tiempoEstimado: min, 
                    horaSalida: horaStr
                });
                await fetch(`${scriptURL}?action=actualizarEstado&idPedido=${id}&nuevoEstado=EN PROCESO&tiempo=${min}`);
            } catch(e) { console.error(e); }
        }
        
        async function rechazarPedido(id, event) {
            detenerSonidoRepetitivo(id);
            const { value: motivo } = await Swal.fire({
                title: '❌ Rechazar Pedido',
                input: 'select',
                inputOptions: { 'No disponible': 'Plato no disponible', 'Ingredientes': 'Falta de stock', 'Capacidad': 'Cocina saturada' },
                inputPlaceholder: 'Selecciona motivo...',
                icon: 'warning',
                background: '#020617', color: 'white', showCancelButton: true
            });
            if (motivo) {
                try {
                    await fetch(`${scriptURL}?action=actualizarEstado&idPedido=${id}&nuevoEstado=RECHAZADO&tiempo=${encodeURIComponent(motivo)}`);
                    await database.ref('pedidos/'+id).update({ estado: 'rechazado' });
                } catch(e) { console.error(e); }
            }
        }

        async function ejecutarListo(id) {
            let timestampFin = Date.now();
            try {
                await database.ref('pedidos/'+id).update({ estado: 'listo', timestamp_fin_elaboracion: timestampFin });
                await fetch(`${scriptURL}?action=actualizarEstado&idPedido=${id}&nuevoEstado=LISTO`);
                let a = new Audio('https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3'); a.play().catch(e=>{});
                aceptados.delete(id);
                render();
            } catch(e) { console.error(e); }
        }

        // BOTÓN DETALLE CON IMPRESIÓN FÍSICA DE TICKET DE COCINA
        function verDetalles(id) { 
            let p = [...pedidosActivos, ...historialHoy].find(x => x.ID_PEDIDO == id); 
            if(p) {
                Swal.fire({
                    title: `Pedido #${p.ID_PEDIDO}`,
                    html: `<div style="text-align:left; font-size: 14px;">
                        <strong>👤 Cliente:</strong> ${p.CLIENTE}<br>
                        <strong>📍 Dirección:</strong> ${p.DIRECCION || 'Para Recoger'}<br><br>
                        <div style="background:rgba(255,255,255,0.03); padding:10px; border-radius:8px; font-family:monospace; color:#06b6d4; white-space:pre-wrap;">${p.PEDIDO_DETALLE || ''}</div>
                    </div>`,
                    background: '#020617', color: 'white',
                    showCancelButton: true,
                    confirmButtonText: 'Cerrar',
                    cancelButtonText: '🖨️ Imprimir Ticket',
                    cancelButtonColor: '#06b6d4'
                }).then((result) => {
                    if (result.dismiss === Swal.DismissReason.cancel) {
                        const tick = document.getElementById('ticketImprimir');
                        tick.innerHTML = `
                            <div style="font-family:monospace; font-size:12px; padding:10px; width:280px; color:black;">
                                <h2>AGUADULCE EXPRESS</h2>
                                <hr>
                                <strong>PEDIDO #${p.ID_PEDIDO}</strong><br>
                                <strong>CLIENTE:</strong> ${p.CLIENTE}<br>
                                <strong>DIRECCIÓN:</strong> ${p.DIRECCION || 'Para Recoger'}<br>
                                <hr>
                                ${p.PEDIDO_DETALLE ? p.PEDIDO_DETALLE.replace(/\n/g, '<br>') : ''}
                                <hr>
                                <strong>TOTAL: ${parseFloat(p.TOTAL).toFixed(2)}€</strong>
                            </div>`;
                        window.print();
                    }
                });
            }
        }

        // --- BOTÓN ABIERTO / CERRADO ---
        function confirmarToggleTienda() { 
            let nuevo = !tiendaAbierta ? "Abierto" : "Cerrado"; 
            Swal.fire({
                title: `¿Cambiar estado a ${nuevo.toUpperCase()}?`,
                background: '#020617', color: 'white', showCancelButton: true
            }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        await fetch(`${scriptURL}?action=toggleTienda&idRest=${MI_ID_REST}&sheet=configuracion&nuevoEstado=${nuevo}`); 
                        tiendaAbierta = !tiendaAbierta;
                        actualizarInterfazTienda();
                    } catch(e) { console.error(e); }
                } else {
                    document.getElementById('tiendaToggle').checked = tiendaAbierta;
                }
            });
        }

        function actualizarInterfazTienda() {
            const txt = document.getElementById('txtEstadoTienda');
            const toggle = document.getElementById('tiendaToggle');
            if(!txt || !toggle) return;
            toggle.checked = tiendaAbierta;
            txt.innerText = tiendaAbierta ? "ABIERTO" : "CERRADO";
            txt.className = tiendaAbierta ? "text-xs font-bold text-emerald-400 uppercase tracking-wider" : "text-xs font-bold text-slate-400 uppercase tracking-wider";
        }

        // --- RENDER DE COLUMNAS TÁCTILES ---
        function render() {
    const contNuevos = document.getElementById('listaNuevos');
    const contProceso = document.getElementById('listaProceso');
    const contListos = document.getElementById('listaListos');
    
    // Si no hay contenedores nuevos, intentamos buscar el contenedor viejo como respaldo
    if (!contNuevos) {
        let contViejo = document.getElementById('lista');
        if (contViejo && pedidosActivos.length === 0) {
            contViejo.innerHTML = '<div class="text-center py-20 opacity-20 font-bold tracking-widest text-sm">SIN PEDIDOS ACTIVOS</div>';
        }
        return;
    }

    if (pedidosActivos.length === 0) {
        const sinPedidosHTML = '<div class="text-center py-14 opacity-25 font-bold tracking-widest text-xs">SIN PEDIDOS ACTIVOS</div>';
        contNuevos.innerHTML = sinPedidosHTML;
        contProceso.innerHTML = sinPedidosHTML;
        contListos.innerHTML = sinPedidosHTML;
        actualizarBadges(0, 0, 0);
        return;
    }

    let htmlNuevos = '', htmlProceso = '', htmlListos = '';
    let cPend = 0, cProc = 0, cList = 0;

    pedidosActivos.forEach(p => {
        const estado = (p.ESTADO || '').toUpperCase();
        const esAceptadoInterno = aceptados.has(p.ID_PEDIDO);
        const esNuevo = !esAceptadoInterno && estado !== 'EN PROCESO';

        // Estructura de la tarjeta con tus clases Tailwind oscuras y datos nativos de tu Sheets
        let tarjetaHTML = `
        <div class="bg-slate-950 border ${esNuevo ? 'pedido-nuevo-anim border-cyan-500/30' : 'border-slate-800/80'} rounded-xl p-4 shadow-lg space-y-3 flex flex-col justify-between" data-id="${p.ID_PEDIDO}">
            <div>
                <div class="flex justify-between items-start">
                    <div>
                        <span class="text-[11px] text-cyan-400 font-bold font-mono">#${p.ID_PEDIDO}</span>
                        <h4 class="font-bold text-sm text-white/90 mt-0.5">${p.CLIENTE}</h4>
                        <span class="text-[11px] font-medium text-slate-500 block mt-0.5">⏱️ ${calcularTiempo(p.FECHA)}</span>
                    </div>
                    <span class="text-sm font-black text-emerald-400 bg-emerald-500/5 px-2 py-1 rounded-md border border-emerald-500/10">${parseFloat(p.TOTAL).toFixed(2)}€</span>
                </div>
                
                <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-800 mt-2.5">
                    <div class="text-xs font-semibold font-mono text-cyan-400/90 whitespace-pre-wrap leading-relaxed">${p.PEDIDO_DETALLE || 'Sin detalle'}</div>
                    ${p.NOTA ? `<div class="text-[11px] text-amber-400 mt-2 italic font-medium bg-amber-500/5 p-1.5 rounded border border-amber-500/10">💡 ${p.NOTA}</div>` : ''}
                </div>
            </div>`;

        // CLASIFICACIÓN EN LAS COLUMNAS UTILIZANDO TU LÓGICA ORIGINAL
        if (estado === 'EN PROCESO' || esAceptadoInterno) {
            cProc++;
            tarjetaHTML += `
                <div class="space-y-2.5 pt-1">
                    <div class="grid grid-cols-3 gap-1.5 text-[10px] font-bold">
                        <button onclick="asignarTiempo('${p.ID_PEDIDO}', 15)" class="btn-touch-active bg-slate-900 hover:bg-slate-800 text-slate-300 py-1.5 rounded border border-slate-800 cursor-pointer">15 MIN</button>
                        <button onclick="asignarTiempo('${p.ID_PEDIDO}', 30)" class="btn-touch-active bg-slate-900 hover:bg-slate-800 text-slate-300 py-1.5 rounded border border-slate-800 cursor-pointer">30 MIN</button>
                        <button onclick="asignarTiempo('${p.ID_PEDIDO}', 45)" class="btn-touch-active bg-slate-900 hover:bg-slate-800 text-slate-300 py-1.5 rounded border border-slate-800 cursor-pointer">45 MIN</button>
                    </div>
                    <div class="grid grid-cols-2 gap-2 pt-1">
                        <button onclick="verDetalles('${p.ID_PEDIDO}')" class="btn-touch-active text-[11px] font-bold bg-slate-800 text-slate-300 py-2 rounded-lg cursor-pointer">DETALLES</button>
                        <button onclick="confirmarListo('${p.ID_PEDIDO}')" class="btn-touch-active text-[11px] font-black bg-emerald-500 text-slate-950 py-2 rounded-lg cursor-pointer">🧑‍🍳 ¡LISTO!</button>
                    </div>
                </div></div>`;
            htmlProceso += tarjetaHTML;
        } else if (estado === 'LISTO') {
            cList++;
            tarjetaHTML += `
                <div class="pt-2">
                    <div class="text-center text-[10px] font-bold tracking-wider text-emerald-400 bg-emerald-500/10 p-2 rounded-lg border border-emerald-500/20 uppercase">🔔 Listo (Esperando Reparto)</div>
                    <button onclick="verDetalles('${p.ID_PEDIDO}')" class="btn-touch-active w-full text-[11px] font-bold bg-slate-800 text-slate-300 py-2 rounded-lg mt-2 cursor-pointer">VER TICKET</button>
                </div></div>`;
            htmlListos += tarjetaHTML;
        } else {
            cPend++;
            tarjetaHTML += `
                <div class="flex flex-col gap-2 pt-2">
                    <button onclick="aceptarPedido('${p.ID_PEDIDO}')" class="btn-touch-active w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black tracking-wider text-xs p-3 rounded-xl uppercase cursor-pointer">
                        ${esAceptadoInterno ? '✓ ACEPTADO' : 'ACEPTAR PEDIDO'}
                    </button>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="verDetalles('${p.ID_PEDIDO}')" class="btn-touch-active text-[11px] font-bold bg-slate-900 border border-slate-800 text-slate-400 py-2 rounded-lg cursor-pointer">DETALLES</button>
                        <button onclick="rechazarPedido('${p.ID_PEDIDO}')" class="btn-touch-active text-[11px] font-bold bg-red-950/20 border border-red-900/30 text-red-400 py-2 rounded-lg cursor-pointer">RECHAZAR</button>
                    </div>
                </div></div>`;
            htmlNuevos += tarjetaHTML;
        }
    });

    // Inyectar en los listados del diseño táctil
    contNuevos.innerHTML = htmlNuevos || '<div class="text-center py-10 opacity-25 text-xs font-semibold">Cola limpia</div>';
    contProceso.innerHTML = htmlProceso || '<div class="text-center py-10 opacity-25 text-xs font-semibold">Fuegos vacíos</div>';
    contListos.innerHTML = htmlListos || '<div class="text-center py-10 opacity-25 text-xs font-semibold">Nada para retirar</div>';
    
    actualizarBadges(cPend, cProc, cList);
}

// Función auxiliar indispensable para refrescar los contadores numéricos superiores
function actualizarBadges(nuevos, proceso, listos) {
    if(document.getElementById('badgeNuevos')) document.getElementById('badgeNuevos').innerText = nuevos;
    if(document.getElementById('badgeProceso')) document.getElementById('badgeProceso').innerText = proceso;
    if(document.getElementById('badgeListos')) document.getElementById('badgeListos').innerText = listos;
    if(document.getElementById('cantPendientes')) document.getElementById('cantPendientes').innerText = nuevos;
    if(document.getElementById('cantProceso')) document.getElementById('cantProceso').innerText = proceso;
}

        function actualizarBadges(nuevos, proceso, listos) {
            document.getElementById('badgeNuevos').innerText = nuevos;
            document.getElementById('badgeProceso').innerText = proceso;
            document.getElementById('badgeListos').innerText = listos;
            document.getElementById('cantPendientes').innerText = nuevos;
            document.getElementById('cantProceso').innerText = proceso;
        }

        // --- MANIPULADORES COMPLEMENTARIOS ---
        function calcularTiempo(fechaStr) {
            if(!fechaStr) return "---";
            let diff = Math.floor((new Date() - new Date(fechaStr)) / 60000);
            if(diff < 1) return "Ahora";
            return `Hace ${diff} min`;
        }
        function actualizarContadores() {
            document.querySelectorAll('.tiempo-contador').forEach(el => {
                const target = parseInt(el.getAttribute('data-time'));
                if (!target) return;
                const diff = target - Date.now();
                if (diff <= 0) {
                    el.innerHTML = "🔔 ¡AVISAR / LISTO!";
                    el.className = "tiempo-contador text-center font-mono font-bold text-xs py-1.5 rounded-lg bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
                } else {
                    el.innerHTML = `⏳ Quedan: ${Math.floor(diff / 60000)}m ${Math.floor((diff % 60000) / 1000)}s`;
                }
            });
        }
        function reproducirSonidoRepetitivo(id) {
            if (sonidosPendientes[id]) return;
            let audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
            audio.loop = true; audio.play().then(() => { sonidosPendientes[id] = audio; }).catch(e=>{});
        }
        function detenerSonidoRepetitivo(id) {
            if (sonidosPendientes[id]) { sonidosPendientes[id].pause(); delete sonidosPendientes[id]; }
        }
        function abrirHistorial() {
            let lista = document.getElementById('listaHistorial');
            if(historialHoy.length === 0) {
                lista.innerHTML = '<div class="text-center opacity-50 text-xs py-10">Ningún despacho hoy</div>';
            } else {
                lista.innerHTML = historialHoy.map(p => `
                    <div class="bg-slate-900 border border-slate-800 p-3 rounded-lg cursor-pointer" onclick="verDetalles('${p.ID_PEDIDO}')">
                        <div class="flex justify-between items-center">
                            <span class="text-cyan-400 font-bold font-mono text-xs">#${p.ID_PEDIDO}</span>
                            <span class="font-bold text-emerald-400 text-xs">${parseFloat(p.TOTAL).toFixed(2)}€</span>
                        </div>
                        <div class="text-xs mt-1 text-white/70 font-semibold">${p.CLIENTE}</div>
                    </div>`).join('');
            }
            document.getElementById('sideHistorial').classList.add('open');
        }
        function cerrarHistorial() { document.getElementById('sideHistorial').classList.remove('open'); }
        
        // Reloj e intervalos
        setInterval(() => { const h = new Date(); if(document.getElementById('relojDigital')) document.getElementById('relojDigital').innerText = h.toLocaleTimeString('es-ES'); }, 1000);
        setInterval(actualizarContadores, 1000);

        // Control de arranque protegido
        window.onload = verificarSesionCocina;
    </script>
</body>
</html>
